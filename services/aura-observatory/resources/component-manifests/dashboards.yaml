component:
  id: aura.observatory.dashboards
  version: 1.0.0
  owner: observatory.operations
  category: observability
input:
  schema: observatory-v1
  replayable: true
output:
  schema: observatory-v1
dependencies: [postgresql, oidc_provider, session_store]
metrics: [observatory_dashboard_operation_count]
metric_semantics:
  observatory_dashboard_operation_count: Bounded owner dashboard operations by outcome.
metric_definitions:
  observatory_dashboard_operation_count:
    type: counter
    labels: [operation, outcome]
    trace: dashboard_operation
    correlation: service
    export: prometheus
cardinality:
  bounded_labels: [operation, outcome]
  prohibited: [prompt, response, content, filename, arguments, result, endpoint, token, credential, owner_identity]
evaluators: [operations_owner_authorization, dashboard_bounds, browser_persistence_isolation]
capture_policy: metadata_only
retention: manual_owner_delete_only
