component:
  id: aura.observatory.run_evidence_ingestion
  version: 1.0.0
  owner: observatory.run_evidence
  category: ingestion
input:
  schema: run-evidence-v1
  replayable: true
output:
  schema: observatory-run-evidence-manifest-v1
dependencies:
  - run_evidence_nats
  - postgresql
  - garage
metrics:
  - run_evidence_ingest_outcome_count
  - run_evidence_ingest_validation_latency_ms
  - run_evidence_ingest_dedupe_latency_ms
evaluators:
  - run_evidence_ingestion_integrity
  - run_evidence_schema_compatibility
  - run_evidence_failure_isolation
  - run_inspection_projection_truth
  - observatory_run_evidence_privacy
capture_policy: metadata_only
retention: manual_owner_delete_only
cardinality:
  metric_attributes: [operation, outcome, status, dependency, errorClass]
  trace_only: [runId]
  prohibited: [eventId, evidenceId, digest, object_key, prompt, response, content, arguments, result, token, credential, password, owner_identity]
export:
  sink: postgresql_and_private_garage
  cadence: per_evidence_item
