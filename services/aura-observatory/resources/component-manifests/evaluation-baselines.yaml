component:
  id: aura.observatory.evaluation_baselines
  version: 1.0.0
  owner: observatory.evaluation_baselines
  category: evaluation
input:
  schema: observatory-v1
  replayable: true
output:
  schema: evaluation-baseline-v1
  replayable: true
dependencies:
  - postgresql
  - clickhouse
metrics:
  - observatory_evaluation_baseline_operation_count
metric_semantics:
  observatory_evaluation_baseline_operation_count: Bounded candidate creation and explicit owner promotion outcomes.
metric_definitions:
  - name: observatory_evaluation_baseline_operation_count
    type: counter
    unit: operations
    labels: [operation, outcome]
    dependencies: [postgresql]
    trace: evaluation_baseline
    correlation: service
    export: prometheus
evaluators:
  - evaluation_baseline_manual_promotion
  - evaluation_baseline_immutability
  - evaluation_baseline_idempotency
capture_policy: metadata_only
retention: manual_owner_delete_only
cardinality:
  metric_attributes: [operation, outcome]
  prohibited: [prompt, response, content, filename, arguments, result, endpoint, token, credential, owner_identity]
