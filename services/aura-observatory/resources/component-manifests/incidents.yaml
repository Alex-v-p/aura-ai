component:
  id: aura.observatory.incidents
  version: 1.0.0
  owner: observatory.operations
  category: observability
input:
  schema: observatory-v1
  replayable: true
output:
  schema: observatory-v1
dependencies: [postgresql, oidc_provider, session_store]
metrics: [observatory_incident_transition_count]
metric_semantics:
  observatory_incident_transition_count: Validated incident state transitions.
metric_definitions:
  observatory_incident_transition_count:
    type: counter
    labels: [state, outcome]
    trace: incident_transition
    correlation: service
    export: prometheus
cardinality:
  bounded_labels: [state, outcome]
  prohibited: [prompt, response, content, filename, arguments, result, endpoint, token, credential, owner_identity]
evaluators: [incident_state_machine, operations_owner_authorization, operations_browser_accessibility]
capture_policy: metadata_only
retention: manual_owner_delete_only
