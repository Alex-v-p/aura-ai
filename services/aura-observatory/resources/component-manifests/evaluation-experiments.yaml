component:
  id: aura.observatory.evaluation_experiments
  version: 1.0.0
  owner: observatory.evaluation_experiments
  category: evaluation
input:
  schema: observatory-v1
  replayable: true
output:
  schema: evaluation-experiment-v1
  replayable: true
dependencies:
  - postgresql
  - evaluation_definition_state
metrics:
  - observatory_evaluation_experiment_operation_count
metric_semantics:
  observatory_evaluation_experiment_operation_count: Bounded immutable experiment create and replay outcomes.
metric_definitions:
  - name: observatory_evaluation_experiment_operation_count
    type: counter
    unit: operations
    labels: [operation, outcome]
    dependencies: [postgresql]
    trace: evaluation_experiment
    correlation: service
    export: prometheus
evaluators:
  - evaluation_experiment_contract_compatibility
  - evaluation_experiment_authorization
  - evaluation_experiment_immutability
  - evaluation_experiment_cohort_bounds
  - evaluation_experiment_browser_accessibility
  - evaluation_experiment_browser_persistence_isolation
capture_policy: metadata_only
retention: manual_owner_delete_only
cardinality:
  metric_attributes: [operation, outcome]
  prohibited: [prompt, response, content, filename, arguments, result, endpoint, token, credential, owner_identity]
