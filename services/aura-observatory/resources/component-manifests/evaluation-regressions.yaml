component:
  id: aura.observatory.evaluation_regressions
  version: 1.0.0
  owner: observatory.evaluation_regressions
  category: evaluation
input:
  schema: observatory-v1
  replayable: true
output:
  schema: evaluation-regression-v1
  replayable: true
dependencies:
  - postgresql
  - clickhouse
metrics:
  - observatory_evaluation_regression_operation_count
  - observatory_evaluation_regression_duration_ms
  - observatory_evaluation_regression_outcome_count
  - observatory_evaluation_attribution_outcome_count
metric_semantics:
  observatory_evaluation_regression_operation_count: Bounded deterministic comparison operations.
  observatory_evaluation_regression_duration_ms: Duration of one bounded comparison.
  observatory_evaluation_regression_outcome_count: Deterministic regression decision outcomes.
  observatory_evaluation_attribution_outcome_count: Evidence-backed attribution availability outcomes.
metric_definitions:
  - name: observatory_evaluation_regression_operation_count
    type: counter
    unit: operations
    labels: [operation, outcome]
    dependencies: [postgresql, clickhouse]
    trace: evaluation_regression
    correlation: service
    export: prometheus
  - name: observatory_evaluation_regression_duration_ms
    type: histogram
    unit: milliseconds
    labels: []
    dependencies: [postgresql, clickhouse]
    trace: evaluation_regression
    correlation: service
    export: prometheus
  - name: observatory_evaluation_regression_outcome_count
    type: counter
    unit: decisions
    labels: [outcome]
    dependencies: [postgresql, clickhouse]
    trace: evaluation_regression
    correlation: service
    export: prometheus
  - name: observatory_evaluation_attribution_outcome_count
    type: counter
    unit: outcomes
    labels: [outcome]
    dependencies: [postgresql, clickhouse]
    trace: evaluation_attribution
    correlation: service
    export: prometheus
evaluators:
  - evaluation_regression_determinism
  - evaluation_regression_cohort_bounds
  - evaluation_regression_attribution_evidence
  - evaluation_experiment_browser_persistence_isolation
capture_policy: metadata_only
retention: manual_owner_delete_only
cardinality:
  metric_attributes: [operation, outcome]
  prohibited: [prompt, response, content, filename, arguments, result, endpoint, token, credential, owner_identity]
