component:
  id: aura.observatory.evaluation_deletion
  version: 1.0.0
  owner: observatory.evaluation_deletion
  category: retention
input:
  schema: evaluation-deletion-command-v1
  replayable: true
output:
  schema: evaluation-deletion-audit-v1
dependencies:
  - postgresql
  - clickhouse
  - garage
metrics:
  - observatory_evaluation_deletion_action_count
  - observatory_evaluation_deletion_deleted_count
  - observatory_evaluation_deletion_failure_count
  - observatory_evaluation_deletion_duration_ms
metric_semantics:
  observatory_evaluation_deletion_action_count: Bounded count of manual deletion actions by fixed phase and outcome.
  observatory_evaluation_deletion_deleted_count: Count of artifact metadata records successfully removed.
  observatory_evaluation_deletion_failure_count: Count of recoverable deletion failures by finite failure class.
  observatory_evaluation_deletion_duration_ms: Bounded duration of one deletion execution.
metric_definitions:
  - name: observatory_evaluation_deletion_action_count
    type: counter
    unit: actions
    labels: [selector, phase, outcome]
    dependencies: [postgresql, clickhouse, garage]
    trace: evaluation_deletion
    correlation: command_id
    export: prometheus
  - name: observatory_evaluation_deletion_deleted_count
    type: counter
    unit: artifacts
    labels: [selector]
    dependencies: [postgresql, clickhouse, garage]
    trace: evaluation_deletion
    correlation: command_id
    export: prometheus
  - name: observatory_evaluation_deletion_failure_count
    type: counter
    unit: failures
    labels: [phase, failure_code]
    dependencies: [postgresql, clickhouse, garage]
    trace: evaluation_deletion
    correlation: command_id
    export: prometheus
  - name: observatory_evaluation_deletion_duration_ms
    type: histogram
    unit: milliseconds
    labels: [selector, outcome]
    dependencies: [postgresql, clickhouse, garage]
    trace: evaluation_deletion
    correlation: command_id
    export: prometheus
evaluators:
  - evaluation_deletion_idempotency
  - evaluation_deletion_recovery
  - evaluation_deletion_preservation
capture_policy: metadata_only
retention: manual_owner_delete_only
cardinality:
  metric_attributes: [selector, phase, outcome, failure_code]
  trace_only: [command_id]
  prohibited: [prompt, response, content, filename, arguments, result, endpoint, token, bearer, credential, password, private, hash, digest, access_token, refresh_token, id_token, authorization, nonce, code, state, issuer, subject, object_key, owner_identity]
export:
  sink: postgresql_clickhouse_private_garage
  cadence: per_action
