component:
  id: aura.observatory.evaluation_definitions
  version: 1.0.0
  owner: observatory.evaluation_definitions
  category: evaluation
input:
  schema: evaluation-v1
  replayable: true
output:
  schema: evaluation-definition-metadata-v1
  replayable: true
dependencies:
  - postgresql
  - evaluation_definition_state
  - private_garage_artifact_reference
metrics:
  - observatory_evaluation_definition_operation_count
  - observatory_evaluation_definition_validation_count
metric_semantics:
  observatory_evaluation_definition_operation_count: Bounded immutable definition create, idempotent reuse, and conflict outcomes by fixed resource type.
  observatory_evaluation_definition_validation_count: Bounded definition admission validation outcomes by fixed failure class.
metric_definitions:
  - name: observatory_evaluation_definition_operation_count
    type: counter
    unit: operations
    labels: [resource_type, outcome]
    dependencies: [postgresql, evaluation_definition_state]
    trace: evaluation_definition
    correlation: service
    export: prometheus
  - name: observatory_evaluation_definition_validation_count
    type: counter
    unit: validations
    labels: [resource_type, outcome, failure_code]
    dependencies: [postgresql, evaluation_definition_state]
    trace: evaluation_definition
    correlation: service
    export: prometheus
evaluators:
  - evaluation_definition_contract_validation
  - evaluation_definition_immutability
  - evaluation_suite_binding_validation
capture_policy: metadata_only
retention: manual_owner_delete_only
cardinality:
  metric_attributes: [resource_type, outcome, failure_code]
  prohibited: [prompt, response, content, filename, arguments, result, endpoint, token, credential, owner_identity, object_key, url, uri]
