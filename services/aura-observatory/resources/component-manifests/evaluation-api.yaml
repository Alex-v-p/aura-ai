component:
  id: aura.observatory.evaluation_api
  version: 1.0.0
  owner: observatory.evaluation_api
  category: observability
input:
  schema: observatory-v1
  replayable: true
output:
  schema: observatory-v1
  replayable: true
dependencies:
  - postgresql
  - clickhouse
  - garage
  - oidc_provider
  - login_state_store
  - session_store
metrics:
  - observatory_evaluation_api_operation_count
  - observatory_evaluation_operation_duration_ms
  - observatory_evaluation_live_event_count
  - observatory_evaluation_live_replay_lag_seconds
metric_semantics:
  observatory_evaluation_api_operation_count: Bounded owner evaluation API operations by fixed operation and outcome.
  observatory_evaluation_operation_duration_ms: Bounded evaluation API operation duration histogram by fixed operation.
  observatory_evaluation_live_event_count: Bounded evaluation live-event publication, replay, and heartbeat outcomes.
  observatory_evaluation_live_replay_lag_seconds: Age of a persisted evaluation event when replayed to an owner session.
metric_definitions:
  - name: observatory_evaluation_api_operation_count
    type: counter
    unit: operations
    labels: [operation, outcome]
    dependencies: [postgresql, clickhouse, oidc_provider, session_store]
    trace: evaluation_api_request
    correlation: request_id
    export: prometheus
  - name: observatory_evaluation_operation_duration_ms
    type: histogram
    unit: milliseconds
    labels: [operation]
    dependencies: [postgresql, clickhouse, oidc_provider, session_store]
    trace: evaluation_api_request
    correlation: request_id
    export: prometheus
  - name: observatory_evaluation_live_event_count
    type: counter
    unit: events
    labels: [operation, outcome]
    dependencies: [postgresql, session_store]
    trace: evaluation_live_stream
    correlation: request_id
    export: prometheus
  - name: observatory_evaluation_live_replay_lag_seconds
    type: histogram
    unit: seconds
    labels: []
    dependencies: [postgresql]
    trace: evaluation_live_stream
    correlation: request_id
    export: prometheus
evaluators:
  - evaluation_api_authorization
  - evaluation_api_csrf_idempotency
  - evaluation_api_closed_dto_boundary
  - evaluation_api_bounded_query
  - evaluation_sse_metadata_isolation
  - evaluation_sse_last_event_id_catch_up
  - observatory_public_evaluation_admission
capture_policy: metadata_only
retention: manual_owner_delete_only
cardinality:
  metric_attributes: [operation, outcome]
  trace_only: [trace_id, span_id, parent_span_id, dependency, error_code]
  prohibited: [prompt, response, content, filename, arguments, result, endpoint, token, credential, owner_identity, bearer, password, object_key, url, uri]
export:
  sink: otlp_http_metrics_and_traces
  cadence: periodic_and_shutdown
