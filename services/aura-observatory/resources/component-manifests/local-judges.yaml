component:
  id: aura.observatory.local_judges
  version: 1.0.0
  owner: observatory.local_judges
  category: evaluation
input:
  schema: authorized-judge-request-v1
  replayable: false
output:
  schema: evaluation-score-metadata-v1
  replayable: true
dependencies:
  - postgresql
  - clickhouse
  - private_garage_judge_read
  - local_ollama
metrics:
  - observatory_local_judge_request_count
  - observatory_local_judge_duration_ms
  - observatory_local_judge_outcome_count
  - observatory_local_judge_provider_failure_count
metric_semantics:
  observatory_local_judge_request_count: Bounded local judge requests by finite outcome.
  observatory_local_judge_duration_ms: Bounded end-to-end local judge duration.
  observatory_local_judge_outcome_count: Finite advisory judge outcomes.
  observatory_local_judge_provider_failure_count: Finite provider failure classifications.
metric_definitions:
  - name: observatory_local_judge_request_count
    type: counter
    unit: requests
    labels: [outcome]
    dependencies: [local_ollama]
    trace: local_judge
    correlation: service
    export: prometheus
  - name: observatory_local_judge_duration_ms
    type: histogram
    unit: milliseconds
    labels: []
    dependencies: [local_ollama, private_garage_judge_read]
    trace: local_judge
    correlation: service
    export: prometheus
  - name: observatory_local_judge_outcome_count
    type: counter
    unit: outcomes
    labels: [outcome]
    dependencies: [clickhouse]
    trace: local_judge
    correlation: service
    export: prometheus
  - name: observatory_local_judge_provider_failure_count
    type: counter
    unit: failures
    labels: [failure_code]
    dependencies: [local_ollama]
    trace: local_judge
    correlation: service
    export: prometheus
evaluators:
  - local_judge_contract_validation
  - local_judge_repeatability
  - local_judge_content_isolation
  - local_judge_model_digest_verification
  - local_judge_provider_boundary
capture_policy: authorized_evaluation_content
retention: manual_owner_delete_only
cardinality:
  metric_attributes: [outcome, failure_code]
  trace_only: [trace_id, span_id, case_id, request_id]
  prohibited: [prompt, response, rubric, rationale, content, filename, arguments, result, endpoint, token, credential, owner_identity]
export:
  sink: clickhouse
  cadence: per_score
