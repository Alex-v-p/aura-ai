component:
  id: aura.interaction.agent_configuration
  version: 1.1.0
  owner: interaction.agents
  category: configuration
input:
  schema: agent-configuration-command-v2
  replayable: false
  replay_reason: Configuration mutations are durable side effects without a replay hook.
output:
  schema: agent-configuration-result-v2
  capture:
    content: none
    metadata: allowlisted
dependencies:
  - configuration_store
  - postgresql
metrics:
  - memory_policy_configuration_duration_ms
  - memory_policy_configuration_outcome
  - operation_duration_ms
  - configuration_outcome
metric_semantics:
  memory_policy_configuration_duration_ms: Owner-scoped immutable memory policy configuration duration.
  memory_policy_configuration_outcome: Metadata-only memory policy configuration outcome.
  operation_duration_ms: Owner configuration operation duration at the application boundary.
  configuration_outcome: Identifier-only mutation outcome.
capture_policy: metadata_only
cardinality:
  metric_attributes: [outcome, error_class, dependency]
  trace_only: [trace_id, span_id, parent_span_id, agent_revision_id, agent_revision_number, profile_id, persona_revision_id, persona_revision_number, conversation_id, configuration_outcome, configuration_source, configuration_reason]
  prohibited: [prompt, response, payload, purpose, instructions, description, endpoint, token, credential]
retention:
  process_buffer: bounded
  overflow: drop_oldest_and_count
  export_failure: retry_three_times_then_drop_and_count
export:
  sink: structured_container_log
  cadence: periodic_and_shutdown
  health_counters: [dropped, rejected, export_failures, abandoned_batches]
