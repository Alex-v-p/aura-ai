component:
  id: aura.research.browser_fetch@1
  version: 1.0.0
  owner: research.providers
  category: provider
input:
  schema: research-provider.v1.browser-fetch-request
  replayable: false
  replay_reason: Browser state, targets, and hostile page content are never captured.
output:
  schema: research-provider.v1.fetch-result
  capture:
    content: none
    metadata: allowlisted
dependencies: [browser_fetcher_port, url_policy, content_policy]
span:
  operation: research.fetch_browser
  dependency: browser_fetcher_port
  capture: metadata_only
metrics: [research_browser_fetch_outcome_count, research_browser_fetch_latency_ms, research_browser_fetch_limit_rejection_count]
metric_definitions:
  - name: research_browser_fetch_outcome_count
    type: counter
    unit: count
    labels: [operation, outcome, error_class, dependency, provider, degradation]
    dependencies: [browser_fetcher_port]
    export: structured_container_log_and_otlp
  - name: research_browser_fetch_latency_ms
    type: histogram
    unit: milliseconds
    labels: [operation, outcome, error_class, dependency, provider, degradation]
    dependencies: [browser_fetcher_port]
    export: structured_container_log_and_otlp
  - name: research_browser_fetch_limit_rejection_count
    type: counter
    unit: count
    labels: [operation, outcome, error_class, dependency, provider, degradation]
    dependencies: [browser_fetcher_port]
    export: structured_container_log_and_otlp
metric_semantics:
  research_browser_fetch_outcome_count: terminal outcome count
  research_browser_fetch_latency_ms: provider call duration in milliseconds
  research_browser_fetch_limit_rejection_count: hard-limit rejection count
evaluators: [research_destination_policy@1, research_prompt_injection_resistance@1, research_failure_isolation@1, research_privacy@1]
capture_policy: metadata_only
cardinality:
  metric_attributes: [operation, outcome, error_class, dependency, provider, degradation]
  trace_only: [trace_id, span_id, parent_span_id]
  prohibited: [url, domain, content, excerpt, title, cookie, storage, owner, credential, signature, payload, exception, request_id, provider_request_id]
replay: synthetic_fixture_only
retention:
  process_buffer: bounded
  overflow: drop_oldest_and_count
  export_failure: retry_three_times_then_drop_and_count
export:
  sinks: [structured_container_log, otlp]
  cadence: periodic_and_shutdown
  health_counters: [dropped, rejected, export_failures, abandoned_batches]
