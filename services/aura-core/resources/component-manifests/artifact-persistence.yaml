component:
  id: aura.artifacts.persistence@1
  version: 1.0.0
  owner: artifacts.generated
  category: persistence
input:
  schema: ArtifactRevisionWriteInputV1
  replayable: true
  replay_reason: Deterministic identifier and digest metadata only; generated artifact bytes are never captured.
output:
  schema: ArtifactRevisionWriteResultV1
  replayable: true
  capture:
    content: none
    metadata: allowlisted
boundaries:
  accepts: [ArtifactRevisionWriteInputV1]
  emits: [ArtifactRevisionWriteResultV1]
  excludes: [owner_identity, title, content, text, digest, filename, object_key, task_id, run_id, conversation_id, workspace_id, prompt, response, payload, endpoint, token, credential]
dependencies: [core_postgresql, garage_port, transactional_outbox]
span: artifact.revision_write
outcomes: [success, rejected, timeout, failed, unknown]
errors: [validation_failed, conflict, storage_unavailable, delivery_failed, settlement_unknown, timeout]
metrics: [artifact_write_outcome_count, artifact_write_latency_ms]
metric_definitions:
  - name: artifact_write_outcome_count
    type: counter
    unit: count
    labels: [operation, outcome, error_class, dependency]
    dependencies: [core_postgresql, garage_port, transactional_outbox]
    trace: artifact.revision_write
    correlation: admitted_trace_context
    export: structured_container_log
  - name: artifact_write_latency_ms
    type: histogram
    unit: milliseconds
    labels: [operation, outcome, error_class, dependency]
    dependencies: [core_postgresql, garage_port, transactional_outbox]
    trace: artifact.revision_write
    correlation: admitted_trace_context
    export: structured_container_log
metric_semantics:
  artifact_write_outcome_count: Metadata-only bounded write, replay, conflict, and delivery outcome count.
  artifact_write_latency_ms: Active admission, persistence, and lifecycle-delivery duration in milliseconds.
evaluators: [generated_artifact_integrity@1, generated_artifact_authorization@1, generated_artifact_deletion_truth@1, generated_artifact_privacy@1]
cardinality:
  metric_attributes: [operation, outcome, error_class, dependency]
  trace_only: [trace_id, span_id, parent_span_id, link_span_ids]
  prohibited: [artifact_id, revision_id, event_id, correlation_id, causation_id, owner, owner_identity, subject, title, content, text, digest, filename, object_key, task_id, run_id, conversation_id, workspace_id, prompt, response, payload, endpoint, token, credential, exception, exception_text]
capture_policy: metadata_only
privacy:
  capture: metadata_only
  content: forbidden
  owner_identity: forbidden
  credentials: forbidden
replay:
  mode: deterministic
  input: identifier_version_digest_only
  clock: injected
  random: prohibited
retention:
  process_buffer: bounded
  overflow: drop_oldest_and_count
  export_failure: retry_three_times_then_drop_and_count
export:
  sink: structured_container_log
  cadence: periodic_and_shutdown
  health_counters: [dropped, rejected, export_failures, abandoned_batches]
