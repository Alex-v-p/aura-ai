component:
  id: aura.automation.briefing_persistence
  version: 1.0.0
  owner: automation.briefings
  category: persistence
input:
  schema: aura-briefing-result-v1
  replayable: true
  replay_reason: Terminal run metadata and result lineage are durable and replayable without exposing result content to telemetry.
output:
  schema: aura-briefing-events-v1
  additional_schemas:
    - contracts/events/automation/v1/briefing-events.schema.json
  capture:
    content: none
    metadata: allowlisted
dependencies:
  - postgresql
  - transactional_outbox
  - aura.execution.run_coordinator
metrics:
  - briefing_result_persistence_duration_ms
  - briefing_outcome_count
metric_semantics:
  briefing_result_persistence_duration_ms: Active duration of terminal occurrence and result lineage persistence.
  briefing_outcome_count: Count of completed, partial, failed, canceled, unknown, or conflict settlements.
capture_policy: metadata_only
evaluators:
  - briefing.result-persistence.v1
cardinality:
  metric_attributes: [operation, outcome, error_class, dependency, status]
  trace_only: [trace_id, span_id, parent_span_id, run_id, schedule_id, occurrence_id, result_id, command_id, correlation_id, causation_id, event_type, event_status, event_version]
  prohibited: [content, prompt, response, payload, token, credential, owner_identity, owner_subject, source_value, raw_error]
retention:
  process_buffer: bounded
  overflow: drop_oldest_and_count
  export_failure: retry_three_times_then_drop_and_count
export:
  sink: structured_container_log
  cadence: periodic_and_shutdown
  health_counters: [dropped, rejected, export_failures, abandoned_batches]
