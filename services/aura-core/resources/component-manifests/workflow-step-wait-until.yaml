component:
  id: aura.automation.workflow_step.wait_until
  version: 1.0.0
  owner: automation.workflows
  category: state_machine
input:
  schema: aura-workflow-wait-step-v1
  replayable: true
  replay_reason: Persisted wait state and bounded clock reconciliation make due resumption replayable.
output:
  schema: aura-workflow-lifecycle-events-v1
  capture: {content: none, metadata: allowlisted}
dependencies: [postgresql, transactional_outbox]
metrics: [workflow_wait_command_duration_ms, workflow_wait_lag_ms]
metric_semantics:
  workflow_wait_command_duration_ms: Bounded workflow wait admission and due-resume command latency in milliseconds.
  workflow_wait_lag_ms: Bounded lag between a persisted wait due instant and durable resumption.
capture_policy: metadata_only
evaluators: [workflow.wait-step.v1]
cardinality:
  metric_attributes: [operation, outcome, error_class, dependency]
  trace_only: [trace_id, span_id, parent_span_id, workflow_id, revision_id, instance_id, step_execution_id, result_version]
  prohibited: [content, prompt, response, instructions, mappings, input, output, result, payload, due_at, timezone, owner_identity, owner_subject, endpoint, url, token, credential, executor_state]
retention: {process_buffer: bounded, overflow: drop_oldest_and_count, export_failure: retry_three_times_then_drop_and_count}
export: {sink: structured_container_log, cadence: periodic_and_shutdown, health_counters: [dropped, rejected, export_failures, abandoned_batches]}
