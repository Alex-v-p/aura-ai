component:
  id: aura.interaction.conversation_persistence
  version: 1.6.0
  owner: aura-core
  category: persistence
input:
  schema: core-conversation-command-v2
  replayable: false
  replay_reason: Commands mutate Core-owned durable state.
output:
  schema: core-conversation-record-v2
  capture:
    content: none
    metadata: allowlisted
dependencies:
  - postgresql
  - conversation_store
metrics:
  - checkpoint_persisted
  - conversation_list_duration_ms
  - conversation_metadata_mutation_duration_ms
  - conversation_filter_outcome
  - conversation_archive_outcome
  - model_selection_persisted
  - persistence_duration_ms
  - title_persistence_duration_ms
  - errors
metric_semantics:
  checkpoint_persisted: Partial assistant output committed before a stream event is published.
  conversation_list_duration_ms: Owner-scoped metadata listing duration; transcript content and search terms are excluded.
  conversation_metadata_mutation_duration_ms: Owner-scoped rename/archive/restore persistence duration; failed requests use unknown archive state.
  conversation_filter_outcome: Count of metadata-filtered listing outcomes by bounded outcome and archive state.
  conversation_archive_outcome: Count of archive/restore outcomes by bounded outcome and resulting archive state; failed mutations use unknown.
  model_selection_persisted: Model and immutable policy references committed successfully.
  persistence_duration_ms: Component-local persistence boundary duration from a parented span.
  title_persistence_duration_ms: Conditional derived-title persistence duration without a configuration-version update.
capture_policy: metadata_only
cardinality:
  metric_attributes: [provider, error_class, dependency, outcome, archive_state]
  trace_only: [trace_id, span_id, parent_span_id, run_id, conversation_id, model_id, agent_revision_id, model_policy_revision_id, title_input_size, title_output_size, result_count]
  prohibited: [prompt, response, payload, endpoint, token, credential]
retention:
  process_buffer: bounded
  overflow: drop_oldest_and_count
  export_failure: retry_three_times_then_drop_and_count
export:
  sink: structured_container_log
  cadence: periodic_and_shutdown
  health_counters: [dropped, rejected, export_failures, abandoned_batches]
