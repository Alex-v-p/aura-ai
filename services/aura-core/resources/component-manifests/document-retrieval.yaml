component:
  id: aura.knowledge.document_retrieval
  version: 1.1.0
  owner: knowledge.documents
  category: retrieval
input:
  schema: document-search-v1
  schemas:
    document.search: document-search-v1
    document.preview: document-preview-request-v1
  replayable: false
output:
  schema: document-search-result-v1
  schemas:
    document.search: document-search-result-v1
    document.preview: document-preview-v1
  capture:
    content: none
    metadata: allowlisted
operations:
  - id: document.search
    input_schema: document-search-v1
    output_schema: document-search-result-v1
  - id: document.preview
    input_schema: document-preview-request-v1
    output_schema: document-preview-v1
dependencies: [postgresql, embedding_provider]
metrics: [document_retrieval_duration_ms, document_retrieval_outcome, document_retrieval_candidate_count]
evaluators: [document_retrieval_relevance, document_owner_isolation, document_preview_boundedness]
capture_policy: metadata_only
cardinality:
  metric_attributes: [outcome, error_class, dependency]
  trace_only: [trace_id, span_id, document_id, evidence_id]
  prohibited: [content, excerpt, filename, owner, credential, vector]
