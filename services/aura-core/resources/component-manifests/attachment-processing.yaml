component:
  id: aura.artifacts.attachment_processing
  version: 1.0.0
  owner: artifacts.attachments
  category: worker
input:
  schema: image-attachment-processing-v1
  replayable: false
  replay_reason: Image bytes and metadata are private and are not captured.
output:
  schema: image-attachment-ready-v1
  capture:
    content: none
    metadata: allowlisted
dependencies:
  - object_storage
  - image_decoder
metrics: [attachment_processing_outcome]
evaluators: [attachment_capture_redaction]
metric_semantics:
  attachment_processing_outcome: Metadata-only derivative processing outcome.
capture_policy: metadata_only
cardinality:
  metric_attributes: [outcome, error_class, dependency]
  trace_only: [trace_id, span_id, parent_span_id, attachment_id]
  prohibited: [bytes, filename, exif, prompt, payload, content, endpoint, credential]
retention:
  process_buffer: bounded
  overflow: drop_oldest_and_count
  export_failure: retry_three_times_then_drop_and_count
export:
  sink: structured_container_log
  cadence: periodic_and_shutdown
  health_counters: [dropped, rejected, export_failures, abandoned_batches]
