component:
  id: aura.automation.briefing_scheduler
  version: 1.0.0
  owner: automation.briefings
  category: scheduler
input:
  schema: aura-briefing-schedule-scan-v1
  replayable: true
  replay_reason: Durable schedule state and a synthetic clock make due claims deterministic after polling restarts.
output:
  schema: aura-briefing-events-v1
  additional_schemas:
    - contracts/events/automation/v1/briefing-events.schema.json
  capture:
    content: none
    metadata: allowlisted
dependencies:
  - postgresql
  - transactional_outbox
metrics:
  - briefing_schedule_lag_ms
  - briefing_schedule_claim_duration_ms
  - briefing_outcome_count
  - consumer_received
  - consumer_acknowledged
  - consumer_nacked
  - consumer_rejected
  - consumer_redelivered
  - outbox_duplicates
  - errors
metric_semantics:
  briefing_schedule_lag_ms: Bounded lag from a due local instant to durable admission or skip settlement.
  briefing_schedule_claim_duration_ms: Active duration of one bounded due-occurrence claim transaction.
  briefing_outcome_count: Count of a bounded scheduler admission or skip outcome.
capture_policy: metadata_only
evaluators:
  - briefing.schedule-admission.v1
cardinality:
  metric_attributes: [operation, outcome, error_class, dependency, status]
  trace_only: [trace_id, span_id, parent_span_id, schedule_id, occurrence_id, command_id, correlation_id, causation_id, event_type, event_status, event_version]
  prohibited: [content, prompt, response, payload, token, credential, owner_identity, owner_subject, timezone, due_at, calendar_identifier, document_identifier]
retention:
  process_buffer: bounded
  overflow: drop_oldest_and_count
  export_failure: retry_three_times_then_drop_and_count
export:
  sink: structured_container_log
  cadence: periodic_and_shutdown
  health_counters: [dropped, rejected, export_failures, abandoned_batches]
