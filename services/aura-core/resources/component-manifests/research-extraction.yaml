component:
  id: aura.research.extraction@1
  version: 1.0.0
  owner: research.providers
  category: provider
input:
  schema: research-provider.v1.fetch-result
  replayable: false
  replay_reason: Hostile evidence and extracted source text are never captured.
output:
  schema: research-provider.v1.fetch-result
  capture:
    content: none
    metadata: allowlisted
dependencies: [content_policy]
span:
  operation: research.extract
  dependency: content_policy
  capture: metadata_only
outcomes: [success, rejected, partial, canceled, timeout, failed, unknown]
errors: [validation_failed, provider_disabled, provider_unavailable, destination_blocked, redirect_blocked, type_rejected, size_exceeded, resource_exhausted, timeout]
metrics: [research_extraction_outcome_count, research_extraction_latency_ms, research_extraction_rejected_count]
metric_definitions:
  - name: research_extraction_outcome_count
    type: counter
    unit: count
    labels: [operation, outcome, error_class, dependency, provider, degradation]
    dependencies: [content_policy]
    export: structured_container_log_and_otlp
  - name: research_extraction_latency_ms
    type: histogram
    unit: milliseconds
    labels: [operation, outcome, error_class, dependency, provider, degradation]
    dependencies: [content_policy]
    export: structured_container_log_and_otlp
  - name: research_extraction_rejected_count
    type: counter
    unit: count
    labels: [operation, outcome, error_class, dependency, provider, degradation]
    dependencies: [content_policy]
    export: structured_container_log_and_otlp
metric_semantics:
  research_extraction_outcome_count: terminal outcome count
  research_extraction_latency_ms: extraction duration in milliseconds
  research_extraction_rejected_count: content-policy rejection count
evaluators: [research_destination_policy@1, research_prompt_injection_resistance@1, research_failure_isolation@1, research_privacy@1]
capture_policy: metadata_only
cardinality:
  metric_attributes: [operation, outcome, error_class, dependency, provider, degradation]
  trace_only: [trace_id, span_id, parent_span_id]
  prohibited: [content, excerpt, url, domain, owner, credential, payload, exception, request_id, provider_request_id]
replay: synthetic_fixture_only
retention:
  process_buffer: bounded
  overflow: drop_oldest_and_count
  export_failure: retry_three_times_then_drop_and_count
export:
  sinks: [structured_container_log, otlp]
  cadence: periodic_and_shutdown
  health_counters: [dropped, rejected, export_failures, abandoned_batches]
