component:
  id: aura.automation.workflow_checkpoint
  version: 1.0.0
  owner: automation.workflows
  category: persistence
input:
  schema: aura-workflow-checkpoint-v1
  replayable: true
  replay_reason: Bounded checkpoint references are committed with workflow state and are idempotent by instance and ordinal.
output:
  schema: aura-workflow-lifecycle-events-v1
  capture: {content: none, metadata: allowlisted}
dependencies: [postgresql]
metrics: [workflow_checkpoint_persistence_duration_ms]
metric_semantics:
  workflow_checkpoint_persistence_duration_ms: Bounded workflow checkpoint persistence latency in milliseconds.
capture_policy: metadata_only
evaluators: [workflow.checkpoint.v1]
cardinality:
  metric_attributes: [operation, outcome, error_class, dependency]
  trace_only: [trace_id, span_id, parent_span_id, workflow_id, revision_id, instance_id, step_execution_id, checkpoint_id, result_version]
  prohibited: [content, prompt, response, instructions, mappings, input, output, result, payload, checkpoint_payload, owner_identity, owner_subject, endpoint, url, token, credential, executor_state]
retention: {process_buffer: bounded, overflow: drop_oldest_and_count, export_failure: retry_three_times_then_drop_and_count}
export: {sink: structured_container_log, cadence: periodic_and_shutdown, health_counters: [dropped, rejected, export_failures, abandoned_batches]}
