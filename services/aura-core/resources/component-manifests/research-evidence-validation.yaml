component:
  id: aura.research.evidence_validation@1
  version: 1.0.0
  owner: knowledge.research
  category: validation
input: {schema: EvidenceValidationInputV1, replayable: false, replay_reason: Fetched content is hostile and transient.}
output: {schema: EvidenceValidationResultV1, capture: {content: none, metadata: allowlisted}}
boundaries: {accepts: [EvidenceValidationInputV1], emits: [EvidenceValidationResultV1], excludes: [url, excerpt, content, owner_identity, task_id, source_id, payload, exception]}
dependencies: [url_policy, content_policy, evidence_repository]
span: {operation: research.evidence_validate, dependency: content_policy, capture: metadata_only}
outcomes: [success, rejected, timeout, failed, unknown]
errors: [validation_failed, destination_blocked, redirect_blocked, type_rejected, size_exceeded, prompt_injection_detected, timeout]
metrics: [research_evidence_validation_outcome_count, research_evidence_validation_latency_ms, research_evidence_rejected_count]
metric_definitions:
  - {name: research_evidence_validation_outcome_count, type: counter, unit: count, labels: [operation, outcome, status, error_class, dependency]}
  - {name: research_evidence_validation_latency_ms, type: histogram, unit: milliseconds, labels: [operation, outcome, status, error_class, dependency]}
  - {name: research_evidence_rejected_count, type: counter, unit: count, labels: [operation, outcome, status, error_class, dependency]}
metric_semantics: {research_evidence_validation_outcome_count: evidence validation outcomes, research_evidence_validation_latency_ms: evidence validation latency, research_evidence_rejected_count: evidence rejection count}
capture_policy: metadata_only
evaluators: [research_prompt_injection_resistance@1, research_privacy@1, research_failure_isolation@1]
cardinality: {metric_attributes: [operation, outcome, status, error_class, dependency], trace_only: [trace_id, span_id, parent_span_id, link_span_ids, run_id, conversation_id], prohibited: [url, excerpt, content, payload, owner_identity, task_id, research_id, source_id, exception]}
replay: synthetic_fixture_only
privacy: {capture: metadata_only, content: forbidden, owner_identity: forbidden, credentials: forbidden}
retention: {process_buffer: bounded, overflow: drop_oldest_and_count, export_failure: retry_three_times_then_drop_and_count}
export: {sinks: [structured_container_log, otlp], cadence: periodic_and_shutdown, health_counters: [dropped, rejected, export_failures, abandoned_batches]}
