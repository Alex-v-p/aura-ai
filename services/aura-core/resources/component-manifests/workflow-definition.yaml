component:
  id: aura.automation.workflow_definition
  version: 1.0.0
  owner: automation.workflows
  category: validation
input:
  schema: aura-workflow-definition-command-v1
  replayable: true
  replay_reason: Closed revisions and optimistic versions make validation and publication replayable by identifier.
output:
  schema: aura-workflow-lifecycle-events-v1
  capture: {content: none, metadata: allowlisted}
dependencies: [application_validation, postgresql]
metrics: [workflow_definition_validation_duration_ms]
metric_semantics:
  workflow_definition_validation_duration_ms: Bounded workflow definition validation and publication latency in milliseconds.
capture_policy: metadata_only
evaluators: [workflow.definition.v1]
cardinality:
  metric_attributes: [operation, outcome, error_class, dependency]
  trace_only: [trace_id, span_id, parent_span_id, workflow_id, revision_id, command_id, result_version]
  prohibited: [content, prompt, response, instructions, mappings, input, output, result, payload, owner_identity, owner_subject, endpoint, url, token, credential, executor_state]
retention: {process_buffer: bounded, overflow: drop_oldest_and_count, export_failure: retry_three_times_then_drop_and_count}
export: {sink: structured_container_log, cadence: periodic_and_shutdown, health_counters: [dropped, rejected, export_failures, abandoned_batches]}
