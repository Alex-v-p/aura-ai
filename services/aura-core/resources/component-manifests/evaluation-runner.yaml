    export: [structured_container_log, otlp]
  - name: evaluation_runner_lease_lost_count
    type: counter
    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [postgresql, application_validation]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_artifact_cleanup_failure_count
    type: counter
    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [evaluation_object_storage, object_storage]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_recovery_scan_failure_count
    type: counter
    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [postgresql, application_unknown]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_recovery_count
    type: counter
    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [postgresql, application_validation]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_publication_recovery_failure_count
    type: counter
    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [postgresql, evaluation_nats, nats_jetstream]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_terminal_accounting_failure_count
    type: counter
    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [postgresql, application_validation]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_nats_identity_conflict_count
    type: counter
    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [evaluation_nats, nats_jetstream]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
metric_units:
  evaluation_runner_queue_time_ms: milliseconds
  evaluation_runner_fixture_load_duration_ms: milliseconds
  evaluation_runner_execution_duration_ms: milliseconds
  evaluation_runner_outcome_count: count
  evaluation_runner_cancellation_count: count
  evaluation_runner_resource_limit_count: count
  evaluation_runner_reproducibility_completeness: ratio
  evaluation_runner_queue_accepted: count
  evaluation_runner_nats_fetch_failure_count: count
  evaluation_runner_nats_publish_failure_count: count
  evaluation_runner_nats_drain_failure_count: count
  evaluation_runner_nats_recovery_count: count
  evaluation_runner_nats_poison_count: count
  evaluation_runner_terminal_settlement_failure_count: count
  evaluation_runner_lease_renewal_failure_count: count
  evaluation_runner_lease_lost_count: count
  evaluation_runner_artifact_cleanup_failure_count: count
  evaluation_runner_recovery_scan_failure_count: count
  evaluation_runner_recovery_count: count
  evaluation_runner_publication_recovery_failure_count: count
  evaluation_runner_terminal_accounting_failure_count: count
  evaluation_runner_nats_identity_conflict_count: count
evaluators:
  - evaluation_runner_contract_validation
  - evaluation_runner_exact_component_version
  - evaluation_runner_idempotency
  - evaluation_runner_cancellation
  - evaluation_runner_resource_isolation
  - evaluation_runner_reproducibility
  - evaluation_runner_content_leakage
  - evaluation_runner_core_independence
capture_policy: metadata_only
cardinality:
  metric_attributes: [outcome, error_class, dependency]
  trace_only: [trace_id, span_id, parent_span_id, correlation_id, attempt_id]
  prohibited:
    - access_token
    - argument
    - arguments
    - arbitrary_attributes
    - attributes
    - authorization
    - bearer
    - bearer_token
    - content
    - credentials
    - digest
    - document_content
    - prompt
    - raw_content
    - raw_result
    - response
    - response_content
    - response_payload
    - payload
    - result
    - results
    - artifact_bytes
    - filename
    - object_key
    - owner
    - owner_identity
    - password
    - private
    - refresh_token
    - secret
    - token
    - tokens
    - tool_argument
    - tool_arguments
    - tool_result
    - tool_results
    - credential
    - endpoint
    - exception
    - id_token
    - memory_content
    - owner_subject
    - url
    - uri
retention:
  process_buffer: bounded
  overflow: drop_oldest_and_count
  export_failure: retry_three_times_then_drop_and_count
export:
  sink: structured_container_log_and_otlp
  cadence: periodic_and_shutdown
  retry: bounded_three_attempts
  health_counters: [accepted, rejected, dropped, export_failures, abandoned_batches]
