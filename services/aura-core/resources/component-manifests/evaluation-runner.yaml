    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [evaluation_nats, nats_jetstream, application_unknown]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_nats_recovery_count
    type: counter
    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [evaluation_nats, nats_jetstream, postgresql]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_nats_poison_count
    type: counter
    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [evaluation_nats, nats_jetstream]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_terminal_settlement_failure_count
    type: counter
    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [postgresql, application_unknown]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_lease_renewal_failure_count
    type: counter
    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [postgresql, application_unknown]
    trace: evaluation_runner
