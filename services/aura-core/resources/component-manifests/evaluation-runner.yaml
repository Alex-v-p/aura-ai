component:
  id: aura.evaluation.runner
  version: 1.0.0
  owner: evaluation.runner
  category: worker
input:
  schema: evaluation-runner-transport-v1
  replayable: true
output:
  schema: evaluation-runner-transport-v1
  capture:
    content: controlled_evaluation_only
    metadata: allowlisted
dependencies: [postgresql, evaluation_nats, evaluation_object_storage, core_public_replay_ports]
metrics:
  - evaluation_runner_queue_time_ms
  - evaluation_runner_fixture_load_duration_ms
  - evaluation_runner_execution_duration_ms
  - evaluation_runner_outcome_count
  - evaluation_runner_cancellation_count
  - evaluation_runner_resource_limit_count
  - evaluation_runner_reproducibility_completeness
  - evaluation_runner_queue_accepted
  - evaluation_runner_nats_fetch_failure_count
  - evaluation_runner_nats_publish_failure_count
  - evaluation_runner_nats_drain_failure_count
  - evaluation_runner_nats_recovery_count
  - evaluation_runner_nats_poison_count
  - evaluation_runner_terminal_settlement_failure_count
  - evaluation_runner_lease_renewal_failure_count
  - evaluation_runner_lease_lost_count
  - evaluation_runner_artifact_cleanup_failure_count
  - evaluation_runner_recovery_scan_failure_count
  - evaluation_runner_recovery_count
  - evaluation_runner_publication_recovery_failure_count
  - evaluation_runner_terminal_accounting_failure_count
  - evaluation_runner_nats_identity_conflict_count
metric_semantics:
  evaluation_runner_queue_time_ms: Queue wait in milliseconds, including expired queued work.
  evaluation_runner_fixture_load_duration_ms: Bounded fixture and input-artifact load duration in milliseconds.
  evaluation_runner_execution_duration_ms: Bounded execution duration in milliseconds through success, failure, cancellation, or deadline.
  evaluation_runner_outcome_count: Count of terminal completed or failed outcomes.
  evaluation_runner_cancellation_count: Count of terminal cancellations by bounded reason class.
  evaluation_runner_resource_limit_count: Count of bounded resource-limit rejections.
  evaluation_runner_reproducibility_completeness: Ratio of declared reproducibility fields verified at terminal settlement.
  evaluation_runner_queue_accepted: Count of requests durably accepted into the bounded runner queue.
  evaluation_runner_nats_fetch_failure_count: Count of bounded JetStream pull-fetch failures.
  evaluation_runner_nats_publish_failure_count: Count of bounded JetStream result-publish failures.
  evaluation_runner_nats_drain_failure_count: Count of bounded transient delivery or application-drain failures.
  evaluation_runner_nats_recovery_count: Count of transport recovery observations after a prior bounded failure.
  evaluation_runner_nats_poison_count: Count of permanently rejected malformed or invalid transport messages.
  evaluation_runner_terminal_settlement_failure_count: Count of terminal ledger transactions that failed, classified by a bounded error class.
  evaluation_runner_lease_renewal_failure_count: Count of lease renewal provider failures classified by bounded error class.
  evaluation_runner_lease_lost_count: Count of fenced executions whose durable lease could not be renewed.
  evaluation_runner_artifact_cleanup_failure_count: Count of bounded cleanup failures after interrupted output writes.
  evaluation_runner_recovery_scan_failure_count: Count of durable attempt recovery scans that failed.
  evaluation_runner_recovery_count: Count of queued or expired leased attempts re-enqueued after recovery.
  evaluation_runner_publication_recovery_failure_count: Count of terminal publication drain failures.
  evaluation_runner_terminal_accounting_failure_count: Count of invalid durable terminal payloads encountered during recovery accounting.
  evaluation_runner_nats_identity_conflict_count: Count of permanently rejected NATS identity conflicts.
metric_definitions:
  - name: evaluation_runner_queue_time_ms
    type: histogram
    unit: milliseconds
    labels: [outcome, error_class, dependency]
    dependencies: [postgresql, evaluation_nats, application_validation, nats_jetstream]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_fixture_load_duration_ms
    type: histogram
    unit: milliseconds
    labels: [outcome, error_class, dependency]
    dependencies: [evaluation_object_storage, object_storage, application_validation]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_execution_duration_ms
    type: histogram
    unit: milliseconds
    labels: [outcome, error_class, dependency]
    dependencies: [postgresql, evaluation_object_storage, object_storage, model_provider, application_validation]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_outcome_count
    type: counter
    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [postgresql, application_validation]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_cancellation_count
    type: counter
    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [postgresql, application_validation]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_resource_limit_count
    type: counter
    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [application_validation, postgresql]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_reproducibility_completeness
    type: gauge
    unit: ratio
    labels: [outcome, error_class, dependency]
    dependencies: [application_validation]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_queue_accepted
    type: counter
    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [postgresql, application_validation]
    trace: evaluation_runner
    correlation: attempt_id
    export: [structured_container_log, otlp]
  - name: evaluation_runner_nats_fetch_failure_count
    type: counter
    unit: count
    labels: [outcome, error_class, dependency]
    dependencies: [evaluation_nats, nats_jetstream]
    trace: evaluation_runner
