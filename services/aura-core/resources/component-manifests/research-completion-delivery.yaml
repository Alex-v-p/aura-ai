component:
  id: aura.interaction.research_completion_delivery@1
  version: 1.0.0
  owner: interaction.research_delivery
  category: delivery
input: {schema: ResearchCompletionDeliveryInputV1, replayable: true, replay_reason: Synthetic idempotency and failure fixtures only.}
output: {schema: ResearchCompletionDeliveryResultV1, capture: {content: none, metadata: allowlisted}}
boundaries: {accepts: [ResearchCompletionDeliveryInputV1], emits: [ResearchCompletionDeliveryResultV1], excludes: [question, answer, excerpt, url, owner_identity, payload, exception]}
dependencies: [conversation_public_api, notification_public_api, core_postgresql]
span: {operation: research_completion.deliver, dependency: core_postgresql, capture: metadata_only}
outcomes: [success, partial, failed, unknown, skipped]
errors: [authorization_denied, conflict, delivery_failed, queue_unavailable, settlement_unknown, storage_unavailable, validation_failed]
metrics: [research_completion_outcome_count, research_completion_latency_ms]
metric_definitions:
  - {name: research_completion_outcome_count, type: counter, unit: count, labels: [operation, outcome, status, error_class, dependency], dependencies: [conversation_public_api, notification_public_api, core_postgresql]}
  - {name: research_completion_latency_ms, type: histogram, unit: milliseconds, labels: [operation, outcome, status, error_class, dependency], dependencies: [conversation_public_api, notification_public_api, core_postgresql]}
metric_semantics:
  research_completion_outcome_count: Content-free terminal append and notification settlement outcome.
  research_completion_latency_ms: Active completion-delivery handling duration, excluding queue residence and client subscription.
capture_policy: metadata_only
evaluators: [research_completion_exactly_once@1, research_tool_lifecycle@1, research_delivery_privacy@1, research_delivery_failure_isolation@1]
cardinality: {metric_attributes: [operation, outcome, status, dependency, error_class], trace_only: [trace_id, span_id, parent_span_id, run_id, conversation_id], prohibited: [question, answer, excerpt, url, owner_identity, task_id, research_id, artifact_id, notification_id, append_key, notification_key, payload, exception]}
replay: synthetic_fixture_only
privacy: {capture: metadata_only, content: forbidden, owner_identity: forbidden, credentials: forbidden}
retention: {process_buffer: bounded, overflow: drop_oldest_and_count, export_failure: retry_three_times_then_drop_and_count}
export: {sinks: [structured_container_log, otlp], cadence: periodic_and_shutdown, health_counters: [dropped, rejected, export_failures, abandoned_batches]}
