rules:
  - id: service.observatory-no-core-implementation
    source: services/aura-observatory/src/**
    forbidden_imports: [aura_core]
  - id: service.core-no-observatory
    source: services/aura-core/src/aura_core/**
    forbidden_imports: [aura_observatory]
  - id: core.domain-no-cross-internals
    source: services/aura-core/src/aura_core/domains/**
    forbidden_segments: [/adapters/, /persistence/]
    require_cross_domain_public_api: true
  - id: core.domain-no-provider-implementations
    source: services/aura-core/src/aura_core/domains/**
    forbidden_imports: [aura_core.providers]
  - id: core.thin-entrypoints
    source: services/aura-core/src/aura_core/entrypoints/**
    policy: entrypoints may translate input and call application APIs but may not own domain rules
  - id: core.bootstrap-composition-only
    source: services/aura-core/src/aura_core/bootstrap/**
    policy: bootstrap may compose public module APIs and concrete providers; domain rules remain in domains
  - id: core.provider-inward-port
    source: services/aura-core/src/aura_core/providers/**
    policy: providers implement runtime ports and do not become dependencies of domain modules
  - id: core.public-module-apis
    source: services/aura-core/src/aura_core/domains/**
    policy: cross-domain access uses public commands, queries, DTOs, or events; adapters and persistence are private
  - id: contract.generated-client-transport-only
    source: frontend/libs/platform/aura-api-client/src/**
    forbidden_import_prefixes: [frontend/libs/aura, frontend/libs/observatory, '@aura/aura', '@aura/observatory']
    policy: generated client exposes transport types and operations, not product behavior
  - id: frontend.aura-no-observatory-features
    source: frontend/libs/aura/**
    forbidden_import_prefixes: [frontend/libs/observatory, '@aura/observatory']
  - id: frontend.observatory-no-aura-features
    source: frontend/libs/observatory/**
    forbidden_import_prefixes: [frontend/libs/aura, '@aura/aura']
  - id: frontend.shared-product-neutral
    source: frontend/libs/shared/**
    forbidden_import_prefixes: [frontend/libs/aura, frontend/libs/observatory, '@aura/aura', '@aura/observatory']
