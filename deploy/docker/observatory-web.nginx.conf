worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        location = /healthz {
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        # The browser talks only to this same-origin BFF.  Never cache
        # authenticated responses or stream traffic at the edge.
        location /api/ {
            proxy_pass http://observatory-api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Cookie $http_cookie;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            add_header Cache-Control "no-store" always;
            access_log off;
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        # Angular's hashed public shell assets are safe to cache.  They never
        # contain REST, SSE, session, or retention data.
        location ~* \.(?:css|js|mjs|json|svg|ico|png|jpg|jpeg|gif|webp|woff2?)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
