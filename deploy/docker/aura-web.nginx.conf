worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # OIDC callbacks contain short-lived code/state query values. Log only the
  # normalized URI, never $request_uri, $args, or request headers.
  log_format aura_access '$remote_addr [$time_local] '
                         '"$request_method $uri $server_protocol" $status '
                         '$body_bytes_sent $request_time $upstream_response_time';
  access_log /dev/stdout aura_access;
  error_log /dev/stderr warn;
  sendfile on;
  keepalive_timeout 65;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the browser on one origin. Core owns authentication and API
    # semantics; nginx only forwards the request and preserves SSE framing.
    location /api/ {
      proxy_pass http://aura-core-api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      add_header Cache-Control "no-store" always;
    }

    location = /health/live {
      proxy_pass http://aura-core-api:8000/health/live;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "no-store" always;
    }

    location = /health/ready {
      proxy_pass http://aura-core-api:8000/health/ready;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "no-store" always;
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      add_header Cache-Control "no-store" always;
      return 200 "ok\n";
    }

    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      try_files $uri =404;
    }

    location = /sw.js {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      try_files $uri =404;
    }

    location = /manifest.webmanifest {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      try_files $uri =404;
    }

    location ~* "[-.][A-Za-z0-9_-]{8,}\.(?:css|js|map|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|ico)$" {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
