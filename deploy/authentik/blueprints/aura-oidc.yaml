version: 1
metadata:
  name: aura-oidc-provider
  labels:
    app.kubernetes.io/name: aura
    aura.dev/purpose: temporary-local-identity

# This blueprint creates only the provider and application boundary. It does
# not grant Aura household permissions; Core authorizes the configured owner
# subject after OIDC validation. Values that identify a deployment are supplied
# at runtime through environment expansion by Authentik.
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: aura-web-provider
    identifiers:
      name: Aura Web OIDC
    attrs:
      name: Aura Web OIDC
      client_type: confidential
      client_id: !Env [AURA_AUTHENTIK_CLIENT_ID, aura-web]
      client_secret: !Env [AURA_AUTHENTIK_CLIENT_SECRET, runtime-secret-required]
      grant_types:
        - authorization_code
        - refresh_token
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          url: !Env [AURA_AUTHENTIK_REDIRECT_URI, https://aura.example.invalid/api/v1/auth/callback]
          redirect_uri_type: authorization
      include_claims_in_id_token: true
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: days=30
  - model: authentik_core.application
    identifiers:
      slug: aura-web
    attrs:
      name: Aura Web
      slug: aura-web
      provider: !KeyOf aura-web-provider
