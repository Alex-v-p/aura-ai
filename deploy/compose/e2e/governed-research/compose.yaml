name: aura-governed-research-e2e

# This topology is deliberately synthetic.  It has no public ports, no live
# research-provider profile, no credentials, and no build/publish operation.
# The runner validates it and uses the local fixture harness; an operator may
# start it for dependency-level diagnostics without changing production.
services:
  postgres:
    image: ${AURA_GOVERNED_RESEARCH_POSTGRES_IMAGE:-pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d}
    environment:
      POSTGRES_DB: aura_fixture
      POSTGRES_USER: aura_fixture
      POSTGRES_PASSWORD: fixture-only
    ports:
      - target: 5432
        published: ${AURA_GOVERNED_RESEARCH_POSTGRES_PORT:-55432}
        host_ip: 127.0.0.1
    networks: [state]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U aura_fixture -d aura_fixture]
      interval: 2s
      timeout: 2s
      retries: 10

  nats:
    image: ${AURA_GOVERNED_RESEARCH_NATS_IMAGE:-nats:2.10.22-alpine}
    command: ["-js", "-a", "0.0.0.0", "-m", "8222"]
    ports:
      - target: 4222
        published: ${AURA_GOVERNED_RESEARCH_NATS_PORT:-54222}
        host_ip: 127.0.0.1
    networks: [state]
    healthcheck:
      test: [CMD, wget, --spider, --quiet, http://127.0.0.1:8222/varz]
      interval: 2s
      timeout: 2s
      retries: 10

  valkey:
    image: ${AURA_GOVERNED_RESEARCH_VALKEY_IMAGE:-valkey/valkey:8.1-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507}
    command: [valkey-server, --save, "", --appendonly, "no"]
    ports:
      - target: 6379
        published: ${AURA_GOVERNED_RESEARCH_VALKEY_PORT:-56379}
        host_ip: 127.0.0.1
    networks: [state]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 10

  garage:
    image: ${AURA_GOVERNED_RESEARCH_GARAGE_IMAGE:-dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a}
    entrypoint: [/garage]
    command: [--config, /fixture/garage.toml, server]
    volumes:
      - garage-data:/var/lib/garage
      - type: bind
        source: ./garage.toml
        target: /fixture/garage.toml
        read_only: true
    networks: [state]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev"]
    healthcheck:
      test: [CMD, /garage, --config, /fixture/garage.toml, status]
      interval: 2s
      timeout: 3s
      retries: 15

  synthetic-static-fetcher:
    image: python:3.14-alpine@sha256:1acc95d63ef1c8cc902e9a10a8ae080e1377325771d2819beb48156e1b3b9673
    command: [python, /fixture/synthetic_service.py]
    environment:
      AURA_SYNTHETIC_ROLE: static-fetcher
      AURA_RESEARCH_STATIC_ENABLED: "false"
    volumes:
      - type: bind
        source: ./synthetic_service.py
        target: /fixture/synthetic_service.py
        read_only: true
    networks: [static-provider]
    expose: [8080]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 10

  synthetic-browser-fetcher:
    image: python:3.14-alpine@sha256:1acc95d63ef1c8cc902e9a10a8ae080e1377325771d2819beb48156e1b3b9673
    command: [python, /fixture/synthetic_service.py]
    environment:
      AURA_SYNTHETIC_ROLE: browser-fetcher
      AURA_RESEARCH_BROWSER_ENABLED: "false"
    volumes:
      - type: bind
        source: ./synthetic_service.py
        target: /fixture/synthetic_service.py
        read_only: true
    networks: [browser-provider]
    expose: [8080]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 10

  synthetic-frontend:
    image: python:3.14-alpine@sha256:1acc95d63ef1c8cc902e9a10a8ae080e1377325771d2819beb48156e1b3b9673
    command: [python, /fixture/synthetic_service.py]
    environment:
      AURA_SYNTHETIC_ROLE: frontend
      BASE_URL: http://synthetic-frontend:8080
    volumes:
      - type: bind
        source: ./synthetic_service.py
        target: /fixture/synthetic_service.py
        read_only: true
    networks: [frontend]
    expose: [8080]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 10

networks:
  state:
    # Loopback-only host mappings are the runner's disposable observer path.
    # Provider networks remain internal and single-homed below.
    internal: false
    ipam:
      config:
        - subnet: ${AURA_GOVERNED_RESEARCH_STATE_SUBNET:-10.254.0.0/24}
  static-provider:
    internal: true
    ipam:
      config:
        - subnet: ${AURA_GOVERNED_RESEARCH_STATIC_SUBNET:-10.254.1.0/24}
  browser-provider:
    internal: true
    ipam:
      config:
        - subnet: ${AURA_GOVERNED_RESEARCH_BROWSER_SUBNET:-10.254.2.0/24}
  frontend:
    internal: true
    ipam:
      config:
        - subnet: ${AURA_GOVERNED_RESEARCH_FRONTEND_SUBNET:-10.254.3.0/24}

volumes:
  garage-data:
