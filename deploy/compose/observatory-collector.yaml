receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 1s
    send_batch_size: 128
  attributes/metadata_only:
    actions:
      - key: aura.capture_policy
        value: metadata_only
        action: upsert
  transform/metadata_allowlist:
    error_mode: propagate
    metric_statements:
      - context: datapoint
        statements:
          - delete_key(attributes, "events")
          - delete_key(attributes, "links")
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "events")
          - delete_key(attributes, "links")

extensions:
  bearertokenauth:
    filename: /run/secrets/observatory-ingest-credential

exporters:
  otlphttp/observatory:
    endpoint: http://observatory-api:8000/internal/v1/telemetry
    encoding: json
    auth:
      authenticator: bearertokenauth
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 30s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 256
service:
  extensions: [bearertokenauth]
  # Keep Collector self-telemetry on the private ingest network. The exporter
  # failure counters preserve finite outage evidence after info-level
  # diagnostics are suppressed, without adding a host port or resource data.
  telemetry:
    resource:
      service.instance.id: null
    logs:
      # Collector provider diagnostics can include endpoint and auth-file
      # context even at warn/error levels. Keep stdout/stderr content-free;
      # bounded outage evidence is retained through the private metrics reader.
      output_paths: [/dev/null]
      error_output_paths: [/dev/null]
    metrics:
      # Normal preserves the bounded exporter queue/send counters used for
      # outage evidence without emitting endpoint address/port dimensions in
      # the private metrics surface.
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_scope_info: true
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/metadata_only, transform/metadata_allowlist, batch]
      exporters: [otlphttp/observatory]
    metrics:
      receivers: [otlp]
      processors: [attributes/metadata_only, transform/metadata_allowlist, batch]
      exporters: [otlphttp/observatory]
