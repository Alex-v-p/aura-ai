id: AURA-0023
title: Add conversation persona overrides and compact composer controls
status: approved
change_class: contract
intent: >
  Let the configured owner independently select a reusable persona for a
  conversation while retaining each agent revision's default, preserve exact
  persona provenance, and expose model agent and persona controls through a
  compact accessible composer menu.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/agents-and-execution.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
  decisions:
    - User-approved Sidebar Conversation Navigation and Persona Override Workstream
    - Agent revisions retain an immutable default persona while conversations may persist an explicit persona override
    - Explicit persona overrides persist across agent switches until reset to the agent default
    - A disabled persona cannot be newly selected but does not invalidate an existing pinned conversation agent revision run or retry
    - Persisted configuration changes reuse only completed transcript context after explicit confirmation
    - Each requested fix receives a separate reviewed checkpoint
  contracts:
    - contracts/openapi/aura-v1.yaml
feature_references:
  - AGT-002
  - AGT-004
  - AGT-005
  - AGT-015
  - AGT-017
  - CTX-001
  - CTX-002
  - CTX-003
  - AUI-005
