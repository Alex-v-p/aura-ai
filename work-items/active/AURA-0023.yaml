contracts:
  changes_allowed: true
  affected:
    - aura-openapi-v1
  compatibility_requirement: backward_compatible
data:
  migration_required: true
  owning_service: aura-core
  owning_module: interaction.conversations
observability:
  applicable: true
  affected_components:
    - aura.interaction.agent_configuration
    - aura.runtime.prompt_compilation
    - aura.execution.run_coordinator
    - aura.interaction.conversation_persistence
  required_metrics:
    - operation_duration_ms
    - prompt_compile_duration_ms
    - prompt_component_count
    - compiled_prompt_size
    - configuration_outcome
  required_evaluators: []
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Agent and persona instructions remain private and never enter logs telemetry audit metadata or error payloads
    - All selection and configuration remains restricted to the configured owner
    - Persona changes require CSRF idempotency optimistic versioning and completed-transcript confirmation
    - A persona cannot grant permissions or alter deterministic governance
    - Historical retries use run-pinned configuration rather than mutable conversation state
  data_classes:
    - private persona instructions and descriptions
    - conversation persona assignment history
    - prompt revision identifiers and hashes
    - authenticated principal identifiers
required_agents:
  implementation:
    - contract_steward
    - core_worker
    - frontend_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 4
  max_parallel_writers: 4
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Agent revisions keep an immutable default persona and conversations may independently pin an active persona revision.
  - An explicit conversation override persists across agent changes until the owner explicitly returns to the agent default.
  - Persona assignment history records immutable revision source reason and effective message boundary and migration 0005 deterministically backfills existing conversations.
  - Disabled personas cannot be newly selected while existing pinned conversations runs agent revisions and retries remain valid without fallback.
  - New runs compile with and persist the effective persona revision while historical retries retain original run provenance.
  - Persona changes are owner-authenticated CSRF-protected optimistic idempotent audited and rejected while a run is active.
  - The backward-compatible contract exposes persona selection reset effective reference override state and assignment history and the generated client is synchronized.
  - Aura Web first exposes persona selection through conversation configuration then moves all supported model agent and persona controls into a compact accessible composer menu.
  - Configuration confirmation draft preservation disabled-agent recovery keyboard focus and responsive behavior remain correct.
  - Telemetry and audit contain identifiers and aggregate metadata only and never prompt or instruction content.
