acceptance_criteria:
  - A fresh isolated PostgreSQL database upgrades from base through head with one Alembic head and without uq_tool_policy_owner_revision or agent-revision uniqueness failures.
  - A supported database at 0032 with the built-in general agent pinned to the canonical immutable document successor and owner-scoped tool-policy and agent numeric revision 5 already occupied upgrades through 0033 without mutating deleting or widening either occupied row.
  - The collision path creates exactly one new immutable built-in successor under the canonical research policy and agent identifiers, assigns collision-free owner-scoped numeric revisions, preserves the predecessor grants, adds only web.research@1 and research:run, and retains the approved one-call thirty-second zero-retry limits.
  - The built-in profile advances only when its current revision identifier is the canonical document predecessor, regardless of that predecessor's numeric revision; custom agents historical conversations and runs remain pinned to their original revisions and receive no automatic research grant.
  - >-
    Repeating the upgrade target and directly re-entering the migration against
    the same settled fixture is idempotent: no duplicate policy agent revision
    or grant appears and the profile version changes at most once.
  - An inconsistent canonical identifier owner binding predecessor or pre-existing grant set fails closed with no partial authority widening and no destructive repair.
  - Static migration coverage preserves revision 0033_research_delivery its 0032_governed_research predecessor additive research-delivery schema and disabled downgrade posture.
  - The exact AURA-0143 document SQL PostgreSQL check that exposed the failure passes unchanged against a separate clean disposable database.
  - No public contract application runtime deployment frontend Observatory provider protected baseline dependency or other migration changes.
