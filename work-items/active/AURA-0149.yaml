id: AURA-0149
title: Make research completion migration collision-safe
status: approved
change_class: bugfix
intent: >
  Restore deterministic clean and supported pre-upgrade PostgreSQL upgrades by
  making the AURA-0146 built-in research tool-policy and agent-revision seed
  tolerate an already occupied owner-scoped revision number without changing
  immutable history, widening grants, or weakening migration idempotency.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/design/governed-research-artifacts-and-tasks.md
    - docs/specifications/agents-and-execution.md
    - docs/specifications/tools-automation-and-integrations.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - work-items/archived/AURA-0146.yaml
    - work-items/active/AURA-0148.yaml
    - The corrective change preserves the accepted AURA-0146 behavior and changes no public contract, provider, runtime policy, or research-delivery lifecycle.
    - Existing tool-policy and agent revisions are immutable. An occupied owner-scoped revision number must not be overwritten, deleted, repurposed, or silently granted web.research@1.
    - The migration must retain the canonical deterministic research policy and agent identifiers consumed by Core, derive collision-free owner-scoped numeric revisions, preserve every prior grant, add only the approved research grant and scope, and pin the profile only from the canonical document predecessor identifier.
    - Missing, inconsistent, cross-owner, or otherwise unsafe seed state fails closed rather than widening authority or rewriting history.
    - The defect was discovered when AURA-0148 reran the exact AURA-0143 document SQL check and PostgreSQL raised UniqueViolation for uq_tool_policy_owner_revision at general-agent revision 5.
    - The required Pyright gate is scoped to the migration and AURA-0149 regression files changed by this corrective work item; pre-existing diagnostics in unchanged research-delivery tests remain outside this correction and are not rewritten to manufacture a clean baseline.
