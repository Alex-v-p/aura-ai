security_privacy:
  applicable: true
  concerns:
    - An occupied policy revision must never receive the research grant unless it is the migration-created immutable successor with the exact approved grant set and execution limits.
    - Existing built-in and custom agent revisions policies grants owner bindings run pins and historical rows remain byte-for-byte authoritative and are never rewritten or deleted.
    - Collision handling remains owner-scoped deterministic and fail-closed for inconsistent identifiers ownership predecessor lineage or policy contents.
    - Re-entry duplicate execution and concurrent upgrade attempts cannot duplicate grants create multiple successors repin an unrelated current revision or increment the profile version more than once.
    - Migration diagnostics and tests use only synthetic identities and metadata and introduce no conversation research citation artifact credential or fetched-content capture.
  data_classes:
    - immutable built-in agent and tool-policy revision metadata
    - exact-version tool grant identifiers and bounded execution limits
    - synthetic isolated PostgreSQL migration fixtures
