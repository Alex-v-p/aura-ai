security_privacy:
  applicable: true
  concerns:
    - Personal-first verification must require user-authored grounding and must not infer owner attributes from assistant content or topical questions
    - Explicit remember requests must be recognized deterministically and remain subject to credential sensitivity conflict and authorization rules
    - Built-in shared-user promotion must not widen custom-agent policies or historical conversation and run pins
    - Review candidates must expose actionable owner-visible content while rejected diagnostics retain no memory text
    - Telemetry and ignored-decision audit metadata must never contain prompts responses memory text embeddings secrets or personal subjects
    - Owner and agent scope authorization and embedding generation rules remain unchanged
  data_classes:
    - private durable owner relationship preference commitment possession and project memory content
    - content-free extraction decision and failure metadata
    - owner agent conversation run policy candidate revision and embedding-generation identifiers
