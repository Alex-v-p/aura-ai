acceptance_criteria:
  - Versioned extraction distinguishes personal explicit_request and none retention bases and applies deterministic verification after provider inference.
  - Personal retention requires user-authored evidence tied to the owner a close relationship a preference routine commitment constraint possession or owned project while mere topic mention questions and assistant-only facts are ignored.
  - Explicit retention requires a recognized remember or save request and continues to reject credentials and review sensitive conflicting or ambiguous content.
  - Structured provider output uses enums for kind scope sensitivity and retention basis requires complete nullable decision metadata and requires complete grounded proposals for create or review actions.
  - Malformed dates invented identifiers missing proposal fields and incomplete output settle as content-free rejected diagnostics rather than review candidates or endless retries.
  - High-confidence ordinary personal facts and safe explicit remember requests may automatically persist in shared-user scope under the built-in Aura policy.
  - Migration 0012 creates deterministic successor policy and agent revisions for only the built-in Aura profile enables shared-user promotion and preserves recall mode threshold limits scopes grants historical policies and all conversation and run pins.
  - Migration 0012 leaves custom-agent policies unchanged and idempotently reclassifies legacy null-content invalid-provider review rows as rejected diagnostics.
  - Existing content-bearing memories and candidates are not automatically rewritten or reclassified.
  - Ignored and rejected extraction outcomes remain content-free audit metadata and are omitted from user-facing run memory activity indicators popups and availability warnings.
  - Every owner-visible review candidate contains visible actionable content and complete retention metadata and defensive null-content rendering uses reason-specific diagnostic copy.
  - The extraction policy and observable component version distinguish the personal-first implementation without changing the public OpenAPI shape.
  - Approved deterministic fixtures achieve precision and recall of 1.0 for personal and explicit-request extraction with zero admissions for ordinary world knowledge questions or assistant-only facts.
  - Provider outages remain retryable and never block conversation delivery while duplicate personal facts reinforce rather than duplicate records.
  - Authenticated web-app acceptance completes the owner-approved sister-birthday and Star-Wars scenario three consecutive times using configured Ollama models and shows correct recall persistence embeddings activity and review behavior.
