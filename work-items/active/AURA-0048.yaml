id: AURA-0048
title: Make memory personal-first and eliminate empty review candidates
status: approved
change_class: feature
intent: >
  Tune automatic extraction toward durable owner-relevant facts and explicit
  remember requests, reject ordinary world knowledge, eliminate empty review
  candidates, and prove the resulting behavior through the authenticated Aura
  web application without widening memory authorization.
