    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/memory-and-knowledge.md
    - docs/specifications/agents-and-execution.md
    - docs/specifications/clients-and-voice.md
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - docs/adr/0012-http-sse-nats-realtime-transport.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - Owner-approved AURA-0048 personal-first extraction plan
    - Retention bases are personal explicit_request and none
    - Ordinary world knowledge is ignored unless the owner explicitly asks Aura to remember it
    - Assistant-authored content may provide context but cannot establish memory grounding
    - High-confidence ordinary personal and explicit-request memories may promote to shared-user scope for the built-in Aura agent
    - Incomplete provider output is a content-free rejected diagnostic and never an owner-review item
    - Ignored or rejected extraction decisions are omitted from owner-facing conversation memory activity
    - Existing content-bearing memories are not automatically reclassified
  contracts:
    - contracts/openapi/aura-v1.yaml
