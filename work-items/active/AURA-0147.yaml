contracts:
  changes_allowed: false
  affected:
    - Existing generated Aura v1 research artifact task conversation and run transports consumed without hand editing
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - Questions seed URLs domain restrictions source URLs excerpts reports artifact bodies titles filenames and citations remain in authorized no-store responses and rendered state only; they never enter URL state browser persistence service-worker caches analytics logs screenshots or telemetry.
    - Every mutation uses same-origin anti-CSRF idempotency and expected versions where state can race; capability flags control whether cancel retry extend delete cleanup retry or reconcile actions are offered.
    - Markdown plain text and JSON previews are inert bounded and server-type validated; raw HTML scripts remote embeds unsafe links executable content and arbitrary downloads cannot render.
    - Logout authorization-generation changes route changes deletion and late responses clear private state and cannot restore another principal or deleted content.
    - Metadata-only SSE never carries titles questions progress content URLs source identity artifact metadata or owner identity and cannot be treated as authoritative state.
  data_classes:
    - owner-private research questions settings sources evidence citations and reports
    - owner-private generated artifact metadata previews revisions and downloads
    - owner-private task presentation recovery and lineage metadata
    - ephemeral memory-only drafts filters and authorized REST snapshots
required_agents:
  implementation:
    - frontend_worker
    - platform_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
    - aura_ux_ui_reviewer
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 5
  max_parallel_writers: 3
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Aura Web exposes /research, /tasks, /tasks/:id, /artifacts, and /artifacts/:id with lazy feature boundaries and no duplicated domain behavior in the application shell or generated transport client.
  - Knowledge navigation adds Research and Artifacts and Activity adds Tasks after Approvals and Notifications while preserving collapsed rail tablet overlay mobile drawer keyboard focus restoration active-route semantics theme and reduced-motion behavior.
  - Research creates Quick Auto Deep and Agent-led tasks, shows admitted budgets and durable stages, keeps Advanced settings inline, supports the single bounded extension and cancellation, and distinguishes interactive subscription from detached background execution.
  - Task Center filters and groups normalized presentation statuses while always showing authoritative source status outcome stage progress capability and recovery information and routes advertised cancel and retry actions through the owning APIs.
  - Artifact list detail revision history sanitized preview download deletion cleanup retry and reconciliation preserve integrity and deletion truth; Markdown raw HTML and remote embeds remain inert and JSON and plain text never execute.
  - Conversation transcripts render a stable research activity item that survives reconnect and links to task and report artifact; a terminal cited completion replaces or augments activity without duplicate messages or a second run.
  - SSE carries metadata-only invalidations; reconnect gaps duplicate invalidations stale responses and mutation races coalesce into bounded authorized REST refresh and never regress a newer resource version.
  - Loading empty queued running waiting detached partial failed canceled interrupted stale disconnected unauthorized malformed deletion-pending deletion-failed cleanup-unknown and deleted states use text not color alone and provide truthful bounded recovery.
  - Research drafts and filters remain memory-only, are cleared on logout authorization-generation change successful create and explicit discard, and are not claimed as durable when navigating away or reloading.
  - Keyboard focus live-region announcements screen-reader names reduced motion high contrast mobile layouts light and dark themes and 200 percent zoom pass component Storybook and real-browser acceptance without horizontal loss of core controls.
  - Generated-client synchronization lint type unit production build Storybook accessibility and Playwright suites pass; no contract backend Observatory package dependency lock service-worker persistence or protected baseline change occurs.
  - Every new feature library exposes only its index.ts public API and the Platform Worker registers Research Artifacts and Activity Tasks ownership and dependency direction in tooling/architecture/modules.yaml without adding product logic.
