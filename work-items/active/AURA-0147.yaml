id: AURA-0147
title: Build Aura Web Research Tasks and Artifacts
status: draft
change_class: repository_governance
intent: >
  Add dedicated Aura Web research, federated Task Center, and generated-artifact
  experiences with authoritative REST reconciliation, metadata-only live
