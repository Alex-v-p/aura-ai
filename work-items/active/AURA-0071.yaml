security_privacy:
  applicable: true
  concerns:
    - Every branch list load edit and regeneration command is owner-authorized without cross-owner existence disclosure.
    - Existing messages runs citations tool results and memory activity remain immutable and cannot be moved rewritten or relabelled into another branch.
    - A branch context contains only its ancestor path and never later or sibling messages.
    - Regeneration uses current effective policy and obtains fresh run-scoped tool evidence; source-run evidence identifiers and citations are never copied.
    - Shared historical messages do not repeat prior memory extraction or tool side effects merely because a new descendant branch is created.
    - URLs browser storage events logs traces metrics and evaluator capture contain only bounded opaque identifiers statuses counts timings and failure classifications and never message document prompt response or tool content.
  data_classes:
    - private_conversation_content
    - owner_identity
    - opaque_conversation_branch_identifiers
    - run_lineage_metadata
    - metadata_only_document_citations
