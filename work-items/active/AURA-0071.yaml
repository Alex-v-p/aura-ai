acceptance_criteria:
  - Existing linear conversations migrate to one root branch and remain readable through every pre-existing API and generated-client interface.
  - Editing an earlier owner user message creates one idempotent immutable branch from that message's parent path with corrected content and a newly admitted run while the source message and all original descendants remain byte-for-byte unchanged.
  - Regenerating an owner assistant turn creates one idempotent alternative run from the same preceding user-message path using the currently effective conversation configuration without changing failed-run retry semantics.
  - Branch list and branch-path APIs expose stable opaque branch and lineage identifiers enforce optimistic conversation versions for mutations and deny cross-owner access without existence disclosure.
  - Each branch context contains exactly its ancestor message path and excludes all later source-branch and sibling-branch messages even during concurrent branch creation.
  - A branch or regenerated run performs fresh governed tool and citation validation and never copies source-run evidence identifiers citations tool results or side effects.
  - Shared historical messages do not trigger duplicate automatic memory extraction; edited branches process only their newly created user and assistant turn, and regenerated answers enqueue no memory extraction because they contain no new owner-authored evidence.
  - Run events and response snapshots remain backward compatible and add only optional opaque lineage fields needed to reconcile the correct branch.
  - Aura Web provides keyboard-accessible Edit and branch and Regenerate actions plus previous and next branch navigation with clear preserved-original messaging responsive layout and URL state containing opaque identifiers only.
  - Metadata-only telemetry and evaluations distinguish branch creation load regeneration conflict denial and failure outcomes without capturing private conversation document prompt response citation or tool content.
  - Full-stack browser acceptance edits an earlier user turn receives the alternative answer regenerates it switches between branches and proves the original transcript remains unchanged.
  - No branch merge history rewrite shared editing arbitrary deletion new executor framework new service package dependency or protected-baseline change is introduced.
