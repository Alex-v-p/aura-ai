    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/agents-and-execution.md
    - docs/specifications/memory-and-knowledge.md
    - docs/specifications/tools-automation-and-integrations.md
    - docs/specifications/clients-and-voice.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/sidebar-and-management-surfaces.md
  decisions:
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-approved edits and regenerations always create immutable alternative branches and never rewrite messages or runs.
    - Owner-approved regeneration is a new governed run admitted with the currently effective conversation configuration while failed-run retry remains recovery of the original run.
    - Owner-approved branch navigation uses opaque identifiers only and does not place message content in URLs or durable browser storage.
    - Owner-approved branch selection replaces the current URL state so deep links are stable without adding every branch switch to browser Back and Forward history.
    - Owner-approved branch runs must obtain fresh document evidence and citation validation and must not duplicate side effects or memory extraction for shared historical messages.
    - Owner-approved edit-and-branch runs apply normal memory processing to their newly created user and assistant turn, while regeneration skips automatic memory extraction because it adds no new owner-authored evidence and assistant output alone is not durable memory evidence.
