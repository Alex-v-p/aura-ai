id: AURA-0071
title: Add immutable conversation branching and regeneration
status: review
change_class: repository_governance
intent: >
  Let an authenticated owner correct an earlier user message or regenerate an
  assistant answer as an immutable alternative branch, navigate every branch,
  and preserve the original transcript while admitting every new run through
  current Aura policy and fresh evidence validation.
