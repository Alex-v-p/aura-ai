  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Security acceptance independently covers SSRF DNS rebinding redirects userinfo ports downgrade mixed answers metadata access MIME confusion polyglots decompression browser isolation credential leakage replay expiry prompt injection and resource exhaustion.
    - Quality fixtures are synthetic and task-scoped; invented cross-task stale duplicate unsupported and deleted citations must score zero and cannot be promoted to passing results.
    - Telemetry event log evaluator diagnostic browser-state cache and artifact scans must find zero prohibited content values identifiers secrets URLs queries excerpts titles filenames object keys or digests.
    - Full-stack fixtures and credentials are isolated disposable bounded and excluded from source control; production targets and owner content are not replayed.
    - Failure injection cannot weaken authorization destination sandbox size citation deletion projection or retention policy and must leave Core usable when Observatory is unavailable.
  data_classes:
    - versioned synthetic hostile-network document browser and research fixtures
    - synthetic task-scoped evidence claims citations and expected scores
    - metadata-only evaluation observations verdicts and aggregate reports
    - disposable isolated full-stack test identities databases queues and object storage
required_agents:
  implementation:
    - platform_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
    - aura_ux_ui_reviewer
  integration: true
execution:
  parallelism_class: fanout
  max_parallel_agents: 8
  max_parallel_writers: 3
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Contract compatibility generated-client synchronization migration upgrade and single-head checks pass before full-stack acceptance begins.
  - Destination-policy acceptance blocks one hundred percent of the approved SSRF DNS rebinding redirect metadata mixed-answer and browser escape corpus at both Core and provider boundaries without false success.
  - Research relevance reaches recall at k of at least 0.80, every retained material claim is supported, citation precision is 1.00, invented cross-task and stale citations score zero, freshness expectations pass, and diversity uses at least two independent domains when available or states the limitation.
  - Unsupported material claim rate is zero, budget compliance has no admitted-envelope breach, evidence-sufficiency accuracy is at least 0.90 with no exhausted case mislabeled complete, and hostile evidence preserves one hundred percent of policy grants budgets tools and transition authority.
  - Restart duplicate out-of-order race cancel retry one-time extension timeout late-result storage ambiguity deletion and unknown-outcome suites prove durable truthful convergence without resurrection duplicate delivery or source-authority leakage.
  - Artifact authorization integrity immutable revisions sanitization downloads Garage failures delete races missing objects retry and reconciliation pass with immediate unreadability and truthful pending failed unknown or deleted state.
  - Task projection live invalidation rebuild and existing-record backfill converge exactly for research workflow briefing document and memory sources and cannot regress versions cross owner boundaries or issue unsupported commands.
  - Quick Auto-detached Deep and Agent-led journeys pass from both chat and /research, including cited completion append notification Task Center recovery artifact preview revision download and deletion.
  - Keyboard focus live-region reduced-motion mobile light and dark theme high-contrast and 200 percent zoom acceptance passes for all new routes and conversation activity.
  - Every declared component metric span unit dependency finite label outcome error and clock boundary is registered; privacy scans find zero prohibited content and Core research and delivery remain correct with Observatory stopped.
  - Integration reconciles only reviewed worker handoffs, runs every upstream work-item check and repository validator, records exact evidence and commit identities, and introduces no product logic threshold reduction baseline rewrite secret generated-only artifact or unreviewed repair.
  - The version-controlled fail-closed aggregate runner enumerates and executes every exact AURA-0142 through AURA-0147 required check with isolated PostgreSQL NATS Garage research-provider browser and frontend dependencies; it cannot translate missing dependencies or skipped mandatory evidence into success.
