    - Migration 0029_generated_artifacts descends from 0028_workflow_execution; AURA-0143 owns the only following migration and shared Core composition wiring.
    - Artifact bytes use a dedicated aura-artifacts bucket and Core identity that cannot access aura-documents, evaluation, or Observatory buckets.
    - Artifact creation and immutable revision append are internal application APIs; public HTTP exposes no upload or revision-create operation.
    - The Core Worker owns the generated domain bootstrap route and Core tests; the Platform Worker owns settings root Compose Garage grants and deployment tests; the Test and Evaluation Engineer owns independent lifecycle fault privacy and instrumentation cases; only the Integration Maintainer reconciles their reviewed handoffs.
