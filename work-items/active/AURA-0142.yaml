id: AURA-0142
title: Add Core generated text artifacts
status: approved
change_class: feature
intent: >
  Implement the Core-owned generated text artifact aggregate, immutable
  revisions, owner-authorized read and deletion use cases, and a dedicated
  least-privilege aura-artifacts Garage binding without adding research
  coordination, Task Center behavior, user uploads, or frontend surfaces.
