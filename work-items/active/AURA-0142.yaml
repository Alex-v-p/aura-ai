contracts:
  changes_allowed: false
  affected:
    - Aura v1 generated artifact list detail revisions preview download deletion cleanup retry and reconciliation resources
    - Generated artifact lifecycle events v1
    - Internal Core generated-artifact create and append-revision application boundary
  compatibility_requirement: none
data:
  migration_required: true
  owning_service: aura-core
  owning_module: artifacts.generated
observability:
  applicable: true
  affected_components:
    - aura.artifacts.persistence@1
    - aura.artifacts.deletion@1
  required_metrics:
    - artifact_write_outcome_count
    - artifact_write_latency_ms
    - artifact_deletion_outcome_count
    - artifact_deletion_latency_ms
  required_evaluators:
    - generated_artifact_integrity@1
    - generated_artifact_authorization@1
    - generated_artifact_deletion_truth@1
    - generated_artifact_privacy@1
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Artifact titles content provenance citations digests filenames object keys owner lineage and linked task run conversation or workspace values are owner-private and prohibited from URLs logs ordinary telemetry metadata-only events browser persistence and Observatory.
    - Markdown preview must reject raw HTML scripts remote embeds unsafe links and executable content; JSON and plain text previews remain inert bounded no-store responses.
    - Every list detail revision preview and download request reauthorizes owner scope; downloads use attachment disposition sanitized filenames nosniff and no-store.
    - Create and append accept only system-generated Markdown UTF-8 plain text or canonical JSON within fixed byte limits and must verify SHA-256 and immutable monotonic revision truth.
    - Deletion is CSRF-protected idempotent and expected-version-bound, makes bytes immediately unreadable, and truthfully distinguishes deletion_pending deletion_failed cleanup_unknown and deleted across restart and provider ambiguity.
    - The aura-artifacts Garage identity and bucket must be isolated from documents evaluation and Observatory data, receive no public exposure, and fail closed when credentials grants or bucket identity are wrong.
  data_classes:
    - owner-private generated Markdown plain text and canonical JSON
    - owner-private artifact metadata provenance revision and task run conversation workspace lineage
    - restricted Garage object keys digests byte counts and storage credentials
    - content-free artifact lifecycle events and tombstones
required_agents:
  implementation:
    - core_worker
    - platform_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 6
  max_parallel_writers: 3
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - PostgreSQL additively owns owner scope supported media type lifecycle current revision immutable ordered revision metadata SHA-256 byte count provenance task run conversation and optional workspace lineage idempotency deletion truth and content-free tombstones with bounded columns closed checks indexes positive versions and no cross-domain cascade.
  - Migration 0029_generated_artifacts descends exactly from 0028_workflow_execution, upgrades existing databases without rewriting unrelated rows, and has restart duplicate application integrity and rollback-posture coverage; 0030 remains exclusively AURA-0143.
  - The internal artifacts public application API creates and appends immutable system-generated Markdown plain-text and canonical JSON revisions, computes and verifies SHA-256 before publication, never overwrites bytes, reconciles ambiguous writes by digest, and exposes no public upload or append endpoint.
  - Owner-authorized list detail and revision history are metadata-only; bounded previews enforce server-side type validation and inert sanitization; downloads reauthorize and emit no-store nosniff safe attachment responses.
  - Deletion acceptance under optimistic version and idempotency makes preview and download unavailable immediately, schedules durable object cleanup, treats missing objects as absent, preserves content-free lineage and integrity truth, and exposes separate retry for known failure and reconciliation for unknown outcome without resurrection.
  - A dedicated aura-artifacts Garage bucket and least-privilege Core identity are provisioned idempotently; topology tests prove no access to aura-documents evaluation or Observatory buckets and no artifact credentials reach browsers provider services scheduler or Observatory.
  - Garage unavailability timeout partial write digest mismatch restart duplicate completion delete race and ambiguous cleanup tests preserve PostgreSQL truth and never publish a false revision or false deletion success.
  - Generated-artifact lifecycle events match the AURA-0141 metadata-only schema and contain only identifiers lifecycle versions timestamps correlation and causation; private metadata content digest and object references are unrepresentable.
  - aura.artifacts.persistence@1 and aura.artifacts.deletion@1 implement the exact typed boundaries spans dependencies units finite dimensions outcomes errors trace-only correlation capture replay and retention rules from the approved design; privacy and cardinality tests reject content identifiers and exception text.
  - The route module implements every AURA-0141 artifact read deletion cleanup and reconciliation operation and is independently testable; AURA-0143 alone owns final app state router database and worker composition so the two parallel tickets never edit a shared composition file.
  - No research coordinator provider task projection frontend Observatory public upload binary PDF image archive code execution automatic retention protected baseline contract or generated-client change occurs.
