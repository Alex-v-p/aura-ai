security_privacy:
  applicable: true
  concerns:
    - The projection is owner-private metadata only and must exclude research questions URLs excerpts reports artifact titles document names workflow inputs outputs instructions reminder text object keys provider payloads owner identity and credentials.
    - The nondelegable task_projection:read capability is available only to the projection reconciler; ordinary principals and other modules cannot enumerate source snapshots.
    - Live and rebuild paths must use the same source public query and DTO, never import another domain persistence mapping repository adapter ORM model or table, and never infer owner identity from an invalidation.
    - At-least-once duplicate reordered stale missing and version-gap invalidations must not regress source version leak cross-owner rows or fabricate terminal truth.
    - Cancel and retry are advertised only by authoritative source capabilities and route through that source public command with CSRF idempotency and expected-version checks; ambiguous outcomes remain unknown until reconciliation.
    - Metadata-only SSE must be bounded owner-filtered no-store and reconcilable through REST without private display values or command authority.
  data_classes:
    - owner-private task projection metadata and source display status
    - metadata-only source kind identifier version invalidations
    - nondelegable internal projection capability
    - content-free task SSE identifiers status versions and timestamps
