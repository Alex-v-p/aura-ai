  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 6
  max_parallel_writers: 2
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - PostgreSQL stores a rebuildable projection keyed by source_kind and source_id with owner scope normalized status authoritative source status and outcome bounded progress stages capabilities timestamps deep-link route keys source version projection version and content-free recovery truth; no source business state moves into execution.tasks.
  - Migration 0030_task_projection descends exactly from 0029_generated_artifacts, preserves the single Alembic head, adds bounded checks indexes and version uniqueness without cross-domain foreign keys or cascades, and passes ordered upgrade restart duplicate and rollback-posture tests.
  - Workflow instances briefing occurrences document processing and memory reindexing expose the same closed TaskProjectionSnapshotQueryV1 and TaskProjectionSnapshotV1 through their public application APIs under task_projection:read; source-owned implementations may read only their own persistence.
  - Research is a registered source kind but no research row or adapter is fabricated before AURA-0145 supplies its source-owned public snapshot implementation; an unavailable source remains absent or unknown according to the contract.
  - Identifier-and-version-only invalidation consumers call the source snapshot API to resolve owner and metadata, upsert only a strictly newer source version, handle duplicates reorder gaps unavailable snapshots and deletion tombstones idempotently, and never copy private source content into events or the projection.
  - Backfill and rebuild page every included source through the identical public query used for live reconciliation, persist resumable cursors, tolerate restart and duplicate pages, remove or tombstone stale rows only after a completed source pass, and converge byte-for-byte with live projection for the same snapshots.
  - Task list detail and metadata-only SSE implement the AURA-0141 filters normalized groups authoritative source outcome progress capabilities pagination replay and no-store semantics with owner authorization and REST reconciliation after gaps.
  - Cancel and retry route only through advertised source public commands with owner authorization CSRF idempotency expected source version and unknown-outcome reconciliation; retry creates or identifies source-owned retry truth and never resets a projection row.
  - Research partial budget_exhausted failed and interrupted map to failed while retaining authoritative outcome; draining maps to running; source-specific waiting maps only from a real authoritative wait lifecycle; projection ambiguity maps to unknown.
  - aura.execution.task_projection@1 implements the exact typed boundary task_projection.reconcile span source_snapshot_api and Core PostgreSQL dependencies millisecond units closed dimensions outcomes errors trace-only correlation metadata-only capture deterministic replay and retention rules from the approved design.
  - Architecture tests fail on imports of source persistence repository adapters ORM models or tables from execution.tasks and prove source public APIs do not accept ordinary owner capabilities for projection enumeration.
  - The Integration Maintainer owns the only edits to database.py API app.py API state.py and worker app.py, mounts the already-reviewed AURA-0142 artifacts route/service plus AURA-0143 task route/consumer mechanically, and adds no artifact or task business rules to entrypoints.
  - No generic workflow engine research coordinator provider service reminder approval calendar event ordinary conversation run frontend Observatory contract generated-client dependency lock deployment protected baseline or source-authority migration occurs.
