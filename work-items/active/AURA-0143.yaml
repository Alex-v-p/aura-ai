id: AURA-0143
title: Add the federated durable task projection
status: approved
change_class: feature
intent: >
  Implement an execution-owned owner-private Task Center read projection over
  source-owned public snapshot APIs, with idempotent invalidation, backfill,
  rebuild, list, detail, stream, cancellation, and retry behavior while keeping
  every source domain authoritative and prohibiting cross-domain table access.
