    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/design/governed-research-artifacts-and-tasks.md
    - docs/specifications/agents-and-execution.md
    - docs/specifications/memory-and-knowledge.md
    - docs/specifications/tools-automation-and-integrations.md
    - docs/design/failure-and-recovery-states.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0018-governed-web-research-providers.md
    - work-items/archived/AURA-0140.yaml
    - work-items/archived/AURA-0141.yaml
    - Task invalidations contain source kind source identifier and source version only; live and rebuild consumers call the same source-owned public snapshot query under the narrow nondelegable task_projection:read capability.
    - Migration 0030_task_projection descends from AURA-0142 migration 0029_generated_artifacts to preserve the single Core Alembic head; domain work may proceed in parallel but migration validation is ordered.
    - AURA-0143 exclusively owns shared Core database API state router and worker composition for the AURA-0142 and AURA-0143 slices.
    - ADR-0013's existing Core platform transactional outbox is the sole durable task-source invalidation journal. Each source stages the schema-exact TaskSourceInvalidated v1 envelope through its source-owned lifecycle port and a bootstrap-composed SqlOutboxRepository adapter in the same database transaction as the authoritative mutation. The platform relay publishes only after commit. Execution consumes the dedicated JetStream subject with a durable consumer and acknowledges only after reconciliation. Source repositories never read or write platform outbox persistence or execution tables directly.
    - Migration 0030_task_projection remains exclusively execution.tasks-owned and contains no source-authority column task_source_invalidations table or source checkpoint table. Migration 0031_memory_reindex_task_version descends from 0030 is knowledge.memory-owned adds and backfills a positive monotonic lifecycle version on memory_embedding_generations and drops it on downgrade. No other source-authority schema change is authorized.
    - Each source cursor is an opaque source-owned token containing an immutable pass high-water fence and the last emitted immutable created_at and id keyset. Execution persists and returns the token unchanged in task_projection_rebuilds. Source updates cannot alter ordering membership. Existing source created_at and id columns are used so the fence requires no source schema migration.
    - The Core Worker owns source public seams projection persistence routes and handlers; the Test and Evaluation Engineer owns independent consistency race privacy architecture and instrumentation cases; only the Integration Maintainer performs shared composition after both Core handoffs are reviewed.
    - On the shared feature branch domain work may run beside AURA-0142 and AURA-0144 because their writable paths are disjoint, but 0030 migration validation waits for reviewed 0029 and shared composition waits for the AURA-0142 handoff.
