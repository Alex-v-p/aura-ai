id: AURA-0022
title: Refine Aura Web sidebar scrolling and conversation navigation
status: approved
change_class: bugfix
intent: >
  Make Aura Web navigation visually distinct and always reachable, keep the
  sidebar stable while long conversations scroll, restore wheel scrolling over
  conversation content, and navigate directly to a selected conversation.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
  decisions:
    - User-approved Sidebar Conversation Navigation and Persona Override Workstream
    - Primary destinations use three compact tiles when expanded and remain icon-only controls when collapsed
    - The main conversation canvas owns desktop vertical scrolling
    - Each requested fix receives a separate reviewed checkpoint
  contracts: []
feature_references:
  - AUI-005
  - AUI-008
  - AUI-009
ownership_zones:
  - frontend.aura-web.shell
  - frontend.aura.interaction.conversations
  - frontend.aura-web.e2e
allowed_paths:
  - work-items/active/AURA-0022.yaml
  - work-items/archived/AURA-0022.yaml
  - frontend/apps/aura-web/**
  - frontend/apps/aura-web-e2e/**
  - frontend/apps/storybook/**
  - frontend/libs/aura/interaction/conversations/**
  - frontend/libs/shared/layout/**
forbidden_paths:
  - AGENTS.md
  - .agents/**
  - .codex/**
  - .github/**
  - contracts/**
  - services/**
  - tooling/architecture/**
  - docs/architecture/**
  - docs/adr/**
  - docs/specifications/**
  - evaluations/**
  - deploy/**
  - compose.yaml
  - infra/**
  - satellites/**
  - extensions/**
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - Conversation identifiers in routes remain owner-authenticated and do not bypass API authorization
    - Navigation failures preserve drafts and do not expose conversation content
  data_classes:
    - conversation identifiers
required_agents:
  implementation:
    - frontend_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 3
  max_parallel_writers: 2
  model_tier: balanced
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Conversations Agents and Personas are visually distinct compact destinations and remain available in collapsed desktop mode.
  - Long transcripts do not move sidebar header navigation or theme controls outside the viewport and only the recent-conversation list scrolls inside the sidebar.
  - Wheel trackpad keyboard and touch scrolling work while the pointer is over conversation content and the composer remains usable.
  - Selecting a recent conversation from any route navigates and selects it in one action with direct-link refresh and browser-history support.
  - Creating a draft navigates to the conversation screen and the URL is replaced with the persisted identifier after first acceptance.
  - Invalid conversation routes recover safely without discarding an unrelated draft.
  - Mobile drawer focus reduced-motion and responsive behavior remain intact.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0022.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0022.yaml
  - pnpm --dir frontend run lint
  - pnpm --dir frontend run test
  - pnpm --dir frontend run build:production
  - pnpm --dir frontend run build-storybook
  - pnpm --dir frontend exec playwright test --config playwright.config.ts
  - python3 tooling/architecture/validate-frontend-boundaries.py
  - git diff --check
baseline_changes_allowed: false
human_approval_required: true
open_decisions: []
