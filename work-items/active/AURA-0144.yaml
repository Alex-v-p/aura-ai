acceptance_criteria:
  - Closed JSON Schema 2020-12 provider contracts version search fetch cancellation limits health results and bounded errors; reject additional properties content-derived diagnostics and unversioned payloads; Core clients and both services pass the same conformance fixtures.
  - Core signs short-lived request envelopes with the signing key while providers receive only the public verification key, enforce expiry audience method limits and replay identifiers, and never treat signature verification as destination or caller authorization.
  - SearXNG static and browser providers are separately deployable and independently disabled by default; only the Core worker provider-client network reaches inbound listeners, and no provider reaches Core or Observatory databases Valkey NATS Garage internal APIs host network metadata endpoints or container sockets.
  - SearXNG may reach only configured public HTTPS search engines and controlled DNS; each fetcher may reach only controlled DNS and validated public HTTPS port 443 targets, with network-policy and application tests covering IPv4 IPv6 literals encodings aliases mixed answers rebinding and public-to-private redirects.
  - Static retrieval uses HTTPX with manual redirects and Trafilatura extraction, at most five redirects, a 20-second deadline, 8 MiB transferred or decompressed bytes, 256 KiB extracted UTF-8 text, four concurrent fetches, and only text/html application/xhtml+xml and text/plain with declared and sniffed agreement.
  - Browser retrieval uses isolated Playwright only for explicit browser dispatch, has a 45-second deadline 8 MiB response bound 256 KiB extracted text two-page concurrency, returns no screenshot archive cookies storage or executable output, and destroys each ephemeral profile and temporary byte set at settlement.
  - SearXNG has a 15-second deadline at most twenty candidates eight-search concurrency and the ADR-0018 CPU memory PID and tmpfs ceilings; static and browser services enforce their exact ADR ceilings and fail closed when configured above them.
  - All provider containers run non-root with read-only roots dropped capabilities no-new-privileges restrictive seccomp private noexec nosuid nodev tmpfs bounded PIDs CPU memory and concurrency, digest-pinned reviewed images, no host device socket or credential mounts, and truthful readiness liveness and degraded health.
  - Independent search static and browser switches reject new dispatch while disabled; graceful draining and immediate stop transports expose truthful accepted rejected canceled timeout or unknown outcomes without creating research lifecycle truth inside providers.
  - aura.research.search@1 aura.research.static_fetch@1 aura.research.browser_fetch@1 and aura.research.extraction@1 implement the exact typed boundaries spans dependencies units finite dimensions outcomes errors trace-only correlation capture replay and retention rules from the approved design; production content and targets are never captured.
  - Security evaluation covers SSRF DNS rebinding redirect loops userinfo ports downgrade MIME confusion polyglots decompression and size limits browser escape downloads persistence credential filesystem environment socket probes replay expiry malformed signatures resource exhaustion hostile prompt injection Observatory outage and content leakage with the approved pass thresholds.
  - The research provider overlay composes with compose.yaml without modifying it, keeps all services disabled unless their explicit profiles and switches are selected, and provides health and topology tests that require no usable secrets in source or rendered configuration.
  - The Integration Maintainer updates tooling/architecture/modules.yaml only after AURA-0142 and AURA-0143 module names stabilize, registering all three parallel slices without changing their product behavior; no other ticket may edit that registry concurrently.
  - No research task admission coordinator evidence persistence citation synthesis artifact Task Center frontend Observatory public API event generated-client migration protected baseline authenticated browsing HTTP destination arbitrary binary PDF archive image or cloud research provider behavior occurs.
