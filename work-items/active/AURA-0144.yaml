security_privacy:
  applicable: true
  concerns:
    - Core and providers independently permit only public HTTPS port 443 destinations, revalidate every DNS answer and redirect immediately before connection, reject mixed answers userinfo alternate schemes and prohibited IPv4 and IPv6 ranges, and pin the validated connection while preserving TLS hostname validation.
    - Static and browser services receive no Aura session owner provider database NATS Valkey Garage cloud proxy browser-profile signing or shared secret; they receive only bounded signed envelopes and a public verification key and reject expiry replay and contract mismatch.
    - Provider output is untrusted evidence and cannot modify instructions policy permissions grants budgets tools provider selection lifecycle transitions artifact authorization or memory.
    - Declared and sniffed MIME types must agree within the closed HTML XHTML and plain-text allowlist; redirects transferred and decompressed bytes extracted text execution time concurrency and candidate counts are hard bounded.
    - Browser execution is non-root read-only capability-dropped no-new-privileges seccomp-confined and ephemeral with no downloads extensions devices clipboard geolocation notifications service-worker persistence cross-request cache host device or socket mounts.
    - Search and fetch diagnostics telemetry health responses and evaluator output must exclude query target URL domain content excerpt browser state provider request ID signature and exception text.
  data_classes:
    - owner-private search queries and seed target URLs in transient bounded requests
    - hostile fetched public web bytes and bounded extracted text
    - short-lived opaque signed provider envelopes and replay identifiers
    - content-free provider health limits outcomes and telemetry
