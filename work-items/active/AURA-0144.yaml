id: AURA-0144
title: Deploy isolated governed research providers
status: approved
change_class: repository_governance
intent: >
  Add closed versioned internal provider transports, Core-side clients, and
  separately deployable SearXNG, static HTTPX and Trafilatura, and Playwright
  browser providers with no Aura credentials, strict destination and resource
  controls, isolated deployment, disabled defaults, and truthful health.
