    - work-items/archived/AURA-0140.yaml
    - work-items/archived/AURA-0141.yaml
    - ADR-0018 explicitly authorizes three separate provider deployables; this item closes the remaining provider-internal versioned transport contract gap and does not require another ADR.
    - Research provider deployment is an opt-in Compose overlay; search static fetch and browser fetch remain independently disabled and unreachable from Aura Web by default.
    - AURA-0144 owns tooling/architecture/modules.yaml after AURA-0142 and AURA-0143 module names stabilize, avoiding parallel registry edits.
    - The Contract Steward owns provider schemas and conformance fixtures; the Core Worker owns inward clients and settings seams; the Platform Worker owns isolated services dependency locks deployment policy and final registry reconciliation; the Test and Evaluation Engineer owns independent hostile-network sandbox privacy limit and instrumentation suites.
    - On the shared feature branch provider work may run beside both Core tickets because it uses an overlay and distinct service roots; the Integration Maintainer alone updates modules.yaml after reviewed AURA-0142 and AURA-0143 handoffs and then runs aggregate architecture validation.
