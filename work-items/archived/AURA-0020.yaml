contracts:
  changes_allowed: true
  affected:
    - aura-openapi-v1
  compatibility_requirement: backward_compatible
data:
  migration_required: true
  owning_service: aura-core
  owning_module: interaction.agents-personas-and-conversations
observability:
  applicable: true
  affected_components:
    - aura.interaction.agent_configuration
    - aura.runtime.prompt_compilation
    - aura.execution.run_coordinator
    - aura.interaction.conversation_persistence
  required_metrics:
    - operation_duration_ms
    - prompt_compile_duration_ms
    - prompt_component_count
    - compiled_prompt_size
    - configuration_outcome
  required_evaluators: []
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - All configuration remains restricted to the configured owner authorization boundary
    - Agent and persona instructions are private configuration and must not enter logs telemetry audit metadata or error payloads
    - Platform and governance prompt components remain immutable and non-user-editable
    - A persona must not grant permissions or override deterministic governance
    - Agent switching requires explicit confirmation before the full completed transcript is transferred to the selected configuration
    - Disabled agents cannot start or retry runs while already committed queued or running work retains its pinned revision
    - Idempotency CSRF optimistic versioning and audit apply to every mutation
  data_classes:
    - private agent instructions and purpose
    - private persona instructions and description
    - conversation assignment history
    - prompt revision identifiers and hashes
    - authenticated principal identifiers
required_agents:
  implementation:
    - contract_steward
    - core_worker
    - frontend_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 4
  max_parallel_writers: 4
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Aura and Neutral are deterministically seeded as immutable revisioned records and existing conversations and runs retain their identifiers and behavior after migration.
  - The configured owner can list create inspect revise enable and disable agents and personas through authenticated CSRF-protected idempotent APIs.
  - Agent and persona revisions are immutable and existing conversations never adopt a newer revision automatically.
  - New conversations may select an active agent revision while omitted selection remains compatible and defaults to Aura revision 1.
  - A conversation can explicitly switch to any active agent revision or upgrade revisions only while no run is active and the change creates ordered assignment history.
  - The web UI confirms that the full completed transcript will be shared before a switch and shows a trusted transition marker at the recorded boundary.
  - A disabled current agent leaves history and drafts readable but blocks new runs and retries until it is re-enabled or an active replacement is selected.
  - Already queued or running work completes using its pinned revision and a historical retry uses its original revision when that agent remains active.
  - Prompt compilation uses the fixed platform governance agent and persona order and records stable component revisions and SHA-256 provenance without exporting prompt content.
  - Model selection remains explicit per conversation and no model tool memory execution delegation household or deletion policy editor is introduced.
  - The Angular shell exposes accessible Conversations Agents and Personas routes with responsive selectors forms status controls revision history and failure recovery.
  - Configuration changes switches and upgrades emit identifier-only audit and metadata-only telemetry for the declared components and metrics.
  - The OpenAPI additions remain backward compatible and the generated TypeScript client is synchronized from the contract.
