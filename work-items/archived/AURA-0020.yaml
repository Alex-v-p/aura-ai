id: AURA-0020
title: Add versioned agents personas and conversation assignment
status: integrated
change_class: contract
intent: >
  Let the configured Aura owner create and revise agents and reusable personas,
  select an immutable agent revision for a conversation, explicitly switch or
  upgrade that assignment with full-transcript confirmation, and preserve
  prompt provenance without exposing prompt content.
