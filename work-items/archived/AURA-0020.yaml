  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/agents-and-execution.md
    - docs/specifications/clients-and-voice.md
    - docs/specifications/open-decisions.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - User-approved Versioned Agents and Personas Workstream
    - Guided configuration exposes display name purpose instructions persona and enabled state only
    - Existing conversations adopt revisions only through an explicit switch or upgrade
    - Agent switching is permitted when no run is active and shares the full completed transcript after confirmation
    - Disabled agents retain readable history and block new runs and retries until replacement or re-enable
    - Model selection remains explicit per conversation with no silent fallback
