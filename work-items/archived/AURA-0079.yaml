id: AURA-0079
title: Export Core telemetry and deploy the isolated Observatory stack
status: integrated
change_class: repository_governance
intent: >
  Export already-redacted Core telemetry through an optional independent OTLP
  path and deploy an opt-in owner-only Observatory stack whose absence or
  failure cannot affect normal Aura operation.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/open-decisions.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-approved Observatory is an opt-in Compose profile with a separate Authentik client audience owner subject and session boundary.
    - Owner-approved Observatory state uses the existing encrypted state-root and file-injected secret standard with no application field encryption.
  contracts:
    - contracts/telemetry/v1/metadata-observation.schema.json
feature_references:
  - OBS-001
  - OBS-003
  - OBS-004
  - OBS-005
  - OBS-025
  - OBS-038
  - OBS-039
