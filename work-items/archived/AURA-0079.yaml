contracts:
  changes_allowed: false
  affected:
    - contracts/telemetry/v1/metadata-observation.schema.json
  compatibility_requirement: backward_compatible
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: true
  affected_components:
    - aura.platform.telemetry_export
    - aura.observatory.telemetry_ingestion
  required_metrics:
    - telemetry_export_accepted_count
    - telemetry_export_failure_count
    - telemetry_export_dropped_count
    - telemetry_export_retry_count
    - telemetry_export_duration_ms
  required_evaluators:
    - telemetry_export_metadata_only
    - telemetry_export_failure_isolation
    - observatory_deployment_isolation
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Core exports only fields accepted by the closed metadata observation contract and never exports user content credentials endpoints or owner identity.
    - Structured container logging remains independent and an unavailable Collector cannot delay or fail Core startup readiness requests workers or scheduling.
    - Observatory uses a separate Authentik client audience owner subject session namespace credential and browser origin.
    - Browser sessions use server-side storage HttpOnly cookies explicit SameSite rotation logout clearing and origin-aware CSRF protection.
    - All Observatory state uses the required encrypted state root and credentials are injected through files without source log URL or browser exposure.
    - Observatory databases Collector and ingest boundary remain private and only the browser-facing origin is loopback-published.
  data_classes:
    - operational_metadata
    - opaque_trace_identifiers
    - opaque_run_identifiers
    - deployment_metadata
    - oidc_session_metadata
    - service_credentials
required_agents:
  implementation:
    - core_worker
    - platform_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 8
  max_parallel_writers: 3
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Core retains structured container-log export and optionally fans already-redacted batches to the Collector through an independent bounded background sink.
  - Core export adds only configured deployment git host environment and service-role metadata and produces instances valid under telemetry v1 without user-derived high-cardinality fields.
  - Collector or Observatory outage produces bounded retry drop and health counters while Core startup readiness HTTP worker and scheduler behavior remain successful.
  - An opt-in observatory Compose profile provides Observatory API ingest worker migration PostgreSQL ClickHouse dedicated session storage and OpenTelemetry Collector on isolated networks.
  - Observatory persistent volumes live under AURA_STATE_ROOT and all database OIDC ingest and session credentials use file-backed Compose secrets.
  - Only the Observatory browser origin is loopback-published at observatory.localhost port 4300 and non-disposable configuration requires stable HTTPS and secure cookies.
  - Authentik defines a separate Observatory client audience and callback and Observatory authorizes exactly the configured issuer-subject owner without inventing household roles.
  - Same-origin Observatory BFF login callback session logout and CSRF behavior keeps bearer and refresh credentials server-side and out of browser storage URLs and SSE parameters.
  - The existing Aura stack remains valid without the observatory profile and no Core database schema frontend feature evaluation judge alert or telemetry content capture is added.
