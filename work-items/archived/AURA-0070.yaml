id: AURA-0070
title: Add governed conversational document retrieval and citations
status: integrated
change_class: repository_governance
intent: >
  Let the built-in Aura agent search the authenticated owner's ready document
  library through one bounded read-only tool and return validated, accessible
  document citations, while treating all retrieved text as untrusted evidence,
  preserving the one-tool-call run budget, and keeping custom agents denied by
  default.
