acceptance_criteria:
  - The registry exposes exactly one additive document.search@1 read tool with a closed query-only input and bounded hybrid result schema containing opaque evidence identifiers document identifiers display names excerpts and page-or-section locators.
  - The run coordinator binds document search to the admitted principal and ready library fixes retrieval and context limits server-side and preserves the existing maximum of one tool call followed by one tools-disabled synthesis request.
  - Failed deleting deleted and cross-owner documents cannot produce tool evidence citations preview or download access and no raw object path is reachable from the tool.
  - A new immutable built-in Aura tool-policy and agent revision grant document.search@1 alongside historical grants without modifying older rows conversations or revisions and without granting any custom agent.
  - Assistant message and run response contracts add optional structured document citations that contain only document identity display label and bounded page-or-section locator while remaining backward compatible for historical messages and clients.
  - Core accepts citations only when their opaque evidence identifiers were returned by document.search@1 in the same run discards malformed invented stale and duplicate markers and records only metadata-safe validation outcomes.
  - Document excerpts are rendered to the model as bounded explicitly delimited untrusted evidence and embedded instructions cannot widen grants change policy trigger tools affect system behavior or enter automatic long-term memory extraction.
  - Aura Web renders validated citations as keyboard-accessible source links constructed from document identifiers to the authorized /documents/:id detail route with readable locator text and without placing private data in URLs durable browser storage caches logs or telemetry.
  - Labelled PDF DOCX Markdown and plain-text fixtures measure document recall chunk recall ranking citation validity irrelevant-context rate and prompt-injection resistance without lowering existing thresholds or protected baselines.
  - Metadata-only manifests telemetry and evaluations distinguish search success empty unavailable denied invalid-citation and injection-resistance outcomes without capturing query filename excerpt content owner credential object key embedding prompt response or provider payload.
  - Full-stack acceptance uploads each supported format waits for ready asks Aura a grounded question opens its citation deletes the document and verifies that it is no longer searchable downloadable or citable.
  - No filesystem SMB Nextcloud URL source OCR image interpretation XLSX PPTX sharing version history conversation attachment automatic memory extraction new service package framework or tool-call-budget increase is introduced.
