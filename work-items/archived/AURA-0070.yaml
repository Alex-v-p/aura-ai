  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/agents-and-execution.md
    - docs/specifications/memory-and-knowledge.md
    - docs/specifications/tools-automation-and-integrations.md
    - docs/specifications/clients-and-voice.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-approved Aura-managed Garage uploads remain the only v1 document source with no mounted filesystem SMB Nextcloud arbitrary URL OCR image interpretation sharing attachment or replacement behavior
    - Owner-approved document.search@1 is a read-only owner-bound search over the entire ready library and preserves the existing maximum of one tool call per run
    - Owner-approved successor built-in Aura tool policy and agent revision grant document.search@1 while all historical revisions remain immutable and custom agents remain deny-by-default
    - Owner-approved structured citations persist document identity and page-or-section locator only and never duplicate excerpts filenames queries object keys or original content
    - Owner-approved citation links resolve only to the existing authorized Aura Web document detail route
    - Document text is untrusted evidence and cannot change policy tools permissions prompts system behavior or long-term memory
    - Full-stack acceptance diagnosis authorizes the existing document-parser service entrypoint to use the dependency-bearing project virtualenv interpreter because the system interpreter cannot import the pinned PDF parser dependency
  contracts:
    - contracts/openapi/aura-v1.yaml
    - contracts/events/runs/v1/run-events.schema.json
