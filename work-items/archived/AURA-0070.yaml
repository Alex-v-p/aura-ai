  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - document.search@1 fixes the owner from the admitted run and cannot accept an owner document identifier raw-object request lifecycle override or caller-selected result limit.
    - Only ready owner documents can produce evidence; failed deleting deleted and cross-owner documents remain unavailable without existence disclosure.
    - Queries excerpts filenames original content object keys embeddings owner identity provider payloads prompts responses and hidden reasoning never enter events audit metadata logs traces metrics or evaluation capture.
    - Retrieved document text is explicitly delimited untrusted evidence and cannot create grants invoke another tool alter system or policy instructions or write long-term memory.
    - Citation markers are accepted only for opaque evidence identifiers returned by document.search@1 during that exact run; invalid invented stale duplicate or malformed identifiers are discarded.
    - Persisted citations contain only document identity and bounded page-or-section locator; Aura Web constructs authorized internal links and never trusts model-provided URLs.
    - Historical agent and tool-policy revisions remain immutable and custom agents receive no automatic grant.
    - Authenticated citation targets and document responses remain outside Workbox caches IndexedDB localStorage sessionStorage URLs logs and browser telemetry.
  data_classes:
    - private_document_content
    - private_document_filename_and_metadata
    - private_document_query_and_excerpt
    - private_document_embeddings
    - owner_identity
    - run_scoped_evidence_identifiers
    - metadata_only_document_citations
