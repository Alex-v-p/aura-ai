id: AURA-0108
title: Converge Observatory ingest visibility snapshots
status: integrated
change_class: bugfix
intent: >
  Make Observatory run and trace detail snapshots obey the same committed
  ingest visibility fence as run lists, and durably reconcile stale pending
  receipts whose observation is already present in ClickHouse so response-loss
  crash windows converge without requiring producer redelivery.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - work-items/archived/AURA-0078.yaml
    - work-items/archived/AURA-0080.yaml
    - PostgreSQL receipt status lease timestamps immutable ingest sequence visibility ledger and committed watermark remain the Observatory-owned consistency authority; ClickHouse remains the high-cardinality observation store.
    - The existing ingest worker performs one bounded reconciliation pass at startup and repeats it on a bounded configurable cadence; no new deployable queue transport or service is introduced.
    - Reconciliation considers only stale pending receipts with an assigned ingest sequence. It confirms ClickHouse presence by both stable observation identifier and ingest sequence before atomically and idempotently marking the visibility slot and receipt complete in PostgreSQL.
    - A stale pending receipt with no matching ClickHouse row remains pending without lease renewal so normal at-least-once redelivery can reclaim it after the existing lease. Reconciliation never fabricates an observation skips a missing visibility gap or classifies missing content as delivered.
    - Multiple ingest workers may scan concurrently. Conditional PostgreSQL state checks and the existing visibility-watermark lock must make completion race-safe idempotent and contiguous even when ClickHouse observations arrive or reconcile out of order.
    - Run and trace detail reads use the committed PostgreSQL watermark as a ClickHouse ingest-sequence fence. The first page fixes the detail snapshot and continuation pages preserve that fence while remaining compatible with existing opaque cursors.
    - Existing receipt visibility and watermark columns are sufficient. No migration or public contract change is authorized; implementation evidence requiring either returns to planning rather than expanding this item.
    - The existing AURA-0078 exact component-manifest catalogue regression is updated only to recognize the two authorized reconciliation metrics on telemetry ingestion and storage; it must retain exact equality and reject undeclared metric drift.
    - AURA-0098 retains ownership of composed full-stack resilience acceptance. This item is limited to the ingest convergence defect and focused production-adapter recovery evidence.
  contracts:
    - contracts/openapi/observatory-v1.yaml
    - contracts/telemetry/v2/metadata-observation.schema.json
