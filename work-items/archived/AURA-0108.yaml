acceptance_criteria:
  - ProductionObservatoryStore run and trace detail queries apply ingest_sequence less than or equal to the committed PostgreSQL visibility watermark, matching the run-list snapshot boundary and excluding rows that exist in ClickHouse but are not committed visible.
  - The first run or trace detail page fixes a visibility snapshot and every continuation page stays at that snapshot even if later observations become visible; existing opaque cursors remain accepted and the observatory-v1 response schemas do not change.
  - The existing Observatory ingest worker runs a bounded reconciliation pass on startup and a bounded periodic cadence using validated batch interval and lease settings without adding a deployable or blocking normal ingestion.
  - A reconciliation pass selects only stale pending receipts with an assigned immutable ingest sequence and uses a bounded ClickHouse existence lookup that requires the matching observation identifier and ingest sequence.
  - When ClickHouse already contains the matching observation, reconciliation atomically and idempotently marks its visibility entry and receipt complete in PostgreSQL and advances the committed watermark only across contiguous visible sequences.
  - When ClickHouse does not contain the matching observation, the receipt remains pending and redeliverable without renewing its stale lease marking its visibility slot or advancing the watermark.
  - Concurrent workers stale-lease redelivery and reconciliation races cannot double-complete a receipt regress or skip the watermark resurrect retention-deleted state or classify a genuinely missing ClickHouse row as delivered.
  - An exact crash-after-ClickHouse-insert and before-visibility-mark test proves restart recovery without a second producer delivery while preserving the stable deduplication token and one visible ClickHouse observation.
  - Out-of-order recovery marks later present rows visible without advancing past an earlier missing sequence; after the earlier row is redelivered the watermark advances through all contiguous visible entries and list run detail and trace detail agree.
  - Recovery survives worker cancellation and restart, bounds each pass and provider timeout, reports failures without terminating the worker, and leaves unresolved work available for a later pass or producer redelivery.
  - Reconciliation count uses only a closed finite outcome label set covering completed missing raced and failed work; duration visibility-lag backlog and oldest-backlog health remain bounded metadata-only signals and converge after successful recovery.
  - The AURA-0078 component-manifest catalogue regression continues to assert exact metric equality and admits observatory_ingest_reconciliation_count and observatory_ingest_reconciliation_duration_ms only for the telemetry-ingestion and telemetry-storage manifests.
  - Existing metadata-observation validation authentication retention query pagination SSE ordering and service-isolation behavior remain compatible; no Core Aura Web Observatory frontend contract migration dependency or protected baseline changes are introduced.
