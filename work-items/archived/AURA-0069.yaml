acceptance_criteria:
  - Aura OpenAPI additively exposes an owner-authorized GET /api/v1/documents/{document_id}/preview resource whose ready-only response contains no more than 20000 characters of sanitized extracted text plus bounded truncation metadata and whose generated client stays synchronized.
  - Core obtains preview text through the knowledge.documents public API and repository using stable chunk order owner and ready-state checks no raw-object fetch and metadata-only retrieval telemetry.
  - Aura Web exposes a grouped Knowledge destination named Documents with /documents and UUID-only /documents/:id routes while product behavior remains in the dedicated aura-documents feature library.
  - The upload surface supports keyboard file selection drag and drop progress cancellation supported-format guidance and exact 100000000-byte client validation without buffering the entire file in browser code.
  - Upload creation and streaming preserve CSRF idempotency expected-version content-length and content-type requirements and distinguish known rejection cancellation duplicate success recoverable failure unknown outcome and object-store unavailability.
  - The searchable collection shows readable filename type size upload time and uploading queued processing ready failed or deleting state with polling that stops on terminal state session reset navigation teardown or cancellation.
  - Duplicate upload success selects the existing document and communicates that Aura already has the content without creating a second apparent record.
  - Route-backed detail shows metadata a plain-text bounded preview for ready documents an authorized ephemeral original download retry for retryable failure and an explicit focus-managed permanent-delete confirmation.
  - Deleting documents disappear from ordinary active search immediately while asynchronous deletion or retryable cleanup failure is represented honestly and never enables download preview or search access.
  - Empty initial-loading filtered-empty authentication permission offline object-store-unavailable parse-failure upload-canceled conflict unknown-outcome and deletion-retry states use calm plain language semantic status and a safe next action.
  - Search text filenames file bodies previews and authenticated responses never enter URLs Cache Storage IndexedDB localStorage sessionStorage console logs browser telemetry or reusable Storybook and test artifacts.
  - The static-shell service worker continues to bypass all /api/ traffic and non-GET requests and automated tests prove document list preview download search and upload traffic cannot populate its cache.
  - Session and principal changes synchronously clear all private document state file references object URLs drafts progress idempotency and stale responses before accepting the replacement session.
  - Keyboard drag-and-drop parity visible focus accessible labels live progress status focus restoration reduced motion 200 percent zoom reflow and axe checks cover collection upload detail preview download retry and deletion confirmation at desktop tablet and mobile widths.
  - Light and dark Storybook states cover empty loading ready processing duplicate failed unavailable detail preview and deletion confirmation using only existing semantic tokens and generic shared components.
  - No conversational document tool citation memory extraction document sharing replacement history attachments OCR image interpretation mounted source arbitrary URL new package framework service migration or durable browser storage is introduced.
