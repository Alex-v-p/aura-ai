security_privacy:
  applicable: true
  concerns:
    - Original files filenames extracted previews search text and owner identity are private and must not enter durable browser storage URLs logs telemetry caches stories snapshots or ordinary diagnostics.
    - Every list inspect search preview download retry and delete operation remains owner-scoped and cross-owner identifiers resolve without existence disclosure.
    - The preview resource is available only for ready documents returns at most 20000 characters and uses Cache-Control no-store without exposing chunks embeddings object keys or credentials.
    - Search remains a POST body operation so private queries never enter route parameters or query strings.
    - Upload uses the File body directly without whole-file arrayBuffer conversion and cancellation aborts the in-flight browser request without representing an uncertain server outcome as success.
    - Upload create content retry and delete mutations use accepted-session CSRF same-origin idempotency and exact optimistic versions with reconciliation after uncertain outcomes.
    - Temporary download object URLs are revoked and authenticated document responses are excluded from Cache Storage IndexedDB localStorage sessionStorage URLs and browser telemetry.
    - Session or principal changes clear documents previews search text file references progress mutation state CSRF idempotency state object URLs and stale request generations.
    - Document content remains untrusted evidence and is rendered only as plain text without HTML Markdown execution links or instruction authority.
  data_classes:
    - private_document_content
    - private_document_filename_and_metadata
    - private_document_search_text
    - owner_identity
    - document_and_processing_identifiers
