id: AURA-0069
title: Add the Aura Web document library experience
status: integrated
change_class: repository_governance
intent: >
  Add a calm responsive Knowledge Documents workspace for owner-private uploads,
  processing visibility, search, inspection, bounded extracted-text preview,
  authorized download, retry, and permanent deletion while preserving the
  AURA-0068 storage and processing boundaries and keeping private document data
  out of durable browser state, URLs, logs, telemetry, and service-worker caches.
