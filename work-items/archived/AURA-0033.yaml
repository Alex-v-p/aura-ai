id: AURA-0033
title: Add conversation library run inspector and recovery UX
status: integrated
change_class: feature
intent: >
  Let the Aura owner page, find, filter, rename, archive, restore, and inspect
  conversations and their recent runs without losing drafts or exposing private
  execution internals.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/clients-and-voice.md
    - docs/specifications/agents-and-execution.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - User-approved Conversation Productivity Feature Set
    - Use AURA-0032 metadata and list contracts without adding a run-detail endpoint
    - Keep filters in the in-memory application store and out of URLs and offline storage
    - Reuse ConversationDetail recentRuns and existing SSE snapshots
    - Full baseline Playwright remains unchanged; this work item requires its focused new browser suite
    - Responsive browser coverage uses explicit tablet and mobile viewports in the available Chromium project because WebKit host dependencies are unavailable
  contracts:
    - contracts/openapi/aura-v1.yaml
feature_references: [AUI-002, AUI-003, RUN-006, RUN-008, RUN-009, RUN-011]
ownership_zones:
  - frontend.aura.interaction.conversations
  - frontend.aura-web.shell
  - frontend.aura-web.app
  - frontend.aura-web.e2e
  - frontend.storybook
allowed_paths:
  - work-items/active/AURA-0033.yaml
  - work-items/archived/AURA-0033.yaml
  - frontend/libs/aura/interaction/conversations/src/**
  - frontend/apps/aura-web/src/app/shell/**
  - frontend/apps/aura-web/src/app/app.component.ts
  - frontend/apps/aura-web-e2e/src/conversation-productivity.spec.ts
  - frontend/apps/storybook/src/conversation-panel.stories.ts
forbidden_paths:
  - AGENTS.md
  - .agents/**
  - .codex/**
  - tooling/architecture/**
  - docs/architecture/**
  - docs/adr/**
  - docs/specifications/**
  - evaluations/golden-results/**
  - evaluations/**/baselines/**
  - contracts/**
  - services/**
  - frontend/package.json
  - frontend/pnpm-lock.yaml
  - frontend/libs/platform/**
  - frontend/libs/observatory/**
  - frontend/apps/aura-wall/**
  - frontend/apps/observatory-web/**
  - deploy/**
  - compose.yaml
  - infra/**
  - satellites/**
  - extensions/**
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: frontend.aura.interaction.conversations
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: none
security_privacy:
  applicable: true
  concerns:
    - Private title search terms must remain memory-only and absent from URLs logs telemetry and offline storage
    - Run details must exclude prompts hidden reasoning raw provider payloads stack traces leases and worker-attempt internals
    - Archived conversations must remain read-only until restore
    - Error messages and trace references must be sanitized before presentation
  data_classes:
    - private conversation titles and search terms
    - conversation and run metadata
    - sanitized provider error summaries and trace references
required_agents:
  implementation: [frontend_worker, test_evaluation_engineer]
  review: [general_reviewer, security_privacy_reviewer]
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 4
  max_parallel_writers: 2
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - The expanded sidebar fetches 30 conversations per page and exposes an accessible Load more action without eager page draining.
  - Debounced title search plus agent model latest-run-status date and active or archived filters use server query parameters and remain session-memory-only.
  - Accessible row actions rename archive and restore with rejected mutations preserving selection and drafts.
  - A directly opened archived conversation remains visible with a read-only banner Restore action and disabled composer retry and configuration controls.
  - The run-details surface is a right drawer on desktop and modal overlay on narrow screens with focus trap Escape close and focus restoration.
  - Runs render newest-first with approved timing provider model agent persona retry error retryability and trace metadata only.
  - Cancel appears only for the active run and Retry only for failed canceled or interrupted runs while the conversation is active.
  - Drafts and selection survive filtering drawer activity rejected mutations SSE reconciliation reconnects and responsive navigation changes.
  - Unit Storybook and focused browser tests cover pagination filters archive recovery keyboard focus responsive behavior actions and reconciliation.
  - All required checks pass and the reviewed change is committed without pushing.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0033.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0033.yaml
  - pnpm --dir frontend run lint
  - pnpm --dir frontend run test
  - pnpm --dir frontend run build:production
  - pnpm --dir frontend run build-storybook
  - pnpm --dir frontend exec playwright test apps/aura-web-e2e/src/conversation-productivity.spec.ts --config playwright.config.ts --project=desktop
  - python3 tooling/architecture/validate-frontend-boundaries.py
  - python3 tooling/architecture/validate-repository-shape.py
  - python3 tooling/architecture/validate-baseline-protection.py --work-item work-items/active/AURA-0033.yaml
  - docker compose config --quiet
  - git diff --check
baseline_changes_allowed: false
human_approval_required: false
open_decisions: []
