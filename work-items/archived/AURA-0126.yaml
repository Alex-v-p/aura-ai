contracts:
  changes_allowed: false
  affected:
    - contracts/openapi/aura-v1.yaml
    - contracts/events/runs/v1/run-events.schema.json
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - Calendar event content and provider credentials are private and owner-scoped.
    - Scheduled runs must preserve bounded execution, exact agent revision, cancellation, and approval policy.
    - Workflow state and notifications must not leak private step inputs through events, telemetry, URLs, logs, or browser persistence.
    - Aura Web must remain isolated from Aura Observatory and its run-evidence APIs.
    - Background workers carry no user authority; every scheduled admission and resume must revalidate the immutable owner context and narrowed grants.
    - Calendar content and prior-step output are untrusted evidence and cannot become instructions, policy, permissions, mappings, or workflow transitions.
    - New run types must define closed ADR-0017 evidence serializers and permanent secret exclusions before owner-enabled full-content capture can apply.
  data_classes:
    - owner-private calendar metadata and content
    - provider credential references
    - private briefing inputs and outputs
    - owner-private workflow definitions and state
required_agents:
  implementation:
    - delivery_lead
  review:
    - general_reviewer
    - architecture_guardian
    - aura_ux_ui_reviewer
    - security_privacy_reviewer
    - observability_steward
  integration: false
execution:
  parallelism_class: standard
  max_parallel_agents: 5
  max_parallel_writers: 1
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - The plan defines four ordered stages with independent outcomes, prerequisites, non-goals, ownership zones, contract and migration impact, privacy rules, observability, evaluation, rollout, and rollback boundaries.
  - Stage 1 reuses existing reminder, approval, notification, conversation, and generated-client capabilities without requiring a Core contract or data migration.
  - Stage 2 remains read-only and provider-agnostic at Core boundaries, names Google Calendar only as the first adapter, and records the unresolved credential lifecycle decision as a blocking gate.
  - Stage 3 defines scheduled briefing admission and execution as deterministic schedule state plus a bounded Aura run with pinned agent revision, idempotency, cancellation, recovery, and owner-private delivery.
  - Stage 4 limits the first workflow capability to typed bounded sequential steps and approval pauses with persisted Core-owned state, explicit budgets, cancellation, history, and no arbitrary code execution.
  - The plan identifies future work-item decomposition and the minimum implementation, review, and integration roles for every stage.
  - The plan assigns proposed stable observable component and evaluator identities, bounded attributes, replay posture, capture policy, and retention posture for every future runtime stage; AURA-0126 itself changes no observable runtime behavior.
  - The plan does not authorize product implementation, contracts, migrations, providers, dependencies, deployment changes, or protected baseline changes.
required_checks:
  - python3 tooling/architecture/validate-work-item.py
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0126.yaml
  - python3 tooling/architecture/validate-repository-shape.py
  - python3 tooling/architecture/validate-observability.py --work-item work-items/active/AURA-0126.yaml
baseline_changes_allowed: false
human_approval_required: false
open_decisions:
  - Before Stage 2 implementation, the owner must approve Google Calendar credential retention, rotation, revocation, disconnect, and reauthorization behavior within ADR-0015 boundaries; otherwise return ADR_REQUIRED.
  - Before Stage 3 implementation, the owner must approve briefing source scope, default cadence, delivery representation, retention, and whether a briefing appends to an existing conversation or creates a dedicated durable result.
  - Before Stage 4 implementation, the owner must approve the closed initial workflow step catalogue, retry policy, maximum duration, retention, and editing semantics for running instances.
