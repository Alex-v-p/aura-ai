id: AURA-0021
title: Register versioned agent and persona module boundaries
status: integrated
change_class: repository_governance
intent: >
  Close the governance work for the reviewed versioned agents and personas
  feature by registering every new Core, API-route, runtime, and Aura Web root
  with deliberate public surfaces and explicit dependency direction.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
    - docs/development/architecture-enforcement.md
  specifications: []
  decisions:
    - User-approved Versioned Agents and Personas Workstream
    - AURA-0020 reviewed checkpoint debd9f1
    - Module registration records existing reviewed ownership and introduces no product behavior
  contracts: []
feature_references:
  - DEV-005
  - DEV-006
  - DEV-018
ownership_zones:
  - repository.governance
  - architecture.module-registry
allowed_paths:
  - work-items/active/AURA-0021.yaml
  - work-items/archived/AURA-0021.yaml
  - tooling/architecture/modules.yaml
  - tooling/architecture/dependency-rules.yaml
  - tooling/architecture/tests/test_modules.py
  - docs/architecture/module-boundaries.md
forbidden_paths:
  - AGENTS.md
  - .agents/**
  - .codex/**
  - .github/**
  - contracts/**
  - services/**
  - frontend/**
  - deploy/**
  - compose.yaml
  - docs/adr/**
  - docs/specifications/**
  - evaluations/**
  - infra/**
  - satellites/**
  - extensions/**
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - Registry metadata must preserve Core and Observatory isolation
    - Public surfaces must not authorize private cross-domain adapter or persistence imports
    - The governance change must not alter product behavior permissions prompt content or data handling
  data_classes:
    - module ownership metadata
required_agents:
  implementation:
    - platform_worker
  review:
    - general_reviewer
    - architecture_guardian
  integration: true
execution:
  parallelism_class: local
  max_parallel_agents: 1
  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: false
  escalation_reason_required: true
acceptance_criteria:
  - Every agents personas prompt-compilation API-route and Aura Web feature source root added by AURA-0020 has exactly one registry owner.
  - Registered public surfaces match the reviewed public application boundaries and transport-only frontend entrypoints.
  - Dependencies encode the reviewed direction between agents personas conversations runtime prompting bootstrap entrypoints and platform services without private cross-domain imports.
  - The module-boundary summary describes the new registered roots and their deliberate public surfaces.
  - Module registry import service frontend contract generated-client observability repository-shape and baseline validators all pass together.
  - The combined backend frontend migration contract observability and architecture validation evidence remains green after the governance-only change.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0021.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0021.yaml
  - python3 -m unittest tooling.architecture.tests.test_modules -v
  - python3 tooling/architecture/validate-module-registry.py
  - python3 tooling/architecture/validate-import-boundaries.py
  - python3 tooling/architecture/validate-service-isolation.py
  - python3 tooling/architecture/validate-frontend-boundaries.py
  - python3 tooling/architecture/validate-repository-shape.py
  - python3 tooling/architecture/validate-contract-changes.py
  - python3 tooling/architecture/validate-generated-sync.py
  - python3 tooling/architecture/validate-observability.py
  - python3 tooling/architecture/validate-baseline-protection.py
  - UV_CACHE_DIR=.local-state/uv-cache RUFF_CACHE_DIR=.local-state/ruff-cache uv run ruff check services/aura-core
  - UV_CACHE_DIR=.local-state/uv-cache uv run pyright services/aura-core
  - UV_CACHE_DIR=.local-state/uv-cache uv run pytest -p no:cacheprovider services/aura-core/tests -q
  - pnpm --dir frontend run lint
  - pnpm --dir frontend run test
  - pnpm --dir frontend run build:production
  - pnpm --dir frontend run build-storybook
  - pnpm --dir frontend exec playwright test --config playwright.config.ts
  - docker compose config --quiet
  - AURA_E2E_MODE=external sh deploy/compose/run-full-stack-e2e.sh
  - AURA_E2E_MODE=local-identity sh deploy/compose/run-full-stack-e2e.sh
  - git diff --check
baseline_changes_allowed: false
human_approval_required: true
open_decisions: []
