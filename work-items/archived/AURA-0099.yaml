acceptance_criteria:
  - The separate Observatory shell presents a distinctive owner operations identity and grouped Monitor Analyze Evaluate and Operate navigation with clear current location service status and responsive desktop rail tablet treatment and mobile overlay without changing public URL or API contracts.
  - Observatory semantic tokens and presentation primitives establish consistent typography spacing density alignment surfaces controls tables status treatments focus indicators dialogs progressive disclosure and light dark forced-colors and reduced-motion behavior without importing Aura feature code.
  - Overview Runs Trace Components Analytics Comparison and Retention prioritize current health active failures recent work and next actions while dense tables charts waterfalls topology and identifiers remain legible and inspectable without indiscriminate card nesting.
  - Evaluations Experiments Baselines Dashboards Saved queries Alerts Incidents and Annotations share the same hierarchy controls state vocabulary and responsive behavior while advanced authoring forms and technical metadata are progressively disclosed.
  - Loading empty ready stale disconnected partial rejected unauthorized unavailable failed cancelled and recovery states are visually and semantically distinct with text and structure in addition to color and with a safe local next action where one exists.
  - Retention evaluation baseline alert incident and annotation destructive or consequential actions use accessible confirmation experiences that name the exact target and consequence prevent mutation before confirmation support cancel and Escape where safe announce progress and terminal state and restore focus.
  - Wide desktop 1440 by 900 laptop 1280 by 800 tablet 768 by 1024 mobile 390 by 844 and 320-pixel 400-percent-equivalent reflow are inspected in a real browser using synthetic metadata with no clipped primary content uncontrolled document overflow or navigation loss.
  - Dark mode reduced motion forced colors keyboard-only operation visible unobscured focus screen-reader landmarks headings status and dialog semantics and 400-percent reflow receive both rendered human review and automated regression evidence.
  - Privacy review proves the redesign adds no authenticated browser persistence URL leakage screenshot trace video report log console raw diagnostic remote asset clipboard download or sanitizer-bypass path and preserves same-origin no-store CSRF session-recovery and stale-response protections.
  - Existing AURA-0098 changes remain present and attributable its documented backend and platform blockers remain fail-closed and no private SQL adapter call weakened check fabricated evidence protected baseline change or blocked full-stack PASS claim is introduced.
  - Every browser-visible implementation slice receives a rendered Aura UX UI review blocking findings are corrected by the owning worker and the same reviewer verifies the correction before integration.
