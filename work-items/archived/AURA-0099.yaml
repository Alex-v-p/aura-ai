id: AURA-0099
title: Redesign Observatory as a coherent owner operations product
status: integrated
change_class: refactor
intent: >
  Redesign the separate Aura Observatory Angular product into a polished,
  information-dense, and approachable owner operations workspace with coherent
  navigation, hierarchy, presentation primitives, responsive behavior, state
  treatment, and accessible destructive workflows while preserving all
  existing domain behavior, public contracts, privacy boundaries, and the
  uncommitted AURA-0098 resilience slice.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/design/README.md
    - docs/design/foundations.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-approved 2026-10-23 visual redesign targets only the separate Aura Observatory product and excludes the normal Aura application and Aura product feature libraries.
    - Observatory uses a calm operational-workbench direction with warm neutral canvas and ink surfaces dusty-rose interaction accents semantic status colors compact typographic hierarchy restrained borders selective elevation and no decorative gradients.
    - Navigation is regrouped around Monitor Analyze Evaluate and Operate without adding a new URL routing contract; advanced workspaces progressively disclose secondary controls while preserving existing accessible names and keyboard behavior where compatibility requires them.
    - Reusable Observatory presentation primitives live inside the Observatory feature library unless a later work item proves a genuinely product-neutral shared primitive.
    - Evaluation experiment and operations command stores may receive bounded presentation orchestration changes required to replace native browser confirmation prompts with accessible in-product dialogs; request bodies CSRF idempotency confirmation headers and domain state transitions remain unchanged.
    - The app entrypoint becomes bootstrap-only and the application shell remains responsible for composition navigation layout authentication recovery and global providers; feature behavior remains in the Observatory library.
    - Real-browser review uses only deterministic synthetic metadata or signed-out states. Authenticated data session material and private content remain memory-only and are excluded from URLs browser persistence screenshots traces videos reports logs and console output.
    - Existing AURA-0098 files and hunks are preserved. Its migration-ledger admission-boundary recovery-health and full-stack storage-state findings are not bypassed or claimed as resolved by this visual work item.
