security_privacy:
  applicable: true
  concerns:
    - Authenticated Observatory REST SSE CSRF session filter selection and operational data remain memory-only and absent from URLs browser storage caches screenshots traces videos reports logs and console output.
    - Real-browser visual artifacts use deterministic synthetic metadata or signed-out states and are temporary review evidence rather than committed product data.
    - Destructive retention evaluation baseline alert incident and annotation workflows retain explicit scope consequence CSRF idempotency cancel-first behavior focus management and sanitized terminal feedback.
    - The redesign introduces no innerHTML sanitizer bypass remote asset external font analytics download clipboard persistence or raw provider diagnostic surface.
    - Session expiry logout and late asynchronous responses clear or reject stale principal-bound state without leaking it into the redesigned shell.
  data_classes:
