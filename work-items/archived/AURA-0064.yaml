security_privacy:
  applicable: true
  concerns:
    - Every series record occurrence lifecycle command repository lookup and scheduler mutation remains bound to the authenticated owner except the database-only due-delivery scan.
    - Private reminder content recurrence rules local wall-clock values timezones owner identity and due instants must not enter lifecycle event envelopes NATS telemetry ordinary audit metadata logs or error details.
    - Series commands require UUID idempotency exact replay and optimistic expected-version enforcement even though HTTP entrypoints are deferred to AURA-0065.
    - Exactly one scheduled occurrence may exist for an active series and database constraints plus row locks must prevent duplicate materialization delivery and notification creation.
    - Edit pause skip cancel and scheduler firing races must lock the authoritative series and occurrence rows so only one valid transition commits.
    - Existing one-shot reminder rows APIs lifecycle events notification events and owner authorization behavior must remain byte-compatible and require no data backfill.
    - Timezone identifiers and recurrence fields are validated before persistence with bounded intervals selected weekdays count and end-date limits.
  data_classes:
    - private_reminder_content
    - private_recurrence_configuration
    - owner_identity
    - reminder_series_and_occurrence_identifiers
    - lifecycle_and_scheduling_metadata
