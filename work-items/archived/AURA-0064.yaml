id: AURA-0064
title: Add recurring reminder schedule foundation
status: integrated
change_class: repository_governance
intent: >
  Add owner-scoped recurring reminder series with deterministic wall-clock
  recurrence, exactly one materialized future occurrence, bounded recovery
  after downtime, serialized lifecycle commands, and metadata-only lifecycle
  observation while preserving every existing one-shot reminder and delivery
  contract.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/tools-automation-and-integrations.md
    - docs/specifications/open-decisions.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-approved structured daily selected-weekday weekly and monthly-by-date recurrence with positive intervals and optional occurrence-count or end-date termination
    - Owner-approved local wall-clock recurrence in an explicit IANA timezone with DST gaps moved to the first valid instant and overlaps emitted once at the earlier instant
    - Owner-approved monthly overflow on the last valid calendar day followed by return to the requested date in longer months
    - Owner-approved exactly one materialized scheduled occurrence per active series and immutable historical occurrences
    - Owner-approved one overdue delivery after downtime with additional missed occurrences counted and skipped before the next future occurrence is materialized
    - Owner-approved paused windows skipped without catch-up and resume continuing on the original cadence
    - Owner-approved occurrence completion independent from series lifecycle and explicit skip-next edit-future pause resume and cancel-series commands
    - Owner-approved PostgreSQL locking and optimistic versions so firing and lifecycle command races have exactly one committed winner
  contracts:
    - contracts/events/automation/v1/reminder-events.schema.json
    - contracts/events/automation/v1/notification-events.schema.json
