acceptance_criteria:
  - The reminder domain exposes owner-scoped recurring series commands and queries through its public application API while persistence and recurrence implementation details remain private to automation.reminders.
  - A series stores private content a structured daily selected-weekday weekly or monthly-by-date rule a positive interval local wall-clock start validated IANA timezone optional count or end-date termination status optimistic version lifecycle timestamps missed count and the next due instant.
  - Recurrence preserves local wall-clock time across offset changes moves DST-gap values to the first valid instant emits one earlier-instant value for overlaps and uses the last valid day for short-month overflow before returning to the requested date.
  - Creating or advancing an active series materializes exactly one future scheduled ordinary Reminder linked through an immutable occurrence sequence while one-shot reminder behavior remains unchanged.
  - Firing a recurring occurrence atomically preserves its Reminder lifecycle creates exactly one existing in-app Notification advances series counters records bounded missed occurrences and materializes only the next future occurrence.
  - After downtime one overdue occurrence is delivered at most once additional past occurrences are counted and recorded as skipped and no burst of missed notifications is produced.
  - Completing a fired occurrence never completes its series while exhausting count or end-date termination completes the series and creates no additional occurrence.
  - Skip-next records the occurrence as skipped and advances pause cancels the pending occurrence without catch-up resume chooses the next future occurrence on the original cadence edit replaces only the pending future occurrence and cancel-series prevents every future occurrence.
  - Series and occurrence history distinguishes scheduled fired completed skipped replaced paused-window and series-canceled outcomes without adding values to the existing ReminderStatus wire contract.
  - Concurrent create replay scheduler scans edit pause skip resume cancel and fire operations use database constraints locks expected versions and idempotency so exactly one valid outcome commits and crash retry cannot duplicate an occurrence or notification.
  - A new reminder-series event schema carries identifiers status version command correlation causation and bounded count metadata only while the existing reminder and notification v1 schemas remain unchanged.
  - Component manifests and instrumentation cover recurrence calculation commands occurrence generation skipping missed-count recovery conflicts due lag and failures without capturing content recurrence payload owner identity timezone local time or due instants.
  - The forward migration upgrades from 0016 and fresh installations creates additive series occurrence and command-idempotency persistence without backfilling or changing existing one-shot reminders.
  - No HTTP API generated client frontend conversational tool approval policy Web Push Home Assistant calendar household sharing workflow voice Wall Observatory or external provider behavior is added.
