id: AURA-0100
title: Restore supported Observatory Docker startup
status: integrated
change_class: bugfix
intent: >
  Make the supported disposable local HTTP Docker workflow start Aura
  Observatory from a fresh schema and expose its authenticated web product
  without private SQL, temporary Compose overlays, weakened dependency gates,
  or changes to public contracts.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - Observatory owns its PostgreSQL migrations and remains independently gated from Aura Core.
    - The existing forward-only rerunnable PostgreSQL migration model is preserved; the missing ledger prerequisite is added before any ledger write.
    - The local HTTP overlay preserves the base NATS entrypoint bind while replacing only durable NATS state with a project-scoped Docker volume.
    - The completed Core Garage bootstrap remains the sole cluster-layout owner; the dependent Observatory bootstrap provisions only its separate key bucket and least-privilege grants.
    - Disposable Garage access IDs use the provider-valid GK plus 24 lowercase hexadecimal format and Garage secret keys use 64 lowercase hexadecimal characters; existing valid local files are preserved and invalid generated local credentials are replaced atomically without exposing either value.
    - Observatory evaluation process healthchecks use the image-owned virtual-environment interpreter for a bounded stdlib-only scan that verifies the expected child module process without importing the full product dependency graph.
    - Live validation uses only disposable local-http state and bounded health or redirect evidence; credentials cookies tokens and authenticated content are not captured.
    - AURA-0098 remains independently blocked by its missing public admission and governed health surfaces; this work item resolves only the fresh-schema and supported-launcher prerequisites.
  contracts: []
feature_references: [OBS-002, OBS-003, OBS-006]
ownership_zones:
  - services.aura-observatory.migrations
  - deploy.local-http.compose
  - evaluation.observatory-startup
  - delivery.aura0100
allowed_paths:
  - work-items/active/AURA-0100.yaml
  - work-items/archived/AURA-0100.yaml
  - work-items/handoffs/AURA-0100-*.yaml
  - work-items/reviews/AURA-0100-*.yaml
  - work-items/integration/AURA-0100.yaml
  - services/aura-observatory/migrations/postgresql/versions/0001_observatory_foundation.sql
  - services/aura-observatory/tests/test_aura0100_startup.py
  - services/aura-observatory/tests/test_aura0097_postgres_integration.py
  - services/aura-observatory/tests/test_aura0097_test_evaluation.py
  - deploy/compose/local-http.yaml
  - deploy/compose/local-http.sh
  - compose.yaml
  - deploy/compose/test_topology.py
  - deploy/tests/test_aura0100_observatory_startup.py
forbidden_paths:
  - AGENTS.md
  - .agents/**
  - .codex/**
  - .github/**
  - docs/**
  - contracts/**
  - deploy/docker/**
  - frontend/**
  - services/aura-core/**
  - services/aura-observatory/migrations/clickhouse/**
  - services/aura-observatory/src/**
  - evaluations/golden-results/**
  - evaluations/**/baselines/**
