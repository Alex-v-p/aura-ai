  - ./deploy/compose/local-http.sh up
  - Bounded Docker health and redacted Observatory web login redirect verification
  - python3 tooling/architecture/validate-repository-shape.py
  - python3 tooling/architecture/validate-module-registry.py
  - python3 tooling/architecture/validate-service-isolation.py
  - python3 tooling/architecture/validate-contract-changes.py --work-item work-items/active/AURA-0100.yaml
  - python3 tooling/architecture/validate-baseline-protection.py --work-item work-items/active/AURA-0100.yaml
  - git diff --check
