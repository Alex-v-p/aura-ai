  - UV_CACHE_DIR=/tmp/aura-0100-uv uv run --project services/aura-observatory pyright services/aura-observatory/tests/test_aura0100_startup.py
  - UV_CACHE_DIR=/tmp/aura-0100-uv uv run pytest -q deploy/tests/test_aura0100_observatory_startup.py deploy/tests/test_aura0094_runtime.py deploy/tests/test_aura0094_topology.py
  - UV_CACHE_DIR=/tmp/aura-0100-uv uv run python -m unittest deploy.compose.test_topology
