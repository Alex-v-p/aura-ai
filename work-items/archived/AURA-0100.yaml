  - uv.lock
  - package.json
  - pnpm-lock.yaml
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: true
  owning_service: aura-observatory
  owning_module: observatory.persistence
observability:
  applicable: true
  affected_components:
    - aura.observatory.migrations
    - aura.observatory.query_api
  required_metrics: []
  required_evaluators:
    - observatory_fresh_schema_startup
    - observatory_migration_rerun
    - local_http_nats_entrypoint_wiring
    - observatory_authenticated_edge_startup
  capture_policy: bounded service health and redacted redirect metadata only
security_privacy:
  applicable: true
  concerns:
    - Local identity secrets remain file-injected and absent from command arguments logs reports URLs and committed files.
    - Validation must not persist or capture owner cookies bearer tokens credentials authenticated payloads or private telemetry.
    - The separate Observatory OIDC client audience owner session CSRF and same-origin BFF boundary remain unchanged.
  data_classes:
    - operational_metadata
    - owner_session_state
required_agents:
  implementation:
    - observatory_worker
    - platform_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 6
  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - A fresh Observatory PostgreSQL schema creates every prerequisite before migrations 0013 and 0014 write their guarded ledger records, and the complete ordered migration chain succeeds transactionally.
  - Re-running the PostgreSQL migration chain is idempotent and preserves a single ledger row for each migration that explicitly records itself.
  - The exact supported local HTTP Compose merge retains the read-only NATS entrypoint bind at /usr/local/bin/aura-nats-entrypoint while using the disposable named data volume.
  - The Observatory Garage bootstrap performs no node or cluster-layout mutation after its successful Core Garage bootstrap dependency and retains its separate fail-closed key bucket and permission verification.
  - Local HTTP secret bootstrapping preserves valid Garage access IDs and secret keys, generates them in the exact provider-valid GK plus 24 lowercase hexadecimal and 64 lowercase hexadecimal shapes, and atomically replaces only invalid disposable local Garage credential files while retaining mode 0600 and no-follow protections.
  - ./deploy/compose/local-http.sh up completes without a temporary override and observatory-migrate exits zero from disposable fresh state.
  - Observatory PostgreSQL ClickHouse session API and web containers become healthy, and no Observatory container remains restarting or blocked in Created state.
  - Observatory evaluation worker and scheduler healthchecks use /app/.venv/bin/python to find the exact expected module-process argv under /proc within the existing three-second bound, and both services become healthy under the supported launcher.
  - http://observatory.localhost:4300 returns the web product and its login endpoint redirects through the separate Observatory Authentik authorization path without exposing query values in evidence.
  - Aura Core remains healthy and independent while the Observatory repair adds no cross-service database access contract change package framework or architecture exception.
  - AURA-0098 uncommitted work and its unrelated acceptance blockers remain preserved and are not claimed as resolved.
