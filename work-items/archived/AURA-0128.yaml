acceptance_criteria:
  - Aura API version 1.19.0 additively defines provider-neutral connection status and lifecycle operations for start connect callback completion reauthorization and disconnect without exposing provider credentials or codes to the browser contract.
  - The lifecycle contract distinguishes disconnected connecting connected reauthorization-required revocation-uncertain disabled and unavailable states with bounded Aura-owned error categories and actionable owner-safe recovery metadata.
  - The API lists bounded owner-authorized selectable calendars and changes the selected set explicitly; no calendar is selected by discovery and newly discovered calendars remain unselected.
  - Event retrieval requires a bounded instant range explicit validated IANA display timezone selected-calendar allowlist page limit and opaque cursor and returns normalized timed all-day and multi-day events with timezone provenance.
  - Conflict results are server-authoritative deterministic and provider-neutral and identify bounded relationships without requiring the browser or a model to calculate overlaps.
  - Calendar lifecycle and selection commands use the existing authenticated cookie CSRF and idempotency contract conventions; read responses use no-store semantics.
  - Contract descriptions prohibit calendar or credential content in URLs logs telemetry SSE browser persistence and service-worker caches and prohibit calendar writes RSVP attendee mutation background synchronization memory writes and model-facing tools.
  - The generated TypeScript client is regenerated from the contract without handwritten transport types and exposes every new operation and schema.
  - Focused contract tests prove closed states categories limits privacy exclusions additive compatibility local references operation uniqueness and generated-client synchronization.
  - No Core source migration provider deployment frontend product Observatory event contract or protected baseline changes occur.
