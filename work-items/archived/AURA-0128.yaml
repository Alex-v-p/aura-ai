id: AURA-0128
title: Define read-only calendar integration contracts
status: integrated
change_class: contract
intent: >
  Define the additive provider-neutral Aura API contract for an owner-scoped,
  read-only calendar connection, explicit calendar selection, bounded event
  retrieval, and deterministic conflict results without implementing provider,
  persistence, deployment, or product UI behavior.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/design/daily-action-and-workflow-initiative.md
    - docs/specifications/tools-automation-and-integrations.md
    - docs/specifications/clients-and-voice.md
  decisions:
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - work-items/archived/AURA-0126.yaml
    - work-items/archived/AURA-0127.yaml
    - On 2026-10-26 the owner approved server-held encrypted OAuth credentials, revocation before removal when reachable, disabled reads with a recoverable state when revocation is uncertain, and reauthorization after expiry.
    - On 2026-10-26 the owner approved on-demand event retrieval with no durable event-content cache.
    - On 2026-10-26 the owner approved explicit calendar selection with no calendar enabled implicitly and explicit opt-in for newly discovered calendars.
    - Fixed Google HTTPS endpoints are enforced by configuration and application validation in later platform and provider slices; this stage does not introduce a proxy, firewall, or new trust boundary.
    - Calendar read requests carry an explicit validated IANA display timezone until a separately authorized owner-profile preference becomes the source of that value.
    - This is Stage 2 slice 1 only; platform OAuth, Core persistence and provider behavior, deployment, and Aura Web implementation remain sequential later work items.
