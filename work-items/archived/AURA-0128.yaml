security_privacy:
  applicable: true
  concerns:
    - Browser contracts must never expose access tokens refresh tokens client secrets authorization codes internal credential references or raw provider errors.
    - Calendar names event titles descriptions attendees locations provider identifiers and owner identity are private and must not enter ordinary logs telemetry SSE invalidations URLs or browser persistence.
    - Connection and selection mutations require authenticated owner authorization origin-aware CSRF validation and idempotency semantics.
    - Event reads must be bounded by validated range page size cursor selected-calendar allowlists deadlines and cancellation.
    - Provider-specific lifecycle and error detail must map to closed Aura-owned states and categories.
  data_classes:
    - encrypted OAuth credential metadata excluded from public API
    - owner-private calendar metadata
    - owner-private calendar event content
    - provider-neutral connection and conflict status
