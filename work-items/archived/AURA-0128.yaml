open_decisions:
  - AURA-0129 must select the existing-runtime-compatible credential encryption and key delivery mechanism before any durable provider credential implementation.
  - Network-enforced provider destination allowlisting would introduce a new trust boundary and remains out of scope unless separately authorized through an ADR; later slices use fixed validated application endpoints only.
