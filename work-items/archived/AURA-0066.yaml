id: AURA-0066
title: Add conversational reminder management
status: integrated
change_class: contract
intent: >
  Extend Aura's governed one-tool-per-run runtime with owner-authorized reminder
  discovery and always-confirmed recurring-reminder commands, deterministic target
  resolution, pinned run timezones, typed private command proposals, and an
  immutable built-in policy successor while preserving historical policies,
  reminder.create@1, one-shot APIs, and metadata-only operational surfaces.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/tools-automation-and-integrations.md
  decisions:
    - Owner-approved read tools reminder.list@1 and reminder.inspect@1 with at most ten owner-authorized results and optional query or state filtering.
    - Owner-approved always-confirmed reminder.series.create@1 reminder.reschedule@1 reminder.series.update@1 reminder.series.pause@1 reminder.series.resume@1 and reminder.cancel@1 tools.
    - Owner-approved deterministic owner-scoped resolution that creates no proposal for zero or multiple exact-enough matches.
    - Owner-approved use of the run's validated pinned IANA timezone for conversational creation and rescheduling with clarification when absent.
    - Owner-approved typed private reminder-command proposals that pin operation normalized arguments target identifier and expected version before approval.
    - Owner-approved one approval per conversational command and one tool call per run.
    - Owner-approved immutable built-in Aura policy successor while existing conversations retain pinned revisions and custom agents remain deny-by-default.
    - Existing reminder.create@1 one-shot APIs v1 reminder events and historical tool policies remain unchanged.
  contracts:
    - contracts/events/runs/v1/run-events.schema.json
