contracts:
  changes_allowed: true
  affected:
    - runtime tool descriptors and results
    - private reminder command proposals
    - immutable built-in tool policy revisions
  compatibility_requirement: backward_compatible
data:
  migration_required: true
  owning_service: aura-core
  owning_module: automation.reminders
observability:
  applicable: true
  affected_components:
    - aura.runtime.tool_selection
    - aura.runtime.tool_execution
    - aura.governance.approval_workflow
    - aura.execution.run_coordinator
  required_metrics:
    - reminder_tool_selection_outcome
    - reminder_tool_resolution_outcome
    - reminder_command_approval_outcome
    - reminder_command_execution_outcome
  required_evaluators:
    - conversational_reminder_owner_isolation
    - conversational_reminder_approval_before_side_effect
    - conversational_reminder_metadata_only_capture
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Tool reads and deterministic target resolution are owner-scoped and expose no cross-owner existence signal.
    - Zero-match multiple-match and missing-timezone clarification produces no proposal approval or side effect.
    - Every mutation proposal pins operation normalized arguments target identifier expected version and run timezone before approval.
    - Tool arguments content recurrence details target queries raw results owner identity due times and timezone values remain absent from run events SSE NATS audit metadata logs and telemetry.
    - Owner-authorized approval detail may reveal only the private command summary through the established protected approval API.
    - Rejection expiry cancellation duplicate wakeups and approval races produce one terminal result and no unapproved side effect.
    - Existing conversations retain historical policies and custom agents do not receive grants automatically.
  data_classes:
    - private_reminder_content
    - private_recurrence_configuration
    - owner_scoped_targets_and_queries
    - pinned_command_arguments_and_versions
    - private_timezone_and_due_values
required_agents:
  implementation:
    - contract_steward
    - core_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 8
  max_parallel_writers: 3
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - reminder.list@1 returns at most ten owner-authorized reminder or series summaries with bounded optional query and state filters and reminder.inspect@1 returns one uniquely resolved owner record or a deterministic clarification result.
  - reminder.series.create@1 reminder.reschedule@1 reminder.series.update@1 reminder.series.pause@1 reminder.series.resume@1 and reminder.cancel@1 are always-confirmed mutations and reminder.cancel@1 requires explicit occurrence or series scope.
  - Natural-language target resolution is deterministic and mutation proceeds only for one exact-enough owner match; zero or multiple matches return clarification without creating a proposal or approval.
  - Conversational creation and rescheduling use only the run's validated pinned IANA timezone and missing timezone produces clarification without server-timezone fallback.
  - Private typed command proposals pin the resolved target identifier expected version operation normalized arguments and timezone before approval and are immutable afterward.
  - Approved commands execute through the existing durable resume path with one terminal result across rejection expiry cancellation duplicate wakeups and approval races and with no side effect before approval.
  - One tool call remains the per-run maximum and ambiguity is resolved in a later user turn rather than an autonomous tool loop.
  - A successor immutable built-in Aura revision grants the new tools; prior conversations retain pinned revisions and custom agents remain deny-by-default.
  - Existing reminder.create@1 one-shot APIs reminder event v1 contracts and historical policy revisions remain behaviorally and wire compatible.
  - Tool arguments reminder content recurrence data raw results target queries owner identity due times and timezone values are absent from run events SSE NATS audit metadata logs traces and metrics while protected approval detail may show a private command summary.
  - Automated coverage proves permissions owner isolation unique ambiguous and zero-match resolution timezone clarification proposal pinning approval-before-side-effect rejection expiry cancellation redelivery policy immutability and metadata-only telemetry.
