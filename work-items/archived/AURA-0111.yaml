  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Every production evaluation collection response serializes snapshotAt with an RFC3339 T separator and UTC Z suffix for definition job attempt result artifact review calibration qualification deletion regression history and score pages.
  - Newly encoded collection and history cursors serialize snapshotAt and any timestamp keyset value as canonical RFC3339 UTC instants and never as the space-separated result of str(datetime).
  - An aware timestamp with a non-UTC offset is normalized to the equivalent UTC instant before page or cursor serialization; fractional-second precision remains deterministic and compatible with the existing UtcInstant schema.
  - A cursor emitted from the first page round-trips through decode and produces later pages under the same normalized snapshot fence for every cursor-bearing PostgreSQL collection family and the ClickHouse score family.
  - Existing valid legacy history cursors remain readable and their successor cursors and page snapshots are emitted in the canonical format.
  - Missing malformed oversized non-canonical-base64 duplicate-key naive and invalid timestamp cursor states fail closed with the existing bounded cursor error before PostgreSQL or ClickHouse access.
  - Detail reads remain unchanged because they expose resource timestamps through their existing field projectors and do not invent snapshotAt or cursor state.
  - Pagination ordering kind binding snapshot fencing identifier and version tie-breakers limits filters partial flags and provider error classification remain unchanged.
  - Focused tests cover all four snapshotAt serialization sites collection history and score cursor payloads UTC and offset-aware inputs fractional seconds legacy continuation and malformed or naive timestamp rejection.
  - The AURA-0098 evaluation UI no longer rejects a production collection page because snapshotAt contains a space separator; composed browser acceptance remains owned by AURA-0098.
  - No Core Aura Web Observatory frontend application query module entrypoint contract migration deploy dependency service metric evaluator protected baseline or retention change is introduced.
