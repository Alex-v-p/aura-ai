id: AURA-0111
title: Canonicalize evaluation query instants
status: integrated
change_class: bugfix
intent: >
  Make Observatory production evaluation collection snapshots and opaque
  cursor instants use the unchanged RFC3339 UTC representation required by
  observatory-v1 so valid evaluation pages are accepted by the existing UI.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - work-items/archived/AURA-0095.yaml
    - work-items/archived/AURA-0096.yaml
    - Production evaluation query timestamps exposed as observatory-v1 UtcInstant values use RFC3339 with a T date-time separator and UTC Z suffix; str(datetime) is not a public serializer.
    - Every evaluation collection page path and newly encoded keyset cursor uses one bounded UTC-instant serializer. Aware non-UTC inputs are normalized to UTC without changing their instant.
    - Existing legacy opaque cursors remain readable when their timestamps are otherwise valid, but every newly returned cursor and page snapshot is canonical.
    - Naive malformed non-string or otherwise invalid cursor timestamps retain the existing bounded cursor error behavior and never reach provider queries.
    - This is a production query-adapter correction only. Public schemas API routing query semantics storage contracts and frontend validation remain unchanged.
    - AURA-0098 retains ownership of composed browser acceptance. This item corrects only the proven timestamp serialization failure and may not edit its harness.
  contracts:
    - contracts/openapi/observatory-v1.yaml
feature_references:
  - EVA-001
  - EVA-002
  - EVA-023
