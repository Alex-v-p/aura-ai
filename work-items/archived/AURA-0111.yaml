  owning_service: aura-observatory
  owning_module: evaluation.query
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - Cursor decoding remains closed kind-bound size-bounded duplicate-key rejecting and canonical-base64 validated before any provider query.
    - Timestamp normalization must not add query filters identifiers payload fields provider text credentials endpoints owner identity or content to responses logs metrics or errors.
    - Malformed naive and out-of-contract timestamps fail with the existing fixed cursor error rather than reflecting the supplied cursor or decoded payload.
    - The correction remains entirely inside Observatory and does not change Core communication authentication authorization retention browser persistence or storage ownership.
  data_classes:
    - evaluation_definition_metadata
    - opaque_cursor_state
    - content_free_error_metadata
