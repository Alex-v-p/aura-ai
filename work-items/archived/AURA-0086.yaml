id: AURA-0086
title: Add Observatory component catalogue and dependency topology
status: integrated
change_class: contract
intent: >
  Make Observatory component definitions, deployed versions, dependencies, and
  observed health understandable through an owner-only, bounded, accessible
  catalogue without coupling Observatory runtime behavior to Core internals.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/aura-ai-envisioned-feature-catalogue.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/foundations.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Synchronize only Observatory-owned component manifests into Observatory PostgreSQL through a service-owned idempotent path.
    - Keep Core and other externally observed components visible as observed-only definitions until a versioned public definition contract is separately authorized.
    - Keep component definitions and dependency edges in PostgreSQL while deriving observed health and deployed versions from ClickHouse observations.
    - Represent topology through bounded version-aware resources and provide a semantic table or list as the complete non-visual alternative to any graphical view.
  contracts:
    - contracts/openapi/observatory-v1.yaml
    - contracts/telemetry/v1/metadata-observation.schema.json
feature_references:
  - OBS-010
  - OBS-011
  - OBS-012
  - OBS-013
