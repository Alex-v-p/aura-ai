    - observatory_worker
    - frontend_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
    - aura_ux_ui_reviewer
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 6
  max_parallel_writers: 1
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Observatory PostgreSQL stores versioned component definitions with a stable component identifier version owner category input and output schema identifiers declared measurements evaluators and dependency edges.
  - An idempotent service-owned synchronization path loads only packaged Observatory component manifests and rejects malformed duplicate cyclic or unbounded definitions without importing Aura Core modules or reading Core tables.
  - Components observed through metadata telemetry without a matching definition remain visible as explicitly observed-only entries with their deployed versions and aggregate health.
  - ClickHouse remains the source for high-cardinality observations deployed-version presence and bounded health trends; PostgreSQL definitions are not duplicated into observation storage.
  - The backward-compatible REST contract exposes a bounded component catalogue version-specific definitions dependency relationships and aggregate health with deterministic ordering.
  - Dependency responses represent missing definitions unavailable dependencies and partial observed health explicitly without inventing edges or collapsing incompatible versions.
  - Retention deletion continues to remove observations and derived health while preserving component definitions dependency edges and catalogue metadata.
  - The owner-only Components workspace exposes catalogue metadata deployed versions measurements schemas evaluators health trends and direct and reverse dependencies.
  - The topology is fully keyboard operable uses text and semantic status in addition to colour preserves visible focus and provides an equivalent screen-reader-readable responsive table or list.
  - Browser behavior covers loading empty observed-only partial stale disconnected unavailable malformed-definition and retry states without persisting authenticated API data.
  - Unit migration contract frontend browser and full-stack tests cover fresh upgrade and rerun migrations manifest synchronization definition validation missing dependencies deterministic ordering observed-only components partial health and retention preservation.
  - Core modules databases startup requests workers and scheduling remain unchanged and usable when Observatory is unavailable.
