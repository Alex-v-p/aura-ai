contracts:
  changes_allowed: true
  affected:
    - observatory-v1
  compatibility_requirement: backward_compatible
data:
  migration_required: true
  owning_service: aura-observatory
  owning_module: component-catalogue
observability:
  applicable: true
  affected_components:
    - aura.observatory.query_api
    - aura.observatory.telemetry_storage
  required_metrics:
    - observatory_query_duration_ms
    - observatory_query_freshness_lag_ms
  required_evaluators:
    - component_manifest_completeness
    - component_dependency_integrity
    - observatory_self_monitoring
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Catalogue definitions contain only repository-approved component metadata and never prompts responses documents filenames tool payloads credentials endpoints tokens or owner identity.
    - Dependency and health queries are owner-authorized and bounded by explicit item point and time limits.
    - Unknown observed components remain metadata-only and cannot inject arbitrary display labels schemas evaluators dependencies URLs or markup.
    - Browser topology and SSE contain only approved definitions and aggregate observation metadata and are excluded from browser persistence.
  data_classes:
    - component_definition_metadata
    - operational_telemetry_metadata
required_agents:
  implementation:
