  max_parallel_agents: 7
  max_parallel_writers: 2
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - All ten Observatory destinations render a clear page purpose primary state and next action at 1440 by 1000 and 390 by 844 without clipped controls overlapping text residual navigation rails or nested page scroll traps.
  - The mobile navigation is modal keyboard-contained and closes completely after destination selection while desktop navigation retains a visible current destination and grouped information architecture.
  - Ambiguous Unicode glyphs are replaced with consistent Observatory-owned semantic SVG icons that have decorative or accessible treatment as appropriate and remain legible in reduced motion forced colors and high contrast.
  - Overview presents a concise health verdict actionable current KPIs clearly labelled cumulative counters freshness backlog and latency trends and accessible drill-in cues without implying that lifetime totals are current failures.
  - Runs provides stable terminal status and human-rounded duration display searchable or filterable summaries and clear handling of incomplete or anomalous historical projections without changing authoritative data.
  - Selecting a run loads the authoritative run-inspection snapshot and presents a hierarchical bounded timeline with category status duration lineage measurements completeness and explicit partial reasons; repeated token stream delivery and thinking events are aggregated rather than eagerly rendered as hundreds of rows.
  - Run steps and raw trace spans use progressive disclosure with bounded previews or pagination so a normal run does not create an unbounded document while exact timing remains available accessibly.
  - Evidence manifests show captured excluded partial unavailable and deleted states; exact evidence is fetched only on explicit disclosure rendered inertly with approved media handling and released when collapsed selected run changes or the inspector closes.
  - Run evidence deletion uses the existing owner-authorized CSRF-protected idempotent endpoint with a run-scoped confirmation and leaves metadata visible with evidence marked deleted.
  - Metadata-only run-scoped SSE invalidation refreshes the selected snapshot without evidence content and preserves expanded steps while never automatically refetching collapsed evidence.
  - Components adds useful catalogue summary search filters ordering and accessible trend presentation instead of an undifferentiated eager card wall and raw unlabeled spark values.
  - Analytics uses understandable defaults units legends axes summary deltas stale and partial explanations and bounded exact tables; controls remain usable on narrow screens.
  - Compare formats durations consistently and emphasizes meaningful deltas status deployment component measurement and topology differences instead of raw floating-point milliseconds.
  - Evaluations Experiments Operations and Retention share the same visual hierarchy KPI semantics empty stale partial and error states and destructive-action clarity while preserving their existing contracts and mutation safeguards.
  - Storybook covers every Observatory destination plus loading empty stale disconnected partial error deleted large-run and narrow-screen states and axe reports no serious or critical violations.
  - Browser acceptance proves keyboard navigation responsive layouts live refresh state preservation lazy evidence retrieval inert rendering zero browser persistence deletion confirmation and the Aura Web no-reference boundary.
