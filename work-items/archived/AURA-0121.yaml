id: AURA-0121
title: Clarify Observatory workspaces and expose governed run evidence
status: integrated
change_class: feature
intent: >
  Make every existing Observatory workspace visually coherent, accessible, and
  operationally useful, while replacing the metadata-only run detail with the
  owner-only governed run inspection and lazy evidence experience already
  authorized and implemented by AURA-0117 through AURA-0119. Preserve the
  complete product and browser boundary from Aura Web.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/clients-and-voice.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - docs/adr/0017-governed-production-run-evidence.md
    - work-items/archived/AURA-0117.yaml
    - work-items/archived/AURA-0119.yaml
    - Existing observatory-v1 run-inspection evidence and deletion operations are authoritative and require no contract or generated-client change.
    - Information hierarchy is summary first trends and deltas second and bounded raw records behind progressive disclosure.
    - Observatory-owned semantic icons may replace ambiguous Unicode glyphs without adding a dependency or changing shared Aura frontend libraries.
    - Evidence is fetched only after an explicit owner disclosure action rendered inertly and kept out of URLs logs metrics browser storage service-worker caches and screenshots.
    - Aura Web Core Observatory backend contracts generated clients databases and deployment topology remain unchanged.
  contracts:
    - contracts/openapi/observatory-v1.yaml
    - frontend/libs/platform/observatory-api-client/src/lib/generated/observatory-api.ts
