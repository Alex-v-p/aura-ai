contracts:
  changes_allowed: false
  affected:
    - existing observatory-v1 run inspection evidence and deletion consumer behavior
    - existing metadata-only run-scoped SSE invalidation consumer behavior
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: aura-observatory
  owning_module: observatory-web
observability:
  applicable: true
  affected_components:
    - aura.observatory.run_inspection_query
  required_metrics: []
  required_evaluators:
    - run_inspection_projection_truth
    - run_inspection_outage_isolation
    - metadata_v2_allowlist
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Exact owner-private evidence must be fetched lazily only after explicit disclosure and rendered as inert text JSON or approved media.
    - Evidence content identifiers digests and deletion detail must never enter URLs console logs metrics SSE browser storage service-worker caches screenshots or accessibility announcements that outlive the open disclosure.
    - Evidence responses remain no-store owner-authorized and bounded and deletion retains the existing CSRF idempotency and explicit confirmation behavior.
    - Live refresh preserves disclosure and expanded-step state without retaining evidence bytes or silently refetching collapsed evidence.
    - Empty stale disconnected partial unavailable rejected excluded dropped and deleted states must remain truthful and distinguishable.
    - Aura Web retains zero Observatory links labels routes imports configuration sessions browser communication or client dependencies.
  data_classes:
    - metadata_only_operational_observations
    - owner_private_run_evidence
    - run_evidence_manifest_and_deletion_state
