id: AURA-0123
title: Bound Observatory live refresh traffic
status: integrated
change_class: bugfix
intent: >
  Keep Observatory views live while eliminating request amplification from
  hidden workspaces, per-observation invalidations, paginated run
  reconciliation, and overlapping operations refreshes. Browser reads must
  not create a self-sustaining telemetry and SSE feedback loop.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - SSE remains the metadata-only invalidation channel and REST snapshots remain authoritative.
    - Run-correlated observation events may use the existing run resource identity already authorized by the live-event contract.
    - Inactive Observatory workspaces do not load data or hold workspace-specific live streams.
    - Generic Observatory observations do not invalidate run, analytics, or comparison snapshots.
    - Active-run invalidations are cadence-limited and coalesced while preserving one trailing refresh.
    - Paginated run counts are not interpreted as projection lag when a page is complete for its declared pagination state.
  contracts:
    - contracts/openapi/observatory-v1.yaml
feature_references: [OBS-005, OBS-009, OBS-039]
ownership_zones:
