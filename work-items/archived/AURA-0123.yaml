contracts:
  changes_allowed: false
  affected:
    - existing observatory-v1 metadata-only live-event semantics
  compatibility_requirement: backward_compatible
data:
  migration_required: false
  owning_service: aura-observatory
  owning_module: live-updates
observability:
  applicable: true
  affected_components:
    - aura.observatory.query_api
  required_metrics: []
  required_evaluators:
    - observatory_self_monitoring
    - metadata_v2_allowlist
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - SSE payloads remain content-free and owner-authorized.
    - No request content owner identity credential evidence identifier or high-cardinality value enters metrics or logs.
    - Aura Web remains completely isolated from Observatory.
  data_classes:
    - metadata_only_operational_observations
required_agents:
  implementation:
    - observatory_worker
    - frontend_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
    - observability_steward
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 6
  max_parallel_writers: 2
  model_tier: balanced
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Opening Observatory initially loads only the shared overview resources and the active workspace; inactive evaluation experiment and operations workspaces issue no requests and hold no workspace-specific live streams.
  - Primary SSE heartbeats and generic self-observation events issue no REST refreshes.
  - Run-correlated telemetry and evidence invalidations remain live through the existing run-scoped metadata-only event shape.
  - Continuous run invalidations are coalesced to at most one active refresh and one trailing refresh per configured cadence window, with no unbounded queue.
  - A completed paginated run page does not poll every two seconds merely because overview total count exceeds the current page length.
  - Operations live events cannot overlap full workspace loads and coalesce to one trailing bounded refresh.
  - With the Overview idle for at least ten seconds after convergence, only the long-lived SSE requests remain open and no repeated overview runs analytics comparison evaluation experiment or operations REST reads occur.
  - A representative active run becomes visible without manual refresh within two seconds of a run-scoped invalidation.
  - Browser and service tests prove request ceilings and that a REST read cannot sustain its own invalidation loop.
