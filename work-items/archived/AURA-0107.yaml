  changes_allowed: false
  affected:
    - evaluation-v1
    - observatory-v1
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - Case declaration lookup remains scoped to the exact immutable dataset identifier and version and must not accept membership from another dataset version case row or derived membership row.
    - Admission must continue through dataset-case binding capture authorization and opaque artifact-metadata validation before any case is persisted.
    - PostgreSQL continues to store only bounded content-free definition and authorization metadata; raw evaluation content credentials endpoints owner identity and provider diagnostics remain excluded.
    - Transaction rollback idempotent same-fingerprint reuse immutable conflict rejection and content-free accepted duplicate and rejected audits remain unchanged.
  data_classes:
    - evaluation_definition_metadata
    - evaluation_content_authorization_metadata
    - opaque_artifact_references
required_agents:
  implementation:
    - observatory_worker
  review:
    - general_reviewer
    - security_privacy_reviewer
  integration: false
