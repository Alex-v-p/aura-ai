id: AURA-0107
title: Restore PostgreSQL evaluation case admission
status: integrated
change_class: bugfix
intent: >
  Let production PostgreSQL admit the first valid evaluation case declared by
  an immutable dataset version by checking the stored dataset declaration
  rather than the not-yet-created derived membership row, while preserving
  transactional membership, version conflicts, idempotency, audits, privacy,
  and public contract compatibility.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - work-items/archived/AURA-0093.yaml
    - work-items/archived/AURA-0095.yaml
    - The immutable dataset version stored in Observatory PostgreSQL is authoritative for its declared case identifiers; the dataset-case membership table is a derived exact-version binding created transactionally with an admitted case.
    - PostgreSQL case_declared must match the in-memory repository semantics by checking the stored dataset case_ids for the exact dataset identifier and version before create_case.
    - create_case remains the sole transactional authority for rechecking the immutable declaration locking case identifiers enforcing case-version conflicts inserting the case and membership row and writing content-free audits.
    - The repair changes no public request response event or repository-port shape and introduces no migration schema service dependency or cross-product access.
    - AURA-0098 retains ownership of composed PostgreSQL evaluation admission and all remaining resilience acceptance; this item provides only the adapter correction and focused regression evidence.
  contracts:
    - contracts/evaluation/v1/evaluation.schema.json
    - contracts/openapi/observatory-v1.yaml
