  parallelism_class: local
  max_parallel_agents: 3
  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - PostgresEvaluationDefinitionRepository.case_declared returns true only when the requested case identifier is present in the stored case_ids of the exact immutable dataset identifier and version.
  - A valid first case declared in DatasetDefinition.caseIds can pass EvaluationDefinitionService.admit_case against production-equivalent PostgreSQL state before any derived dataset-case membership row exists.
  - Missing datasets wrong dataset versions undeclared case identifiers and case identifiers declared only by another dataset version continue to return false and fail closed.
  - Postgres create_case retains its in-transaction declaration recheck case-identifier locking immutable case-version conflict rules case insert membership insert and accepted duplicate conflict or rejected content-free audits.
  - Same identifier version and fingerprint retries remain idempotent while a different fingerprint or conflicting case version remains rejected without partial case or membership state.
  - Existing capture authorization dataset-case binding and artifact metadata validation remain mandatory and no evaluation content enters PostgreSQL logs metrics traces errors or tests.
  - Focused adapter and isolated PostgreSQL coverage proves first-case admission derived membership creation idempotent replay version conflict rollback and exact dataset-version scoping.
  - Public evaluation-v1 and observatory-v1 contracts repository protocols migrations metrics and error classifications remain unchanged and compatible.
  - AURA-0098 is unblocked only for this production PostgreSQL admission deadlock and must still independently pass its composed evaluation workflow and resilience gates.
