open_decisions:
  - Live browser evaluation completion, local-judge execution, authorized artifact lifecycle, baseline and regression workflows, alert and incident workflows, session reset, and the exhaustive dependency outage/recovery matrix are explicitly deferred from AURA-0098 and must be planned as follow-up work before being claimed complete.
  - The current NATS service remains shared Core infrastructure. A future outage item must report truthful Core dependency failure while that bus is stopped and may not claim normal-run availability.
  - Any verified need for a new public endpoint event migration service package framework or cross-product dependency returns ADR_REQUIRED or a separately authorized work item; AURA-0098 does not infer that authority from deferred acceptance gaps.
