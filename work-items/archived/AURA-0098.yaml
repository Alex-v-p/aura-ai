acceptance_criteria:
  - A disposable project-scoped composed stack signs the owner into Core and Observatory and completes a real Core run observed through authenticated SSE REST run search ordered trace spans component measurements analytics and comparison without private data leakage.
  - The accepted browser path covers responsive and accessible run search trace analytics stale partial disconnected and retention behavior, with focused desktop tablet and mobile coverage for adjacent states.
  - Authenticated operational data remains memory-only and absent from Cache Storage service-worker caches localStorage sessionStorage IndexedDB URLs console output screenshots and acceptance reports.
  - The focused composed evaluation-orchestration harness proves deterministic success cancellation deadlines duplicate delivery scheduler recovery PostgreSQL recovery NATS recovery and metadata-only diagnostics without requiring the unfinished live browser evaluation round trip.
  - Core and Observatory retain separate products sessions databases migrations frontends and dependency directions; normal Core execution never imports queries or waits on Observatory.
  - The disposable runner-ledger gate verifies the real evaluation-runner database identity and required ledger access inside a rolled-back transaction before browser acceptance.
  - Operator documentation describes startup scoped health diagnosis privacy-safe log collection and disposable fixture cleanup using repository commands only.
  - No public contract migration dependency protected baseline threshold new deployable host-network workaround external alert delivery cloud judge or broad Docker cleanup is introduced.
  - Python lint type focused Core Observatory and contract tests frontend lint unit production and Storybook builds focused browser accessibility Compose topology shell validation architecture governance baseline protection foundation acceptance and diff checks pass.
