id: AURA-0098
title: Prove Observatory foundation and Core isolation
status: integrated
change_class: evaluation
intent: >
  Close the Observatory expansion foundation with disposable composed-stack
  proof of the real Core-to-Observatory telemetry path, authenticated
  run/trace/analytics browser behavior, metadata-only privacy controls,
  deterministic orchestration checks, and Core/Observatory isolation. Live
  evaluation completion, owner evaluation workflows, and the exhaustive
  dependency-outage matrix are deferred to separately planned work.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/open-decisions.md
    - docs/specifications/aura-ai-envisioned-feature-catalogue.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - AURA-0078 through AURA-0097 own the implemented Core telemetry Observatory query evaluation experiment alert incident retention authentication storage and browser capabilities exercised here.
    - Acceptance uses only disposable project-scoped Compose state fixture credentials and bounded stop restart pause and recovery actions. It never prunes Docker globally touches operator volumes or reads normal deployment secrets.
    - Existing REST SSE NATS OTLP and object-storage contracts are exercised without additive public contract changes. A verified missing public capability returns ADR_REQUIRED or a separately planned contract item rather than an acceptance-only private seam.
    - Deterministic orchestration is proven by the focused composed harness. Live browser evaluation completion, local-judge execution, artifact lifecycle, baseline promotion, and owner operations remain follow-up acceptance scope.
    - Protected repository golden results baselines and thresholds remain unchanged.
    - Core/Observatory isolation is proven through architecture checks, focused failure-isolation tests, and a real Core run observed through the disposable Observatory stack. Exhaustive dependency stop/restart recovery remains follow-up acceptance scope.
    - Product fixes are permitted only when a composed acceptance scenario proves a defect in an already authorized AURA-0078 through AURA-0097 boundary; no new service framework package or cross-product dependency is authorized.
    - Browser acceptance uses real rendered workflows with owner sessions REST snapshots authenticated SSE keyboard operation reduced motion forced colors responsive layouts and browser-persistence inspection.
