  concerns:
    - Fixture credentials are generated inside ignored mode-0600 disposable directories and never printed committed copied into reports or reused by normal deployments.
    - Production telemetry SSE URLs logs metrics screenshots reports and browser persistence remain metadata-only and exclude prompts responses artifacts credentials bearer tokens owner identity and arbitrary attributes.
