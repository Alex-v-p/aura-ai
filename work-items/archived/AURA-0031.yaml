id: AURA-0031
title: Correct conversation activity ordering navigation styling and title reliability
status: integrated
change_class: contract
intent: >
  Order recent conversations only by newly accepted user messages, simplify the
  primary destination presentation, and make pinned-model title generation
  reliable without changing public response shapes or existing fallback titles.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/agents-and-execution.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - User-approved AURA-0031 Conversation Ordering Navigation Styling and Title Reliability plan
    - Only a newly accepted user message advances recent-conversation activity ordering
    - Opening refreshing configuring retrying assistant output and title settlement do not reorder conversations
    - Ollama title inference uses the exact pinned model in bounded non-streaming non-thinking mode
    - Existing fallback titles remain unchanged and future pending titles settle once
    - "All behavior tests and governance evidence are delivered in one reviewed commit named fix(conversations): correct chat ordering, navigation, and titles"
  contracts:
    - contracts/openapi/aura-v1.yaml
