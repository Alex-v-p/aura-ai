contracts:
  changes_allowed: true
  affected:
    - contracts/openapi/aura-v1.yaml
  compatibility_requirement: backward_compatible
data:
  migration_required: false
  owning_service: aura-core
  owning_module: interaction.conversations
observability:
  applicable: true
  affected_components:
    - aura.runtime.model_inference
    - aura.interaction.conversation_persistence
  required_metrics:
    - title_inference_duration_ms
    - title_persistence_duration_ms
    - title_generation_outcome
    - title_input_size
    - title_output_size
  required_evaluators: []
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Title inference may send only the already authorized first completed exchange to the run's exact pinned provider model
    - Transcript prompt provider response and generated title text must never enter logs telemetry audit metadata or errors
    - The optimized Ollama request must not introduce model fallback a new routing policy or an additional provider
    - Owner isolation and opaque cursor behavior must remain intact when ordering uses message activity
  data_classes:
    - private conversation transcript excerpts
    - model-generated conversation titles
    - conversation message run and model identifiers
required_agents:
  implementation:
    - core_worker
    - frontend_worker
    - test_evaluation_engineer
