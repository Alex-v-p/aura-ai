    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 4
  max_parallel_writers: 3
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Core orders conversation pages and cursors by the latest durably accepted user message with a deterministic conversation-id tie break.
  - Opening refreshing configuring retrying receiving assistant output and settling a title do not change recent-conversation order.
  - Aura Web promotes an existing conversation only after Core accepts a newly submitted user message and preserves order after rejected submissions.
  - Unsent drafts remain local and the first accepted message makes a newly persisted conversation the newest item.
  - The primary destination group has no enclosing tray active tile border background dot or check marker while retaining stable sizing representative icons accessible names aria-current and keyboard focus visibility.
  - Ollama title inference uses the run's exact pinned model with stream false think false and a bounded output budget through the existing provider port.
  - Successful future title inference replaces the first-message fallback after terminal refresh while provider timeout failure malformed output and invalid titles retain deterministic fallback behavior.
  - Existing generated legacy and fallback title states are never reopened or rewritten.
  - Title telemetry contains only allowed identifiers sizes outcomes and durations and never conversation title prompt transcript or provider response text.
  - Conversation listing emits a component-local metadata-only persistence span with PostgreSQL dependency outcome latency and trace correlation, and affected component versions identify this rollout.
  - The OpenAPI list description documents latest accepted user-message order with no request response or generated-client shape change.
  - Browser inspection confirms the navigation presentation in light and dark themes at expanded collapsed tablet boundary and mobile drawer widths.
  - All required checks pass and the complete reviewed change is committed once without pushing.
