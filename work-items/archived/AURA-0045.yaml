id: AURA-0045
title: Restore end-to-end memory processing
status: integrated
change_class: bugfix
intent: >
  Allow the seeded general assistant's deterministic platform memory policy to
  pass owner-aware worker resolution so completed turns can reach a durable
  terminal memory outcome.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/memory-and-knowledge.md
  decisions:
    - Recognize only the deterministic general platform policy and per-agent migrated policy identities for blank-principal compatibility
    - Keep structured inference schema enforcement provider-neutral and content-safe
  contracts: []
feature_references: [MOD-017]
ownership_zones:
  - aura-core.agent-memory-policy
  - aura-core.ollama-structured-inference
  - aura-core.ollama-embeddings
allowed_paths:
  - work-items/active/AURA-0045.yaml
  - work-items/archived/AURA-0045.yaml
  - services/aura-core/src/aura_core/domains/interaction/agents/adapters/sql_store.py
  - services/aura-core/src/aura_core/domains/knowledge/memory/repository.py
  - services/aura-core/src/aura_core/domains/knowledge/memory/public.py
  - services/aura-core/src/aura_core/providers/embeddings/ollama/adapter.py
  - services/aura-core/src/aura_core/providers/models/ollama/adapter.py
  - services/aura-core/tests/test_agent_memory_policy_sql.py
  - services/aura-core/tests/test_memory_persistence.py
  - services/aura-core/tests/test_memory_processing.py
  - services/aura-core/tests/test_ollama.py
forbidden_paths:
  - AGENTS.md
  - .agents/**
  - .codex/**
  - tooling/architecture/**
  - contracts/**
  - frontend/**
  - deploy/**
  - compose.yaml
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: aura-core
  owning_module: interaction.agents/providers.models.ollama
observability:
  applicable: true
  affected_components:
    - aura.knowledge.memory_extraction
    - aura.knowledge.memory_persistence
    - aura.runtime.structured_inference
    - aura.runtime.embedding_gateway
  required_metrics:
    - memory_action_outcome
    - memory_model_configuration_outcome
    - memory_operation_outcome
    - structured_inference_duration_ms
    - model_capability_verification_outcome
    - embedding_duration_ms
  required_evaluators:
    - memory_extraction_policy
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Blank-principal compatibility must remain limited to deterministic platform policy identities
    - Structured inference telemetry must never capture evidence, prompts, or model output
    - Embedding identity validation must remain tied to provider artifact metadata
  data_classes: [private_memory_content, private_memory_metadata]
required_agents:
  implementation: [core_worker]
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
  integration: true
execution:
  parallelism_class: local
  max_parallel_agents: 5
  max_parallel_writers: 1
  model_tier: efficient
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - The seeded general assistant's deterministic platform memory policy resolves for its authenticated owner.
  - Arbitrary blank-principal memory policy rows remain unauthorized.
  - Initial model configuration creates and atomically selects active embedding generation one.
  - Selection-time structured verification disables hidden thinking and remains bounded.
  - Runtime structured inference repeats required and enum schema constraints without including user evidence in the trusted system message or telemetry.
  - Ollama embedding responses inherit the immutable provider revision from inventory when the embed response omits it.
  - A completed authenticated turn reaches a durable terminal memory candidate or record and an accepted record has a matching embedding generation.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0045.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0045.yaml
  - python3 tooling/architecture/validate-baseline-protection.py
  - python3 tooling/architecture/validate-observability.py --work-item work-items/active/AURA-0045.yaml
  - uv run --project services/aura-core pytest services/aura-core/tests/test_agent_memory_policy_sql.py services/aura-core/tests/test_memory_persistence.py services/aura-core/tests/test_memory_processing.py services/aura-core/tests/test_ollama.py
  - uv run --project services/aura-core pytest services/aura-core/tests/test_memory_evaluation.py
  - uv run --project services/aura-core ruff check services/aura-core/src/aura_core/domains/interaction/agents/adapters/sql_store.py services/aura-core/src/aura_core/domains/knowledge/memory/public.py services/aura-core/src/aura_core/domains/knowledge/memory/repository.py services/aura-core/src/aura_core/providers/embeddings/ollama/adapter.py services/aura-core/src/aura_core/providers/models/ollama/adapter.py services/aura-core/tests/test_agent_memory_policy_sql.py services/aura-core/tests/test_memory_persistence.py services/aura-core/tests/test_memory_processing.py services/aura-core/tests/test_ollama.py
  - uv run --project services/aura-core pyright services/aura-core/src/aura_core/domains/interaction/agents/adapters/sql_store.py services/aura-core/src/aura_core/domains/knowledge/memory/public.py services/aura-core/src/aura_core/domains/knowledge/memory/repository.py services/aura-core/src/aura_core/providers/embeddings/ollama/adapter.py services/aura-core/src/aura_core/providers/models/ollama/adapter.py
  - git diff --check
baseline_changes_allowed: false
human_approval_required: false
open_decisions: []
