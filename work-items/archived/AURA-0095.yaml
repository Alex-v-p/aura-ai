acceptance_criteria:
  - observatory-v1 adds backward-compatible owner-authorized bounded resources for datasets cases suites evaluators jobs attempts results scores artifacts reviews calibration qualifications cancellation history and deletion with closed schemas stable opaque IDs UTC timestamps versions provenance finite scores explicit partial evidence and cursor pagination.
  - Generated Angular output is reproducible and transport-only. Handwritten feature code consumes its public facade without duplicating wire types or embedding domain behavior in generated files.
  - Evaluation definition and orchestration commands invoke existing application services enforce immutable version and authorization rules require idempotency and return deterministic conflict validation unavailable and terminal states.
  - Evaluation read models use bounded service-owned query ports and deterministic cursors and never access Core tables adapter internals or unbounded result sets.
  - Artifact APIs expose metadata authorization state classification purpose digest size media version retention and deletion status but never content object key filename bucket provider endpoint credential or owner identity.
  - Human review calibration qualification and revocation routes preserve exact evaluation-v1 provenance require owner authorization CSRF idempotency and explicit confirmation where destructive and never return raw comment content.
  - Evaluation deletion supports the already-authorized manual job dataset suite cutoff and purge-all scopes with asynchronous idempotent status content-free audits and preservation rules defined by AURA-0090.
  - The dedicated same-origin evaluation SSE stream starts from REST snapshots accepts an exclusive persisted evaluation Last-Event-ID cursor fully pages bounded catch-up then continuously polls new changes and emits only bounded metadata notifications without scores digests content authorization details or credentials; the existing operational stream remains backward-compatible.
  - CLI commands remain thin use the same application services and DTO validation and print bounded metadata or machine-readable content-free results with finite exit codes.
  - Observatory Web provides accessible responsive keyboard-operable dataset suite evaluator job result score artifact review calibration qualification history reproducibility coverage cancellation and deletion workflows without importing Aura product features.
  - Browser workflows provide loading empty partial stale disconnected rejected unauthorized provider-unavailable service-unavailable failed cancelled and recovery states with focus management announcements non-colour indicators reduced motion and accessible tables paired with any charts.
  - Destructive cancellation deletion revocation and qualification controls show exact bounded scope require explicit confirmation prevent duplicate submission announce asynchronous progress and refresh affected snapshots after completion.
  - Authenticated evaluation REST and SSE data remains memory-only and absent from Workbox Cache Storage localStorage sessionStorage IndexedDB URLs logs screenshots and analytics; logout or auth-generation change clears all evaluation state.
  - Real-browser acceptance covers owner login navigation responsive layouts keyboard operation SSE catch-up job progress cancellation review qualification deletion stale recovery and provider-unavailable degradation using controlled content-free fixtures.
  - Core remains usable when Observatory evaluation services or the optional local judge provider are stopped and no Core source database migration readiness or normal request dependency changes.
  - Python lint type and tests OpenAPI compatibility generated-client parity Angular lint unit production builds Storybook accessibility Playwright browser acceptance architecture validators baseline protection and diff checks pass without protected baseline changes.
