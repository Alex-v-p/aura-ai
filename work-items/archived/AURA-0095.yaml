security_privacy:
  applicable: true
  concerns:
    - Every evaluation route and CLI action is owner-authorized and state changes require CSRF or an equivalent local operator authorization boundary plus idempotency.
    - REST and CLI responses expose only approved bounded metadata and opaque artifact identities; content object keys filenames endpoints credentials bearer tokens owner identity raw prompts rubrics inputs outputs comments rationale hidden reasoning and arbitrary attributes are prohibited.
    - SSE is metadata-only and credentials never appear in URLs. Event payloads carry only bounded resource type opaque resource ID event ID timestamp state and change classification.
    - Browser state is memory-only and authenticated evaluation data is excluded from service-worker caches browser stores URLs logs screenshots and analytics.
    - Query filters cursors limits identifiers confirmation text labels and comments are closed bounded inputs and cannot select SQL object storage locations provider destinations event subjects imports tools or permissions.
    - Artifact deletion cancellation review qualification and destructive controls use explicit confirmation authorization idempotency audit and asynchronous progress where applicable.
    - Provider-unavailable partial failed cancelled stale disconnected rejected unauthorized and service-unavailable states are explicit and never cause Core or normal Observatory readiness dependency.
  data_classes:
    - evaluation_definition_metadata
    - evaluation_job_metadata
    - evaluation_result_metadata
    - evaluation_score_metadata
    - evaluation_artifact_metadata
    - human_review_metadata
    - calibration_qualification_metadata
