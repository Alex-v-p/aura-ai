    - docs/specifications/aura-ai-envisioned-feature-catalogue.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - AURA-0080 owns the existing owner-authorized observatory-v1 REST snapshot and metadata-only same-origin SSE contract with persisted catch-up identifiers.
    - AURA-0081 owns the separate Observatory Angular product browser persistence prohibition and responsive accessible state model.
    - AURA-0089 through AURA-0094 own evaluation-v1 definitions artifacts orchestration deterministic evaluators local judges calibration and service-owned persistence; AURA-0095 exposes those public application boundaries and must not duplicate their domain logic.
    - Evaluation content is authorized untrusted data and remains in Garage. REST metadata may carry opaque identifiers hashes bounded labels finite scores versions provenance and explicit authorization metadata but never raw artifact bytes object keys filenames provider endpoints credentials owner identity prompts rubrics responses comments hidden reasoning or arbitrary attributes.
    - Artifact upload and download streams remain out of initial browser scope. Owner workflows create and inspect versioned definitions and opaque artifact metadata references; content-bearing artifact transfer requires a separately reviewed bounded streaming design and is not implied by catalogue wording.
    - All evaluation reads and commands reuse the Observatory owner BFF session. State changes require same-origin CSRF idempotency and closed confirmation where destructive; credentials never appear in URLs SSE events generated types or browser persistence.
    - Evaluation live updates use a dedicated additive same-origin /api/v1/evaluation/events SSE endpoint with one persisted evaluation sequence and exclusive Last-Event-ID cursor. The existing operational /api/v1/events contract and cursor remain unchanged. REST remains authoritative; catch-up is bounded and fully paged before continuous fair polling and events never carry evaluation content scores comments digests model endpoints or authorization details.
    - Definition job result score review qualification artifact and deletion collections are cursor-paginated and bounded. Sort order cursor semantics filters limits and partial-evidence behavior are explicit and deterministic.
    - The CLI is a thin owner/operator entrypoint over the same application services and DTOs. It does not bypass authorization policy persistence invariants idempotency or deletion safeguards and does not print content credentials object locations or owner identity.
    - Generated Angular output is transport-only and derived from observatory-v1. Domain state reconciliation polling live updates validation confirmation and error recovery remain in Observatory feature code.
    - Browser state is memory-only. Authenticated REST SSE evaluation definitions results scores reviews and artifact metadata are excluded from Workbox Cache Storage localStorage sessionStorage IndexedDB URLs screenshots console output and analytics.
    - Web workflows cover dataset and case definition inspection suite composition evaluator bindings job submission progress cancellation results scores coverage reproducibility artifact metadata human review calibration qualification history and manual deletion. Baselines experiments regressions dashboards alerts and external delivery remain AURA-0096 and AURA-0097.
    - The accepted AURA-0094 provider-unavailable limitation is rendered as a bounded service-unavailable or advisory state. AURA-0095 does not change deployment networking or claim real Ollama acceptance.
    - Independent backend implementation demonstrated that restart-safe Last-Event-ID catch-up has no persisted evaluation event sequence in the existing schema. AURA-0095 therefore authorizes one forward-only idempotent Observatory PostgreSQL migration after 0010 for a bounded metadata-only evaluation live-event ledger; no content scores digests authorization metadata arbitrary attributes or Core state may enter it.
    - Independent durable-query implementation demonstrated that ClickHouse score rows do not preserve every bounded component revision digest and execution provenance field required for authoritative observatory-v1 reproducibility projections. AURA-0095 authorizes one forward-only ClickHouse migration after 0007 for those metadata-only fields; raw artifacts content prompts responses comments endpoints credentials owner identity and arbitrary attributes remain prohibited.
    - AURA-0095 explicitly authorizes the forward-only PostgreSQL live-ledger migration to preserve cancellation and qualification-revocation idempotency fingerprints/replay evidence. Ordinary evaluation notifications remain deletable by authorized retention selectors; evaluation_deletion audit evidence remains preserved.
    - AURA-0095 explicitly authorizes additive PostgreSQL projection metadata columns for authoritative attempt worker component and human-review provenance fields. Missing legacy values remain unavailable/partial; adapters must not borrow or synthesize them.
