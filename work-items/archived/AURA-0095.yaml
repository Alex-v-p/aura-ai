id: AURA-0095
title: Add evaluation API CLI live updates and owner Web workflows
status: integrated
change_class: repository_governance
intent: >
  Expose the integrated Observatory evaluation definitions orchestration scores
  artifacts calibration review and deletion capabilities through an
  owner-authorized backward-compatible REST CLI and metadata-only SSE surface,
  generate a transport-only Angular client, and deliver accessible responsive
  Observatory Web workflows without exposing evaluation content or coupling
  Core to Observatory.
