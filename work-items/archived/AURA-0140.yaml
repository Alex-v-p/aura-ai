contracts:
  changes_allowed: false
  affected:
    - contracts/openapi/aura-v1.yaml
    - contracts/events/runs/v1/run-events.schema.json
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - Fetchers must resist SSRF DNS rebinding redirect abuse private-address access decompression bombs malicious content types browser escape and credential discovery.
    - Search results fetched text excerpts queries artifacts and task detail are owner-private and excluded from URLs logs telemetry metadata-only events service-worker caches and browser persistence.
    - Fetched and model-produced content is untrusted evidence and cannot modify policy prompts tools permissions budgets task transitions or artifact authorization.
    - Background workers and provider services carry no user authority and must revalidate immutable owner scope and narrowed grants through Core application APIs.
    - Task projection must not become a second source of truth or read another domain's persistence internals.
    - Artifact deletion and task cancellation must remain idempotent and truthful across unknown storage provider and transport outcomes.
  data_classes:
    - owner-private research questions plans excerpts citations and reports
    - owner-private generated text artifacts and lineage
    - owner-private task detail and source status
    - metadata-only lifecycle identifiers status versions and timestamps
required_agents:
  implementation:
    - delivery_lead
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
    - aura_ux_ui_reviewer
  integration: false
execution:
  parallelism_class: standard
  max_parallel_agents: 6
  max_parallel_writers: 1
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - An accepted ADR authorizes SearXNG plus separate no-credential static and browser fetcher deployables with exact trust network secret filesystem resource and kill-switch boundaries.
  - The design fixes the Quick Auto Deep and Agent-led budgets interactive detachment extension policy source retention browser-selection policy and bounded evidence-sufficiency outcome.
  - Generated artifacts have explicit ownership revision lineage integrity storage preview download manual-retention and deletion semantics without reusing Observatory artifacts.
  - Task Center remains a rebuildable federated projection whose source modules retain authority and whose generic commands route only through public application APIs.
  - Research completion from conversation defines synchronous and detached behavior compact cited completion append notification and failure cancellation and budget-exhaustion outcomes.
  - The threat model covers SSRF DNS rebinding redirects parser and browser compromise prompt injection secrets content leakage duplicate delivery cancellation races resource exhaustion and deletion ambiguity with testable mitigations.
  - The document defines AURA-0141 through AURA-0148 ownership dependencies contracts migrations observability evaluation rollout and rollback without implementing product behavior.
  - No product code contract migration dependency deployment telemetry baseline or generated client changes occur in AURA-0140.
