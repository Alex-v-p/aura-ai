id: AURA-0140
title: Authorize governed web research and task artifact boundaries
status: integrated
change_class: repository_governance
intent: >
  Authorize an implementation-ready bounded architecture for governed web
  research, Core-owned generated text artifacts, and a federated durable-task
  projection without weakening Core ownership, provider isolation, bounded
  execution, privacy, or Observatory independence.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/agents-and-execution.md
    - docs/specifications/memory-and-knowledge.md
    - docs/specifications/tools-automation-and-integrations.md
    - docs/specifications/clients-and-voice.md
    - docs/specifications/open-decisions.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/sidebar-and-management-surfaces.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - docs/adr/0017-governed-production-run-evidence.md
    - The owner approved the AURA-0140 through AURA-0148 initiative on 2026-10-28 and requested implementation from the latest remote dev branch.
    - Research is available from conversation and a dedicated workspace, with Quick, Auto, Deep, and bounded Agent-led modes and HTTP preferred over isolated browser retrieval by cost policy.
    - Generated artifacts initially support system-generated Markdown, plain text, and JSON with manual-only retention and explicit deletion.
    - Task Center is a federated read projection over research, workflows, briefings, document processing, and memory reindexing; source domains remain authoritative.
  contracts:
    - contracts/openapi/aura-v1.yaml
    - contracts/events/runs/v1/run-events.schema.json
