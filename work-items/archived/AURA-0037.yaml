id: AURA-0037
title: Add autonomous memory contracts and persistence foundation
status: integrated
change_class: repository_governance
intent: >
  Establish the versioned owner-scoped memory contract and Core persistence
  foundation required for autonomous extraction, lifecycle management, hybrid
  retrieval, and inspectable Aura Web experiences without implementing model
  extraction, conversational recall, or the memory product UI in this item.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/memory-and-knowledge.md
    - docs/specifications/agents-and-execution.md
    - docs/specifications/clients-and-voice.md
    - docs/specifications/open-decisions.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - User-approved Autonomous Scoped Long-Term Memory plan
    - Accepted memories use immutable revisions and preserve provenance correction supersession and lifecycle history
    - Initial scopes are the authenticated owner-wide user scope and individual agent scopes only
    - Every accepted memory revision receives an embedding while lifecycle metadata determines ordinary retrieval eligibility
    - PostgreSQL owns canonical memory and embedding-generation state and pgvector remains behind a Core-owned port
    - Memory records are never automatically deleted and explicit purge retains only content-free audit metadata
    - Extraction recall maintenance agent memory policies and Aura Web memory surfaces are reserved for later work items
    - Architecture review requires the new memory roots and dependency edges to be registered in the repository module registry before this checkpoint may integrate
  contracts:
    - contracts/openapi/aura-v1.yaml
