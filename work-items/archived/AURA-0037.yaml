  max_parallel_agents: 8
  max_parallel_writers: 4
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - The OpenAPI contract adds backward-compatible owner-authenticated memory list search detail create correction status pin and purge resources with transport-only generated TypeScript types.
  - Canonical memory records and immutable revisions remain separate from provenance evidence embedding generations and per-revision embeddings.
  - Memory types cover episodic semantic procedural preference and system records while scopes are limited to user and agent.
  - Lifecycle supports active dormant archived disabled disputed and superseded states plus manual pinning optional validity bounds confidence importance and half-life from 0.25 through 3650 days.
  - PostgreSQL migrations upgrade from revision 0007 and fresh installations create the pgvector extension and Core-owned memory tables constraints indexes and transactional purge support.
  - Every accepted revision may reference one embedding per generation with model identity digest dimension and timestamps while no provider model name is hard-coded.
  - API mutations use CSRF idempotency optimistic versions and content-safe errors and all reads are scoped to the authenticated owner.
  - Corrections append immutable revisions and preserve evidence while state changes do not overwrite canonical revision history.
  - Purge requires the exact confirmation phrase removes content revisions evidence and embeddings atomically and leaves content-free audit metadata only.
  - Persistence instrumentation emits stable metadata-only component measurements and never memory text provenance content or vector values.
  - Compose development and end-to-end PostgreSQL services provide the accepted pgvector PostgreSQL 17 boundary without exposing a new host port or changing service ownership.
  - In-memory and PostgreSQL adapters expose the same public application behavior and focused contract migration security observability and system tests pass.
  - Every new Core memory bootstrap and route source has exactly one module-registry owner with reviewed public dependency edges and the module registry validator passes.
