contracts:
  changes_allowed: true
  affected:
    - contracts/openapi/aura-v1.yaml
  compatibility_requirement: backward_compatible
data:
  migration_required: true
  owning_service: aura-core
  owning_module: knowledge.memory
observability:
  applicable: true
  affected_components:
    - aura.knowledge.memory_persistence
  required_metrics:
    - memory_operation_duration_ms
    - memory_operation_outcome
    - memory_lifecycle_status
    - memory_scope_type
  required_evaluators: []
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Every read and mutation must remain bound to the authenticated owner issuer and subject
    - Agent-scoped records must not become readable through an unscoped identifier or list query
    - Memory text provenance and embeddings must never enter telemetry logs error payloads or content-free purge audit records
    - Hard purge must require an explicit confirmation phrase and remove canonical text revisions provenance and embeddings transactionally
    - Credential-like content is not accepted through the manual API and later automatic extraction cannot rely on this API to weaken that rule
    - Optimistic versions and idempotency keys must prevent lost updates and duplicate revisions
  data_classes:
    - private durable memory content
    - memory provenance and source identifiers
    - semantic embeddings derived from private memory content
    - owner and agent scope identifiers
