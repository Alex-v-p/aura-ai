id: AURA-0024
title: Register conversation persona override dependencies
status: integrated
change_class: repository_governance
intent: >
  Register the reviewed conversation persona override dependencies and public
  surfaces, then verify the combined sidebar navigation and persona workstream
  against repository architecture and integration checks.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
    - docs/development/architecture-enforcement.md
  specifications: []
  decisions:
    - User-approved Sidebar Conversation Navigation and Persona Override Workstream
    - AURA-0022 reviewed checkpoints 4b7cd86 9057ace c7512a9 e2d95d8
    - AURA-0023 reviewed checkpoints 4ab3f22 bbe6c97
    - Registry metadata records reviewed dependencies and adds no product behavior
  contracts: []
feature_references:
  - DEV-005
  - DEV-006
  - DEV-018
ownership_zones:
  - repository.governance
  - architecture.module-registry
allowed_paths:
  - work-items/active/AURA-0024.yaml
  - work-items/archived/AURA-0024.yaml
  - tooling/architecture/modules.yaml
  - tooling/architecture/dependency-rules.yaml
  - tooling/architecture/tests/test_modules.py
  - docs/architecture/module-boundaries.md
forbidden_paths:
  - AGENTS.md
  - .agents/**
  - .codex/**
  - .github/**
  - contracts/**
  - services/**
  - frontend/**
  - deploy/**
  - compose.yaml
  - docs/adr/**
  - docs/specifications/**
  - evaluations/**
  - infra/**
  - satellites/**
  - extensions/**
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - Registry dependencies must use public conversation and persona surfaces only
    - Core and Observatory isolation must remain intact
    - Governance metadata must not change product behavior or data handling
  data_classes:
    - module ownership metadata
required_agents:
  implementation:
    - platform_worker
  review:
    - general_reviewer
    - architecture_guardian
  integration: true
execution:
  parallelism_class: local
  max_parallel_agents: 1
  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: false
  escalation_reason_required: true
acceptance_criteria:
  - Conversation persona dependencies and any new API migration or frontend roots have exactly one registry owner.
  - Dependency direction uses only reviewed public application boundaries and generated transport surfaces.
  - The module-boundary summary matches the reviewed implementation.
  - Product contract frontend migration observability repository-shape and architecture checks pass together.
  - No product behavior permissions prompt content or protected baseline is changed by governance closure.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0024.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0024.yaml
  - python3 -m unittest tooling.architecture.tests.test_modules -v
  - python3 tooling/architecture/validate-module-registry.py
  - python3 tooling/architecture/validate-import-boundaries.py
  - python3 tooling/architecture/validate-service-isolation.py
  - python3 tooling/architecture/validate-frontend-boundaries.py
  - python3 tooling/architecture/validate-repository-shape.py
  - python3 tooling/architecture/validate-contract-changes.py
  - python3 tooling/architecture/validate-generated-sync.py
  - python3 tooling/architecture/validate-observability.py --work-item work-items/archived/AURA-0023.yaml
  - python3 tooling/architecture/validate-baseline-protection.py
  - UV_CACHE_DIR=.local-state/uv-cache RUFF_CACHE_DIR=.local-state/ruff-cache uv run ruff check services/aura-core
  - UV_CACHE_DIR=.local-state/uv-cache uv run pyright services/aura-core
  - UV_CACHE_DIR=.local-state/uv-cache uv run pytest -p no:cacheprovider services/aura-core/tests -q
  - pnpm --dir frontend run lint
  - pnpm --dir frontend run test
  - pnpm --dir frontend run build:production
  - pnpm --dir frontend run build-storybook
  - pnpm --dir frontend exec playwright test --config playwright.config.ts
  - docker compose config --quiet
  - AURA_E2E_MODE=external sh deploy/compose/run-full-stack-e2e.sh
  - AURA_E2E_MODE=local-identity sh deploy/compose/run-full-stack-e2e.sh
  - git diff --check
baseline_changes_allowed: false
human_approval_required: true
open_decisions: []
