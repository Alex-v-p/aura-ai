security_privacy:
  applicable: true
  concerns:
    - Every list detail occurrence-history and command request is owner-scoped and cross-owner identifiers resolve as not found without leaking record existence.
    - Every mutation requires accepted-session CSRF same-origin UUID idempotency and an exact expected version; replay returns the committed response and conflicting reuse or stale versions remain explicit.
    - Private reminder content recurrence configuration timezone local wall time due instants and owner identity remain absent from SSE outbox audit metadata logs telemetry and ordinary errors.
    - One-shot /api/v1/reminders payloads statuses pagination and behavior remain wire-compatible and generated series occurrences are merged only through the additive nextReminderId field on series responses.
    - Angular never calculates recurrence or lifecycle transitions and never stores session credentials private reminders or CSRF data durably in the browser.
    - Session or principal changes clear recurring drafts detail occurrence history pending mutations idempotency state cached CSRF and stale request generations.
    - Consequential lifecycle commands are not automatically retried after timeout disconnect or unknown completion and require an owner-authorized reconciliation read.
  data_classes:
    - private_reminder_content
    - private_recurrence_configuration
    - owner_scoped_series_and_occurrence_records
    - lifecycle_versions_and_idempotency_keys
    - private_timezone_and_due_values
