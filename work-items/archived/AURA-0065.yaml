    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-approved additive Aura OpenAPI minor version 1.12.0 with reminder-series list create detail occurrence-history update pause resume skip-next and cancel resources
    - Owner-approved owner authorization on every series query with CSRF and same-origin enforcement on every mutation
    - Owner-approved UUID idempotency keys and expected versions for recurring lifecycle commands
    - Owner-approved unchanged one-shot reminder request and response payloads with nextReminderId linking generated occurrences for client-side agenda deduplication
    - Owner-approved unified agenda with a repeat badge and /reminders/series/:seriesId detail route rather than a separate schedules destination
    - Owner-approved recurring composer presets interval weekdays monthly date IANA timezone and optional count or end-date controls
    - Recurrence calculation lifecycle transitions and cadence validation remain in the Core reminder application API and never move into Angular
    - Consequential commands are never automatically retried and unknown outcomes require authoritative reconciliation
    - Existing responsive drawer/full-page focus keyboard reduced-motion zoom and session-reset patterns remain authoritative
