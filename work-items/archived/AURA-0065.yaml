id: AURA-0065
title: Add recurring reminder API and Aura Web experience
status: integrated
change_class: contract
intent: >
  Expose the recurring reminder-series foundation through additive owner-scoped
  Aura v1 HTTP resources and a generated transport client, then add recurring
  creation, unified-agenda presentation, route-backed series detail, lifecycle
  commands, accessible responsive behavior, and honest recovery in Aura Web
  without changing one-shot reminder contracts or moving recurrence rules into
  Angular.
