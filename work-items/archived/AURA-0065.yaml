acceptance_criteria:
  - Aura OpenAPI version 1.12.0 additively defines GET and POST /api/v1/reminder-series GET /api/v1/reminder-series/{series_id} GET /api/v1/reminder-series/{series_id}/occurrences and idempotent update pause resume skip-next and cancel command endpoints while every existing /api/v1/reminders schema and operation remains unchanged.
  - Structured recurrence DTOs cover frequency positive interval selected weekdays or monthly date local wall-clock start validated IANA timezone and optional count or end-date termination with mutually valid field combinations.
  - Series DTOs expose status version readable rule next occurrence nextReminderId accumulated missed count lifecycle timestamps and private detail only to the authorized owner; occurrence DTOs expose scheduled fired completed skipped replaced paused-window and series-canceled without expanding ReminderStatus.
  - Series and occurrence queries are owner-scoped use bounded opaque pagination where collections can grow and expose cross-owner identifiers only as not found.
  - Mutations enforce same-origin CSRF UUID idempotency expected-version optimistic concurrency exact replay conflicting-key detection validation errors permission errors and explicit unknown-outcome semantics through the existing HTTP error model.
  - The generated TypeScript transport client is synchronized from OpenAPI and contains transport types and methods only; it contains no recurrence lifecycle or presentation logic.
  - The Reminders composer offers one-shot and recurring creation with plain-language presets plus interval weekday monthly-date timezone and optional count or end-date controls and preserves valid draft input after recoverable validation conflict offline or unknown-outcome failures.
  - Recurrence field combinations timezone identifiers start values and termination controls receive accessible inline validation before submission while Core remains authoritative and backend validation is rendered without private diagnostics.
  - The agenda remains one unified owner-scoped list deduplicates a series next occurrence against its generated ordinary Reminder by nextReminderId and marks recurring entries with a readable repeat badge.
  - Selecting a recurring agenda entry navigates to /reminders/series/:seriesId and presents a focus-managed desktop drawer or mobile full-page detail with readable recurrence timezone next occurrence status history and explicit edit pause or resume skip-next and cancel actions.
  - Consequential commands use fresh UUID idempotency and expected versions disable duplicate submission are never automatically retried and distinguish validation stale-version offline permission and unknown completion with authoritative reconciliation before another command.
  - Authentication and principal changes clear recurring collections detail histories private drafts mutation state cached CSRF and stale request generations so obsolete responses cannot repopulate the accepted session.
  - Drawer and full-page behavior supports keyboard operation Escape and explicit close or Back focus restoration semantic headings visible focus reduced motion 200 percent zoom reflow and screen-reader status announcements.
  - Light and dark Storybook stories cover recurring composer agenda detail history loading empty validation conflict offline permission unknown-outcome paused completed and canceled states using approved semantic tokens.
  - Automated frontend coverage includes unified-agenda deduplication composer validation detail and history lifecycle commands draft preservation conflict and session recovery keyboard focus responsive layouts reduced motion zoom and axe checks.
  - No recurrence calculation duplicate domain state new destination Web Push Home Assistant calendar household sharing workflow conversational tool approval voice Observatory migration service framework or package is introduced.
