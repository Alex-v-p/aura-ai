contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - Shell navigation must not broaden access to approval notification conversation or memory content.
    - Badges expose counts only and must not reveal sensitive approval or notification payloads.
    - Draft preservation applies only within the currently authorized browser context and does not add durable storage.
  data_classes:
    - owner_navigation_state
    - owner_conversation_draft
    - approval_and_notification_counts
required_agents:
  implementation:
    - frontend_worker
  review:
    - general_reviewer
    - architecture_guardian
  integration: false
execution:
  parallelism_class: local
  max_parallel_agents: 3
  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Wide desktop presents a readable approximately 280px grouped sidebar that can collapse to a 72px rail without removing any global destination badge or Preferences access.
  - Tablet presents rail-appropriate global controls only and opens conversation search filters and history contextually without clipping the content canvas.
  - Mobile presents the same grouped hierarchy in a focus-managed drawer that closes on Escape and restores focus to its trigger.
  - Navigation labels are at least 14px expanded preferred targets are at least 44 by 44px and current location uses aria-current plus a visible non-color marker or surface.
  - Conversations Personalize Automate and Activity groups contain exactly the approved destinations while approval and notification counts remain reachable in every shell mode.
  - Conversation library controls render only for conversation routes and never inside the compact rail.
  - Appearance uses an accessible Preferences disclosure with system light and dark choices and does not reload the page or move focus unexpectedly.
  - Both Aura wordmarks and all destination links use Angular router navigation and preserve an unsent conversation draft.
  - Shared UI and layout additions remain product-neutral and expose consistent page header state panel tabs list-detail drawer and status patterns without importing Aura feature libraries.
  - Existing route deep links theme behavior conversation functions authentication boundaries and Core Observatory separation remain compatible.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0059.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0059.yaml
