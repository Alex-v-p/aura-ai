id: AURA-0059
title: Rebuild the Aura Web shell and shared UI foundation
status: integrated
change_class: feature
intent: >
  Replace the cramped destination strip and unstable compact navigation with a
  grouped accessible adaptive sidebar, keep conversation-library controls
  contextual to Conversations, preserve drafts through SPA navigation, and
  establish product-neutral shared page and state primitives for later
  management-surface migrations.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/design/README.md
    - docs/design/foundations.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/sidebar-and-management-surfaces.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-approved grouped Conversations Personalize Automate and Activity navigation
    - Owner-approved approximately 280px desktop sidebar 72px rail and grouped mobile drawer
    - Owner-approved conversation library as Conversations-only contextual navigation
    - Owner-approved Preferences placement for appearance and persistent approval and notification badges
  contracts: []
feature_references:
  - AUI-001
  - AUI-002
  - AUI-003
  - AUI-004
  - AUI-005
  - AUI-007
