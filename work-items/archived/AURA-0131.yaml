    - docs/design/foundations.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/sidebar-and-management-surfaces.md
    - docs/specifications/tools-automation-and-integrations.md
    - docs/specifications/clients-and-voice.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - work-items/archived/AURA-0127.yaml
    - work-items/archived/AURA-0128.yaml
    - work-items/archived/AURA-0129.yaml
    - work-items/archived/AURA-0130.yaml
    - The owner authorized implementation of all four initiative stages on 2026-10-26; AURA-0131 activates only Stage 2 slice 4.
    - The existing v1.19.0 calendar OpenAPI contract and generated Aura client are authoritative and unchanged by this frontend slice.
    - One integrations-calendar feature library owns generated-client adaptation, ephemeral calendar state, lifecycle UI, discovery, and explicit selection. The daily-action library may consume its public agenda projection, but integrations-calendar never depends on daily-action.
    - The shell owns only routes, navigation, focus behavior, and provider composition. It does not infer connection actions, conflict relationships, or calendar business rules.
    - Calendar event content is held only in authenticated in-memory state and is cleared on owner-session reset, authorization failure, logout, route teardown where applicable, or explicit refresh replacement. It never enters URLs, router state, browser storage, service-worker caches, logs, telemetry, or Observatory.
    - OAuth authorizationPath is opaque, same-origin, used only after an explicit owner action, and is never prefetched, persisted, logged, parsed, or copied into router state.
    - readsEnabled and availableActions are authoritative. The browser renders server conflict relationships and never calculates or repairs conflicts locally.
    - The agenda uses the browser-resolved IANA timezone for the bounded visible day unless the owner explicitly selects another timezone for the current in-memory view; no durable timezone preference is introduced.
