acceptance_criteria:
  - A registered integrations-calendar frontend feature library consumes only the existing generated Aura client and approved shared UI surfaces, exposes a deliberate public API, and never depends on daily-action, Core internals, provider code, or Observatory.
  - The shell adds /integrations and /integrations/calendar routes plus an accessible Connect navigation group while retaining every existing deep link, mobile inertness, focus restoration, keyboard behavior, themes, reduced motion, and responsive navigation semantics.
  - The integration UI renders the authoritative connection state, readsEnabled, availableActions, lastError, and recovery guidance and supports explicit connect, callback completion, reauthorize, and disconnect flows without persisting or exposing authorizationPath or provider material.
  - Calendar discovery presents at most the contract-bounded readable set, newly discovered calendars remain unselected, and explicit empty or bounded selection replacement uses the complete Aura calendar UUID set, current expectedVersion, CSRF, and UUID idempotency while preserving recoverable version conflicts.
  - The calendar store suppresses stale responses, bounds pagination and refresh behavior, retains no event content outside authenticated in-memory state, and clears private state on owner-session reset, authorization failure, logout, permission loss, and owner change.
  - Today adds one chronological agenda with timezone and date context, all-day events before timed rows, explicit text-and-icon source labels, cross-timezone provenance, and server-returned conflict explanations without browser-side conflict calculation.
  - Existing reminder, notification, approval, and conversation sections remain independently useful when calendar is disconnected, expired, rate-limited, partial, stale, empty, unavailable, canceled, or failed; calendar recovery never erases unrelated Today content.
  - Loading, connected, disconnected, connecting, reauthorization-required, revocation-uncertain, disabled, unavailable, partial-calendar, stale, rate-limited, permission-denied, empty, offline, and reconnecting states have focused accessible recovery behavior and tests.
  - OAuth return restores focus to the connection-status heading or exact actionable error, and selection, refresh, disconnect, and retry actions preserve valid state and return focus predictably.
  - Unit, Storybook, and Playwright coverage verifies desktop, tablet, mobile, keyboard-only operation, accessible names and status announcements, touch targets, light and dark themes, reduced motion, 200 percent reflow, private-content containment, session reset, and request amplification bounds.
  - No OpenAPI, generated client, Core, migration, deployment, dependency, service-worker, runtime telemetry, event contract, protected baseline, or durable browser-storage behavior changes.
