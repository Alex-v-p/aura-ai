security_privacy:
  applicable: true
  concerns:
    - Calendar names, event titles, descriptions, attendees, locations, provider identifiers, request ranges, cursor values, timezone selections, OAuth paths, credentials, and owner identity must not enter URLs, browser persistence, service-worker caches, logs, telemetry, Storybook artifacts, screenshots committed to the repository, or Observatory.
    - Lifecycle and selection mutations require the existing owner session, origin-aware CSRF behavior, UUID idempotency, optimistic selection versioning, explicit owner action, and closed sanitized recovery states.
    - The browser must not receive or infer provider tokens, authorization code, state, nonce, credential references, provider page tokens, lifecycle transitions, or conflict relationships beyond the approved public projections.
    - Private calendar state must be cleared on session replacement, logout, authorization failure, permission loss, and owner change without clearing independently available reminder, notification, approval, or conversation state.
    - Provider event text is untrusted display content and cannot become HTML, instructions, memory, tool input, policy, or client-side authority.
  data_classes:
    - owner-private calendar connection and selectable-calendar metadata
    - transient owner-private normalized event content and conflict relationships
    - owner-private reminder content already authorized for Today
