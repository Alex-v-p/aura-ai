id: AURA-0131
title: Add the Aura Web calendar planner
status: integrated
change_class: repository_governance
intent: >
  Add owner-safe Google Calendar connection management and a read-only daily
  agenda to Aura Web by consuming the existing v1.19.0 generated client,
  preserving the current Today experience when calendar data is unavailable,
  and keeping lifecycle and conflict authority in Aura Core.
