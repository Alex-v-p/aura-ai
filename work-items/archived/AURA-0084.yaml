id: AURA-0084
title: Add recoverable Observatory owner-session UX
status: integrated
change_class: contract
intent: >
  Make initial sign-in, explicit logout, session expiry, callback failure, and
  identity unavailability distinct, accessible, recoverable browser states
  without weakening the existing Observatory BFF identity boundary.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/foundations.md
    - docs/design/sidebar-and-management-surfaces.md
  decisions:
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Keep separate Core and Observatory clients audiences sessions cookies and callback routes.
    - Keep the Observatory callback outside OpenAPI and expose only finite sanitized same-origin recovery states to the browser.
    - Preserve private-state clearing and stale-request invalidation whenever the owner session becomes unavailable.
    - Follow the W3C WAI ARIA Authoring Practices keyboard-interface guidance for persistent visible and predictable focus.
  contracts:
    - contracts/openapi/observatory-v1.yaml
feature_references:
  - OBS-003
  - OBS-038
