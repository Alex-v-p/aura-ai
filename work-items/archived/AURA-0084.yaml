  max_parallel_agents: 6
  max_parallel_writers: 1
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Multi-chunk Core assistant streams append through the asynchronous SQL repository without implicit relationship I/O or persistence failure.
  - Core OTLP serialization replaces only the internal all-zero no-trace sentinel with a valid metadata-only trace identifier so one background span cannot invalidate a batch containing real run spans.
  - Observatory accepts Core's existing canonical lowercase 128-bit UUID identifiers without requiring RFC version or variant marker bits, while preserving fixed length and alphabet bounds.
  - High-volume metadata SSE notifications coalesce into bounded single-flight snapshot refreshes with a guaranteed trailing refresh, so continuous telemetry cannot starve run discovery or create unbounded browser work.
  - Component-health queries execute on the pinned ClickHouse version without aggregate-alias collisions and retain accurate bounded latency and outcome summaries.
  - Initial anonymous access explicit logout in-session expiry and callback failure render distinct finite plain-language states with one prominent same-origin owner sign-in action.
  - Missing expired malformed denied or failed OIDC callbacks return to a sanitized Observatory recovery surface without reflecting provider or credential details in the body URL cookies logs or browser storage.
  - Successful callbacks retain strict issuer audience nonce and configured-owner validation rotate any prior session and return only to an existing bounded local path.
  - A session lost while focus is inside authenticated navigation trace component or retention content clears private state announces the change and moves focus predictably to the recovery heading without focusing the page on initial load before session status is known.
  - The recovery action has native link semantics visible focus styling keyboard activation and responsive presentation at mobile tablet desktop 200 percent zoom reduced-motion and dark-theme settings.
  - Logout expiry and callback recovery preserve separate Core and Observatory sessions audiences cookies and CSRF boundaries and never store bearer credentials or authenticated API data in the browser.
  - Mocked and full-stack browser acceptance cover failure followed by successful retry normal down session preservation destructive reset reauthentication and continued Core usability.
  - The shipped Observatory session store persists sessions on its service-owned volume so the repository local-http down and subsequent up lifecycle preserves a valid owner session without test-only runtime overrides.
  - The Observatory same-origin proxy preserves the browser authority including any non-default port so origin-less EventSource requests can be authenticated without weakening the API origin boundary.
  - The query API component manifest declares the metadata-only observatory_auth_recovery evaluator without adding unbounded telemetry labels.
