contracts:
  changes_allowed: true
  affected:
    - metadata-observation-v1
    - observatory-v1
  compatibility_requirement: backward_compatible
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: true
  affected_components:
    - aura.observatory.query_api
  required_metrics:
    - observatory_auth_callback_duration_ms
    - observatory_auth_callback_outcome
  required_evaluators:
    - observatory_auth_recovery
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Callback recovery never reflects provider errors authorization codes state nonces tokens issuers endpoints subjects or exception text.
    - The browser continues to receive only an HttpOnly opaque session cookie and an ephemeral CSRF value from the same-origin BFF.
    - Session expiry and logout clear authenticated snapshots trace state filters retention state and deferred request completions before recovery UI appears.
    - Recovery markers are finite non-sensitive same-origin values removed from the address bar after consumption and never persisted.
    - Focus restoration and live announcements must not expose owner identity or authenticated Observatory data.
  data_classes:
    - authentication_session_metadata
required_agents:
