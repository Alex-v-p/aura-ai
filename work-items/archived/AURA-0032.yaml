  max_parallel_agents: 5
  max_parallel_writers: 3
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Migration 0007 adds nullable archived_at plus a principal/archive index on fresh and upgraded databases without changing existing titles ordering messages runs or identifiers.
  - Manual rename trims titles rejects control characters and newlines enforces 1 to 255 characters records internal manual title state and cannot be overwritten by title inference.
  - A CSRF-protected idempotent metadata endpoint supports rename archive and restore with optimistic version checks and returns archivedAt through ConversationSummary.
  - Archive is rejected while a run is queued running or cancellation-requested; archived conversations allow only restore and reject new runs retries renames and configuration changes.
  - Direct owner reads can inspect archived conversations while the default list excludes them and archiveState can select active archived or all.
  - List filtering supports literal case-insensitive title search exact agent-profile model and latest-run-status filters plus inclusive activityFrom and exclusive activityTo UTC bounds.
  - Activity ordering and restore position depend only on the latest accepted complete user message with conversation ID tie breaking.
  - Versioned opaque cursors bind to normalized filters accept the legacy cursor only under default filters and reject invalid or mismatched cursors with 400.
  - Metadata mutations emit identifier-only audit and metadata-only telemetry while titles search terms transcripts prompts and provider payloads remain excluded.
  - The OpenAPI additions remain backward compatible and the generated TypeScript transport client stays synchronized.
