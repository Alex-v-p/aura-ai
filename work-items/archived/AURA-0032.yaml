id: AURA-0032
title: Add conversation metadata search and lifecycle
status: integrated
change_class: contract
intent: >
  Let the configured Aura owner find conversations by safe metadata, manually
  rename them, and move them through a reversible read-only archive lifecycle
  without changing activity ordering, exposing transcript content, or weakening
  run, identity, audit, and telemetry boundaries.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/agents-and-execution.md
    - docs/specifications/clients-and-voice.md
    - docs/specifications/open-decisions.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - User-approved Conversation Productivity Feature Set
    - Search is limited to titles and structured metadata and never indexes message content
    - Archive is reversible and read-only until restore and cannot begin while a run is active
    - Manual rename is authoritative over pending or generated model titles
    - Conversation ordering remains based only on the latest durably accepted user message
    - Owner authorized removing the unrelated full-suite Playwright baseline gate after attribution proved AURA-0032 changes no frontend application behavior
  contracts:
    - contracts/openapi/aura-v1.yaml
