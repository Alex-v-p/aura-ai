contracts:
  changes_allowed: true
  affected:
    - aura-openapi-v1
  compatibility_requirement: backward_compatible
data:
  migration_required: true
  owning_service: aura-core
  owning_module: interaction.conversations
observability:
  applicable: true
  affected_components:
    - aura.interaction.conversation_persistence
  required_metrics:
    - conversation_list_duration_ms
    - conversation_metadata_mutation_duration_ms
    - conversation_filter_outcome
    - conversation_archive_outcome
  required_evaluators: []
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Every list filter and metadata mutation remains scoped to the authenticated issuer and subject
    - Conversation titles and private search terms never enter audit records logs telemetry or error payloads
    - Archived conversations remain readable only to their owner and block all writes except restore
    - Run state is locked before archive so active execution cannot be hidden or orphaned
    - Cursor filter fingerprints contain only normalized non-content filter metadata
  data_classes:
    - private conversation titles
    - conversation lifecycle metadata
    - agent model run status and activity metadata
    - authenticated principal identifiers
