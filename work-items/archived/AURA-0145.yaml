security_privacy:
  applicable: true
  concerns:
    - Owner-private questions queries seed URLs domains titles source URLs excerpts evidence citations and artifact content never enter events ordinary telemetry logs error text caches or browser-visible query strings.
    - All provider output is untrusted evidence; closed coordinator schemas and deterministic policy checks alone control instructions grants tools budgets destination decisions citations and lifecycle transitions.
    - Evidence IDs are task-scoped and citations settle only after deterministic support validation; unknown cross-task stale deleted or invented evidence cannot be cited.
    - Complete fetched pages are transient and discarded after settlement; only bounded cited excerpts source metadata and content-free lifecycle truth remain.
    - Cancellation extension deletion retry and reconciliation require owner authorization CSRF idempotency expected versions and durable unknown-outcome handling without resurrecting evidence or linked artifacts.
    - Operator caps cannot be raised by owner presets or the single extension; static retrieval receives preference and browser fallback requires an explicit inadequate-extraction transition and remaining budget.
  data_classes:
    - owner-private research questions queries target restrictions and settings
    - hostile transient fetched web bytes and bounded extracted evidence
    - owner-private source metadata excerpts citations reports and provenance
    - restricted durable operation ledgers checkpoints deletion truth and idempotency records
    - content-free lifecycle invalidations tombstones metrics and traces
required_agents:
  implementation:
    - core_worker
    - platform_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 6
  max_parallel_writers: 2
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Every admitted request creates exactly one durable research task and immutable admitted budget before provider dispatch; Quick is 90 seconds and six sources, Auto ten minutes and fifteen sources, Deep thirty minutes and thirty sources, and Agent-led at most sixty minutes and sixty sources under operator caps.
  - Migration 0032 descends exactly from 0031, preserves one Alembic head, upgrades existing databases additively, and durably represents ownership settings task lifecycle checkpoints operation ledger evidence citations delivery-independent artifact lineage extension state deletion truth idempotency and outbox state.
  - The coordinator resumes after restart from the last committed checkpoint, rejects duplicate late reordered or post-cancel provider results, never dispatches after durable cancel intent, and truthfully settles completed partial budget_exhausted failed canceled or interrupted outcomes.
  - HTTP receives the cost preference; browser retrieval occurs only for justified JavaScript or inadequate static extraction with remaining admitted budget, and every search fetch redirect byte text browser model source and time counter remains within its envelope including retries.
  - Evidence is task-scoped, bounded and validated before synthesis; every retained material claim is supported, citations resolve to admitted nondeleted evidence, and unsupported invented stale duplicate and cross-task citations fail closed.
  - Successful or truthful partial research creates immutable Markdown report and optional JSON source-manifest artifacts through the generated-artifact public API with research task provenance and no direct artifact persistence import.
  - The research source public API supplies the same TaskProjectionSnapshotV1 for live invalidation rebuild and backfill and owns advertised cancel or retry commands; execution.tasks never imports research tables repositories or ORM models.
  - Owner-authorized research and evidence deletion makes content immediately unreadable, serializes against completion and artifact delivery, preserves content-free tombstones, and truthfully supports known-failure retry and unknown-outcome reconciliation without resurrection.
  - Queue lag cancellation command latency cancel-settlement lag budget settlement and static-browser fallback instrumentation implement the exact clocks units finite dimensions and one-terminal-sample rules from the approved design; Observatory outage cannot alter outcomes.
  - Unit property migration live-PostgreSQL restart race duplicate cancellation extension provider-fault citation deletion privacy and evaluator tests pass without weakening AURA-0144 destination or sandbox controls or protected baselines.
  - No conversation append notification tool grant frontend route new provider deployable arbitrary binary public upload full-page retention Observatory dependency contract break or automatic retention behavior occurs.
