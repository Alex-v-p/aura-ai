id: AURA-0145
title: Execute durable governed web research
status: integrated
change_class: repository_governance
intent: >
  Add a Core-owned durable research aggregate and coordinator that admits bounded
  Quick, Auto, Deep, and Agent-led work, checkpoints every authoritative
  transition, validates task-scoped evidence and citations, produces generated
  artifacts, supports truthful cancellation extension recovery and deletion,
  and projects research through the existing federated Task Center boundary.
