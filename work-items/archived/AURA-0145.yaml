    - AURA-0142 through AURA-0144 are integrated; AURA-0144 is explicitly limited to disabled-only provider development under the 2026-10-30 owner decision.
    - AURA-0145 implementation and deterministic tests may use in-memory synthetic or explicitly isolated provider fixtures. Real provider profiles admission and outbound research remain disabled and are not acceptance evidence until the separately governed egress and image-provenance gates are satisfied.
    - Research is Core Knowledge truth; Observatory remains optional and cannot participate in research correctness availability authorization cancellation deletion or settlement.
