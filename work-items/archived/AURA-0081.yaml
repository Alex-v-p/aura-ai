  escalation_reason_required: true
acceptance_criteria:
  - A separate Angular observatory-web shell and Observatory feature libraries use the observatory-v1 generated transport client and never import Aura product feature libraries.
  - The overview presents system and ingest health with accepted rejected duplicate malformed and storage-failure state plus clear stale disconnected rejected-data and unavailable handling.
  - The live and recent-run workspace supports status component model deployment and UTC time filters receives same-origin SSE catch-up from a REST snapshot and visibly marks stale or disconnected data.
  - Run and trace detail present ordered parent-child spans in a responsive keyboard-accessible tree and waterfall with component duration outcome partial-state and missing-parent semantics.
  - Component views present catalogue latency error and outcome summaries and trends without inventing or persisting captured content.
  - Retention settings show the affected time range support delete-before and purge-all require destructive confirmation display asynchronous progress or sanitized failure and refresh every affected view after completion.
  - Observatory Web persists no authenticated REST or SSE data in Workbox Cache Storage localStorage sessionStorage or IndexedDB and logout clears the owner session state.
  - The Observatory Web production image serves the Angular shell through the existing loopback-only Compose service and preserves the isolated API database and ingest networks.
  - Full-stack acceptance creates a real Core run observes its metadata through SSE opens its trace verifies component measurements exercises cutoff deletion and purge-all and confirms Core remains usable while Observatory is stopped.
  - Responsive loading empty disconnected stale partial rejected-data and service-unavailable states are covered by unit Storybook accessibility and browser acceptance tests.
