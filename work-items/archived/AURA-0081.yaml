    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-approved Observatory Web is a separate Angular product using the observatory-v1 generated transport client and same-origin owner BFF session.
    - Owner-approved browser persistence is limited to static public shell assets; authenticated Observatory data is never persisted by Workbox or browser storage.
