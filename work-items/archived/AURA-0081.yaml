    - observatory_web_live_reconciliation
    - observatory_web_retention_workflow
    - observatory_full_stack_trace
    - observatory_outage_core_isolation
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Every page query live stream and retention command uses the same-origin configured-owner Observatory session and never places credentials in URLs or browser storage.
    - Workbox Cache Storage localStorage sessionStorage IndexedDB URLs logs and screenshots never persist authenticated API SSE run trace component deployment or retention data.
    - Retention controls display the affected time range require exact destructive confirmation CSRF and idempotency and expose asynchronous status without reflecting private error details.
    - Observatory Web imports only Observatory feature libraries the generated transport client and generic shared UI and never imports Aura product features or calls Core directly.
    - Loading empty disconnected stale partial rejected-data and unavailable states remain metadata-only keyboard accessible and responsive.
  data_classes:
    - operational_metadata
    - opaque_trace_identifiers
    - opaque_run_identifiers
    - deployment_metadata
    - retention_audit_metadata
