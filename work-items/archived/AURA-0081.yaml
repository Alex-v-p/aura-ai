id: AURA-0081
title: Deliver Observatory Web and full-stack acceptance
status: approved
change_class: repository_governance
intent: >
  Deliver a separate owner-only Angular Observatory product for live metadata
  monitoring, trace inspection, component health, and manual retention, then
  prove the complete Core-to-Collector-to-Observatory-to-browser flow without
  making Core depend on Observatory availability.
