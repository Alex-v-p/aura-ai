security_privacy:
  applicable: true
  concerns:
    - Every memory candidate configuration policy activity event and mutation read is bound to the authenticated issuer and subject before resolving any supplied identifier
    - Cross-owner candidate memory run agent policy generation and model-configuration identifier guessing returns the same content-safe not-found outcome and never reveals existence
    - Candidate approve edit and reject operations use CSRF idempotency optimistic versions and deterministic AURA-0038 credential sensitivity grounding conflict scope and purge-fence validation
    - Candidate rejection and purged-memory activity never retain or restore rejected evidence content and delayed jobs cannot recreate a purged record
    - Memory policy revisions and fallback grants remain immutable owner-scoped self-cycle and cross-owner safe and a grant never invokes delegates to or imports configuration from another agent
    - Model configuration accepts only currently verified compatible local Ollama inventory and resolves provider-observed model revision and digest server-side rather than trusting browser-supplied identity
    - Compatibility fallback capabilities cannot qualify a model for memory extraction or embedding and missing malformed ambiguous or conflicting provider identity metadata fails closed without a synthetic digest revision or dimension
    - Embedding model changes retain the old active generation during reindex and mixed dimensions partial generations failed generations or stale configuration versions never become active
    - Memory activity SSE payloads contain only bounded identifiers action lifecycle scope and reconciliation status and exclude memory text candidate text evidence provenance content vectors prompts responses credentials model payloads and owner subjects
    - Last-Event-ID replay and activity snapshots require owner authorization deduplicate repeated worker outcomes and never allow an event cursor from another run or owner
    - Browser filters search terms candidate edits memory content evidence settings and activity detail remain in authenticated memory only and are absent from URLs telemetry logs offline stores service-worker caches and error diagnostics
    - State-changing API calls use same-origin cookie sessions and origin-aware CSRF protection and bearer credentials never appear in URLs browser storage or SSE parameters
    - Hard purge remains owner-only requires the exact strong confirmation phrase presents an accessible consequence dialog and retains only content-free audit metadata
    - Private content rendered in memory revisions evidence candidate review and activity popups is inert text and cannot execute markup issue commands widen policy or confirm an action
  data_classes:
    - private durable memory content revisions and correction reasons
    - private provenance evidence source identifiers and validity history
    - sensitive memory candidate content confidence scope and review decisions
    - memory policy revisions and cross-agent fallback grants
    - extraction and embedding model identity configuration and reindex state
    - memory recall processing candidate run conversation agent and generation identifiers
