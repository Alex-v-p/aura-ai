acceptance_criteria:
  - The OpenAPI contract backward-compatibly extends owner-authenticated memory search and detail and adds candidate review memory-model configuration reindex-status agent-memory-policy and per-run memory-activity resources with transport-only generated TypeScript types.
  - The memory list supports bounded filtering by literal text scope agent kind lifecycle provenance type confidence bounds and time while historical states remain opt-in and every query is owner-scoped before filtering.
  - Memory detail shows immutable revision history provenance evidence validity decay inputs current relevance embedding generation and dispute or supersession relations without exposing vector values.
  - Manual creation correction lifecycle disable reactivate archive pin dispute supersession and strong-confirmation purge reuse the established deterministic Core use cases with CSRF idempotency optimistic concurrency content-safe errors and mandatory embedding work for accepted revisions.
  - Candidate list and detail expose only owner-scoped review candidates and their bounded grounding scope sensitivity confidence importance half-life validity and proposed action metadata.
  - Candidate approve edit-and-approve and reject commands are idempotent and version-checked and edited candidates rerun credential sensitivity grounding scope conflict lifecycle relation and purge-fence policy before creating reinforcing disputing or superseding memory.
  - Repeated candidate decisions duplicate HTTP commands worker redelivery and reconnect reconciliation converge on one durable decision one memory action and one activity outcome.
  - The model-settings API returns current owner configuration compatible current Ollama extraction and embedding inventory active and building generation identity and resumable reindex progress without returning provider endpoints credentials or embedding vectors.
  - The provider-neutral model descriptor exposes optional provider-observed model revision artifact digest explicit capability verification and embedding dimension without provider payload types or memory-specific semantics crossing the runtime port.
  - Ollama inventory normalization validates bounded model identifiers digests revisions explicit capabilities and positive embedding dimensions from provider responses and returns unavailable or unverified metadata rather than inventing identity values.
  - Memory inventory and configuration never hash a model identifier into an artifact digest never substitute dimension one and accept extraction or embedding selection only when the required provider-observed capability identity and dimension metadata is verified.
  - Extraction selection accepts only an available model with the required structured-output capability and affects future jobs without rewriting prior extraction provenance.
  - Embedding selection accepts only an available embedding-capable model starts or resumes the AURA-0038 parallel generation reindex records exact verified model identity and leaves the prior generation active until atomic completion.
  - Repeated embedding-model configuration requests do not create duplicate generations and failed or canceled replacement work leaves the prior active generation available with a clear retryable status.
  - Agent policy APIs list immutable revisions create a validated revision and attach the selected revision only through a new immutable agent revision using optimistic concurrency.
  - Agent policy controls cover shared-user read current-agent read shared-user promotion fallback relevance threshold maximum memories context-budget fraction and explicit fallback-agent grants within the AURA-0039 ceilings.
  - Fallback grant creation rejects self grants duplicates cycles nonexistent agents foreign-owner identifiers and any attempt to turn retrieval permission into delegation or invocation authority.
  - Per-run memory activity reconciles created reinforced disputed recalled and queued-for-review outcomes from durable recall processing candidate and memory state and never infers successful activity from an undurable worker attempt.
  - The versioned run-event schema adds an identifier-only memory activity event whose action status scope candidate memory revision policy generation and reconciliation fields are bounded and whose payload contains no private content.
  - Worker activity publication persists before cross-process fan-out is idempotent for repeated settlements and preserves run conversation correlation causation trace and monotonic stream ordering.
  - The existing run SSE stream replays memory activity after Last-Event-ID and keeps a terminal conversation stream available only while durable memory processing is nonterminal; snapshot reconciliation repairs missed duplicate reordered and expired-cursor delivery.
  - A reconnect with an unavailable cursor receives the established content-safe 410 behavior and the Aura Web client reloads the authoritative run and memory-activity snapshots without losing transcript draft selection or popup state.
  - Aura Web adds a responsive Memory destination implemented in a dedicated feature library with loading empty error retry pagination filter and stable-selection states.
  - Memory filters cover scope agent kind lifecycle provenance confidence and time and private search and filter state stays in session memory rather than route URLs or durable browser storage.
  - The Memory detail experience exposes revision comparison evidence validity relevance decay embedding generation relationships and accessible actions to correct pin disable archive dispute supersede or purge the authorized record.
  - Candidate review supports keyboard-only and screen-reader approve edit reject rescope validation conflict and stale-version recovery without clearing an owner edit after a recoverable failure.
  - Memory settings list only compatible available Ollama inventory and plainly warn that extraction changes affect future behavior while embedding changes trigger a full resumable reindex that preserves the current active generation until completion.
  - Agent policy controls identify the immutable policy revision and effective agent revision and explain that foreign-agent fallback grants permit retrieval only and never contact or delegate to that agent.
  - Assistant message footers show a very small accessible recall indicator only when recalled memory influenced that run and a creation or update indicator only when durable memory activity occurred or requires review.
  - Activating either footer indicator opens a compact keyboard and screen-reader accessible popup with relevant record scope provenance status and links to inspect correct disable or review it and restores focus when closed.
  - Popup layout remains usable at desktop tablet and mobile widths without hover-only content clipped actions background focus or inaccessible status changes.
  - The UI treats memory content candidate evidence provenance and model-provided text as inert untrusted content and never interprets it as policy markup HTML commands or confirmations.
  - Metadata-only spans metrics and errors distinguish memory browser candidate review configuration policy reindex activity publication delivery replay and reconciliation outcomes without memory text evidence vectors prompts responses credentials search terms or owner subjects.
  - Contract Core frontend Storybook accessibility focused Playwright Docker Compose and local-identity full-stack tests cover memory browsing correction candidate review settings warnings policy grants indicators popup actions event reconnect and failure recovery.
  - The generated client remains transport-only all domain decisions remain in Core or the Aura memory feature library and application routes shell and API entrypoints remain thin composition layers.
  - No migration new deployable service package framework Observatory dependency household or workspace scope document knowledge delegation behavior world-model graph or authenticated offline cache is added.
