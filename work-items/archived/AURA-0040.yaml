    - User-approved Autonomous Scoped Long-Term Memory plan
    - AURA-0037 autonomous memory contracts and persistence foundation
    - AURA-0038 autonomous extraction and maintenance
    - AURA-0039 scoped hybrid memory recall
    - Existing memory list detail creation correction lifecycle pin and purge resources are extended rather than replaced
    - Existing immutable owner-scoped candidate policy model-configuration embedding-generation reindex recall-metadata and run-event stores remain authoritative
    - No schema migration is required because this item exposes and composes existing Core-owned durable state and the generic persisted run-event payload
    - Aura Web memory behavior belongs in a dedicated aura knowledge memory feature library while the shell only composes routes navigation and global providers
    - The existing versioned run SSE stream gains additive identifier-only memory activity events and remains replayable with Last-Event-ID
    - Private memory candidate evidence provenance and content are reconciled through owner-scoped HTTP snapshots and never duplicated into realtime event metadata
    - The run SSE lifecycle may remain open after the conversational run reaches a terminal state only while its durable memory-processing activity is nonterminal and closes after a terminal memory settlement
    - Reconnect always rebuilds memory activity from authoritative durable run recall processing candidate and memory state before applying later event identifiers
    - Candidate review may approve an unchanged candidate approve an owner-edited candidate or reject it while reusing AURA-0038 validation embedding idempotency and purge fences
    - Model selection is explicit and owner-scoped from compatible current Ollama inventory and no model name fallback or default is hard-coded
    - The provider-neutral model inventory descriptor carries optional provider-observed revision digest capability-verification and embedding-dimension metadata while compatibility defaults remain distinguishable from verified inventory
    - The Ollama model adapter normalizes provider-observed inventory metadata and the memory product fails closed instead of deriving an artifact digest from a model name or substituting a synthetic embedding dimension
    - Extraction model changes affect future processing only while embedding model changes start the existing parallel resumable reindex flow and retain the prior active generation until atomic activation
    - Memory policy edits create immutable policy revisions and an immutable agent revision pins the selected policy; fallback grants never invoke or delegate to the granted agent
    - Authenticated memory responses event snapshots filters and form state are not persisted in browser offline storage and are excluded from Workbox caching
    - Household workspace document knowledge delegation and world-model graph behavior remain out of scope
