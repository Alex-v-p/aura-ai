security_privacy:
  applicable: true
  concerns:
    - Today may render only owner-authorized reminder content and existing conversation title and status returned by current APIs.
    - Approval proposal detail, calendar content, and future briefing or workflow content must not appear in compact cards.
    - Authenticated responses and private summaries must not enter service-worker caches, URLs, logs, telemetry, or browser persistence.
    - Inexact approval counts must not be represented as exact.
  data_classes:
    - owner-private reminder content
    - owner-private conversation titles and status
    - content-free approval and notification metadata
