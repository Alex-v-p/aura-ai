id: AURA-0127
title: Add the Aura Web Today action center
status: integrated
change_class: repository_governance
intent: >
  Make Today the authenticated Aura Web landing destination and present a
  calm, responsive, navigation-only action center for pending approvals,
  unacknowledged reminder notifications, due and upcoming reminders, and
  recent conversations by composing existing owner-authorized feature stores
  without changing Core behavior or public contracts.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/design/daily-action-and-workflow-initiative.md
    - docs/design/README.md
    - docs/design/foundations.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/sidebar-and-management-surfaces.md
    - docs/specifications/clients-and-voice.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - work-items/archived/AURA-0126.yaml
    - The owner authorized implementation of all four initiative stages on 2026-10-26; AURA-0127 activates only the independently bounded first stage.
    - Today cards navigate to canonical detail routes and never approve, reject, acknowledge, complete, cancel, or otherwise mutate records inline.
    - The daily-action feature library consumes existing public stores and starts no approval or notification stream of its own.
    - Full browser acceptance exposed an existing conversation-bootstrap race from the new Today entry path; the same work item may make the smallest component-local draft handoff correction without changing conversation contracts or persistence.
    - Review found that Today cannot safely depend on the notification workspace's currently selected unread/history view; the same work item may add a bounded unread projection to the existing NotificationStore, including at most one companion unread refresh while History is active, without adding direct Today transport calls, streams, persistence, or contract changes.
    - Review found that a component-only draft handoff can write an originating transient draft into the newly selected conversation; the scoped correction may add an id-addressed draft update to ConversationStore so handoff remains bound to its originating conversation.
