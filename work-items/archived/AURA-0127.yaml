acceptance_criteria:
  - The root route redirects to /today, Today is the first navigation destination, every Aura home link targets /today, Conversations remains explicit, and every existing deep link remains compatible.
  - A registered daily-action frontend feature library consumes only the existing public reminder, notification, approval, and conversation stores and contains all Action Center aggregation and presentation behavior.
  - Needs attention shows only pending approval metadata and unacknowledged delivered reminder notifications; Today and Later show bounded nonduplicated reminder records; Continue shows a bounded recent active-conversation set.
  - Every Action Center record is navigation-only and resolves to its canonical detail route without inline mutation or duplicate live-stream ownership.
  - Loading, all-clear, partial-source failure, authentication, permission, offline or reconnecting, and stale states preserve independent available sections and accessible recovery guidance.
  - The closed mobile navigation is absent from the accessibility tree; the open navigation makes background content inert or uses equivalent modal semantics and restores focus correctly on close, route activation, Escape, and viewport transition.
  - Responsive, theme, reduced-motion, keyboard, focus, live-region, touch-target, 200 percent reflow, privacy-summary, and request-amplification behavior have focused unit, Storybook, and browser coverage.
  - No Core, contract, generated-client, persistence, provider, deployment, service-worker, or runtime telemetry behavior changes.
