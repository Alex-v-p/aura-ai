security_privacy:
  applicable: true
  concerns:
    - Approval list and stream remain metadata-only and owner-scoped; private command summaries are available only from protected owner-authorized detail.
    - Browser approval submits exactly one CSRF-protected UUID-idempotent decision with the authoritative expected version.
    - Fake-provider behavior is test-only and activates only for one explicit prompt marker while provider tools are enabled.
    - Full-stack assertions must not print reminder content recurrence arguments owner identity due times or raw tool results into operational events or telemetry.
  data_classes:
