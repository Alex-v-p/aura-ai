acceptance_criteria:
  - Aura OpenAPI additively describes legacy reminder.create and all AURA-0066 reminder command approvals, their metadata-only stream events, and the owner-authorized typed proposal detail without changing event schema versions.
  - The generated TypeScript client is synchronized and Aura Web accepts metadata-only lifecycle events for every supported reminder command while rejecting unknown tools and malformed events.
  - Approval rows and detail dialogs render readable command labels and a bounded owner-authorized summary, retain technical disclosure, keyboard focus, decision-state recovery, and legacy reminder.create behavior.
  - The deterministic fake provider advertises native tool support and emits reminder.series.create exactly once for the explicit E2E marker; tools-disabled synthesis emits text and cannot create a second proposal.
  - A real browser authenticates, starts the marked conversation with a pinned IANA timezone, observes one pending reminder.series.create approval, reviews and approves it once, observes completed execution, and verifies exactly one active series plus its generated next reminder.
  - The full-stack policy scenario expects the complete additive tool catalog and built-in conversational policy while retaining historical and custom deny-by-default assertions where exposed.
  - Approval stream NATS run events logs audit metadata and telemetry remain free of command content recurrence arguments target queries raw results timezone and due values.
