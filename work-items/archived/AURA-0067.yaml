id: AURA-0067
title: Validate conversational reminders through the real browser approval flow
status: integrated
change_class: contract
intent: >
  Correct the owner approval transport and Aura Web approval surface for the
  conversational reminder tools introduced by AURA-0066, then add deterministic
  full-stack browser coverage that drives a native provider tool call through
  pending approval, one owner decision, durable worker resume, and recurring
  series creation without changing closed event schema versions.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/tools-automation-and-integrations.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
  decisions:
    - Owner-requested real browser end-to-end validation of Automation v2 behavior.
    - Approval metadata remains version 1 and metadata-only; its additive toolId domain includes every always-confirmed reminder command.
    - Owner-authorized approval detail may expose a bounded private command summary while SSE NATS run events logs audit metadata and telemetry remain content-free.
    - The fake Ollama provider may emit a native tool call only for a unique test prompt and only when tools are enabled; resumed synthesis must be tools-disabled.
    - Existing reminder.create approval payloads and UI behavior remain backward compatible.
  contracts:
    - contracts/openapi/aura-v1.yaml
    - contracts/events/runs/v1/run-events.schema.json
