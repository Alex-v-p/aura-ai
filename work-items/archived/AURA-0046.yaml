  - frontend/libs/aura/knowledge/memory/src/lib/memory-pages.component.ts
  - frontend/libs/aura/knowledge/memory/src/lib/memory-store.spec.ts
  - frontend/apps/aura-web-e2e/src/memory-product.spec.ts
  - frontend/apps/storybook/src/memory-product.stories.ts
  - frontend/libs/aura/interaction/conversations/src/lib/conversation-store.ts
  - frontend/libs/aura/interaction/conversations/src/lib/conversation-store.spec.ts
  - frontend/libs/aura/interaction/conversations/src/lib/conversation-panel.component.ts
