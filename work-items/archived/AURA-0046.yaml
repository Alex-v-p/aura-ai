contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: aura-core
  owning_module: knowledge.memory
observability:
  applicable: true
  affected_components:
    - aura.knowledge.memory_extraction
    - aura.knowledge.memory_persistence
  required_metrics:
    - memory_candidate_review_outcome
    - memory_action_outcome
    - memory_operation_outcome
  required_evaluators:
    - memory_extraction_policy
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Candidate compatibility must preserve owner and agent scope authorization
    - Defaults and approval errors must not expose memory content through telemetry
  data_classes: [private_memory_content, private_memory_metadata]
required_agents:
  implementation: [core_worker, frontend_worker, test_evaluation_engineer]
  review: [general_reviewer, security_privacy_reviewer, observability_steward]
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 4
  max_parallel_writers: 1
  model_tier: efficient
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Existing provider-review candidates with grounded content can be approved unchanged as concrete create actions.
  - New provider-review candidates persist a concrete approvable action while remaining in review state.
  - Create and review candidates receive usable importance and half-life values when the provider omits them.
  - Extraction guidance explicitly requests dynamic importance, half-life, and optional validity end proposals.
  - The review editor opens for incomplete legacy candidates with safe defaults and never offers ignore or review as approval mutations.
  - An owner can approve the currently failing live candidate and its accepted memory receives an embedding.
  - Queued memory activity without a candidate or record remains a non-error processing state and reconciles to its terminal result.
  - A missing configuration generation pointer is recovered from the owner's matching active generation so parked jobs can resume.
