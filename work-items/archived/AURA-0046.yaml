id: AURA-0046
title: Make reviewed memory candidates approvable and complete
status: integrated
change_class: bugfix
intent: >
  Ensure provider-requested review candidates retain a concrete owner-approvable
  memory action, carry usable importance and relevance-horizon defaults, and
  can be reviewed or edited without validation dead ends.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/development/codex-agent-system.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
  specifications:
    - docs/specifications/memory-and-knowledge.md
  decisions:
    - Provider review is a review disposition, not a durable memory mutation action
    - Preserve optional validity end while requiring a usable relevance horizon
    - Existing review-action candidates must remain approvable without database rewriting
  contracts:
    - contracts/openapi/aura-v1.yaml
feature_references: [MOD-017, AUI-023]
ownership_zones:
  - aura-core.knowledge.memory
  - aura-web.memory
allowed_paths:
