  - frontend/apps/aura-web-e2e/src/aura0020-review-regressions.spec.ts
  - frontend/apps/aura-web-e2e/src/aura0023-persona-overrides.spec.ts
  - frontend/apps/aura-web-e2e/src/conversation-productivity.spec.ts
  - frontend/apps/aura-web-e2e/src/memory-product.spec.ts
  - frontend/apps/aura-web-e2e/src/storybook-a11y.spec.ts
  - frontend/apps/storybook/src/conversation-panel.stories.ts
  - frontend/apps/aura-web/src/app/shell/aura-shell.component.css
  - frontend/libs/aura/interaction/conversations/src/lib/conversation-panel.component.html
  - frontend/libs/aura/interaction/conversations/src/lib/conversation-panel.component.css
  - frontend/libs/aura/interaction/conversations/src/lib/conversation-panel.component.ts
  - frontend/libs/aura/interaction/conversations/src/lib/conversation-panel.component.spec.ts
  - frontend/libs/aura/interaction/conversations/src/lib/safe-markdown.component.ts
