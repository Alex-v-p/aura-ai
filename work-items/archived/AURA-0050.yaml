  - AGENTS.md
  - .agents/**
  - .codex/**
  - .github/**
  - contracts/**
  - docs/**
  - evaluations/**
  - services/**
  - tooling/**
  - deploy/**
  - frontend/libs/platform/aura-api-client/**
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: false
  concerns: []
  data_classes: []
required_agents:
  implementation: [frontend_worker, test_evaluation_engineer]
  review: [general_reviewer]
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 4
  max_parallel_writers: 2
  model_tier: balanced
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Conversation metadata controls expose valid group semantics and every interactive control has a nonempty accessible name.
  - Storybook conversation fixtures use a real typed store and complete seeded conversation data without unsafe double casts.
  - Browser tests assert all four navigation destinations including Memory and exercise the current consolidated options dialog.
  - Default Playwright execution starts dedicated fresh current-source application and Storybook servers and does not silently reuse Compose or another stale process.
  - Frontend lint unit production-build Storybook-build responsive browser and isolated accessibility checks pass without reverting accepted UI behavior.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0050.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0050.yaml
  - python3 tooling/architecture/validate-baseline-protection.py
  - python3 tooling/architecture/validate-generated-sync.py
  - python3 tooling/architecture/validate-contract-changes.py --work-item work-items/active/AURA-0050.yaml
  - pnpm --dir frontend run lint
  - pnpm --dir frontend run test
  - pnpm --dir frontend run build:production
  - pnpm --dir frontend run build-storybook
  - pnpm --dir frontend exec playwright test --config=playwright.config.ts
  - git diff --check
baseline_changes_allowed: false
human_approval_required: false
open_decisions: []
