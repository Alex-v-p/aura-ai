id: AURA-0050
title: Restore frontend accessibility and deterministic browser coverage
status: integrated
change_class: bugfix
intent: >
  Correct conversation-panel accessibility and align browser coverage with the
  accepted four-destination shell and consolidated options experience while
  ensuring tests always exercise fresh current source by default.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/clients-and-voice.md
    - docs/design/foundations.md
    - docs/design/components-and-interactions.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Preserve Memory as the fourth navigation destination
    - Preserve the consolidated conversation options dialog
  contracts: []
feature_references: [CLI-001, CLI-002, CLI-003, CMP-003]
ownership_zones:
  - aura-web.shell
  - aura-web.interaction.conversations
  - aura-web.e2e
  - frontend.storybook
allowed_paths:
  - work-items/active/AURA-0050.yaml
  - work-items/archived/AURA-0050.yaml
  - frontend/apps/aura-web-e2e/src/aura-web.spec.ts
