contracts:
  changes_allowed: false
  affected:
    - evaluation-v1
    - observatory-v1
  compatibility_requirement: backward_compatible
data:
  migration_required: false
  owning_service: aura-observatory
  owning_module: evaluation.query
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - Only the existing closed component variant and execution-limit fields may cross the public query boundary; arbitrary stored keys provider fields and private definition data remain excluded.
    - Component image digests model digests revisions identifiers and numeric limits retain their existing bounded format validation and are not copied into logs metrics errors URLs or browser persistence by this backend correction.
    - Malformed partial duplicate over-limit or conflicting optional bindings fail with bounded existing query or unavailable classifications that do not reflect stored values or provider diagnostics.
    - The correction remains inside Observatory and does not read Core state add cross-product communication widen owner authorization or change retention and deletion behavior.
  data_classes:
    - evaluation_definition_metadata
    - execution_binding_metadata
    - opaque_resource_identifiers
    - content_free_error_metadata
