  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Suite list detail and create responses retain every existing required summary field and remain valid against the unchanged observatory-v1 EvaluationSuiteDefinition schema.
  - When a persisted suite contains authoritative components the public response includes the existing components field as a closed bounded list and componentIds is the deterministic matching summary of those bindings.
  - When a persisted suite contains authoritative variantBindings the public response includes the existing optional field with its bounded unique variant identifiers complete component model and revision bindings and no additional keys.
  - When a persisted suite contains authoritative limits the public response includes the existing optional limits object while caseBudget and timeoutMs remain the matching required summary values.
  - Production provider-shaped id and version resource references plus components variantBindings and limits round-trip through list detail create and idempotent create replay without field loss renaming or synthesis.
  - Legacy canonical suite summaries that omit all three optional authoritative fields remain readable and preserve their existing exact response shape.
  - If any optional authoritative field is present but malformed partial mixed over its contract bound duplicated or inconsistent with its summary the projection fails closed with the existing bounded error classification rather than returning an incomplete suite.
  - Dataset evaluator provenance state retention timestamps pagination and filtering semantics remain unchanged; the projector does not mutate the persisted definition mapping.
  - Focused regression tests exercise exact PostgreSQL provider-shaped suite payloads for list and detail production admission output for create and stored idempotency replay for retry.
  - A contract-conformance regression validates both the required summary-only legacy shape and the enriched authoritative shape against the unchanged OpenAPI schema.
  - The enriched response interoperates with the AURA-0098 Observatory frontend suite parser and supplies the exact authoritative fields used to construct a valid job-admission request without requiring any frontend change in this item.
  - No Core Aura Web Observatory frontend adapter entrypoint contract migration deploy dependency service metric evaluator protected baseline threshold or retention change is introduced.
