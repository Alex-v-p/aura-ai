id: AURA-0112
title: Preserve authoritative suite projection fields
status: integrated
change_class: bugfix
intent: >
  Make Observatory suite list detail and create responses preserve their
  existing contract-required summary while projecting persisted authoritative
  component variant and execution-limit bindings needed by subsequent job
  admission.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - work-items/archived/AURA-0093.yaml
    - work-items/archived/AURA-0095.yaml
    - work-items/archived/AURA-0110.yaml
    - Observatory PostgreSQL remains authoritative for admitted immutable suite definitions. The public query boundary projects persisted facts and never reconstructs execution bindings from identifiers summaries or frontend state.
    - The existing observatory-v1 EvaluationSuiteDefinition summary fields remain required and unchanged. Existing optional components variantBindings and limits fields are included when those authoritative values are present in the persisted suite definition.
    - Create list detail and idempotent create replay use the same closed suite projector so equivalent persisted definitions produce one contract-conformant public shape.
    - Legacy already-projected suite summaries without the optional authoritative fields remain readable. Present optional fields must be complete bounded and valid; malformed or partially present authoritative data fails closed rather than being silently dropped or synthesized.
    - AURA-0098 retains its frontend parser correction and composed acceptance. This item changes no frontend code generated client or browser contract.
    - No public schema storage schema migration dependency service or architecture change is required. Evidence requiring one returns to planning.
  contracts:
    - contracts/evaluation/v1/evaluation.schema.json
    - contracts/openapi/observatory-v1.yaml
feature_references:
  - EVA-001
  - EVA-002
  - EVA-003
  - EVA-023
ownership_zones:
