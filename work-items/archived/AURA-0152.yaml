id: AURA-0152
title: Make notification idempotency race fixture winner-aware
status: integrated
change_class: bugfix
intent: >
  Correct the PostgreSQL briefing-notification concurrency fixture so its
  duplicate-delivery phase follows whichever changed-payload request actually
  won the advisory-lock race, preserving the production race semantics while
  removing an order-dependent false failure from AURA-0146 validation.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/tools-automation-and-integrations.md
    - docs/design/failure-and-recovery-states.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - work-items/archived/AURA-0055.yaml
    - work-items/archived/AURA-0132.yaml
    - work-items/archived/AURA-0146.yaml
    - work-items/active/AURA-0148.yaml
    - >-
      The AURA-0146 aggregate Core command produced 298 passed, one failed,
      and seven skipped. The only failure was
      test_postgresql_briefing_idempotency_serializes_changed_payload_and_duplicates;
      a targeted fresh-database run reproduced the failure once and then
      passed four times, establishing an order-dependent fixture failure.
    - >-
      The two concurrent same-key changed-payload requests correctly serialize
      through PostgreSQL advisory locking, but either request may acquire the
      lock first. Exactly one request succeeds and one returns
      NotificationIdempotencyConflict; their positional order is not part of
      the notification contract.
    - >-
      The duplicate phase currently uses first_result_id unconditionally. If
      the second changed-payload request won, that phase creates a second
      notification instead of exercising source-neutral duplicate delivery for
      the persisted winner. The correction must derive the duplicate result
      identity from the successful changed-payload response and retain the
      exact conflict, single-notification, replay, and cleanup assertions.
    - >-
      This is a test-fixture correction only. Production notification code,
      public contracts, migrations, persistence constraints, component
      manifests, telemetry, and protected baselines must remain unchanged, so
      no new ADR is required.
    - >-
      The exact archived AURA-0146 aggregate Core test selection must run with
      AURA_0055_DATABASE_URL and AURA_TEST_DATABASE_URL pointing at the same
      fresh isolated migrated PostgreSQL database. The corrected notification
      node must execute rather than skip.
