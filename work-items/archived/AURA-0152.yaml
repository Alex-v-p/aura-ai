acceptance_criteria:
  - >-
    The changed-payload concurrency phase still proves exactly one successful
    briefing notification and exactly one NotificationIdempotencyConflict for
    the same owner and idempotency key, without assuming acquisition order.
  - >-
    The distinct-key duplicate phase uses the briefing result identity from
    the successful changed-payload response, returns one notification identity
    for both requests, and leaves exactly one replay event for the owner.
  - >-
    Four consecutive targeted executions pass against four independently fresh
    migrated PostgreSQL databases with no skip, expected failure, retry of a
    failed attempt, or production-code modification.
  - >-
    The exact AURA-0146 aggregate Core test selection passes against a fresh
    isolated PostgreSQL database, and the corrected notification node executes
    rather than skips while the archived command's unrelated conditional skips
    remain unchanged.
  - >-
    No product code contract migration persistence constraint component
    manifest telemetry protected baseline dependency or AURA-0148 validation
    file changes.
