id: AURA-0016
title: Register implemented Aura module boundaries
status: integrated
change_class: repository_governance
intent: >
  Close the conversation-foundation governance loop by replacing the empty
  module registry with the real Aura Core, Aura Web conversation, generated
  client, and contract roots created by AURA-0015, documenting their allowed
  dependency direction, and validating that every registered root exists.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/repository-structure.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications: []
  decisions:
    - User-approved AURA-0016 governance closure from the Ollama conversation implementation plan
    - AURA-0015 integrated module and contract layout
    - Registry entries describe existing roots and do not authorize new product behavior
  contracts: []
feature_references: []
ownership_zones:
  - repository.governance
allowed_paths:
  - work-items/active/AURA-0016.yaml
  - work-items/archived/AURA-0016.yaml
  - tooling/architecture/modules.yaml
  - tooling/architecture/dependency-rules.yaml
  - tooling/architecture/validate-module-registry.py
  - tooling/architecture/tests/test_modules.py
  - tooling/architecture/README.md
  - docs/architecture/module-boundaries.md
forbidden_paths:
  - AGENTS.md
  - .agents/**
  - .codex/**
  - .github/**
  - contracts/**
  - services/**
  - frontend/**
  - deploy/**
  - compose.yaml
  - pyproject.toml
  - uv.lock
  - .python-version
  - .env.example
  - docs/adr/**
  - docs/specifications/**
  - evaluations/**
  - infra/**
  - satellites/**
  - extensions/**
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - Registry metadata must not expose runtime endpoints, credentials, subjects, or provider secrets
    - Dependency declarations must preserve provider direction, Core ownership, and Core/Observatory isolation
    - Generated clients remain transport-only contract outputs
  data_classes:
    - repository governance metadata
required_agents:
  implementation:
    - platform_worker
  review:
    - general_reviewer
    - architecture_guardian
  integration: false
execution:
  parallelism_class: local
  max_parallel_agents: 1
  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: false
  escalation_reason_required: true
acceptance_criteria:
  - The module registry names only roots that exist in the integrated repository.
  - Aura Core service, domain, runtime, platform, provider, bootstrap, and entrypoint roots are registered with explicit dependency direction.
  - Aura conversation feature, generated Aura API client, OpenAPI contract, and run-event contract roots are registered without broadening contract or frontend ownership.
  - Dependency rules describe the implemented public-API, provider, service-isolation, and frontend product boundaries without introducing an architectural exception.
  - A validator and focused tests fail closed on missing roots, roots outside the repository, duplicate roots, and unknown declared dependencies.
  - The architecture summary records the concrete implemented roots while preserving Core/Observatory isolation and transport-only generated clients.
  - Product code, runtime contracts, deployment behavior, ADRs, and protected baselines remain unchanged.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0016.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0016.yaml
  - python3 tooling/architecture/validate-module-registry.py
  - python3 -m unittest discover -s tooling/architecture/tests -v
  - python3 tooling/architecture/validate-repository-shape.py
  - python3 tooling/architecture/validate-import-boundaries.py
  - python3 tooling/architecture/validate-service-isolation.py
  - python3 tooling/architecture/validate-frontend-boundaries.py
  - git diff --check
baseline_changes_allowed: false
human_approval_required: true
open_decisions: []
