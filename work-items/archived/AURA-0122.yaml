id: AURA-0122
title: Make Observatory traces and components operator-first
status: integrated
change_class: feature
intent: >
  Replace the Observatory Trace diagnostic dump and Components card wall with
  concise operator-first workspaces that explain outcomes, bottlenecks,
  failures, evidence coverage, and component health before exposing bounded
  technical detail on demand. Preserve exact inspection access and the strict
  Aura Web and Observatory product boundary.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - docs/adr/0017-governed-production-run-evidence.md
    - work-items/archived/AURA-0121.yaml
    - The initial view answers what happened what was slow what failed and what evidence is available before showing individual events or spans.
    - Trace uses a stage accordion as its primary mental model with phase coverage merged into stage summaries and raw events and spans grouped under an Advanced disclosure.
    - Components uses a compact problem-first list with one selected detail surface and no optional eager card view.
    - Span bars are labelled relative duration unless both normalized start offset and duration are rendered against a common time axis.
    - Operator KPIs are terminal status authoritative duration failed partial and running counts evidence completeness slowest stage and applicable retrieval tool and generation counts; component KPIs are total degraded no-data missing-definition stale and healthy counts.
    - Raw inspection steps spans measurements topology and evidence remain exact and accessible through explicit bounded progressive disclosure.
    - Existing Observatory APIs generated clients store behavior and lazy owner-only no-store evidence retrieval remain authoritative and unchanged.
    - Aura Web Core Observatory backend contracts databases and deployment topology remain unchanged.
  contracts:
    - contracts/openapi/observatory-v1.yaml
    - frontend/libs/platform/observatory-api-client/src/lib/generated/observatory-api.ts
feature_references: [OBS-006, OBS-007, OBS-008, OBS-009, OBS-020, OBS-035]
