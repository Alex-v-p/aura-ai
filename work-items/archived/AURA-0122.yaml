contracts:
  changes_allowed: false
  affected:
    - existing observatory-v1 run inspection trace and component catalogue consumer behavior
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: aura-observatory
  owning_module: observatory-web
observability:
  applicable: true
  affected_components:
    - aura.observatory.run_inspection_query
  required_metrics: []
  required_evaluators:
    - run_inspection_projection_truth
    - metadata_v2_allowlist
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Exact owner-private evidence remains collapsed and is fetched only after explicit disclosure through the existing no-store owner-authorized flow.
    - Evidence content identifiers digests and deletion detail never enter URLs logs metrics SSE browser storage service-worker caches or screenshots.
    - Progressive disclosure must release loaded evidence when collapsed and preserve truthful partial unavailable excluded and deleted states.
    - Aura Web retains zero Observatory links labels routes imports configuration sessions browser communication or client dependencies.
  data_classes:
    - metadata_only_operational_observations
    - owner_private_run_evidence
required_agents:
  implementation:
    - frontend_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
    - aura_ux_ui_reviewer
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 7
  max_parallel_writers: 2
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Trace opens with a plain-language run verdict total duration terminal status bottleneck error count tool retrieval generation and evidence summaries before technical records.
  - Trace initially renders no more than twelve aggregate stage rows no expanded event bodies and no raw span rows; exact events measurements lineage evidence manifests and spans require explicit disclosure and are paged or incrementally revealed in batches of at most twenty.
  - The primary Trace document at 1440 by 1000 remains under two viewport heights and at 390 by 844 under three viewport heights before any disclosure for fixtures containing at least two hundred steps and two hundred spans.
  - Aggregate stages preserve chronology parallel branches terminal boundaries retries partial reasons and running states without inventing timing or completeness and identify the slowest meaningful stage.
  - Evidence coverage distinguishes captured excluded partial unavailable and deleted states without fetching evidence bytes until the owner explicitly opens an evidence item.
  - Live run invalidation preserves open aggregate sections but does not automatically open technical detail refetch collapsed evidence or cause terminal timings to change without new authoritative records.
  - Components opens with catalogue-level healthy degraded no-data and definition-gap summaries and a compact problem-first list showing component identity health samples P95 error rate and definition state.
  - Components initially renders at most twenty compact catalogue rows; trends versions measurements outcomes definition and topology appear in one selected-component detail surface rather than being repeated in every row.
  - The selected component detail is visible alongside the catalogue at desktop widths and replaces the catalogue with an accessible back action at narrow widths; topology details are collapsed by default.
  - Trace and Components use clear semantic Observatory icons labels units rounded human-readable durations and accessible state text without relying on color alone.
  - Keyboard focus disclosure state screen-reader structure reduced motion forced colors zoom and 390 by 844 layouts remain usable with no nested page scroll traps or horizontal page overflow.
  - Storybook includes two-hundred-record Trace and sixty-component catalogue states proving concise defaults plus loading empty stale disconnected partial error deleted and narrow-screen states.
  - Browser acceptance asserts the initial row and document-height budgets progressive disclosure lazy evidence retrieval focus restoration live refresh stability and zero browser persistence.
