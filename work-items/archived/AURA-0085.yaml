id: AURA-0085
title: Add Observatory ingest quality and self-monitoring
status: integrated
change_class: repository_governance
intent: >
  Make Observatory ingest and query health diagnosable through bounded,
  metadata-only history, live notifications, and accessible owner-facing
  states without coupling Core to Observatory or exposing telemetry payloads.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/aura-ai-envisioned-feature-catalogue.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/foundations.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Define backlog as Observatory-owned pending receipts and the contiguous ClickHouse visibility gap; do not introduce a durable queue or Collector control dependency.
    - Persist bounded content-free health snapshots in Observatory PostgreSQL and continue deriving high-cardinality observation state from ClickHouse.
    - Keep health-change SSE events metadata-only and compatible with the existing authenticated replay boundary.
  contracts:
    - contracts/openapi/observatory-v1.yaml
    - contracts/telemetry/v1/metadata-observation.schema.json
