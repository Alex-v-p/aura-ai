contracts:
  changes_allowed: true
  affected:
    - observatory-v1
  compatibility_requirement: backward_compatible
data:
  migration_required: true
  owning_service: aura-observatory
  owning_module: ingest-health
observability:
  applicable: true
  affected_components:
    - aura.observatory.telemetry_ingestion
    - aura.observatory.telemetry_storage
    - aura.observatory.query_api
    - aura.observatory.live_updates
  required_metrics:
    - observatory_ingest_intake_lag_ms
    - observatory_ingest_visibility_lag_count
    - observatory_ingest_rejection_count
    - observatory_ingest_duplicate_count
    - observatory_ingest_storage_duration_ms
    - observatory_ingest_worker_heartbeat_age_ms
    - observatory_ingest_backlog_count
    - observatory_query_duration_ms
    - observatory_query_freshness_lag_ms
  required_evaluators:
    - observatory_ingest_quality
    - observatory_self_monitoring
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Rejection reasons are a finite allowlist and never include payloads parser text attribute names identifiers credentials endpoints or exception text.
    - Health history contains only aggregate counts timestamps finite state enums and bounded latency values.
    - REST SSE logs metrics and browser state remain metadata-only and never persist raw OTLP or rejected input.
    - Query and storage diagnostics use bounded labels and do not include run trace observation deployment component or owner identifiers.
    - The existing owner authorization same-origin session and Last-Event-ID replay boundaries remain unchanged.
  data_classes:
    - operational_telemetry_metadata
