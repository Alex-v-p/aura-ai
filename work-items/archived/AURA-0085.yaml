  max_parallel_agents: 6
  max_parallel_writers: 1
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - The owner overview reports bounded intake lag visibility watermark and lag finite rejection reasons duplicates storage latency query latency worker heartbeat age backlog depth and oldest backlog age.
  - Intake lag uses observation time only after successful schema validation and is clamped to a documented finite non-negative range so future-skewed input cannot corrupt health state.
  - Visibility lag is derived from the service-owned allocation and contiguous ClickHouse visibility watermark and represents pending Observatory storage work rather than Collector or Core queue state.
  - Rejected malformed duplicate and storage-failure outcomes have finite reason codes with aggregate counts only; rejected payloads and exception text never enter storage logs metrics REST SSE or the browser.
  - The ingest worker records a recoverable content-free heartbeat and the overview distinguishes healthy delayed partial degraded and unavailable states using explicit thresholds and timestamps.
  - Observatory PostgreSQL retains a bounded health history with deterministic pruning and idempotent fresh and upgraded migrations; observation retention does not delete this operational history.
  - Query and storage latency are measured around the owning ports with finite durations bounded resource and outcome labels and no high-cardinality identifiers.
  - REST exposes a bounded health-history resource and the existing overview additions remain backward compatible and owner-authorized.
  - Metadata-only SSE emits a health.changed notification only for a material health-state or watermark change preserves Last-Event-ID catch-up semantics and does not turn heartbeat messages into persisted data events.
  - The Observatory overview presents current state lag freshness backlog rejection breakdown latency and heartbeat with accessible tables explicit units timestamps and non-colour-only state indicators.
  - Browser behavior covers loading empty delayed partial rejected degraded disconnected stale and service-unavailable states with keyboard-operable retry and no authenticated response persistence.
  - Service unit integration contract frontend and real-browser tests cover out-of-order visibility delayed intake malformed input storage failure stale heartbeat bounded history SSE reconnect and recovery.
  - Core and its databases modules requests workers and startup remain unchanged and usable when Observatory is unavailable.
