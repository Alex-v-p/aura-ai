acceptance_criteria:
  - A dedicated thin Core scheduler scans PostgreSQL every second in batches of at most one hundred and invokes shared reminder-delivery application behavior rather than reimplementing domain rules.
  - Concurrent scheduler instances claim due scheduled reminders with FOR UPDATE SKIP LOCKED and atomically transition each claimed reminder to fired create one notification write content-free audit metadata persist an owner replay event and stage the identifier-only reminder lifecycle outbox event.
  - A database uniqueness constraint permits exactly one notification per reminder and crash-before-commit database-failure and crash-after-commit behavior respectively roll back retry later and avoid duplicates.
  - Cancel-versus-fire contention serializes through database locking so cancellation or firing wins consistently and terminal reminder invariants remain intact.
  - Notifications are Core-owned records with delivered or acknowledged status optimistic versions reminder references and lifecycle timestamps and acknowledgement never completes the reminder automatically.
  - Authenticated owners can list inspect and acknowledge only their notifications and can use the existing reminder completion command from notification detail.
  - The notification SSE endpoint emits identifier status and timestamp metadata only supplies heartbeats and replays owner-authorized PostgreSQL events strictly after Last-Event-ID before following NATS wakeups.
  - Duplicate or missed NATS wakeups cannot lose or duplicate durable inbox state and reconnecting or previously offline clients reconcile from PostgreSQL.
  - Aura Web provides a responsive accessible notification centre unread badge acknowledgement controls reminder completion action and bounded-backoff reconnect behavior that refreshes related reminder state.
  - The aura-core-scheduler Compose service has database access only and no provider egress browser network NATS Valkey OIDC or unrelated secret attachment.
  - OpenAPI version 1.8.0 and the notification event JSON Schema remain additive and the generated transport client is synchronized.
  - Scheduler and notification component manifests and runtime instrumentation cover scan duration due lag fired count duplicate prevention persistence outcome SSE connection and replay acknowledgement and failures using metadata-only capture.
  - No recurrence reminder editing deletion household sharing Web Push Home Assistant calendar email voice Aura Wall model-facing tool confirmation approval or Observatory behavior is added.
