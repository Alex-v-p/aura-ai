id: AURA-0055
title: Fire due reminders and deliver durable in-app notifications
status: integrated
change_class: repository_governance
intent: >
  Add reliable PostgreSQL-backed due-reminder firing, exactly-once in-app
  notification creation, owner-authorized notification APIs and replayable live
  updates, and an accessible Aura Web notification centre without adding an
  external delivery provider or weakening Core service isolation.
