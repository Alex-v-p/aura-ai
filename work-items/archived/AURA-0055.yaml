    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-approved one-second scheduler polling with batches of at most one hundred due reminders
    - Owner-approved atomic fired transition notification creation audit replay-event persistence and identifier-only outbox staging
    - Owner-approved PostgreSQL replay followed by NATS wakeups for live notification SSE
    - Owner-approved in-app delivery semantics where durable inbox availability is delivered and acknowledgement does not complete a reminder
