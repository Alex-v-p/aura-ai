security_privacy:
  applicable: true
  concerns:
    - Every notification list acknowledgement detail fetch replay cursor and live event must be bound to the authenticated owner principal.
    - Reminder and notification content must remain absent from NATS messages SSE envelopes telemetry ordinary audit metadata and outbox metadata.
    - Notification acknowledgement requires same-origin CSRF validation a UUID idempotency key and optimistic expected-version enforcement.
    - Last-Event-ID must resume only after an owner-authorized persisted event and must not disclose whether another owner event exists.
    - Concurrent scheduler claims and cancel-versus-fire races must use PostgreSQL row locking and one transaction so exactly one valid outcome wins.
    - The scheduler service receives only Core database connectivity and no Ollama provider browser egress NATS Valkey OIDC or unrelated credentials.
  data_classes:
    - private reminder content
    - private in-app notification detail
    - owner identity
    - reminder notification and SSE lifecycle metadata
