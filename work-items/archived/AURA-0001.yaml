id: AURA-0001
title: Bootstrap Codex agent and repository governance
status: integrated
change_class: repository_governance
intent: >
  Establish enforceable, project-scoped agent roles, work-item contracts, hooks,
  command rules, architecture validation, tests, and collaboration guidance.
sources_of_truth:
  architecture: [docs/architecture/aura-ai-architecture-handover.md]
  specifications: [docs/specifications/aura-ai-envisioned-feature-catalogue.md]
  decisions: []
  contracts: [external:aura-ai-codex-agent-governance-handover-v0.2.md]
feature_references: [DEV-005, DEV-028, DEV-029]
ownership_zones: [repository.governance]
allowed_paths: [.gitignore, AGENTS.md, .codex/**, .agents/**, work-items/**, tooling/architecture/**, docs/development/**, docs/AGENTS.md, docs/README.md]
forbidden_paths: [services/**, frontend/**, contracts/**, evaluations/**, deploy/**, infra/**, satellites/**]
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data: {migration_required: false, owning_service: null, owning_module: null}
observability: {applicable: false, affected_components: [], required_metrics: [], required_evaluators: [], capture_policy: null}
security_privacy:
  applicable: true
  concerns: [agent write scope, destructive commands, governance bypass]
  data_classes: [repository metadata]
required_agents:
  implementation: [platform_worker]
  review: [general_reviewer, architecture_guardian]
  integration: false
execution:
  parallelism_class: local
  max_parallel_agents: 1
  max_parallel_writers: 1
  model_tier: deep
  model_escalation_allowed: false
  escalation_reason_required: true
acceptance_criteria:
  - Codex configuration and custom-agent profiles use supported syntax.
  - Work-item and handoff templates validate.
  - Hooks, command rules, validators, and tests reject representative violations.
  - Documentation explains trust, enforcement, worktrees, and known limitations.
required_checks:
  - python3 -m unittest discover -s tooling/architecture/tests -v
  - python3 tooling/architecture/validate-repository-shape.py
  - codex execpolicy check --rules .codex/rules/repository.rules -- git status
baseline_changes_allowed: false
human_approval_required: true
open_decisions: []
