    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/open-decisions.md
    - docs/specifications/aura-ai-envisioned-feature-catalogue.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - AURA-0087 owns bounded operational analytics queries and the operational versus quality metric separation consumed by dashboards and alert evaluation.
    - AURA-0095 owns the owner BFF REST CLI metadata-only SSE generated-client and accessible Observatory evaluation workspace boundaries that this item extends additively.
    - AURA-0096 owns immutable experiments baselines regressions attribution evidence and history; this item may link to exact opaque versioned identities but may not mutate or duplicate those resources.
    - PostgreSQL is authoritative for dashboard saved-query alert-rule alert-instance suppression acknowledgement incident annotation audit schedule lease recovery and live-event state.
    - Dashboards and saved queries persist only closed versioned bounded query definitions composed from observatory-v1 fields. Arbitrary query text SQL expressions attributes dimensions and caller-defined executable filters are prohibited.
    - Initial alert rules evaluate deterministic bounded latency error saturation quality availability privacy and freshness conditions through existing public query ports. They do not query sibling storage tables directly and never infer unavailable evidence.
    - Alert evaluation runs as bounded low-priority work in an existing Observatory worker or scheduler entrypoint. It uses PostgreSQL leases idempotent transitions and recovery and may not delay ingest evaluation Core readiness or normal Core activity.
    - Repeated alert observations group under stable rule resource and bounded grouping-key identities. Suppression is explicit time-bounded or manually cleared state; acknowledgement never erases evidence or resolves an incident implicitly.
    - Alerts remain inside Observatory. No external notification provider Web Push Home Assistant email webhook cloud delivery routing or credential is selected or implemented.
    - Incidents use explicit open investigating mitigated resolved and closed transitions with bounded impact severity exact related-alert and evidence references and content-free audit history.
    - Annotations are owner-authored product data with bounded plain text accepted only through the closed owner-authorized API. They may target exact run deployment experiment regression or incident identities and versions. Annotation text never enters telemetry metrics logs SSE URLs browser persistence alert labels or arbitrary dimensions.
    - REST snapshots remain authoritative. Additive dashboard alert incident and annotation notifications use a dedicated persisted authenticated same-origin operational SSE ledger and carry metadata-only resource-change envelopes without annotation text.
    - Authenticated operational data remains memory-only in the browser and is excluded from Workbox Cache Storage localStorage sessionStorage IndexedDB URLs logs screenshots and analytics.
    - Existing Core databases services telemetry protocol evaluation runner NATS deployment authentication and storage boundaries remain unchanged. Core never depends on these operational workflows or Observatory availability.
    - Existing architecture authorizes this Observatory-owned scope. Return ADR_REQUIRED if implementation requires external alert delivery a new deployable service Prometheus Loki or Grafana ownership changes Core access automatic baseline mutation shared persistence content-bearing telemetry or a new cross-product dependency.
    - Material implementation choices use repository-pinned dependencies and current official PostgreSQL OpenAPI Angular accessibility and OWASP guidance without dependency upgrades.
