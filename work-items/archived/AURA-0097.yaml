security_privacy:
  applicable: true
  concerns:
    - Every dashboard saved-query alert suppression acknowledgement incident and annotation route and CLI action is owner-authorized and state changes require CSRF and idempotency with explicit confirmation for destructive or closing actions.
    - Saved queries and alert rules accept only closed finite fields operators dimensions windows thresholds and grouping keys and cannot carry arbitrary JSON SQL code URLs credentials owner identity or content-derived values.
    - Annotation text is bounded untrusted owner-authored product data and is returned only by explicit authorized REST snapshots. It is excluded from telemetry metrics logs SSE events URLs browser persistence and alert grouping.
    - Alert evidence and incident links expose only exact opaque versioned resource identities bounded finite measurements UTC timestamps and content-free hashes; missing partial stale or incompatible evidence is explicit.
    - Browser state is memory-only and logout auth-generation change and retention completion clear or refresh all affected operational views.
  data_classes:
    - dashboard_definition_metadata
    - saved_query_definition_metadata
    - alert_rule_metadata
    - alert_instance_metadata
    - alert_suppression_metadata
    - alert_acknowledgement_metadata
    - incident_metadata
    - annotation_content
    - operations_audit_metadata
