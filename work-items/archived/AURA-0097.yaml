id: AURA-0097
title: Add Observatory dashboards alerts annotations and incidents
status: integrated
change_class: repository_governance
intent: >
  Add Observatory-owned reusable dashboards and presets, closed bounded saved
  queries, durable in-product alert evaluation with grouping suppression and
  acknowledgement, incident workflows, and content-safe annotations linked to
  operational and evaluation resources, with accessible owner Web workflows
  and without external alert delivery or any Core dependency.
