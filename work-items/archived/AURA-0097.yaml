open_decisions:
  - Alerts are visible and actionable only inside Observatory. External delivery providers channels routing and credentials remain unresolved and out of scope.
  - Annotation text is bounded owner-authored Observatory product data and not telemetry. Rich text attachments mentions identities and external links are not implemented.
  - Alert rules use deterministic threshold conditions only. Statistical anomaly detection forecasting probabilistic confidence and automatic incident creation remain unavailable.
  - AURA-0098 owns complete composed-stack outage browser acceptance and operator documentation. Local Ollama or other provider reachability is an explicitly accepted non-blocking environment risk when all repository-local checks pass.
