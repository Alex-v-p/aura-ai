acceptance_criteria:
  - observatory-v1 adds backward-compatible closed bounded resources for dashboards presets saved queries alert rules instances suppressions acknowledgements incidents annotations audits and histories with stable IDs UTC timestamps exact versions and finite values.
  - Dashboard definitions compose a bounded number of versioned panels over existing public analytics comparison regression and health query shapes. System agent module model and regression presets are immutable service-owned definitions while owner dashboards are explicit versioned records.
  - Saved queries persist only closed typed operational trace metric comparison and regression filters with deterministic canonicalization explicit limits bounded time windows snapshot-stable pagination and no arbitrary expressions attributes or content.
  - Alert rules deterministically evaluate bounded latency error saturation quality availability privacy and freshness conditions through public query ports with explicit cadence window threshold direction missing-evidence stale partial and disabled states.
  - Repeated symptoms group under stable content-free bounded identities. Suppression is explicit scoped and time-bounded or manually cleared; acknowledgements are durable idempotent audited and separate from resolution.
  - Alert evaluation uses an existing Observatory deployable with durable PostgreSQL scheduling leases retry recovery and bounded batches. Failures and backlog are observable and never delay ingest evaluation or Core activity.
  - Incidents enforce explicit valid state transitions impact severity related-alert and evidence references ownership-free audit records resolution notes and idempotent commands. Invalid concurrent or stale transitions fail deterministically.
  - Annotations attach only to exact existing run deployment experiment regression or incident identities and versions. Text is bounded validated treated as untrusted and excluded from telemetry metrics logs SSE URLs alert grouping and browser persistence.
  - PostgreSQL migration is forward-only idempotent from empty and upgraded AURA-0096 state and preserves existing data. No ClickHouse schema change automatic TTL scheduled retention or external delivery is added.
  - REST CLI and operational SSE remain owner-authorized bounded metadata-only and backward-compatible. Commands have durable restart-safe idempotency deterministic 409 422 503 and terminal behavior; SSE replays resource-change metadata by persisted event ID.
  - Generated Angular output is reproducible and transport-only. Observatory Web provides responsive keyboard-accessible dashboard composition saved-query management alert triage suppression acknowledgement incident and annotation workflows without importing Aura product features.
  - Severity and state use text icons and accessible names in addition to colour. Dense dashboards pair charts with tables and clear units; alert grouping reduces repetition; reduced motion high contrast narrow screens and screen-reader navigation remain usable.
  - Destructive delete suppression-clear incident-close and annotation actions show affected resources require explicit confirmation prevent duplicate submission announce progress restore focus and refresh every affected view.
  - Browser views distinguish loading empty stale partial disconnected suppressed acknowledged firing recovered resolved rejected unauthorized and unavailable states with actionable in-product recovery and no redirect loops.
  - Authenticated data remains memory-only and logout auth-generation change retention completion and resource deletion clear or refresh all affected dashboard alert incident annotation and evidence views.
  - Real-browser acceptance covers presets dashboard composition saved queries alert firing grouping suppression acknowledgement recovery incident lifecycle annotations responsive keyboard triage confirmations SSE reconnect and stale or unavailable recovery.
  - Core remains usable with Observatory stopped and no Core source migration runner protocol normal request readiness scheduling or deployment dependency changes.
  - Python lint type and full tests contract compatibility generated-client parity Angular lint unit production and Storybook builds browser accessibility Playwright architecture validators baseline protection migration checks and diff checks pass.
