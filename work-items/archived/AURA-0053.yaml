id: AURA-0053
title: Add governed read-only tool execution with memory search
status: integrated
change_class: repository_governance
intent: >
  Introduce the smallest useful Aura-owned tool runtime by allowing an agent
  with an explicitly attached immutable tool policy to invoke a bounded,
  read-only memory.search tool through the existing authorized memory-recall
  use case, with typed contracts, visible lifecycle state, metadata-only audit,
  and independent evaluation.
