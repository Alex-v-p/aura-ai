acceptance_criteria:
  - A provider-neutral registry exposes stable versioned tool descriptors with JSON Schema 2020-12 inputs and results read or mutation classification permission scopes timeout bounded retry sensitivity audit and observable-component metadata.
  - Immutable tool-policy revisions are owned by agent configuration attached through new agent revisions and deny every tool unless the owner explicitly grants its stable identifier and version.
  - Every run pins its effective tool-policy revision and enforces explicit tool-call count deadline timeout and retry budgets without relying on provider behavior.
  - The lightweight Aura executor supports a bounded model request tool selection validated execution and response-synthesis cycle without exposing Ollama request types outside the provider adapter or LangGraph concepts in Aura contracts.
  - The only executable product tool is read-only memory.search and it calls the existing authorized recall service with the pinned principal agent memory policy lifecycle generation fallback and result limits.
  - memory.search does not introduce on_demand or hybrid recall modes does not disable existing automatic recall and is unavailable to agents without an explicit tool-policy grant.
  - Invalid unknown prohibited over-budget timed-out and provider-malformed tool requests settle as typed safe outcomes and never execute application behavior.
  - Ordered run events and Aura Web show pending executing completed denied and failed tool states without including memory text tool arguments raw results prompts responses or hidden reasoning.
  - Audit and telemetry contain stable tool version policy decision timing bounded counts identifiers and content-free outcome classes only.
  - Deterministic fixtures measure correct unnecessary missing and prohibited tool selection argument validity permission enforcement timeout behavior and successful memory-backed answers.
  - Existing conversations retries cancellation streaming automatic recall extraction and memory product behavior remain backward compatible.
  - No mutating tools confirmations external integrations network fetchers shell filesystem documents automation or Observatory behavior are added.
