security_privacy:
  applicable: true
  concerns:
    - Tool availability and execution must be deny-by-default and pinned to the immutable agent and run policy revisions.
    - memory.search must reuse the authorized memory-recall use case and may not create a second retrieval or scope-authorization path.
    - Memory content and model-generated tool arguments must not enter telemetry audit records or ordinary tool lifecycle events.
    - Tool results are untrusted evidence and may not become policy instructions or widen subsequent tool grants.
    - The first slice must remain read-only and must not expose shell filesystem network Home Assistant calendar or external-provider access.
  data_classes:
    - private_memory_content
    - private_memory_metadata
    - owner_and_agent_identifiers
