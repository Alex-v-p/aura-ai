id: AURA-0056
title: Add approval-backed reminder creation from conversations
status: integrated
change_class: repository_governance
intent: >
  Allow the built-in Aura agent to propose a validated one-shot reminder from
  an owner conversation, pause without creating the reminder, obtain an
  explicit durable owner decision, and resume exactly once to create or deny
  the reminder while preserving immutable policy revisions, owner isolation,
  metadata-only operational signals, and backward compatibility.
