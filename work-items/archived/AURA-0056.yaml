security_privacy:
  applicable: true
  concerns:
    - reminder.create is denied unless the run-pinned immutable policy grants exactly reminder.create@1 and the principal has reminders:write.
    - Every reminder.create request requires durable owner confirmation regardless of model confidence content due time agent or channel and no reminder may exist before approval.
    - Proposal content is private automation-owned data and may appear only in owner-authorized proposal or approval detail responses and final reminder persistence.
    - Proposal content requested due time tool arguments and owner subject must never enter SSE NATS outbox run events telemetry ordinary audit metadata logs or error detail.
    - Approval list detail stream approve reject cancellation and replay cursors must be bound to the authenticated owner and state-changing commands require same-origin CSRF validation UUID idempotency and expected versions.
    - Approval rejection expiry cancellation approval and run cancellation races must lock authoritative PostgreSQL rows so one terminal decision wins and duplicate deliveries cannot repeat a side effect.
    - Browser timezone input must be a valid IANA identifier pinned to the new run and server-derived local time must be computed from the server clock rather than trusted model or browser timestamps.
    - Legacy clients without a timezone remain supported and ambiguous reminder times must produce a clarification request rather than a guessed instant.
    - Approval-derived reminder idempotency must make resumed and redelivered work exactly-once and the resumed synthesis step must run with tools disabled.
    - Existing conversations retain their pinned agent and tool-policy revisions and custom agents receive no implicit reminder grant.
  data_classes:
    - private_reminder_proposal_content
    - private_reminder_content
    - owner_agent_conversation_and_run_identifiers
    - browser_iana_timezone
    - approval_tool_and_run_lifecycle_metadata
