acceptance_criteria:
  - New conversation-run admission accepts an optional valid IANA clientTimeZone pins it immutably to the run and remains backward compatible when legacy clients omit it.
  - Aura Web supplies the browser IANA timezone and prompt compilation adds server-derived current local date time offset and zone provenance without accepting the model or browser as the clock authority.
  - Without a pinned timezone the reminder tool requires an explicit offset-aware dueAt whenever a requested time is ambiguous and deterministic fixtures cover DST-equivalent instants and ambiguity clarification.
  - The provider-neutral registry exposes reminder.create@1 with typed content and dueAt input and an identifier status UTC-due-time result as a reminders:write mutation with unconditional confirmation zero retries bounded timeout private sensitivity and idempotent execution.
  - The existing one-tool-call-per-run limit remains enforced and no model request invokes the shared reminder-create use case before an approval is durably approved.
  - A built-in Aura successor tool policy grants exactly memory.search@1 and reminder.create@1 and a successor immutable agent revision selects it while existing conversations retain prior pinned revisions and custom agents remain deny-by-default.
  - A valid tool proposal stores trimmed private content and normalized future UTC due time in an automation-owned reminder proposal while the governance approval references proposal run conversation tool and owner identifiers without duplicating domain payload.
  - Pending approvals expire at the earlier of one hour after creation or the requested due instant and support pending approved rejected expired and canceled domain states with optimistic versions and immutable terminal outcomes.
  - Requiring confirmation persists proposal and approval metadata-only lifecycle events releases the worker lease and moves the run to waiting_for_confirmation with its tool lifecycle awaiting_confirmation.
  - Owner-scoped list detail approve and reject APIs plus approval SSE use additive OpenAPI 1.9.0 contracts and expose proposal content only from an explicitly authorized detail response.
  - Approval SSE contains identifiers status versions and lifecycle timestamps only and never proposal content or requested due time; it replays owner-authorized persisted events after Last-Event-ID supplies heartbeats and reconciles after duplicate wakeups reconnects and offline periods.
  - Approval atomically queues the waiting run for resumption and the worker uses approval-derived idempotency to invoke the existing reminder-create application use case exactly once before one tools-disabled synthesis step.
  - Rejection or expiry resumes the run with a typed denied tool outcome performs one tools-disabled synthesis step and creates no reminder.
  - Canceling a waiting run cancels its pending approval and approve reject cancel expiry and duplicate-resume races use locking expected versions and idempotency so exactly one valid outcome wins.
  - The originating conversation displays an accessible durable confirmation card and the global approvals inbox displays pending approved rejected expired canceled executing completed and failed states after refresh or reconnect with safe loading empty error and responsive behavior.
  - OpenAPI 1.9.0 run status waiting_for_confirmation tool status awaiting_confirmation approval APIs and the run-event JSON Schema are backward-compatible and the generated transport client remains synchronized.
  - Audit outbox SSE run events NATS and telemetry contain only approved metadata fields while component manifests and runtime instrumentation cover approval creation decision expiry waiting resumption SSE replay reminder idempotency and failures.
  - No recurrence editing rescheduling reminder deletion multi-approver policy household sharing external notification provider voice Aura Wall calendar Home Assistant shell filesystem network or Observatory behavior is added.
