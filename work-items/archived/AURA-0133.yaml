security_privacy:
  applicable: true
  concerns:
    - Every API query and command is owner-scoped; CSRF idempotency optimistic versions and no-store responses remain mandatory where the existing contract requires them.
    - Scheduler and worker identities carry no owner authority. Admission and recovery revalidate the immutable owner principal selected calendar and document grants agent revision and pinned policy references before use.
    - Memory is unrepresentable in briefing source assembly and the briefing execution seam must disable ambient automatic recall and memory-search grants for the run.
    - Calendar reminder and document values are private untrusted evidence fenced from system instructions policies permissions grants tools confirmation decisions and execution control; hostile indirect prompt injection receives explicit tests.
    - Context and result content source values owner identity document identifiers calendar identifiers prompts responses provider material credentials and raw errors must not enter lifecycle events outbox envelopes logs ordinary telemetry SSE notification payloads or URLs.
    - Result content is owner-private no-store data retained until explicit deletion. Schedule deletion cannot cascade history or results and history or result deletion preserves content-free audit and lineage truth.
    - Duplicate polling transport redelivery worker retry cancellation timeout and recovery must never produce a second run result or inbox notification for one occurrence.
    - Governed run evidence remains optional nonblocking and whole-item closed-serialized under ADR-0017; capture rejection or outage cannot change briefing execution or settlement.
  data_classes:
    - owner-private briefing schedule definitions and source grants
    - owner-private occurrence result and run lineage
    - owner-private calendar reminder and document context
    - owner-private generated briefing result content
    - metadata-only lifecycle outbox notification and observability records
