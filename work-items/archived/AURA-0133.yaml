id: AURA-0133
title: Implement Core scheduled briefing execution
status: integrated
change_class: repository_governance
intent: >
  Implement the existing owner-scoped scheduled-briefing contracts inside Aura
  Core: durable daily schedules, occurrences and results; deterministic
  polling and admission; bounded source assembly; Aura-owned run execution and
  recovery; and idempotent notification delivery, without adding frontend,
  provider, deployment, Observatory, or public-contract behavior.
