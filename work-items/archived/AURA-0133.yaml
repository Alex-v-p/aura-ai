    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/design/daily-action-and-workflow-initiative.md
    - docs/specifications/tools-automation-and-integrations.md
    - docs/specifications/agents-and-execution.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - docs/adr/0017-governed-production-run-evidence.md
    - work-items/archived/AURA-0132.yaml
    - work-items/integration/AURA-0132.yaml
    - On 2026-10-27 the owner approved calendar events reminders and explicitly owner-selected documents as the closed initial briefing source set; memory is excluded.
    - On 2026-10-27 the owner approved one daily local-time cadence with an explicit validated IANA timezone.
    - On 2026-10-27 the owner approved delivery through an owner-private notification linking to a dedicated durable briefing result and manual-only retention until explicitly deleted.
    - AURA-0133 implements only the existing create read pause resume and scope-named deletion operations; schedule editing is not authorized.
    - AURA-0133 adds no owner-facing occurrence cancellation operation. Schedule deletion and recovery may cancel an already admitted run only through the existing Aura-owned run cancellation boundary and must durably settle the occurrence.
    - The scheduler is polling-only and carries no owner authority. It claims due work and invokes the briefing application; it does not assemble context or call a model.
    - Briefings may consume only public calendar reminder document execution and notification APIs and may not read their tables repositories adapters or provider payloads.
    - The existing generic transactional-outbox identifier envelope may wake a worker. A new cross-process public event or command contract is not authorized; if the existing seam is insufficient implementation stops with a contract or ADR blocker.
    - Existing transactional-outbox rehydration may be extended only to preserve and publish the already-versioned exact briefing lifecycle event payload on its separate event subject; this does not authorize changing the lifecycle contract or the identifier-only worker wake envelope.
    - One Core Worker owns the briefing domain migration repository API and deletion semantics; a second Core Worker owns bounded context execution admission and run lineage; a third Core Worker owns scheduler worker notification handoff and recovery composition. Their handoffs must name their exact ownership zones and may not repair another zone without Delivery Lead reassignment.
    - The Platform Worker owns only the module-registry and briefing component-manifest changes. The Test and Evaluation Engineer owns only independent AURA-0133 tests and evaluators and does not repair product implementation.
    - AURA-0134 owns Aura Web briefing creation management history and result presentation after this Core slice is integrated.
