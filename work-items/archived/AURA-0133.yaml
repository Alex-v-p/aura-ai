acceptance_criteria:
  - Migration 0026 creates Core-owned owner-scoped briefing schedule occurrence result command-receipt and lineage persistence with foreign keys uniqueness checks optimistic versions manual-only retention and transactional-outbox participation; downgrade removes only its own objects and migration tests pass on PostgreSQL when configured.
  - The briefing application implements the existing create list get pause resume schedule-delete occurrence list/get history-delete result get and result-content-delete resources with exact contract states owner isolation no-store behavior CSRF idempotency stale-version handling and explicit scope semantics; no edit or occurrence-cancel operation is added.
  - Daily due calculation validates an explicit IANA timezone preserves local wall time across offset changes moves a DST-gap time to the first valid instant emits an overlap once at its earlier instant and gives each due local date exactly one stable occurrence identity.
  - Polling claims are bounded and use PostgreSQL row locks or equivalent transactional coordination; duplicate scans restarts stale claims and redelivery admit at most one run per occurrence. Recovery runs at most one overdue occurrence records every older missed due date as skipped and schedules only the next future occurrence.
  - Pause prevents future admission without canceling an admitted occurrence; resume continues the original cadence with bounded missed handling. Schedule deletion atomically prevents future admission and requests cancellation of any nonterminal associated run through the public Run Coordinator boundary while retaining occurrence and result records.
  - Admission pins the immutable owner household workspace agent revision execution prompt model and tool policy references plus source provenance deadlines and resource budgets; current owner authorization source readiness and policy validity are revalidated at admission and recovery and no scheduler or worker identity widens authority.
  - A dedicated additive Aura-owned execution seam creates and executes a briefing run with stable occurrence and run lineage outside conversation history, uses the existing provider-neutral Run Coordinator and cancellation behavior, enforces the pinned deadline and budgets, and disables memory recall memory writes and memory-facing tools.
  - Context assembly queries only the public calendar reminder and document application APIs for the occurrence-local day and explicitly selected grants, uses fixed per-source and total size/count/time limits, records complete partial unavailable or unknown truthfully, and never reads a foreign table repository adapter or provider payload.
  - Context serialization places every calendar reminder and document value in a closed delimited untrusted-evidence section that cannot alter instructions policy tools or execution control; hostile calendar and document prompt-injection fixtures remain inert and memory content is absent.
  - Worker processing uses the existing generic identifier-only outbox envelope, acknowledges transport only after a durable occurrence/result settlement, retries transient failures with bounded policy, reconciles terminal run states after crashes, and creates at most one terminal result per occurrence. If this cannot be achieved without a new public cross-process contract implementation stops and reports the blocker.
  - Terminal completed partial failed canceled and unknown outcomes persist the contracted result occurrence source-completeness timestamps versions and run lineage without fabricating content. Partial and failed outcomes never silently omit a required source.
  - A settled deliverable result invokes NotificationApplicationService through CreateBriefingNotification only; deterministic idempotency prevents duplicate inbox rows and the Briefings domain never reads notification persistence.
  - Schedule history and result content have no automatic expiry. Schedule deletion does not cascade, occurrence-history and result-content deletion are separate owner-authorized idempotent commands, and content-free deletion audit and lineage remain inspectable.
  - The seven declared Aura-owned components have registered manifests finite low-cardinality outcomes and error classes active-operation spans and the required metrics/evaluators; identifiers are trace-only where allowed and no private or content-derived value is a metric label or ordinary telemetry field.
  - Optional ADR-0017 evidence for briefing admission source assembly execution persistence and delivery uses explicit closed serializers rejects prohibited or secret-bearing items whole and remains nonblocking; no Observatory code dependency or browser-visible evidence is introduced.
  - Deterministic tests and evaluations cover DST gaps and overlaps duplicate claim and delivery restart and stale-claim recovery bounded missed occurrences pause resume deletion cancellation deadlines budgets authorization and source revocation hostile content source completeness notification idempotency manual deletion and metadata-only observability.
  - No OpenAPI event generated-client frontend memory provider deployment infrastructure Observatory protected-baseline dependency framework service package or top-level-directory change occurs.
