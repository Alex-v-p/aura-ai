id: AURA-0068
title: Add owner-private document storage and ingestion foundation
status: integrated
change_class: repository_governance
intent: >
  Add a private Garage-backed Aura document library foundation with bounded
  streamed uploads, owner-scoped metadata, asynchronous PDF DOCX Markdown and
  plain-text processing, hybrid retrieval, explicit retry and deletion, and
  metadata-only lifecycle observation without introducing mounted sources or
  conversational document tools.
