    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-approved Aura-managed Garage object uploads as the only v1 document source with no filesystem SMB Nextcloud or arbitrary URL ingestion
    - Owner-approved PDF DOCX Markdown and plain-text formats with a 100000000-byte per-file limit and no OCR
    - Owner-approved asynchronous processing on upload and retention until explicit owner deletion
    - Owner-approved private owner-wide document search with custom agents remaining deny-by-default until a later conversational-tool slice
