acceptance_criteria:
  - A private single-node Garage deployment persists beneath AURA_STATE_ROOT uses a private bucket and scoped runtime-file credentials and is reachable only by authorized Core processes.
  - Aura Core exposes an owner-scoped document public API with immutable document identity optimistic versions and uploading queued processing ready failed and deleting states.
  - The API streams at most 100000000 bytes per upload into the object-store port without buffering the full file and accepts only validated PDF DOCX Markdown and plain text.
  - Durable asynchronous processing parses bounded untrusted input chunks extracted text creates provider-neutral embeddings and commits searchable content atomically and idempotently.
  - Active duplicate content for one owner resolves to the existing document without duplicating object bytes chunks or embeddings.
  - Owner-authorized list inspect search download retry and delete operations are represented by backward-compatible OpenAPI and generated-client contracts.
  - Search combines bounded lexical and vector retrieval only across ready documents belonging to the authenticated owner and preserves document and page-or-section provenance.
  - Deletion immediately excludes content from retrieval and eventually removes chunks embeddings and the Garage object with visible retryable failure state.
  - Lifecycle events manifests metrics and evaluators are metadata-only and never capture names content chunks hashes embeddings object keys owner identity or credentials.
  - Migration 0019 upgrades from 0018 and fresh installations without changing existing memory conversation reminder notification approval or tool behavior.
  - No document frontend feature conversational document tool citations mounted source SMB Nextcloud URL fetch OCR image inspection artifact behavior or automatic memory extraction is added.
