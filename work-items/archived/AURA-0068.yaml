security_privacy:
  applicable: true
  concerns:
    - Original objects filenames extracted text chunks hashes embeddings and owner identity are private and must not enter ordinary logs telemetry NATS payloads or audit metadata.
    - The browser never receives Garage credentials object keys or direct bucket access and authenticated document traffic must not be cacheable.
    - Upload streams are bounded to 100000000 bytes and validated by declared type extension and content signature before processing.
    - PDF and DOCX parsing treats input as hostile and enforces bounded time memory archive expansion page and extracted-text limits without general egress or unrelated secret access.
    - All document list inspect search download retry and delete operations are bound to the authenticated owner.
    - Document events and NATS messages contain identifiers bounded lifecycle state versions and timestamps only.
    - Deletion removes the document from retrieval before asynchronous object cleanup and remains retryable without redisclosing private content.
  data_classes:
    - private_document_content
    - private_document_filename_and_metadata
    - private_document_embeddings
    - owner_identity
    - document_and_processing_identifiers
