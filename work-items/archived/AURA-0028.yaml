contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: true
  owning_service: aura-core
  owning_module: interaction.conversations
observability:
  applicable: true
  affected_components:
    - aura.runtime.model_inference
    - aura.interaction.conversation_persistence
  required_metrics:
    - title_inference_duration_ms
    - title_persistence_duration_ms
    - title_generation_outcome
    - title_input_size
    - title_output_size
  required_evaluators: []
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - The first completed user and assistant exchange is private conversation content and may only reach the already selected authorized model provider
    - Transcript text generated title text prompts and provider payloads must never enter logs telemetry audit metadata or error payloads
    - Title inference must not reuse agent or persona instructions or widen the run's model policy
    - Provider failure timeout malformed output or unavailable capacity must preserve the completed response and use the deterministic first-message fallback
    - Redelivery must conditionally settle a pending title at most once without rewriting generated or fallback titles
  data_classes:
    - private conversation transcript excerpts
    - model-generated conversation titles
    - model run and conversation identifiers
    - title generation state
