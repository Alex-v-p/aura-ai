id: AURA-0028
title: Generate topic-based conversation titles
status: approved
change_class: feature
intent: >
  Give newly created conversations a concise model-generated topic title after
  their first completed assistant response while preserving exact model policy,
  failure isolation, private-content boundaries, and stable legacy titles.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/system-context.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/agents-and-execution.md
    - docs/specifications/observatory-and-evaluation.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - User-approved Responsive Navigation and AI Conversation Titles plan
    - Title inference reuses the completed run's exact pinned model through the existing provider-neutral model port
    - Title inference uses a neutral title-only request and never uses the selected agent or persona prompt
    - The first completed user and assistant exchange is the only inference input and each message is capped at 2000 characters
    - Title generation is bounded to 10 seconds with no model fallback and failure never changes the completed run to failed
    - Existing conversations are legacy and never automatically retitled while new conversations settle exactly once from pending to generated or fallback
    - Derived title settlement does not increment the optimistic conversation configuration version
    - "This feature is delivered as its own reviewed commit named feat(conversations): generate topic titles for new chats"
  contracts:
    - contracts/openapi/aura-v1.yaml
