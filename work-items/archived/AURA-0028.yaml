  max_parallel_agents: 4
  max_parallel_writers: 3
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Alembic revision 0006_title_generation covers upgrades from 0005 and fresh installations, adds an internal title state, and deterministically marks existing conversations legacy while fresh conversations begin pending.
  - Drafts display New conversation and a submitted conversation exposes its existing first-message fallback until title generation settles.
  - Only the first completed assistant response triggers title generation and failed canceled interrupted or partial responses do not settle the title.
  - The completed assistant message and run are persisted and published before a neutral title-only request uses that run's exact pinned model.
  - Inference input contains only the first completed user and assistant exchange capped at 2000 characters per message and is bounded to 10 seconds.
  - Generated titles are plain text containing 3 to 8 words and at most 72 characters after whitespace quote Markdown and leading Title normalization with word-boundary trimming.
  - Empty control-only malformed timed-out unavailable or failed generation settles to the existing first-message fallback without changing the completed run to failed or routing to another model.
  - Generated or fallback settlement is conditional and idempotent under worker redelivery and does not increment the conversation configuration version.
  - The in-memory and PostgreSQL conversation stores expose equivalent internal pending-title lookup and conditional-settlement behavior through registered application and runtime boundaries without importing provider adapters into the conversation domain.
  - The conversation heading and recent-conversation sidebar refresh to the persisted title after terminal run status without losing a draft or requiring a new public endpoint.
  - Existing legacy conversations retain their prior titles and fresh and upgrade migrations preserve message run and conversation identifiers.
  - Telemetry records only inference and persistence duration outcome model and source identifiers and input output sizes and never transcript prompt response or title content.
  - ConversationSummary title remains backward-compatible and no OpenAPI or generated-client shape changes are introduced.
