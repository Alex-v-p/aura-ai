id: AURA-0150
title: Repair workflow recovery PostgreSQL test identities
status: integrated
change_class: bugfix
intent: >
  Restore the four live PostgreSQL workflow-run recovery checks by making their
  test requests reference canonical migrated agent and model-policy revisions,
  without changing workflow recovery behavior, persistence, migrations,
  contracts, deployment, or any production module.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/design/daily-action-and-workflow-initiative.md
    - docs/design/failure-and-recovery-states.md
    - docs/specifications/agents-and-execution.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - work-items/archived/AURA-0137.yaml
    - work-items/active/AURA-0148.yaml
    - >-
      The defect is confined to services/aura-core/tests/test_workflow_run_recovery.py:
      its live request fixture creates random agent_revision_id and
      model_policy_revision_id values that do not exist after the canonical
      migrations, so PostgreSQL correctly rejects run insertion at the foreign
      keys before recovery behavior is exercised.
    - >-
      The correction must reuse canonical migrated immutable identities through
      existing public test-visible constants or an equivalent test-local lookup;
      it must not insert fake authority rows, disable constraints, change
      migrations, or relax the repository behavior under test.
    - >-
      AURA-0148 compatibility requires all four previously unallowlisted live
      workflow recovery nodes to pass against an isolated migrated PostgreSQL
      database, with no skip or expected-failure classification, so they can be
      consumed as observed aggregate evidence.
  contracts: []
feature_references:
  - RUN-014
  - RUN-015
  - RUN-016
  - AUT-014
  - AUT-018
ownership_zones:
