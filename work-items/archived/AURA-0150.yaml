contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: aura-core
  owning_module: execution.runs tests
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: false
  concerns: []
  data_classes:
    - canonical immutable agent and model-policy revision identifiers in an isolated test database
    - synthetic workflow lineage input and metadata-only recovery outcomes
required_agents:
  implementation:
    - core_worker
  review:
    - general_reviewer
    - architecture_guardian
  integration: true
execution:
  parallelism_class: local
  max_parallel_agents: 1
  max_parallel_writers: 1
  model_tier: efficient
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - >-
    The four repository-backed recovery tests reserve and settle runs against a
    clean database upgraded to the current Alembic head using agent and
    model-policy revision identifiers that are present in canonical migrated
    rows; all four pass with no skip expected failure or foreign-key error.
  - >-
    The corrected fixture still generates unique workflow run workflow revision
    instance step-execution and correlation lineage per request, and it does not
    alter the inputs deadlines providers outcomes cancellation or replay
    assertions that exercise recovery behavior.
  - >-
    The three database-independent tests in the same file remain green and the
    full seven-test file passes against the same isolated migrated PostgreSQL
    database.
  - >-
    AURA-0148 can consume the exact four live node results as observed workflow
    recovery evidence without adding them to a skip allowlist, synthesizing a
    pass, weakening fail-closed aggregation, or changing any AURA-0148 fixture.
  - >-
    No production source migration contract deployment frontend Observatory
    provider dependency protected baseline or unrelated test file changes.
required_checks:
