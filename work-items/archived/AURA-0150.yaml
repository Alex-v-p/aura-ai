  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0150.yaml --path work-items/active/AURA-0150.yaml --path services/aura-core/tests/test_workflow_run_recovery.py
  - python3 tooling/architecture/validate-contract-changes.py --work-item work-items/active/AURA-0150.yaml
  - python3 tooling/architecture/validate-import-boundaries.py
  - python3 tooling/architecture/validate-service-isolation.py
  - python3 tooling/architecture/validate-module-registry.py
  - python3 tooling/architecture/validate-repository-shape.py
  - python3 tooling/architecture/validate-baseline-protection.py --work-item work-items/active/AURA-0150.yaml
  - UV_CACHE_DIR=.local-state/uv-cache RUFF_CACHE_DIR=.local-state/ruff-cache uv run ruff check services/aura-core/tests/test_workflow_run_recovery.py
  - UV_CACHE_DIR=.local-state/uv-cache uv run pyright services/aura-core/tests/test_workflow_run_recovery.py
  - >-
    AURA_0137_DATABASE_URL=${AURA_0137_DATABASE_URL:?fresh isolated PostgreSQL URL required}
    AURA_TEST_DEPENDENCIES_ISOLATED=1 UV_CACHE_DIR=.local-state/uv-cache uv run pytest
    -p no:cacheprovider services/aura-core/tests/test_workflow_run_recovery.py::test_reservation_is_durable_before_provider_effect
    services/aura-core/tests/test_workflow_run_recovery.py::test_restart_returns_unknown_without_replaying_provider_effect
    services/aura-core/tests/test_workflow_run_recovery.py::test_durable_terminal_failure_is_replayed
    services/aura-core/tests/test_workflow_run_recovery.py::test_cancellation_is_exact_lineage_and_terminal_replay_is_stable
    -q
  - >-
    AURA_0137_DATABASE_URL=${AURA_0137_DATABASE_URL:?fresh isolated PostgreSQL URL required}
    AURA_TEST_DEPENDENCIES_ISOLATED=1 UV_CACHE_DIR=.local-state/uv-cache uv run pytest
    -p no:cacheprovider services/aura-core/tests/test_workflow_run_recovery.py -q
  - >-
    AURA_0137_DATABASE_URL=${AURA_0137_DATABASE_URL:?fresh isolated PostgreSQL URL required}
    AURA_TEST_DEPENDENCIES_ISOLATED=1 UV_CACHE_DIR=.local-state/uv-cache uv run pytest
    -p no:cacheprovider services/aura-core/tests/test_workflow_run_recovery.py -q
    --junitxml=.local-state/aura0150-workflow-recovery.xml
  - git diff --check
