acceptance_criteria:
  - The wide-desktop collapsed sidebar remains 78px wide.
  - The Aura mark, expand glyph, and new-conversation glyph are centered within 1px of the compact rail content axis.
  - Hidden labels do not reserve flex gaps in the collapsed desktop rail.
  - The 272px expanded desktop sidebar retains its existing labels, spacing, transitions, accessible names, and keyboard behavior.
  - Tablet rail and mobile overlay behavior and geometry remain unchanged.
  - No component interface, backend, contract, persistence, Docker, shared-library, or design-document change is introduced.
