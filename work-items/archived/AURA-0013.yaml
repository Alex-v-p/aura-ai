id: AURA-0013
title: Center compact sidebar icons
status: integrated
change_class: bugfix
intent: >
  Center the Aura mark, expand glyph, and new-conversation glyph on the
  wide-desktop compact sidebar axis without changing responsive behavior or
  the expanded navigation layout.
