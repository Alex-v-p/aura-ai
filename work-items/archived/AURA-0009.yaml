id: AURA-0009
title: Allow autonomous reviewed checkpoint commits
status: integrated
change_class: repository_governance
intent: >
  Permit Aura delivery and integration workflows to create focused local Git
  checkpoint commits after coherent reviewed and validated milestones without
  requesting per-commit authorization, while retaining explicit authorization
  for pushes and all history-rewriting operations.
sources_of_truth:
  architecture:
    - AGENTS.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
    - docs/development/worktree-collaboration.md
  specifications: []
  decisions:
    - Owner instruction to stop requesting permission for local checkpoint commits and update repository policy
  contracts: []
feature_references: []
ownership_zones:
  - repository.governance
  - documentation.development
allowed_paths:
  - AGENTS.md
  - .agents/skills/git-commit/SKILL.md
  - .agents/skills/aura-integrate-change/SKILL.md
  - docs/development/codex-agent-system.md
  - docs/development/work-item-process.md
  - docs/development/worktree-collaboration.md
  - work-items/active/AURA-0009.yaml
  - work-items/archived/AURA-0009.yaml
forbidden_paths:
  - frontend/**
  - services/**
  - contracts/**
  - packages/**
  - evaluations/**
  - deploy/**
  - infra/**
  - satellites/**
  - extensions/**
  - scripts/**
  - .github/**
  - .codex/**
  - tooling/architecture/**
  - docs/architecture/**
  - docs/adr/**
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: false
  concerns: []
  data_classes: []
required_agents:
  implementation:
    - platform_worker
  review:
    - general_reviewer
    - architecture_guardian
  integration: false
execution:
  parallelism_class: local
  max_parallel_agents: 1
  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: false
  escalation_reason_required: true
acceptance_criteria:
  - Local checkpoint commits are permitted after coherent reviewed and validated milestones without per-commit user authorization.
  - Workers still do not commit unreviewed, broken, unrelated, temporary, generated-only, secret-bearing, or noisy micro-changes.
  - Pushing remains prohibited without explicit user authorization.
  - Force pushes, amendments, rebases, and history rewrites remain prohibited without separate explicit authorization.
  - Repository guidance, commit skill, integration skill, and development workflow documentation state the same policy.
  - Product code, contracts, architecture decisions, deployment files, and enforcement tooling are unchanged.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0009.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0009.yaml
  - python3 -m unittest discover -s tooling/architecture/tests -v
  - python3 tooling/architecture/validate-repository-shape.py
  - git diff --check
baseline_changes_allowed: false
human_approval_required: true
open_decisions: []
