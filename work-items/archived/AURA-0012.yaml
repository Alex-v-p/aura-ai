acceptance_criteria:
  - Mobile navigation uses an explicit close control that closes the overlay, removes the scrim, and returns focus to the trigger without changing desktop collapse state.
  - A desktop-collapsed state cannot produce a collapsed or hybrid mobile drawer.
  - Wide desktop collapses to a 78px minimal rail containing only the Aura mark, expand control, and new-conversation action.
  - Desktop conversation history and theme controls are hidden from rendering, focus, and accessibility traversal while collapsed and return when expanded.
  - Tablet retains its compact rail with stable full-width conversation-control geometry, accessible names, and tooltips.
  - Sidebar width and label visibility use restrained 120-200ms motion without a hybrid intermediate layout and respect reduced motion.
  - Existing shell input and output interfaces remain unchanged.
  - No backend, contract, persistence, Docker, shared-library, or design-document change is introduced.
