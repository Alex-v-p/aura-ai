id: AURA-0012
title: Correct responsive sidebar collapse visuals
status: integrated
change_class: bugfix
intent: >
  Correct Aura Web sidebar collapse and close behavior so the mobile overlay
  closes cleanly, the desktop compact state remains visually coherent, and
  the tablet rail keeps stable, accessible navigation geometry.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
  specifications:
    - docs/design/README.md
    - docs/design/foundations.md
    - docs/design/components-and-interactions.md
  decisions:
    - User-selected minimal desktop icon rail
    - User-selected explicit mobile close control
    - User-selected restrained sidebar motion
  contracts: []
feature_references: []
ownership_zones:
