id: AURA-0156
title: Refresh repository presentation and main merge readiness
status: integrated
change_class: documentation
intent: >
  Present Aura AI as a polished, evidence-backed repository with current
  feature highlights, architecture and startup guidance, representative
  screenshots, and an explicit merge-readiness assessment.
sources_of_truth:
  architecture:
    - docs/architecture/overview.md
    - docs/architecture/system-context.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/README.md
    - docs/specifications/product-overview.md
    - docs/design/README.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0018-governed-web-research-providers.md
  contracts:
    - contracts/openapi/aura-v1.yaml
feature_references:
  - WEB-003
  - OBS-001
ownership_zones:
  - repository.documentation
  - repository.presentation-assets
  - delivery.aura0156
allowed_paths:
  - README.md
  - docs/assets/readme/**
  - work-items/active/AURA-0156.yaml
  - work-items/archived/AURA-0156.yaml
  - work-items/handoffs/AURA-0156-*.yaml
  - work-items/reviews/AURA-0156-*.yaml
  - work-items/integration/AURA-0156.yaml
forbidden_paths:
  - AGENTS.md
  - .agents/**
  - .codex/**
  - .github/**
  - contracts/**
  - deploy/**
  - evaluations/**
  - infra/**
  - satellites/**
  - extensions/**
  - tooling/**
  - services/**
  - frontend/**
  - compose.yaml
  - package.json
  - pnpm-lock.yaml
  - pyproject.toml
  - uv.lock
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: Screenshots must contain no secrets, credentials, tokens, or private user content.
security_privacy:
  applicable: true
  concerns:
    - screenshots may expose private user or operational data
    - repository prose must not imply disabled providers are enabled
  data_classes:
    - public repository documentation
required_agents:
  implementation:
    - platform_worker
  review:
    - general_reviewer
    - security_privacy_reviewer
    - aura_ux_ui_reviewer
  integration: true
execution:
  parallelism_class: local
  max_parallel_agents: 4
  max_parallel_writers: 1
  model_tier: efficient
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - >-
    README leads with a concise product description, representative sanitized
    screenshots, current feature groups, architecture highlights, quick start,
    documentation links, project status, and contribution/development guidance.
  - >-
    Every feature claim is evidenced by current routes, contracts, services,
    or accepted architecture and clearly distinguishes disabled-by-default or
    operator-configured capabilities.
  - >-
    Screenshot assets are useful at common GitHub widths and contain no
    credentials, secrets, tokens, personal content, or sensitive telemetry.
  - >-
    Existing startup, stop, reset, external identity, and detailed
    documentation guidance remains accurate and reachable.
  - >-
    Main-merge preparation reports branch ancestry, lifecycle inconsistencies,
    and aggregate validation results without merging or pushing.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0156.yaml
  - >-
    python3 tooling/architecture/validate-changed-paths.py --work-item
    work-items/active/AURA-0156.yaml --path work-items/active/AURA-0156.yaml
    --path README.md --path docs/assets/readme/aura-web.png
    --path docs/assets/readme/aura-observatory.png
  - python3 tooling/architecture/validate-repository-shape.py
  - python3 tooling/architecture/validate-baseline-protection.py --work-item work-items/active/AURA-0156.yaml
  - pnpm --dir frontend exec prettier --check ../README.md
  - git diff --check
baseline_changes_allowed: false
human_approval_required: false
open_decisions: []
