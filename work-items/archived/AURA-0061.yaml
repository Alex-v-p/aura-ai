security_privacy:
  applicable: true
  concerns:
    - Memory content, provenance, evidence, review candidates, edits, and policy drafts remain owner-authorized and must not enter browser durable storage, logs, telemetry, URLs, or unrelated feature state.
    - Route-backed detail preserves explicit user or Agent scope and must not broaden the API's safer authorization defaults.
    - Search and filters must preserve current scope enforcement and must not expose Agent-private records outside authorized results.
    - Correct, approve, edit-and-approve, reject, dispute, supersede, archive, disable, reactivate, and purge retain their existing deterministic API semantics and conflict handling.
    - Recoverable failures retain user-authored form state in memory and sanitize provider and server diagnostics.
    - Hard purge remains a distinct focus-managed destructive confirmation and is never visually conflated with ordinary lifecycle actions.
  data_classes:
    - private_memory_content
    - private_memory_provenance_and_evidence
    - private_memory_review_candidates
    - owner_scoped_agent_memory_policy
