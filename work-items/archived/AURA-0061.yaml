id: AURA-0061
title: Redesign Memory as a human-readable knowledge workspace
status: integrated
change_class: feature
intent: >
  Recompose Aura Web Memory into a calm, responsive "What Aura knows"
  workspace with readable records, route-backed contextual detail, guided
  correction and lifecycle controls, an explicit review queue, approachable
  first-use settings, and plain-language Agent memory policy while preserving
  all existing Core contracts, ownership scopes, immutable history, and
  privacy boundaries.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/memory-and-knowledge.md
    - docs/specifications/agents-and-execution.md
    - docs/design/README.md
    - docs/design/foundations.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/reference-research.md
    - docs/design/sidebar-and-management-surfaces.md
  decisions:
    - Owner-approved Memory direction in Aura Sidebar and Management Surfaces Redesign
    - Existing Aura v1 Memory APIs are sufficient; this work item introduces no contract or persistence change
    - Desktop record detail is a route-backed contextual inspector and mobile detail is the full-screen /memory/:id representation
    - Technical identifiers, embedding metadata, confidence, importance, retention, and provider diagnostics use progressive disclosure
    - Existing immutable revision, provenance, lifecycle, scope, and hard-purge semantics remain unchanged
    - MemoryStore joins the existing application-composed management-session reset port so accepted-session changes clear private Memory state and cached CSRF without introducing a reverse dependency on Conversations
    - Manual memory creation reuses one client idempotency key after an uncertain failure for the same retained draft and rotates it only after known success, cancellation, draft change, or session reset
  contracts:
    - contracts/openapi/aura-v1.yaml
