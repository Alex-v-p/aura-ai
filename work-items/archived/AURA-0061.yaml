acceptance_criteria:
  - The collection is headed "What Aura knows" and prioritizes readable content, scope, lifecycle state, and recency over confidence, identifiers, embedding, or provider detail.
  - Search is the dominant collection control; scope and lifecycle stay close at hand while kind, provenance, confidence, date, Agent, and historical filters are disclosed under Advanced with a clear-active-filter affordance and safe reset path.
  - Wide desktop presents a readable record list beside a contextual inspector; tablet detail overlays or occupies a non-squeezed contextual surface; mobile collection selection navigates to a focused full-screen /memory/:id detail with a clear return path and no horizontal scrolling.
  - Direct /memory/:id visits load the authorized record safely, preserve scope query context, communicate loading, authentication, permission, not-found, and recoverable failure states, and never briefly expose stale detail from another record or principal.
  - Record detail groups Current memory, Why Aura knows this, Lifecycle, and History; Correct is the primary action while dispute, supersede, archive, disable or reactivate, pinning, technical metadata, and purge are secondary progressive disclosures.
  - Correction retains entered content, reason, and advanced values after recoverable failures; current lifecycle and version conflicts are explained without presenting an unknown outcome as success.
  - Manual creation starts with Content and Scope; kind, confidence, importance, retention, and other expert settings appear under Advanced; cancellation is safe and a failed save retains the draft.
  - The review queue displays a visible pending count and readable source, proposed content, scope, sensitivity, and confidence context before the distinct Approve, Edit and approve, and Reject actions.
  - Review actions remain unavailable for malformed or non-actionable provider diagnostics, preserve edited inputs on failure, and communicate the terminal decision without retaining an actionable stale row.
  - Memory settings prioritize initial setup, current extraction and embedding model health, reindex progress, and plain-language recovery; provider inventory, model digests, generations, dimensions, and other diagnostics live under Advanced.
  - Agent memory policy explains Off and Automatic recall, readable scopes, and sharing behavior first; thresholds, limits, context budget, and fallback Agent identifiers live under Advanced while immutable revision and explicit attachment behavior remain intact.
  - Loading, empty, filtered-empty, first-use, authentication-required, permission-denied, validation, conflict, offline/provider, success, and destructive confirmation states use semantic text and structure in addition to color.
  - All new controls have screen-reader names and visible keyboard focus; drawers/dialogs manage and restore focus; status announcements are live where appropriate; ordinary motion is 120-200ms and reduced motion is respected.
  - Light and dark stories cover collection, selected detail, mobile detail, creation, review queue, settings health and failure, Agent policy, and key empty/loading/error states using only approved semantic tokens.
  - Automated validation covers 1440x900, iPad Mini, and iPhone 13-equivalent widths, keyboard operation, focus return, 200 percent zoom/reflow, non-color state communication, and axe checks for landing, detail, forms, disclosures, review, settings, and destructive confirmation.
  - Existing Memory API requests, immutable revisions, owner and Agent scopes, lifecycle actions, review decisions, settings updates, model selection rules, and Agent policy creation/attachment remain behaviorally backward compatible.
