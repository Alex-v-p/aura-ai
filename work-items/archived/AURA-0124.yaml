id: AURA-0124
title: Suppress idle-loop telemetry amplification
status: integrated
change_class: bugfix
intent: >
  Stop Core and Observatory background pollers from persisting success
  observations for empty cycles while preserving their execution cadence,
  all real-work telemetry, all failures, and a sparse bounded heartbeat.
  Reduce the known idle-only observation rate by more than ninety-nine percent
  without weakening service health or changing product boundaries.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - Empty successful polls are execution details and do not produce per-cycle metrics or spans.
    - Non-empty work and every failure or retry retain their existing observable identities and dimensions.
    - Database heartbeat and lease operations keep their existing cadence while successful heartbeat telemetry is emitted no more often than once every thirty seconds per process.
    - No scheduler worker approval reminder evaluation or delivery cadence changes are authorized.
    - Existing stored observations are not deleted by this work item.
    - Core continues to export asynchronously to Observatory and never reads from or waits for Observatory.
  contracts: []
feature_references: [OBS-005, OBS-009]
ownership_zones:
