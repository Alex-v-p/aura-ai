observability:
  applicable: true
  affected_components:
    - aura.automation.reminder_scheduler
    - aura.governance.approval_workflow
    - aura.observatory.evaluation_scheduler
    - aura.observatory.evaluation_orchestration
  required_metrics: []
  required_evaluators:
