  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - An empty reminder scan emits no reminder_fired_count zero sample and no successful reminder.scan span while a non-empty scan and every failure retain their existing telemetry.
  - An empty SQL reminder delivery transaction emits no fired persistence success, zero occurrence metrics, fired count, or reminder.fire span while duplicates, actual delivery work, and failures remain observable.
  - An approval-expiry poll with no expired approvals emits no empty outcome and no successful approval.expire span while actual expiry transitions resume outcomes and failures remain observable.
  - Empty evaluation schedule materialization recovery dispatch local-claim enqueue and outbox publication cycles emit no success observation or success dependency counter.
  - Scheduler and worker database heartbeat operations continue every configured poll while successful heartbeat telemetry is emitted at most once per thirty-second window and failures are emitted immediately.
  - Poll intervals locking leases retries delivery behavior and service readiness are unchanged.
  - Deterministic tests cover empty non-empty failure and sparse-heartbeat boundaries without sleeping on wall-clock time.
  - A restarted idle local stack shows at least a ninety-nine-percent reduction for the four targeted idle producers compared with the measured 28800 observations per hour subtotal.
  - Aura Web and Observatory Web behavior contracts remain unchanged and Core remains independent of Observatory health.
