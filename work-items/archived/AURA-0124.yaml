    - approval_expiry_correctness
    - evaluation_orchestration_retry_recovery
    - evaluation_orchestration_lease_exclusivity
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - No request content evidence credentials owner identity or new dimensions enter telemetry.
    - Failure visibility and meaningful state transitions must not be suppressed.
    - Core and Observatory data ownership and one-way provider direction remain unchanged.
  data_classes:
