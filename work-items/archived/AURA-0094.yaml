open_decisions:
  - The accepted provider-unavailable limitation may be revisited by a later deployment work item, but AURA-0094 does not authorize changing the current fail-closed trust boundary.
  - AURA-0095 owns owner-facing judge definition calibration review qualification artifact and progress REST CLI SSE and browser workflows plus transport-only generated clients.
  - AURA-0096 owns experiment cohorts immutable baselines regression decisions attribution and explicit baseline promotion; protected repository baselines remain unchanged.
  - AURA-0097 owns dashboard alert annotation and incident behavior and external delivery remains deferred.
  - AURA-0098 owns full-stack real-model browser acceptance and individual Ollama Garage database broker and Collector outage matrices.
