acceptance_criteria:
  - Evaluation-v1 gains backward-compatible closed resources for immutable local judge definition rubric prompt calibration label human review ensemble calibration result and qualification metadata with exact versions digests opaque artifact references bounded budgets finite labels and no raw content arbitrary attributes endpoints credentials or owner identity.
  - Judge inventory has no implicit or tag-only entries; every executable definition names local_ollama exact model version and SHA-256 digest exact prompt rubric calibration versions seed fixed zero temperature and bounded timeout token byte context and concurrency limits.
  - A forward-only idempotent PostgreSQL migration from empty and upgraded schemas creates normalized judge prompt rubric calibration label human review ensemble qualification disagreement and content-free audit state without altering migrations 0001 through 0009 or reading Core tables.
  - Any required ClickHouse migration is forward-only after 0006 and adds only bounded advisory calibration and ensemble provenance fields to Observatory-owned score storage without content or provider configuration.
  - An authorized artifact-read port and adapter derives object locations internally verifies authorization availability revocation dataset purpose context classification digest media type and exact byte bounds streams bounded bytes and never accepts a caller path bucket endpoint or object key.
  - Compose and Garage bootstrap provide a separate file-injected read-only judge credential limited to the existing evaluation bucket; the write identity remains unchanged and unrelated services cannot read judge artifacts or join the private Ollama network.
  - The local Ollama adapter verifies the exact model digest invokes one configured private origin without redirects or proxies tools or streaming uses fixed structured output and bounded zero-temperature seed options and maps timeout unavailable malformed oversized drift and resource failures to finite content-free codes.
  - A closed judge request loads only explicitly authorized input prompt and rubric artifacts treats all text as data rejects prompt injection as configuration and discards provider rationale or echoed content before returning a finite typed score.
  - Duplicate judge requests with the same immutable definition case artifact digests and idempotency identity return or persist the same result while conflicting reuse fails closed and concurrent execution cannot duplicate score or qualification state.
  - Calibration stores owner-labelled finite reference scores and labels plus opaque optional comment artifacts and computes deterministic sample count agreement mean absolute error disagreement and bounded intervals for exact judge rubric prompt model and calibration versions.
  - At least 20 valid labels agreement at least 0.80 within 0.10 mean absolute error at most 0.15 and disagreement at most 0.20 are required for eligibility; missing labels incompatible versions ambiguous evidence and drift fail closed and remain advisory.
  - Passing calibration never enables gating automatically. Only an explicit owner-authorized idempotent manual qualification for the exact suite dataset evaluator model prompt rubric and calibration versions marks future scores calibrated-enabled; revocation returns them to advisory without deleting audit history.
  - Human reviews are immutable idempotent versioned finite score and label records with opaque review and comment-artifact identities and explicit disagreement classifications and never persist reviewer identity session data or raw comments.
  - Closed deterministic ensembles validate exact member provenance normalized finite weights and missing inconclusive or advisory members and remain advisory unless every required judge member is calibrated-enabled for the exact suite versions.
  - Judge scores persist content-free evaluator model prompt rubric calibration seed budget advisory qualification uncertainty disagreement and reproducibility metadata through existing score ports while artifacts and provider output remain outside PostgreSQL ClickHouse telemetry and transport.
  - Local judge and calibration components emit bounded invocation duration outcome provider-failure disagreement review and qualification measurements plus dependency spans with finite labels and no high-cardinality definition case job artifact digest model endpoint or content values.
  - Ollama Garage PostgreSQL and ClickHouse timeout unavailability malformed response oversized output digest drift revoked artifact duplicate review concurrent qualification and restart paths fail safely without affecting Core normal activity Observatory telemetry ingestion API readiness or deterministic evaluators.
  - Contract unit property migration concurrency provider privacy artifact-read calibration disagreement ensemble observability topology and project-scoped Docker Desktop tests cover positive negative boundary and recovery behavior; existing AURA-0090 through AURA-0093 suites remain passing.
  - No public API CLI SSE browser cloud judge external content egress new deployable service Core change dependency upgrade protected golden result or repository baseline change is introduced.
