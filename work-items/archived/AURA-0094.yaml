id: AURA-0094
title: Add local judges and calibrated human review
status: integrated
change_class: repository_governance
intent: >
  Add Observatory-owned, local-only model judging with immutable versioned
  definitions, bounded artifact-backed prompts and rubrics, deterministic
  execution, owner-labelled calibration, disagreement and human-review
  metadata, and explicit advisory qualification without allowing evaluation
  content to escape or uncalibrated scores to gate decisions.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/overview.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/open-decisions.md
    - docs/specifications/aura-ai-envisioned-feature-catalogue.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - The accepted architecture already assigns model-assisted evaluators calibration and human review to Observatory and authorizes local Ollama behind a narrow provider port plus Garage PostgreSQL and ClickHouse service-owned state; no new deployable product protocol or ADR is required.
    - There are no implicit built-in judge models and no tag-only latest fallback. The judge inventory consists solely of immutable explicitly admitted local_ollama definitions with an exact model name version and SHA-256 model digest verified at execution.
    - Cloud judges external model endpoints redirects and content egress are prohibited. The provider adapter accepts only the configured private Ollama origin and cannot select a caller-provided URL credential model endpoint or network destination.
    - Rubric prompt calibration-label and optional human-comment content is authorized untrusted evaluation content stored only in the existing Observatory Garage bucket. PostgreSQL stores opaque artifact UUIDs digests sizes versions finite labels and authorization metadata; ClickHouse stores only bounded content-free scores.
    - The Observatory evaluation worker may read authorized judge artifacts through a separate file-injected read-only Garage identity. The existing write identity is not broadened and no API Web Core Collector or normal worker receives the judge-read credential.
    - Judge requests are ephemeral bounded structured operations. Inputs prompts and rubrics are loaded by opaque reference verified by digest classification authorization and byte limit then discarded; responses must match a closed score schema and free-form rationale is discarded before persistence telemetry or errors.
    - Local judge execution is deterministic by exact model digest prompt version rubric version calibration version seed zero temperature and bounded options. A changed digest prompt rubric calibration or budget creates a new immutable version rather than mutating a definition.
    - Initial judge outputs use a 0 through 1 finite score and finite pass fail inconclusive outcome with closed label identities. Timeout is at most 120 seconds output is at most 8192 bytes output tokens are at most 2048 input artifacts are at most 1048576 bytes and per-process judge concurrency defaults to one and cannot exceed two.
    - Calibration requires at least 20 owner-labelled cases agreement within 0.10 on at least 80 percent of cases mean absolute error at most 0.15 and disagreement rate at most 0.20. These thresholds are versioned service-owned defaults and cannot be widened by an artifact or provider response.
    - Judge scores are advisory by default. Passing calibration does not enable gating automatically; an explicit idempotent owner-authorized manual qualification record for the exact suite evaluator model prompt rubric and calibration versions is required. Baseline promotion remains separately manual under AURA-0096.
    - Human review persists opaque review identity case and result references finite label and score disagreement classification rubric/calibration versions timestamps and optional authorized comment-artifact reference. Owner identity session data and raw comments never enter portable evaluation records.
    - Ensembles are closed deterministic weighted combinations of admitted deterministic or calibrated local-judge scores with finite normalized weights and complete member provenance. Any uncalibrated missing incompatible or inconclusive member makes the ensemble advisory and cannot silently pass.
    - This item adds no REST OpenAPI CLI SSE Angular browser baseline experiment alert external delivery cloud provider or production telemetry content capture. AURA-0095 owns public workflows and AURA-0096 owns experiments and baselines.
    - Independent review authorizes the smallest existing evaluation-worker orchestration and entrypoint changes needed to execute admitted local-judge and calibration work durably. This does not add a deployable service public protocol Core dependency or normal-readiness dependency and requires no ADR.
    - Evaluation-v1 is the authoritative shape for every judge calibration review qualification revocation ensemble and score record. Python models PostgreSQL columns and provider mappings must preserve every required field enum version idempotency authorization and integer-ppm weight losslessly.
    - >-
      Owner decision 2026-10-21: the worker egress network remains internal
      and fail-closed even though Docker Desktop cannot currently route it to
      host.docker.internal. Local judge execution may therefore report provider
      unavailable in this checkpoint; this is an accepted availability
      limitation, not a security or release blocker. No proxy sidecar
      host-network mode privileged capability or general egress is authorized.
      Real provider reachability remains deferred to a later explicitly
      governed deployment decision and AURA-0098 acceptance.
    - Material implementation choices use the repository-pinned dependencies and current official Ollama API Docker Compose PostgreSQL ClickHouse Garage and OWASP guidance, recorded in handoffs; dependency upgrades are not authorized.
