  capture_policy: authorized_evaluation_content
security_privacy:
  applicable: true
  concerns:
    - Judge model prompt rubric calibration label comment and case content is authorized untrusted evaluation content and cannot select URLs credentials files paths buckets subjects imports tools permissions provider options or execution authority.
    - The provider is local Ollama only at one configured private origin with no redirects proxies cloud fallback or caller-controlled destination and its endpoint is never persisted emitted or returned.
    - Every model invocation verifies exact model name and SHA-256 digest against the immutable definition before loading artifacts or sending content and fails closed on missing drifted or ambiguous inventory.
    - Prompt rubric input expected output and optional review comment bytes are fetched only by internally derived opaque UUID references through a read-only judge identity after authorization classification purpose dataset digest size media and revocation checks.
    - The current Observatory artifact write identity remains write-only and no API Web Core Collector scheduler or unrelated worker receives the judge-read secret or model network attachment.
    - Provider requests enforce fixed system structure zero temperature exact seed no tools no streaming bounded context/output tokens bytes and timeout and treat artifact text solely as quoted data rather than instructions or configuration.
    - Provider responses must be one closed JSON object with finite score outcome and label fields; free-form rationale unknown fields oversized data NaN infinity control characters and content echoes are rejected and discarded.
    - PostgreSQL contains only immutable definitions opaque references hashes versions seeds budgets finite labels calibration aggregates qualification and audit metadata; ClickHouse scores remain content-free; Garage is the only content-bearing store.
    - Logs metrics traces errors NATS SSE URLs screenshots reports and browser storage never include artifact bytes prompt rubric response rationale comment model endpoint object location filename owner identity credential or exception text.
    - Human review uses opaque review identities finite labels and optional authorized comment-artifact references and cannot persist reviewer identity session data or raw comments.
    - Calibration and ensemble computations are deterministic bounded idempotent and concurrency-safe and missing incompatible uncalibrated or contradictory evidence never upgrades a score or enables gating.
    - Qualification is explicit owner-authorized exact-version state with idempotency audit and revocation and cannot promote a repository baseline or alter protected golden results.
  data_classes:
    - local_judge_definition_metadata
    - authorized_evaluation_content
    - calibration_label_metadata
    - human_review_metadata
    - judge_score_metadata
    - calibration_qualification_metadata
