acceptance_criteria:
  - The backward-compatible Aura API exposes one owner-authenticated no-store briefing capability query with the canonical supported execution policy UUID textual revision deadline token and character budgets and explicit memory-disabled tool-disabled daily-only flags; the generated Aura client is regenerated and remains transport-only.
  - Capability discovery is served through the public briefing application boundary and exactly matches the canonical fixed Core execution policy without duplicating or hard-coding provider model prompt tool or owner state; contract and Core tests fail on drift.
  - A registered automation-briefings frontend feature library consumes only the generated Aura client plus deliberate public agent calendar document and session surfaces and never imports Core internals provider code memory Observatory or governed run evidence.
  - Aura Web adds /briefings /briefings/new /briefings/:id and /briefings/:id/occurrences/:occurrenceId under Automate while retaining every existing route mobile navigation focus trap theme reduced-motion and responsive behavior.
  - Creation supports a bounded display name one daily local time explicit validated IANA timezone active agent revision reminders required selected currently authorized calendars and explicitly selected ready documents; it uses capability metadata for the canonical execution policy and active revision prompt model and zero-call tool references.
  - Creation preserves valid fields and unsaved selection in memory after validation version authorization offline reconnect and server failures; accepted creation and explicit discard clear the draft and private state never enters storage URLs logs or caches.
  - Schedule list and detail expose status cadence timezone source counts next occurrence and bounded history without private source content in compact rows; active schedules can pause and paused schedules can resume using authoritative versions and stale-version recovery.
  - Schedule deletion names schedule-only scope explains that retained history/results remain and that admitted work may be canceled and requires focused confirmation. No unsupported edit occurrence-cancel or retry control is shown.
  - Occurrence detail distinguishes scheduled admitted running completed partial failed canceled skipped and unknown with non-color text and icons, exposes truthful source completeness and lineage metadata, and fetches result content only when an opaque result identifier is present.
  - Manual history deletion and result-content deletion are separate explicit confirmations with their exact scopes. Deleted result content is not reconstructed and schedule deletion never implies history deletion.
  - Briefing notification actions deep-link by opaque schedule and occurrence IDs to the canonical authenticated occurrence route while notification and Today cards remain content-free and never place result IDs or output in URLs.
  - Loading empty partial stale-version permission-denied offline reconnecting unknown-outcome and deleted-content states preserve available metadata and offer only safe recovery actions with restrained live announcements and stable focus.
  - Unit Storybook and Playwright coverage verifies desktop tablet mobile keyboard-only touch targets light and dark themes reduced motion 200 percent reflow deep links stale versions session reset draft preservation private-content containment and bounded request behavior.
  - No migration event contract provider deployment dependency service-worker runtime telemetry memory Observatory protected baseline or durable browser-storage change occurs.
