security_privacy:
  applicable: true
  concerns:
    - Briefing definitions source grants occurrence lineage result content agent and policy references document and calendar labels and owner identity must not enter URLs compact notifications Today cards browser persistence service-worker caches logs telemetry Storybook snapshots committed to the repository or Observatory.
    - The capability query exposes only the fixed Aura-owned policy identity revision and bounded public limits. It must not expose configured providers models prompts tools grants credentials owner metadata or execution internals.
    - Mutations use the existing owner session origin-aware CSRF UUID idempotency optimistic schedule version and explicit focused confirmation. Unknown outcomes do not offer unsafe retry.
    - Draft fields survive validation reconnect and server failure only in authenticated in-memory state and are cleared on accepted creation logout owner-session replacement permission loss or explicit discard.
    - Calendar and document choices come only from their public owner-authorized stores. Disconnected revoked incomplete and paginated source state fails closed and cannot be widened by the browser.
    - Result content is fetched only on the authenticated occurrence detail route with no-store behavior and is cleared on route teardown session reset authorization failure owner change or explicit content deletion.
    - Aura Web must not import display link or communicate with Observatory or governed run evidence.
  data_classes:
    - public bounded briefing capability metadata
    - owner-private briefing schedules source grants and policy references
    - owner-private occurrence and run lineage metadata
    - owner-private durable briefing result content
    - metadata-only private briefing notification links
