    - docs/design/sidebar-and-management-surfaces.md
    - docs/specifications/tools-automation-and-integrations.md
    - docs/specifications/clients-and-voice.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - docs/adr/0017-governed-production-run-evidence.md
    - work-items/archived/AURA-0132.yaml
    - work-items/archived/AURA-0133.yaml
    - The owner authorized implementation of all four initiative stages; AURA-0134 completes the Aura Web portion of Stage 3 before the separate Stage 4 decision gate.
    - The owner-selected initial briefing product uses calendar events reminders and explicitly selected documents, excludes memory, runs once daily in an explicit IANA timezone, delivers a private notification link to a durable result, and retains history until explicit deletion.
    - Aura Web must discover the one supported briefing execution policy and its fixed budgets from an additive owner-authenticated Core capability resource. The browser may not hard-code the internal policy UUID, infer provider or model configuration, or receive private runtime state.
    - The capability resource is metadata-only and returns the canonical execution policy identifier revision and fixed public limits needed to construct the existing create request; it exposes no owner identity source data provider name model name prompt content tool grants or governed run evidence.
    - The existing create pause resume schedule-delete occurrence-history-delete and result-content-delete contract remains authoritative. No schedule edit occurrence-cancel retry or automatic retention behavior is added.
    - One briefing feature library owns generated-client adaptation in-memory state creation draft behavior schedule/history/result presentation and mutation recovery. The shell owns only routes navigation and provider composition.
    - Notification and Today compact surfaces remain content-free. A briefing notification deep-links by its opaque schedule and occurrence identifiers to the authenticated canonical occurrence route; result identifiers and output never enter URLs compact cards router state browser storage or service-worker caches.
