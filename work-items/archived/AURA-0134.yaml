id: AURA-0134
title: Add Aura Web scheduled briefing management
status: integrated
change_class: repository_governance
intent: >
  Complete the scheduled-briefing product slice in Aura Web with safe creation,
  schedule management, manually retained history, private result inspection,
  and notification deep links, while adding only the narrow additive Core
  capability discovery required to avoid hard-coding an internal execution
  policy identifier in the browser.
