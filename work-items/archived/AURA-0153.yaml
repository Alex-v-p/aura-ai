contracts:
  changes_allowed: false
  affected:
    - Existing generated Aura v1 Message research-reference and DurableTaskDetail capability transports consumed without hand editing
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - >-
      Web citations are untrusted transport data at the browser boundary.
      Render only bounded validated public HTTPS citations or the fixed
      content-free deleted-source tombstone; reject unsafe schemes, userinfo,
      malformed identifiers, duplicates, surplus entries, and unexpected
      fields from presentation state.
    - >-
      Task and artifact references remain bounded opaque internal references.
      They may form existing same-origin route paths only and must never carry
      titles, object keys, digests, questions, excerpts, or other private
      values into a URL.
    - >-
      Research questions, citation labels and URLs, artifact titles and
      content, recovery copy inputs, and source display labels remain in
      authorized in-memory DOM state only. Tests must scan both keys and values
      of localStorage and sessionStorage plus the current URL path, query, and
      fragment for seeded private canaries after navigation, mutation,
      reconnect, logout, and account/session loss.
    - >-
      Recovery explanations and support references must not expose trace IDs,
      stack or exception text, internal endpoints, credentials, provider
      diagnostics, evidence identifiers, object keys, or retained content.
    - >-
      Source navigation is capability-gated and fail-closed. The client must
      not fabricate parent identifiers, reuse a task URL as a source link, or
      expose a source action when exact direct detail is not advertised and
      constructible.
  data_classes:
    - owner-private research completion text web citations task references and artifact references
    - owner-private research and artifact lifecycle recovery state
    - owner-private task presentation source identity and recovery metadata
    - ephemeral browser-only test canaries for persistence and URL scans
required_agents:
  implementation:
    - core_worker
    - frontend_worker
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
    - aura_ux_ui_reviewer
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 6
  max_parallel_writers: 2
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - >-
    Conversation hydration preserves bounded generated Message.webCitations,
    Message.taskRefs, and Message.artifactRefs across initial REST detail,
    authoritative snapshots, and reconnect refresh without affecting legacy
    document citations, attachments, research activity, turn ordering, or
    duplicate-message behavior.
  - >-
    A terminal research answer visibly renders validated public-HTTPS source
    citations with safe external-link semantics, content-free deleted-source
    tombstones without links, same-origin task links, and direct report
    artifact links. Malformed, unsafe, duplicate, cross-shape, and over-limit
    references are discarded before template rendering, and accessible names
    distinguish web sources, deleted sources, tasks, and artifacts.
  - >-
    Active research detail uses distinct plain-language explanations for
    partial, budget_exhausted, interrupted, and failed provider_disabled or
    provider_unavailable outcomes. Each names what completed, what remains or
    stopped, available source/artifact evidence, and the truthful next action;
    none is labeled complete and retry always means starting new research.
  - >-
    Research and artifact deletion_pending, deletion_failed, cleanup_unknown,
    and deleted detail states have state-specific impact and recovery copy
    plus a sanitized stable support reference derived only from the opaque
    resource ID and version. deletion_failed offers only the advertised
    idempotent Retry cleanup action, cleanup_unknown offers only the advertised
    reconciliation/refresh action, and bytes, preview, download, or blind
    repeat deletion never reappear.
  - >-
    Component and real-browser tests activate Retry cleanup and Reconcile
    cleanup for both research and artifacts, assert exactly one owning API
    command with current expected version and idempotency behavior, then prove
    authoritative response text, focus, live-region announcement, disabled
    state while saving, and no impossible or repeated action.
  - >-
    Core source projection adapters explicitly retain direct detail capability
    for constructible research and document sources and advertise
    hasSourceDetail false for workflow instances, briefing occurrences, and
    memory reindexing until sufficient route identity exists. Focused source
    and API tests prove the serialized capability for every source kind.
  - >-
    Task Center displays Open source only when hasSourceDetail is true and the
    closed route-key map can construct the exact supported route:
    research_detail to /research/:sourceId and document_detail to
    /documents/:sourceId. False or inconsistent workflow, briefing, memory,
    unknown, or mismatched capability/route combinations render a truthful
    no-direct-detail explanation and never navigate to /tasks/:taskId,
    fabricate identifiers, or expose a misleading link.
  - >-
    Browser acceptance seeds unique private question, citation, artifact,
    source-label, URL-query, and content canaries and proves none appears in
    any localStorage or sessionStorage key/value or in location pathname,
    search, or hash after conversation hydration, detail navigation, cleanup
    retry/reconciliation, reconnect, logout, and session-loss handling.
  - >-
    Substantive accessibility acceptance uses keyboard-only activation for
    citation, artifact, task, Retry cleanup, Reconcile cleanup, dialog Escape,
    and back navigation; verifies focus return or state-heading focus and
    throttled polite/assertive live-region copy; runs axe without rule
    suppression; exercises forced-colors and reduced motion; and at 200 percent
    zoom proves no page-level horizontal overflow or loss of primary recovery
    actions on desktop, tablet, and mobile projects.
  - >-
    Generated-client synchronization, Core source tests, frontend lint/unit,
    Aura Web production build, focused Playwright acceptance, architecture
    validators, and diff hygiene pass with no contract, migration, dependency,
    lockfile, route-shell, Observatory, provider, AURA-0148 evaluation,
    protected baseline, screenshot, trace, video, or private artifact change.
