id: AURA-0153
title: Complete governed research presentation and recovery UX
status: integrated
change_class: bugfix
intent: >
  Restore the generated research references that are already present in
  conversation messages, make research and artifact recovery states truthful
  and actionable, and make Task Center source navigation capability-gated and
  route-correct, with substantive privacy and accessibility acceptance.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/design/governed-research-artifacts-and-tasks.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/components-and-interactions.md
    - docs/design/foundations.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - docs/adr/0018-governed-web-research-providers.md
    - work-items/archived/AURA-0141.yaml
    - work-items/archived/AURA-0143.yaml
    - work-items/archived/AURA-0146.yaml
    - work-items/archived/AURA-0147.yaml
    - work-items/active/AURA-0148.yaml
    - >-
      The generated Aura v1 Message transport already carries webCitations,
      taskRefs, and artifactRefs. Aura Web must consume those generated types
      through the conversations feature and must not edit or duplicate the
      generated client or public contract.
    - >-
      Research and document source detail routes are constructible from the
      existing route key and opaque source ID. Workflow instances and briefing
      occurrences require parent identifiers that DurableTaskDetail does not
      expose, and memory reindexing has no source-specific detail route.
      Their public source projection adapters must therefore advertise
      hasSourceDetail false until a separately authorized additive contract
      can carry sufficient route identity. Aura Web must fail closed when a
      route key and capability are inconsistent rather than loop back to the
      current task or invent identifiers.
    - >-
      State-specific recovery support references are presentation-only values
      derived from the already authorized opaque resource ID and version.
      They must not include trace IDs, exception text, internal URLs,
      provider diagnostics, private content, or persistence.
    - >-
      AURA-0148 aggregate validation files are concurrent work and must not be
      edited. The shared Aura Web Playwright configuration may change only by
      adding the AURA-0153 browser spec to test discovery while preserving all
      existing matches, server settings, projects, reporters, artifacts,
      timeouts, and worker behavior.
    - >-
      This correction implements behavior already required by the accepted
      governed-research design and existing additive contracts. It adds no
      deployable, dependency, package, protocol, persistence field, route
      authority, or architectural exception, so no new ADR is required.
  contracts:
    - contracts/openapi/aura-v1.yaml
