id: AURA-0014
title: Authorize conversation foundation ownership paths
status: integrated
change_class: repository_governance
intent: >
  Authorize narrowly scoped ownership for the root Python workspace,
  deployment environment template, and generated Aura API client so the
  approved Ollama-backed conversation vertical can be delivered through the
  repository's existing role and changed-path enforcement.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications: []
  decisions:
    - User-approved Ollama-backed conversation implementation plan
    - Generated clients remain contract-owned transport code
    - Root workspace and environment files remain platform-owned
  contracts: []
feature_references: []
ownership_zones:
  - repository.governance
allowed_paths:
  - work-items/active/AURA-0014.yaml
  - work-items/archived/AURA-0014.yaml
  - tooling/architecture/path-ownership.yaml
  - tooling/architecture/tests/**
forbidden_paths:
  - AGENTS.md
  - .agents/**
  - .codex/**
  - .github/**
  - docs/**
  - contracts/**
  - services/**
  - frontend/**
  - packages/**
  - evaluations/**
  - deploy/**
  - infra/**
  - satellites/**
  - extensions/**
  - scripts/**
  - compose.yaml
  - pyproject.toml
  - uv.lock
  - .python-version
  - .env.example
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - Ownership changes must remain path-specific and must not broaden product write authority
    - Secret-bearing environment files remain prohibited from source control
  data_classes:
    - repository ownership metadata
required_agents:
  implementation:
    - platform_worker
  review:
    - general_reviewer
    - architecture_guardian
  integration: false
execution:
  parallelism_class: local
  max_parallel_agents: 1
  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: false
  escalation_reason_required: true
acceptance_criteria:
  - Root pyproject.toml, uv.lock, .python-version, and .env.example paths have explicit platform ownership.
  - The generated frontend Aura API client path has explicit contract_steward ownership without granting contract ownership over other frontend paths.
  - Existing ownership entries and all product, contract, deployment, documentation, and protected baseline files remain unchanged.
  - Architecture enforcement tests cover the new most-specific ownership entries.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0014.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0014.yaml
  - python3 -m unittest discover -s tooling/architecture/tests -v
  - python3 tooling/architecture/validate-repository-shape.py
  - git diff --check
baseline_changes_allowed: false
human_approval_required: true
open_decisions: []
