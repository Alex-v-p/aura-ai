acceptance_criteria:
  - >-
    AuraShellComponent remains the only main landmark on /research /tasks and
    /artifacts, and each route template uses a non-main outer container with its
    existing research-page tasks-page or artifacts-page class and existing
    aria-labelledby relationship.
  - >-
    The visible Research Task Center and Artifacts heading labels and levels are
    unchanged, and no class style selector focus behavior route behavior state
    behavior or product copy changes.
  - >-
    Focused component regressions prove that none of the three route templates
    renders a main element and that each retains its page class and heading
    association.
  - >-
    A dedicated real-browser test loads /research /tasks and /artifacts through
    the Aura shell, asserts exactly one document main landmark on every route,
    and runs AxeBuilder against the complete page with its default rule set and
    no include exclude disableRules or withRules restriction; every route has
    zero axe violations.
  - >-
    The shared Aura Web Playwright config changes only by adding
    aura0151-landmarks.spec.ts to testMatch discovery; its server projects
    workers reporters timeouts artifacts and existing test matches remain
    unchanged.
  - >-
    The three affected feature-library lint and unit suites and the Aura Web
    production build pass without changes to dependencies generated clients
    contracts backend deploy files other AURA-0148 files or protected
    baselines.
