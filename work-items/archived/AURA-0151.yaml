id: AURA-0151
title: Restore single main landmarks on governed research routes
status: integrated
change_class: bugfix
intent: >
  Remove nested main landmarks from the Research, Task Center, and Artifacts
  route templates so the Aura shell remains the one document main landmark,
  while preserving each route's styling, accessible heading relationship,
  labels, and product behavior.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/design/foundations.md
    - docs/design/components-and-interactions.md
    - docs/design/governed-research-artifacts-and-tasks.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - work-items/archived/AURA-0147.yaml
    - work-items/active/AURA-0148.yaml
    - >-
      AuraShellComponent already owns the document main landmark through
      main#main-content. ResearchPageComponent TasksPageComponent and
      ArtifactsPageComponent currently render another main as their outer route
      container, producing invalid nested main landmarks when composed by the
      shell.
    - >-
      This is a local semantic accessibility correction inside existing Aura
      feature libraries. Replacing only the three route-container elements with
      non-main semantic containers does not change a repository boundary,
      contract, route, deployable, dependency, or architectural decision, so no
      new ADR is required.
    - >-
      AURA-0148 accessibility and aggregate files are concurrent validation
      work and must not be edited by AURA-0151, except for the minimal additive
      testMatch alternative in the shared Aura Web Playwright config required
      to discover aura0151-landmarks.spec.ts. AURA-0151 supplies its own
      narrowly scoped full-page landmark and axe compatibility test; no other
      Playwright configuration behavior may change.
  contracts: []
