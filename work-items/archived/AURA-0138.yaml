id: AURA-0138
title: Build the Aura Web Workflow Studio
status: integrated
change_class: repository_governance
intent: >
  Add an accessible, responsive Aura Web studio for authoring, publishing,
  starting, monitoring, recovering, canceling, retiring, and explicitly deleting
  bounded manual workflows while preserving REST authority, metadata-only live
  invalidation, immutable revision semantics, and browser privacy boundaries.
