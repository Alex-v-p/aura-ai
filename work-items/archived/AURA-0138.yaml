security_privacy:
  applicable: true
  concerns:
    - Workflow definitions mappings inputs outputs results approval presentation and notification content remain in memory only and never enter URL query fragments browser persistence service-worker caches telemetry logs SSE screenshots or diagnostics.
    - Mutations use the generated same-origin API with credentials CSRF optimistic versions and stable Idempotency-Key retention across unknown outcomes; no bearer token or handwritten transport DTO is introduced.
    - Metadata-only SSE is never treated as workflow truth and cannot contain owner identity or workflow content; every invalidation is followed by an owner-authorized REST read.
    - Session reset disconnects streams and clears all workflow draft instance result history and recovery state from memory.
    - Seven deletion scopes remain explicit non-cascading independently confirmed and accurately represented before destructive submission.
    - Approval and notification links use only contract-provided opaque lineage and never fabricate or expose workflow content.
  data_classes:
    - owner-private in-memory workflow definitions mappings inputs outputs results checkpoints and history
    - owner-private approval and notification presentation
    - metadata-only opaque workflow revision instance step and lifecycle identifiers
