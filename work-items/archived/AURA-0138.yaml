acceptance_criteria:
  - Aura Web exposes /workflows, /workflows/new, /workflows/:id, and /workflows/:id/instances/:instanceId plus an Automate to Workflows navigation entry without changing other product boundaries.
  - The authoring experience supports one through eight ordered typed steps for agent run approval notification and wait-until only; add move clone remove and mapping changes revalidate immediately and preserve invalid drafts in memory.
  - Validation and immutable publication present precise field and step errors; feature-disabled publish or start is a controlled unavailable state that leaves drafts and existing workflow management usable.
  - Manual start uses bounded typed instance inputs and stable idempotency; unknown mutation outcomes retain the command key and reconcile by REST before offering a safe retry.
  - Definition revision and instance views show authoritative lifecycle progress step history effect outcome checkpoints recovery capability and terminal result without conflating workflow status with effect certainty.
  - Exact approval handoff cancellation replay settlement reconciliation retirement and seven deletion scopes are owner-confirmed version-aware and preserve usable stale state during failures.
  - Metadata-only workflow SSE supports persisted Last-Event-ID reconnect bounded invalidation and unknown or expired cursor recovery; it never replaces authoritative REST state or carries workflow content.
  - Compatible workflow approval and notification surfaces expose opaque workflow-instance deep links without importing workflow implementation code or changing Today and daily-action behavior.
  - Workflow state streams and unsaved content are cleared on session reset and never enter URL state localStorage sessionStorage IndexedDB service-worker caches telemetry logs or Storybook snapshots.
  - Loading empty unavailable stale reconnect validation conflict unknown-outcome permission not-found terminal and partial-recovery states remain actionable and truthful.
  - Keyboard-only operation visible focus semantic headings status announcements focus management contrast reduced motion 200-percent zoom and mobile tablet desktop layouts meet existing Aura Web accessibility conventions.
  - No schedule branch loop parallel arbitrary expression executor framework Core change Observatory dependency or per-instance cross-service projection is introduced.
