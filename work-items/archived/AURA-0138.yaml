    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - docs/adr/0017-governed-production-run-evidence.md
    - work-items/archived/AURA-0137.yaml
    - The studio consumes the generated Aura v1 client and does not alter Core contracts, persistence, execution, lifecycle events, or admission policy.
    - Unsaved workflow definitions and mappings remain Angular in-memory state only and are excluded from URLs, browser persistence, service-worker caches, telemetry, logs, screenshots, and SSE.
    - Metadata-only SSE invalidates local projections and always reconciles through authoritative bounded REST reads; stale usable state remains visible through reconnects and unknown outcomes.
    - Approval and notification deep links contain only opaque workflow and instance identifiers and do not introduce feature-library dependency cycles.
    - This work item adds no schedule, branch, loop, parallel, arbitrary-expression, executor, or Observatory behavior.
