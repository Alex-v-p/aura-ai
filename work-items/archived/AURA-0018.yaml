contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - HTTP and insecure cookies are enabled only by the explicit local-http override
    - Aura Web and Authentik Server remain loopback-only and no LAN-facing port is introduced
    - Only Authentik Server joins its dedicated non-internal edge network
    - Core, PostgreSQL, NATS, Valkey, Authentik PostgreSQL, and Authentik Valkey publish no host ports
    - Owner passwords, subjects, client secrets, and runtime state remain ignored and uncommitted
    - Bootstrap is idempotent and must not rotate an existing owner password file
    - Production configuration continues to require stable HTTPS origins and Secure cookies
  data_classes:
    - local development credentials
    - immutable local owner subject
required_agents:
  implementation:
    - platform_worker
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
  integration: false
execution:
  parallelism_class: local
  max_parallel_agents: 1
  max_parallel_writers: 1
  model_tier: efficient
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - One documented command starts Aura with the disposable local HTTP Authentik deployment.
  - Aura is reachable at http://aura.localhost:4200 and Authentik at http://authentik.localhost:9000 on the development machine only.
  - Core and the browser discover the exact same http://authentik.localhost:9000/application/o/aura-web/ issuer.
  - The Aura OIDC provider has the exact http://aura.localhost:4200/api/v1/auth/callback redirect after bootstrap, including for an existing Authentik database.
  - A dedicated active aura-owner user is created idempotently with a generated ignored password and stable hashed subject.
  - Repeated startup preserves the owner password file and subject and does not duplicate the owner account.
  - The generated owner subject is supplied through an ignored local environment overlay without modifying or committing .env.
  - The Aura login endpoint redirects to Authentik instead of returning dependency unavailable.
  - Browser login as aura-owner creates an authorized Aura session for the configured issuer and subject.
  - The normal and external identity configurations retain production HTTPS and Secure-cookie behavior.
  - No Core API, database, frontend, generated-client, migration, or public contract changes are introduced.
  - The root README has explicit documentation ownership so changed-path validation fails closed for future edits.
