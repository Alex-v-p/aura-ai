id: AURA-0018
title: Add disposable local HTTP Authentik development login
status: integrated
change_class: repository_governance
intent: >
  Make the optional local Authentik deployment usable on Docker Desktop without
  DNS, TLS, or an external reverse proxy by adding an explicit loopback-only
  HTTP development mode, an idempotent dedicated-owner bootstrap, and a simple
  operator command while preserving all production HTTPS safeguards.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications: []
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - User-approved Local HTTP Authentik Development Login plan
    - The local HTTP issuer and associated Core identity are disposable development state
    - The local owner is a dedicated normal Authentik user named aura-owner by default
    - The local owner is created by an idempotent one-shot bootstrap job
    - Nginx Proxy Manager and LAN-exposed ports are outside this development mode
    - The user-approved root README change requires the missing root documentation ownership entry to be registered
  contracts: []
feature_references: []
ownership_zones:
  - deployment.aura-stack
  - deployment.local-identity
  - repository.governance
allowed_paths:
