  - docker compose -f compose.yaml -f deploy/compose/local-identity.yaml --profile local-identity config --quiet
  - docker compose --env-file .env --env-file .env.local-http -f compose.yaml -f deploy/compose/local-identity.yaml -f deploy/compose/local-http.yaml --profile local-identity config --quiet
  - ./deploy/compose/local-http.sh up
  - ./deploy/compose/local-http.sh verify-idempotency
  - docker compose --env-file .env --env-file .env.local-http -f compose.yaml -f deploy/compose/local-identity.yaml -f deploy/compose/local-http.yaml --profile local-identity port aura-web 8080
  - docker compose --env-file .env --env-file .env.local-http -f compose.yaml -f deploy/compose/local-identity.yaml -f deploy/compose/local-http.yaml --profile local-identity port authentik-server 9000
  - curl --fail --silent --show-error http://aura.localhost:4200/healthz
  - curl --fail --silent --show-error http://authentik.localhost:9000/application/o/aura-web/.well-known/openid-configuration
  - curl --fail --silent --show-error --output /dev/null http://aura.localhost:4200/api/v1/auth/login
  - python3 tooling/architecture/validate-service-isolation.py
  - python3 -m unittest discover -s tooling/architecture/tests -v
  - git diff --check
