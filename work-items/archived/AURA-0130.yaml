security_privacy:
  applicable: true
  concerns:
    - Access refresh and revocation tokens authorization codes state nonce client secrets encryption keys plaintext credentials provider account identity and internal credential references must never enter browser contracts URLs outside the unavoidable fixed callback logs telemetry metrics traces SSE audit metadata prompts tool results exceptions or serialized arbitrary objects.
    - Every lifecycle and selection mutation requires the existing owner session origin-aware CSRF UUID idempotency and optimistic or transactional concurrency controls; reads require the same owner authorization and fail closed outside connected state.
    - OAuth navigation handles attempts callback results and cursors must be high-entropy owner- and session-bound where applicable TTL-bounded atomically single-consumed when contractual and safe under Valkey loss replay prefetch supersession races and callback duplication.
    - Credential encryption must use the approved key ring AES-256-GCM random nonces canonical associated data strict key-version lookup opaque non-serializable plaintext wrappers and zero secret-bearing diagnostic fields.
    - Disconnect must disable reads before attempting revocation and must never report disconnected or delete revocation truth while the provider outcome is uncertain; retry exhaustion deletes local ciphertext and directs the owner to external revocation.
    - Calendar names event titles descriptions attendees locations provider identifiers request ranges timezone values and owner identity are private and prohibited from ordinary telemetry logs audit metadata SSE URLs cursor values durable event storage browser persistence and service-worker caches.
    - Provider event text is untrusted display evidence and cannot become policy instructions prompts memory model-facing tools or authority; normalization must enforce closed schemas string and collection bounds and valid timezone provenance.
    - Google requests must use fixed endpoints least-privilege scope no redirects finite response bytes finite pages bounded retries deadline propagation cancellation and closed Aura-owned error mapping.
    - Error and no-store behavior must exactly implement the closed v1.19.0 calendar response contract and never echo request fields resource identifiers provider diagnostics URLs or private content.
  data_classes:
    - AES-256-GCM encrypted owner OAuth credential and key version
    - short-lived sealed OAuth attempt callback and cursor state
    - owner-private discovered calendar metadata and explicit selection
    - transient owner-private normalized event content
    - content-free connection revocation idempotency audit and observability metadata
