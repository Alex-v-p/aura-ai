acceptance_criteria:
  - Migration 0024 advances from 0023_evaluation_runner and creates only Core-owned owner-scoped connection credential calendar-selection idempotency and bounded revocation-retry state with constraints and indexes; it creates no event-content table and remains forward-only.
  - The calendar domain exposes one provider-neutral public application boundary for connection lifecycle discovery selection on-demand retrieval and conflict queries; it depends only on inward ports and never imports Google API routes or another domain's private persistence.
  - Connection start and reauthorization issue one ten-minute Valkey attempt with independent high-entropy state nonce and same-origin navigation handle bound to owner session and attempt; newer attempts supersede older state and authorization navigation rejects replay prefetch cross-session cross-owner and expired use.
  - The fixed provider callback atomically consumes valid state once exchanges the code without logging or echoing it validates the server-held attempt nonce and exact read-only scope stores only a sealed ten-minute callback result and redirects with no credential provider payload or secret in the Aura-facing location.
  - Completion atomically consumes the exact owner-session-attempt callback result once and commits connection metadata and encrypted credentials; missing duplicate expired superseded or mismatched completion fails closed and produces no partial durable connection.
  - Credentials are encrypted and authenticated with the active AURA-0129 key and owner-and-connection associated data; retained key versions decrypt only and an authorized successful old-key load lazily compare-and-swap rewrites the record under the active key before provider use.
  - Expired or provider-rejected credentials transition to reauthorization_required and disable reads. Confirmed revocation destroys ciphertext and reaches disconnected; uncertain revocation disables reads immediately retries no more than six times within 24 hours and then destroys ciphertext while retaining content-free uncertain audit truth.
  - Discovery returns at most one hundred readable calendars per page with Aura-owned identifiers and bounded private metadata; every new calendar remains unselected and provider identifiers remain server-side.
  - Selection replacement accepts an explicit empty set or at most fifty unique currently discovered readable owner calendars, uses expected-version concurrency and UUID idempotency, and never selects a calendar implicitly.
  - Event queries validate a positive half-open range of at most 31 days an IANA display timezone one to fifty explicitly selected calendars limits cursors timeout and cancellation before provider dispatch; pagination handles are short-lived owner-query-bound and contain no provider state.
  - The Google adapter uses only the fixed AURA-0129 endpoints and scope, follows no redirects, bounds pages and response bytes, retries only safe transient or rate-limited reads, maps malformed partial canceled timeout auth and unavailable results to closed Aura outcomes, and never leaks provider payloads.
  - Timed all-day multi-day DST-gap DST-overlap and cross-timezone events normalize deterministically with explicit provenance and schema bounds; event content is returned on demand and never persisted emitted or captured.
  - Conflict evaluation excludes free and zero-duration adjacency pairs emits each positive-duration pair once in canonical order classifies overlaps contains contained_by and same_interval deterministically and enforces the contract's 200-relationship bound and cursor semantics.
  - Lifecycle commands stage only fixed content-free audit action state and outcome metadata; calendar names event content provider identifiers request values credentials and owner identity do not enter audit telemetry logs traces metrics SSE or exception text.
  - The four component manifests and runtime instrumentation use the approved stable identities versions durations closed outcomes retry classes event-count buckets rate-limit state and connection health with low-cardinality metadata-only dimensions and the named synthetic evaluators.
  - Thin API routes implement all nine v1.19.0 operations plus the internal authorization-navigation and fixed provider-callback endpoints through the shared application service with owner authorization CSRF and idempotency where contracted closed sanitized errors no-store responses and no duplicated domain rules.
  - Focused migration domain crypto provider route security privacy observability and deterministic evaluation tests cover fresh state retries races key rotation owner isolation malformed upstream bounds pagination cancellation timezone edges conflicts redaction and Valkey or provider loss.
  - No OpenAPI generated client event contract frontend deployment Observatory worker scheduler model-facing tool memory write durable event cache protected baseline or unrelated dependency behavior changes occur.
