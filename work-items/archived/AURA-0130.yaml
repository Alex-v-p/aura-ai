id: AURA-0130
title: Implement the Core calendar read foundation
status: integrated
change_class: repository_governance
intent: >
  Implement the owner-scoped Aura Core calendar connection, encrypted Google
  credential lifecycle, explicit readable-calendar selection, bounded on-demand
  event retrieval, timezone normalization, deterministic conflict evaluation,
  thin v1.19.0 API routes, audit, and metadata-only observability without a
  durable event-content cache or frontend behavior.
