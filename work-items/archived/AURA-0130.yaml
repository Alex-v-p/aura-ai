    - This is Stage 2 slice 3 only; it implements the integrated v1.19.0 calendar contract without changing that contract, deployment secret topology, or Aura Web.
    - PostgreSQL owns one owner-scoped connection, encrypted credential record, discovered-calendar metadata, explicit selected-calendar set, idempotency results, revocation retry state, and content-free audit truth; no table, object, outbox event, or other durable store may contain event content.
    - Credential ciphertext may exist only while the connection is connected, reauthorization_required, or revocation_uncertain. Confirmed provider revocation atomically destroys the ciphertext and disconnects the connection. Expiry or provider authentication rejection disables reads and transitions to reauthorization_required without exposing provider detail.
    - An uncertain revocation disables reads before the provider call and retains the sealed credential for at most six total revocation attempts and a maximum 24-hour retry window. The API lifecycle resumes persisted retries while available; exhaustion or deadline expiry destroys the ciphertext, preserves only content-free revocation_uncertain audit truth, and requires owner-side provider revocation before reconnecting.
    - Credentials are encrypted with the AURA-0129 active AES-256-GCM key, a fresh 96-bit nonce, and canonical owner-and-connection associated data. A successful owner-authorized load under a retained decrypt-only key is lazily re-encrypted with the active key and compare-and-swap persisted before provider use; failed authentication, decryption, or ownership checks never rewrite or reveal material.
    - OAuth navigation attempts and callback results are Valkey-only, owner-, session-, and attempt-bound, single-use, superseding, and expire after ten minutes. Callback results contain at most sealed credential material and closed status metadata; Valkey loss is safe and creates no durable content or alternate source of truth.
    - Provider pagination state is held behind short-lived owner-and-normalized-query-bound opaque Valkey cursor handles. Provider page tokens, calendar identifiers, event content, and request values are never exposed through a cursor or retained after its bounded expiry.
    - Newly discovered readable calendars receive Aura-owned UUIDs and selected=false. Selection is replaced atomically with optimistic versioning and rejects undiscovered, unreadable, owner-mismatched, duplicate, or more than fifty calendars.
    - Google HTTP calls use only the fixed AURA-0129 HTTPS endpoints and read-only scope, reject redirects, enforce response-size and schema bounds, honor cancellation and the request deadline, and retry only safe rate-limit or transient reads with bounded backoff. Raw provider payloads and diagnostics never cross the adapter.
    - The direct cryptography runtime dependency may be declared and locked only for the approved AES-256-GCM implementation; no unrelated dependency or lockfile changes are authorized.
    - Implementation uses four disjoint writer assignments. The domain writer owns domains/integrations/connections/calendar plus migration 0024 and mapping registration; the provider writer owns providers/calendars/google_calendar plus the direct crypto dependency and module registry entries; the API writer owns calendar_uow, API route/composition/error wiring, Core access-log privacy, and the telemetry registry; the test and evaluation writer owns only AURA-0130 tests and the four component manifests.
    - Baseline evidence inherited from AURA-0129 records two unrelated Pyright errors in test_aura0125_idle_memory_telemetry.py; this item uses strict targeted Pyright for every changed Python path and does not change or waive that baseline.
