id: AURA-0008
title: Assign ownership for the root Docker Compose entry point
status: integrated
change_class: repository_governance
intent: >
  Assign the repository-root compose.yaml entry point to the deployment
  ownership zone so future platform work can provide a repository-compliant
  Docker Compose developer experience without weakening changed-path checks.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/repository-structure.md
    - docs/architecture/technology-stack.md
  specifications: []
  decisions:
    - User-selected root docker compose up entry point
  contracts: []
feature_references: []
ownership_zones:
  - repository.governance
  - deployment
allowed_paths:
  - tooling/architecture/path-ownership.yaml
  - tooling/architecture/tests/test_common.py
  - work-items/active/AURA-0008.yaml
  - work-items/archived/AURA-0008.yaml
forbidden_paths:
  - compose.yaml
  - frontend/**
  - services/**
  - contracts/**
  - packages/**
  - evaluations/**
  - deploy/**
  - infra/**
  - satellites/**
  - extensions/**
  - scripts/**
  - .github/**
  - .codex/**
  - .agents/**
  - docs/**
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: false
  concerns: []
  data_classes: []
required_agents:
  implementation:
    - platform_worker
  review:
    - general_reviewer
    - architecture_guardian
  integration: false
execution:
  parallelism_class: local
  max_parallel_agents: 1
  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: false
  escalation_reason_required: true
acceptance_criteria:
  - Root compose.yaml is assigned to the platform_worker role and deployment architectural owner.
  - A regression test proves an authorized Platform Worker may change compose.yaml.
  - Existing ownership, critical-path, and unknown-path protections remain effective.
  - No Compose file, product code, deployment artifact, contract, or architecture document is changed.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0008.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0008.yaml
  - python3 -m unittest discover -s tooling/architecture/tests -v
  - python3 tooling/architecture/validate-repository-shape.py
  - git diff --check
baseline_changes_allowed: false
human_approval_required: true
open_decisions: []
