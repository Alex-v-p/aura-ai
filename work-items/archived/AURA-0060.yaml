security_privacy:
  applicable: true
  concerns:
    - Published Agent and Persona configuration persists only in its domain-owned store; unsaved drafts and preview prompts and outputs remain memory-only principal-bound and clear on logout or session change.
    - Agent and Persona drafts preview prompts preview outputs and provider diagnostics must not enter logs telemetry audit metadata errors browser durable storage caches or any non-domain persistence.
    - Create Agent remains owner-authenticated CSRF-protected idempotent and atomic across profile revision memory policy tool policy audit and idempotency state.
    - Omitted initial Agent policy fields preserve the current deny-by-default tool and bounded memory defaults.
    - Initial tool grants are validated against the existing registry and may not widen tool permission scopes beyond established policy rules.
    - Persona Preview requires an authenticated owner session origin-aware CSRF an explicit selectable model bounded inputs and output Cache-Control no-store and direct provider-neutral inference with no automatic retry tools memory conversation run message job event idempotency audit-content or prompt/output persistence.
    - Persona Preview provider input contains only fixed governance text and the bounded submitted draft or selected active Persona revision plus test prompt; it receives no ambient conversations memories files credentials or provider-native diagnostics.
    - Persona Preview output is untrusted content rendered escaped and provider failures expose only stable generic recovery messages.
    - Persona assignment references expose owner-scoped current Agent metadata only and never conversation assignment history or private instructions.
    - Disabled Personas preserve historical references and cannot be selected for new Agent configuration or preview as a persisted revision.
  data_classes:
    - private_agent_configuration
    - private_persona_configuration
    - ephemeral_preview_prompt_and_output
    - owner_scoped_agent_persona_identifiers
