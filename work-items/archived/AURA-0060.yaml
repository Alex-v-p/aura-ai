    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/agents-and-execution.md
    - docs/specifications/clients-and-voice.md
    - docs/specifications/observatory-and-evaluation.md
    - docs/design/README.md
    - docs/design/foundations.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/sidebar-and-management-surfaces.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-approved mission-control Agent library and progressive publish builder
    - Owner-approved creative Persona library editor preview used-by and version views
    - Owner-approved optional initial tool grants and memory policy values on CreateAgentRequest
    - Owner-approved authenticated ephemeral Persona preview with no conversation memory tool or durable prompt/output state
    - Persona preview requires an explicit selectable model and never silently falls back
    - Persona assigned-Agent data is a current read-model composition and is not copied into Persona persistence
    - Persona preview is an application use case in the existing Personas public boundary and receives a narrow provider-neutral preview port wired by API state to the existing ModelGateway
    - Persona domain code must not import runtime or provider implementations and the HTTP route remains validation and translation only
    - Persona assignment responses are composed at the API read-model boundary through the Agents public query and Personas never imports Agents
    - Contract Steward updates OpenAPI and regenerates the transport client before Core and frontend consumers implement against the accepted shape
    - The additive Aura v1 contract advances from 1.10.0 to 1.11.0 and existing version assertions advance with it
    - Implementation remains inside registered Core modules and any new module or dependency requires a work-item amendment and Platform Worker registry update before implementation
    - Persona Preview uses new stable component aura.interaction.persona_preview version 1.0.0 rather than the durable agent configuration component
    - Each preview preallocates one trace with persona.preview as root model inventory as a structured-inference child and model.infer as the provider-inference child
    - ModelGateway.inventory accepts optional ProviderTraceContext and forwards it through the existing ModelSelectionPort so preview inventory telemetry is parented without importing a provider implementation
    - The existing Ollama model adapter emits the same parented inventory duration and outcome telemetry for cache hits as provider scans while preserving the bounded cache-outcome metric and all provider behavior
    - The Storybook application loads Aura Web's existing global stylesheet through its Angular Storybook target configuration so management baselines use the approved semantic tokens without a Storybook source import from Aura Web
    - ConversationStore remains the frontend owner of accepted Session and logout lifecycle and uses its already-registered dependency direction to synchronously clear Agent Persona and Tool Policy session state; management features never import Conversations and shared UI owns no authentication behavior
    - The accepted management-session fingerprint includes principal issuer principal subject and CSRF token so logout identity changes and token rotation clear private drafts preview output loaded data model selections policy state and cached credentials before old-principal responses can repopulate them
    - Aura Web's bootstrap application composition root provides the generic management-session port in the environment injector visible to root ConversationStore by composing the public Agent Persona and Tool Policy stores; the application adds no feature behavior and management libraries do not acquire a reverse dependency
    - aura.interaction.agent_configuration retains its stable component ID and advances from version 1.1.0 to 1.2.0 with agent-configuration-command-v3 while existing runtime component versions remain unchanged because their observable schemas and semantics do not change
    - aura.interaction.persona_preview is non-replayable because private input and output are not captured and uses bounded process retention with drop-oldest and bounded export-retry health accounting
