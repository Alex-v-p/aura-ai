id: AURA-0060
title: Redesign Agents and Personas with atomic publication and ephemeral preview
status: integrated
change_class: contract
intent: >
  Rebuild the Aura Web Agents and Personas surfaces as coherent guided libraries,
  builders, and revision-aware detail workspaces while extending the backward-
  compatible Aura v1 contract for atomic initial Agent policies, Persona usage
  references, and an authenticated bounded non-durable Persona preview.
