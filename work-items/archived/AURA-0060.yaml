acceptance_criteria:
  - CreateAgentRequest accepts optional initialToolGrants and initialMemoryPolicy values while omission remains backward compatible with current defaults.
  - Agent creation validates the selected active Persona and all initial policies before one transaction atomically publishes the profile first immutable revision pinned memory policy pinned tool policy audit and idempotency result.
  - Optional initial policy values participate in the principal-scoped idempotency fingerprint identical replay creates no duplicates conflicting replay returns conflict and omission preserves current defaults.
  - Tool permission scopes confirmation rules call limits timeouts and retry limits are server-derived from the existing registry and cannot be supplied or widened by the client while fallback Agent references are validated as unique owner-scoped active profiles.
  - A failed initial policy validation or persistence operation leaves no partial Agent profile revision policy grant audit or idempotency record.
  - Agent list cards show name purpose status Persona and current revision using calm semantic surfaces and no default exposure of technical identifiers thresholds budgets or revision metadata.
  - Agent creation uses Identity Persona Behavior Capabilities Memory and Review steps retains its in-memory draft across recoverable SPA navigation and failures and publishes nothing before final Review and Publish.
  - Agent detail presents Overview Behavior Capabilities Memory and Versions navigation while preserving existing detail tool-policy memory-policy deep links and immutable revision behavior.
  - Agent versions can be compared without editing historical revisions and advanced identifiers thresholds budgets and policy revision details remain disclosed on demand.
  - Persona list cards show description status revision and assigned-Agent count and detail responses include at most 50 deduplicated current Agent assignment references plus an assignedAgentsTruncated indicator composed through public APIs.
  - A current Persona assignment is an Agent current revision pinned to any revision belonging to that Persona profile and exposes only agentProfileId displayName status and current revision number; it never exposes instructions purpose policy identifiers or conversation history.
  - Persona configuration remains owned by interaction.personas while initial Agent policy persistence remains owned by interaction.agents and Persona assignment references remain a non-persisted API read model.
  - Persona creation and revision editing separate Identity Behavioral guidance Preview and Review with an in-memory draft that survives recoverable SPA navigation and errors.
  - POST /api/v1/personas/preview is CSRF-protected accepts a bounded test prompt explicit selectable modelId and exactly one of bounded draft fields or personaRevisionId and returns a bounded escaped ephemeral preview with Cache-Control no-store.
  - Persona Preview rejects missing unavailable or non-selectable models without fallback rejects disabled persisted Persona revisions and is never retried automatically by the frontend.
  - Persona Preview passes only fixed governance text selected draft-or-revision fields and the test prompt to its narrow provider-neutral port and receives no ambient conversation memory file tool credential or owner-identity context.
  - Persona Preview performs no conversation run message memory tool job event idempotency audit-content cache or prompt/output persistence and never records private content or provider exception payloads in telemetry logs audit errors or exporter output.
  - Persona Preview emits metadata-only bounded outcome duration dependency provider and error-class telemetry with authorization validation not_found capability provider timeout and unknown classifications and no persistence classification for provider failures.
  - Persona Preview inventory validation always emits one parented model inventory duration span and bounded outcome and cache-outcome metrics, including cache hits, beneath the persona.preview root; model.infer is a second child on the same trace.
  - The persona-preview observable contract is version 1.0.0 replayable false and limits metric labels to bounded outcome error_class dependency and provider values; model_id and correlation identifiers are trace-only while prompts draft fields output owner identity endpoint tokens and credentials are prohibited.
  - Persona Preview telemetry uses bounded in-process retention with drop-oldest accounting and bounded export retries whose dropped rejected export-failure and abandoned-batch health counters remain observable.
  - The agent-configuration manifest and COMPONENT_VERSIONS advance together to 1.2.0 with agent-configuration-command-v3 while its stable component ID is preserved and runtime component versions remain unchanged.
  - Persona detail presents Overview Preview Used by and Versions and disabling explains affected current Agents while retaining pinned Agent revisions and historical references; disabled revisions cannot be newly selected or previewed by identifier.
  - Atomic publication tests cover omission defaults identical replay conflicting replay unknown grants server-derived policy ceilings foreign-owner fallback references and injected failures after each staged write with zero partial durable state.
  - Preview privacy tests cover success validation capability timeout and provider failure with sentinel draft prompt output owner and provider-error content absent from MetadataMetrics StructuredContainerLogExporter API errors caches and persistence and with forbidden telemetry attributes rejected.
  - Desktop and tablet use the approved library/detail/workspace hierarchy and mobile presents builder steps and detail sections as focused full-width subpages with 44px controls reflow and no horizontal clipping.
  - Loading empty authentication permission validation conflict provider failure and recovery states use the shared Aura patterns and do not show contradictory create or empty states.
  - Agent and Persona routes preserve keyboard focus visible non-color state screen-reader names reduced motion 200 percent zoom and WCAG 2.2 AA expectations in light and dark themes.
  - Agent and Persona Storybook baselines load Aura Web's existing global stylesheet through Storybook target configuration, with no application-source import, duplicated palette, or change to approved token values.
  - Logout authorization failure principal change and CSRF rotation clear Agent Persona and Tool Policy API credentials root-store state and mounted local builder preview state; request generations prevent stale old-principal responses from repopulating cleared signals.
  - The OpenAPI contract generated TypeScript client Core implementation and frontend adapters remain synchronized and backward compatible.
  - The additive OpenAPI document version is 1.11.0 and all repository version assertions agree without changing existing reminder notification or memory behavior.
