    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
    - aura_ux_ui_reviewer
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 6
  max_parallel_writers: 2
  model_tier: balanced
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - A terminal run derives status from authoritative run_status lifecycle telemetry and duration from terminal run_duration_ms; later correlated memory tool worker persistence streaming or delivery observations cannot change either value.
  - A running run may remain running until terminal lifecycle evidence arrives; missing or inconsistent lifecycle evidence is represented honestly without inventing completion.
  - Run list and detail select the primary execution trace deterministically rather than a later arbitrary correlated trace, while related observations remain available in run detail.
  - Equivalent production and in-memory projection paths cover succeeded failed and cancelled terminal states, equal timestamps retries duplicate terminal observations and legacy runs without complete lifecycle telemetry.
  - Runs and selected-run views format durations into stable readable units with bounded precision while preserving precise accessible labels.
  - The selected-run view groups existing observations and spans into recognizable request context retrieval prompt routing generation thinking tools persistence and delivery phases when applicable, with accessible icons labels lineage timing outcome and partial state.
  - The inspector explicitly reports metadata-only capture and marks prompts chunks generated content displayed thinking and tool payloads as not captured where evidence is unavailable; it never presents absence as an empty successful capture.
  - Live refresh preserves the selected run and expanded presentation state while terminal header fields remain immutable.
  - Responsive keyboard screen-reader reduced-motion and forced-colors behavior is covered for the changed views.
  - Aura Web Core contracts migrations deployment topology generated clients retention policy and SSE payloads remain unchanged.
