contracts:
  changes_allowed: false
  affected:
    - observatory-v1 RunSummary and RunDetail existing fields
    - metadata-observation-v2 existing lifecycle measurements
  compatibility_requirement: backward_compatible
data:
  migration_required: false
  owning_service: aura-observatory
  owning_module: query
observability:
  applicable: true
  affected_components:
    - aura.observatory.query_api
    - aura.execution.run_coordinator
  required_metrics:
    - run_started
    - run_status
    - run_duration_ms
  required_evaluators: []
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Metadata-only policy and closed observation schema remain enforced.
    - The UI must distinguish unavailable content from empty content and must not infer or persist sensitive evidence.
    - No content enters URLs logs browser storage service-worker caches screenshots or SSE.
    - Aura Web and Observatory remain separate products with no frontend dependency or direct data exchange.
  data_classes:
    - operational_metadata
    - run_lifecycle_metadata
    - trace_lineage_metadata
required_agents:
  implementation:
    - observatory_worker
    - frontend_worker
    - test_evaluation_engineer
  review:
