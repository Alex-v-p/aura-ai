id: AURA-0114
title: Stabilize completed runs and clarify the metadata inspector
status: integrated
change_class: bugfix
intent: >
  Make Observatory run summaries and selected-run inspection reflect the
  authoritative Core lifecycle rather than later correlated background
  telemetry, and present the metadata already captured as a clear accessible
  phase-oriented inspector with readable durations and truthful capture gaps.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - work-items/archived/AURA-0098.yaml
    - Core run lifecycle measurements are authoritative for run status and duration; later correlated child, worker, persistence, or delivery telemetry must not mutate a terminal run header.
    - The primary run trace is selected from execution lifecycle lineage rather than the newest arbitrary correlated trace.
    - This work remains metadata-only. The inspector explicitly labels content that is not captured and never synthesizes prompts, chunks, thinking, generation text, or tool payloads from metadata.
    - Aura Web remains unchanged and contains no Observatory reference, dependency, route, link, or browser communication.
  contracts:
    - contracts/openapi/observatory-v1.yaml
    - contracts/telemetry/v2/metadata-observation.schema.json
feature_references:
  - OBS-001
  - OBS-002
