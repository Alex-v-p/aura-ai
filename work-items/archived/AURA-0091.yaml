acceptance_criteria:
  - A closed JSON Schema 2020-12 evaluation-runner transport v1 defines request cancellation completed cancelled and failed messages with exact version event correlation causation request job attempt idempotency component capture limit deadline provenance artifact-reference and digest fields and no raw content or arbitrary attributes.
  - Existing AURA-0089 evaluation resources lifecycle events and failure codes remain backward compatible and the new transport contract references their settled meanings without silently widening production telemetry or owner authorization.
  - The NATS topology creates a dedicated evaluation stream and stable subjects for runner commands and results with bounded retention delivery attempts acknowledgement deadlines and payload sizes appropriate to reference-only messages.
  - Separate file-injected dispatch and runner NATS identities have complementary least-privilege ACLs; normal Core Observatory API Web Collector databases and unrelated workers cannot consume commands or publish forged results.
  - A durable pull consumer validates schema authentication deadline capture authorization provenance exact deployed component and deployment bindings before execution and permanently rejects poison messages while retrying only bounded transient failures.
  - A forward-only idempotent Core migration from empty and existing schemas creates a content-free attempt ledger supporting claim lease cancellation terminal result identity and transactional result-publication recovery without storing evaluation definitions artifacts scores or raw input output.
  - Duplicate request and redelivery handling returns or republishes the same deterministic terminal identity and never duplicates component side effects artifacts or terminal observations; conflicting reuse of an attempt or idempotency identity fails closed.
  - Cancellation deterministically settles queued work and cooperatively interrupts active fixture loading model work and component execution at bounded checkpoints while preserving one terminal state across cancellation deadline completion and retry races.
  - Effective limits are the stricter of transport-declared and deployment-configured maxima for concurrency queue depth deadline cases input bytes output bytes tokens model work and artifact operations and saturation never borrows normal API or worker capacity.
  - A closed replay registry executes at least one deterministic production component replay through its public Core API verifies the exact declared deployed version and rejects unknown non-replayable mismatched or dynamically selected components.
  - A controlled synthetic end-to-end scenario exercises the exact deployed Core orchestration with versioned fixture model dependency and tool ports while producing no normal owner conversation memory document reminder approval notification or other consequential production mutation.
  - The runner fetches only declared opaque input artifact references verifies capture authorization size media class and SHA-256 before use and treats all bytes as untrusted evaluation evidence rather than configuration policy instruction or code.
  - Output content is bounded and written only through internally derived opaque references using the runner-specific Garage credential; NATS results contain references hashes sizes classifications statuses and reproducibility metadata but never bytes locators endpoints or filenames.
  - Completed cancelled and failed results include the exact code revision image configuration component model prompt policy seed fixture and deployment evidence available from the request or verified runtime and mark missing or mismatched reproducibility fields explicitly rather than inferring them.
  - Queue fixture-load execution cancellation resource and terminal outcomes emit metadata-only measurements with stable component identity fixed bounded labels and no request job attempt artifact dataset suite owner digest content or exception values as metric labels or logs.
  - Runner NATS Garage model and database outages malformed requests unsupported versions digest failures lease loss deadline expiration cancellation and process restart produce bounded recoverable behavior and finite failure classes without an acknowledgement-before-durable-terminal gap.
  - Starting stopping saturating or breaking the evaluation runner does not change Core API worker scheduler migration readiness normal NATS consumers ordinary model requests or telemetry export and Core remains usable with every evaluation dependency unavailable.
  - Compose exposes no runner port joins only the required Core database evaluation NATS model and evaluation-object networks mounts only runner-specific secrets applies CPU memory process and concurrency limits and keeps all durable state under the encrypted state root.
  - Fresh migration upgraded migration idempotent rerun unit property concurrency privacy integration topology and project-scoped real-stack tests cover contracts ACLs artifact integrity replay synthetic end-to-end duplicate delivery cancellation deadlines recovery resource isolation and Core independence.
  - Acceptance captures no private evaluation content or credentials in command output logs metrics reports screenshots or committed fixtures and tears down the single project-scoped stack before any later full-stack phase.
  - No Observatory source migration API CLI scheduler worker database or browser behavior normal Core HTTP contract dependency upgrade cloud judge external message protected golden result or repository baseline change is introduced.
