open_decisions:
  - Observatory evaluation job attempt retry scheduler outbox and cancellation-authority persistence remain assigned to AURA-0092; the Core ledger is executor-internal receipt lease and publication state only.
  - Dataset suite evaluator and broad component replay registrations remain assigned to AURA-0093; this item proves the runner boundary with a minimal deterministic registry and controlled synthetic scenario.
  - Local Ollama judge models prompts rubrics calibration and advisory thresholds remain assigned to AURA-0094 and cloud judges remain prohibited.
  - Evaluation HTTP CLI SSE browser upload download review and progress workflows remain assigned to AURA-0095.
  - Experiment baseline regression comparison and promotion behavior remain assigned to AURA-0096 and protected repository baselines remain unchanged.
