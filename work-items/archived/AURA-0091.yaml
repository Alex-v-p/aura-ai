  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Evaluation inputs are authorized untrusted data and can never select imports providers endpoints credentials files paths buckets subjects policies permissions tools or execution authority.
    - Runner transport is a closed schema with strict size count enum identifier timestamp and digest bounds and rejects unknown fields unsupported versions non-finite numbers and content-bearing or credential-like fields before claiming an attempt.
    - NATS uses separate runner and dispatch identities with exact subject ACLs durable consumer names and a dedicated stream; credentials are injected from files and never committed logged measured returned or copied into result artifacts.
    - The runner-specific Garage key is distinct from Core and Observatory keys limited to the evaluation artifact bucket denied owner permission and delivered only to the runner on the private storage network.
    - Artifact fetches and writes use internally derived UUID locators a configured private endpoint no redirects bounded timeouts exact byte limits SHA-256 verification closed media classifications and fail-closed authorization compatibility.
    - Raw input output prompt rubric comment artifact bytes filenames provider diagnostics and exception text never enter NATS PostgreSQL telemetry logs metrics traces SSE URLs screenshots test reports or browser storage.
    - PostgreSQL runner state contains only request job attempt event idempotency correlation causation component version digest deadline status lease cancellation and publication metadata and cannot reconstruct evaluation content or object locations.
    - The replay registry is closed and invokes only reviewed public Core seams with exact component versions; arbitrary Python import module path callable provider tool and model selection are rejected.
    - Controlled synthetic end-to-end execution uses versioned fixture adapters and denies consequential real tools owner data normal conversation state external network and ambient credentials.
    - Deadlines cancellation concurrency and resource ceilings are enforced independently of caller values by stricter deployment maxima and cannot be widened by an evaluation artifact or NATS message.
    - Failure handling maps provider transport storage validation and execution errors to finite content-free codes without exposing exception strings request identifiers or artifact digests as metric labels or log fields.
  data_classes:
    - evaluation_execution_metadata
    - authorized_evaluation_content
    - evaluation_artifact_reference
    - evaluation_reproducibility_metadata
    - evaluation_runner_audit
