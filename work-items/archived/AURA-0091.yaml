id: AURA-0091
title: Add the controlled Core evaluation runner
status: integrated
change_class: repository_governance
intent: >
  Execute authorized deterministic component replays and controlled synthetic
  end-to-end evaluations in a separately deployable Core runner using the
  exact deployed Core code while keeping evaluation transport content-free,
  resource-isolated, cancellable, reproducible, and independent from normal
  Core availability.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/overview.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/agents-and-execution.md
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/open-decisions.md
    - docs/specifications/aura-ai-envisioned-feature-catalogue.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - The architecture baseline already names the Core Evaluation Runner as a separate thin Core deployable over shared production application logic; this item does not add a new product or service boundary and does not require a new ADR.
    - Add a closed versioned evaluation-runner transport contract because the AURA-0089 resource and lifecycle-event schemas do not define the complete NATS command result and cancellation envelopes required by the runner.
    - Use a dedicated JetStream stream subjects durable consumer identities and file-injected service credentials with least-privilege publish and subscribe permissions; the normal Core NATS identity cannot consume evaluation commands and the runner identity cannot consume normal Core work.
    - NATS messages carry only bounded identifiers references hashes capture authorization limits deadlines reproducibility bindings finite statuses and failure codes; raw inputs outputs prompts rubrics comments artifact bytes credentials endpoints object keys filenames owner identity arbitrary attributes and exception text are prohibited.
    - Core PostgreSQL owns a minimal content-free runner attempt receipt lease cancellation and terminal-publication ledger for at-least-once idempotency and crash recovery; Observatory remains authoritative for evaluation definitions jobs scheduling retries results and analysis and the runner never reads Observatory databases.
    - The runner may access the existing Observatory evaluation artifact bucket only through a separate runner-specific file-injected key limited to that bucket with owner permission denied; it must never receive the Observatory worker key or ordinary Core object credentials.
    - Artifact references are opaque UUIDs whose object locators are derived internally; every read or write verifies the transport-declared authorization classification byte bound and SHA-256 digest and never accepts a caller-controlled path bucket endpoint or provider key.
    - Initial module replay is restricted to an explicit registry of production replay adapters reached through public Core boundaries; dynamic imports arbitrary component names and copied Observatory implementations are prohibited.
    - Initial end-to-end support is restricted to controlled synthetic scenarios using exact deployed Core orchestration and explicitly versioned fixture ports; it cannot impersonate an owner mutate normal owner data invoke real consequential tools or obtain ambient provider credentials.
    - Runner attempts have separate fixed concurrency queue deadline token byte case and provider budgets; cancellation and shutdown are cooperative and bounded and never borrow the API or normal worker concurrency pool.
    - Result identifiers and transport message identifiers are deterministic for a request attempt and terminal state so duplicate delivery recovery and result publication are idempotent without treating NATS as business truth.
    - Runner startup readiness failure saturation crash NATS loss Garage loss model loss or malformed work must not delay or fail Core API worker scheduler migration or ordinary request paths.
    - AURA-0091 adds no Observatory job orchestration scheduler retry policy dataset or suite persistence evaluator scoring judge API CLI SSE browser experiment baseline alert or production telemetry capture behavior; those remain assigned to AURA-0092 through AURA-0097.
  contracts:
    - contracts/evaluation/v1/evaluation.schema.json
    - contracts/evaluation/v1/failure-codes.schema.json
    - contracts/events/evaluation/v1/evaluation-events.schema.json
