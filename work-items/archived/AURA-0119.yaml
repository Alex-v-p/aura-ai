  max_parallel_agents: 7
  max_parallel_writers: 3
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Dedicated JetStream stream consumer and least-privilege identities provision aura.runs.evidence.v1 separately from Core commands evaluation and transient thinking with bounded retention message size delivery attempts and explicit ACK after durable success.
  - A complete closed run-evidence-v1 consumer validates discriminator bindings bounds canonical bytes digest byte count admission attestation capture state reason retry identity stable-ID duplicates and collisions before authoritative persistence.
  - Exact duplicates are idempotent changed immutable reuse becomes a content-free collision late and out-of-order evidence is retained deterministically and malformed or prohibited content is rejected without logging or persisting bytes.
  - Migration 0016 creates Observatory-owned manifest delivery collision deletion and content-free audit state with run sequence evidence and deletion indexes and is safe for fresh upgrade repeated and restart application.
  - A dedicated run-evidence Garage bucket and separate worker-write and API-read-delete credentials cannot access evaluation or Core buckets; object writes reads deletes and recovery enforce the 1 MiB limit digest byte count and approved media.
  - Captured manifests become visible only after durable object success; failures and partial excluded dropped deleted or unavailable states remain truthful and restart recovery never exposes missing bytes as captured.
  - GET run inspection merges existing ClickHouse spans and measurements with PostgreSQL manifests into deterministic bounded steps lineage completeness and partial reasons handling running late missing-parent duplicate out-of-order unavailable paged and deleted states.
  - GET evidence is owner-authorized no-store nosniff bounded streamed with exact approved media Content-Length and digest header and never exposes object keys or buffers unbounded bytes.
  - DELETE run evidence is owner-authorized CSRF-protected confirmation-gated idempotent durable and restart-recoverable; it removes every run byte while retaining content-free deleted manifests status and audit.
  - All success and error responses for inspection evidence and deletion satisfy the existing Observatory contract and remain no-store and content-free where required.
  - Each authoritative manifest or deletion state change emits only a metadata-only SSE observation.changed invalidation with resourceType run and the run ID; SSE never contains evidence IDs kinds media digests reasons deletion detail or content.
  - Component manifests telemetry spans metrics error classes evaluator outputs retention and dependencies exactly implement ADR-0017 with finite content-free dimensions and no evidence values or identifiers in observability signals.
  - Stopping NATS Observatory API PostgreSQL ClickHouse or Garage independently cannot affect Core run success and produces truthful bounded ingestion inspection or deletion failure states after recovery.
  - Tests cover fresh and upgraded migrations stream drift ACL isolation malformed and adversarial envelopes digest verification duplicate collision out-of-order merge pagination auth no-store streaming CSRF idempotent deletion restart recovery invalidation privacy and service outage isolation.
  - No Aura Core Aura Web frontend contract ClickHouse content schema evaluation bucket protected baseline or cross-product browser/session dependency changes occur.
