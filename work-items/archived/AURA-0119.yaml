contracts:
  changes_allowed: false
  affected:
    - run-evidence-v1 consumer implementation
    - observatory-v1 inspection evidence and deletion implementation
  compatibility_requirement: none
data:
  migration_required: true
  owning_service: aura-observatory
  owning_module: run-evidence
observability:
  applicable: true
  affected_components:
    - aura.observatory.run_evidence_ingestion
    - aura.observatory.run_evidence_storage
    - aura.observatory.run_inspection_query
  required_metrics:
    - run_evidence_ingest_outcome_count
    - run_evidence_storage_outcome_count
    - run_evidence_deletion_outcome_count
    - run_evidence_ingest_validation_latency_ms
    - run_evidence_ingest_dedupe_latency_ms
    - run_evidence_manifest_storage_latency_ms
    - run_evidence_object_storage_latency_ms
    - run_evidence_deletion_latency_ms
    - run_inspection_query_latency_ms
    - run_inspection_merge_latency_ms
  required_evaluators:
    - run_evidence_ingestion_integrity
    - run_evidence_deletion_recovery
    - run_inspection_projection_truth
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Observatory receives owner-private exact run content and must validate the complete closed envelope before any persistence acknowledgement.
    - Dedicated NATS and Garage identities and buckets must not grant access to run commands evaluation artifacts Core storage or metadata OTLP.
    - Evidence bytes and identifiers never enter ClickHouse OTLP logs metrics SSE URLs error detail or browser-facing object keys.
    - Owner authorization no-store nosniff approved media content length and digest headers are mandatory for evidence streaming.
    - Deletion requires Observatory CSRF idempotency and exact confirmation and retains only content-free durable audit and deleted manifests.
    - Object or PostgreSQL failures cannot acknowledge a captured item falsely and recovery must converge after restarts duplicates and out-of-order delivery.
    - Aura Web and Aura Core remain unchanged and no direct database read callback shared browser session or synchronous dependency is introduced.
  data_classes:
    - owner_private_run_evidence_bytes
    - run_evidence_manifests_and_lineage
    - evidence_deletion_state
    - content_free_evidence_audit
    - metadata_only_run_invalidation
required_agents:
