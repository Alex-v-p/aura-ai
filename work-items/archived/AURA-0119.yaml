id: AURA-0119
title: Persist and serve governed Observatory run evidence
status: integrated
change_class: repository_governance
intent: >
  Implement the Observatory-owned ingestion, manifest and object persistence,
  inspection merge, owner-authorized evidence streaming, durable manual
  deletion, metadata-only invalidation, and isolated deployment topology for
  the AURA-0117 contract and AURA-0118 producer, without changing Aura Core or
  either product frontend.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/agents-and-execution.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - docs/adr/0017-governed-production-run-evidence.md
    - AURA-0117 owns the immutable run-evidence-v1 and Observatory API contracts; this work item implements them without contract changes.
    - AURA-0118 publishes only to the dedicated aura.runs.evidence.v1 JetStream subject and never reads or waits for Observatory.
    - Observatory PostgreSQL owns manifests authorization deletion truth idempotency collision records and content-free audits; Garage owns bytes; ClickHouse remains content-free metadata.
    - A dedicated AURA_RUN_EVIDENCE stream durable consumer NATS identity Garage bucket and least-privilege worker/API credentials are separate from run commands evaluation artifacts and metadata ingest.
    - Object writes are digest and byte-count verified before a manifest becomes captured; ACK occurs only after durable authoritative state while duplicates and out-of-order delivery converge deterministically.
    - Inspection REST snapshots are authoritative and merge ClickHouse timing with PostgreSQL manifests; SSE publishes only run-scoped metadata invalidation after authoritative state changes.
    - Evidence reads are owner-authorized bounded streamed no-store and nosniff; object keys never leave the service.
    - Deletion is owner-authorized CSRF-protected idempotent durable and restart-recoverable; bytes are removed while content-free manifest and audit truth remains.
    - No frontend implementation or Aura Core change is allowed in this backend/platform slice.
  contracts:
    - contracts/events/runs/v1/run-evidence.schema.json
    - contracts/openapi/observatory-v1.yaml
