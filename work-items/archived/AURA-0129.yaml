id: AURA-0129
title: Establish the Google Calendar OAuth platform boundary
status: integrated
change_class: repository_governance
intent: >
  Establish a disabled-by-default, runtime-secret-backed platform boundary for
  Google Calendar OAuth with fixed endpoints, least-privilege scopes, exact
  callback validation, versioned credential-encryption key delivery, and
  least-privilege deployment wiring, without implementing calendar domain
  persistence, provider calls, API routes, or frontend behavior.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/design/daily-action-and-workflow-initiative.md
    - docs/specifications/tools-automation-and-integrations.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - work-items/archived/AURA-0128.yaml
    - The owner approved server-held encrypted OAuth credentials, revocation before removal when reachable, disabled reads with recoverable uncertain revocation, and reauthorization after expiry on 2026-10-26.
    - Provider credential encryption will use AES-256-GCM with per-record random nonces and owner-and-connection associated data in AURA-0130; this slice delivers a versioned key ring with one active encryption key and retained decrypt-only keys for rotation.
    - The versioned key ring and Google OAuth client secret are runtime file secrets and never environment values, source-controlled values, browser values, logs, telemetry, prompts, or error detail.
    - Google authorization token revocation and Calendar API origins are fixed application constants; user-controlled endpoints discovery and redirects are prohibited.
    - Network-enforced destination allowlisting is not introduced. The existing API-only Core egress network and fixed validated HTTPS endpoints are the approved boundary for this stage.
    - Only the Aura Core API process receives Google Calendar client and encryption secrets because connection and on-demand calendar reads are API-owned; workers schedulers browsers and Observatory receive neither.
    - This is Stage 2 slice 2 only; calendar persistence provider HTTP behavior lifecycle routes and product UI remain later sequential work items.
    - Baseline verification at parent checkpoint 99e497b records two unrelated Pyright failures in test_aura0125_idle_memory_telemetry.py and one unrelated Garage substring assertion failure in deploy/compose/test_topology.py; this item keeps focused type and topology gates without changing or waiving those baselines.
    - The local HTTP overlay depends on the local identity overlay for the aura-identity network; its required Compose validation uses compose.yaml then local-identity.yaml then local-http.yaml in documented overlay order.
    - Calendar secret mounts and enabled-only file-path environment entries live in an explicit deploy/compose/google-calendar.yaml opt-in overlay; the base and local HTTP deployments remain disabled and require no Calendar secret files.
    - Docker Compose may present mounted secrets as root-owned read-only mode 0444 or 0644; descriptor-level validation requires a regular no-follow file with no group-or-other write bits, while local source placeholders remain owner-only mode 0600.
