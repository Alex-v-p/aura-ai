acceptance_criteria:
  - Google Calendar integration configuration is disabled by default and requires no calendar secret while disabled; enabling it requires a non-empty client identifier client secret exact callback and valid encryption key ring and otherwise fails closed before readiness.
  - The platform publishes only fixed HTTPS constants for the Google authorization token revocation and Calendar API endpoints and the exact read-only calendar scope; no setting environment input discovery document redirect or caller can replace them.
  - The exact callback is the configured stable Aura public origin plus the fixed calendar callback path; production rejects HTTP localhost query fragments userinfo credentials alternate ports and origin mismatch while the existing explicit local-http overlay remains development-only.
  - The client secret and credential encryption key ring are read only from mounted secret files reject simultaneous plaintext environment values and remain excluded from repr serialization logs errors and rendered Compose environment.
  - The versioned JSON key ring accepts one active and bounded retained decrypt-only 32-byte keys with unique safe identifiers rejects unknown duplicate malformed short or oversized input and exposes key bytes only through a narrow repr-safe platform value object.
  - Credential encryption policy is fixed to AES-256-GCM with fresh 96-bit nonces owner-and-connection associated data and a stored key version; cryptographic persistence and use remain AURA-0130 scope.
  - Only aura-core-api receives the two calendar secret mounts and external egress; Aura Web worker scheduler migration evaluation Observatory and other services receive neither secret and gain no new network.
  - Deployment configuration documents disabled defaults runtime secret paths exact callback read-only scope and key rotation without including usable secret values; local bootstrap creates only permission-restricted development placeholders.
  - Content-free readiness distinguishes disabled ready missing configuration and invalid configuration without exposing paths key identifiers client identifiers endpoint values or validation detail.
  - Focused tests cover production and development configuration exact origins secret-file precedence and exclusivity key-ring bounds fixed endpoints scope least privilege service secret isolation rendered-config redaction and fail-closed readiness.
  - No contract domain provider HTTP route migration persistence frontend Observatory dependency package lock or protected baseline changes occur.
