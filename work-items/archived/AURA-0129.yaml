security_privacy:
  applicable: true
  concerns:
    - OAuth client secrets and credential encryption keys must be file-backed repr-safe process secrets available only to Aura Core API.
    - The encryption key ring must require unique bounded key identifiers exactly one active AES-256 key and retained decrypt-only keys so rotation never destroys still-authorized credentials.
    - Callback URI validation must require the exact configured stable Aura public HTTPS origin and fixed calendar callback path with no query fragment credentials or alternate origin.
    - Authorization token revocation and Calendar API endpoints must be fixed Google HTTPS constants and must reject discovery runtime override redirects or user input.
    - The enabled integration must fail closed and report content-free readiness when configuration or secret material is missing malformed or insecure.
    - Deployment output tests must prove secret values cannot enter rendered environment command output logs or browser and that workers schedulers and Observatory receive no calendar secret.
  data_classes:
    - Google OAuth client secret
    - versioned provider credential encryption key ring
    - non-secret OAuth client identifier and exact callback configuration
    - content-free calendar integration readiness
