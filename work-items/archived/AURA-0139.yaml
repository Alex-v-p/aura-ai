  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Every workflow-monitoring query is owner-authorized and accepts only closed UTC windows and established finite limits; storage queries are parameterized and fail before execution when any bound is invalid.
    - Responses expose aggregates plus at most 25 opaque existing run and trace references from agent-run observations. They never expose workflow content owner identity definition revision instance step-execution event evidence object or arbitrary correlation identifiers.
    - Failure analysis uses only bounded component operation outcome and error-class vocabularies and never returns exception messages stack traces provider payloads input cohorts arbitrary attributes or content-derived values.
    - Missing sparse late partially retained stale and unavailable signals remain explicit and cannot be inferred as zero success failure or correlation.
    - Authenticated monitoring responses chart data and UTC filter state remain memory-only and are excluded from browser persistence service-worker caches URLs telemetry logs screenshots and SSE payloads.
    - Logout authorization-generation change retention deletion malformed responses and service unavailability clear or safely invalidate workflow monitoring state without restoring stale principal data.
  data_classes:
    - operational_workflow_telemetry_metadata
    - aggregate_workflow_health_metrics
    - opaque_run_trace_correlation_metadata
