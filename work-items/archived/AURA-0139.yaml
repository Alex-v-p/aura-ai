acceptance_criteria:
  - The backward-compatible observatory-v1 contract and generated TypeScript client add GET /api/v1/automation/workflows/monitoring with a closed metadata-only snapshot and no change to Core or telemetry contracts.
  - The existing analytics catalogue classifies all fifteen authoritative AURA-0137 workflow measurements under automation with correct count or milliseconds units and supported aggregations while excluding every scheduler measurement.
  - The monitoring endpoint uses only Observatory telemetry storage through its public query port and returns lifecycle outcome counts latency summaries allowlisted time series bounded failure breakdowns and no more than 25 recent correlated run references.
  - Workflow state transition command and repository outcomes remain distinct measurements; definition validation agent step approval notification wait checkpoint cancellation and settlement latencies retain their declared units and are never combined across incompatible units.
  - The response explicitly reports snapshot time requested UTC window source freshness partial state unavailable signals maximum scanned rows actual scanned rows maximum series maximum points per series returned series returned points execution timeout and whether an execution or storage limit truncated results.
  - Failure breakdowns group only finite component operation outcome and error-class metadata with a maximum of 50 rows; exception text arbitrary dimensions content and individual workflow or step identities cannot appear.
  - Recent correlations are sorted deterministically newest first capped at 25 and emitted only when an agent-run observation supplies valid existing run and trace identifiers. Other component signals declare run-trace correlation unavailable.
  - No endpoint response lists workflow instances definitions revisions step executions lifecycle events or failed-step identities. Observatory issues no workflow command and cannot mutate Core state.
  - Observatory Web adds Monitor then Workflows with UTC window controls health and lifecycle summaries latency and wait-lag trends aggregate failed-step operations and links into existing run and trace inspection.
  - The automation analytics description includes workflows without replacing reminder and notification coverage; generic metadata-only live events trigger a coalesced bounded authoritative REST refresh with no analytical payload or filter in SSE or URLs.
  - The workflow monitoring view distinguishes loading empty sparse partial stale disconnected malformed unauthorized unavailable and truncated states preserves usable stale data during reconnect and offers bounded accessible recovery.
  - Charts have adjacent semantically equivalent tables explicit units and UTC labels; states use text and accessible names in addition to colour; keyboard focus screen-reader announcements high contrast reduced motion narrow layouts and 200 and 400 percent zoom remain usable.
  - Authenticated monitoring state remains memory-only and is cleared on logout or authorization-generation change. Retention effects and late responses cannot restore deleted observations or a prior principal snapshot.
  - Contract service adapter and privacy tests cover all fifteen allowlisted measurements unit semantics UTC bucket boundaries count and percentile aggregation failure classification limits injection attempts sparse missing partial late stale and truncated data deterministic correlation ordering and forbidden fields.
  - Frontend unit Storybook accessibility and real-browser tests cover UTC controls summaries charts equivalent tables failure drill-down live refresh reconnect malformed and unavailable recovery responsive layouts keyboard operation reduced motion and run/trace navigation.
  - Full-stack acceptance proves aggregate monitoring from synthetic workflow telemetry and proves Observatory remains usable with Aura Core unavailable; Core execution remains usable with Observatory stopped through existing isolation checks.
  - No Core source database manifest import scheduler metric per-instance projection Observatory migration package dependency deployment topology protected golden result or repository baseline change is introduced.
