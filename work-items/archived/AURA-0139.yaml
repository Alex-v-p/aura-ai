id: AURA-0139
title: Add aggregate Observatory workflow monitoring
status: integrated
change_class: contract
intent: >
  Give the Observatory owner a bounded, privacy-preserving workflow health
  dashboard derived exclusively from Observatory-owned telemetry, with
  aggregate lifecycle, latency, wait, failure, and correlated run/trace
  evidence while preserving Core independence and excluding per-instance
  projections.
