    - AURA-0087 owns the bounded operational analytics catalogue, ClickHouse query port, finite query limits, automation focus, REST-authoritative snapshots, and generic metadata-only live invalidation extended by this item.
    - The closed analytics allowlist adds exactly the fifteen AURA-0137 workflow measurements workflow_transition_outcome workflow_command_outcome workflow_repository_outcome workflow_transition_duration_ms workflow_command_duration_ms workflow_repository_duration_ms workflow_definition_validation_duration_ms workflow_agent_run_step_duration_ms workflow_approval_command_duration_ms workflow_notification_step_duration_ms workflow_wait_command_duration_ms workflow_wait_lag_ms workflow_checkpoint_persistence_duration_ms workflow_cancellation_duration_ms and workflow_settlement_duration_ms under the existing automation focus.
    - Scheduler measurements remain excluded because scheduled workflows are outside this release. Existing reminder and notification automation measurements remain backward compatible.
    - GET /api/v1/automation/workflows/monitoring is a bounded owner-authorized metadata-only snapshot assembled exclusively from Observatory-owned telemetry storage through the public query port. It never reads Core databases imports Core code copies Core manifests or requires Core availability.
    - The snapshot defaults to a 24-hour UTC window and preserves the established maximum 31-day window 200 points per series 12 series 50 breakdowns 1000000 scanned rows and 5000 millisecond execution limit. Recent correlated references are additionally capped at 25.
    - Lifecycle counts latency summaries time series and failure breakdowns are aggregates over allowlisted metadata fields only. Workflow definition content mappings inputs outputs checkpoints results approval presentation notification content owner identity exception text arbitrary attributes and content-derived values are unrepresentable.
    - Only workflow agent-run observations are expected to carry reliable run and trace correlation. Other workflow signals report correlation as unavailable rather than joining to Core state inferring identifiers or manufacturing references.
    - Correlated references expose only existing opaque run and trace drill-down identifiers plus bounded UTC timing operation component outcome and error-class metadata. Workflow definition revision instance step-execution and lifecycle-event identifiers are not returned or used as grouping dimensions.
    - Existing generic metadata-only Observatory SSE is an invalidation hint only. The browser performs coalesced bounded REST refresh and keeps usable stale state during reconnect partial data or service failure; analytical payloads and filters never enter SSE or URLs.
    - No Observatory database migration is required. Existing telemetry v2 and governed automation_input and automation_output run-evidence categories remain unchanged; this item does not create a new ingestion protocol or content grant.
    - Per-instance workflow projection listing failed-step identity ordering replay retention deletion propagation or command capability is outside scope and remains ADR_REQUIRED because it would establish a new replicated cross-service data boundary.
    - Existing architecture authorizes aggregate Observatory-owned telemetry analysis. Return ADR_REQUIRED if implementation requires a Core import database read manifest copy lifecycle-event projection new telemetry contract new persistence authority or Observatory-to-Core command path.
