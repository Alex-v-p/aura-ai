id: AURA-0049
title: Restore memory module boundaries and strict typing
status: integrated
change_class: repository_governance
intent: >
  Decompose the memory implementation into focused internal modules, restore
  strict typing across the affected Core tests, and reconcile the architecture
  registry without changing memory behavior or public contracts.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/memory-and-knowledge.md
    - docs/specifications/agents-and-execution.md
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - Preserve all imports exported by aura_core.domains.knowledge.memory.public and memory.__init__
    - Preserve memory authorization retention purge idempotency redaction and observable behavior
  contracts: []
feature_references: [MEM-001, MEM-002, MEM-003, MEM-004, MEM-005, MEM-006, MEM-010, MEM-011, MEM-012, MEM-013, MEM-014, MEM-015, MEM-016, MEM-017, MEM-021, MEM-024, MEM-025, MEM-026, MEM-027, MEM-028, MEM-029, MEM-030, MEM-031, MEM-032, MEM-033, MEM-034, EVA-007]
ownership_zones:
