  - evaluations/golden-results/**
  - evaluations/**/baselines/**
  - services/aura-observatory/**
  - services/aura-core/migrations/**
  - services/aura-core/src/aura_core/entrypoints/**
  - services/aura-core/src/aura_core/platform/**
  - services/aura-core/src/aura_core/runtime/**
  - frontend/**
  - deploy/**
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: aura-core
  owning_module: knowledge.memory
observability:
  applicable: true
  affected_components:
    - aura.knowledge.memory_extraction
    - aura.knowledge.memory_maintenance
    - aura.knowledge.memory_persistence
    - aura.knowledge.memory_retrieval
  required_metrics:
    - memory_extraction_duration_ms
    - memory_maintenance_duration_ms
    - memory_operation_duration_ms
    - memory_retrieval_duration_ms
    - memory_processing_errors
  required_evaluators:
    - memory_extraction_policy
    - memory_maintenance_integrity
    - memory_retrieval_quality
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Preserve owner and scope authorization across all extracted modules
    - Telemetry must remain content-free and must not capture prompts memory text embeddings or secrets
    - Preserve retention purge idempotency and duplicate-handling behavior
  data_classes:
    - private memory records and owner agent identifiers
    - content-free memory operation and evaluation metadata
required_agents:
  implementation: [core_worker, test_evaluation_engineer, platform_worker]
  review: [general_reviewer, architecture_guardian, observability_steward, security_privacy_reviewer]
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 8
  max_parallel_writers: 3
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - The memory public facade and package exports remain source compatible and all memory behavior tests pass unchanged in intent.
  - Memory processing maintenance persistence and repository capabilities live in focused internal modules without import cycles.
  - Services depend on narrow typed protocols while MemoryRepository remains available as a composite public protocol.
  - Structured inference embedding and telemetry collaborators use explicit typed ports and do not use TypeError signature probing.
  - Strict Pyright reports zero errors for all of services/aura-core without exclusions or weakened rules.
  - The architecture registry declares every extracted module and the existing models route dependencies on telemetry and runtime model ports.
  - No public contract migration baseline authorization retention purge idempotency redaction or telemetry-capture behavior changes.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0049.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0049.yaml
  - python3 tooling/architecture/validate-baseline-protection.py
  - python3 tooling/architecture/validate-generated-sync.py
  - python3 tooling/architecture/validate-observability.py --work-item work-items/active/AURA-0049.yaml
  - python3 tooling/architecture/validate-contract-changes.py --work-item work-items/active/AURA-0049.yaml
  - uv run --project services/aura-core pyright services/aura-core
  - uv run --project services/aura-core ruff check services/aura-core/src services/aura-core/tests
  - uv run --project services/aura-core pytest services/aura-core/tests
  - python3 -m unittest discover -s tooling/architecture/tests
  - git diff --check
baseline_changes_allowed: false
human_approval_required: true
open_decisions: []
