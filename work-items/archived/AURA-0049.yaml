  - aura-core.runtime.models.ports
  - aura-core.platform.telemetry
  - repository.architecture.registry
allowed_paths:
  - work-items/active/AURA-0049.yaml
  - work-items/archived/AURA-0049.yaml
  - services/aura-core/src/aura_core/domains/knowledge/memory/**
