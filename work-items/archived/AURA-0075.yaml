id: AURA-0075
title: Require validated citation markers after document retrieval
status: integrated
change_class: bugfix
intent: >
  Make the synthesis prompt explain Aura's existing same-run document citation
  marker protocol so local chat models emit citations that Core can validate and
  Aura Web can render, without trusting document text or accepting invented evidence.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/memory-and-knowledge.md
  decisions:
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - Owner-approved continuation of AURA-0073 using qwen3-embedding:4b for document retrieval.
  contracts: []
feature_references: []
ownership_zones:
  - aura-core.execution.runs
allowed_paths:
  - work-items/active/AURA-0075.yaml
  - work-items/archived/AURA-0075.yaml
  - services/aura-core/src/aura_core/domains/execution/runs/service.py
  - services/aura-core/tests/test_conversations.py
  - work-items/handoffs/AURA-0075-*.yaml
  - work-items/reviews/AURA-0075-*.yaml
  - work-items/integration/AURA-0075.yaml
forbidden_paths:
  - AGENTS.md
  - .agents/**
  - .codex/**
  - .github/**
  - docs/**
  - contracts/**
  - evaluations/golden-results/**
  - evaluations/**/baselines/**
  - services/aura-observatory/**
  - frontend/**
  - compose.yaml
  - .env.example
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: aura-core
  owning_module: execution.runs
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Citation instructions must not make untrusted document text authoritative.
    - Core must continue accepting markers only for evidence returned by document.search in the same run.
    - Persisted citations remain metadata-only and raw evidence identifiers are removed from assistant text.
  data_classes:
    - private_document_content
    - metadata_only_document_identity
required_agents:
  implementation:
    - core_worker
  review:
    - general_reviewer
    - security_privacy_reviewer
  integration: true
execution:
  parallelism_class: local
  max_parallel_agents: 4
  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Successful document.search synthesis evidence explicitly requires one marker in the form [[document:<evidenceId>]] for each cited result.
  - The marker instruction distinguishes trusted protocol metadata from untrusted document excerpts and does not expose another run's evidence.
  - Empty, denied, failed, canceled, and timed-out searches do not instruct the model to cite unavailable evidence.
  - Core continues to discard malformed, invented, duplicate, and stale markers through the existing same-run validation path.
  - A real Chromium run using qwen3:8b answers from a qwen3-embedding:4b-indexed document, renders a validated citation, and opens the authorized document detail.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0075.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0075.yaml
  - uv run pyright services/aura-core
  - uv run ruff check services/aura-core/src services/aura-core/tests/test_conversations.py
  - uv run pytest services/aura-core/tests/test_conversations.py
  - git diff --check
baseline_changes_allowed: false
human_approval_required: true
open_decisions: []
