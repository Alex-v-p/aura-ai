    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 8
  max_parallel_writers: 1
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - The owner-authenticated Observatory API admits a bounded digest-verified synthetic evaluation artifact and a real local-judge evaluation job through versioned public contracts using explicit capture authorization idempotency CSRF and no-store protections, without private SQL or in-process acceptance seams.
  - The existing analytics catalogue and query accept evaluation_runner_nats_recovery_count as a bounded metadata-only measurement so the full-stack harness can prove a new Core recovery observation after a real shared-NATS outage.
  - The composed Observatory API receives a distinct write-only Garage identity and only the private object-storage network required for artifact upload; it does not reuse worker judge or Core credentials and receives no read or owner permission.
  - All new public request and response schemas are closed bounded additive and covered by contract compatibility generated-client malformed-input owner-authorization CSRF idempotency and no-store tests.
  - No change under Aura Web Aura feature libraries or Aura Core is present and an architectural regression proves the main product contains no Observatory reference or client dependency.
  - AURA-0098 retains ownership of causal Garage worker scheduler local-judge operations and public-origin browser recovery acceptance and remains fail-closed until those checks pass.
