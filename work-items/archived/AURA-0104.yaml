  affected:
    - contracts/openapi/observatory-v1.yaml
    - contracts/evaluation/v1/evaluation.schema.json
    - frontend/libs/platform/observatory-api-client/src/lib/generated/observatory-api.ts
  compatibility_requirement: backward_compatible
data:
  migration_required: true
  owning_service: aura-observatory
  owning_module: observatory.evaluation
observability:
  applicable: true
  affected_components:
    - aura.observatory.query_api
    - aura.observatory.evaluation_api
    - aura.observatory.evaluation_definitions
    - aura.observatory.evaluation_artifact_storage
    - aura.observatory.evaluation_orchestration
    - aura.observatory.local_judges
  required_metrics:
    - observatory_evaluation_artifact_operation_count
    - observatory_local_judge_provider_failure_count
  required_evaluators:
    - observatory_public_evaluation_admission
  capture_policy: metadata-only operational evidence plus explicitly authorized synthetic evaluation fixtures; no credentials or ordinary owner content
security_privacy:
  applicable: true
  concerns:
    - New owner mutations require the existing Observatory session audience owner authorization CSRF same-origin and no-store protections.
    - Artifact bytes are bounded streamed digest-verified and stored only through the existing Observatory evaluation Garage boundary with explicit full-content capture authorization and manual retention.
    - Local-judge admission never returns prompts provider payloads credentials hidden reasoning or raw provider diagnostics and exposes only bounded typed terminal state.
    - Public metrics retain allowlisted names dimensions cardinality scan limits owner scoping and content-free responses.
    - Acceptance output screenshots traces videos logs reports URLs and browser storage contain no credentials session material provider content or private telemetry.
    - Aura Web remains free of Observatory links references imports configuration sessions and browser communication.
  data_classes:
    - synthetic_evaluation_content
    - operational_metadata
    - opaque_run_and_evaluation_identifiers
    - owner_session_state
