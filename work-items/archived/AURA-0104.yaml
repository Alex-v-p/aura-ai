id: AURA-0104
title: Expose governed Observatory acceptance capabilities
status: integrated
change_class: repository_governance
intent: >
  Provide the smallest owner-authorized public admission and operational
  evidence surfaces needed to complete AURA-0098 from a fresh composed stack,
  including real evaluation artifact and local-judge work admission, bounded
  component metric queries, and the service-owned persistence needed for those
  capabilities. Preserve the independent Aura Core and Observatory products
  and do not weaken or take ownership of any AURA-0098 acceptance gate.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-authorized acceptance setup uses authenticated versioned Observatory APIs and existing service-owned use cases rather than private SQL, in-process adapters, or new cross-service database access.
    - Existing analytics is extended additively for the bounded Core evaluation_runner_nats_recovery_count measurement; no new Core-to-Observatory request dependency is introduced.
    - Evaluation artifact and local-judge admission remain Observatory-owned, owner-only, CSRF-protected, idempotent, bounded, and compatible with the existing evaluation-v1 model.
    - Full-content fixtures are deterministic synthetic acceptance data governed by explicit capture authorization and manual retention; credentials provider-hidden reasoning and ordinary owner content are excluded.
    - AURA-0098 remains the owner of the complete composed resilience matrix; this prerequisite adds capabilities and focused tests but does not claim AURA-0098 acceptance by itself.
  contracts:
    - contracts/openapi/observatory-v1.yaml
    - contracts/evaluation/v1/evaluation.schema.json
