  parallelism_class: standard
  max_parallel_agents: 2
  max_parallel_writers: 2
  model_tier: balanced
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - The locked workspace uses Node 24, pnpm 12, Angular 22, Nx 23, strict TypeScript, Tailwind 4, and the approved frontend test stack.
  - Only Aura Web and the explicitly authorized conversation and shared libraries are scaffolded.
  - Nx boundaries keep the application thin, conversation behavior Aura-owned, and shared libraries product-neutral.
  - The initial route presents a welcome-first conversation interface with accessible conversation-only navigation.
  - Desktop uses an expanded collapsible sidebar, tablet uses a compact rail, and mobile uses an accessible overlay and sticky safe-area composer.
  - System, light, and dark themes use documented semantic tokens and persist only the theme preference.
  - Prompt submission produces deterministic local working and reply behavior; stopping preserves the user turn and displays interruption.
  - Empty, loading, validation, working, interrupted, recoverable-error, and completed states provide accessible text and recovery behavior.
  - Storybook documents reusable components and conversation states with automated axe coverage.
  - Vitest and Playwright cover state transitions, keyboard behavior, accessibility, focus management, and responsive layouts.
  - The PWA precaches only public and static shell assets and does not persist drafts, transcripts, mock state, authenticated data, or runtime requests.
  - Running docker compose up --build from the repository root serves a healthy Aura Web preview at http://localhost:4200.
  - The default Compose application starts only Aura Web and requires no host Node or pnpm installation.
  - Optional Compose check services run lint, tests, Storybook validation, and Playwright without becoming default runtime services.
  - The runtime image is non-root, minimal, health-checked, and contains no development server, source tree, package cache, or development dependencies.
  - No backend service, API contract, generated client, authentication provider, database, model call, tool, voice processing, or broader infrastructure is introduced.
