id: AURA-0010
title: Bootstrap containerized Aura Web conversation shell
status: integrated
change_class: feature
intent: >
  Establish the Aura Web workspace and deliver an accessible, responsive,
  themeable conversation shell with deterministic local behavior, reusable
  components, frontend tests, and a repository-root Docker Compose preview,
  without introducing backend integrations or future API contracts.
