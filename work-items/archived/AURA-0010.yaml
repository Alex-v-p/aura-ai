contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - Mock transcript content remains plain text and Angular-escaped
    - Conversations and drafts remain memory-only
    - Only the non-sensitive theme preference is persisted
    - Workbox caches public and static shell assets only
    - The preview binds to loopback by default
    - The runtime container is non-root and receives no secrets
    - Fixtures contain no credentials, private diagnostics, or real user data
  data_classes:
    - synthetic mock conversation content
    - non-sensitive theme preference
