id: AURA-0077
title: Repair attachment persistence ordering and image deduplication
status: integrated
change_class: bugfix
intent: >
  Restore atomic conversation creation with attachments and make owner-scoped
  duplicate image uploads converge on the existing attachment without exposing
  database failures, private content, or inconsistent lifecycle state.
