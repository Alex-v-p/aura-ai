contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: aura-core
  owning_module: artifacts.attachments and interaction.conversations
observability:
  applicable: true
  affected_components:
    - aura.artifacts.attachment_upload
    - aura.artifacts.attachment_processing
    - aura.interaction.conversation_persistence
    - aura.execution.run_coordinator
  required_metrics:
    - attachment_upload_outcome
    - conversation_attachment_admission_outcome
  required_evaluators:
    - conversation_attachment_branch_isolation
    - attachment_capture_redaction
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Duplicate lookup remains owner-scoped and must not disclose cross-owner resource existence.
    - Duplicate and persistence failures must not expose filenames hashes bytes prompts excerpts or extracted content.
    - Immutable message attachment links remain atomic with their owning message and run.
    - Deleted attachment tombstones remain unavailable and are never resurrected by deduplication.
  data_classes:
    - private_image_content
    - user_supplied_filename
    - opaque_attachment_identifiers
    - owner_identity
required_agents:
  implementation:
