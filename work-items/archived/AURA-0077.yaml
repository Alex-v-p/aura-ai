    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
    - aura_ux_ui_reviewer
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 8
  max_parallel_writers: 2
  model_tier: balanced
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - SQLAlchemy orders every message row before its normalized attachment links while preserving the immutable JSON attachment snapshot and transaction atomicity.
  - New conversations subsequent runs edit-and-branch regeneration and assistant persistence retain their existing behavior with no partial message links after rollback.
  - A same-owner upload with identical bytes and a different filename or upload ID returns the existing ready attachment without additional object writes or lifecycle events.
  - Concurrent same-owner duplicate uploads converge on one attachment and only the owner-digest unique race is translated into the bounded duplicate path.
  - Same-content uploads by different owners remain independent while failed or unavailable prior records produce a typed HTTP 409 and same-attachment retries remain possible.
  - Existing public API event database and generated-client shapes remain unchanged and attachment telemetry stays metadata-only.
  - Existing message attachment summaries are serialized from the immutable persisted snapshot so sent-message cards, branch reads, and tombstones remain visible without changing the contract.
  - Edit-and-branch hydrates the branch attachment selection from the source turn and submits that explicit set without relying on composer draft state.
  - Retained branch edits keep their per-conversation explicit attachment additions and removals across navigation, render one selection surface, and focus the branch editor after activation.
  - The local HTTP stack builds successfully and browser acceptance covers duplicate upload conversation admission grounding vision branching regeneration preview deletion tombstones draft preservation and private-browser-storage exclusions.
