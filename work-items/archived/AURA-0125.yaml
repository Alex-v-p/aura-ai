id: AURA-0125
title: Bound idle memory housekeeping and retry telemetry
status: integrated
change_class: bugfix
intent: >
  Eliminate the remaining idle memory observation amplification by making
  successful housekeeping discovery quiet and by ending JetStream delivery
  after Core has durably parked a retryable memory job in PostgreSQL. Preserve
  the existing housekeeping cadence, owner scoping, real lifecycle and
  reindex work, bounded PostgreSQL retry schedule, all failures, and Core to
  Observatory isolation.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - Successful housekeeping discovery reads are internal polling details and do not emit per-owner persistence success observations.
    - Lifecycle transitions reindex progress due retry attempts and every failure retain their existing observable identities and bounded metadata.
    - PostgreSQL available_at and lease state remain authoritative for memory retry timing after a retryable settlement is durably committed.
    - JetStream carries the identifier-only wakeup and is acknowledged after a durable completed failed or retryable settlement; a transient exception or missing durable settlement remains negatively acknowledged.
    - Duplicate transport delivery must not republish queued or completed memory activity telemetry when the deterministic activity event is already durable.
    - Housekeeping execution interval database reads leases provider calls and owner-scoped memory state are not weakened or bypassed.
    - Existing memory processing jobs are not deleted reset reclassified or administratively mutated by this work item.
    - Core continues to export asynchronously and never reads from or waits for Observatory.
  contracts: []
feature_references: [MEM-034, TOL-008, OBS-005, OBS-009]
