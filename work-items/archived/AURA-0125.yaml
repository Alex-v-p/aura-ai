acceptance_criteria:
  - A successful housekeeping pass still invokes maintenance and resumable reindex discovery for every eligible owner at the configured sixty-second cadence but emits no success observation for an internal memory list model-configuration lookup or no-op maintenance sweep.
  - A lifecycle decay archive embedding or reindex transition retains its existing success telemetry and every housekeeping discovery or state-transition failure is emitted immediately with a bounded error class.
  - A memory command whose processing job is durably parked as retryable is acknowledged at the JetStream boundary and is retried only when PostgreSQL available_at becomes due through the existing bounded housekeeping claim path.
  - A transient exception before durable settlement and a non-durable result remain negatively acknowledged with bounded backoff while completed failed and durably retryable settlements are acknowledged.
  - Duplicate or late JetStream delivery does not create repeated queued completed or memory.activity.publish success observations for an already durable deterministic memory activity event.
  - Existing retryable jobs are neither deleted nor administratively rewritten and normal claim settlement lease attempt-count and backoff behavior remains authoritative.
  - Deterministic tests cover empty and active housekeeping successful and failed discovery due and not-due retry jobs first delivery duplicate delivery transient failure and durable retry acknowledgement without wall-clock sleeps.
  - After a restarted local stack stabilizes for at least seventy-five seconds a following two-minute idle sample contains no recurring successful housekeeping discovery observations and no recurring redelivery or memory activity publication for the four pre-existing unavailable retry jobs.
  - The targeted memory idle sources average at most five observations per minute in that two-minute sample which is more than a ninety-eight-percent reduction from the measured 352 observations per minute memory subtotal before this work item.
  - Aura Web Observatory Web public contracts deployment topology and Core to Observatory isolation remain unchanged.
