security_privacy:
  applicable: true
  concerns:
    - Approval proposal content is private and appears only after a separately owner-authorized detail request; lists streams badges logs telemetry URLs and ordinary errors remain metadata-only.
    - Direct detail routes preserve backend authorization and never briefly publish stale detail from another route principal or accepted session.
    - Approve and Reject preserve CSRF optimistic-version and idempotency semantics and are never automatically retried after timeout disconnect or otherwise uncertain completion.
    - Authentication and principal changes clear private detail owner-scoped collections cached CSRF stream cursors reconnect timers and decision state before old requests can repopulate them.
    - Approval SSE remains principal-bound metadata-only validates bounded contract events reconciles expired cursors authoritatively and cannot publish after reset stop or route generation changes.
    - Error presentation uses bounded status-based language and never renders proposal payloads credentials provider responses server diagnostics or hidden reasoning.
    - Conversation approval cards route to owner-authorized approval detail without gaining broader proposal access or retaining an inline decision path that bypasses review.
  data_classes:
    - private_approval_proposal
    - owner_scoped_approval_metadata
    - owner_scoped_approval_identifiers
    - approval_and_execution_state
