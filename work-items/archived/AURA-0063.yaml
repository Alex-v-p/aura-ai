  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/tools-automation-and-integrations.md
    - docs/specifications/clients-and-voice.md
    - docs/design/README.md
    - docs/design/foundations.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/reference-research.md
    - docs/design/sidebar-and-management-surfaces.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-approved Approvals decision inbox with pending requests first and terminal History separated
    - Owner-approved review-before-decision flow with no list-level or bulk approve or reject action
    - Owner-approved /approvals/:id canonical detail route presented as a focus-managed drawer on wide desktop and a focused full-screen page on mobile
    - Owner-approved sticky detail actions that explain action consequence origin expiry and execution state before Approve or Reject becomes available
    - Existing Aura v1 Approval list detail decision and SSE APIs are sufficient; this work item introduces no contract service persistence or migration change
    - Unknown decision outcomes are never presented as success and are never retried automatically
    - ApprovalStore joins the application-composed management-session reset port so private detail cached CSRF stream cursors owner-scoped collections and pending indicators do not cross accepted-session changes
    - Owner-approved conversation approval cards navigate to /approvals/:id for review and never approve or reject inline
