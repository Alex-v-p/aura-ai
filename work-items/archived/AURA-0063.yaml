  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Approvals presents a Pending decision inbox first and a distinct terminal History view for approved rejected expired and canceled records, without mixing terminal records into the default decision queue. [Design — sidebar-and-management-surfaces.md Approvals decision inbox; foundations.md Responsive behavior and density]
  - List rows explain the proposed action origin expiry and status in plain language, keep technical tool and version identifiers under an explicit disclosure, and never expose private proposal content. [Design — sidebar-and-management-surfaces.md Approvals decision inbox; foundations.md Privacy-sensitive presentation]
  - List rows and collection controls provide no Approve Reject or bulk-decision action; a decision becomes available only after the user opens and reviews the owner-authorized detail. [Design — sidebar-and-management-surfaces.md Approvals decision inbox; failure-and-recovery-states.md Sensitive and consequential workflows]
  - Selecting a request navigates to /approvals/:id; wide desktop presents a contextual drawer and mobile presents a focused full-screen detail page with a clear route-backed return path and no horizontal scrolling. [Design — sidebar-and-management-surfaces.md Route matrix; components-and-interactions.md Drawers dialogs and notifications]
  - Approval detail explains what Aura wants to do the user-visible consequence affected scope originating conversation or task expiry decision status and execution state before presenting actions. [Design — sidebar-and-management-surfaces.md Approvals decision inbox; failure-and-recovery-states.md Sensitive and consequential workflows]
  - Tool identifier tool version record identifiers exact versions and lifecycle timestamps are secondary sanitized technical details under an explicit disclosure rather than the primary visual hierarchy. [Design — foundations.md Privacy-sensitive presentation; failure-and-recovery-states.md Failure UX]
  - Pending detail keeps Approve and Reject visible in a sticky footer, names each consequence, disables duplicate submission, and terminal detail explains the durable outcome without offering an impossible action. [Design — sidebar-and-management-surfaces.md Approvals decision inbox; components-and-interactions.md Controls and rich content]
  - Decision responses update detail collection and global pending indication only when they belong to the current accepted session and request generation; conflicts reconcile authoritative state and late responses cannot overwrite a newer route principal or decision. [Design — failure-and-recovery-states.md Preservation and identity invariant; components-and-interactions.md Component state matrix]
  - A timeout disconnect server failure or otherwise unconfirmed Approve or Reject outcome is presented as needing confirmation rather than success or definite failure, is not retried automatically, and offers an authoritative status refresh before any further decision. [Design — failure-and-recovery-states.md Recovery rules and Sensitive and consequential workflows]
  - The global pending badge or indicator is derived from an authoritative pending-filter reconciliation rather than the currently visible mixed or History page; when pagination prevents an exact number the UI uses an honest bounded indicator instead of a false exact count. [Design — sidebar-and-management-surfaces.md Shell anatomy and Approvals decision inbox; failure-and-recovery-states.md Recovery rules]
  - Route detail loads collection refreshes pagination stream events session hydration and mutations use independent request identities or generation guards so stale work cannot repopulate a newer view route or accepted session. [Design — failure-and-recovery-states.md Preservation and identity invariant]
  - Approval streaming is globally single-owned principal-bound and metadata-only, accepts only bounded contract-valid events, resumes from the last fully processed event, awaits authoritative reconciliation after a 410 response, and caps automatic reconnect attempts before offering manual recovery. [Design — failure-and-recovery-states.md Offline Reconnecting and Recovery rules; components-and-interactions.md Status and notification states]
  - Authentication and principal changes reset Approval collections detail errors pending indication reconnect cursors cached CSRF timers and mutation state, and an obsolete session request cannot restore a prior CSRF token or restart a prior-principal stream. [Design — failure-and-recovery-states.md Preservation and identity invariant; foundations.md Privacy-sensitive presentation]
  - Originating conversation approval cards navigate to /approvals/:id for owner-authorized review, expose no inline Approve or Reject action, and preserve the conversation context without broadening proposal access. [Design — sidebar-and-management-surfaces.md Approvals decision inbox; failure-and-recovery-states.md Sensitive and consequential workflows]
  - Drawers trap focus close with Escape provide an explicit close or Back action restore focus to the invoking row when possible announce their heading and keep visible keyboard focus and screen-reader names. [Design — components-and-interactions.md Drawers dialogs and notifications; foundations.md Accessibility baseline]
  - Loading empty authentication permission not-found conflict offline reconnecting unknown-outcome and terminal states use semantic text and structure in addition to color and place Retry only where repeating a read or reconciliation is safe. [Design — failure-and-recovery-states.md State matrix and Recovery rules; foundations.md Status roles]
  - Light and dark Storybook stories cover Pending History route detail loading empty authentication permission conflict unknown-outcome unavailable-stream and recovery states using the approved semantic tokens. [Design — foundations.md Themes and Core semantic tokens; sidebar-and-management-surfaces.md Shared state patterns]
  - Automated validation covers 1440x900 iPad Mini and iPhone 13-equivalent widths keyboard operation focus trap and return 200 percent zoom reflow reduced motion non-color communication direct deep links and axe checks for landing and detail surfaces. [Design — foundations.md Responsive behavior and density and Accessibility baseline]
  - Existing Approval list detail approve reject and SSE requests owner scopes private proposal separation statuses execution states expiry immutable terminal outcomes optimistic versions idempotency and replay semantics remain behaviorally backward compatible. [Design — design README.md Authority and boundaries; failure-and-recovery-states.md Sensitive and consequential workflows]
  - No contract service migration new approval kind bulk approval multi-approver policy package framework durable browser storage or Observatory behavior is introduced. [Design — design README.md Authority and boundaries; sidebar-and-management-surfaces.md Authority and precedence]
