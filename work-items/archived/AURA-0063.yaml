id: AURA-0063
title: Redesign Approvals as a review-first decision inbox
status: integrated
change_class: feature
intent: >
  Recompose Aura Web Approvals into a calm safety-first decision inbox with
  pending requests separated from terminal history, route-backed contextual
  detail, review-before-decision actions, authoritative pending indication,
  accessible responsive behavior, and honest recovery while preserving the
  existing owner-scoped approval contract and deterministic lifecycle.
