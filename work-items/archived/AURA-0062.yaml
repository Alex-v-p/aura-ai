acceptance_criteria:
  - Reminders presents Upcoming as an agenda grouped into Today Tomorrow This week and Later while completed and canceled reminders appear in a distinct History view.
  - Agenda rows prioritize readable reminder content due time timezone and state with technical identifiers versions and exact timestamps disclosed only when useful.
  - Reminder creation remains a focused one-shot composer for content and local due date and time explicitly names the active timezone retains the draft after recoverable failure and does not introduce recurrence.
  - Selecting a reminder navigates to /reminders/:id; wide desktop presents a contextual drawer and mobile presents a focused full-screen detail page with a clear return path and no horizontal scrolling.
  - Direct reminder routes communicate loading authentication permission not-found conflict uncertain-outcome and recoverable failure states without briefly exposing stale detail from another record or principal.
  - Reminder detail makes timezone due time status completion and cancellation explicit and exposes lifecycle actions only after detail review with destructive cancellation clearly distinguished.
  - Notifications presents Unread and History views and keeps the server-authoritative unread count correct and visible through all existing shell navigation modes.
  - Selecting a notification navigates to /notifications/:id; desktop uses a focus-managed contextual drawer and mobile uses a focused full-screen detail with route-backed close and Back behavior.
  - Notification detail supports Acknowledge Mark reminder complete and Open reminder while preserving separate authorization for reminder content and never erasing source reminder failure state.
  - A notification whose source reminder cannot be loaded communicates that limitation and offers recovery rather than silently substituting generic reminder content.
  - Route-owned detail loads list refreshes stream events and mutations use request identity or generation guards so late responses cannot repopulate a newer route or accepted session.
  - Notification streaming remains globally single-owned reconnects from the last metadata-only event cursor reconciles 410 responses and does not create duplicate page streams.
  - Authentication and principal changes reset Reminder and Notification collections detail errors drafts reconnect cursors cached CSRF and timers while leaving no private data in durable browser storage.
  - Drawers and confirmations trap focus where appropriate close with Escape return focus to the invoking control and keep visible keyboard focus and screen-reader names.
  - Loading empty authentication permission validation conflict offline reconnecting unknown-outcome and success states use semantic text and structure in addition to color and never contradict the underlying source state.
  - Light and dark Storybook stories cover agenda History composer reminder detail Unread History notification detail loading empty and recovery states using approved semantic tokens.
  - Automated validation covers 1440x900 iPad Mini and iPhone 13-equivalent widths keyboard operation focus return 200 percent zoom reflow reduced motion non-color communication and axe checks for both landing and detail surfaces.
  - Existing Reminder and Notification API requests owner scopes immutable timestamps optimistic versions delivery ordering unread count and source separation remain behaviorally backward compatible.
