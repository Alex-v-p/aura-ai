id: AURA-0062
title: Redesign Reminders and Notifications as calm temporal workspaces
status: integrated
change_class: feature
intent: >
  Recompose Aura Web Reminders into a readable agenda and Notifications into a
  lightweight delivery inbox with route-backed contextual detail, explicit
  lifecycle actions, accessible responsive behavior, and honest recovery while
  preserving the existing automation contracts, owner scopes, and delivery
  semantics.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/tools-automation-and-integrations.md
    - docs/specifications/clients-and-voice.md
    - docs/design/README.md
    - docs/design/foundations.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/reference-research.md
    - docs/design/sidebar-and-management-surfaces.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-approved Reminders agenda grouped into Today Tomorrow This week and Later with terminal History separated
    - Owner-approved Notification inbox with Unread and History views and durable route-backed detail
    - Existing Aura v1 Reminder and Notification APIs are sufficient; this work item introduces no contract persistence or recurrence change
    - Browser-local timezone presentation uses the existing UTC dueAt instant and does not introduce persisted timezone semantics
    - Reminder and Notification details are route-backed contextual drawers on wide desktop and focused full-page representations on mobile
    - Notification payloads remain metadata-only and reminder content continues to load through the separately authorized Reminder API
    - Transient source-loading failure remains visible and recoverable without inventing a persisted reminder failure status
    - Consequential reminder transitions and notification acknowledgement are never retried automatically after an uncertain outcome
    - ReminderStore and NotificationStore join the application-composed management-session reset port so private detail drafts cached CSRF stream cursors and owner-scoped collections do not cross accepted-session changes
  contracts:
    - contracts/openapi/aura-v1.yaml
