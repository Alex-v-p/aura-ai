security_privacy:
  applicable: true
  concerns:
    - Reminder content detail notification metadata selected records composer drafts and stream cursors remain owner-authorized memory-only state and do not enter durable browser storage logs telemetry URLs or unrelated feature state.
    - Notification responses and SSE remain metadata-only; the frontend must not copy reminder content into notification persistence transport events or telemetry.
    - Direct detail routes preserve backend authorization and never briefly publish stale content from another route owner or accepted session.
    - Complete cancel acknowledge and mark-complete actions preserve CSRF optimistic-version and idempotency semantics and are never automatically retried after an uncertain response.
    - Authentication and principal changes clear private state cached CSRF reconnect cursors timers and local composer state before old requests can repopulate them.
    - Error presentation uses bounded status-based messages and never renders provider server or transport payloads.
  data_classes:
    - private_reminder_content
    - owner_scoped_notification_metadata
    - owner_scoped_automation_identifiers
