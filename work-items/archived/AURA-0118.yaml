  capture_policy: full_content
security_privacy:
  applicable: true
  concerns:
    - Exact owner-private request prompt context retrieval thinking generation tool attachment and evaluation content crosses a new one-way channel and must use only the closed explicit serializers authorized by ADR-0017.
    - Credentials secrets bearer material and provider-hidden reasoning are permanently excluded and the full item is rejected before queueing rather than redacted under an exact-content claim.
    - Model-visible media requires the contract-defined validated media inspection attestation; unsupported malformed or incompletely scanned attachments are represented by content-free partial evidence only.
    - Evidence must never enter OTLP logs metrics SSE Core run events transactional outbox commands exception detail or existing metadata-only component captures.
    - Capture is separately owner-enabled and defaults off; existing metadata export settings cannot activate it.
    - Queue transport cancellation shutdown and downstream outage behavior cannot alter Core execution persistence streaming provider calls tool actions approvals evaluation results or user-visible latency.
    - Stable logical identifiers canonical bytes digests counts sequences and delivery-attempt identities must converge safely under retry worker redelivery and approval resume.
    - Core has no Observatory import URL route label client callback health dependency or browser communication.
  data_classes:
    - owner_private_run_evidence
    - admitted_request_and_trigger_content
    - compiled_prompt_and_context_content
    - retrieval_and_chunk_content
    - model_visible_attachment_content
    - displayed_thinking_content
    - generated_and_synthesis_content
    - tool_argument_result_policy_and_approval_content
    - persistence_delivery_worker_and_evaluation_content
    - content_free_export_health
