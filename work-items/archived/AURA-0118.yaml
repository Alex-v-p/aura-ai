acceptance_criteria:
  - A Core-owned RunEvidenceRecorder public port accepts only closed evidence records and returns immediately after a bounded queue offer; disabled capture uses an inert implementation and no recording call can await network storage acknowledgement or downstream health.
  - A separate bounded background exporter publishes run-evidence-v1 envelopes to aura.runs.evidence.v1 with stable event and evidence IDs monotonic per-run sequence distinct delivery IDs and attempts canonical bytes verified digest and byte count and bounded retry shutdown and overflow behavior.
  - A distinct owner-controlled full_content policy defaults disabled and validates bounded queue capacity retry and drain settings; existing AURA_OBSERVATORY_EXPORT_ENABLED OTLP configuration cannot enable evidence capture.
  - Explicit serializers record exact admitted request or trigger compiled system and persona prompt admitted conversation context memory and document chunks routing decisions model-visible attachments displayed thinking generation and synthesis output tool arguments and results policy approval and execution outcomes persistence delivery worker and evaluation inputs and outputs where those boundaries apply.
  - Initial conversation existing-conversation message edit and branch regeneration retry approval-resumed retrieval tool synthesis visible-thinking and evaluation flows retain stable run trace span parent and sequence lineage and do not fabricate steps that did not occur.
  - Only displayed ModelThinkingDelta content is eligible; provider-hidden chain-of-thought is never requested inferred reconstructed or represented.
  - Every serializer is closed and bounded and rejects a prohibited oversized malformed or incompletely inspected item whole before queueing while recording a bounded content-free excluded partial or dropped signal that does not claim exact content was captured.
  - Text JSON image and PDF evidence use the contract-defined admission modes and canonical byte domains; binary evidence is never accepted from filename media-type or caller assertions alone.
  - Retry worker redelivery and approval resume preserve stable logical identity while each transport attempt receives a distinct delivery identity; exact duplicates are safe and changed immutable evidence produces a content-free collision signal.
  - Queue saturation serialization rejection publisher disconnection missing JetStream downstream outage cancellation and shutdown timeout never change the normal run result state events persistence tool side effects evaluation outcome or response delivery.
  - API worker and isolated evaluation composition roots inject the recorder without an Observatory client dependency and close or drain it within bounded lifecycle handling.
  - Scheduler and reminder polling without a persisted Run remain outside capture and are covered by a regression preventing fabricated run evidence.
  - A dedicated aura.platform.run_evidence_export component manifest declares the run-evidence input bounded queue nonblocking behavior content-free metrics finite dimensions dependencies retention replay and failure semantics without weakening any metadata-only manifest.
  - Content-free telemetry covers serialize queue-offer and transport-publish spans exporter outcomes drops latency queue depth and capacity using only ADR-0017 dimensions and error classes; evidence IDs kinds media digests bytes content owner data and exception text never enter telemetry.
  - Tests cover canonical serialization every applicable boundary exact visible evidence stable sequencing retry idempotency secret rejection media admission backpressure cancellation shutdown outage isolation configuration composition and the absence of evidence from OTLP SSE logs Core run events and existing outbox payloads.
  - Architecture validation proves no Aura Web Observatory service frontend contract migration deployment or protected-baseline changes and assigns every new Core module exactly one registry owner with explicit dependencies.
  - The pre-existing migration 0015 lint violation is corrected by formatting only with no SQL semantic schema revision or migration-order change.
