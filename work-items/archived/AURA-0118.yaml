id: AURA-0118
title: Capture governed Core run evidence without execution coupling
status: integrated
change_class: repository_governance
intent: >
  Implement the Core-owned producer authorized by ADR-0017 so every persisted
  Core run records exact model-visible and executor-visible evidence through
  explicit serializers and a bounded nonblocking one-way channel, while Core
  remains fully usable when capture, transport, or all downstream consumers
  are unavailable.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/agents-and-execution.md
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/open-decisions.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - docs/adr/0017-governed-production-run-evidence.md
    - AURA-0117 defines the closed run-evidence-v1 producer contract and authorizes this runtime capture phase.
    - The Core public boundary is a RunEvidenceRecorder port whose recording operation is synchronous bounded and nonblocking; transport runs only in a bounded background exporter.
    - The concrete channel is the dedicated durable JetStream subject aura.runs.evidence.v1 and never reuses run commands the Core transactional outbox OTLP or the transient thinking subject.
    - Core publishes evidence one way and never imports calls reads from names or waits for Aura Observatory; publish acknowledgement affects only exporter retry and completeness telemetry.
    - Full-content capture is disabled by default and requires the distinct owner-controlled AURA_RUN_EVIDENCE_CAPTURE_POLICY=full_content setting; existing Observatory or OTLP export settings never enable it implicitly.
    - Queue capacity payload limit retry limit and shutdown drain are bounded configuration with safe fixed maxima; queue pressure or transport failure drops evidence and records content-free completeness signals without changing run state output latency or delivery.
    - Initial message existing-conversation message edit branch regeneration retry approval resume native tools retrieval synthesis visible thinking and evaluation executions share stable run correlation and explicit boundary serializers where applicable.
    - Scheduler and reminder polling are not fabricated as runs when no persisted Core run identity exists; a future automation run boundary must provide a real run identity before evidence capture.
    - Existing metadata-only telemetry component manifests remain metadata-only; the separate run-evidence component alone declares content capture and its telemetry is content-free.
    - A pre-existing Ruff line-length violation in migration 0015 may receive a formatting-only SQL string wrap so the required full Core lint gate can run green; migration behavior and history must remain byte-for-byte equivalent after Python string evaluation.
  contracts:
    - contracts/events/runs/v1/run-evidence.schema.json
