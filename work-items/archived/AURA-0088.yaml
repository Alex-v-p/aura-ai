security_privacy:
  applicable: true
  concerns:
    - Metadata v2 remains a closed allowlist and rejects prompts responses memories documents filenames tool arguments results credentials endpoints bearer tokens owner identity arbitrary attributes and free-form revision values.
    - Prompt correlation uses only an immutable prompt bundle revision identifier and never prompt content compiled text or a content-derived value exposed through the comparison API.
    - Model configuration image and policy markers are bounded validated identifiers and remain high-cardinality query fields rather than metric labels logs URLs SSE payloads or browser persistence.
    - Every comparison resource requires the existing configured-owner session and accepts only two validated run UUIDs with bounded parameterized ClickHouse work.
    - Missing and unavailable markers remain explicit so absence cannot be misrepresented as equality and partial retention cannot be presented as a complete comparison.
    - Authenticated comparison responses use no-store remain memory-only and contain no telemetry payload text source identifiers beyond selected run trace component deployment and approved revision metadata.
    - Retention immediately removes source observations and therefore removes their comparison evidence without preserving a derived service or browser copy.
    - Core exporter failure buffering retry and drops remain isolated so Observatory or Collector failure cannot delay Core startup readiness requests workers or scheduling.
  data_classes:
    - operational_telemetry_metadata
    - deployment_version_metadata
    - configuration_revision_metadata
    - policy_revision_metadata
