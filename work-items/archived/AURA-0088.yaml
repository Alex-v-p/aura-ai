acceptance_criteria:
  - A closed JSON Schema 2020-12 metadata-observation v2 adds only bounded optional deployment image configuration model agent prompt-bundle and policy revision markers while v1 remains unchanged and Observatory accepts both versions during coordinated rollout.
  - Core exports v2 markers only from already validated deployment configuration and internal trace metadata through the independent bounded OTLP path and never adds them to metric labels structured logs or synchronous request dependencies.
  - An idempotent ClickHouse migration upgrades empty and existing Observatory schemas with nullable explicit marker columns and reruns safely without changing PostgreSQL or Core storage.
  - Observatory ingestion maps both normalized and standard OTLP forms into the correct contract rejects unknown marker attributes malformed identifiers content-like values and mixed-version payloads and preserves duplicate malformed rejection and storage-failure accounting.
  - The backward-compatible observatory-v1 API compares exactly two distinct owner-selected run UUIDs using fixed observation span measurement scan and execution bounds and returns Cache-Control no-store.
  - Comparison results expose each side status timing outcome model deployment git image configuration component-version and approved policy revision metadata together with deterministic equal changed missing and unavailable states.
  - Component measurements compare only matching declared measurement and unit pairs preserve zero separately from missing values and provide absolute deltas only when both finite values and units are compatible.
  - Trace alignment is deterministic and represents left-only right-only missing-parent cyclic duplicate truncated and retained-partial spans explicitly without fabricating lineage or collapsing incompatible component operations.
  - Unsupported or absent correlation metadata is reported as unavailable rather than inferred from deployment IDs component versions providers or observation order.
  - Query work remains parameterized and bounded in ClickHouse behind the Observatory query port; the application process never hydrates sorts or joins unbounded observation history and PostgreSQL remains uninvolved in high-cardinality comparisons.
  - Comparison query duration outcome partial state freshness scan limits and unavailable-marker counts use existing bounded self-monitoring without high-cardinality labels or metadata values in logs.
  - Observatory Web provides a dedicated Run comparison workspace with keyboard-operable left and right run selection clear swap and reset actions dense but readable summary component measurement and aligned-trace views and accessible text or tables equivalent to visual timing differences.
  - The comparison workspace preserves selection and focus through refresh uses text and structure in addition to colour and supports narrow mobile tablet desktop 200 percent and 400 percent zoom dark mode and prefers-reduced-motion.
  - Browser behavior covers loading empty same-run validation partial stale disconnected malformed rejected unavailable-marker and service-unavailable states with bounded retry and no authenticated API persistence or sensitive URL parameters.
  - Metadata-only SSE invalidation refreshes an open comparison without carrying run IDs markers or comparison data and cannot create an unbounded refresh loop.
  - Retention deletion removes comparison evidence on the next snapshot while component and deployment catalogues service configuration sessions and content-free deletion audits remain preserved.
  - Unit contract migration exporter ingest adapter privacy frontend accessibility mocked-browser and real full-stack tests cover v1 compatibility v2 allowlists outage isolation two-run bounds comparison math trace alignment missing markers retention responsive keyboard screen-reader and reduced-motion behavior.
  - No Core domain database provider dependency package image protected golden result repository baseline cloud integration or external source-control registry call is introduced.
