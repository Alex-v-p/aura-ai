id: AURA-0088
title: Add metadata-safe run comparison and deployment correlation
status: integrated
change_class: contract
intent: >
  Let the Observatory owner compare a bounded set of production runs and
  correlate operational differences with versioned deployment component model
  configuration and policy metadata while keeping telemetry content-free and
  preserving Core independence.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/aura-ai-envisioned-feature-catalogue.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/foundations.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Introduce a versioned metadata-observation v2 contract rather than widening the closed v1 payload in place; Observatory continues accepting v1 during coordinated rollout and Core emits v2 only through the optional asynchronous exporter.
    - The v2 extension may carry only bounded image and configuration versions plus an explicit closed set of model agent prompt and policy revision markers already known to Core; prompt text hashes derived from content arbitrary attributes and owner or conversation content are prohibited.
    - Store v2 markers as nullable explicit ClickHouse columns through an idempotent Observatory-owned migration; do not encode high-cardinality revision identifiers as metric labels or copy them into PostgreSQL catalogues.
    - Compute comparisons on demand through a purpose-built bounded query port; do not persist comparison snapshots hydrate unbounded observation history or introduce a general-purpose query language.
    - Compare exactly two distinct run identifiers with deterministic left and right roles maximum observation span and measurement limits a fixed scan limit and an execution deadline.
    - Align spans using stable component operation and structural lineage keys while preserving duplicate unmatched missing-parent cyclic truncated and partially retained evidence explicitly; never infer absent spans or revision markers.
    - Correlation reports distinguish equal changed missing and unavailable markers and expose only metadata-safe git image configuration component model and policy versions.
    - Existing metadata SSE remains an invalidation signal only; comparison results are fetched through owner-authorized no-store REST and remain memory-only in the browser.
    - Follow repository-pinned OpenTelemetry JSON Schema OpenAPI ClickHouse Angular and WCAG guidance linked from the authoritative technology stack without adding or upgrading dependencies.
    - Observability review identified aura.observatory.telemetry_storage as an already declared affected component whose manifest still names only metadata-observation-v1 and lacks the AURA-0088 comparison privacy evaluators; authorize the bounded manifest alignment to the accepted v1-or-v2 metadata contract and required evaluator declarations without changing its ownership capture retention dependency or metric boundaries.
