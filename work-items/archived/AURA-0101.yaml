contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: aura-core
  owning_module: aura_core.platform.outbox
observability:
  applicable: true
  affected_components:
    - aura.execution.run_coordinator
  required_metrics: []
  required_evaluators:
    - fresh_aura_runs_stream_creation
    - concurrent_stream_creation_recovery
    - existing_stream_subject_reconciliation
  capture_policy: bounded stream names and subject identifiers only
security_privacy:
  applicable: true
  concerns:
    - The normal Core identity receives only the exact JetStream account-info API subject required by the installed client; no wildcard or evaluation subject is added.
    - Stream-list responses are discarded bounded operational configuration metadata and grant no message reads stream deletion purge or evaluation management.
    - Bootstrap dispatch and runner identities retain their existing narrower duties and receive no account-info permission.
    - NATS passwords remain file-injected and absent from arguments logs reports and committed files.
  data_classes:
    - operational_metadata
required_agents:
  implementation:
    - core_worker
    - platform_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
    - observability_steward
    - security_privacy_reviewer
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 5
  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - The default NatsRunConsumer creates AURA_RUNS with each requested subject exactly once and no duplicate-subject provider error on a fresh NATS volume.
  - A custom run subject is preserved alongside the default run command subject in stable order.
  - An existing AURA_RUNS stream missing an authorized requested subject is updated in place without deleting messages or removing subjects.
  - The normal Core NATS identity can perform exact $JS.API.INFO and $JS.API.STREAM.LIST requests and exact create info next and acknowledgement operations for the run memory approval-resume document-process and document-delete durable/filter pairs, with no JetStream API or consumer wildcard.
  - No identity retains the obsolete $JS.API.ACCOUNT.INFO grant, the normal identity drops obsolete CONSUMER.DURABLE.CREATE while evaluation bootstrap retains only the legacy subjects its script actively uses, and normal Core remains denied evaluation management deletion and purge.
  - A concurrent creation loss is recovered only after bounded lookup confirms the named AURA_RUNS stream exists; persistent absence or incompatible ownership fails closed without fabricating success.
  - The supported local HTTP Docker launcher leaves aura-core-worker running without duplicate-subject stream-not-found restart loops while Aura Core API and Observatory remain healthy.
  - No public contract migration provider dependency stream deletion subject reassignment cross-service database access or protected baseline change is introduced.
