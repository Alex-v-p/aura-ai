id: AURA-0101
title: Restore fresh JetStream worker startup
status: integrated
change_class: bugfix
intent: >
  Make Aura Core's run consumer create or reconcile its owned AURA_RUNS stream
  deterministically on a fresh NATS volume so the supported Docker launcher
  keeps Core workers running while preserving existing stream ownership,
  subjects, messages, and Core/Observatory isolation.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications: []
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - AURA_RUNS remains Core-owned and is created or updated through the existing JetStream adapter without deleting streams reassigning subjects or introducing a bootstrap authority.
    - Requested subjects are deduplicated in stable order before stream creation so the default run subject is not submitted twice.
    - A lost concurrent creation race may reconcile only after the named AURA_RUNS stream becomes visible through a bounded retry; absent or differently owned subject state fails closed.
    - The normal Core NATS identity receives only the exact current-client account stream-list AURA_RUNS stream and five durable-consumer management subjects required by its runtime; obsolete normal-client API subjects are removed while evaluation bootstrap keeps its separately used legacy bootstrap subjects.
    - AURA-0100 separately repairs the supported Observatory launcher and remains the owning record for migration Compose Garage credential and healthcheck changes.
  contracts: []
feature_references: []
ownership_zones:
  - services.aura-core.nats-outbox
  - deploy.nats.authorization
  - evaluation.core-fresh-stream-startup
  - delivery.aura0101
allowed_paths:
