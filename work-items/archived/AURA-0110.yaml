  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0110.yaml
  - python3 tooling/architecture/validate-repository-shape.py
  - python3 tooling/architecture/validate-module-registry.py
  - python3 tooling/architecture/validate-import-boundaries.py
  - python3 tooling/architecture/validate-service-isolation.py
  - python3 tooling/architecture/validate-contract-changes.py --work-item work-items/active/AURA-0110.yaml
  - python3 tooling/architecture/validate-baseline-protection.py --work-item work-items/active/AURA-0110.yaml
  - UV_CACHE_DIR=/tmp/aura-0110-uv uv run --project services/aura-observatory pytest -q services/aura-observatory/tests/test_aura0110_*.py
  - UV_CACHE_DIR=/tmp/aura-0110-uv uv run --project services/aura-observatory pytest -q services/aura-observatory/tests/test_aura0093_definitions.py services/aura-observatory/tests/test_aura0095_backend.py services/aura-observatory/tests/test_aura0095_backend_comprehensive.py services/aura-observatory/tests/test_aura0110_*.py
  - UV_CACHE_DIR=/tmp/aura-0110-uv uv run --project services/aura-observatory pytest -q services/aura-observatory/tests
  - UV_CACHE_DIR=/tmp/aura-0110-uv uv run --project services/aura-observatory ruff check services/aura-observatory/src/aura_observatory/evaluation_query.py services/aura-observatory/tests/test_aura0110_*.py
  - UV_CACHE_DIR=/tmp/aura-0110-uv uv run --project services/aura-observatory pyright services/aura-observatory/src/aura_observatory/evaluation_query.py services/aura-observatory/tests/test_aura0110_*.py
  - git diff --check
baseline_changes_allowed: false
human_approval_required: false
open_decisions: []
