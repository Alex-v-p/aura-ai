  - work-items/archived/AURA-0103.yaml
  - work-items/handoffs/AURA-0103-*.yaml
  - work-items/reviews/AURA-0103-*.yaml
  - work-items/integration/AURA-0103.yaml
  - frontend/libs/observatory/src/lib/features/overview/overview.component.ts
