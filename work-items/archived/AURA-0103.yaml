contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators:
    - observatory_overview_surface_padding
    - observatory_overview_responsive_reflow
  capture_policy: bounded visual observations only; no credentials session material or private payload capture
security_privacy:
  applicable: false
  concerns:
