id: AURA-0103
title: Restore Observatory Overview surface padding
status: integrated
change_class: refactor
intent: >
  Restore deliberate horizontal and vertical padding inside the separate Aura
  Observatory Overview surfaces so headings, summaries, health metrics, and
  history content share a coherent inset at wide and narrow viewports, while
  preserving the accepted shell, sidebar, domain behavior, accessibility,
  public contracts, and uncommitted AURA-0098 work.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/design/foundations.md
    - docs/design/components-and-interactions.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - Owner feedback on 2026-10-23 identifies the Observatory Overview content as visually under-padded; the accepted sidebar and other routes remain unchanged.
    - The live shell provides responsive outer page gutters, but Overview hero, ingest, and health surfaces explicitly zero their horizontal padding and therefore break internal alignment with metric cards.
    - The correction is owned by the Overview feature component and must not use shell-level private selectors or change stores, API requests, authentication, persistence, or contracts.
    - Browser evidence remains ephemeral and excludes credentials, cookies, tokens, private payloads, and authenticated screenshots from committed artifacts.
    - Existing AURA-0098 changes and blockers remain preserved and independently attributable.
  contracts: []
feature_references: [OBS-002, OBS-006]
ownership_zones:
  - frontend.observatory.monitoring-surfaces
  - evaluation.observatory-overview-spacing
  - delivery.aura0103
allowed_paths:
