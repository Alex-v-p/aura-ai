  max_parallel_agents: 5
  max_parallel_writers: 1
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - At wide desktop the System health Ingest health health cards and history region have a deliberate internal inset and align coherently with the padded metric cards instead of placing content against surface edges.
  - Overview preserves the existing responsive outer shell gutter and does not change the sidebar shell tokens navigation stores contracts requests or other Observatory routes.
  - Mobile tablet and 320-pixel 400-percent-equivalent reflow retain useful padding without clipped content uncontrolled document overflow or giant whitespace.
  - Loading error empty ready stale disconnected partial and unavailable Overview states retain their existing semantics focus order status roles actions and bounded presentation.
  - A focused browser assertion verifies positive horizontal padding on visible Overview surfaces without treating the assertion as an aesthetic verdict.
  - Real-browser before and after review is completed at wide desktop and narrow reflow; no authenticated screenshot or private operational payload is committed.
  - Existing AURA-0098 changes remain present and independently attributable.
