contracts:
  changes_allowed: true
  affected:
    - observatory-v1
  compatibility_requirement: backward_compatible
data:
  migration_required: false
  owning_service: aura-observatory
  owning_module: operational-analytics
observability:
  applicable: true
  affected_components:
    - aura.observatory.query_api
    - aura.observatory.telemetry_storage
  required_metrics:
    - observatory_query_duration_ms
    - observatory_query_outcome
    - observatory_query_freshness_lag_ms
  required_evaluators:
    - operational_analytics_bounds
    - operational_analytics_semantics
    - operational_analytics_accessibility
    - observatory_self_monitoring
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Analytics accept only allowlisted fields from the closed metadata-only observation contract and never expose prompts responses memories documents filenames tool arguments results credentials endpoints bearer tokens owner identity or arbitrary attributes.
    - Owner authorization applies to every analytics resource and filters remain bounded validated and parameterized so dimension values cannot alter ClickHouse queries or create unbounded work.
    - Error analysis exposes bounded error classes and aggregate outcomes only; it never exposes exception messages stack traces provider payloads input cohorts or source content.
    - Sparse or missing measurements appear as unavailable rather than being inferred from another signal and small cohorts are not expanded with observation-level identifiers.
    - Authenticated analytics responses and chart data remain memory-only and are excluded from Workbox browser storage URLs screenshots test artifacts and metadata SSE payloads.
    - Retention immediately affects subsequent analytics snapshots and no derived browser or service cache may preserve deleted observation data.
  data_classes:
    - operational_telemetry_metadata
    - aggregate_operational_metrics
    - deployment_metadata
