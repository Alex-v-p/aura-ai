id: AURA-0087
title: Add bounded Observatory operational analytics
status: integrated
change_class: contract
intent: >
  Give the Observatory owner bounded, privacy-preserving operational trends and
  focused model, queue, retrieval, tool, memory, and automation views without
  widening production telemetry capture or coupling Aura Core to Observatory.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/aura-ai-envisioned-feature-catalogue.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/foundations.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Use only the existing metadata-observation v1 fields and closed dimensions; do not add arbitrary attributes or change Core telemetry in this work item.
    - Keep high-cardinality analytical reads in Observatory ClickHouse behind the existing query port; do not create another data authority or hydrate unbounded observation history in the application process.
    - Use allowlisted UTC windows, bucket sizes, measurements, units, filters, facets, groupings, series counts, point counts, scan limits, and execution limits rather than accepting a general-purpose query language.
    - Aggregate a measurement only within one declared unit and expose percentile method, sample count, partial state, freshness, and unavailable signals explicitly; never infer saturation, quality, retryability, or success from absent telemetry.
    - Existing SSE remains a metadata-only invalidation channel; analytical series are fetched through owner-authorized bounded REST snapshots and are never embedded in event URLs or persisted by the browser.
    - The existing aura.observatory.query_api manifest may receive content-only evaluator declarations for this work item; no component identity metric dependency capture retention cardinality service or deployment declaration may change.
    - Follow the repository-pinned ClickHouse 25.8, Angular 22, OpenAPI 3.1, and WCAG 2.2 guidance linked from the authoritative technology stack; no dependency or image change is authorized.
  contracts:
    - contracts/openapi/observatory-v1.yaml
    - contracts/telemetry/v1/metadata-observation.schema.json
