acceptance_criteria:
  - The backward-compatible observatory-v1 REST contract exposes a defined metric catalogue and bounded operational analytics query resources with explicit UTC snapshot time window bucket unit sample count freshness partial-state and unavailable-signal semantics.
  - Every analytics request uses an allowlisted measurement and unit with a default 24-hour UTC window a maximum 31-day window deterministic bucket selection no more than 200 points per series no more than 12 returned series and bounded facets groups scans and execution time.
  - ClickHouse performs time bucketing percentile throughput outcome error and saturation aggregation through purpose-built parameterized adapter queries; the application process never loads or sorts an unbounded observation table.
  - Latency summaries expose p50 p90 p95 and p99 with a documented stable method and sample count while throughput uses an explicit rate interval and no response combines incompatible measurement units.
  - Error analysis groups only bounded metadata such as component operation provider errorClass outcome and deployment and represents unknown missing and partially retained data without returning exception text payloads identifiers or arbitrary dimensions.
  - Saturation and focused model queue retrieval tool memory and automation summaries are populated only from their declared measurements; unsupported signals are identified as unavailable rather than synthesized and every value carries a clear unit.
  - The analytics query service reports duration outcome and observation freshness through existing bounded Observatory self-monitoring without logging request values query text or telemetry content.
  - Existing manual retention removes source observations from all subsequent analytical summaries and series while component and deployment definitions remain unaffected; stale in-flight browser responses cannot restore deleted data.
  - Observatory Web provides a Metric explorer plus focused model queue retrieval tool memory and automation views with bounded time controls filter summaries freshness and partial-data explanations.
  - Every chart has an adjacent semantically equivalent table clear title unit legend tooltip or focused detail and non-colour status labels; all filters series selection and detail access are keyboard operable with visible focus.
  - Charts and tables reflow at mobile tablet desktop 200 percent and 400 percent zoom support light and dark themes preserve reading order and usable tables and remove nonessential animation under prefers-reduced-motion.
  - Browser behavior covers loading empty sparse partial stale disconnected malformed rejected and service-unavailable responses provides bounded retry and never persists authenticated API or chart data.
  - REST refresh after metadata-only SSE invalidation updates affected analytics without credentials filters or series data in event URLs and reconnect catch-up cannot produce an unbounded refresh loop.
  - Unit contract adapter privacy retention frontend accessibility mocked-browser and real full-stack tests cover bucket boundaries percentile semantics throughput zero-versus-unavailable error grouping out-of-order and late data mixed units scan limits injection attempts sparse signals responsive layouts keyboard use screen-reader alternatives reduced motion and Core usability while Observatory is stopped.
  - No Core module telemetry contract database migration dependency package image protected golden result or repository baseline changes are introduced.
