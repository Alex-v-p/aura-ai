id: AURA-0006
title: Define the authoritative Aura technology stack
status: integrated
change_class: repository_governance
intent: >
  Record the owner-selected implementation stack, protocols, provider
  boundaries, version policy, and accepted architecture decisions for every
  planned Aura workload without scaffolding product code or infrastructure.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/repository-structure.md
  specifications:
    - docs/specifications/product-overview.md
    - docs/specifications/agents-and-execution.md
    - docs/specifications/memory-and-knowledge.md
    - docs/specifications/tools-automation-and-integrations.md
    - docs/specifications/clients-and-voice.md
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/open-decisions.md
  decisions:
    - User-approved Authoritative Aura Technology Stack plan (2026-10-04)
  contracts: []
feature_references:
  - DEV-001
  - DEV-002
  - DEV-003
  - DEV-004
  - DEV-005
  - DEV-006
  - DEV-020
  - DEV-028
  - DEV-029
  - OPS-001
  - OPS-002
  - OPS-003
  - OPS-009
  - OPS-021
  - OPS-029
  - OPS-030
ownership_zones: [repository.governance, documentation.architecture]
allowed_paths:
  - docs/architecture/**
  - docs/adr/**
  - docs/specifications/**
  - docs/README.md
  - docs/context-routing.md
  - work-items/**
forbidden_paths:
  - frontend/**
  - services/**
  - contracts/**
  - packages/**
  - evaluations/**
  - deploy/**
  - infra/**
  - satellites/**
  - extensions/**
  - scripts/**
  - .github/**
  - .codex/**
  - .agents/**
  - tooling/architecture/**
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - OIDC and BFF session boundaries
    - secret and provider credential isolation
    - extension process isolation
    - local-first model and telemetry privacy
    - policy-gated offline and captured content
  data_classes:
    - identity and credential metadata
    - user-authored content and artifacts
    - model and tool payloads
    - telemetry and evaluation captures
required_agents:
  implementation: [platform_worker]
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
  integration: false
execution:
  parallelism_class: local
  max_parallel_agents: 1
  max_parallel_writers: 1
  model_tier: deep
  model_escalation_allowed: false
  escalation_reason_required: true
acceptance_criteria:
  - An authoritative technology matrix maps every envisioned feature area to an approved tool category or replaceable provider boundary.
  - Accepted ADRs record the selected toolchain, data and coordination services, Aura-owned execution boundary, security model, and client and voice protocols.
  - The architecture baseline and focused specifications agree with the selected stack and no resolved choice remains listed as open.
  - Remaining product, privacy, retention, authorization, calibration, licensing, and escalation decisions remain explicitly open.
  - Supported major lines are documented while exact dependency versions are reserved for future lockfiles.
  - No feature-catalogue item is promoted into implementation scope and no product code, manifest, contract, deployment, or infrastructure file is created.
  - Official research sources are attributed with access date 2026-10-04 and licensing cautions are recorded.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0006.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0006.yaml
  - python3 -m unittest discover -s tooling/architecture/tests -v
  - python3 tooling/architecture/validate-repository-shape.py
  - git diff --check
baseline_changes_allowed: false
human_approval_required: true
open_decisions: []
