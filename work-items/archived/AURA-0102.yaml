id: AURA-0102
title: Refine Observatory page spacing and full-width composition
status: integrated
change_class: refactor
intent: >
  Refine every page in the separate Aura Observatory product so its full-width
  desktop composition, padding, spacing, control grouping, empty states, and
  dense operational surfaces feel deliberate and cohesive, while preserving
  the existing sidebar, domain behavior, public contracts, accessibility,
  privacy boundaries, and uncommitted AURA-0098 resilience work.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/design/README.md
    - docs/design/foundations.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-requested 2026-10-23 refinement targets only the separate Observatory pages; the accepted sidebar and normal Aura product remain unchanged.
    - The rendered full-width audit found no active page max-width, inconsistent outer gutters and section rhythm, over-stretched controls and notices, crowded component cards and authoring rows, weak empty-state composition, and an overly narrow retention workflow.
    - Observatory will use its existing content-width token with responsive page gutters, a 24-pixel internal and 32-pixel major-section rhythm where practical, bounded prose and control groups, compact status notices, and selective surfaces instead of indiscriminate cards.
    - Broad data pages may use the full bounded canvas for tables, charts, topology, and comparisons; forms, explanations, empty states, and destructive workflows use narrower readable measures within that canvas.
    - Existing component stores, generated clients, API contracts, navigation model, request semantics, and service-owned data remain unchanged.
    - Real-browser review may display live authenticated operational metadata ephemerally, but credentials, cookies, tokens, private payloads, screenshots, traces, and browser persistence are excluded from committed evidence and reports.
    - Existing AURA-0098 files and hunks are preserved and its independent blockers are not bypassed or claimed as resolved.
  contracts: []
