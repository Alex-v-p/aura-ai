acceptance_criteria:
  - Every Observatory destination Overview Runs Trace Components Analytics Compare Evaluations Experiments Operations and Retention is visually inspected at 1600-by-1000 full width before and after implementation; route-specific criticisms and resolutions are recorded without storing authenticated screenshots.
  - The active main content frame uses consistent responsive outer gutters and the existing bounded content-width token while preserving wide space for dense tables charts traces topology and comparisons.
  - Page headers major sections inner groups forms tables empty states and action rows use a coherent spacing scale with neither cramped controls nor excessive full-width voids; giant full-width buttons and dominant warning bands are removed where they do not express proportional importance.
  - Overview and dense health history prioritize current health and scanability; Runs and Trace present useful bounded empty states and next actions; Components keeps cards legible without crowding identifiers or repeating dominant degradation notices.
  - Analytics and Compare group selectors and actions into readable bounded workflows; query metadata result tables charts and degraded states remain scannable across the wide canvas.
  - Evaluations and Experiments use compact summaries navigable tabs progressive disclosure and consistent authoring/list spacing without changing persisted resource selection or mutation semantics.
  - Operations uses coherent workspace tabs summary composition preset and table rhythm; Retention gains sufficient explanatory space and visually distinguishes ordinary disabled primary and destructive actions while keeping its accessible confirmation flow.
  - The accepted sidebar navigation labels grouping interaction and visual treatment remain unchanged apart from any necessary main-content gutter relationship.
  - Switching Observatory destinations restores the new page to its top rather than retaining a stale scroll offset; destination labels, grouping, and navigation semantics remain unchanged.
  - Desktop laptop tablet mobile and 320-pixel 400-percent-equivalent reflow retain no uncontrolled document overflow clipped primary action or inaccessible content, and keyboard reduced-motion dark-mode and forced-color behaviors remain valid.
  - Existing automated accessibility responsive unit production and Storybook protections remain green, with focused browser assertions added only where they meaningfully protect page composition or state hierarchy rather than claiming aesthetic correctness.
  - Existing AURA-0098 changes remain present and attributable; no backend contract store provider migration baseline private SQL adapter call weakened check fabricated evidence or blocked acceptance claim is introduced.
  - Each browser-visible implementation slice receives rendered Aura UX UI review; blocking findings are corrected by the owning frontend worker and verified by the same reviewer before final integration.
