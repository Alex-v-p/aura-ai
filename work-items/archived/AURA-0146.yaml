    - AURA-0146 must not enter implementation until AURA-0145 is reviewed and integrated.
    - The tool result is admission-only and settles within the existing thirty-second ceiling; research execution client subscription and completion delivery remain outside the originating run.
    - Completion append and notification have independent durable delivery records so notification failure never duplicates the transcript append.
    - Conversational and dedicated research origins are persisted with authoritative research admission and terminal delivery is reconciled from that source-owned truth before acknowledgement.
    - ADR-0018 authorizes the additive research-notification contract variant; no new deployable, provider, or architectural exception is introduced.
