id: AURA-0146
title: Integrate conversational research and completion delivery
status: integrated
change_class: repository_governance
intent: >
  Add admission-only web.research@1 conversational behavior, deny-by-default
  agent policy grants, stable research activity references, client subscription
  semantics, and idempotent exactly-once completion append plus independent
  notification delivery without extending run lifetimes.
