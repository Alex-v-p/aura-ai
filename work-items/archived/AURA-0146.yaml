security_privacy:
  applicable: true
  concerns:
    - web.research@1 requires the exact research:run grant and remains denied for custom agents until an authorized immutable policy revision enables it.
    - Admission results contain only opaque task reference mode and admission state; questions queries sources URLs excerpts artifact content and provider diagnostics never enter tool events or telemetry.
    - Completion append reauthorizes the originating owner and conversation lineage and accepts only coordinator-validated citations and artifact references.
    - Unknown append outcomes reconcile by unique delivery key before retry; delete-versus-delivery serialization prevents deleted research evidence from reappearing in transcripts.
    - Notification delivery is independently idempotent and cannot expose private answer source or artifact content in event payloads logs URLs or ordinary telemetry.
  data_classes:
    - opaque research task artifact run and conversation lineage references
    - owner-private compact cited completion answer
    - content-free durable append and notification delivery records
    - metadata-only tool and completion observations
