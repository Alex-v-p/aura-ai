  escalation_reason_required: true
acceptance_criteria:
  - web.research@1 is registered under the exact research:run grant, custom agents remain deny-by-default, and immutable agent and tool-policy revisions preserve historical run truth.
  - Each authorized tool call admits or identifies exactly one durable research task by idempotency key and returns only taskRef mode and admissionState within the existing thirty-second ceiling.
  - The originating run settles after admission acknowledgement and never waits for research completion, holds a worker lease open, invokes a second synthesis turn, or creates a second task or assistant writer.
  - Conversation messages and run snapshots expose additive stable research activity task artifact origin and validated web-citation references while older clients may omit or ignore them.
  - Auto transitions from interactive to detached client subscription after thirty seconds without inventing a new Core run state; Quick may complete while subscribed and Deep and Agent-led detach by default.
  - Terminal research delivery appends one compact cited answer task state and report-artifact link to the originating conversation using a durable unique delivery key and reconciles unknown append outcomes before retry.
  - Notification delivery is independently durable and idempotent, occurs after append settlement, and can retry without duplicating the transcript append or research task.
  - Conversational and dedicated origins are persisted atomically with research admission; terminal processing reconciles a missing delivery record before acknowledgement, with conversational append-plus-notification and dedicated notification-only behavior.
  - Delivery consumes only a narrow authoritative terminal snapshot and a source-owned deletion/version fence proves current owner, origin lineage, validated citations, and authorized task artifacts before any append or notification settlement.
  - Aura v1 and the versioned automation notification event schema add backward-compatible closed research-notification variants, and the generated Aura client remains synchronized.
  - Completion deletion retry reconnect notification failure worker restart concurrent terminal events and duplicate delivery tests prove exactly-once transcript semantics and truthful recoverable state.
  - interaction.research_delivery exposes a deliberate public.py application boundary and the Platform Worker registers its allowed public imports and dependency direction in tooling/architecture/modules.yaml without changing product behavior.
  - aura.interaction.research_completion_delivery@1 implements its exact typed boundary span dependency metric finite-dimension replay privacy and metadata-only capture contract; Observatory outage cannot delay or fail delivery.
  - No new research planning fetching provider deployment Task Center projection frontend route public artifact publication or protected baseline change occurs; the only contract change is the additive research-notification variant authorized above.
