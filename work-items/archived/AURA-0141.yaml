id: AURA-0141
title: Define research artifact and durable task contracts
status: integrated
change_class: repository_governance
intent: >
  Add backward-compatible Aura API, lifecycle-event, citation, and generated
  client contracts for governed research, generated text artifacts, and the
  federated Task Center without implementing persistence, providers, runtime
  behavior, or frontend product surfaces.
