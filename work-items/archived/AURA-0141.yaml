    - docs/adr/0017-governed-production-run-evidence.md
    - docs/adr/0018-governed-web-research-providers.md
    - work-items/archived/AURA-0140.yaml
    - All changes are additive and existing clients may omit or ignore new fields.
    - Artifact creation and revision append remain internal Core application APIs; the public API exposes no upload endpoint.
    - Task invalidations contain source kind identifier and version only; owner and source state are resolved through source-owned public snapshot queries in AURA-0143.
