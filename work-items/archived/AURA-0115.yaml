id: AURA-0115
title: Bound completed-run inspection
status: integrated
change_class: bugfix
intent: >
  Keep a completed chat run's inspector bounded to its authoritative request
  lifecycle and display legitimate post-run work as a compact continuation
  rather than hours of sequential request steps.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/agents-and-execution.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - work-items/archived/AURA-0114.yaml
    - A terminal run's request timeline ends at its authoritative terminal lifecycle observation. Later correlated observations remain metadata-only and are summarized separately as post-run continuation activity.
    - An absent unit on the canonical run_duration_ms lifecycle measurement is interpreted as milliseconds for compatibility with existing Core telemetry; no other missing measurement unit is inferred.
    - Aura Web remains unchanged and contains no Observatory reference, dependency, route, link, or browser communication.
  contracts:
    - contracts/openapi/observatory-v1.yaml
    - contracts/telemetry/v2/metadata-observation.schema.json
feature_references:
  - OBS-001
  - OBS-002
ownership_zones:
  - services.aura-observatory.query
  - frontend.observatory.run-inspector
  - evaluation.completed-run-inspection
  - delivery.aura0115
allowed_paths:
  - work-items/active/AURA-0115.yaml
  - work-items/archived/AURA-0115.yaml
  - work-items/handoffs/AURA-0115-*.yaml
  - work-items/reviews/AURA-0115-*.yaml
  - work-items/integration/AURA-0115.yaml
  - services/aura-observatory/src/aura_observatory/query.py
  - services/aura-observatory/src/aura_observatory/adapters/query.py
  - services/aura-observatory/tests/test_aura0115_*.py
  - frontend/libs/observatory/src/lib/features/runs/**
  - frontend/libs/observatory/src/lib/features/traces/**
  - frontend/libs/observatory/src/lib/observatory-models.ts
  - frontend/libs/observatory/src/lib/observatory-store.spec.ts
  - frontend/libs/observatory/src/lib/observatory-shell.component.spec.ts
  - frontend/apps/observatory-web-e2e/src/observatory-web.spec.ts
forbidden_paths:
  - AGENTS.md
  - .agents/**
  - .codex/**
  - .github/**
  - compose.yaml
  - deploy/**
  - docs/**
  - contracts/**
  - services/aura-core/src/aura_core/entrypoints/api/**
  - services/aura-core/**
  - services/aura-observatory/migrations/**
  - services/aura-observatory/src/aura_observatory/entrypoints/**
  - services/aura-observatory/src/aura_observatory/ports.py
  - services/aura-observatory/src/aura_observatory/composition.py
  - frontend/apps/aura-web/**
  - frontend/libs/aura/**
  - frontend/libs/platform/observatory-api-client/**
  - evaluations/**
  - tooling/architecture/**
  - pyproject.toml
  - uv.lock
  - package.json
  - pnpm-lock.yaml
contracts:
  changes_allowed: false
  affected:
    - observatory-v1 RunDetail existing fields
    - metadata-observation-v2 existing lifecycle measurements
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: aura-observatory
  owning_module: query
observability:
  applicable: true
  affected_components:
    - aura.execution.run_coordinator
    - aura.observatory.query_api
  required_metrics:
    - run_status
    - run_duration_ms
  required_evaluators: []
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - The compact continuation summary contains only existing metadata and never content.
    - No observations are deleted or silently rewritten by the presentation boundary.
    - No content enters URLs logs browser storage service-worker caches screenshots or SSE.
    - Aura Web and Observatory remain separate products with no frontend dependency or direct data exchange.
  data_classes:
    - operational_metadata
    - run_lifecycle_metadata
    - trace_lineage_metadata
required_agents:
  implementation:
    - observatory_worker
    - frontend_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
    - observability_steward
    - aura_ux_ui_reviewer
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 6
  max_parallel_writers: 3
  model_tier: balanced
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - A completed run's primary phase timeline contains only observations at or before its authoritative terminal lifecycle boundary and therefore cannot keep growing from later correlated worker telemetry.
  - Later correlated metadata remains visible as one compact post-run continuation summary with a stable count and time range, is not presented as request duration, and does not expand thousands of records by default.
  - Canonical run_duration_ms observations with an absent unit project as milliseconds in equivalent production and in-memory list/detail paths; other absent units are not inferred.
  - Completed run duration is stable, human-readable, and derived from authoritative lifecycle telemetry rather than the correlated observation window.
  - Live refresh preserves selected-run and disclosure state without appending post-terminal work to the foreground phase sequence.
  - Existing metadata-only capture disclosures remain truthful and accessible across desktop and responsive layouts.
  - Aura Web contracts migrations deployment topology retention policy and SSE payloads remain unchanged.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0115.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0115.yaml
  - python3 tooling/architecture/validate-repository-shape.py
  - python3 tooling/architecture/validate-module-registry.py
  - python3 tooling/architecture/validate-import-boundaries.py
  - python3 tooling/architecture/validate-service-isolation.py
  - python3 tooling/architecture/validate-observability.py --work-item work-items/active/AURA-0115.yaml
  - python3 tooling/architecture/validate-contract-changes.py --work-item work-items/active/AURA-0115.yaml
  - python3 tooling/architecture/validate-baseline-protection.py --work-item work-items/active/AURA-0115.yaml
  - UV_CACHE_DIR=/tmp/aura-0115-uv uv run --project services/aura-observatory pytest -q services/aura-observatory/tests/test_aura0115_*.py
  - UV_CACHE_DIR=/tmp/aura-0115-uv uv run --project services/aura-observatory ruff check services/aura-observatory/src/aura_observatory/query.py services/aura-observatory/src/aura_observatory/adapters/query.py services/aura-observatory/tests/test_aura0115_*.py
  - UV_CACHE_DIR=/tmp/aura-0115-uv uv run --project services/aura-observatory pyright services/aura-observatory/src/aura_observatory/query.py services/aura-observatory/src/aura_observatory/adapters/query.py services/aura-observatory/tests/test_aura0115_*.py
  - cd frontend && corepack pnpm exec nx test observatory
  - cd frontend && corepack pnpm exec nx lint observatory
  - cd frontend && AURA_OBSERVATORY_WEB_E2E_APP_PORT=4311 corepack pnpm exec playwright test --config apps/observatory-web-e2e/playwright.config.ts --project desktop --grep AURA-0115
  - git diff --check
baseline_changes_allowed: false
human_approval_required: false
open_decisions: []
