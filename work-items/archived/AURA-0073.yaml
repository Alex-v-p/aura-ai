id: AURA-0073
title: Use a dimension-safe Qwen model for document embeddings
status: integrated
change_class: bugfix
intent: >
  Make live document ingestion, retrieval, and citations use the installed
  Qwen3 embedding model with an explicit dimension compatible with the existing
  document vector index, while leaving memory embedding configuration and
  provider-neutral domain contracts unchanged.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/memory-and-knowledge.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - Owner-approved use of an installed Qwen embedding model instead of the existing Nomic default for documents.
    - Owner-approved qwen3-embedding:4b selection with 768-dimensional Matryoshka output so the existing vector(768) document index remains valid.
  contracts: []
feature_references: []
