acceptance_criteria:
  - Document embedding defaults to qwen3-embedding:4b and sends an explicit 768-dimensional request compatible with the existing document_chunks vector(768) column.
  - Memory embeddings and other Ollama embedding consumers retain their existing model and output dimensions unless they explicitly opt into a dimension.
  - Compose passes the documented document embedding model setting to both API and worker with qwen3-embedding:4b as the local default.
  - The Ollama adapter verifies the exact tagged Qwen model artifact and rejects malformed or wrong-dimensional responses without logging document content.
  - Hybrid retrieval never compares a Qwen query vector with chunks produced by another embedding model; incompatible chunks remain eligible only through lexical ranking until reprocessed.
  - Retrieval emits a bounded metadata-only identity_mismatch degradation signal when incompatible prior-model vectors are excluded, without placing model digests or document content in metric dimensions.
  - A real browser can upload a plain-text document, wait for ready, ask Aura a grounded question, render a validated document citation, open the authorized document detail, and preserve the expected source locator.
  - Existing document retry semantics can successfully reprocess a document that failed under the prior embedding configuration.
