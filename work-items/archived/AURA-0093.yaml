acceptance_criteria:
  - The additive evaluation-v1 schema defines closed bounded typed case expectations for exact schema retrieval context tool policy groundedness response and resource evaluation and closed bounded manual suite thresholds without invalidating existing AURA-0089 resources.
  - Dataset case suite and evaluator contracts retain stable identifiers explicit schema versions immutable resource versions timestamps capture classifications provenance digests component bindings limits and reproducibility references and reject unknown fields sensitive keys arbitrary attributes and non-finite numbers.
  - A forward-only idempotent PostgreSQL migration from empty and upgraded Observatory schemas creates normalized immutable dataset case suite evaluator binding threshold and definition-audit state without altering migrations 0001 through 0008 or reading Core tables.
  - Synthetic and owner-supplied dataset versions use explicit scopes and source classifications; owner-supplied cases require authorized opaque artifact references and synthetic cases use reviewed fixture identities without storing raw content in PostgreSQL.
  - Creating a definition with the same stable identifier version and canonical fingerprint is idempotent while conflicting immutable reuse fails closed; exact referenced dataset evaluator component and artifact versions must exist and remain compatible before a suite can be admitted.
  - Suite definitions bind exact dataset evaluator and component versions plus bounded case token byte duration provider concurrency and resource budgets and typed manual thresholds whose units directions and missing-evidence policy are explicit.
  - A closed evaluator registry resolves only reviewed identifier-version pairs and rejects unknown mismatched duplicate dynamically selected or incompatible evaluators without importing Core or executing user-controlled code.
  - Deterministic exact and schema evaluators compare typed normalized outputs and schemas with explicit mismatch evidence and stable finite scores across repeated execution.
  - Deterministic retrieval and context evaluators measure recall ranking citation support irrelevant-context resistance context use and injection resistance from bounded typed evidence while distinguishing missing partial and not-applicable evidence.
  - Deterministic tool and policy evaluators measure selection argument shape authorization denial approval boundary and consequential-action behavior without executing tools or accepting arbitrary executable policies.
  - Deterministic groundedness and response evaluators measure claim support citation consistency instruction satisfaction refusal and bounded response properties without a model judge network access or heuristic leakage of raw content.
  - Deterministic resource evaluators compare declared and observed time token byte provider and operation measurements against bounded budgets with explicit units and deterministic boundary semantics.
  - Evaluator results use the existing Observatory score port and ClickHouse score storage as finite content-free records with job case evaluator metric score outcome threshold applicability evidence reference and reproducibility metadata and never store raw content in ClickHouse.
  - Existing suitable document retrieval grounding and attachment evaluation behavior is reached through reviewed public Core evaluator or replay seams with exact component versions; no Core behavior is copied into Observatory and unknown or non-replayable components fail closed.
  - Definition and evaluator component manifests declare ownership dependencies measurements schemas evaluator identities metadata-only operational capture authorized-content data handling and manual retention without creating a deployable service.
  - Unit property contract migration upgrade idempotency concurrency privacy and boundary tests cover every evaluator family positive negative malformed missing partial contradictory threshold and resource-boundary cases and prove repeated execution is stable.
  - Privacy tests prove evaluation content credentials endpoints object locators filenames owner identity arbitrary attributes and exception text never enter PostgreSQL metadata ClickHouse scores NATS events telemetry logs metrics traces errors or committed reports and fixtures.
  - Existing AURA-0090 artifact storage AURA-0091 runner and AURA-0092 orchestration tests remain passing and Core normal tests prove the public evaluator seams do not affect API worker scheduler migration readiness or ordinary activity.
  - No HTTP OpenAPI CLI SSE Angular browser local judge experiment baseline promotion alert external delivery dependency upgrade protected golden result or repository baseline change is introduced.
