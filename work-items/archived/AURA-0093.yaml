id: AURA-0093
title: Add versioned datasets suites and deterministic evaluators
status: integrated
change_class: repository_governance
intent: >
  Let Observatory define immutable authorized evaluation datasets cases suites
  and deterministic evaluators, execute bounded repeatable scoring over typed
  Core replay evidence, and persist content-free scores while preserving Core
  ownership, metadata-only production telemetry, manual retention, and strict
  evaluation-content isolation.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/overview.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/open-decisions.md
    - docs/specifications/aura-ai-envisioned-feature-catalogue.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - The accepted architecture already assigns evaluation definitions deterministic scoring and analysis to Observatory and exact component execution to the isolated Core Evaluation Runner, so this item introduces no new service protocol provider or architectural boundary and requires no new ADR.
    - Observatory PostgreSQL is authoritative for immutable dataset case suite and evaluator definitions, authorization provenance and manual thresholds; ClickHouse remains authoritative for high-cardinality content-free scores through the existing evaluation score port; authorized raw artifacts remain solely in the existing Observatory Garage bucket.
    - Dataset and case records contain bounded identifiers capture authorization classifications digests scopes component bindings and opaque artifact references; PostgreSQL never stores prompts responses documents rubric text comments filenames object locators or other evaluation content.
    - Dataset versions are immutable and explicitly classify their source as synthetic or owner_supplied; owner-supplied content requires an authorized artifact reference while synthetic cases may use only reviewed deterministic fixture identifiers and typed expectations.
    - Suites bind exact dataset evaluator and component versions plus bounded execution budgets and explicit manual deterministic thresholds; threshold comparison reports evidence but does not create or promote a baseline.
    - The evaluation v1 contract gains only additive closed typed definitions for case expectations and suite thresholds; arbitrary mappings dynamic evaluator configuration caller-selected code and unbounded extension attributes remain prohibited.
    - Deterministic evaluators are registered by closed service-owned identifier and version, consume only typed bounded case expectations and typed replay projections, and produce finite content-free score records with stable metric names outcomes evidence references and reproducibility metadata.
    - Exact and schema retrieval context tool policy groundedness response and resource evaluators are deterministic-first, fail closed on malformed or missing evidence, explicitly represent not_applicable and incomplete evidence, and never infer success from absent data.
    - Existing suitable Core test evaluators may be exposed through reviewed public Core evaluator or replay ports and production modules, but Observatory never imports aura_core and no Core implementation is copied into Observatory.
    - AURA-0093 may add closed replay projections or public exports needed to evaluate exact deployed components, but it does not widen NATS transport with raw content, directly read Core state, make the Core runner authoritative for scores, or make normal Core availability depend on Observatory.
    - Evaluation content is untrusted, retained until explicit manual deletion, and cannot appear in NATS lifecycle events production telemetry logs metrics traces errors SSE URLs screenshots test reports or browser persistence.
    - Independent review authorizes a narrow artifact-metadata lookup through the existing AURA-0090 repository, exact dataset-to-case-version membership, atomic content-free definition audits, a typed evaluator application service, runtime metadata-only instrumentation, and a forward-only ClickHouse score-metadata migration; these corrections preserve existing service and provider boundaries and require no ADR.
    - The score metadata migration may add bounded case metric evidence-status failure-code opaque evidence-reference reproducibility and threshold-applicability columns to the existing Observatory-owned score table, but may not alter prior ClickHouse migrations or persist evaluation content.
    - This item adds no public HTTP CLI SSE browser judge model experiment baseline alert external message or production telemetry capture behavior; those remain assigned to AURA-0094 through AURA-0097.
