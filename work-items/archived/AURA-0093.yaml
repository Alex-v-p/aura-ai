security_privacy:
  applicable: true
  concerns:
    - Evaluation content is explicitly authorized untrusted data and cannot select imports callables providers endpoints credentials object paths subjects policies permissions or execution authority.
    - Dataset case suite evaluator expectation and threshold schemas are closed and bounded and reject unknown fields unsupported versions malformed identifiers non-finite numbers arbitrary attributes and credential or endpoint shaped extension data.
    - PostgreSQL definition rows store only identifiers versions scopes classifications provenance digests component bindings budgets thresholds fixture identifiers and opaque artifact references; authorized bytes remain only in Garage under existing manual-retention controls.
    - Definitions are immutable after creation and idempotent same-fingerprint writes return the existing record while identifier-version conflicts with a different fingerprint fail closed and remain auditable without content.
    - Owner-supplied cases require explicit capture authorization artifact classification byte count digest and opaque reference compatibility; synthetic cases cannot silently acquire owner data or normal Core state.
    - Evaluator dispatch is a closed registry with exact identifier and version matching and cannot dynamically import execute expressions invoke tools or broaden component authority.
    - Every evaluator consumes bounded typed evidence treats missing partial malformed and contradictory evidence explicitly and emits finite scores bounded counts fixed outcome enums and opaque evidence references without copying raw inputs or outputs.
    - Metric log trace and error dimensions are fixed low-cardinality operation evaluator-kind outcome and failure-code values and never contain dataset suite case job attempt artifact owner component-instance digest content or exception text.
    - Observatory never imports aura_core reads Core databases or depends on Core process memory; any Core change exposes existing deterministic behavior only through public production ports and exact-version replay projections.
    - Manual thresholds are inert comparison metadata and cannot promote repository or database baselines authorize execution change budgets or weaken a failing result.
    - Deletion and retention behavior remains manual and is not widened by definition persistence; no TTL scheduled purge or hidden content cache is added.
  data_classes:
    - evaluation_definition_metadata
    - evaluation_content_authorization_metadata
    - evaluation_expectation_metadata
    - evaluation_threshold_metadata
    - evaluation_score_metadata
    - evaluation_reproducibility_metadata
