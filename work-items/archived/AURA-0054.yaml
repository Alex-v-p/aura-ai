id: AURA-0054
title: Add owner-scoped one-shot reminder management
status: integrated
change_class: repository_governance
intent: >
  Add deterministic owner-scoped one-shot reminders with durable PostgreSQL
  state, idempotent lifecycle commands, versioned API and event contracts, and
  an accessible Aura Web management surface while preserving provider and
  product boundaries for later scheduler, notification, and agent-tool work.
