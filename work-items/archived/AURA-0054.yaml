acceptance_criteria:
  - Owner-authenticated users can create list inspect complete and cancel one-shot reminders through a versioned API and Aura Web reminder workspace.
  - Reminder content is trimmed to 1 through 2000 characters and due timestamps require an explicit RFC3339 offset are strictly future-dated and persist as UTC.
  - Reminder lifecycle is scheduled fired completed or canceled completion is allowed from scheduled or fired cancellation is allowed only from scheduled and terminal records are immutable.
  - Every query and command resolves the authenticated principal and cannot read mutate or infer another owner's reminder.
  - Create complete and cancel require CSRF same-origin UUID idempotency and exact replay while mismatched reuse conflicts and expected-version mismatches fail safely.
  - Upcoming reminders are ordered by due time ascending history is ordered by update time descending and owner-bound opaque cursors remain stable across pages.
  - Reminder lifecycle mutations stage content-free identifier-only outbox events and metadata-only audit records in the same transaction as business state.
  - The generic outbox supports aggregate type and aggregate identifier without fabricated run or conversation identifiers while existing run and memory v1 payloads remain byte-compatible.
  - Aura Web renders local browser time offers create inspect complete and cancel actions and provides accessible responsive empty loading conflict and failure states.
  - No recurrence rescheduling deletion notification delivery scheduler agent tool Home Assistant calendar voice Wall or Observatory behavior is added.
