    - Reminder content must not enter outbox identifiers events telemetry or ordinary audit metadata.
    - Mutation commands require same-origin CSRF validation exact idempotency replay and optimistic concurrency.
    - The generic outbox envelope must preserve existing run and memory v1 wire payloads byte-for-byte.
  data_classes:
