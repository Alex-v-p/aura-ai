baseline_changes_allowed: false
human_approval_required: true
open_decisions:
  - Follow-up Core capture work must select explicit serializers at each applicable execution boundary and cannot infer authorization to dump arbitrary runtime objects.
  - Follow-up Observatory storage work must introduce service-owned PostgreSQL migrations and a dedicated least-privilege Garage bucket and identity separate from evaluation artifacts.
    - Follow-up UI work must render evidence inertly and lazily, preserve disclosure state during live refresh, and prove zero browser persistence or screenshot capture of evidence content.
