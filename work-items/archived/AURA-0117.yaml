  max_parallel_agents: 6
  max_parallel_writers: 1
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - ADR-0017 and the Observatory specification authorize owner-enabled full production run evidence while preserving metadata-only OTLP and SSE, strict product separation, Core failure isolation, dedicated Observatory storage, manual retention, and owner-only access.
  - A closed versioned run-evidence envelope defines stable event and evidence IDs, run trace span and parent correlation, monotonic per-run sequence, step category, evidence kind, media classification and type, digest, byte count, capture-policy revision, timestamps, retry identity, and explicit captured excluded partial dropped and deleted states with bounded reasons.
  - The evidence contract provides explicit payload variants for admitted requests and triggers, compiled prompts, admitted conversation context, memory and document chunks, model-visible attachments, routing, displayed thinking, generation output, tool arguments and results, policy approvals and outcomes, response synthesis, persistence, delivery, workers, automations, schedules, and evaluations without arbitrary object serialization.
  - The evidence contract bounds every string array object and byte-bearing item, closes every object schema, supports idempotent duplicate and out-of-order delivery, and makes prohibited credentials secret material and provider-hidden reasoning unrepresentable.
  - Observatory OpenAPI additively defines GET /api/v1/runs/{run_id}/inspection, GET /api/v1/runs/{run_id}/evidence/{evidence_id}, and DELETE /api/v1/runs/{run_id}/evidence with owner authorization, no-store content streaming, CSRF and idempotency for deletion, durable deletion status, completeness and partial reasons, and bounded ordered timeline structures.
  - Existing metadata-only run trace analytics comparison and SSE contracts remain backward compatible; SSE carries only run-scoped invalidation metadata and never evidence content.
  - The generated Observatory transport supports the approved bounded evidence response media types without generic unsafe buffering or hand-maintained contract duplication.
  - Contract tests prove malformed oversized duplicate secret-bearing and unsupported-media evidence is rejected, existing clients remain compatible, and Aura Web plus the Aura API client have no dependency on the run-evidence contract or Observatory client.
  - This contract phase introduces no runtime behavior migration deployment change service dependency or protected baseline change; follow-up work items own Core capture, Observatory storage and APIs, Observatory UI, and full-stack acceptance in that order.
