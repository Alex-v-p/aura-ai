id: AURA-0117
title: Authorize and contract full per-run evidence inspection
status: integrated
change_class: repository_governance
intent: >
  Restore the full-content portion deferred from AURA-0098 by recording the
  owner's authorization for governed production run evidence and defining the
  versioned Core-to-Observatory evidence and Observatory inspection contracts,
  without changing Aura Web or making normal Core execution depend on
  Observatory availability.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/open-decisions.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - The owner explicitly authorizes full model-visible and executor-visible evidence capture for ordinary Core runs when an owner-controlled deployment policy enables it.
    - Ordinary OTLP telemetry remains metadata-only; run evidence uses a separate versioned one-way asynchronous channel and dedicated Observatory-owned storage.
    - Core never reads from or waits for Observatory, and export queue pressure, transport failure, Observatory outage, or storage failure cannot alter normal run execution.
    - Exact admitted requests, compiled prompts, admitted context, memory and document chunks, model-visible attachments, displayed thinking, generated output, model-visible tool arguments and results, policy and approval decisions, persistence, delivery, worker, automation, scheduled, and evaluation inputs and outputs are eligible evidence when applicable.
    - Credentials, secret-bearing fields, bearer material, provider-hidden reasoning, and arbitrary object dumps are permanently excluded. A prohibited item is rejected whole and represented as partial with a bounded content-free reason.
    - Run evidence has manual-only retention, owner-only access, durable idempotent deletion, and content-free audit records. Evidence bytes use a dedicated Observatory Garage bucket separate from evaluation artifacts; manifests and deletion truth use Observatory PostgreSQL; ClickHouse remains content-free.
    - Evidence content is never placed in OTLP, SSE, URLs, logs, metrics, browser storage, service-worker caches, screenshots, or Aura Web.
    - Aura Web contains no Observatory link, label, route, import, configuration, shared session, browser communication, or evidence dependency.
  contracts:
    - contracts/openapi/observatory-v1.yaml
