contracts:
  changes_allowed: true
  affected:
    - run-evidence-v1 additive schema
    - observatory-v1 additive inspection evidence and deletion operations
    - observatory-api-client generated transport
  compatibility_requirement: backward_compatible
data:
  migration_required: false
  owning_service: aura-observatory
  owning_module: run-evidence
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - Evidence is private owner content and may contain conversations memories documents model-visible attachments generated output and tool payloads.
    - Closed bounded serializers reject credential-bearing items whole instead of claiming redacted evidence is exact.
    - Provider-hidden reasoning is never requested inferred reconstructed or stored; only displayed model.thinking.delta text is eligible.
    - Evidence reads are owner-authorized and no-store; deletion is CSRF-protected idempotent durable and auditable without content.
    - Evidence content is excluded from telemetry SSE URLs logs metrics browser persistence caches screenshots and error detail.
    - The new contract must not be imported by Aura Web or alter the existing Aura run-event and metadata-observation contracts.
  data_classes:
    - owner_private_run_evidence
    - admitted_request_content
    - prompt_and_context_content
    - retrieval_and_chunk_content
    - displayed_thinking_content
    - generated_content
    - tool_input_output_content
    - model_visible_attachment_content
    - content_free_evidence_audit
