acceptance_criteria:
  - The Stage 4 decision gate records a closed four-kind step catalogue and a typed non-expression data flow that cannot change control flow, policy, permissions, tool grants, memory access, or confirmation behavior.
  - The first default permits no more than eight sequential steps and no more than one five-minute tools-disabled memory-disabled agent run, caps wait horizons at thirty days, expires approvals after seven days, and defines bounded output, checkpoint, and whole-instance resource posture for later contracts.
  - Definitive failure, ambiguous outcome, idempotent replay, approval rejection or expiry, cancellation, restart, grant revocation, and terminal settlement semantics are explicit and do not offer unsafe retry, skip, automatic compensation, or reversal claims.
  - Definitions, drafts, immutable revisions, instances, histories, results, and checkpoints have explicit owner-only manual deletion scopes; retiring a definition or deleting a schedule does not imply history or result deletion.
  - Published revisions are immutable, edits clone a new draft, and admitted instances pin one exact revision for their entire lifetime.
  - The threat model covers owner isolation, confused deputy behavior, injection through prior results, duplicate delivery, stale approvals, grant revocation, resource exhaustion, private-data leakage, executor-state leakage, cancellation races, and retention/deletion mistakes with testable mitigations.
  - The document preserves PostgreSQL and outbox authority, public application boundaries, executor independence, Core and Observatory isolation, generated-client direction, and the existing approval and notification ownership rules.
  - >-
    The follow-on decomposition remains four ordered Stage 4 checkpoints:
    decisions and threat model, contracts and deterministic state machine,
    Core execution, and Aura Web management.
  - No product code, contract, migration, provider, dependency, deployment, telemetry, baseline, or protected architecture change occurs in this work item.
