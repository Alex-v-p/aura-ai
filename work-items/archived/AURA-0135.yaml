id: AURA-0135
title: Close the bounded sequential workflow decisions and threat model
status: integrated
change_class: documentation
intent: >
  Record the owner-approved limits, typed data flow, failure semantics,
  retention, immutable revision behavior, abuse cases, and rollback posture for
  the first durable sequential workflow slice so later contract and runtime
  work can proceed without widening trust or executor boundaries.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/agents-and-execution.md
    - docs/specifications/tools-automation-and-integrations.md
    - docs/specifications/open-decisions.md
    - docs/design/daily-action-and-workflow-initiative.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/sidebar-and-management-surfaces.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - docs/adr/0017-governed-production-run-evidence.md
    - >-
      The owner approved the conservative first default on 2026-10-27: at
      most eight strictly sequential steps, exactly zero or one tools-disabled
      and memory-disabled agent-run step with a five-minute deadline,
      wait-until steps no farther than thirty days, and approval pauses
      expiring after seven days.
    - The owner approved no automatic semantic retries, skip, or compensation; a definitive safe failure may be explicitly retried with stable idempotency, while an unknown outcome permits reconciliation or cancellation only.
    - The owner approved manual-only deletion for definitions, immutable revisions, instance history, results, and bounded checkpoints; schedule deletion or definition retirement must not imply instance-history or result deletion.
    - The owner approved immutable published revisions, edit-by-cloning into a new draft, and exact revision pinning for running instances.
    - The approved closed catalogue contains only a bounded agent run, an exact owner-approval pause, an owner-private notification, and wait-until; loops, branches, parallelism, expressions, arbitrary templates, providers, calendar writes, Home Assistant, shell or filesystem access, user code, dynamic grants, and recursive workflows remain excluded.
