security_privacy:
  applicable: true
  concerns:
    - Workflow definitions, manual inputs, step outputs, approval context, notifications, checkpoints, and results are owner-private and must not enter URLs, ordinary events, telemetry, logs, browser persistence, service-worker caches, screenshots, or Observatory through Aura Web.
    - Previous-step output and owner input are untrusted evidence and cannot select step kinds, alter transitions or mappings, widen permissions, suppress nested confirmation, enable memory or tools, or become policy.
    - Scheduler and worker identities carry no owner authority; every admission and resume must revalidate the immutable owner, workspace, revision, and narrowed grants.
    - At-least-once delivery and ambiguous failures must not duplicate agent runs, approvals, notifications, waits, or terminal settlement.
    - Cancellation prevents future admission and requests cancellation of active work but never claims to reverse completed effects.
    - Retained workflow state requires separate explicit deletion scopes and must not expose executor-private or LangGraph state.
    - Owner-enabled run evidence must use closed serializers, reject secret-bearing or oversized items whole, and remain isolated from ordinary telemetry and Aura Web.
  data_classes:
    - owner-private workflow definitions and immutable revisions
    - owner-private workflow inputs outputs results and checkpoints
    - owner-private workflow instance and step history
    - metadata-only workflow lifecycle and bounded budget state
