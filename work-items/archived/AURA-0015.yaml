    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - User-approved Ollama-backed conversations with portable Authentik development deployment plan
    - One configured Authentik issuer and subject is the initial owner authorization boundary
    - All installed Ollama models are visible and chat-incompatible models are disabled
    - Conversation model selection is mutable for future runs with no silent fallback
    - Independent conversation runs continue in the background
    - Partial streamed output is checkpointed and preserved
    - Conversations are retained until an explicit future deletion capability
