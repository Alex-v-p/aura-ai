  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - An Authentik-authenticated configured owner can create, list, select, and continue persistent conversations while other subjects are rejected.
  - The temporary Authentik server, worker, database, and blueprint run only through the local-identity profile and Aura also operates against an external configured issuer.
  - Authentik can move externally while preserving issuer, client, signing material, and subject without an Aura code or Core data migration.
  - The UI shows installed Ollama models, disables known incompatible models, and persists a mutable per-conversation selection for future runs.
  - Conversation creation and the first user message and run are atomic, idempotent, and create no abandoned empty database conversation.
  - New and retried runs use bounded completed conversation context and record the exact immutable agent revision, model policy, provider, and model.
  - Run requests use the transactional outbox and NATS JetStream with identifier-only idempotent commands and ordered mutations per conversation.
  - Independent conversations run concurrently and continue when the user navigates elsewhere.
  - SSE streams typed run and text events, reconnects from a persisted snapshot, and never carries browser credentials in its URL.
  - Cancellation preserves the user message and checkpointed partial output; retry creates linked history without duplicating the message.
  - Liveness is distinct from readiness across PostgreSQL, NATS, configured OIDC, the default model, and Ollama.
  - Metadata-only instrumentation covers all declared components and metrics without exporting prompt or response content.
  - Workbox does not cache APIs, authenticated responses, SSE, transcripts, or drafts; theme and unsent drafts remain browser-local.
  - Core and Authentik durable state uses operator-configured encrypted host paths and all secrets are runtime-injected.
  - Existing responsive, accessibility, focus, Storybook, and frontend behaviors remain covered.
  - No Observatory, memory, tools, artifacts, voice, cloud provider, rich Markdown, deletion, or broader conversation-management feature is introduced.
