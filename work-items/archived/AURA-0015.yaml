id: AURA-0015
title: Deliver Ollama-backed persistent conversations
status: integrated
change_class: contract
intent: >
  Replace the Aura Web conversation preview with an authenticated, persistent,
  streaming conversation vertical backed by Aura Core, PostgreSQL, NATS,
  Valkey, and a provider-neutral Ollama adapter, while keeping the temporary
  local Authentik deployment optional and portable to an external host.
