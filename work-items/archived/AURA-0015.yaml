    - run_duration_ms
    - time_to_first_token_ms
    - output_tokens
    - provider_errors
    - sse_reconnects
  required_evaluators: []
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - OIDC issuer, audience, state, nonce, signature, redirect, session rotation, and owner-subject validation
    - HttpOnly Secure SameSite cookies and origin-aware CSRF protection for state-changing commands
    - Provider tokens and sessions remain server-side in non-persistent Valkey
    - Conversation content remains Core-owned and is excluded from queue commands and telemetry
    - Ollama remains private to the trusted LAN and its endpoint is never exposed to browsers
    - Authentik and Core databases, credentials, migrations, and lifecycle remain isolated
    - Temporary Authentik deployment must be removable without application or Core data changes
    - Secrets, real subjects, endpoints, tokens, and certificates must not be committed
  data_classes:
    - private conversation content
    - assistant partial and completed output
    - authenticated principal identifiers
    - OIDC provider tokens and session state
    - model inventory and run metadata
