contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: frontend.aura.interaction.conversations
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: none
security_privacy:
  applicable: true
  concerns:
    - Private title search terms remain in session memory and outside URLs
    - Transient conversation drafts remain local and absent from library summaries
    - Popup controls preserve keyboard focus and do not expose draft content
  data_classes:
    - private conversation title search terms
    - private unsent conversation drafts
required_agents:
  implementation: [frontend_worker, test_evaluation_engineer]
  review: [general_reviewer, security_privacy_reviewer]
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 5
  max_parallel_writers: 2
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - The Filter button opens a viewport-aware connected popup without expanding or clipping the sidebar.
  - Filter changes apply live and Clear filters resets all library filters while the popup remains usable.
  - The popup closes on outside click Escape sidebar collapse and mobile navigation close, then restores trigger focus when appropriate.
  - The title-search field has a decorative magnifying-glass icon without changing its accessible name or debounce behavior.
  - Local draft conversations are omitted from library summaries until the first user message is accepted.
  - New conversation reuses the existing transient draft, preserving its text and configuration and avoiding hidden duplicates.
  - A rejected first send preserves the local draft outside the library, while an accepted send adds one durable conversation and route.
  - Unit and browser tests cover the popup, keyboard behavior, draft reuse, rejection recovery, and durable transition.
  - All required checks pass and the reviewed change is committed without pushing.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0035.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0035.yaml
  - pnpm --dir frontend run lint
  - pnpm --dir frontend run test
  - pnpm --dir frontend run build:production
  - pnpm --dir frontend run build-storybook
  - pnpm --dir frontend exec playwright test apps/aura-web-e2e/src/conversation-productivity.spec.ts apps/aura-web-e2e/src/aura-web.spec.ts --config playwright.config.ts --project=desktop
  - python3 tooling/architecture/validate-frontend-boundaries.py
  - python3 tooling/architecture/validate-repository-shape.py
  - python3 tooling/architecture/validate-baseline-protection.py --work-item work-items/active/AURA-0035.yaml
  - docker compose config --quiet
  - git diff --check
baseline_changes_allowed: false
human_approval_required: false
open_decisions: []
