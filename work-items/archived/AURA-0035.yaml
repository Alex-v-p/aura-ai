id: AURA-0035
title: Refine conversation filters and transient drafts
status: integrated
change_class: bugfix
intent: >
  Keep conversation filters compact and accessible, clarify the title-search
  affordance, and prevent unsent local drafts from cluttering the conversation
  library while preserving draft content until the first message is accepted.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/clients-and-voice.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - User-approved AURA-0035 Conversation Sidebar Polish plan
    - Filters apply live from a connected popup and retain their session state
    - New conversation reuses one transient draft until its first message is accepted
  contracts: []
feature_references: [AUI-003, RUN-009]
ownership_zones:
  - frontend.aura-web.shell
  - frontend.aura-web.app
  - frontend.aura.interaction.conversations
  - frontend.aura-web.e2e
allowed_paths:
  - work-items/active/AURA-0035.yaml
  - work-items/archived/AURA-0035.yaml
  - frontend/apps/aura-web/src/app/shell/**
  - frontend/apps/aura-web/src/app/app.component.ts
  - frontend/apps/aura-web/src/app/app.component.spec.ts
  - frontend/libs/aura/interaction/conversations/src/lib/conversation-store.ts
  - frontend/libs/aura/interaction/conversations/src/lib/conversation-store.spec.ts
  - frontend/apps/aura-web-e2e/src/conversation-productivity.spec.ts
  - frontend/apps/aura-web-e2e/src/aura-web.spec.ts
forbidden_paths:
  - AGENTS.md
  - .agents/**
  - .codex/**
  - tooling/architecture/**
  - docs/architecture/**
  - docs/adr/**
  - docs/specifications/**
  - evaluations/golden-results/**
  - evaluations/**/baselines/**
  - contracts/**
  - services/**
  - frontend/package.json
  - frontend/pnpm-lock.yaml
  - frontend/libs/platform/**
  - frontend/libs/observatory/**
  - frontend/apps/aura-wall/**
  - frontend/apps/observatory-web/**
  - deploy/**
