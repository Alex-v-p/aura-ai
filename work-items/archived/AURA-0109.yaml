security_privacy:
  applicable: true
  concerns:
    - Batch validation claims settlement health and performance evidence retain only already-authorized metadata observations opaque identifiers immutable sequences finite outcomes counts and bounded durations.
    - Concurrency must not copy payloads into logs metrics traces exception text task names URLs browser state or persistent retry queues.
    - Duplicate identifiers within one request concurrent request races stale-lease redelivery and response-loss retries must retain one immutable sequence and one stable ClickHouse deduplication token per observation.
    - The existing advisory lock continues to serialize ingest with authorized retention so cancellation failure and late completion cannot resurrect deleted receipts or visibility state.
    - PostgreSQL ClickHouse or health-provider failure remains confined to Observatory and cannot add a Core dependency change producer behavior or cross-product communication.
  data_classes:
