acceptance_criteria:
  - TelemetryIngestService authenticates and validates the complete bounded payload before any catalogue receipt or ClickHouse write while preserving the existing mixed-batch per-record rejected malformed and valid outcome semantics.
  - Production ingestion claims all valid unique observations in one bounded PostgreSQL transaction under the existing advisory lock classifying acquired duplicate and already-pending identifiers deterministically including repeated identifiers inside one request.
  - Every acquired observation receives one immutable ingest sequence and durable pending receipt before ClickHouse I/O; retry restart and stale-lease reclaim reuse both that sequence and the stable observation-identifier deduplication token.
  - ClickHouse writes use a shared bounded client lifetime and at most the configured validated concurrency. No unbounded asyncio task set in-memory retry queue batch-wide deduplication token or multi-observation failure domain is introduced.
  - After bounded concurrent writes the PostgreSQL batch settlement atomically completes only successful receipts marks only their sequences visible and advances the committed watermark solely through contiguous visible slots.
  - A ClickHouse transport error timeout ambiguous response cancellation or process interruption leaves affected receipts pending without sequence replacement or false visibility so ordinary redelivery and AURA-0108 reconciliation remain authoritative.
  - Concurrent ingest requests retention deletion reconciliation and stale-lease redelivery cannot double-complete observations skip or regress the watermark reuse a sequence classify a pending row as accepted or resurrect deleted state.
  - Component and deployment catalogue projections remain correct and idempotent while accepted rejected duplicate malformed and storage-failure counters plus storage and batch durations are persisted in bounded aggregate operations rather than one health transaction per observation.
  - Existing finite metric names labels traces and capture policy remain unchanged; batch diagnostics disclose no observation run trace deployment provider endpoint credential content or exception text.
  - The telemetry-ingestion and telemetry-storage manifests declare observatory_ingest_bounded_concurrency as an evaluator while retaining exact metric equality and every existing evaluator capture retention dependency and cardinality declaration.
  - Deterministic barrier-controlled acceptance proves more than one acquired observation executes concurrently never exceeds the configured bound and a maximum configured batch completes its external writes in no more than ceiling batch-size divided by concurrency release waves without weakening failure accounting.
  - Production-adapter acceptance proves a 128-observation Collector-sized metadata batch reaches a contiguous committed watermark with zero visibility lag and no duplicate ClickHouse observation inside the unchanged 90-second AURA-0098 visibility window.
  - Cancellation during claim ClickHouse write and settlement always releases the advisory lock and provider resources within a bound and leaves every unconfirmed item recoverable after worker or API restart.
  - Existing metadata validation payload limits authentication OTLP mapping AURA-0108 reconciliation query visibility retention and service-isolation behavior remain compatible.
  - No Core Aura Web Observatory frontend entrypoint public contract migration deploy file dependency protected baseline threshold service queue-capacity or Collector batch-size change is introduced.
