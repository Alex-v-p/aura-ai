id: AURA-0109
title: Bound Observatory telemetry ingest throughput
status: integrated
change_class: bugfix
intent: >
  Remove the serial per-observation PostgreSQL and ClickHouse critical path
  from Observatory metadata ingestion so a bounded Collector batch converges
  to the committed visibility watermark inside the existing AURA-0098
  acceptance window without weakening idempotency, recovery, retention, or
  Core and Observatory isolation.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - work-items/archived/AURA-0078.yaml
    - work-items/archived/AURA-0080.yaml
    - work-items/archived/AURA-0108.yaml
    - PostgreSQL remains the Observatory-owned receipt sequence visibility and contiguous-watermark authority; ClickHouse remains the high-cardinality observation store.
    - The existing Observatory ingest use case validates the complete bounded request before storage, then claims valid observations and allocates immutable ingest sequences in one bounded PostgreSQL critical section under the existing service advisory lock.
    - A claimed batch crosses its durable PostgreSQL boundary before external ClickHouse I/O. The existing advisory-lock and retention ordering remains authoritative through final batch settlement or cancellation cleanup.
    - ClickHouse writes may run concurrently only through a configured bounded worker set. Each observation remains an independent JSONEachRow insert with its stable observation identifier as the deduplication token and its immutable ingest sequence.
    - Successful observations are settled together without skipping a failed or pending visibility slot. Ambiguous failed or cancelled writes remain pending and retain their immutable sequence for ordinary lease redelivery or AURA-0108 reconciliation.
    - Health and catalogue counters are aggregated by finite outcome for the batch. Per-observation database health writes and unbounded task queues are prohibited.
    - The existing telemetry-ingestion and telemetry-storage component manifests may add only the observatory_ingest_bounded_concurrency evaluator declaration required by this item. Their metric catalogues capture policy retention dependencies and other evaluators remain unchanged.
    - Existing PostgreSQL columns locks and receipts are sufficient. No migration public contract new service transport or dependency is authorized; evidence requiring one returns to planning.
    - AURA-0098 retains ownership of the composed full-stack harness and its existing visibility deadline. This item may execute but must not edit that harness.
  contracts:
    - contracts/openapi/observatory-v1.yaml
    - contracts/telemetry/v2/metadata-observation.schema.json
