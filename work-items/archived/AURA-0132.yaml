acceptance_criteria:
  - Aura API additively defines owner-scoped briefing schedules occurrences results and explicit deletion resources without exposing scheduler worker executor checkpoint provider or model-backend concepts.
  - A schedule supports exactly one daily local-time cadence with a validated IANA timezone explicit calendar and document grants reminder inclusion pinned agent revision and bounded immutable execution-policy references; memory is unrepresentable as a source.
  - Occurrence and result state machines use closed bounded statuses stable identities optimistic versions schedule and run lineage deterministic due-time representations source-completeness outcomes and explicit partial failed canceled skipped and unknown outcomes.
  - "Manual-only retention is explicit: schedules occurrences and results have no automatic expiry; deleting a schedule prevents future admission while result or history deletion requires a separate scope-named owner command and preserves content-free audit truth."
  - Briefing lifecycle events are closed versioned metadata-only schemas containing bounded identifiers statuses versions lineage and timestamps only, with no briefing source or result content owner identity prompt credentials or provider payload.
  - Notification contracts evolve from reminder-only fields to a closed typed reminder-or-briefing source while preserving existing reminder payload compatibility acknowledgement behavior and metadata-only replay.
  - The notification migration additively preserves all existing reminder rows and uniqueness semantics while supporting source-neutral idempotent briefing notification creation in the later execution slice; it introduces no briefing-owned tables.
  - Notification Core APIs repositories persistence replay and SSE serialize typed source metadata without cross-domain table access content leakage or weakened owner authorization CSRF optimistic-version or idempotency rules.
  - The regenerated Aura client and notification frontend consume the typed source union without handwritten transport DTOs; existing reminder notifications and Today remain functional and briefing notifications have a safe dedicated-result destination representation for the later route slice.
  - Mobile shell navigation closes after route completion so the drawer cannot intercept notification or reminder actions reached through the updated notification consumers.
  - Contract migration Core frontend Storybook and browser tests cover legacy reminder compatibility typed briefing sources owner isolation source-neutral acknowledgement persisted replay duplicate delivery manual retention privacy exclusions and graceful handling before the briefing detail route exists.
  - Existing notification metrics spans finite dimensions evaluators and metadata-only capture remain valid; no briefing content source labels document identifiers or owner data enters telemetry or SSE.
  - No briefing scheduler execution context assembly result persistence notification producer route management UI deployment Observatory protected baseline dependency or framework change occurs.
