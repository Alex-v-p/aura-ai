  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/design/daily-action-and-workflow-initiative.md
    - docs/specifications/tools-automation-and-integrations.md
    - docs/specifications/clients-and-voice.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - docs/adr/0017-governed-production-run-evidence.md
    - work-items/archived/AURA-0131.yaml
    - On 2026-10-27 the owner approved calendar events reminders and explicitly owner-selected documents as the closed initial briefing source set; memory is excluded.
    - On 2026-10-27 the owner approved one daily local-time cadence with an explicit validated IANA timezone.
    - On 2026-10-27 the owner approved delivery through an owner-private notification linking to a dedicated durable briefing result rather than any conversation.
    - On 2026-10-27 the owner approved manual-only retention for briefing schedules occurrences and results; no automatic expiry is introduced.
    - Schedule deletion stops future admission and tombstones the schedule but does not silently delete occurrence history or results; those require an explicit owner deletion scope.
    - The briefing contract pins selected document identifiers and source grants but document ownership readiness and current authorization are revalidated at admission; deleted unauthorized or unavailable selected documents fail closed or produce an explicitly contracted partial result.
    - The notification domain continues to own inbox records delivery acknowledgement replay and source-neutral idempotency; Briefings will own schedule occurrence result and lineage records in AURA-0133.
    - Notification and briefing events remain bounded metadata-only invalidations and lifecycle facts. Briefing output document text reminder content calendar values prompts owner identity and provider material are excluded.
    - This is Stage 3 slice 1 only. Briefing tables schedule claiming context assembly execution result persistence notification handoff routes and management UI remain sequential later work items.
