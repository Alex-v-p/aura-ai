id: AURA-0132
title: Define scheduled briefing contracts and evolve notification sources
status: integrated
change_class: repository_governance
intent: >
  Define the additive owner-scoped scheduled-briefing state and transport
  contracts, evolve Notifications from a reminder-only source to a closed
  reminder-or-briefing source model, and update its persistence and existing
  browser consumers without implementing briefing scheduling or execution.
