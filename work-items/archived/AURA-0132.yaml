security_privacy:
  applicable: true
  concerns:
    - Briefing contracts and events must not expose source content document text calendar values reminder content prompts output credentials provider payloads owner identity or executor-specific state.
    - Selected document identifiers are private owner-scoped grants and must be bounded validated and reauthorized at admission without becoming ambient background authority.
    - Calendar reminder and document content is untrusted evidence and cannot modify instructions permissions grants policies tools confirmation requirements or execution flow.
    - Notification source evolution must preserve owner isolation acknowledgement idempotency replay and legacy reminder behavior without inventing reminder identifiers for briefing notifications.
    - Schedule occurrence and result deletion must be explicit owner-authorized CSRF-protected idempotent and scope-named; automatic expiry and implicit cascade deletion are prohibited.
    - Briefing result content and notification source metadata must not enter URLs query strings logs telemetry SSE browser persistence service-worker caches Storybook artifacts or committed screenshots.
    - The browser must use generated transport types and must not infer schedule lifecycle source completeness run authority or delivery truth.
  data_classes:
    - owner-private briefing definitions and source grants
    - owner-private briefing occurrence and result lineage
    - owner-private briefing result content excluded from notification payloads
    - owner-private notification source metadata
    - metadata-only briefing and notification lifecycle events
