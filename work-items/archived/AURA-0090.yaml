acceptance_criteria:
  - The existing retention visibility query remains valid PostgreSQL and reports deletion visibility without syntax errors while artifact-storage acceptance exercises the complete stack.
  - Full-stack browser acceptance permits bounded metadata-only SSE comparison refreshes while verifying every comparison request keeps run identifiers out of URLs and browser persistence.
  - A forward-only idempotent PostgreSQL migration from empty and existing Observatory schemas creates authorization artifact lifecycle deletion action target recovery and content-free audit state without sharing Core tables.
  - A forward-only idempotent ClickHouse migration creates evaluation score storage with finite numeric scores bounded dimensions exact evaluator component dataset suite job and result correlations and no content columns arbitrary maps or automatic TTL.
  - Artifact storage requires an explicit content-capable authorization record validates declared size and SHA-256 while streaming enforces a fixed maximum and publishes metadata only after the complete object succeeds.
  - Metadata-only hashed unauthorized oversized malformed digest-mismatched unsupported-media duplicate-conflicting and caller-locator artifact writes fail closed without leaving a visible artifact.
  - Duplicate retries with the same service-generated idempotency key and fingerprint return the same opaque reference while reuse for different content or authorization conflicts deterministically.
  - The Garage adapter derives a fixed object key from the opaque artifact UUID uses no redirects caller-controlled endpoints or paths and treats stored bytes as inert untrusted content.
  - The existing Garage deployment provisions a separate Observatory evaluation bucket and file-injected key whose access is limited to that bucket while the Core key remains limited to Core buckets.
  - Only the Observatory worker receives evaluation bucket credentials and private object-storage network access; Web Collector session stores databases and Core services do not receive the new key.
  - PostgreSQL persists only bounded authorization artifact association lifecycle integrity and deletion metadata and never stores raw content filenames provider endpoints provider object keys credentials or owner identity.
  - ClickHouse score writes reject non-finite values unknown evaluator kinds arbitrary dimensions raw content and incompatible capture classifications and preserve zero distinctly from missing evidence.
  - Durable manual deletion commands support exactly job dataset suite required UTC cutoff and purge_all selectors with service-generated UUID idempotency explicit confirmation and immutable target snapshots.
  - Deletion removes targeted Garage objects PostgreSQL artifact metadata ClickHouse scores and derived evaluation storage projections while preserving content-free deletion audit rows component and deployment catalogues service configuration sessions and unrelated data.
  - Missing objects and repeated completed commands are idempotent successes; storage authentication integrity timeout and database failures remain recoverable explicit bounded failures with no content in diagnostics.
  - Concurrent overlapping deletion commands serialize or share immutable targets without double-counting retargeting late artifacts or deleting artifacts outside either authorized selector.
  - Worker restart resumes durable deletion from its persisted phase without re-uploading content retargeting new artifacts losing audit state or falsely reporting terminal success.
  - Artifact and deletion metrics expose only fixed operation action outcome phase and failure-code labels with bounded counts/durations and never identifiers content sizes digests media values or storage locations as labels.
  - Component manifests declare metadata-only capture manual-owner deletion no automatic TTL stable dependencies metrics evaluators and provider-neutral storage roles.
  - Compose topology fresh migration upgrade migration and idempotent rerun tests verify the private Garage bucket/key network file-secret and encrypted-state-root boundaries.
  - Full-stack storage acceptance writes a bounded synthetic artifact verifies integrity and score storage exercises each deletion selector and purge-all simulates a missing object and restart recovery and confirms no content or locator appears in logs events metrics URLs or browser persistence.
  - No evaluation API CLI SSE Angular NATS subject consumer Core source Core migration dependency upgrade cloud storage protected golden result or repository baseline change is introduced.
