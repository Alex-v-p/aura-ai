security_privacy:
  applicable: true
  concerns:
    - The Observatory Garage key is file-injected separately scoped and unable to access Core buckets; no credential value appears in environment source logs exceptions metrics tests reports or committed fixtures.
    - Raw artifacts are bounded streamed digest-verified inert untrusted bytes and never parsed rendered executed interpreted as instructions or returned through a public endpoint in this item.
    - Only closed content-capable capture classifications and an explicit persisted authorization record may store an artifact; metadata_only and hashed records cannot create objects.
    - Object locators are deterministic internal derivations from UUID references use a fixed prefix and cannot contain caller paths filenames endpoints bucket names traversal segments or provider keys.
    - The object adapter uses one configured private endpoint no redirects bounded connect/read/write timeouts and no caller-controlled URL host headers or credentials.
    - PostgreSQL stores authorization lifecycle digest byte count media classification opaque associations idempotency deletion state and audits but no raw bytes filenames prompts responses rubrics comments credentials endpoints or provider object keys.
    - ClickHouse stores finite scores and versioned correlations but no raw content arbitrary attributes object keys credentials owner identity or unbounded diagnostic strings.
    - Deletion target capture and object metadata publication are concurrency-safe idempotent and restart-recoverable without retargeting late data or falsely reporting success.
    - Logs metrics manifests and test diagnostics use bounded phase outcome and failure classifications only; artifact job dataset suite and owner identifiers never become labels or log fields.
    - Deletion audits remain content-free after artifact metadata objects and scores are removed and cannot be used to reconstruct object locations or private evaluation content.
  data_classes:
    - authorized_evaluation_content
    - evaluation_artifact_metadata
    - evaluation_score
    - evaluation_deletion_audit
