id: AURA-0090
title: Add evaluation artifact storage and manual deletion
status: integrated
change_class: repository_governance
intent: >
  Store explicitly authorized evaluation artifacts and scores behind an
  Observatory-owned least-privilege storage boundary and delete them through
  durable idempotent manual commands without exposing content or coupling Core
  to Observatory state.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/open-decisions.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Reuse the existing private Garage deployment with an Observatory-specific bucket and key that cannot access Core buckets; do not add an object-storage provider or share credentials.
    - Raw evaluation artifact bytes are stored only in the Observatory Garage bucket on the encrypted state root and are inert untrusted data; they are never parsed executed logged measured emitted or persisted in PostgreSQL ClickHouse NATS SSE URLs browser storage or Core state.
    - PostgreSQL owns artifact authorization metadata opaque references lifecycle idempotency deletion jobs immutable target snapshots recovery phases and content-free deletion audits.
    - ClickHouse owns high-cardinality evaluation scores and their metadata-safe job dataset suite evaluator and component correlations; it never stores raw evaluation inputs outputs prompts rubrics comments or artifact bytes.
    - Object locators are derived internally from opaque UUID artifact references and are never accepted from callers persisted as provider keys or exposed across public boundaries.
    - Artifact storage validates authorization capture classification declared byte limit closed media classification and SHA-256 integrity before publishing available metadata; partial objects are removed or remain recoverable without becoming visible.
    - Manual deletion supports exactly job dataset suite required UTC cutoff and purge-all selectors using durable immutable target ledgers and bounded pages.
    - Deletion is asynchronous idempotent and recoverable; a missing Garage object is successful idempotent cleanup while authentication integrity and provider failures remain explicit bounded failure classes.
    - Deletion removes targeted Garage objects artifact metadata scores and derived evaluation storage projections while preserving component and deployment definitions service configuration sessions and content-free deletion audit records.
    - AURA-0090 adds no evaluation API CLI SSE browser orchestration NATS consumer Core runner dataset evaluator judge baseline or experiment behavior; those remain assigned to AURA-0091 through AURA-0096.
  contracts:
    - contracts/evaluation/v1/evaluation.schema.json
    - contracts/evaluation/v1/failure-codes.schema.json
    - contracts/events/evaluation/v1/evaluation-events.schema.json
