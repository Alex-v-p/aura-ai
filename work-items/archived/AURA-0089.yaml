id: AURA-0089
title: Define evaluation privacy and versioned contracts
status: integrated
change_class: repository_governance
intent: >
  Establish closed versioned contracts for explicitly authorized evaluation
  definitions execution results artifacts replay and lifecycle events while
  preserving metadata-only production telemetry and the Core Observatory
  service boundary.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/open-decisions.md
    - docs/specifications/aura-ai-envisioned-feature-catalogue.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Evaluation content is permitted only when an owner-authorized dataset or controlled evaluation request explicitly selects a non-metadata capture classification; ordinary production telemetry remains metadata_only.
    - Evaluation definitions and artifacts are retained until an explicit authorized manual deletion; this work item defines retention intent and identifiers but does not add storage or deletion behavior.
    - Model-assisted judging is local Ollama only and deterministic evaluators remain preferred; exact judge inventory prompts rubrics and calibration are deferred to AURA-0094.
    - Baseline promotion is an explicit owner action and baseline records are immutable; automatic promotion is prohibited.
    - Durable evaluation events contain identifiers status timestamps bounded provenance hashes and artifact references only; raw inputs outputs prompts rubrics comments credentials endpoints object keys and owner identity are prohibited.
    - AURA-0089 is contract-only; PostgreSQL ClickHouse Garage NATS runtime API CLI browser and Core runner behavior remain assigned to AURA-0090 through AURA-0096.
  contracts:
    - contracts/telemetry/v2/metadata-observation.schema.json
    - contracts/events/runs/v1/run-events.schema.json
