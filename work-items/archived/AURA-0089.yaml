contracts:
  changes_allowed: true
  affected:
    - evaluation-v1
    - evaluation-events-v1
  compatibility_requirement: backward_compatible
data:
  migration_required: false
  owning_service: aura-observatory
  owning_module: evaluation
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - Content-bearing evaluation fields are allowed only behind explicit authorization purpose dataset scope capture classification and manual-retention metadata; metadata_only remains the default and production telemetry contract.
    - Evaluation content is untrusted data and cannot grant instructions policy permissions paths endpoints credentials provider selection or execution authority.
    - Durable NATS event payloads are content-free and may carry only bounded identifiers lifecycle status timestamps hashes versions limits provenance and opaque artifact references.
    - Raw content credentials bearer tokens endpoints object keys filenames tool arguments results owner identity arbitrary attributes hidden reasoning and private source identifiers are prohibited from events telemetry logs metrics SSE URLs and browser persistence.
    - Requests results scores artifacts baselines and replay definitions require stable identifiers schema versions idempotency provenance component versions evaluator versions deterministic limits capture classification and reproducibility metadata.
    - Baseline promotion is manual and immutable; contracts must distinguish a candidate from an owner-promoted baseline without encoding owner identity.
    - Artifact references describe integrity media classification and authorization scope without exposing storage endpoints credentials or provider object keys.
    - Cancellation failure and retry metadata remain bounded and must not include exception text payload excerpts or provider diagnostics.
  data_classes:
    - authorized_evaluation_content
    - evaluation_metadata
    - evaluation_artifact_reference
    - evaluation_score
    - reproducibility_metadata
required_agents:
  implementation:
    - contract_steward
    - core_worker
    - observatory_worker
    - platform_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
  integration: true
execution:
  parallelism_class: local
  max_parallel_agents: 5
  max_parallel_writers: 1
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - JSON Schema 2020-12 contracts define dataset case suite evaluator score request result artifact experiment baseline and replay resources with closed bounded objects and stable versioned identifiers.
  - Dataset cases distinguish synthetic owner_supplied and captured sources plus public project private sensitive and environment scopes without embedding owner identity in a portable contract.
  - Every content-bearing field requires an explicit capture classification authorization purpose and retention mode; metadata_only requests cannot carry content and full_content is limited to controlled evaluation contexts.
  - Evaluation content is treated as untrusted data and cannot supply instructions permissions provider endpoints credentials object keys executable paths or arbitrary attributes.
  - Requests bind exact dataset suite evaluator component code image configuration model prompt policy fixture and seed provenance together with deadlines concurrency budgets and idempotency keys sufficient for deterministic replay.
  - Results and scores distinguish deterministic local_judge and human_review evaluators preserve version rubric calibration and uncertainty metadata and never infer missing evidence.
  - Artifact contracts use opaque references integrity metadata bounded media classifications capture classification and deletion scope without exposing bytes filenames storage endpoints credentials or object keys.
  - Experiment and replay contracts declare bounded variants cohorts inputs fixtures component versions and reproducibility evidence without implementing execution orchestration.
  - Baseline contracts require explicit manual promotion record immutable source result sets and thresholds and prohibit automatic promotion or protected repository baseline mutation.
  - A closed evaluation event contract defines exactly requested completed cancelled and failed lifecycle events with stable event correlation causation request job attempt and idempotency identifiers.
  - Evaluation events contain no raw input output prompt rubric comment artifact content credential endpoint object key owner identity exception text arbitrary attributes or hidden reasoning.
  - The specifications record owner-authorized evaluation content manual-only evaluation retention local-only judging and manual baseline promotion while leaving exact local judge inventory calibration artifact storage orchestration API and regression logic to their assigned work items.
  - Deliberate module-registry entries expose the two new contract roots without introducing runtime dependencies or cross-service imports.
  - Contract tests cover valid representatives every resource and event negative unknown-field missing-bound invalid-combination metadata-only-content credential endpoint object-key owner-identity and untrusted-instruction cases.
  - Contract tests verify production telemetry remains metadata-only and has no reference to evaluation content-bearing schemas.
  - No database migration service entrypoint API generated client browser feature package dependency deployment change cloud integration protected golden result or repository baseline change is introduced.
