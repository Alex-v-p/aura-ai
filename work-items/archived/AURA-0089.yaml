baseline_changes_allowed: false
human_approval_required: true
open_decisions:
  - Exact local Ollama judge inventory prompt templates rubrics seeds calibration datasets and advisory thresholds remain assigned to AURA-0094.
  - Garage bucket credentials object layout encryption operations and deletion mechanics remain assigned to AURA-0090.
  - NATS subjects stream consumers retry cancellation and recovery behavior remain assigned to AURA-0091 and AURA-0092.
  - Dataset suite evaluator persistence and deterministic evaluator execution remain assigned to AURA-0093.
  - Observatory API CLI SSE and browser resources remain assigned to AURA-0095.
  - Experiment statistics baseline comparison thresholds regression attribution and promotion workflow remain assigned to AURA-0096.
