  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: true
  concerns:
    - Artifact bytes remain an incrementally consumed async stream and must never be accumulated into an unbounded buffer logged emitted as telemetry or included in provider diagnostics.
    - The existing exact declared-size SHA-256 and signed-payload verification must remain fail closed before artifact metadata becomes available.
    - UUID-derived object keys fixed private bucket routing redirect rejection bounded timeouts content-free error classes and best-effort partial-object cleanup remain unchanged.
    - Garage credentials bucket permissions private networks and the separate API worker judge runner and Core storage identities remain unchanged.
  data_classes:
    - authorized_evaluation_content
    - evaluation_artifact_metadata
    - object_storage_credentials
