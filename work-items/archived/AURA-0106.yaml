id: AURA-0106
title: Return streamed upload bytes from Garage adapter
status: integrated
change_class: bugfix
intent: >
  Make successful Observatory evaluation-artifact uploads report the bytes
  actually streamed to Garage instead of the provider's response-body length,
  while preserving exact digest and size verification, bounded streaming,
  least-privilege storage, and public contract compatibility.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - work-items/archived/AURA-0090.yaml
    - work-items/archived/AURA-0094.yaml
    - Garage PUT response Content-Length describes the response body and is not evidence of request-body bytes accepted by the provider.
    - The Garage adapter must derive its successful upload count from bytes consumed from the outgoing async stream without buffering duplicating logging or persisting artifact content.
    - ArtifactStorageService remains the authority that compares the adapter count with its independently digesting bounded stream and the exact declared byte count and SHA-256 before publishing metadata.
    - AURA-0098 retains ownership of real composed Garage acceptance and all other resilience gates; this corrective work item supplies only the production adapter repair and focused regression coverage.
  contracts: []
