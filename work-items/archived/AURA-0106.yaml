  max_parallel_agents: 3
  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - GarageEvaluationObjectStore.put_stream returns the exact number of non-buffered request-body bytes consumed from the outgoing async stream after a successful provider response.
  - A successful Garage PUT with a missing zero or otherwise response-body-specific Content-Length is not misclassified as artifact integrity failure and does not trigger deletion of a correctly uploaded object.
  - The adapter does not trust the PUT response Content-Length as uploaded-byte evidence and does not buffer replay or arbitrarily dump the artifact while counting the stream.
  - ArtifactStorageService retains its independent bounded digesting stream and continues to require agreement among the streamed byte count declared byte count and expected SHA-256 before publishing available artifact metadata.
  - Existing redirect HTTP status authentication timeout malformed-stream limit digest mismatch cleanup and bounded failure behavior remains compatible and content-free.
  - No public API event schema generated client port signature migration storage layout credential permission network dependency Core code or frontend code changes.
  - Focused tests model Garage's empty successful PUT response verify multi-chunk sent-byte counting and digest signing and retain the existing integrity and failure-path coverage.
  - AURA-0098 is unblocked only for the real Garage upload-count defect and must still independently pass its composed artifact and resilience acceptance.
