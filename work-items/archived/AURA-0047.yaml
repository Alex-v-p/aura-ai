acceptance_criteria:
  - Memory policies expose immutable off and automatic modes plus an automatic query-match threshold while older create-policy clients retain automatic defaults.
  - Off mode performs no query embedding lexical vector or fallback lookup and records a metadata-only policy-off outcome without blocking conversation delivery.
  - Off mode leaves completed-turn memory extraction review reinforcement embedding and persistence behavior unchanged.
  - Production worker composition enables the same pinned-policy recall service as the API composition, and schema-valid but domain-invalid extraction output settles for review instead of retrying forever.
  - Automatic mode admits only candidates whose maximum lexical overlap or clamped cosine similarity meets the pinned threshold and foreign-agent fallback uses query-match relevance rather than age decay.
  - The built-in Aura agent defaults to automatic with two memories five percent context and threshold 0.70 while newly created custom agents default to off with the same dormant ceilings.
  - Migration 0011 is forward-only and idempotently hydrates historical policies as automatic then creates deterministic conservative successor policy and agent revisions for every current profile without changing conversation or run pins.
  - A fresh PostgreSQL migration chain reaches 0011 by repairing the 0010 memory-policy uniqueness prerequisite when declarative bootstrap tables already exist.
  - The migration preserves stricter existing limits all scope flags shared-user promotion and fallback grants and never widens owner or agent access.
  - Retrieval remains bounded by lifecycle validity authorization active embedding generation RRF deterministic reranking and the selected immutable policy limits.
  - Retrieval version and component metadata distinguish automatic selected empty skipped degraded and fallback outcomes without emitting private content.
  - Aura Web provides accessible Off and Automatic controls hydrates attached revisions and shows a small non-blocking explanation that Off does not disable memory creation.
  - Memory and tool specifications reserve future governed memory.search reuse without adding a tool contract executor on-demand mode or hybrid mode.
  - Evaluation fixtures retain recall-at-K and precision of 1.0 for relevant cases with zero stale irrelevant or unauthorized automatic admissions.
  - An authenticated Compose test proves one persisted embedded fact is recalled in a later automatic conversation and absent from recall under an attached off policy while conversations and extraction remain healthy.
