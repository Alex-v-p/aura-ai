    - Automatic recall must preserve owner agent lifecycle validity generation and fallback authorization gates
    - Foreign-agent fallback remains retrieval-only and may not disclose ungranted scopes or invoke another agent
    - Recall and policy telemetry may contain bounded modes outcomes identifiers and scores but no memory text embeddings prompts responses credentials or owner subjects
    - Existing conversations and runs must retain their immutable pinned policy provenance across migration
    - Future memory.search documentation must not create a tool grant contract or executable shortcut
  data_classes:
