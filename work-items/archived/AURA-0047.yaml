  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/memory-and-knowledge.md
    - docs/specifications/agents-and-execution.md
    - docs/specifications/tools-automation-and-integrations.md
    - docs/specifications/clients-and-voice.md
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-approved AURA-0047 conservative per-agent recall modes plan
    - Off disables automatic recall only and leaves extraction review reinforcement and storage active
    - The built-in Aura agent defaults to automatic while newly created custom agents default to off
    - Existing current agent configurations migrate to automatic with no more than two memories five percent context and a 0.70 automatic query-match threshold
    - Existing conversations and runs retain their immutable pinned agent and policy revisions
    - Historical policies remain hydratable as automatic while deterministic successor policy and agent revisions become each profile's current configuration
    - Automatic admission uses the maximum of lexical term overlap and clamped cosine similarity and foreign-agent fallback compares query-match relevance rather than age decay
    - Future memory.search is documentation-only and must reuse the authorized recall use case through the future general tool runtime
  contracts:
    - contracts/openapi/aura-v1.yaml
