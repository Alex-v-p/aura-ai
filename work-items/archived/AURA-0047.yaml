id: AURA-0047
title: Add conservative per-agent recall modes
status: integrated
change_class: repository_governance
intent: >
  Replace unconditional conversational recall with immutable off or automatic
  per-agent policy modes, conservative automatic admission, explicit owner
  controls, and live recall validation while preserving extraction and
  reserving model-driven memory search for the future governed tool runtime.
