id: AURA-0092
title: Add durable Observatory evaluation orchestration
status: integrated
change_class: repository_governance
intent: >
  Coordinate authorized evaluation work through Observatory-owned durable jobs,
  attempts, schedules, cancellation, deadlines, retries, transactional dispatch,
  idempotent result consumption, and restart-safe recovery while keeping Core
  execution independent and all transport and operational signals content-free.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/overview.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/open-decisions.md
    - docs/specifications/aura-ai-envisioned-feature-catalogue.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - The architecture baseline already authorizes separate Observatory evaluation worker and scheduler deployables and PostgreSQL-owned orchestration state; no new service product or protocol boundary is introduced and no new ADR is required.
    - Observatory PostgreSQL is authoritative for evaluation jobs attempts schedules cancellation deadlines retry policy leases result receipts and outbox state; NATS is transport only and cannot become business truth.
    - A dedicated evaluation worker publishes commands consumes results and advances durable orchestration state while a separate database-only scheduler claims due schedules retries deadlines and abandoned leases; neither responsibility is added to the telemetry ingest worker.
    - Existing evaluation resource lifecycle-event and runner-transport v1 contracts are closed and sufficient; this item does not change them or place raw evaluation content in NATS PostgreSQL logs metrics traces health history or error diagnostics.
    - Job attempt event command and cancellation identifiers are service-generated deterministic or UUID-shaped stable identifiers with persisted correlation causation idempotency and immutable request fingerprints.
    - Every outbound runner request and cancellation is inserted into a transactional outbox in the same PostgreSQL transaction as its authoritative state transition and is marked published only after the transport confirms publication.
    - Runner results are validated against the closed transport schema and expected job attempt request provenance and digest before an idempotent state transition; messages are acknowledged only after durable commit and duplicate or out-of-order terminal delivery cannot reopen or duplicate work.
    - Retry eligibility backoff next-attempt time maximum attempts lease expiry deadline and cancellation authority are persisted and bounded by deployment maxima; terminal cancellation and deadline outcomes take precedence over later completion or retry delivery.
    - Scheduled work references opaque dataset suite evaluator and artifact identifiers without defining or inspecting their content; AURA-0093 owns those definitions and evaluator behavior.
    - The scheduler has no NATS or artifact credentials. The evaluation worker receives only the existing least-privilege Observatory dispatch identity and no Core database or normal Core service credential.
    - Core remains an isolated executor reached only through the versioned NATS boundary and receives no dependency on Observatory availability tables packages or lifecycle state.
    - This item adds no public HTTP CLI SSE or browser interface no dataset suite evaluator judge experiment baseline or alert behavior and no production telemetry capture expansion.
    - Real-stack acceptance found that the existing Core evaluation runner delegates reconnect diagnostics to the pinned NATS default callback which emits raw provider tracebacks; AURA-0092 authorizes the smallest runner-bootstrap correction needed to preserve the already-approved metadata-only cross-service outage boundary without changing Core business behavior contracts state or normal deployables.
    - Real-stack privacy review found that the pinned Collector emits configured endpoints and its injected secret filename in provider diagnostics; AURA-0092 authorizes the smallest existing Collector configuration correction and private self-telemetry needed to preserve the approved metadata-only trace boundary and verify bounded queue failure and recovery without adding a service or public port.
  contracts:
    - contracts/evaluation/v1/evaluation.schema.json
    - contracts/evaluation/v1/evaluation-runner-transport.schema.json
    - contracts/events/evaluation/v1/evaluation-events.schema.json
