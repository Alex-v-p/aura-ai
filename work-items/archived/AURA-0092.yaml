security_privacy:
  applicable: true
  concerns:
    - Evaluation transport and orchestration records are closed bounded metadata schemas and reject unknown fields raw content arbitrary attributes credentials endpoints object locations filenames owner identity and exception text before persistence or publication.
    - Transactional outbox payloads contain only schema-valid runner command or cancellation envelopes with bounded references hashes classifications limits provenance correlation and causation and cannot contain artifact bytes prompts responses rubrics comments or provider configuration.
    - Result consumers authenticate through a separate file-injected dispatch identity validate schema version subject event identity expected attempt provenance digest and terminal semantics and acknowledge only after the durable transaction commits.
    - Scheduler lease and worker claim operations use database compare-and-set or row locking with bounded lease expiry so concurrent replicas restart and redelivery cannot produce duplicate active attempts or split-brain scheduling.
    - Cancellation deadline retry and terminal races resolve through an explicit monotonic state machine with one durable terminal outcome and no completion-after-cancellation or retry-after-deadline reopening.
    - Retry policy and effective resource limits are fixed bounded deployment configuration and persisted metadata rather than caller-controlled executable policy or arbitrary schedule expressions.
    - Schedules use validated UTC timing and bounded cadence with no arbitrary code shell commands dynamic imports URLs or external destinations and cannot grant execution authority beyond an already authorized evaluation reference.
    - Logs metrics traces health records manifests and errors use finite phase outcome and failure-code dimensions only and never label or emit job attempt request artifact dataset suite owner digest or content values.
    - The evaluation worker receives only required PostgreSQL NATS dispatch and telemetry files; the scheduler receives PostgreSQL and telemetry files only and neither can access Core databases normal Core credentials or public networks.
    - Shutdown dependency loss poison messages and recovery preserve authoritative state without dropping acknowledged results duplicating dispatch or leaking message bodies in diagnostics.
  data_classes:
    - evaluation_job_metadata
    - evaluation_attempt_metadata
    - evaluation_schedule_metadata
    - evaluation_transport_reference
    - evaluation_lifecycle_audit
