acceptance_criteria:
  - A forward-only idempotent PostgreSQL migration from empty and upgraded Observatory schemas creates content-free jobs attempts schedules leases cancellation result receipts lifecycle audit and transactional outbox state without accessing Core tables or altering migrations 0001 through 0007.
  - Job admission uses service-generated stable identifiers a closed authorized request fingerprint persisted UTC deadline bounded retry policy exact capture classification and immutable component dataset suite evaluator artifact and reproducibility references without storing raw content or object locations.
  - Reusing an idempotency key with the same fingerprint returns the same job while conflicting reuse fails closed and concurrent admission cannot create duplicate jobs initial attempts or outbox records.
  - Creating an attempt and its runner request outbox row is one transaction; publishing marks only the exact row after broker acknowledgement and restart safely republishes unpublished rows with the same deterministic transport event identity.
  - The evaluation worker publishes only schema-valid request and cancellation events on the existing least-privilege runner subjects and consumes only schema-valid results from the existing durable result subject.
  - Result handling verifies job attempt request event deployment component provenance digest and allowed terminal transition then commits the result receipt attempt job audit and any follow-on action atomically before acknowledging the message.
  - Duplicate result delivery returns the prior durable disposition without duplicate terminal audit retry or derived work while conflicting unknown malformed unsupported out-of-order and mismatched results are classified and handled without exposing payloads.
  - Persisted bounded retry policy schedules only eligible transient failure classes with deterministic capped backoff next-attempt UTC time and maximum attempts; permanent malformed authorization integrity cancellation deadline and resource failures do not retry.
  - Cancellation before dispatch during an active attempt and after terminal completion is idempotent race-safe and produces at most one deterministic cancellation command and one final job outcome.
  - Deadlines prevent late dispatch settle due active work with a bounded terminal timeout outcome and take precedence over subsequent retry or successful result delivery without losing a content-free audit trail.
  - Scheduler replicas claim due schedules retries deadlines and expired leases exclusively using bounded transactions and lease ownership and recover abandoned work after restart without duplicate active attempts.
  - Scheduled evaluations use validated enabled state UTC next-run time bounded cadence opaque authorized evaluation references and deterministic occurrence identity and never arbitrary cron code time zones destinations or executable policy.
  - Worker and scheduler configuration enforces bounded batch size poll interval lease duration maximum attempts backoff cadence queue depth payload size and shutdown drain time and rejects unsafe values at startup.
  - Worker and scheduler heartbeats backlog outbox age result lag attempt transitions retry cancellation deadline and failure outcomes are metadata-only bounded measurements with stable component identities and finite labels.
  - Component manifests declare ownership dependencies measurements evaluators metadata-only capture manual retention and provider-neutral roles for the orchestration worker and scheduler.
  - Compose provides distinct evaluation worker and scheduler services with no published ports health checks restart policy resource limits encrypted-state-root PostgreSQL access and only the worker on the private evaluation NATS network with file-injected dispatch credentials.
  - Stopping crashing saturating or misconfiguring either Observatory evaluation process does not affect Observatory API telemetry ingestion Core API worker scheduler migration or normal Core requests and Core remains usable with all evaluation orchestration stopped.
  - Fresh migration upgrade idempotent rerun unit property concurrency privacy transport topology and project-scoped Docker Desktop acceptance cover admission outbox publication result redelivery retry cancellation deadlines schedules lease recovery shutdown and dependency outages.
  - Project-scoped acceptance proves one request is dispatched to the real Core evaluation runner its content-free result is consumed durably duplicate delivery is idempotent cancellation and restart recovery succeed and all services and disposable state are cleaned through repository scripts.
  - The only Core source change is the evaluation runner's bounded privacy-safe NATS diagnostic callback required by real outage acceptance; no Core business logic public API worker scheduler migration state contract dependency or normal runtime behavior changes.
