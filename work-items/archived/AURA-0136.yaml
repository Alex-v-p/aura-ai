acceptance_criteria:
  - Aura v1 additively defines manual-only owner-scoped workflow definitions drafts immutable revisions instances steps checkpoints results histories recovery capabilities optimistic versions idempotent commands and seven explicit non-cascading deletion scopes, with no schedule or executor concepts.
  - Published revisions contain one through eight closed typed sequential steps, at most one five-minute tools-disabled memory-disabled agent run, exact selectors and value algebra, RFC 8785 byte limits, immutable configuration, manual admission only, and no arbitrary expressions templates branches loops parallelism recursion providers tools memory or dynamic grants.
  - Workflow instance, terminal, step, effect, checkpoint, replay, resolution, cancellation and deletion transitions implement the AURA-0135 closed state model, reject invalid or stale commands, preserve completed and unknown effects, enforce one replay only where safe, and never reopen terminal truth.
  - PostgreSQL persistence additively owns definitions drafts revisions instances steps checkpoints results histories tombstones idempotency and lifecycle events with owner indexes bounded columns closed checks positive versions and no cross-domain cascade deletes.
  - A typed workflow approval proposal and origin additively preserve reminder approvals while permitting null run conversation and tool-call lineage only with complete workflow revision instance step and execution lineage; approval decisions remain exact owner/version/expiry bound and replay events remain metadata-only.
  - A typed workflow notification source and creation command additively preserve reminder and briefing notifications while using only opaque workflow instance step-execution and result lineage, source-neutral idempotency, owner isolation, acknowledgement and metadata-only replay.
  - Aura run and run-event contracts add optional workflow revision instance and step-execution lineage and conditionally permit null conversation lineage only for a complete workflow origin; ordinary conversation briefing retry branch tool confirmation and evidence contracts remain compatible.
  - Workflow lifecycle events are closed versioned metadata-only schemas containing only bounded identifiers ordinals kinds statuses outcomes versions timestamps recovery capabilities and lineage; private values and executor state are unrepresentable.
  - Existing approval and notification Core repositories persistence public APIs HTTP serializers replay SSE metrics and evaluators handle their typed workflow variants without cross-domain table access data leakage or weakened legacy authorization CSRF version idempotency and expiry behavior.
  - The generated Aura client and existing approval and notification frontend libraries consume typed workflow unions without handwritten transport DTOs; approval detail renders the immutable system-derived proposal, while compact notification surfaces remain content-free and expose no workflow deep link before AURA-0138 owns the route.
  - Migration and compatibility tests prove forward upgrade from the current head, preservation of reminder briefing conversation run approval and notification rows, exact new constraints uniqueness tombstones no cascades and downgrade or rollback posture consistent with repository migration policy.
  - Model-based and table-driven tests cover every valid and invalid state transition definition bound selector injection duplicate command expected-version conflict replay race approval race cancellation reconciliation late evidence deadline restart deletion order owner substitution and terminal immutability.
  - Existing approval and notification manifests metrics finite dimensions replay behavior and evaluators remain metadata-only and compatible; the new deterministic workflow evaluators use synthetic values and create no production capture or protected baseline change.
  - No workflow HTTP route implementation scheduler worker Run Coordinator admission step handler approval resume notification producer management UI provider dependency deployment Observatory service-worker protected baseline framework or package change occurs.
