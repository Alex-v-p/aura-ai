id: AURA-0136
title: Define workflow contracts and deterministic state
status: integrated
change_class: repository_governance
intent: >
  Add backward-compatible manual workflow, workflow-approval, workflow-
  notification, and run-lineage contracts; persist the closed workflow state;
  and implement its deterministic Aura-owned transition model without adding
  workflow execution, scheduling, worker orchestration, or management UI.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/design/daily-action-and-workflow-initiative.md
    - docs/specifications/agents-and-execution.md
    - docs/specifications/tools-automation-and-integrations.md
    - docs/specifications/clients-and-voice.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/sidebar-and-management-surfaces.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - docs/adr/0017-governed-production-run-evidence.md
    - work-items/archived/AURA-0135.yaml
    - The first workflow contract is manual-start only and contains no schedule trigger cadence timezone overlap missed-run pause resume or schedule-deletion behavior.
    - Workflow approval lineage is represented as a typed additive origin and proposal rather than fabricated reminder conversation or tool-call identifiers. Legacy reminder approval payloads remain compatible; workflow approvals may carry null conversation run and tool-call lineage only when their complete workflow origin is present.
    - A workflow-admitted Aura run may carry null conversation lineage only when exact workflow instance revision and step-execution lineage is present; ordinary conversation and briefing run behavior remains unchanged.
    - Workflow lifecycle events are metadata-only and contain bounded identifiers statuses versions ordinal timestamps recovery capabilities and lineage only. Inputs outputs instructions mappings approval presentation notification content owner identity credentials provider material and executor state are excluded.
    - One forward-only Core migration owns workflow tables plus the additive approval and notification source evolution to prevent competing Alembic heads.
    - The deterministic workflow package owns validation immutable revision instance step checkpoint result tombstone idempotency and transition truth but does not call Runs Approvals or Notifications or expose HTTP scheduler worker or model-facing entrypoints in this slice.
    - Existing Approval and Notification applications continue to own their records decisions acknowledgement replay events and SSE. Workflow integration uses only their public APIs in AURA-0137.
    - Existing approval and notification frontend consumers add typed compatibility only. Workflow authoring instance routes and management UI remain AURA-0138.
  contracts:
    - contracts/openapi/aura-v1.yaml
    - contracts/events/runs/v1/run-events.schema.json
    - contracts/events/automation/v1/notification-events.schema.json
