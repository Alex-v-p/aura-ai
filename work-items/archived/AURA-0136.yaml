  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Workflow definitions inputs outputs instructions mappings approval context notification content checkpoints and results are owner-private and cannot enter URLs ordinary events outbox wake payloads SSE telemetry logs browser persistence service-worker caches Storybook snapshots screenshots or Observatory through Aura Web.
    - Workflow and run contracts may permit absent conversation lineage only with complete exact workflow lineage; no caller may omit both or fabricate a conversation.
    - Workflow approval presentation is immutable system-derived exact-step-bound and cannot contain prior output author-controlled consequence copy or grant expansion.
    - Workflow notification sources contain only opaque workflow instance and step-execution lineage and no input output instruction result approval or owner content.
    - Typed selectors reject expressions interpolation coercion dynamic paths fallbacks unknown fields and future step references; instance input and prior output remain delimited untrusted evidence.
    - At-least-once delivery duplicate requests stale expected versions replay limits unknown outcomes cancellation races and terminal settlement must never duplicate effects or reopen terminal state.
    - Deletion is owner-authorized CSRF-protected idempotent scope-specific and non-cascading; active state and pinned revisions cannot be deleted and content-free tombstones preserve authorization and lineage for surviving scopes.
    - Existing reminder briefing conversation approval notification and run rows and payloads must remain compatible and owner-isolated after migration.
    - Public contracts and persisted checkpoints must not expose LangGraph node graph or private executor state.
  data_classes:
    - owner-private workflow definitions drafts immutable revisions and typed mappings
    - owner-private workflow instance inputs step outputs results checkpoints and history
    - owner-private workflow approval and notification lineage
    - metadata-only workflow approval notification run and lifecycle events
