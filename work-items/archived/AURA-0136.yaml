contracts:
  changes_allowed: true
  affected:
    - Aura v1 manual workflow definition revision instance transition recovery and explicit deletion resources
    - Aura v1 additive workflow approval origin and proposal union
    - Aura v1 additive workflow notification source union
    - Aura run and run-event additive workflow lineage with conditional nullable conversation lineage
    - automation workflow lifecycle events v1
    - automation notification events v1 additive workflow source
    - generated Aura TypeScript transport client
  compatibility_requirement: backward_compatible
