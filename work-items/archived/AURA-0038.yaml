security_privacy:
  applicable: true
  concerns:
    - NATS commands contain identifiers and correlation metadata only and never conversation memory candidate evidence prompt response or embedding content
    - Structured inference output is untrusted and must pass strict schema bounds ownership scope evidence sensitivity confidence validity and credential policy before persistence
    - The worker trusts only server-resolved completed user evidence bound to the staged run message and agent revision and never trusts provider-supplied content message identifiers or ownership metadata
    - Sensitivity classification is deterministic versioned and fail-closed for unknown categories even when the provider labels a candidate ordinary
    - Automatic writes may use only authenticated user-authored evidence from the completed exchange and agent-scope proposals must match the run agent
    - Shared-user scope promotion conflicts sensitive categories and ambiguous grounding require review rather than automatic commitment
    - Provider errors worker errors telemetry and evaluation results must not include conversation memory candidate evidence prompt response vector or secret values
    - Duplicate delivery crash recovery retries and reindex restarts must not create duplicate candidates revisions relations or embeddings
    - Model configuration and job lookup remain owner-scoped and generation activation cannot expose or select mixed dimensions
    - Candidate job model-configuration embedding-generation and reindex reads and mutations are owner-scoped and unauthorized identifiers return the same content-safe not-found outcome
    - Purge scrubs linked candidate action job idempotency and embedding work content while a content-free terminal fence blocks delayed retry maintenance and reindex recreation
    - Ignored low-confidence malformed credential-bearing and unconfigured processing outcomes contain no candidate text evidence raw model output or vectors
  data_classes:
    - private conversation turns used as extraction evidence
    - proposed and accepted durable memory content
    - memory candidates confidence sensitivity scope and review state
    - semantic embeddings derived from private memory content
    - owner agent conversation run message and model identifiers
