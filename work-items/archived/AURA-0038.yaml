  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Completing a user and assistant turn transactionally stages exactly one versioned identifier-only memory-processing command and never calls extraction or embedding providers on the conversational response path.
  - The memory-owned versioned command DTO is staged through generic outbox operations and dispatch routes run and memory commands to distinct versioned JetStream subjects while preserving stable command IDs correlation causation duplicate suppression redelivery and acknowledge-after-success behavior.
  - A provider-neutral schema-driven structured-inference port returns bounded JSON while knowledge.memory alone validates ignore create reinforce supersede dispute or review actions and the Ollama model adapter never owns memory semantics or leaks provider payloads.
  - A provider-neutral embedding port under the separate providers.embeddings boundary and its Ollama adapter return finite vectors with recorded model identity revision digest and dimension and never make embedding a second model acceptance decision.
  - PostgreSQL persists owner-scoped memory model configuration processing jobs candidate review state action outcomes retry metadata maintenance state and resumable reindex progress under migration 0009.
  - The deterministic policy auto-commits only ordinary user-grounded candidates at confidence 0.85 or higher routes confidence 0.60 through less than 0.85 conflicts sensitive categories ambiguous evidence and risky scope proposals to review and discards lower confidence.
  - Each staged job durably binds the completed run agent revision and exact user and assistant message IDs and the worker re-loads and verifies the same owner conversation run roles COMPLETE state and server-computed user-evidence digest before invoking a provider or policy.
  - Provider actions may reference only server-issued evidence handles or bounded offsets and cannot supply trusted message IDs owner IDs or evidence text; invented canonical content unsupported by the bound user evidence cannot auto-commit.
  - A bounded versioned deterministic sensitivity taxonomy detects health finance identity intimate precise-location credential and unknown-risk content independently of the provider and fails closed to review or rejection.
  - Secret-bearing canonical content correction or evidence is rejected before candidate memory or embedding persistence and malformed oversized unauthorized ignored low-confidence credential-bearing or unconfigured outcomes persist content-free status metadata only.
  - Duplicate deliveries repeated completed turns and worker restarts converge on one job and one candidate action while exact duplicates reinforce existing same-scope records rather than create duplicate memories.
  - Durable processing claims expire safely and deterministic database identities prevent duplicate candidates memories provenance relations and embeddings across crashes before or after candidate memory action embedding and outcome commits.
  - Shared-user scope proposals remain review-only until the versioned AURA-0039 agent memory policy explicitly authorizes an automatic promotion path.
  - Reinforcement appends provenance resets the relevance clock reactivates eligible dormant records and preserves prior revisions and evidence without overwriting history.
  - Fake-clock maintenance moves unpinned active records below 0.10 relevance to dormant archives them after 30 dormant days and leaves pinned disabled disputed superseded and already archived records unchanged.
  - Every accepted revision including manual creations corrections and reviewed candidates is durably embedded through retryable missing-embedding work.
  - Changing the configured embedding model creates a parallel building generation re-embeds all retained revisions resumably rejects mixed dimensions keeps the prior generation active until completion and atomically activates the replacement with rollback to the prior generation on failure.
  - Model configuration processing jobs candidates embedding generations activation and reindex state are owner-scoped and cross-owner identifiers return content-safe not-found without revealing existence.
  - Hard purge scrubs linked candidate action job and embedding retry content and installs a content-free terminal fence checked by queued duplicate restart maintenance and reindex paths so purged content cannot be recreated or re-embedded.
  - When an owner has no explicit compatible extraction or embedding configuration the job is parked content-free without provider invocation or fallback model selection.
  - Metadata-only spans metrics and evaluator outputs distinguish job extraction policy embedding maintenance reindex retry and failure outcomes without memory text evidence prompt response vector credentials owner subjects or model payloads.
  - Component-local queue wait extraction policy job maintenance embedding reindex chunk and atomic-switch latency plus bounded retry error missing-embedding backlog and reindex backlog signals diagnose asynchronous failure and recovery without substituting conversational or run latency.
  - Trace and link continuity preserves stable command job correlation causation run conversation memory revision and generation identities as validated trace-only attributes from outbox dispatch through JetStream delivery worker inference policy embedding and persistence while metric dimensions remain bounded.
  - Every affected component manifest declares a stable versioned input and output schema dependencies replayability with an accurate reason or safe synthetic-fixture hook metadata allowlists prohibited content bounded retention export failure behavior and metric-versus-trace cardinality.
  - Evaluation fixtures cover family facts changing project state short-lived meal context preferences corrections contradictions agent-private and shared-user information and report component and policy versions extraction model identity embedding generation fixture revision action precision scope accuracy horizon accuracy duplicate reinforcement accuracy and maintenance invariants.
  - No hybrid recall context injection agent memory policies candidate HTTP resources SSE memory activity or Aura Web memory UI is added in AURA-0038.
  - All new and changed Core sources have exactly one module-registry owner with reviewed dependency edges and no new deployable service provider authority or database ownership boundary is introduced.
