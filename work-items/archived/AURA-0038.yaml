id: AURA-0038
title: Add autonomous memory extraction and maintenance
status: integrated
change_class: repository_governance
intent: >
  Process completed conversation turns asynchronously into policy-validated
  memory candidates, accepted revisions, embeddings, lifecycle transitions,
  and resumable embedding generations without delaying conversational
  responses or introducing retrieval or product UI behavior.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/memory-and-knowledge.md
    - docs/specifications/agents-and-execution.md
    - docs/specifications/open-decisions.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - User-approved Autonomous Scoped Long-Term Memory plan
    - AURA-0037 scoped memory contracts and persistence foundation
    - The existing Core worker remains the deployable boundary and receives a separate versioned identifier-only memory command
    - PostgreSQL owns candidate job maintenance configuration and reindex state while NATS remains an at-least-once wakeup transport
    - Dedicated extraction and embedding model selections are owner-scoped persisted configuration with no hard-coded model names
    - Structured inference remains a generic schema-driven runtime port while memory action semantics and validation remain owned by knowledge.memory
    - Embedding providers use a separate providers.embeddings boundary and do not extend the chat-model adapter with embedding authority
    - Platform outbox code remains generic while the versioned memory command topic DTO and payload validation remain owned by knowledge.memory
    - Memory jobs bind the completed run agent revision and exact user and assistant message identifiers and the worker re-resolves their owner conversation roles completion state and evidence digest before inference
    - Sensitive-category policy uses a bounded versioned deterministic fail-closed taxonomy and never trusts a provider ordinary label to permit auto-commit
    - Until versioned agent memory policies arrive in AURA-0039 every proposed promotion from the current agent scope into shared-user scope requires review
    - At-least-once processing uses durable owner-scoped leases deterministic job candidate and action identities database uniqueness and resumable idempotent steps across every commit boundary
    - Ignored discarded malformed credential-bearing and unconfigured outcomes retain only content-free processing metadata
    - Hard purge creates a content-free terminal fence that prevents queued retry maintenance and reindex work from recreating or re-embedding purged content and scrubs linked candidate and job content
    - Model configuration HTTP resources and Aura Web controls remain reserved for AURA-0040
    - Ordinary grounded candidates at confidence 0.85 or higher may auto-commit while 0.60 through less than 0.85 conflicts sensitive categories and risky scope changes require review and lower-confidence candidates are discarded
    - Credentials and secret values are rejected before candidate or memory persistence regardless of model confidence
    - Accepted memory revisions are incomplete until their selected-generation embedding is durably attached and retryable failures never alter the completed conversation
    - Relevance decay uses the persisted reinforcement clock and half-life with a 0.10 dormant threshold and archival after 30 dormant days while pinned records do not transition automatically
    - Re-embedding builds a parallel resumable generation and atomically activates it only after every retained revision is embedded while the prior active generation remains available
    - No conversational recall hybrid search agent memory policy SSE activity or memory product UI is implemented in this work item
