id: AURA-0011
title: Isolate architecture hook tests from the caller worktree
status: integrated
change_class: repository_governance
intent: >
  Run hook regression fixtures in an isolated temporary repository so the
  architecture unit suite validates hook behavior without mutating or
  interpreting unrelated in-progress work from the caller's worktree.
sources_of_truth:
  architecture:
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications: []
  decisions:
    - User-authorized repository enforcement changes needed to complete the approved Aura Web work
  contracts: []
feature_references: []
ownership_zones:
  - repository.governance
allowed_paths:
  - tooling/architecture/tests/test_hooks.py
  - work-items/active/AURA-0011.yaml
  - work-items/archived/AURA-0011.yaml
forbidden_paths:
  - AGENTS.md
  - .agents/**
  - .codex/**
  - .github/**
  - compose.yaml
  - frontend/**
  - services/**
  - contracts/**
  - packages/**
  - evaluations/**
  - deploy/**
  - infra/**
  - satellites/**
  - extensions/**
  - scripts/**
  - docs/architecture/**
  - docs/design/**
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: false
  concerns: []
  data_classes: []
required_agents:
  implementation:
    - platform_worker
  review:
    - general_reviewer
    - architecture_guardian
  integration: false
execution:
  parallelism_class: local
  max_parallel_agents: 1
  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: false
  escalation_reason_required: true
acceptance_criteria:
  - Hook regression fixtures execute in an isolated temporary repository created from the current committed state.
  - The architecture test suite does not create active work-item fixtures in the caller's worktree.
  - The successful-completion hook test is unaffected by unrelated uncommitted paths in the caller's worktree.
  - Production hooks, ownership enforcement, schemas, protected baselines, and product code are unchanged.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0011.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0011.yaml
  - python3 -m unittest discover -s tooling/architecture/tests -v
  - python3 tooling/architecture/validate-repository-shape.py
  - git diff --check
baseline_changes_allowed: false
human_approval_required: true
open_decisions: []
