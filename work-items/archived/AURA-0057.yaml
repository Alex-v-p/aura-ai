acceptance_criteria:
  - Delayed first native tool-selection and tools-disabled synthesis events preserve their pending provider reads while cancellation and lease-loss polling remain responsive.
  - A thinking-capable provider normalizes thinking frames into a provider-neutral bounded delta in plain inference native tool selection and tools-disabled synthesis without leaking provider-native response shapes.
  - Thinking deltas never count as visible answer text never participate in mixed text or tool protocol decisions and never enter the assistant message or title input.
  - Core publishes ordered bounded thinking deltas over an ephemeral non-JetStream NATS subject to active owner-authorized run SSE clients without PostgreSQL persistence Last-Event-ID cursor advancement or reconnect replay.
  - OpenAPI 1.10.0 and the additive run-event v1 schema describe the transient model.thinking.delta event and the generated Aura TypeScript transport client remains synchronized.
  - Aura Web safely accumulates ordered thinking deltas per active run renders them as inert text in an accessible labeled disclosure and automatically collapses but does not merge them into the transcript when the run becomes terminal.
  - Missing duplicate stale out-of-order oversized and over-budget thinking deltas fail closed without affecting the final answer stream.
  - Existing text-only tool-call approval cancellation retry durable event replay heartbeat and generated-client behavior remain backward compatible.
  - Telemetry records only bounded thinking stream outcomes and lifecycle metadata and contains no thinking text prompt context memory tool arguments credentials or owner identity.
  - Unit contract frontend accessibility browser and full-stack tests cover delayed events thinking parsing transient transport owner isolation no replay safe rendering terminal behavior and regression of ordinary runs.
