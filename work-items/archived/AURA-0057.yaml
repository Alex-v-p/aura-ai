security_privacy:
  applicable: true
  concerns:
    - Thinking deltas may contain private prompt context memory system instructions tool arguments or inferred user data and are authorized only to the run owner.
    - Thinking is live-only and must not be persisted in PostgreSQL replayed after reconnect appended to assistant messages copied into audit outbox JetStream telemetry logs errors or Observatory.
    - Core NATS may carry only the bounded transient thinking envelope on a non-JetStream subject and must never retain it as business state.
    - Thinking payloads require strict field validation per-chunk and per-run bounds and ordered offsets before transport and browser display.
    - Aura Web must render thinking as inert escaped text with no Markdown HTML links scripts or content-driven actions.
    - Thinking appears separately from the final answer is labeled as model reasoning and collapses when the run becomes terminal.
    - Providers that do not expose thinking retain existing behavior and existing SSE clients may ignore the additive event safely.
    - Cancellation lease loss timeout and reconnect must not cause stale thinking from one attempt or run to appear under another response.
  data_classes:
    - private_ephemeral_model_reasoning
    - owner_conversation_and_run_identifiers
    - model_stream_lifecycle_metadata
