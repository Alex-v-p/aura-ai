id: AURA-0057
title: Repair delayed model streams and expose live model thinking
status: integrated
change_class: repository_governance
intent: >
  Prevent delayed tool-selection and synthesis streams from being canceled by
  cancellation polling, and let authenticated owners observe bounded thinking
  deltas from capable models in Aura Web without persisting, replaying, or
  treating that private reasoning as assistant transcript content.
