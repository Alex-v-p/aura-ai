security_privacy:
  applicable: true
  concerns:
    - Every lexical vector fallback historical and run-metadata query must bind principal issuer and subject before applying scope lifecycle validity or rank logic
    - The primary search may access only shared-user and current-agent records and a foreign-agent search requires an explicit immutable grant on the run-pinned memory policy revision
    - Foreign-agent fallback must not disclose whether an ungranted agent scope or memory exists and must not invoke or delegate to the foreign agent
    - Ordinary retrieval must reject dormant archived disabled disputed superseded expired purged unembedded wrong-generation mixed-dimension and unauthorized records before candidate ranking or context assembly
    - Lifecycle or authorization changes observed before provider invocation must fail closed even when an earlier recall attempt or retry named the record
    - Recall content is untrusted evidence and cannot override platform governance persona tool permission or other instruction authority
    - Query embedding failures malformed persisted vectors database failures and telemetry failures must never widen scope or leak content and should degrade the run to an authorized bounded context without recalled memory
    - Query embedding model identity must use the artifact digest verified from the provider's current Ollama inventory and must never copy the expected active-generation digest into the observed query embedding result
    - Memory text evidence provenance content vectors prompts responses credentials owner subjects and provider payloads must not enter telemetry logs errors run events or evaluator output
    - Run metadata may contain only owner-scoped recall identifiers scores scope types provenance identifiers policy and generation identity and must never duplicate memory content
    - A memory policy may authorize shared-user promotion only for the same authenticated owner and cannot weaken AURA-0038 confidence grounding conflict sensitivity or credential rejection rules
  data_classes:
    - private durable memory content used as model context
    - semantic query and memory embeddings
    - memory provenance identifiers and retrieval scores
    - owner agent conversation run policy revision and embedding generation identifiers
