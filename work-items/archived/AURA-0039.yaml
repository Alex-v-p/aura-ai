id: AURA-0039
title: Add scoped hybrid memory recall
status: integrated
change_class: repository_governance
intent: >
  Add immutable agent memory policies and owner-scoped hybrid memory retrieval
  to Core run context assembly so eligible shared-user and current-agent
  memories can influence later answers within strict authorization, lifecycle,
  provenance, observability, and token-budget boundaries, without adding the
  memory product API, realtime activity protocol, or Aura Web experience.
