    - docs/specifications/agents-and-execution.md
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/open-decisions.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - User-approved Autonomous Scoped Long-Term Memory plan
    - AURA-0037 scoped memory contracts and persistence foundation
    - AURA-0038 autonomous extraction and maintenance
    - Migration 0001 may add only an idempotent CREATE EXTENSION IF NOT EXISTS vector statement immediately before metadata create all so a fresh database can materialize the already-registered memory embedding vector column
    - No other migration 0001 schema behavior historical ownership or bootstrap ordering change is authorized by this repair
    - Migration 0009 may add only the minimal idempotent unique owner identity on memories id principal issuer and principal subject required before its owner-qualified composite foreign keys are created
    - The migration-chain repair must preserve owner-qualified memory foreign keys and may not replace them with identifier-only references or weaken owner isolation
    - Each immutable agent revision references one immutable memory policy revision and each admitted run pins that exact policy revision
    - The existing Core worker composition root may inject the agent store policy loader into memory processing but may not change worker commands subjects routing settlement protocol or deployable behavior
    - AURA-0038 processing and maintenance tests may change only to prove strict provider-returned embedding identity and digest verification pinned memory-policy claim and hydration and normal or reindex embedding regression safety
    - The existing memory domain test may change only to supply the newly required observed embedding model identity to attach embedding callers and assert identity mismatch rejection
    - Initial readable scopes remain the authenticated owner's shared-user scope the current agent scope and explicitly granted fallback agent scopes only
    - Shared-user and current-agent scopes are searched first and granted foreign-agent scopes are searched only when the primary result set is below the versioned calibrated relevance threshold
    - A fallback grant permits retrieval from a foreign agent scope but never invokes delegates to or imports configuration from that agent
    - Shared-user extraction proposals may auto-commit only when the pinned memory policy explicitly authorizes promotion and all AURA-0038 grounding confidence sensitivity and conflict rules also pass
    - PostgreSQL full-text search and exact active-generation pgvector similarity each return at most 50 policy-filtered candidates and are fused with reciprocal-rank fusion using k 60
    - Final deterministic reranking includes relevance decay importance confidence validity and scope while factual confidence remains distinct from retrieval relevance
    - Ordinary recall excludes dormant archived disabled disputed superseded expired unauthorized unembedded and purged records before ranking
    - Explicit historical retrieval remains a separate owner-authorized query mode and never feeds ordinary conversational context
    - Run context receives no more than eight recalled memories and memory evidence consumes no more than 20 percent of the configured run context token budget
    - Recalled memory is untrusted contextual evidence and is never concatenated into or interpreted as platform governance persona or tool policy instructions
    - Every recall snapshot records memory and revision identifiers component scores scopes provenance identifiers policy revision and embedding generation in Core-owned run metadata
    - Retrieval telemetry and evaluator results remain metadata-only and never export memory text provenance evidence vectors prompts responses credentials or owner subjects
    - Public memory-policy and per-run activity resources generated clients SSE activity events and Aura Web surfaces remain reserved for AURA-0040
