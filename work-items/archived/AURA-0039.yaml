acceptance_criteria:
  - Migration 0010 creates immutable versioned memory policies fallback grants agent-revision references run-pinned policy provenance and recall metadata with forward-only owner-safe constraints and a seeded default policy for existing agent revisions.
  - Migration 0001 idempotently enables the pgvector extension immediately before metadata create all and makes no other historical change so an empty PostgreSQL database without a preinstalled vector extension can create the registered vector column.
  - Migration 0009 creates its minimal unique memories id principal issuer principal subject owner identity idempotently before adding the composite owner-qualified foreign keys and retains those owner-qualified references without an identifier-only downgrade.
  - PostgreSQL migration acceptance passes both a fresh empty 0001 through 0010 upgrade on a database where the vector extension has not been enabled and an existing 0009 through 0010 upgrade with the same owner-qualified memory foreign-key integrity.
  - Every new or revised agent revision references exactly one immutable memory policy revision and run admission persists that exact policy identifier so queued execution never consults a mutable current agent configuration.
  - A versioned memory policy explicitly governs shared-user reads current-agent reads granted foreign-agent fallback scopes calibrated fallback threshold context limit and whether otherwise-eligible shared-user extraction promotion is permitted.
  - The policy service rejects duplicate cyclic self or nonexistent fallback grants and never treats an agent profile reference as authority to read a different authenticated owner's memory.
  - Shared-user and current-agent records are searched first and granted foreign-agent scopes are searched only when primary eligible results remain below the pinned policy's calibrated relevance threshold.
  - Foreign-agent fallback performs retrieval only and never invokes the granted agent creates a child run imports its prompt or tools or expands beyond the exact granted agent profile scopes.
  - PostgreSQL applies owner scope lifecycle validity active embedding generation and dimension filters before returning at most 50 full-text candidates and at most 50 exact pgvector cosine-similarity candidates without an ANN or Python full-table production scan.
  - Lexical and vector ranks are deduplicated and combined with reciprocal-rank fusion using k 60 then deterministically reranked using decayed relevance importance factual confidence current validity and scope with a versioned scoring policy.
  - Ordinary recall excludes dormant archived disabled disputed superseded expired unauthorized purged and missing-active-generation-embedding records while an explicit owner-authorized historical query can include requested historical lifecycle states without feeding conversational context.
  - Query embedding uses the selected active owner generation and exact recorded model identity revision digest and dimension and an unavailable or invalid query embedding fails closed without delaying or failing the conversational response.
  - The provider-neutral embedding result carries a provider-verified model artifact digest distinct from the query-vector digest and the Ollama embedding adapter resolves it from current provider inventory for the requested model without introducing memory semantics or a new provider boundary.
  - Recall compares the provider-observed embedding model digest with the active generation digest and degrades to no recalled memory when inventory is unavailable malformed ambiguous missing the requested model or reports a mismatched digest; composition never substitutes the expected generation digest as observed provider identity.
  - Focused processing and maintenance regressions prove normal embedding and reindex paths reject provider-returned model identity revision digest or dimension mismatches and preserve pinned policy claim and hydration behavior without changing AURA-0038 extraction maintenance retry or lifecycle semantics.
  - Focused memory domain attach-embedding tests provide observed model identity revision and digest values and prove mismatches are rejected without changing other memory domain behavior.
  - Context assembly injects at most eight distinct eligible memory revisions and uses no more than 20 percent of the configured run context token budget while preserving the current user prompt mandatory system policy and total context ceiling.
  - Memory context is represented as a distinct clearly delimited evidence component that identifies it as potentially stale untrusted context and never concatenates memory text into platform governance persona tool or output instructions.
  - Recall selection is durably recorded before provider invocation with run ID memory ID revision ID final and component scores scope provenance identifiers memory-policy revision embedding generation retrieval version and selection order but without memory text or vectors.
  - Run retries reuse the pinned policy and fail closed against current owner authorization lifecycle validity and generation eligibility before any previously selected memory content is sent to a provider.
  - The AURA-0038 extractor consults the completed run's pinned memory policy before auto-committing a shared-user scope proposal and all grounding confidence conflict sensitivity and credential safeguards remain mandatory.
  - Production worker composition injects agent_policy_loader from memory_uow.make_agent_policy_loader agent_store into the existing memory processing service so shared-user promotion resolves the authenticated run's pinned agent revision and policy and rejects a missing mismatched or mutable-current policy snapshot.
  - The worker composition change does not alter command payloads JetStream subjects routing acknowledgement settlement retry lifecycle or deployable process behavior.
  - In-memory and PostgreSQL implementations enforce identical scope fallback lifecycle ranking context-limit and metadata behavior and deterministic fake-clock tests cover relevance decay validity and stale-result exclusion.
  - Evaluation fixtures cover family facts changing project state short-lived meal context preferences corrections contradictions agent-private shared-user and granted versus ungranted foreign-agent facts.
  - Retrieval evaluation reports recall at K precision at K reciprocal rank stale-result rate irrelevant-context rate latency fallback correctness and token-budget compliance with fixture policy retrieval and embedding-generation versions.
  - Security fixtures prove zero unauthorized cross-owner cross-agent or ungranted fallback recalls including identifier guessing retries disabled records expired records and mixed embedding generations.
  - Metadata-only spans metrics and evaluator outputs distinguish lexical vector fusion rerank primary fallback selection context-budget and controlled degradation outcomes without memory text evidence vectors prompts responses credentials or owner subjects.
  - The memory-retrieval component manifest declares stable versioned inputs outputs dependencies replayability capture allowlists prohibited content bounded cardinality retention export failure behavior metrics and synthetic evaluation support.
  - No HTTP memory-policy resources per-run memory-activity resources run-event schema SSE memory activity generated client Aura Web UI document scope household scope workspace scope world-model graph or delegation behavior is added in AURA-0039.
  - All new and changed Core sources have exactly one module-registry owner with reviewed public dependency edges and no new deployable service package provider authority framework or database ownership boundary is introduced.
