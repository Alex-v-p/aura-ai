id: AURA-0007
title: Add authorized commit and push checkpoint guidance
status: integrated
change_class: repository_governance
intent: >
  Make commit and push checkpoint cadence explicit in Aura's agent workflows so
  long-running authorized work is recoverable at coherent reviewed milestones,
  without granting standing push authority or encouraging broken micro-commits.
sources_of_truth:
  architecture:
    - AGENTS.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
    - docs/development/worktree-collaboration.md
  specifications: []
  decisions:
    - User instruction to commit and push periodically when authorized (2026-10-04)
  contracts: []
feature_references: []
ownership_zones: [repository.governance, documentation.development]
allowed_paths:
  - AGENTS.md
  - .agents/skills/git-commit/SKILL.md
  - .agents/skills/aura-integrate-change/SKILL.md
  - docs/development/codex-agent-system.md
  - docs/development/work-item-process.md
  - docs/development/worktree-collaboration.md
  - work-items/**
forbidden_paths:
  - frontend/**
  - services/**
  - contracts/**
  - packages/**
  - evaluations/**
  - deploy/**
  - infra/**
  - satellites/**
  - extensions/**
  - scripts/**
  - .github/**
  - .codex/**
  - tooling/architecture/**
  - docs/architecture/**
  - docs/adr/**
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: null
  owning_module: null
observability:
  applicable: false
  affected_components: []
  required_metrics: []
  required_evaluators: []
  capture_policy: null
security_privacy:
  applicable: false
  concerns: []
  data_classes: []
required_agents:
  implementation: [platform_worker]
  review: [general_reviewer, architecture_guardian]
  integration: false
execution:
  parallelism_class: local
  max_parallel_agents: 1
  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: false
  escalation_reason_required: true
acceptance_criteria:
  - Workflow guidance requires focused commits after coherent reviewed and validated milestones when explicit commit authorization exists.
  - When explicit push authorization exists, each such checkpoint is pushed normally to the configured upstream or named destination.
  - Guidance identifies work-item completion, ownership-zone handoff, pre-integration safety points, and prolonged work with a coherent validated slice as useful checkpoints.
  - Guidance forbids broken, unreviewed, unrelated, secret-bearing, temporary, generated-only, or noisy micro-commits.
  - Commit and push authorization remains task-specific and does not become standing authority for later tasks.
  - Force pushes, history rewrites, and pushes without explicit authorization remain prohibited.
  - Product code, contracts, architecture decisions, deployment files, and enforcement tooling are unchanged.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0007.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0007.yaml
  - python3 -m unittest discover -s tooling/architecture/tests -v
  - python3 tooling/architecture/validate-repository-shape.py
  - git diff --check
baseline_changes_allowed: false
human_approval_required: true
open_decisions: []
