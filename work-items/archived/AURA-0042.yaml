  - evaluations/**/baselines/**
contracts:
  changes_allowed: true
  affected: [contracts/openapi/aura-v1.yaml]
  compatibility_requirement: backward_compatible
data:
  migration_required: false
  owning_service: aura-core
  owning_module: runtime.models
observability:
  applicable: true
  affected_components:
    - aura.runtime.structured_inference
  required_metrics:
    - model_inventory_duration_ms
    - model_inventory_outcome
    - model_inventory_cache_outcome
    - model_capability_verification_duration_ms
    - model_capability_verification_outcome
  required_evaluators: []
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Provider endpoints credentials prompts responses vectors and owner identifiers never appear in errors logs metrics or traces
    - Memory configuration fails closed unless current provider identity capability and embedding dimension are verified server-side
    - Structured-output verification is content-free bounded and limited to the explicitly selected extraction model
    - Embedding fallback verification uses fixed non-private input and never persists the returned vector
    - Untrusted provider metadata is bounded and validated before crossing the adapter boundary
  data_classes:
    - local model identifiers revisions digests capabilities and embedding dimensions
required_agents:
  implementation: [contract_steward, core_worker, platform_worker, test_evaluation_engineer]
  review: [general_reviewer, architecture_guardian, security_privacy_reviewer, observability_steward]
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 8
  max_parallel_writers: 3
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - General and memory inventory use validated provider metadata and never execute chat or embedding inference.
  - Current Ollama tags metadata supplies identity capabilities and embedding dimension without per-model show calls.
  - Incomplete legacy metadata uses bounded concurrent show lookups and isolates individual malformed timeout or unavailable models.
  - A short shared inventory cache prevents duplicate general and memory scans and refreshes after expiry.
  - Memory configuration resolves fresh metadata and verifies structured output only for the selected extraction model before persistence.
  - Capability verification is bounded content-free cached by model identifier and immutable digest and reruns after a digest change.
  - Embedding configuration uses provider metadata dimension and falls back to one non-empty fixed-input probe only when selected model metadata lacks a dimension.
  - Missing malformed or failed identity capability dimension and verification data reject configuration without replacing the current configuration.
  - Metadata and verification timeouts are independently configurable from inference runtime and propagated to API and worker containers where applicable.
  - Metadata-only telemetry diagnoses inventory cache and selection verification without private or provider payload content.
  - The running local Compose stack loads conversations and both inventories promptly against the configured restarted Ollama endpoint.
