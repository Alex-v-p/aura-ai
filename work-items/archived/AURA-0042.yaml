  - services/aura-core/src/aura_core/entrypoints/api/app.py
  - services/aura-core/src/aura_core/entrypoints/api/routes/models.py
  - services/aura-core/src/aura_core/platform/auth.py
  - services/aura-core/src/aura_core/platform/telemetry.py
  - services/aura-core/resources/component-manifests/structured-inference.yaml
  - services/aura-core/tests/test_ollama.py
  - services/aura-core/tests/test_memory_product_api.py
  - services/aura-core/tests/test_telemetry.py
  - services/aura-core/tests/system/test_contract_and_deployment.py
