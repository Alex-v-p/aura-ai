id: AURA-0042
title: Make Ollama discovery metadata-only and lazily verify memory models
status: integrated
change_class: contract
intent: >
  Keep Ollama model discovery fast and reliable by avoiding inference during
  inventory reads while preserving fail-closed, provider-verified memory model
  configuration at the explicit owner save boundary.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/memory-and-knowledge.md
  decisions:
    - User-approved AURA-0042 implementation plan
    - Live Ollama evidence showed metadata endpoints complete in milliseconds while cold inference probes exceed browser request tolerances
    - Ordinary inventory must never call chat or embedding inference
    - Explicit memory configuration save may run bounded content-free verification for only the selected models
    - Verification results are cached only by provider model identifier and immutable digest
  contracts:
    - contracts/openapi/aura-v1.yaml
feature_references: [MOD-001, MOD-003, MOD-014, MOD-017, MEM-019]
ownership_zones:
  - aura-core.runtime.models
  - aura-core.providers.models.ollama
  - aura-core.knowledge.memory
  - aura-core.entrypoints.api
  - aura-core.platform.configuration
  - aura-core.platform.telemetry
  - deploy.compose
allowed_paths:
