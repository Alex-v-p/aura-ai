id: AURA-0113
title: Settle deleted telemetry visibility slots
status: integrated
change_class: bugfix
intent: >
  Prevent owner-authorized Observatory retention deletion from leaving deleted
  receipt sequences as permanent visibility gaps that hide every newer run.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - work-items/archived/AURA-0108.yaml
    - work-items/archived/AURA-0109.yaml
    - Owner-authorized retention deletion is a terminal disposition for only the immutable target snapshot. Its receipt sequences may be settled in the visibility ledger atomically with receipt deletion so intentionally deleted observations cannot fence later retained observations.
    - Visibility settlement never treats an untargeted missing or pending receipt as persisted and introduces no timeout automatic abandonment or best-effort gap skipping.
    - The existing content-free retention audit remains the durable truth that the target content was deleted. No observation content or target identifiers are added to logs metrics errors or public event payloads.
    - The repair remains wholly Observatory-owned and changes no public contract migration service dependency Core behavior Aura Web behavior or cross-product communication.
  contracts: []
feature_references:
  - OBS-001
  - OBS-002
ownership_zones:
  - services.aura-observatory.retention
  - services.aura-observatory.ingest-visibility
  - evaluation.observatory-retention-visibility
  - delivery.aura0113
allowed_paths:
