contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data:
  migration_required: false
  owning_service: aura-observatory
  owning_module: retention
observability:
  applicable: true
  affected_components:
    - aura.observatory.retention
    - aura.observatory.telemetry_storage
  required_metrics:
    - observatory_retention_action_count
    - observatory_retention_deleted_count
    - observatory_retention_failure_count
    - observatory_ingest_visibility_lag_count
  required_evaluators: []
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Only receipt sequences belonging to the existing immutable owner-authorized retention target snapshot may be terminally settled.
    - Receipt settlement and deletion must be atomic and idempotent across retries and restart recovery.
    - Untargeted pending receipts remain pending and continue to fence visibility until persisted or explicitly deleted by a later owner-authorized action.
    - No telemetry payload target identifier credential or receipt content may enter audit details logs metrics errors or browser-visible events.
    - The correction remains inside Observatory and does not widen authorization retention scope or Core-to-Observatory coupling.
  data_classes:
    - telemetry_receipt_metadata
    - content_free_retention_audit
    - opaque_observation_identifiers
required_agents:
  implementation:
    - observatory_worker
  review:
    - general_reviewer
    - security_privacy_reviewer
    - observability_steward
    - architecture_guardian
  integration: true
execution:
  parallelism_class: local
  max_parallel_agents: 5
  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Owner-authorized purge-all and cutoff retention actions terminally settle exactly the receipt sequences in their immutable persisted target snapshot before deleting those receipts.
  - Settling a deleted target permits the committed visibility watermark to advance through contiguous targeted slots and already-visible health-event slots without advancing across any untargeted pending receipt.
  - The target settlement receipt deletion and watermark update are one PostgreSQL transaction so a crash cannot leave a committed partial disposition.
  - Retrying an interrupted or already-applied deletion is idempotent and never settles a receipt added after target capture.
  - ClickHouse deletion failure leaves PostgreSQL receipts visibility slots and committed watermark unchanged for the affected phase.
  - Existing stale-pending reconciliation continues to leave ordinary missing observations pending and redeliverable; there is no automatic age-based or outage-based gap skipping.
  - Existing retention audit authorization deletion counts retention phases and content-free event behavior remain unchanged.
  - Focused regressions cover a targeted missing receipt followed by a visible newer run an untargeted pending fence mixed visible and targeted slots retry behavior and transactional rollback.
  - No contract migration Core Aura Web Observatory frontend deploy dependency service baseline threshold or capture-policy change is introduced.
