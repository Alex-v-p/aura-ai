contracts:
  changes_allowed: true
  affected:
    - contracts/openapi/observatory-v1.yaml
  compatibility_requirement: backward_compatible
data:
  migration_required: true
  owning_service: aura-observatory
  owning_module: query-retention
observability:
  applicable: true
  affected_components:
    - aura.observatory.query_api
    - aura.observatory.live_updates
    - aura.observatory.retention
  required_metrics:
    - observatory_query_duration_ms
    - observatory_query_outcome
    - observatory_sse_connection_count
    - observatory_sse_replay_count
    - observatory_retention_action_count
    - observatory_retention_deleted_count
    - observatory_retention_failure_count
  required_evaluators:
    - observatory_query_contract
    - observatory_sse_catch_up
    - observatory_retention_idempotency
    - observatory_retention_preservation
  capture_policy: metadata_only
security_privacy:
  applicable: true
  concerns:
    - Every browser query live-update and retention endpoint requires the configured Observatory owner session and never accepts bearer credentials in URLs.
    - Query responses SSE events logs metrics and audit records contain metadata only and never expose provider tokens service credentials owner identity or arbitrary captured attributes.
    - Retention commands require same-origin anti-CSRF idempotency explicit confirmation and preserve immutable content-free audit records.
    - Cutoff deletion uses a required UTC instant and exact less-than semantics while purge-all cannot be inferred from an omitted cutoff.
    - Deletion removes observations receipts and derived run projections but preserves component and deployment definitions service configuration sessions and deletion audit records.
  data_classes:
    - operational_metadata
    - opaque_trace_identifiers
    - opaque_run_identifiers
    - deployment_metadata
    - retention_audit_metadata
required_agents:
  implementation:
    - contract_steward
    - observatory_worker
    - test_evaluation_engineer
  review:
    - general_reviewer
    - architecture_guardian
    - security_privacy_reviewer
    - observability_steward
  integration: true
execution:
  parallelism_class: standard
  max_parallel_agents: 8
  max_parallel_writers: 3
  model_tier: deep
  model_escalation_allowed: true
  escalation_reason_required: true
acceptance_criteria:
  - Observatory OpenAPI 1.0 is versioned at observatory-v1 and generates a transport-only Angular client without importing Aura product feature libraries.
  - Owner-authorized REST exposes system and ingest overview cursor-paginated run search run and trace detail ordered parent-child spans component catalogue health summaries deployment catalogue and retention action creation and status.
  - Run search filters status component model deployment and UTC time bounds with opaque stable cursors and deterministic ordering under concurrent ingestion.
  - The authenticated same-origin SSE endpoint begins from a REST snapshot accepts Last-Event-ID catches up from persisted observations and emits metadata-only change notifications without credentials in URLs.
  - Delete-before and purge-all are distinct asynchronous idempotent commands requiring owner authorization same-origin CSRF idempotency keys exact confirmation and a content-free audit record.
  - Delete-before removes observations strictly older than its required UTC cutoff while purge-all removes every observation and both remove associated receipts and derived run projections.
  - Retention retries and worker recovery are safe under concurrent or repeated requests and expose queued running succeeded and failed status without duplicate destructive execution.
  - Component and deployment definitions service configuration sessions and deletion audit records survive all retention actions and no automatic TTL or scheduled purge is introduced.
  - Query retention and SSE code remains Observatory-owned and does not import Core or read Core tables.
