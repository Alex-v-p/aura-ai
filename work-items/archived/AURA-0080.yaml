id: AURA-0080
title: Add Observatory query live-update and retention API
status: integrated
change_class: repository_governance
intent: >
  Provide the owner-only Observatory query, live metadata notification, and
  manual retention surface over Observatory-owned data, with a versioned
  OpenAPI contract and generated transport-only Angular client.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/open-decisions.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-approved retention remains indefinite until an explicit owner-authorized deletion command executes.
    - Owner-approved live updates use authenticated same-origin SSE with persisted observation identifiers for catch-up.
  contracts:
    - contracts/telemetry/v1/metadata-observation.schema.json
