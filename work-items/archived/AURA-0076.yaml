security_privacy:
  applicable: true
  concerns:
    - Every attachment metadata content preview deletion and conversation-link operation is owner-authorized without cross-owner existence disclosure.
    - PNG JPEG and WebP acceptance is signature-verified and bounded against malformed content animation decompression bombs and images over forty megapixels.
    - Original images are private owner downloads while model and preview paths use metadata-free color-normalized derivatives capped at 2048 pixels.
    - Admission atomically rejects missing unavailable cross-owner duplicate excessive and non-ready resources without creating a message or run.
    - Only active-branch ancestors can authorize retrieval or image bytes and every new or regenerated run re-authorizes them.
    - Logs events traces metrics evaluations and browser durable storage exclude image bytes filenames EXIF prompts document excerpts and extracted content.
    - Deletion removes image objects and derivatives but immutable message history retains only a content-free unavailable tombstone.
  data_classes:
    - private_document_content
    - private_image_content
    - user_supplied_filename
    - image_metadata
    - opaque_attachment_identifiers
    - owner_identity
    - model_capability_metadata
