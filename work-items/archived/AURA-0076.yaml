id: AURA-0076
title: Add conversation attachments and capability-gated Ollama vision
status: integrated
change_class: repository_governance
intent: >
  Let an authenticated owner attach ready PDF and DOCX documents plus safely
  inspected PNG, JPEG, and static WebP images to immutable conversation turns,
  ground answers in the active branch's attached documents, and use images only
  with the explicitly selected Ollama model after a fresh verified vision-capability check.
