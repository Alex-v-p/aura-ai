  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/specifications/agents-and-execution.md
    - docs/specifications/memory-and-knowledge.md
    - docs/specifications/clients-and-voice.md
    - docs/specifications/aura-ai-envisioned-feature-catalogue.md
    - docs/design/components-and-interactions.md
    - docs/design/failure-and-recovery-states.md
  decisions:
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - Owner-approved images belong to a new artifacts.attachments Core domain while PDF and DOCX ownership remains in knowledge.documents.
    - Owner-approved message links store only source kind and opaque source ID without cross-domain database foreign keys.
    - Owner-approved image inference is capability-gated and never silently changes or ignores the selected model.
    - Owner-approved Ollama model recommendations are presentation guidance and no model identifier is hard-coded as provider behavior.
    - Owner-approved attachment context follows only the active branch ancestor path and prioritizes current-message resources.
    - Owner-approved capture is metadata-only and excludes bytes filenames EXIF prompts excerpts and model-visible content.
  contracts:
    - contracts/openapi/aura-v1.yaml
    - contracts/events/runs/v1/run-events.schema.json
