acceptance_criteria:
  - The owner can upload signature-verified PNG JPEG and non-animated WebP images up to 25 MB through resumable or idempotent sessions and can list inspect download preview reuse and idempotently delete them through /api/v1/attachments.
  - Image inspection rejects malformed content animation decompression bombs and images above forty megapixels then preserves the authorized original and creates a metadata-free color-normalized derivative capped at 2048 pixels on its longest side.
  - PDF and DOCX continue through knowledge.documents with the existing 100 MB lifecycle and are never duplicated into the attachment blob domain.
  - Conversation creation run creation and edit-and-branch accept at most eight unique explicit attachment references including at most four images while remaining backward compatible when attachments are omitted.
  - Non-empty user text and an entirely ready owner-authorized attachment set are persisted atomically with the user message and admitted run or nothing is created.
  - Immutable message links and response summaries expose only the specified bounded metadata and preserve unavailable tombstones after document or image deletion.
  - Edit-and-branch preselects the source message set but submits a new explicit set regeneration reuses the source user set and only active-branch ancestors enter authorization retrieval model input events and telemetry.
  - Context selects no more than four most recent available ancestor images and searches no more than eight most recent unique ancestor documents with current-message attachments first.
  - Attached-document retrieval is deterministically limited to the authorized document IDs registers fresh run-scoped evidence and uses existing citation validation without changing document.search@1 whole-library behavior.
  - Provider-neutral messages carry bounded typed image parts and only the Ollama adapter converts their normalized bytes to native images fields for initial inference and later synthesis.
  - Image runs require a fresh digest-identified provider descriptor advertising normalized vision capability and otherwise return typed 409 model_vision_required without changing the selected model or discarding draft attachments.
  - The UI recommends qwen2.5vl:7b and may list gemma3:12b only as user-controlled guidance when verified but provider behavior contains no hard-coded model routing.
  - Aura Web offers accessible Upload Documents and Images picker views progress retry removable chips thumbnails immutable message cards authorized previews deletion tombstones responsive limits and explicit vision guidance without durable caching of authenticated image bytes.
  - Attachment lifecycle events and all telemetry evaluation and error paths contain only opaque identifiers states bounded counts versions timestamps and safe error classes.
  - Full-stack acceptance covers PDF DOCX PNG JPEG and WebP upload readiness attachment grounded citations verified image inference branch regeneration deletion and immutable historical tombstones.
  - Scanned-PDF OCR embedded DOCX images GIF HEIC SVG image-derived memory generated artifacts automatic model routing cloud vision automated retention and a standalone artifact-management page are not introduced.
