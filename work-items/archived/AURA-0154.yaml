id: AURA-0154
title: Reconcile governed research frontend acceptance assets
status: integrated
change_class: bugfix
intent: >
  Bring the older governed-research Storybook fixture and browser acceptance
  assertion into alignment with the integrated AURA-0153 recovery and source
  navigation semantics without changing product behavior.
sources_of_truth:
  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
    - docs/development/work-item-process.md
  specifications:
    - docs/design/governed-research-artifacts-and-tasks.md
    - docs/design/failure-and-recovery-states.md
    - docs/design/components-and-interactions.md
    - docs/design/foundations.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - work-items/archived/AURA-0147.yaml
    - work-items/archived/AURA-0153.yaml
    - work-items/active/AURA-0148.yaml
    - >-
      Integrated AURA-0153 product semantics expose Retry cleanup only for
      deletion_failed. A deletion_pending artifact is already admitted for
      cleanup, hides preview and download, and must not advertise or render a
      second cleanup command.
    - >-
      Integrated AURA-0153 Task Center semantics expose the capability-gated
      research detail action with the accessible name Open research source
      and route it to /research/:sourceId. Older acceptance must assert that
      exact action rather than a broader label that no longer matches.
    - >-
      The two observed failures are deterministic stale acceptance assets:
      Storybook deletion-pending coverage expects Retry cleanup from a fixture
      that incorrectly advertises canRetryCleanup, while the older browser
      suite searches for Open source after the product adopted the specific
      Open research source label.
    - >-
      The owner authorizes the minimum scope correction to include
      frontend/apps/aura-web-e2e/src/storybook-a11y.spec.ts. That assertion
      must verify deletion_pending has no Retry cleanup action while dedicated
      deletion_failed coverage continues to require Retry cleanup.
    - >-
      This correction changes only frontend fixture and acceptance assertions.
      It adds no product code, route, package, dependency, contract, migration,
      persistence behavior, telemetry, protected baseline, or architectural
      exception, so no new ADR is required.
  contracts:
    - contracts/openapi/aura-v1.yaml
