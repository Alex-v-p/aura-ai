acceptance_criteria:
  - >-
    The Storybook Artifact deletion pending fixture advertises no retry cleanup
    capability, and the existing light- and dark-theme accessibility scenario
    verifies the pending state and absence of a Retry cleanup control.
  - >-
    A dedicated Storybook deletion_failed fixture and its light- and dark-theme
    accessibility scenario continue to require a visible Retry cleanup action,
    proving that no fixture or assertion weakens the integrated AURA-0153
    recovery rule.
  - >-
    The older Task Center browser journey locates the exact accessible action
    Open research source, activates it, verifies navigation to the existing
    /research/:sourceId route, and retains its task-detail request and
    forced-colors assertions.
  - >-
    The complete Storybook Playwright suite and complete standard Aura Web
    Playwright suite pass across their configured themes, projects, and
    viewports; no test is skipped, narrowed, muted, or removed to obtain a
    passing result.
  - >-
    Formatting, focused lint, Storybook build, Aura Web production build,
    frontend boundary validation, architecture validation, and diff hygiene
    pass with no product, configuration, contract, dependency, lockfile,
    generated-client, protected-baseline, screenshot, trace, or video change.
  - >-
    A frontend implementation handoff, independent General, Architecture, and
    UX review verdicts, and an integration report are schema-valid before a
    focused local Conventional Commit checkpoint; AURA-0148 files remain
    unstaged and unmodified and nothing is pushed or published.
