id: AURA-0004
title: Allow explicitly authorized ordinary pushes
status: integrated
change_class: repository_governance
intent: >
  Permit ordinary Git pushes at the execution-policy layer so Codex can carry
  out an explicit user push request, while continuing to forbid force-pushes.
sources_of_truth:
  architecture: [docs/architecture/aura-ai-architecture-handover.md]
  specifications: []
  decisions: []
  contracts: [https://learn.chatgpt.com/docs/agent-configuration/rules]
feature_references: []
ownership_zones: [repository.governance]
allowed_paths: [.codex/rules/repository.rules, docs/development/codex-agent-system.md, work-items/**]
forbidden_paths: [services/**, frontend/**, contracts/**, evaluations/**, deploy/**, infra/**, satellites/**]
contracts:
  changes_allowed: false
  affected: []
  compatibility_requirement: none
data: {migration_required: false, owning_service: null, owning_module: null}
observability: {applicable: false, affected_components: [], required_metrics: [], required_evaluators: [], capture_policy: null}
security_privacy:
  applicable: true
  concerns: [remote repository mutation, history rewrite prevention]
  data_classes: [repository metadata]
required_agents:
  implementation: [platform_worker]
  review: [general_reviewer, security_privacy_reviewer]
  integration: false
execution:
  parallelism_class: local
  max_parallel_agents: 1
  max_parallel_writers: 1
  model_tier: balanced
  model_escalation_allowed: false
  escalation_reason_required: true
acceptance_criteria:
  - Ordinary git push resolves to allow.
  - Force-push variants continue to resolve to forbidden.
  - Repository instructions continue to require explicit user authorization before pushing.
required_checks:
  - python3 tooling/architecture/validate-work-item.py work-items/active/AURA-0004.yaml
  - python3 tooling/architecture/validate-changed-paths.py --work-item work-items/active/AURA-0004.yaml
  - codex execpolicy check --rules .codex/rules/repository.rules git push origin repo-setup
  - codex execpolicy check --rules .codex/rules/repository.rules git push --force origin repo-setup
baseline_changes_allowed: false
human_approval_required: true
open_decisions: []
