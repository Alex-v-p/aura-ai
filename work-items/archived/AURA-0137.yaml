    - docs/development/work-item-process.md
  specifications:
    - docs/design/daily-action-and-workflow-initiative.md
    - docs/specifications/agents-and-execution.md
    - docs/specifications/tools-automation-and-integrations.md
    - docs/design/failure-and-recovery-states.md
  decisions:
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0014-aura-owned-execution-langgraph-backend.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - docs/adr/0017-governed-production-run-evidence.md
    - work-items/archived/AURA-0135.yaml
    - work-items/archived/AURA-0136.yaml
    - Manual workflow admission is the only trigger in this work item; workflow scheduling and schedule metrics remain out of scope.
    - PostgreSQL workflow state is authoritative and every asynchronous wakeup carries identifiers only through the existing outbox and NATS direction.
    - The workflow application calls only public Run Coordinator Approval and Notification APIs and never imports their persistence or adapters.
    - The feature flag gates new publication and instance admission only; reads cancellation recovery deletion and already-admitted execution remain available.
    - Existing workflow lifecycle events are the persisted metadata-only source for SSE replay; NATS is only an ephemeral wakeup.
    - Workflow execution uses the lightweight Aura-owned coordinator path and does not expose or introduce LangGraph concepts.
