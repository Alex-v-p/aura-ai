security_privacy:
  applicable: true
  concerns:
    - Workflow definitions inputs outputs instructions mappings approval presentation notification content checkpoints results and owner identity cannot enter URLs ordinary events outbox wake payloads SSE telemetry logs or generated client diagnostics.
    - Every admission and resume revalidates the immutable owner workspace agent revision and the exact subset of source tool and memory grants; worker identity grants no authority.
    - Approval authorizes only the exact pending step and does not replace nested application permission confirmation or current authorization checks.
    - At-least-once wakeups duplicate commands stale versions restart recovery replay limits cancellation races and unknown outcomes must not duplicate effects or reopen terminal state.
    - Agent-run workflow inputs and earlier results remain bounded delimited untrusted evidence and cannot alter step kinds mappings permissions instructions grants or transitions.
    - Owner-enabled run evidence uses only closed automation serializers and remains best-effort nonblocking; credentials hidden reasoning and arbitrary object dumps are prohibited.
    - Deletion and retirement are owner-authorized CSRF-protected idempotent version-bound and preserve content-free lineage where required.
  data_classes:
    - owner-private workflow definitions revisions inputs outputs checkpoints results and history
    - owner-private workflow approval and notification presentation
    - metadata-only workflow lifecycle run and wake events
