acceptance_criteria:
  - The authenticated Aura API exposes owner-scoped draft validation immutable publication manual admission inspection cancellation recovery retirement seven explicit deletion scopes and metadata-only workflow SSE with persisted replay and Last-Event-ID.
  - Publication and admission are disabled with a controlled service-unavailable result when workflow_admission_enabled is false while reads cancellation recovery deletion retirement and already-admitted execution remain operational.
  - The SQL workflow repository fully implements the public protocol with optimistic versions idempotency row locking state history lifecycle events checkpoints results tombstones and owner isolation; migration 0028 is forward-only additive and preserves migration-head compatibility.
  - Exactly agent-run approval notification and wait-until handlers execute sequentially through public module APIs with stable step-execution idempotency and explicit replayable failed unknown and resolution-required behavior.
  - Agent-run execution uses a conversation-optional Run Coordinator command only when complete workflow revision instance and step-execution lineage is supplied and retains existing budgets cancellation evidence and terminal semantics.
  - Approval pause and resume remain exact owner version expiry and step bound; notification delivery remains owner scoped and idempotent; wait resumption uses persisted state and synthetic-clock-correct due handling.
  - Restart duplicate delivery concurrent command cancellation approval race replay reconciliation and downstream unknown-outcome paths never duplicate a side effect or reopen terminal truth.
  - Every admission and resume revalidates owner workspace agent revision and relevant grants and fails closed before the next step when authority has been lost.
  - Workflow lifecycle and SSE payloads remain metadata-only and use persisted replay as truth; identifiers remain correlation attributes rather than metric dimensions.
  - All declared workflow components emit their exact metrics with finite approved dimensions active-operation span boundaries and deterministic synthetic evaluators; no scheduler component or metric is added.
  - Governed workflow evidence uses existing automation evidence kinds and closed serializers without changing run outcome or requiring Observatory availability.
  - Existing conversation reminder briefing approval notification and run behavior remains backward compatible and no Aura Web workflow feature or Observatory product behavior is introduced.
