id: AURA-0137
title: Execute bounded manual workflows in Aura Core
status: integrated
change_class: repository_governance
intent: >
  Expose and execute owner-scoped manual sequential workflows through Aura
  Core using the established deterministic workflow state, public domain
  boundaries, transactional outbox, durable recovery, and metadata-only
  observability without adding schedules, branches, loops, parallelism, or a
  new executor framework.
