id: AURA-0096
title: Add experiments immutable baselines and deterministic regressions
status: integrated
change_class: repository_governance
intent: >
  Add Observatory-owned immutable experiment definitions, bounded variants and
  cohorts, explicit owner promotion into database-backed baselines, and
  reproducible deterministic absolute and relative regression comparisons with
  attribution, evidence links, deployment correlation, history, and accessible
  owner Web workflows without changing protected repository baselines or
  coupling Core to Observatory.
