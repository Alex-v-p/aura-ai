security_privacy:
  applicable: true
  concerns:
    - Every experiment baseline promotion and regression route and CLI action is owner-authorized and state changes require CSRF idempotency and closed confirmation where destructive or irreversible.
    - Promotion accepts only persisted immutable source results from the exact suite and capture boundary and stores an opaque authorization record without owner or session identity.
    - Regression and attribution outputs expose only bounded finite metrics exact versions opaque evidence identities and content-free hashes; raw evaluation content artifacts comments endpoints credentials and arbitrary attributes are prohibited.
    - Cohorts are explicit bounded case sets and cannot encode private owner agent workspace free text or unbounded caller-defined dimensions.
    - Browser state is memory-only and authenticated experiment baseline regression and evidence data is excluded from persistence URLs logs screenshots and analytics.
    - Missing partial late incompatible or insufficient evidence yields explicit unavailable or inconclusive state and cannot silently pass promote or attribute.
  data_classes:
    - experiment_definition_metadata
    - cohort_definition_metadata
    - immutable_baseline_metadata
    - manual_promotion_audit_metadata
    - regression_decision_metadata
    - attribution_evidence_metadata
