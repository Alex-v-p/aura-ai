open_decisions:
  - Deterministic absolute and relative regression thresholds are the only automated comparison decisions in this item. Statistical significance probabilistic confidence and automatic change-point detection remain explicitly unavailable until a later governed item.
  - Baselines are database-backed immutable Observatory records only. Protected repository baselines golden results and evaluation thresholds remain unchanged.
  - AURA-0097 consumes regression and attribution outputs for dashboards alerts annotations and incidents but does not broaden this item into alert delivery.
  - AURA-0098 owns complete composed-stack outage and local-provider browser acceptance.
