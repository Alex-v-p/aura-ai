acceptance_criteria:
  - evaluation-v1 and observatory-v1 add backward-compatible closed bounded resources for experiments variants cohorts baseline candidates manual promotion immutable baselines deterministic comparisons regressions attribution evidence and history with stable IDs UTC timestamps exact versions provenance and finite values.
  - Experiment creation validates exact existing suite dataset evaluator component model deployment prompt policy and configuration bindings and bounded explicit cohorts before immutable persistence; no caller-supplied arbitrary attributes or execution destinations are accepted.
  - Baseline candidates reference a non-empty exact persisted result set from one compatible suite and reproducibility boundary. Manual promotion is owner-authorized CSRF-protected idempotent explicitly confirmed audited and immutable; automatic promotion mutation demotion and protected repository baseline changes are impossible.
  - Regression evaluation is deterministic and reproducible for absolute and relative thresholds with explicit direction minimum sample cohort missing-evidence partial and incompatible states. Statistical and change-point claims remain unavailable rather than approximated.
  - Comparisons preserve operational and quality metric separation use bounded snapshot-stable pagination and expose exact baseline experiment cohort variant component model deployment policy prompt configuration and evaluator versions.
  - Attribution ranks only evidence-supported changed bindings and presents affected and unaffected cohorts plus opaque representative run trace result score and artifact references; missing evidence is explicit and no content is returned.
  - PostgreSQL and ClickHouse migrations are forward-only idempotent from empty and upgraded AURA-0095 state and preserve existing evaluation data. No automatic TTL or scheduled purge is added.
  - REST CLI and dedicated evaluation SSE remain owner-authorized bounded metadata-only and backward-compatible. Commands have durable restart-safe idempotency deterministic 409 422 503 and terminal behavior.
  - Generated Angular output is reproducible and transport-only. Observatory Web provides responsive keyboard-accessible experiment composition comparison baseline promotion regression evidence attribution cohort and history workflows without importing Aura product features.
  - Baseline promotion shows exact source suite result range thresholds capture classification and irreversible immutability consequence; requires typed confirmation prevents duplicate submission announces progress restores focus and refreshes every affected view.
  - Browser views distinguish loading empty partial stale disconnected rejected unauthorized unavailable incompatible insufficient-evidence inconclusive promoted regressed unchanged and recovered states with non-colour indicators accessible tables and reduced motion.
  - Authenticated data remains memory-only and logout auth-generation change and retention completion clear or refresh all affected experiment baseline regression and evidence views.
  - Real-browser acceptance covers experiment creation variant and cohort comparison candidate creation manual promotion history regression affected/unaffected cohorts attribution evidence responsive keyboard workflows failure recovery and protected-baseline non-mutation.
  - Core remains usable with Observatory stopped and no Core source migration runner protocol normal request readiness or scheduling dependency changes.
  - Python lint type and full tests contract compatibility generated-client parity Angular lint unit production and Storybook builds browser accessibility Playwright architecture validators baseline protection migration checks and diff checks pass.
