  architecture:
    - docs/architecture/aura-ai-architecture-handover.md
    - docs/architecture/overview.md
    - docs/architecture/system-context.md
    - docs/architecture/module-boundaries.md
    - docs/architecture/technology-stack.md
    - docs/development/codex-agent-system.md
  specifications:
    - docs/specifications/observatory-and-evaluation.md
    - docs/specifications/open-decisions.md
    - docs/specifications/aura-ai-envisioned-feature-catalogue.md
  decisions:
    - docs/adr/0012-python-angular-tailwind-toolchain.md
    - docs/adr/0013-postgresql-nats-valkey-garage-consistency.md
    - docs/adr/0015-authentik-bff-secrets-extensions.md
    - docs/adr/0016-api-realtime-pwa-and-voice-protocols.md
    - AURA-0089 owns the versioned Experiment Variant Cohort Threshold Baseline and Replay contracts plus the decisions that baselines are immutable database records promoted only by an explicit owner action.
    - AURA-0095 owns the owner BFF REST CLI metadata-only SSE generated-client and accessible Observatory evaluation workspace boundaries that this item extends additively.
    - Experiment variants compare exact immutable component model configuration prompt policy and deployment revisions. Cohorts select only bounded explicit case identities from the experiment suite and cannot carry arbitrary dimensions owner identity or content.
    - PostgreSQL is authoritative for experiment definitions immutable baseline records manual promotion authorization regression decisions attribution evidence references and history. ClickHouse stores bounded high-cardinality score and distribution comparison projections only.
    - Candidate creation and baseline promotion are separate idempotent owner-authorized commands. Promotion requires CSRF an exact destructive confirmation an opaque authorization record and immutable source result identities. Automatic promotion mutation and demotion are prohibited.
    - Protected repository golden results and repository baseline files are never created modified promoted or deleted. baseline_changes_allowed remains false.
    - Initial regression decisions are deterministic absolute and relative comparisons over finite persisted metrics with explicit minimum samples missing-evidence behavior and cohort scope. Statistical inference automatic change-point claims and probabilistic confidence are not implemented or implied.
    - Attribution is evidence-backed and content-free. It may rank exact changed component model deployment prompt policy and configuration revisions only when persisted comparison evidence supports them; unavailable attribution is explicit and never synthesized.
    - Regression evidence links use opaque run result score trace deployment and artifact-reference identities plus hashes and versions. They never include raw artifacts prompts responses comments filenames endpoints credentials owner identity or arbitrary attributes.
    - REST snapshots remain authoritative. Additive experiment baseline and regression notifications reuse the dedicated authenticated same-origin evaluation SSE ledger and carry metadata-only resource change notifications.
    - Authenticated experiment baseline and regression data remains memory-only in the browser and is excluded from Workbox Cache Storage localStorage sessionStorage IndexedDB URLs logs screenshots and analytics.
    - Existing Core evaluation runner NATS deployment authentication storage and service boundaries remain unchanged. No normal Core request depends on experiments baselines regressions or Observatory availability.
    - Existing architecture authorizes this Observatory-owned scope. Return ADR_REQUIRED if implementation requires a new deployable service shared Core storage altered runner protocol automatic or protected-baseline mutation cloud judges or a new cross-product dependency.
    - Material implementation choices use repository-pinned dependencies and current official PostgreSQL ClickHouse OpenAPI Angular accessibility and OWASP guidance without dependency upgrades.
