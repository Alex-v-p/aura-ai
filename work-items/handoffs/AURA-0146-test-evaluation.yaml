    Added four typed metadata-only delivery evaluators with positive and
    adversarial observations. Evaluator fixtures are test-owned and do not
    modify protected baselines or production behavior.
  - >-
    All test doubles use synthetic UUIDs and local public interfaces; no
    outbound network or provider deployment is enabled.
  - >-
    Updated only the two authorized legacy catalog/API tests to include
    web.research v1 in the built-in Aura catalog and current policy order;
    legacy policy revisions and custom-agent empty grants remain asserted.
  - >-
    Added restart, deletion-race, foreign-owner/origin/citation/artifact,
    bounded-payload, observability-outage, consumer nack/redelivery, and
    production-registry privacy/replay coverage. The full Core suite remained
