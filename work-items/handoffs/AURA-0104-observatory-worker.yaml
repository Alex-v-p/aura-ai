decisions:
  - >
    Added the public evaluator and artifact routes to the existing owner-session
    and CSRF boundary. Multipart input is parsed as exactly bounded metadata
    and content parts without adding a dependency; bytes are handed to the
    existing streaming, digest-verifying Garage service.
  - >
    Authorization request correlation is resolved from the Observatory-owned
    authorization metadata port rather than accepted from HTTP input. The
    request correlation remains internal and is never projected.
  - >
    Local-judge evaluator admission writes both the immutable judge definition
    and generic evaluator identity, accepts local_judge suite references, and
    uses the durable definition-command idempotency ledger for replay and
    interruption recovery.
  - >
    Capture authorization creation is owner/CSRF protected, closed, content
    free, durably idempotent, and bound to exact dataset version and manual
    retention. Artifact admission validates stored authorization, digest,
    version, intended use, media, byte count, and revocation before publish.
  - >
    Multipart parsing is incremental and capped, recognizes delimiters only at
    complete CRLF boundary lines, rejects malformed headers, and recursively
    rejects credential-bearing JSON/text before Garage storage. Standard
    filename dispositions are accepted without persisting filenames. JSON
    content is staged in a bounded temporary spool, fully decoded and
    recursively validated (including escaped credential keys), then replayed
    in full bounded chunks to storage only after validation.
  - >
    Public admission probe evaluation is strict about authentication, CSRF,
    no-store, and storage-byte facts for both success and expected rejection;
    contradictory probes fail closed.
  - >
    Storage and metadata are separate inward ports; production composition
    injects the PostgreSQL metadata adapter independently, while the typed
    definition-command port owns local-judge replay and generic evaluator
    admission.
risks:
  - >
    A fresh composed stack must have an owner-authorized evaluation
    authorization row and Garage credentials before artifact upload can be
    accepted; missing prerequisites fail closed with bounded responses.
