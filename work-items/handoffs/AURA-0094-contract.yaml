decisions:
  - >-
    Preserved evaluation-v1 and every established root resource while adding
    eight disjoint resourceType-identified variants to the root oneOf. New
    immutable record schemas are also addressable named definitions, and the
    only property added to an existing envelope is optional Score.localJudge
    metadata, so all older valid instances remain valid.
  - >-
    Kept evaluation-v1 authoritative instead of conforming the contract to
    narrower Python shortcuts. Accepted, rejected, and needs_review labels;
    required IDs, versions, idempotency and authorization metadata; advisory and
    qualification conditionals; and integer parts-per-million weights remain
    unchanged. Production implementations must adapt to these portable shapes.
  - >-
    Used a provider const of local_ollama plus an exact SHA-256 model digest and
    a bounded Ollama name-with-optional-tag grammar. Registry paths, URLs,
    endpoints, credentials, arbitrary provider options, and cloud fallback are
    structurally unrepresentable.
  - >-
    Represented prompts, rubrics, calibration labels, and optional human comments
    only through opaque UUID, version, purpose, digest, size, media, capture,
    authorization, and retention metadata. Raw content and free-form rationale
    or comments are absent.
  - >-
    Kept calibration eligibility and manual qualification distinct. A passing
    result is always advisory_only; only a separate exact-version manual owner
    action can create calibrated_enabled state, and revocation returns the state
    to advisory_only without erasing audit history.
  - >-
    Used integer parts-per-million ensemble weights to avoid floating-point
    normalization ambiguity. JSON Schema bounds each weight while the consumer
    must atomically enforce unique members and an exact one-million total.
  - >-
    Did not modify EvaluatorReference kinds: a weighted ensemble is a reviewed
    deterministic evaluator, so expanding the settled enum and old-consumer
    dispatch was unnecessary.
  - >-
    Did not edit runner transport or event schemas because raw judge content,
    provider configuration, qualification commands, and score rationale must
    not cross those boundaries. Public REST, SSE, CLI, and generated Angular
    contracts remain assigned to AURA-0095.
  - >-
    Applied the repository-pinned JSON Schema 2020-12 dialect and installed AJV
    8.20 validator. No external dependency-version verification or upgrade was
    needed, so no online documentation access was used.
risks:
  - >-
    JSON Schema cannot dereference service-owned records, prove stored artifact
    bytes match their digests, verify a referenced calibration result is current,
    detect revoked qualifications not embedded in a score, or enforce immutable
    insert conflicts. Service admission and persistence must fail closed on all
    of those checks.
  - >-
    JSON Schema cannot sum ensemble weights or prove member identities are
    semantically unique. The consumer must require an exact one-million
    parts-per-million total, unique exact member provenance, and current
    qualification for every local-judge member.
  - >-
    Syntactically opaque UUIDs and bounded model identifiers cannot prove values
    were not derived from private content. Producers must generate identifiers
    internally and keep content, owner identity, endpoints, credentials, and
    provider response text out of persistence and telemetry.
