decisions:
  - >-
    Current self-monitoring data is consumed from the generated observatory-v1
    client types. The web feature remains transport-only at the gateway and
    keeps all health state in the owning Observatory store.
  - >-
    Health history is requested through the bounded page_size 50 endpoint and
    remains in memory only. No authenticated response, health snapshot, or SSE
    payload is written to browser storage or a service-worker cache.
  - >-
    Overview health is backward compatible: older responses without the
    optional health snapshot render an explicit self-monitoring-unavailable
    retry state while the health-history resource reports its own loading,
    empty, stale, error, and ready states.
  - >-
    health.changed is subscribed through the existing authenticated SSE
    transport and refreshes the bounded history through the existing
    one-active-plus-one-trailing coordinator. Heartbeats do not trigger a
    history read.
  - >-
    The owner UI presents finite rejection reason codes, bounded lag/backlog,
    visibility watermark, worker heartbeat, storage/query latency, and
    timestamps with explicit units and text-plus-symbol state indicators.
  - >-
    Responsive and accessible behavior uses a keyboard-focusable horizontal
    table region on narrow screens, non-colour-only state labels, explicit
    empty/stale/unavailable/retry announcements, reduced-motion styles, and
    bounded layouts at mobile widths.
  - >-
    A disconnected live stream preserves an empty history as empty and leaves
    the disconnected state to the separate connection notice; only a cached
    non-empty history becomes stale. Unit coverage locks this distinction.
  - >-
    Mocked SSE coverage emits health.changed and verifies both the current
    overview and bounded history refresh to delayed metadata. Dedicated delayed
    and partial fixtures assert distinct state labels and explanatory copy.
