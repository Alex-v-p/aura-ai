  authorship: serialized by the assigned contract_steward after the Delivery Lead amended AURA-0084 to authorize these exact contract and generated-client paths; no concurrent contract author was assigned
  compatibility: backward_compatible
  definitions:
    - id: metadata-observation-v1
      version: 1
      source: contracts/telemetry/v1/metadata-observation.schema.json
      changes:
        - Widened the shared Uuid lexical pattern from RFC version and variant marker bits to any lowercase canonical 8-4-4-4-12 hexadecimal UUID representation.
        - Kept fixed length, lowercase hexadecimal alphabet, separators, closed objects, bounded dimensions, and metadata_only capture unchanged.
    - id: observatory-v1
      version: 1.0.0
      source: contracts/openapi/observatory-v1.yaml
      changes:
        - Applied the same canonical lowercase UUID validation widening to query identifiers so persisted Core correlations remain addressable through owner-authorized REST resources.
        - Regenerated the transport-only Angular client; the generated type surface is unchanged and only its source-contract digest changed.
  compatibility_notes:
    - This is a validation widening that accepts existing Core identifiers previously rejected by Observatory; every value accepted before this change remains accepted.
    - Core intentionally persists deterministic initial conversation, message, and run identifiers from 128 hash bits. Its aura-v1 contract declares UUID format without requiring version or variant marker bits, so changing those persisted identifiers would break idempotent identity and would not repair existing data.
    - Uppercase, compact, malformed, oversized, non-hexadecimal, and content-bearing values remain rejected.
    - Contract identifiers and versions remain unchanged because no operation, field, generated type, producer behavior, or capture classification changed.
  producers:
    - Aura Core metadata-only OTLP exporter
    - Aura Observatory retention and live-event identifier generators
  consumers:
    - Aura Observatory metadata ingestion runtime
    - Aura Observatory owner-authorized query and cursor runtime
    - Observatory Web generated transport client
    - Observatory contract and full-stack acceptance suites
  rollout:
    - Deploy Observatory ingestion and query runtime together with the widened contracts before rerunning full-stack acceptance against existing or newly generated Core identifiers.
    - No Core deployment, identifier rewrite, data migration, or coordinated client rollout is required.
    - Existing rejected telemetry is retried only under the exporter's existing bounded retry policy; no content or credentials are introduced during rollout.
  generated_outputs:
