    - id: Aura Core API
      version: 1.18.0
      source: contracts/openapi/aura-v1.yaml
      changes:
        - Added owner-scoped image upload-session, listing, detail, original download, normalized preview, and idempotent deletion operations under /api/v1/attachments.
        - Added optional bounded discriminated attachment references to conversation creation, run creation, and immutable edit-and-branch requests.
