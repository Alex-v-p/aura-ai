decisions:
  - OpenAPI 1.18.0 is an additive minor revision; no existing producer or consumer requirement was tightened.
  - Image resources use attachmentId while document references retain documentId; the shared submitted and response forms remain provider-neutral and do not imply database foreign keys.
  - Message tombstones use availability rather than attachment lifecycle state so deleted sources retain bounded immutable presentation metadata without exposing accessible content.
  - MessageAttachmentSummary is a generated discriminated union: available summaries carry typed source metadata, while unavailable summaries carry only opaque link/source identifiers, kind, the generic unavailable label, application/octet-stream, zero bytes, and no dimensions.
  - model_vision_required is a dedicated lowercase typed 409 as required by the approved plan; general Aura errors retain their existing uppercase-code contract.
  - Generated output remains transport-only types and operation descriptors with no admission, retry, selection, or routing behavior.
risks:
  - Core and frontend implementations must use the exact generated operation IDs and response shapes; early parallel drafts used provisional names and were reported to their owners.
  - Direct owner-authorized SSE snapshots may contain bounded display filenames, but artifact lifecycle events, persistence events, telemetry, audit, traces, metrics, evaluations, and provider diagnostics must remain filename-free.
  - The test/evaluation owner must update the existing MessageAttachmentSummary structure assertion for the oneOf union and persist available/tombstone schema-instance coverage in its authorized test paths before integration.
