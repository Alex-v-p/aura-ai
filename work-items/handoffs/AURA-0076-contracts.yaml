      version: 1
      source: contracts/events/artifacts/v1/attachment-events.schema.json
      changes:
        - Added a closed metadata-only image attachment lifecycle envelope containing only opaque identifiers, state, bounded object count, aggregate version, and timestamps.
        - Prohibited filenames, media types, byte counts, dimensions, owner identity, bytes, EXIF, prompts, extracted content, checksums, storage details, credentials, diagnostics, and provider responses.
    - id: https://aura.local/contracts/events/runs/v1/run-events.schema.json
      version: 1
      source: contracts/events/runs/v1/run-events.schema.json
      changes:
        - Added optional attachment summaries to run and message snapshots for direct owner-authorized no-store SSE presentation.
        - Modeled available presentation data separately from content-free unavailable tombstones and rejected dimensions or ready-source media metadata on tombstones.
        - Kept all new fields optional so historical v1 producers remain valid.
  compatibility_notes:
    - Existing operations, request requirements, response requirements, and event envelopes are unchanged.
    - Historical messages and runs may omit attachments; legacy request producers may omit the new arrays; existing consumers may ignore every additive field and operation.
    - Existing available attachment summaries remain valid; the unavailable branch now admits the content-free tombstone already emitted by Core instead of incorrectly requiring a ready-source media type and positive byte count.
    - Empty or omitted attachment arrays preserve text-only behavior, and document.search@1 is unchanged.
