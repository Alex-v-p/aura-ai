        - Corrected attachment summaries to a discriminated available-or-unavailable union so content-free tombstones use the generic Attachment unavailable label, application/octet-stream, zero bytes, and no dimensions.
        - Added the typed lowercase model_vision_required 409 alternative for image-bearing run admission while retaining the existing general conflict envelope.
