decisions:
  - Query use cases consume only the versioned metadata observation contract through narrow Observatory-owned store ports; the in-memory adapter and deletion DTO live outside the query use-case module.
  - API serialization follows observatory-v1 while the in-memory use-case adapter remains deterministic for unit/evaluation coverage.
  - SSE replay uses a monotonic persisted ingest sequence with a PostgreSQL contiguous visibility watermark, immutable REST snapshot fences, Last-Event-ID catch-up, bounded batches, live polling, delayed heartbeats without SSE ids, request disconnect checks, and no credentials or captured content.
  - Protected query, SSE, and retention routes authenticate before application-level parameter parsing; framework validation is translated to a bounded Problem envelope without reflecting submitted values, while auth callback/login behavior remains public.
  - Retention uses strict UTC less-than cutoff semantics, explicit purge-all action, owner session, CSRF, exact confirmation, canonical command fingerprints, and an atomic durable idempotency claim.
  - Queued/running recovery leases the action before mutation; durable target counts/phases survive restart, destructive phases are serialized with a service advisory lock, and receipt deletion handles pre-migration null timestamps without losing the bounded source scope.
  - Raw outcomes are normalized to the observatory-v1 succeeded/failed/cancelled/unknown vocabulary, component health uses real p50/p95 percentiles, trace partiality reflects missing lineage, detail pages expose bounded partial/nextCursor fields, and deployment service roles are persisted.
  - Component/deployment catalogues and content-free retention action rows are preserved through observation deletion; query metrics use bounded resource/outcome labels and canonical span execution aggregation.
  - Production composition binds explicit query and retention ports; the reference adapter is compatibility-loaded only for legacy deterministic tests and is never selected by production use-case dispatch.
  - Metrics are exposed through the Observatory Prometheus-compatible scrape endpoint with bounded label series; SSE active-stream gauge is decremented on cancellation.
  - Persistent SSE re-fetches and re-authorizes the captured session before snapshot and each notification/heartbeat, terminating without payloads after revocation or expiry. Ingest sequence allocation is receipt-backed and reused across retries.
  - Migration execution bootstraps and consults a ClickHouse ledger on real HTTP responses, skips applied versions, and synchronizes the PostgreSQL allocator, visible-sequence rows, and committed watermark after deterministic legacy backfill.
  - Retention resumes from persisted source/projection/receipt phases; a terminal audit-write failure preserves deletion counts but marks the action failed/recoverable so the durable worker can reclaim it without falsely reporting success.
  - Ingest holds the shared PostgreSQL advisory guard from receipt claim through ClickHouse visibility and receipt completion; failed transports release the guard while preserving the pending lease.
  - Worker retention metrics are derived from durable Observatory PostgreSQL retention audit rows at API scrape time; no cross-container filesystem sharing is required. Duration metrics expose real bounded histogram buckets with sum/count, active SSE is a gauge, replay counts only persisted catch-up rows, and status-derived action/failure series are gauges while deletion totals remain counters.
  - Canonical component executions use span identity when present and run/component/operation identity for span-less metric rows, preventing duplicate health executions.
  - Legacy ClickHouse ordering backfill offsets deterministic row numbers above existing positive sequences and waits for mutation completion; PostgreSQL allocation uses a transactional row allocator with a durable receipt/sequence commit boundary before external ClickHouse I/O.
  - Retention recovery reattaches the durable action context before every mutation. Production target capture, source deletion, projection rebuild, receipt cleanup, and terminal release remain serialized by a session-scoped advisory guard with committed phase transitions and bounded storage-side projection rebuilds.
  - Retention deletion replays only immutable per-action target observation IDs and run IDs in bounded pages; late observations and receipts created after capture remain outside the action. Source/projection/receipt phases are committed independently, failed recovery preserves the last durable phase, receipt counts come from the immutable target snapshot, and projection rebuild retries use synchronous truncate-and-fill semantics.
  - Metric label values are finite allowlists per resource/outcome/event/action/status/failure domain and are validated identically for local records and persisted shared-series reads; crafted or unbounded label values are discarded before exposition.
  - Canonical component-health executions use exact spanless `duration_ms`; similarly named secondary spanless metrics are excluded, while span-backed observations remain canonical by span identity.
  - Trace tree construction is iterative, deterministic, and lossless: self-parent and multi-node cycle edges are detached into roots, orphan/cyclic traces are marked partial, and each span is emitted exactly once.
  - Receipt claims never return while a manually entered PostgreSQL context remains open: duplicate/pending outcomes commit, release the advisory lock when acquired, and exit the context; acquired claims retain the guard until completion or abort.
  - Owner HTTP inputs are checked against the observatory-v1 UUID, trace, component, SafeLabel, status, cursor, and Last-Event-ID constraints after owner authentication; invalid request responses use fixed messages.
  - ClickHouse literals escape backslashes before apostrophes, preventing escape-sequence injection for all values interpolated by the bounded SQL adapter.
  - Production retention state is PostgreSQL-authoritative; the adapter keeps only the currently attached action during a guarded deletion and clears it when the guard releases.
  - Component health groups one execution per span (or exact spanless duration observation), selects the designated millisecond duration independently from secondary metrics, and derives outcome without allowing a secondary metric to replace latency.
  - Prometheus query-duration exposition follows histogram semantics: TYPE, `_bucket`, `_sum`, and `_count` are emitted without an unsuffixed base sample.
  - Canonical component latency requires `measurement_name = 'duration_ms'` with millisecond units for both span-backed and spanless executions; outcome selection remains independent of secondary measurements.
  - ClickHouse Map dimensions use `coalesce(nullIf(status, ''), nullIf(outcome, ''))` so missing Map keys do not mask an outcome-only or status-only observation in run summaries, filters, or component outcomes.
  - Production run filters and summaries normalize the empty-aware dimension value (`success`/`completed`/`ok` → `succeeded`, `error` → `failed`, `cancelled`, otherwise `unknown`) consistently before comparison and aggregation.
  - Retention keyset pagination fails fast with a bounded metadata-only RuntimeError when a full page repeats or regresses its cursor; observation-target, receipt-target, projection, source-observation, and receipt-deletion loops are all guarded.
  - Retention page-fetch helpers validate their own returned final key against the supplied `after` cursor, so a malformed/regressing database page fails before callers perform deletion work.
  - Production latest-status, component-outcome, and canonical-duration selections use `(observed_at, observation_id)` tuple ordering, matching reference deterministic ordering for equal-timestamp telemetry.
risks:
  - Production retention execution depends on the service worker completing the durable action row; adapter-level ClickHouse mutations are synchronous and have no automatic expiry.
  - Full OpenAPI generated-client compatibility is owned by the contract worker and must be verified during integration.
  - The active SSE gauge is included in the live-updates metric definition; the legacy manifest summary list intentionally remains compatible with the current manifest regression fixture.
unresolved:
  - Frontend/generated-client and full-stack browser acceptance are pending integration ownership.
