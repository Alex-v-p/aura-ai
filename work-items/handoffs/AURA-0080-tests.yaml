decisions:
  - >-
    Tests use valid opaque UUID run identifiers and metadata-only observations,
    with deterministic timestamps and stable observation IDs so cursor and
    cutoff behavior is reproducible.
  - >-
    Retention tests assert strict less-than cutoff semantics, explicit purge-all
    intent, asynchronous terminal status, concurrent idempotency, failure
    reporting, and preservation of component/deployment catalogue definitions.
  - >-
    API tests exercise the owner cookie/session boundary, CSRF and confirmation
    headers, REST cursor/filter resources, SSE Last-Event-ID replay, and the
    absence of private values from responses and event payloads.
  - >-
    AURA-0079 OTLP regression tests now use frozen standard OTLP JSON fixtures;
    the Observatory-only test command no longer imports aura_core across the
    service-isolation boundary.
  - >-
    Added regressions for normalized outcomes, bounded failure codes, real
    p50/p95 percentiles with UTC time bounds, partial trace spans, deployment
    service-role unions, exact observation/receipt/run deletion counts, SSE
    live delivery and unknown/deleted cursor reset, atomic retention races,
    recovery claims, receipt observed_at, and projection cleanup.
  - >-
      Migration checks are shape-level and rerun-safe: both service-owned chains
      require idempotent create/index statements, forbid executable TTL clauses,
      and retain content-free retention/audit state.
  - >-
      Runtime regressions execute the real migration CLI, PostgreSQL sequence and
      advisory-guard port, externally rendered metrics endpoint, durable
      retention restart state, HTTP partial-detail resources, and revocation-aware
      SSE stream; no source-token-only assertions substitute for behavior.
