  consumed:
    - id: evaluation-v1
      version: 1
      source: contracts/evaluation/v1/evaluation.schema.json
      consumer_boundary:
        - Observatory is the logical owner of evaluation definitions, results, scores, artifacts, experiments, replays, and baselines, but this contract-only slice adds no runtime persistence, API, CLI, browser, or orchestration behavior.
        - Future Observatory consumers must dispatch resourceType and schemaVersion explicitly, validate closed objects, enforce stable identifier/idempotency semantics, and reject unknown fields before domain handling.
        - Dataset, case, suite, evaluator, request, result, score, experiment, replay, and baseline references are portable contract records. Their ownership does not authorize reading Core tables or importing Core implementation modules.
        - Request and result provenance must be checked for agreement across dataset, suite, evaluator, component, model, deployment, configuration, fixture, prompt, policy, seed, clock, locale, limits, and deadline before a later worker schedules work.
        - Evaluation content, where explicitly authorized, is inert untrusted data. Observatory consumers must never interpret it as instructions, policy, permissions, provider selection, endpoints, credentials, object keys, executable paths, or execution authority.
        - Artifact references expose only opaque identifiers, integrity/media metadata, capture authorization, bounded limits, deletion scopes, and manual retention. Bytes and storage credentials/locations remain behind the separately assigned artifact boundary.
        - Baselines distinguish candidates from explicit owner-promoted immutable records. Observatory must require a manual promotion command and immutable source result identities; automatic promotion and protected repository baseline mutation are not authorized.
        - Scores with evidenceStatus not_observed or not_applicable must omit both value and outcome; Observatory must preserve that missing-evidence state instead of inferring a score or outcome.
        - Every resource idempotencyKey is a service-generated lowercase UUID, not a user-controlled token or free-form namespace; duplicate requests, results, scores, experiments, baselines, and replays must be handled idempotently by the owning service.
    - id: evaluation-failure-codes-v1
      version: 1
      source: contracts/evaluation/v1/failure-codes.schema.json
      consumer_boundary:
        - Observatory consumers accept only the finite provider-neutral failure taxonomy: REQUEST_INVALID, DEADLINE_EXCEEDED, RESOURCE_LIMIT_EXCEEDED, DEPENDENCY_UNAVAILABLE, EXECUTION_FAILED, RESULT_VALIDATION_FAILED, STORAGE_FAILED, and INTERNAL_FAILURE.
        - Internal exceptions, provider diagnostics, payload excerpts, credentials, endpoints, and content-derived classifications must be mapped to one finite code before a result or lifecycle event is persisted, emitted, or shown in a browser.
    - id: evaluation-events-v1
      version: 1
      source: contracts/events/evaluation/v1/evaluation-events.schema.json
      consumer_boundary:
        - Observatory may consume and publish only the four closed lifecycle types: evaluation.requested, evaluation.completed, evaluation.cancelled, and evaluation.failed.
        - Lifecycle events are content-free evidence. They carry bounded identifiers, correlation/causation, request/job/attempt/idempotency values, provenance hashes/versions, bounded deadlines/attempts, result digests, opaque artifact references, and bounded reason/failure classifications only.
        - Event delivery must remain idempotent and at-least-once safe; event and request provenance equality, terminal-state ordering, cancellation races, and duplicate handling are consumer/application invariants rather than transport assumptions.
        - Raw input/output, prompt/rubric/comment text, artifact bytes, credentials, endpoints, filenames, provider object keys, owner identity, exception text, arbitrary attributes, and hidden reasoning are rejected at this boundary and must not be copied into Observatory storage, logs, metrics, SSE, URLs, or browser persistence.
