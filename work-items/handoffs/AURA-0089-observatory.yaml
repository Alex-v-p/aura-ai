decisions:
  - Kept this Observatory slice contract-consumer-only and changed no service source, migration, entrypoint, deployment, generated client, API, CLI, browser, or Core code.
  - Recorded Observatory ownership of evaluation domain records as a service boundary, not as permission to share Core tables or import Core modules. Existing Observatory Postgres/ClickHouse adapters remain service-owned and independently composed.
  - Required strict schemaVersion/resourceType dispatch, closed-object validation, cross-resource provenance checks, idempotency, and fail-closed rejection before future persistence or execution.
  - Kept artifact references opaque and content-bearing data behind explicit authorization, capture classification, manual-only retention, non-empty UUID references, and consumer-enforced authorization strength; Garage credentials, object layout, deletion mechanics, and byte handling remain AURA-0090 decisions.
  - Preserved the finite shared failure taxonomy and UUID-only idempotency rules; Observatory must map internal/provider failures before persistence or publication and generate idempotency keys inside the owning service.
  - Preserved explicit missing-evidence semantics: not_observed and not_applicable scores carry neither a value nor outcome, so downstream consumers cannot infer quality from absent evidence.
  - Kept durable lifecycle events content-free and limited to the four versioned event types; event transport, authenticated envelopes, NATS subjects, stream policy, and retries remain AURA-0091/AURA-0092 decisions.
  - Kept baseline state immutable and manual-only, with no automatic promotion or protected golden-result mutation; comparison statistics and promotion workflow remain AURA-0096 decisions.
  - Preserved metadata-only production telemetry as an independent contract and storage path; evaluation content cannot enter passive telemetry, logs, metrics, SSE, URLs, or browser persistence.
  - Did not consult online documentation because this read-only compatibility audit is governed by the repository's pinned JSON Schema contracts and accepted ADRs and introduces no dependency or protocol implementation.
risks:
  - JSON Schema cannot prove cross-resource identity equality, digest recomputation, identifier non-reuse, temporal ordering, score-evidence semantics across records, or semantic absence of instructions/credentials in authorized content. Future Observatory producers and consumers must enforce these invariants in typed domain/application ports and fail closed.
  - The finite failure taxonomy prevents exception/provider leakage only when every producer maps failures before persistence/publication; an unbounded exception string or provider-derived code would violate the contract.
  - AURA-0090 through AURA-0096 must preserve the separation between authorized evaluation content and content-free event/telemetry surfaces. A storage, API, SSE, log, metric, URL, or browser implementation that exposes bytes, object keys, credentials, owner identity, or raw evaluation text would violate this handoff.
  - At-least-once and out-of-order lifecycle delivery requires an Observatory-owned idempotency and terminal-state policy; NATS or another transport must not become business truth and must not be used to justify duplicate result or baseline mutation.
  - No downstream active work-item files were available for direct dependency review. The contract handoff and AURA-0089 open decisions are the authoritative dependency boundary until those items are activated.
