decisions:
  - >-
    Workflow agent execution has a dedicated public coordinator seam and does
    not use conversation persistence, provider adapters, executor state, tools,
    memory, or nested runs.
  - >-
    Workflow composition receives RunCoordinatorWorkflowAdapter, whose
    provider, model identifier, and exact model-policy revision are selected
    at the entrypoint and checked against every Run-owned request before a
    provider call. The adapter depends on the explicit
    WorkflowAgentRunExecutionPort rather than a concrete/private coordinator
    implementation, preserving test-double and composition compatibility.
  - >-
    Workflow agent admission now requires a composition-provided durable
    WorkflowAgentRunRecoveryPort. It atomically reserves the complete step
    lineage before provider invocation, replays terminal results, returns an
    unknown outcome for an unresolved prior reservation, and persists terminal
    settlement. Process-local caches remain only an optimization.
  - >-
    Provider execution clamps the effective deadline to five minutes from the
    truthful coordinator start timestamp while still honoring an earlier
    workflow instance deadline; an instance's multi-day deadline is never
    used as the provider execution timeout.
  - >-
    SqlWorkflowAgentRunRecovery reserves the complete workflow lineage in the
    existing Run row before provider invocation, persists bounded terminal
    metadata only, and treats completed-without-workflow-output as unknown on
    restart so the workflow owner must reconcile rather than replay content.
  - >-
    The request requires complete workflow lineage and a pinned agent/model
    policy identity, while the result is closed to completed, failed, canceled,
    or unknown outcomes; agent-run effects are never replayable.
  - >-
    A bounded process-local task/result cache suppresses duplicate provider
    calls only while a worker is alive. Durable workflow state remains the
    authority for restart recovery and settlement.
  - >-
    Cancellation is fenced by the same complete lineage: durable cancellation
    wins only while the Run reservation is running, while terminal settlement
    remains immutable; the in-flight event is also signaled for prompt local
    provider cancellation.
  - >-
    Provider text is bounded to 8 KiB, hidden reasoning and tool calls are
    discarded/rejected, and deadlines are capped at five minutes.
  - >-
    Workflow agent telemetry propagates the admitted request trace to both
    the step duration metric and run.execute span. Provider failures map to
    the finite approved error classes (provider, provider_protocol, budget,
    or capability) rather than unconstrained outcome text.
  - >-
    Repository-backed recovery tests exercise reservation-before-effect,
    unresolved restart UNKNOWN without provider replay, durable terminal
    failure replay, exact-lineage cancellation, and the truthful five-minute
    deadline cap. SQL cases use only the explicitly supplied disposable
    AURA_0137_DATABASE_URL.
risks:
  - >-
    The workflow application must replace its local request shape with the
    public Run-owned WorkflowAgentRunRequest/WorkflowAgentRunResult values and
    receive the provider-bound RunCoordinatorWorkflowAdapter at composition;
    the handler should pass one request argument (not a provider object).
  - >-
    The workflow worker must call the new coordinator seam from its identifier
    consumer; this slice intentionally does not edit worker or workflow files.
