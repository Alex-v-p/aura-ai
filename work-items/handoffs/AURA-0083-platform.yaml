decisions:
  - >-
    The disposable local overlay adds authentik.localhost as an alias on
    observatory-identity-egress, allowing Observatory API issuer discovery to
    resolve inside its existing narrowly scoped identity network without
    merging Core and Observatory identity audiences or networks.
  - >-
    aura-frontend now uses explicit IPAM with the operator-configurable
    AURA_FRONTEND_SUBNET and a 10.254.241.0/24 default. This prevents Docker's
    automatic 192.168.0.0/20 allocation from shadowing a trusted LAN or VPN
    route used by the configured Ollama provider.
  - >-
    Documentation and .env.example describe the reserved frontend range and
    the override procedure; no provider endpoint or credential is committed.
  - >-
    The optional Docker Desktop relay is activated only by a non-empty,
    validated IPv4 target. The launcher starts a transient fixed-name user
    systemd unit with socat listening on 127.0.0.1, writes the generated
    host.docker.internal URL into its ignored local environment, and stops the
    unit during down/reset; it never uses eval or binds the LAN interface.
  - >-
    The disposable bootstrap job receives the same Observatory client ID and
    local redirect URI as the local API/server overlay, so its retrying
    blueprint application cannot restore production/default callback values.
  - >-
    The launcher arms ERR/INT/TERM/EXIT cleanup immediately after relay
    creation and removes those traps only after final Compose success. A
    failed is-active check performs immediate cleanup before exiting;
    down/reset attempt cleanup before other validation.
  - >-
    Relay ports are limited to one through five decimal digits before numeric
    validation. Loopback targets whose numeric target port equals the listener
    port, including leading-zero forms, are rejected to prevent a forking
    self-forward cascade.
