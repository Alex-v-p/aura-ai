decisions:
  - >-
    Core owns only the closed producer port and explicit serializers. It never
    imports an Observatory adapter, URL, client, persistence layer, telemetry
    payload, or run-event transport.
  - >-
    Evidence uses stable UUID5 event/evidence identities derived only from run,
    sequence, step category, and kind, so changed immutable content is a
    content-free collision; each retry gets a new delivery identity while
    preserving the actual initial delivery ID.
  - >-
    Restart-sensitive boundaries use deterministic sequence slots (including
    approval-resume and terminal settlement ranges); native tool ordering is
    reflected in per-call slots; dynamic stream chunks
    retain the bounded allocator for their in-process ordinal sequence. The
    evaluation input/output boundaries use stable 0 and 9,200,000,000,000
    slots; terminal settlement uses the reserved 9e12 band and approval
    settlement uses 9.1e12.
  - >-
    Secret-bearing fields, provider-hidden reasoning, malformed or unsupported
    media, incomplete media admission, and oversized payloads are rejected as
    whole items before queueing.
  - >-
    Explicit boundary coverage includes admitted request/trigger, worker input
    and output, context, memory/document retrieval, compiled prompt, routing,
    model-visible attachments, displayed thinking, generation, tools, policy,
    approval resume, persistence, delivery, synthesis, and evaluation input/
    output where applicable.
risks:
