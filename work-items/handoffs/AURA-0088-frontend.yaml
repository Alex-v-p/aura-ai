decisions:
  - >-
    Added a standalone Observatory comparison feature and registered it only
    in the Observatory application shell; Aura product feature libraries,
    shared product UI, contracts, and generated clients were not edited.
  - >-
    Kept comparison selections and results in ObservatoryStore memory only.
    The generated compareRuns transport operation is used with a bounded POST,
    existing owner session, no URL parameters, no browser persistence, and
    bounded LiveRefreshCoordinator invalidation on metadata SSE.
  - >-
    Added closed runtime validation for comparison markers, run sides,
    component measurements, aligned spans, integrity states, limits, freshness,
    and metadata_only capture before any server response reaches a template.
    Unknown fields, unsupported identifiers, and content-like marker values
    are rejected.
  - >-
    Aligned the browser validator with OpenAPI bounds: model identifiers accept
    bounded provider tags such as qwen3:8b while rejecting URL/private-shaped
    values; all finite numeric measurements are bounded, AnalyticsUnit is
    allowlisted, component durations/spans and freshness are bounded, and
    integrity arrays are unique. Traces accept up to 10,000 spans and
    512-character alignment keys. Duplicate alignment keys use a stable
    key-plus-index Angular identity.
  - >-
    Implemented explicit left/right selection, same-run validation, swap/reset,
    retry, focus restoration, stale/disconnected/partial/malformed/rejected/
    unavailable/service-down states, non-colour status text, and semantic
    tables for run markers, component deltas, and aligned trace differences.
    Refreshing preserves the visible result and uses aria-busy; only a failed
    refresh becomes stale. Local selection changes are explicitly labelled as
    obsolete, and left/right integrity is rendered separately with plain
    labels for bounded partial reasons.
  - >-
    Added realistic Storybook ready/partial dense fixtures with tagged model
    identifiers, a disconnected prior-result state, and a semantic-token dark
    surface, plus parser tests covering zero versus missing measurements,
    unavailable evidence, unknown fields, malformed integrity metadata, model
    privacy, duplicate keys, and contract bounds.
  - >-
    Kept same-run aria-describedby targets present before and after submit,
    added an explicit empty-state Retry runs action wired to ObservatoryStore.load,
    kept ordinary first use as plain selection guidance, restricted comparison
    retry controls to failed requests, and changed version availability copy to
    “Version missing” and “Version unavailable”.
  - >-
    Corrected the selector grid to a valid four-track desktop declaration and
    added a browser assertion for four computed tracks. The Storybook dark story
    now assigns the complete Observatory production semantic dark token set on
    its themed wrapper; browser checks assert dark luminance and text contrast.
  - >-
    Updated the keyboard reset acceptance to assert cleared left/right
    selections, disabled Reset, visible first-use guidance, and no comparison
    retry action after a successful reset.
  - >-
    Reconciled real-browser feedback: Retry runs now has a correctly instrumented
    fixture request path; comparison table assertions target their semantic
    regions/tables; selector track assertions are desktop-aware; unavailable
    marker assertions are scoped to the bounded-evidence status; and the SSE
    run assertion is scoped to the Runs workspace.
  - >-
    Render freshness-unavailable evidence from the validated comparison result
    even when the independent live stream is disconnected, preserving both
    truthful data freshness and connection state.
  - >-
    Corrected the browser fixtures and expectations to distinguish partial
    comparison evidence from the disconnected live-stream state. Partial
    fixtures assert their bounded partial-evidence status, while complete
    fixtures do not claim a retry or partial state; semantic comparison tables
    remain scoped to their named regions.
  - >-
    Made the freshness-unavailable fixture carry an explicitly unavailable
    marker and scoped the browser assertion to bounded status roles. Reduced
    motion checks parse comma-separated CSS durations numerically, accepting
    valid browser serialization such as 1e-05s while enforcing the 0.01s
    limit.
  - >-
    Contained the responsive comparison selection surface by clearing intrinsic
    minimum widths on its fieldset, grid children, labels, controls, and
    selects. Long run identifiers and option labels can now wrap or shrink at
    zoomed narrow widths, while the comparison data tables retain their
    intentional local horizontal scrolling.
  - >-
    Kept all Observatory feature hosts mounted for state preservation, while
    using explicit inline display bindings on each host alongside the hidden
    attributes. Inactive panels render as `display:none` and the active panel
    as `display:block`, overriding child-host display styles without relying on
    Angular's encapsulated shell selector.
  - >-
    Extended the existing 200%/400% responsive overflow assertion with bounded
    browser-side diagnostics for every visible element that extends beyond the
    viewport or has oversized layout metrics. Diagnostics include a stable
    tag/id/class selector, bounding left/right/width, scrollWidth, clientWidth,
    and overflow mode, while the document-level overflow assertion remains
    blocking.
  - >-
    Restricted comparison refreshes to persisted metadata-bearing events
    (`observation.changed` and `retention.changed`) and retained
    the existing one-active/one-trailing LiveRefreshCoordinator. Health
    notifications update health history only, keepalives update connection
    timestamps only, and a live event cannot race the initial manual compare
    request into redundant POSTs. No telemetry payload, URL, or browser storage
    behavior changed.
  - >-
    Scoped the inactive-host regression to each direct feature host's expected
    tag and computed display value. It separately verifies active Compare is
    `display:block` and visible, avoiding assumptions about Angular's retained
    boolean `hidden` attribute.
  - >-
    Fixed the active app-shell overflow identified by browser diagnostics: the
    masthead's narrow grid now uses a `minmax(0,1fr)` track, direct children and
    header actions have bounded minimum/maximum widths, and the connection and
    action labels may wrap at narrow or extreme zoom. The tab strip keeps its
    intentional local horizontal scrolling.
  - >-
    Wrapped and bounded the masthead text container, heading, eyebrow, and
    subtitle with `overflow-wrap:anywhere` and safe word breaking after the
    browser diagnostic identified the h1 as the remaining intrinsic-width
    source at 400% zoom.
  - >-
    Split responsive acceptance into a true 375px narrow viewport at 100% zoom
    and deterministic 640px/320px viewport simulations for the 200%/400%
    effective widths of a 1280px reference viewport. Chromium CSS zoom does not
    change layout viewport or media-query width, so the simulation keeps zoom
    at 1, asserts one-column controls and bounded document overflow, and keeps
    the existing visible-element diagnostics blocking.
  - >-
    Synchronize the panel-display regression on semantic Compare navigation
    state and active-host visibility before reading computed styles, avoiding a
    timing race with the Angular tab signal render without adding sleeps.
