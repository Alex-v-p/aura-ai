decisions:
  - >-
    Kept the browser scenario opt-in behind
    AURA_OBSERVATORY_EVALUATION_FULL_STACK=1 so ordinary mocked and Core
    full-stack runs remain deterministic and do not invent evaluation state.
  - >-
    Used only public REST collections, rendered workspace controls, and the
    public job detail route. No private database, service, or browser seam was
    added to make the acceptance pass.
  - >-
    Treat missing public evaluation seed data and unavailable fixture
    capabilities as explicit platform blockers in diagnostics; do not weaken
    terminal-success or privacy assertions.
  - >-
    Kept the richer owner workflow behind a separate
    AURA_OBSERVATORY_OPERATIONS_FULL_STACK=1 flag because the platform seed
    must expose all prerequisite resources through public APIs before any
    destructive or stateful operation is safe to run. The browser test never
    invents IDs, result provenance, alert state, or authorization records.
  - >-
    Required a real public comparison POST and response identity after
    promotion. A pre-existing regression is not sufficient evidence that the
    browser can execute the Compare evidence workflow.
  - >-
    AURA-0098 acceptance is complete for the explicit foundation scope. The
    exact foundation command exits zero with browser, privacy, retention,
    cleanup, and required boundary gates passing. Scenarios 2-6 and
    dependency/outage/restart phases remain deferred and must not be
    represented as accepted by this handoff.
