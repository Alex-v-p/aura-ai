decisions:
  - >-
    Kept observatory-v1 at 1.0.0 because the complete AURA-0097 surface is
    additive. Used a dedicated operations event endpoint instead of widening
    either existing SSE vocabulary, preserving older exhaustive consumers.
  - >-
    Reused existing analytics, evaluation reference, UTC, UUID, component,
    model, deployment, outcome, and pagination vocabulary where compatible.
    Added only closed operational resource, version, facet, severity, state,
    and action vocabulary needed by this work item.
  - >-
    Made dashboard and alert composition reference exact saved-query versions.
    Query definitions are a discriminated finite union rather than an object
    map, expression language, URL, SQL fragment, caller-defined dimension set,
    or arbitrary filter tree.
  - >-
    Added one GET execution boundary instead of requiring browser consumers to
    reinterpret each saved-query kind into unrelated low-level endpoints. The
    response remains a transport-only closed union and does not embed query
    planning or other business behavior in the schema.
  - >-
    Kept acknowledgement distinct from alert recovery and incident resolution.
    Suppression is a first-class exact-scoped record with either an explicit
    end time or manual clear, and every command has optimistic version or exact
    target information for deterministic conflict handling.
  - >-
    Allowed bounded owner-authored dashboard labels, incident notes, and
    annotation text only in authorized REST snapshots. Operational history and
    live events use separate content-free schemas that cannot transport those
    values.
  - >-
    Did not consult external documentation because dependency-version
    verification was not assigned. Repository ADR-0016 and the checked-in
    observatory-v1 conventions define the authorized protocol behavior.
risks:
  - >-
    OpenAPI cannot prove referenced record existence, exact-version freshness,
    legal incident state transitions, suppression time ordering, threshold and
    unit compatibility, panel position uniqueness, or idempotent ownership.
    Producers must enforce those invariants transactionally and tests must
    cover stale and concurrent commands.
  - >-
    Client generators may model OpenAPI 3.1 nullable unions and numeric bounds
    differently. The assigned frontend worker must regenerate from this source
    and keep the checked-in client transport-only; generator output is not part
    of this contract-authorship slice.
  - >-
    The producer must make the execution state and nullable result consistent,
    derive freshness from measured evidence rather than request time, and keep
    continuation cursors bound to the exact query version and snapshot. OpenAPI
    cannot prove those runtime invariants.
  - >-
    Each destructive route uses a resource-specific constant confirmation, so
    a confirmation intended for one resource cannot authorize deletion of a
    different resource type.
