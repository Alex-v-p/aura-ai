decisions:
  - >-
    Gated only the first fixture event until the workspace has mounted, then
    asserted the native SSE event causes a second authoritative GET and a
    visible variant-count change. This removes desktop-specific duplicate-load
    timing while proving product invalidation.
  - >-
    Let the browser's native EventSource reconnect after the fixture stream
    closes. A loopback SSE fixture emits a fixed event ID, rejects catch-up
    without that exact Last-Event-ID header, and keeps the accepted connection
    open; teardown closes all native connections.
  - >-
    Preserved authenticated snapshot checks, metadata-only event schema,
    rendered private-content exclusions, and one composed full-stack project;
    added only in-scenario media, responsive, focus, and keyboard assertions.
  - >-
    The ExperimentWorkspaceComponent now performs the authoritative reload for
    every newly delivered evaluation revision even while the live stream is
    transiently disconnected, then restores the disconnected state if the
    stream is still unavailable after the response. ObservatoryStore ignores
    duplicate persisted evaluation event IDs so native reconnect replay cannot
    create a request/render loop.
  - >-
    Initial evaluation metadata remains authoritative while live invalidations
    are deferred; after the snapshot settles, each affected resource type is
    reconciled once through the existing in-memory gateway path. No event data,
    browser persistence, or cross-product dependency was introduced.
  - >-
    Evaluation live replay invalidations are coalesced in the owning workspace
    store and drained serially through the existing generated gateway. The
    coalescer is bounded to one in-memory resource set and a short fixed delay;
    it is cleared on session reset and never persists or changes Core behavior.
  - >-
    A monotonic drain epoch makes session/reset boundaries authoritative even
    when a refresh batch has already been copied for serial processing; stale
    batches cannot issue later resource requests or repopulate feature state.
  - >-
    Suite list/detail projection is summary-only in the current Observatory
    provider; the frontend preserves optional components and limits only when
    they are actually supplied. Job admission continues to require those
    authoritative fields and never reconstructs them from componentIds or
    timeout/case summaries.
  - >-
    Evaluator list projection follows the versioned contract's closed required
    shape: optional rubric and calibration versions are preserved only when
    present, never synthesized, and do not prevent selection of the real
    provider projection.
  - >-
    Job projections preserve their mixed generated response types: the
    top-level suite is an Observatory resource reference, while nested runner
    provenance uses definition references. The frontend does not normalize
    either shape and validates each at its owning adapter boundary.
  - >-
    A submitted job is an accepted owner action and is therefore projected
    immediately from the already-validated submit response. Later list
    snapshots remain authoritative for status and replace the optimistic
    entry; while the active job is absent from a lagging snapshot, its last
    validated in-memory state is retained so live polling cannot starve.
  - >-
    The live provider response is the owning evidence for the submitted job
    projection: its top-level suite reference is `{resourceId,
    resourceVersion}`, while the admitted runner definition and nested runner
    provenance use `{id, version}`. The frontend now keeps the two shapes
    distinct and rejects swapped forms; no backend or contract change was
    made in this frontend slice.
risks:
  - >-
    The native loopback fixture depends on browser support for loopback
    EventSource during the focused Playwright projects; it is bounded by
    explicit connection teardown and does not expose content or credentials.
  - >-
    The focused stale-catalogue regression uses a disposable browser fixture
    and does not alter the public Observatory contract or browser persistence
    behavior.
  - >-
    The composed full-stack browser run was not re-executed in this frontend
    worker because it requires the disposable owner-authenticated stack. The
    bounded catalogue reconciliation is ready for the live rerun; if its
    final REST diagnostic still reports rest_contains_target=false, the
    remaining defect is outside this frontend ownership zone.
  - >-
    The composer readiness correction is test-only: it waits for the existing
    Core product readiness contract and does not change Aura Web behavior or
    weaken the send-enabled assertion.
  - >-
    The full-stack evaluation failure is upstream in the query adapter's page
    snapshotAt RFC3339 serialization: a space separator is rejected by the
    strict frontend parser. The backend correction supersedes the attempted
    frontend persisted-domain projection; the canonical parser remains
    unchanged and no Core or Aura Web dependency was added.
  - >-
    The current backend detail endpoint also routes persisted suites through
    the summary-only project_definition() projection, so selecting a summary
    suite alone cannot satisfy job admission until an authoritative detail
    contract supplies components and limits. This worker intentionally did
    not paper over that missing data or fabricate it client-side.
  - >-
    The composed owner-authenticated full-stack rerun was not executed in this
    worker. The new regression covers the proven frontend omission/race with
    exact provider-shaped job data; final stack confirmation remains with the
    integration/test owner.
  - >-
    Observatory deterministic IDs are intentionally generated from raw digest
    bytes and the versioned contract plus AURA-0078 regression accept canonical
    UUID syntax without RFC marker bits. Backend generation therefore remains
    unchanged; the frontend parser now follows that public contract while
    still rejecting uppercase, malformed, and noncanonical values.
  - >-
    Selected-run reconciliation remains bounded by the existing 30-attempt,
    two-second timer window. The timer itself prevents concurrent loads; the
    loading state is no longer treated as a scheduling veto because it is the
    expected state during the initial gap-discovery path.
