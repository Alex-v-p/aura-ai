decisions:
  - >-
    The canonical document predecessor is identified by its immutable UUID,
    not numeric revision 4. The profile advances only from that predecessor.
  - >-
    Policy and agent numeric revisions are allocated independently as the next
    owner-scoped value under a PostgreSQL advisory lock and locked profile row.
    Existing rows are never updated, deleted, or repurposed.
  - >-
    Canonical predecessor and partially existing research seeds are validated
    for owner binding, immutable lineage, exact bounded scopes, limits, and
    grants; inconsistent state raises before authority-widening writes.
  - >-
    Missing canonical profiles, NULL current revision pointers, missing
    predecessors, partial canonical rows, and inconsistent seed grants/scopes/
    limits all fail closed. PostgreSQL transaction rollback leaves no partial
    authority, and the profile is never deleted by regression cleanup.
  - >-
    Policy allocation filters the exact empty principal issuer/subject and
    canonical profile, while agent allocation filters the canonical profile;
    unrelated owners and custom profiles cannot consume either successor
    number.
  - >-
    Every live regression path cleans up in finally, including concurrent
    seeding. Cleanup restores the canonical document pointer/version and
    removes the canonical and synthetic policy, grant, agent-revision, and
    custom-profile rows, making repeated full-file runs safe on one database.
  - >-
    The regression uses synthetic UUIDs and metadata only. The optional live
    test preserves an occupied revision-5 policy and agent row, asserts
    collision-free revision-6 successors, and re-enters the migration.
