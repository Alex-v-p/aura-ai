decisions:
  - >-
    Added opt-in real PostgreSQL coverage using isolated schemas, applying all
    Observatory migrations twice and exercising the real repository for
    idempotent admission, transactional initial outbox state, result receipts,
    concurrent admission, lease expiry, and restart recovery. The default
    suite remains database-independent and skips only when its explicit URL is
    absent.
  - >-
    Added in-memory public-behavior coverage for concurrent duplicate
    admission, bounded retry/max-attempt behavior, permanent failure,
    acknowledgement after rejection, lease exclusivity/recovery, and
    cancellation/late-result terminal precedence.
  - >-
    Added a project-scoped Docker Desktop acceptance harness with bounded
    commands, COMPOSE_PARALLEL_LIMIT=1, file-backed fixture secrets, internal
    repository admission, real Core runner dispatch, metadata-only request
    data, and disposable named volumes that leave production state-root binds
    unchanged.
  - >-
    The acceptance harness prints only bounded phase/status classes; it does
    not print identifiers, payloads, credentials, or provider diagnostics.
  - >-
    Expanded independent coverage now includes real-PostgreSQL retry/max-attempt
    and durable acknowledgement, deadline/cancellation races, scheduler claim
    cadence and deterministic occurrences, lease recovery, result redelivery,
    worker restart, dependency outage/recovery, Core independence, persisted
    health bounds, and privacy scans of persisted/log output.
  - >-
    The E2E fixture uses UUID-shaped worker and scheduler identities and a
    bounded running-state wait so Docker Desktop health probes do not mask the
    actual evaluation behavior; production resource bindings remain unchanged.
  - >-
    The expanded harness intentionally uses a real JetStream durable consumer
    and no direct repository replay for redelivery; the acceptance observed
    duplicate delivery and completed the second delivery with an ack.
  - >-
    The deadline assertion required the terminal `deadline` state, and the
    scheduled-occurrence assertion required execution through the Core runner;
    both passed without weakening their assertions.
  - >-
    The final acceptance correction targets the Observatory result durable
    `aura-evaluation-dispatch`, creates a real local owner session through the
    repository SessionService and Redis backend for authenticated Core API
    access, checks finite NATS failure state and worker liveness, and verifies
    exact persisted metric types and histogram buckets. The latest clean run
    also verified the persisted failed-publication metric, NATS recovery,
    PostgreSQL outage classification/recovery, and Core independence. The
    runner traceback blocker and the approved API startup-line classification
    are both resolved by the final scan.
  - >-
    The source diagnosis is based on the pinned NATS client's default error
    callback and the evaluation-runner connect site; no production change was
    made in this test/evaluation ownership zone.
  - >-
    Added a static guard that recursively enumerates external JSON Schema
    references from the authoritative runner transport contract and requires
    each referenced document to be copied into the Observatory image. This
    prevents a root-schema-only image from passing topology checks while
    failing real admission.
  - >-
    Security adjudication authorized one exact exception for the standard
    `observatory-api` Uvicorn wildcard-container-interface/8000 startup line.
    The harness retrieves only that service without Compose prefixes, removes
    only the fully anchored fixed line, and then applies the unchanged broad
    privacy/raw-diagnostic scan. Negative static coverage proves that alternate
    URLs, ports, providers, and traceback lines do not match the exception.
  - >-
    Added Docker verification for the authorized OTLP boundary: both
    orchestration components, required operations and dependencies, stable
    trace/span correlation, configured deployment identity, NATS failure
    classification, and metadata-only privacy are checked from persisted
    ClickHouse rows. The E2E-only override is limited to acceptance topology;
    production wiring remains authoritative.
  - >-
    The final trace correction preserves the bounded transport failure
    classification as `errorClass`; the complete matrix then verified the
    authenticated OTLP `/v1/traces` path through Collector and ClickHouse
    with metadata-only component spans and no duplicate lineage.
  - >-
    Trace verification failure output is intentionally aggregate-only: it
    reports bounded counts, finite missing allowlist sets, and boolean
    predicate results without serializing rows, identifiers, content,
    credentials, or endpoints. A static regression test protects this shape.
  - >-
    The final privacy scan now includes observatory-collector startup and
    outage logs. Its bounded matcher rejects collector endpoints and
    /run/secrets filenames; a static negative regression covers both patterns
    without printing the matched value.
