decisions:
  - Rejection reasons are finite allowlisted values and are persisted only as aggregate counts; parser, payload, exception, identifier, endpoint, and credential text never enters health state.
  - Intake lag is calculated only after successful schema validation, surfaced from the ingest worker's accepted-observation high-water mark, and clamps future-skewed, non-finite, and excessively old values to the documented bounded range.
  - Visibility health is derived from the Observatory-owned contiguous ClickHouse watermark, pending receipts, and visibility ledger; no Collector or Core queue state is introduced.
  - Health snapshots are persisted only when state or visibility materially changes, so health.changed never becomes a heartbeat surrogate; SSE catch-up compares persisted sequence numbers and excludes the Last-Event-ID cursor strictly, including health.changed cursors.
  - Latency samples use bounded reservoirs and bounded durations; SQL and HTTP diagnostics remain outside REST, SSE, metrics, and browser payloads.
  - Production composition injects one narrow health persistence/event port into ingest and query adapters; accepted counts and validated observation high-water timestamps are updated together, while heartbeat writes never refresh query freshness.
  - Durable health and observation replay share the Observatory ingest allocator sequence, allowing a strict exclusive Last-Event-ID merge without exposing health payloads or replaying the cursor event.
  - Health classification uses recent failure timestamps so cumulative duplicates/rejections do not permanently degrade the service, and current storage failures can recover after the bounded failure window.
  - Health history cursors are centrally validated as base64url JSON containing only a timezone-aware timestamp and canonical UUID; anonymous and non-owner requests are denied before history access.
  - Gauge/current-total metric exports use replacement semantics. Production storage latency keeps a bounded 128-sample reservoir for UI percentiles while PostgreSQL stores atomic cumulative count, sum, and fixed cumulative buckets for restart-safe Prometheus histograms.
  - Health events register a visible marker in the shared contiguous ledger before watermark advancement, so health.changed cannot fence later observations.
  - Health projection is a bounded API-lifecycle use case with an optional storage refresh callback; REST overview and SSE only read current state and never persist snapshots or trigger feedback loops.
  - Production ingest suppresses legacy counter writes when the injected PostgreSQL health port owns outcome accounting, preserving rejected versus every finite malformed request/OTLP category and routing every storage failure through one recoverable signal.
  - Production worker storage-latency samples persist through the explicit PostgreSQL health port; the API scrape hydrates bounded histogram count, sum, and bucket series from that store. File export remains opt-in for tests/local diagnostics, and production settings default it off.
  - SSE replay metrics retain the actual persisted event type and only count events at the connection-start replay fence; health.changed is a closed, manifest-declared label.
  - Query latency is persisted only at the bounded use-case query boundary with finite resource labels; health snapshot projection writes are excluded from query latency.
  - Health projection runs in the existing API lifespan with explicit startup/shutdown ownership and testing opt-out; the ingest worker now only emits heartbeats and processes telemetry.
  - Production cross-process storage histograms use the PostgreSQL health store; the optional atomic file sink is disabled by default and retained only for explicit tests/local diagnostics. The forward-only migration is idempotent and row-locked updates preserve monotonic cumulative state under concurrent samples.
  - Latency summaries preserve insertion order for latestMs while calculating p50/p95 from a sorted copy; rollover and PostgreSQL/API history round-trip regressions cover non-monotonic samples.
