decisions:
  - Dataset, case, suite, and evaluator domain records are immutable by stable identifier/version and canonical fingerprint; same-fingerprint writes are idempotent and conflicting reuse raises DefinitionConflictError.
  - PostgreSQL uses normalized typed columns plus a sanitized closed definition JSON projection; no raw evaluation bytes or provider locators are admitted.
  - Cases reject embedded content in this service-owned persistence projection. Owner-supplied content requires a content digest or opaque artifact UUID and the corresponding authorization classification.
  - Suites are admitted only after exact dataset/evaluator/component references exist; thresholds are inert typed comparison metadata and cannot authorize execution or promote baselines.
  - The deterministic registry contains exactly nine reviewed families at version 1.0.0: exact, schema, retrieval, context, tool, policy, groundedness, response, and resource. Unknown identifiers and versions fail closed.
  - Evaluators return explicit observed, not_observed, and not_applicable evidence states and finite pass/fail measurements. The existing EvaluationScore port remains the score persistence boundary through to_evaluation_score.
  - Nested replay evidence is closed recursively: reserved/private claim support and resource keys, non-boolean control flags, undeclared schema fields, missing injection evidence, and mismatched tool schema/side-effect/idempotency observations fail closed.
  - Non-metadata dataset/case admission resolves authoritative AURA-0090 authorization metadata, including dataset, purpose/context, classification, manual retention, timestamp, and revocation; owner-supplied cases require opaque authorized artifacts.
  - Definition rejection audits are retried on a fresh transaction after rollback, while rejected state is never committed and provider exception details remain bounded.
  - The typed application service derives suite/dataset/evaluator/component and threshold provenance from immutable definitions; caller-supplied provenance is checked and never trusted for dispatch.
  - Evaluation scores persist bounded threshold applicability/value/operator/status alongside case, metric, evidence status, failure code, opaque evidence reference, and reproducibility metadata through forward-only ClickHouse migration 0006.
  - In-memory and PostgreSQL definition repositories emit content-free accepted, duplicate, conflict, and rejected audit outcomes; suite thresholds must match the bound evaluator metric, with only the reviewed legacy exact_match to evaluation.exact.ratio compatibility alias.
  - The Observatory implementation has no aura_core import, Core table access, runner transport change, public API, CLI, SSE, browser, judge, baseline, or dependency change.
  - Evaluator compatibility is a narrow injected port from composition; the definition service has no reverse dependency on the evaluator registry and the module graph remains acyclic.
  - PostgreSQL definition-state reads and ClickHouse score writes are independently classified and timed; application duration is not reported as evaluator compute latency.
  - Source-kind and authorization compatibility is enforced both at admission and at the containing dataset boundary; owner-supplied/captured content cannot be attached to a synthetic metadata-only dataset.
  - Response byte and token counts require actual bounded integers; Python boolean values are rejected despite bool inheriting from int.
  - Dimension-level evaluator outcome metrics are intentionally retained for multi-measurement evaluators; invocation count and compute duration remain once per evaluator call.
  - Provider failures are represented by DefinitionStorageError internally and sanitized before crossing the public definition-admission boundary.
risks:
  - The broad existing Observatory suite requires the test/evaluation worker to update protected manifest-surface expectations for the two authorized AURA-0093 component manifests before integration.
  - PostgreSQL adapter integration is unverified here because no disposable database was started by this worker; migration is forward-only and rerunnable and has no DROP TABLE or sensitive storage columns.
  - PostgreSQL adapter behavior depends on provider rowcount semantics for ON CONFLICT paths; a live disposable PostgreSQL run is still required to verify concurrent duplicate/conflict and audit transaction behavior.
  - The new ClickHouse score metadata migration is forward-only and must be applied after 0005; no prior migration was altered.
  - Artifact metadata lookup is intentionally content-free and requires an available, non-revoked artifact whose dataset, authorization record, purpose, context, retention, digest classification, and status match the case.
  - The production authorization adapter now exposes a narrow record-and-dataset lookup; legacy test doubles without that method use artifact metadata only as a compatibility fallback.
  - Typed replay evidence rejects reserved identifiers/content-shaped values and bounded-invalid enums; callers must provide reviewed opaque IDs and SHA-256 digests.
  - Existing AURA-0089 evaluator definitions may use the legacy exact_match metric name; suite admission treats only that reviewed exact-evaluator alias as compatible with evaluation.exact.ratio, while all other threshold metrics must equal the bound evaluator declaration exactly.
  - Suite component existence is checked against the existing Observatory component catalogue; deployment must synchronize the corresponding component manifests before admitting a suite.
  - Retrieval multi-family compatibility retains the legacy aggregate projection, while selected retrieval execution and application persistence retain every bounded quality dimension.
