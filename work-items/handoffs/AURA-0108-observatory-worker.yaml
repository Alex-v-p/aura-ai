decisions:
  - Added a separate ObservationReconciliationRegistry port so existing ObservationIdRegistry test and memory adapters remain source-compatible.
  - Reconciliation probes only opaque observation_id and ingest_sequence pairs and uses a bounded provider timeout.
  - PostgreSQL reconciliation holds the existing service advisory lock and commits receipt completion plus contiguous visibility advancement in one transaction; missing or retention-deleted receipts are never recreated.
  - Detail cursors preserve the existing opaque shape while carrying an optional committed ingest fence; legacy cursors remain accepted.
  - ClickHouse presence results are admitted only when both returned observation_id and ingest_sequence match the bounded requested receipt pairs.
  - Detail continuation fences are clamped to a freshly read committed watermark; production watermark lookup failures fail closed, while explicit test/in-memory query overrides may omit the fence.
  - Reconciliation startup runs beside queue intake, heartbeat, and stop handling; each pass has a validated whole-pass deadline and bounded advisory-lock watermark advancement.
  - Every recovery pass invokes a bounded visibility continuation, allowing a quiescent visible tail larger than one lock budget to converge without a new producer event; lag counts all ledger rows beyond the committed watermark until convergence.
  - Each pass enters a fresh metrics trace context, and timeout spans attribute the active PostgreSQL, ClickHouse, or health phase rather than assuming one dependency.
  - Recovery emits bounded metadata-only causal component spans for PostgreSQL selection/commit and ClickHouse presence phases across the telemetry-ingestion and telemetry-storage component identities using stable dependency, outcome, error, and trace identities.
  - No migration, public contract, Core import, Core database read, frontend change, or new deployable was introduced.
