decisions:
  - >-
    The app shell now mounts only the selected workspace. Root-provided stores
    retain workspace state; route transitions explicitly stop the operations
    stream and selected-run refresh work while preserving their snapshots.
  - >-
    Generic observation.changed events are ignored for REST refresh purposes.
    Run/trace invalidations drive bounded shared, analytics, and comparison
    refreshes; health history has a slower cadence and heartbeats do not read.
  - >-
    Run reconciliation compares the overview count only when the run page has
    no continuation cursor, avoiding projection-lag retries on a complete
    pagination state.
  - >-
    Operations loads use an in-flight plus one-pending guard and a 500 ms live
    debounce so operation events cannot overlap full workspace loads.
  - >-
    Overview remains passive when its stream reports an error or projections
    disagree; active Runs owns bounded reconciliation, while stable SSE event
    IDs are deduplicated across native reconnect replay and dual event delivery.
  - >-
    A selected-run invalidation received during an in-flight load is retained
    and produces one trailing refresh at the live cadence; projection-gap
    retries retain the slower bounded recovery cadence.
  - >-
    Analytics and Comparison live refreshes are route-active only; leaving a
    workspace cancels its coalesced coordinator and invalidates in-flight
    generations while preserving the last in-memory result for re-entry.
  - >-
    Evidence-deletion polling is cancelled when Trace deactivates and resumes
    only on Trace activation while the durable deletion key/status remains in
    memory; clearing disclosed bytes on Trace destruction preserves an accepted
    deleting state, and timer/completion gates prevent hidden reads after
    navigation.
risks:
