decisions:
  - Kept contract id observatory-v1 and version 1.0.0 because the change is purely additive and does not widen or alter any accepted v1 producer requirement.
  - Used a finite AnalyticsMetricName enum plus catalogue-declared unit pairs instead of accepting the telemetry schema's general syntactic measurement-name pattern.
  - Required the unit in every query and returned it through the effective query so a series can never aggregate incompatible units.
  - Used one finite group-by dimension per query and hard response limits to keep cardinality predictable while supporting the approved error and focused-view facets.
  - Declared clickhouse_quantile_exact as the stable percentile method and an explicit rate interval so consumers do not guess statistical semantics.
  - Kept null unavailable values distinct from measured zero and exposed no-data, unavailable, partial reasons, freshness, scan bounds, and execution bounds directly.
  - Excluded model identity, retryability, input cohort, GPU, selected evidence, side-effect detail, quality, and saturation from filters because those fields are absent from the closed metadata-observation v1 contract; the API reports their unavailability rather than synthesizing them.
  - Kept the generated Angular output transport-only with no authorization, validation, querying, retention, retry, caching, state, or presentation behavior.
  - No online documentation was needed because the repository's pinned OpenAPI 3.1 and Angular 22 guidance and existing generator conventions resolved the contract work.
risks:
  - The static metric allowlist must be evolved additively by the contract owner when a separately approved metadata-only measurement becomes queryable; the service must not silently accept syntactically valid but undeclared measurement names.
  - Model-focused analytics can expose provider and component operational data but cannot identify individual model names under metadata-observation v1; adding such a dimension would require a separate contract-authorized telemetry change.
