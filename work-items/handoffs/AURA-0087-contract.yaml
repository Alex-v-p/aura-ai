      source: contracts/openapi/observatory-v1.yaml
      changes:
        - Added an owner-authorized metric-catalogue resource containing the finite operational measurement and unit pairs, supported aggregations and groupings, focus areas, availability, and fixed query limits.
        - Added an owner-authorized bounded operational-analytics snapshot resource with a default 24-hour and maximum 31-day UTC window, deterministic bucket choices, at most 200 points per series, at most 12 series, at most 50 breakdowns, and fixed scan and execution limits.
        - Added closed metadata-only filter and facet types limited to component/version, operation, deployment, environment, host, service role, provider, outcome, error class, status, and retrieval stage from metadata-observation v1.
        - Added explicit exact-percentile, sample-count, rate-interval, freshness, zero-versus-unavailable, partial-state, unsupported-signal, effective-query, and no-store response semantics.
        - Added focus-area values for model, queue, retrieval, tool, memory, and automation views without widening telemetry capture or claiming unavailable model identity, retryability, cohort, GPU, evidence, side-effect, quality, or saturation signals.
  compatibility_notes:
    - Existing operation identifiers, paths, parameters, request bodies, response properties, required fields, and schemas are unchanged.
    - Both resources, all parameters, and all supporting schemas are additive, so observatory-v1 remains at version 1.0.0.
    - Existing clients ignore the new resources; the regenerated Angular output adds only transport types and operation descriptors.
    - Metric and unit are both required and their pair is validated against the catalogue; unsupported combinations return the existing 422 Problem response rather than being coerced.
    - Model identity is intentionally not a filter because metadata-observation v1 does not contain an allowlisted model dimension; the model focus uses declared measurements and provider/component facets and reports unavailable signals explicitly.
  producers:
