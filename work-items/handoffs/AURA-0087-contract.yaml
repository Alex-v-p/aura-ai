    - Execute analytical aggregation in ClickHouse under the declared scan and execution limits; do not hydrate or sort unbounded observation history in the application process.
    - Keep responses owner-authorized and no-store, fetch analytical series after metadata-only SSE invalidation, and never place credentials, filters, or series data in SSE event URLs or payloads.
