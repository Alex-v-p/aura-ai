decisions:
  - >-
    Kept all four handlers behind inward public ports and made the application
    coordinator persist transitions through WorkflowRepository only.
  - >-
    Added bounded metadata-only workflow evidence serialization over the
    existing run-evidence port; no workflow content or owner data is emitted.
  - >-
    Added SQL row-locking and transactional state/history/checkpoint/result/
    lifecycle writes without changing migrations or persistence outside the
    workflow module.
  - >-
    Pinned admission authority is carried by the instance in memory and by the
    current metadata-only SQL checkpoint; recovery scans expose only bounded
    instance identifiers to worker composition.
  - >-
    Added owner-local lifecycle replay through the public replay_events seam;
    cursors are opaque event IDs, strictly ordered by persisted event_sequence,
    and resolve to closed ok/unknown/foreign outcomes without platform scans.
  - >-
    Persisted RUNNING agent steps resolve to unknown rather than auto-replaying
    a non-replayable provider effect. Due waits are resumed only after the
    application re-evaluates their authoritative due instant.
  - >-
    Run evidence now uses the closed automation_input/automation_output payload
    and step_category automation; errorClass is intentionally telemetry-only.
  - >-
    Evaluators now return bounded component/version/scenario/case/replay data
    with baseline, negative, race, and replay synthetic cases.
  - >-
    Added typed validation issues, aggregate state projection serialization, and
    timestamp/result metadata fields so platform composition can produce the
    closed OpenAPI instance/revision shapes without persistence access.
risks:
  - >-
    SQL integration paths require the AURA PostgreSQL test environment; the
    local focused suite exercised the public and in-memory paths only.
  - >-
    Shared-tree integration checks must be rerun after the modules registry
    change is reviewed by its owning agent.
