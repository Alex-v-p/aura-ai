decisions:
  - >-
    Kept both contract identifiers and versions stable because the changes are
    additive and all old instances and operations remain valid.
  - >-
    Reused existing exact component, model, evaluator, suite, resource,
    provenance, capture, limit, retention, digest, UUID, UTC, and revision
    vocabulary rather than duplicating business models in transport.
    Baseline transport reuses EvaluationReproducibility so immutable source
    results remain tied to their exact deterministic execution boundary.
  - >-
    Kept experiment variants declarative and exact, cohorts as bounded explicit
    case identity sets, and regression creation as references plus rules. No
    request can select an executor, provider, endpoint, storage location, or
    caller-defined dimension.
  - >-
    Represented absolute and relative comparison outputs separately and made
    statistical significance, probabilistic confidence, and automatic change-
    point claims structurally unavailable. Preserved late-arriving evidence as
    an explicit state rather than folding it into complete, partial, or missing.
  - >-
    Used a dedicated irreversible promotion confirmation rather than widening
    the existing generic evaluation confirmation enum, preserving existing
    command consumers and making the destructive intent explicit.
  - >-
    Added regression and attribution to the dedicated evaluation stream only;
    the operational /api/v1/events stream and SsePayload remain unchanged.
  - >-
    Did not consult external documentation because dependency-version
    verification was not assigned; repository ADR-0016 and the checked-in
    generator define the authorized protocol and client behavior.
risks:
  - >-
    OpenAPI and JSON Schema cannot prove referenced record existence, timestamp
    ordering, digest correctness, cohort membership in the exact suite,
    capture-boundary compatibility, idempotent command ownership, or promoted-
    record immutability. Producers must enforce these invariants transactionally.
  - >-
    Enum widening is backward compatible for payload validation but consumers
    that implement exhaustive source-language switches must regenerate before
    the producer emits new evaluation history or SSE values; rollout ordering
    explicitly requires that sequence.
  - >-
    Attribution rank communicates deterministic evidence order only. Product
    copy and downstream alerts must not describe it as causation, probability,
    confidence, or statistical significance.
