contracts:
  changed: true
  authorship: >-
    Serialized by the assigned contract_steward as the sole writer for the
    evaluation-v1, observatory-v1, and generated Observatory Angular transport
    surfaces during this ownership slice. Business behavior, persistence,
    protected repository baselines, Core contracts, and durable runner
    protocols were not changed.
  compatibility: backward_compatible
  definitions:
    - id: evaluation-v1
      version: 1
      source: contracts/evaluation/v1/evaluation.schema.json
      changes:
        - >-
          Added closed RegressionDecision and AttributionReport resource
          variants to the existing atomic evaluation-v1 union. Every existing
          resource variant remains byte-for-byte valid and distinguishable by
          its existing resourceType.
        - >-
          Added deterministic absolute and relative metric comparisons with
          separate operational and quality classifications, exact direction,
          unit, aggregation, finite values, minimum samples, explicit missing-
          evidence policy, sample counts, and finite outcomes.
        - >-
          Added content-free opaque run, trace, result, score, and artifact-
          reference evidence identities with required digest and version.
          Evidence cannot carry content, a locator, filename, endpoint,
          credential, owner identity, or arbitrary attributes.
        - >-
          Added evidence-backed changed-binding attribution for component,
          model, deployment, prompt, policy, and configuration revisions with
          bounded deterministic rank and affected/unaffected cohorts. Rank is
          explicitly not causal or probabilistic confidence.
        - >-
          Made unavailable, insufficient, incompatible, partial, and missing
          evidence explicit. Unavailable attribution requires an empty
          candidate set and cannot synthesize a cause.
    - id: observatory-v1
      version: 1.0.0
      source: contracts/openapi/observatory-v1.yaml
      changes:
        - >-
          Added owner-session list/create/detail resources for immutable
          experiments, bounded explicit cohorts and exact variants under
          /api/v1/evaluation/experiments.
        - >-
          Added baseline candidate list/create/detail and irreversible manual
          promotion resources under /api/v1/evaluation/baselines. Promotion
          requires same-origin CSRF, a UUID idempotency key, the exact
          PROMOTE_IMMUTABLE_BASELINE acknowledgement, an expected candidate
          version, an opaque authorization record, and a UTC action time.
          Candidate and response DTOs also preserve the exact seed, clock,
          locale, fixture, prompt, and policy reproducibility boundary.
        - >-
          Added bounded deterministic comparison list/create/detail and
          attribution resources under /api/v1/evaluation/regressions. Request
          DTOs accept only exact persisted experiment, baseline, cohort,
          variant, result, evaluator, and threshold metadata; callers cannot
          submit comparison values or content.
          Detail and attribution reads require the exact immutable regression
          version and report malformed or missing version queries as 400.
        - >-
          Added snapshot-stable pages capped at 200, exact immutable references,
          bounded variants, cohorts, thresholds, comparisons, evidence, and
          attribution candidates, and explicit incomplete/unavailable states.
          Late evidence is an explicit additive state and cannot silently pass.
        - >-
          Extended only the dedicated evaluation history and evaluation SSE
          vocabularies with experiment, baseline, regression, attribution,
          promotion, and comparison notifications. Evaluation SSE remains a
          closed metadata_only resource-change notification without evidence,
          scores, content, credentials, or URLs.
        - >-
          Kept authenticated response handling under the existing no-store
          contract policy. Raw artifacts, prompts, responses, comments,
          rationale, filenames, endpoints, credentials, owner identity, and
          arbitrary attributes remain structurally absent.
  compatibility_notes:
    - >-
      evaluation-v1 keeps schemaVersion 1 and adds two resourceType-disjoint
      union members; no existing resource definition, required field, bound,
      or enum is narrowed. The additive late evidence-state value belongs only
      to the new unreleased RegressionDecision resource.
    - >-
      observatory-v1 keeps version 1.0.0, root security, every existing path,
      operationId, request and response schema, and operational SSE contract.
      All HTTP operations and schemas are additive. Exact regression version
      queries refine new unreleased AURA-0096 detail operations and do not alter
      any pre-AURA-0096 consumer.
    - >-
      The existing generic evaluation history and dedicated evaluation SSE
      enums are widened only for newly persisted AURA-0096 resources. Existing
      payload values remain valid and new values are emitted only after the
      corresponding additive producer is deployed.
    - >-
      Generated client exports and descriptors are additive. The client remains
      a transport-only facade and contains no authorization, validation,
      promotion, comparison, retry, persistence, or state-reconciliation logic.
  producers:
    - >-
      Aura Observatory experiment, immutable-baseline, deterministic-regression,
      attribution, history, and evaluation-live-event application boundaries
      assigned to AURA-0096.
    - >-
      Existing Observatory evaluation definition, result, score, deployment,
