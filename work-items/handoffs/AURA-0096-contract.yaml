      mapping and exact persisted identities.
  consumers:
    - >-
      Generated @aura/observatory-api-client types, operation descriptors, and
      transport-only ObservatoryApiClient facade.
    - >-
      Aura Observatory experiment, baseline promotion, regression, evidence,
      attribution, cohort, and history Web workflows assigned to AURA-0096.
    - >-
      AURA-0097 dashboards, in-product alerts, annotations, and incident views
      consuming persisted regression and attribution metadata.
  rollout:
    - >-
      Deploy the additive Observatory producer and migrations before enabling
      the new Web workflows. Persist authoritative state before emitting the
      matching metadata-only evaluation SSE notification.
    - >-
      Create candidates and promote baselines through distinct idempotent
      commands. Enforce exact candidate version and immutable source result
      identities in PostgreSQL; never mutate or demote a promoted record and
      never read or write protected repository baselines.
    - >-
      Resolve comparison values from persisted finite score and operational
      projections, apply only the contracted deterministic rules, and return
      explicit unavailable, incompatible, or inconclusive states when evidence
      is incomplete.
    - >-
      Regenerate the Angular client from the checked-in OpenAPI document and
      reject generated drift. Browser consumers keep authenticated data in
      memory and treat REST snapshots as authoritative over SSE hints.
