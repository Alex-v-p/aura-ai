decisions:
  - Branching is represented by immutable opaque branch and lineage identifiers, with root-branch backfill in migration 0021 and no destructive downgrade.
  - Branch context is reconstructed from the selected branch ancestor path; source and sibling messages, runs, citations, and side effects are not copied into a new branch.
  - Edit-and-branch creates a fresh governed run and normal memory processing for the new turn; regeneration creates a fresh governed run while suppressing automatic memory extraction.
  - Regeneration and branch mutations use owner-scoped optimistic versions and idempotency records, preserving failed-run retry semantics.
  - Branching telemetry and evaluations record only bounded identifiers, outcomes, counts, timings, and failure classes; private conversation and document content remain excluded.
  - Omitted branchId on legacy create-run requests intentionally targets the unique root branch, preserving compatibility while explicit branchId remains available for branch-aware clients.
  - Branch request telemetry uses a fresh request trace; the authorized conversation persistence span is the trace root, avoiding a request-latency sample under persistence_duration_ms, while lineage IDs remain trace-only and outcome metrics reuse the same trace ID.
  - Document-search citation handles are regenerated per governed run after owner-scoped retrieval; durable citations retain only the resolved document metadata, never the adapter chunk identifier or a prior run handle.
  - Regeneration telemetry makes run.regenerate the trace root and parents conversation.persist beneath it, with no unresolved synthetic request parent.
  - SQL branch and regeneration audit entries are staged inside the existing transaction only after idempotency lookup confirms a first execution; replay returns the existing command without another audit row.
