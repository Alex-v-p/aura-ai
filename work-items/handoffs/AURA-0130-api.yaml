decisions:
  - Kept API routes thin: authentication, CSRF, idempotency headers, DTO validation, closed errors, no-store, and public-value serialization stay at the transport boundary while calendar rules remain in the public application service.
  - Composed CalendarApplicationService through calendar_uow using only domain public ports and provider composition; enabled settings now wire the AURA-0129 key ring, credential loader, and Aura calendar-ID resolver while disabled settings remain fail-closed.
  - Added Valkey-backed (with deterministic test fallback) owner/session/attempt-bound authorization state, callback result state, and query-bound cursor handles with ten-minute TTL and one-shot consumption where the public port requires it.
  - Routes call the exact CalendarApplicationService lifecycle/retrieval methods directly; reflective method-name/kwargs fallback was removed.
  - Added fixed internal authorization navigation and callback endpoints without exposing provider code, state, credential, or provider payload values.
  - Added four stable calendar component identities, operation spans, and metadata-only metrics to the shared telemetry registry; no event content or owner identifiers are accepted as metric dimensions.
  - Removed the process-local provider cursor handle layer. The composed application now owns the single Valkey-backed transient cursor store; its one-shot consume returns only the server-held continuation value and binds handles to owner, scope, and normalized discovery/event query with the existing ten-minute TTL.
  - Superseding OAuth attempts now clear prior navigation, state, active, callback, completion, and transient replay receipt keys; stored attempt verifier metadata is owner/session/attempt checked; callback records use only the remaining original attempt TTL and exact attempt-id matching.
  - Authorization navigation requires intentional top-level document navigation evidence and rejects prefetch/scanner signals before consuming the handle. Calendar redirects and problem responses carry no-store and no-referrer policies.
  - Calendar request spans share one metadata-only trace context and deadline; provider calls create child spans and allowlisted outcome, retry, rate-limit, retrieval-count, connection-health, and conflict metrics without private dimensions.
  - Conflict telemetry is injected through the domain-safe observer port and records only the local evaluation duration/outcome; the route-level retrieval-inclusive span no longer owns the conflict evaluation metric.
  - Production composition rejects a missing Valkey client before service construction; in-memory transient state is available only to explicit test composition (the internal store's direct test fixture default remains compatibility-only).
  - Callback compare-and-write and exact active-attempt compare-and-consume use Valkey WATCH/MULTI transactions and an asyncio lock for test memory, while credential CAS loss reloads and authenticates only the active current envelope.
  - The public dataclass serializer uses a closed exclusion for the internal `revocation_terminal` field; lifecycle logic retains the field internally while API responses remain contract-exact.
  - Transient parser failures are converted outside JSON/UTF-8 exception handlers, preventing raw provider/private payloads from surviving in exception cause/context graphs.
  - One shared calendar terminal classifier now constrains route, provider telemetry bridge, and conflict observer outcomes to `ok`, `partial`, `canceled`, `rejected`, `timeout`, or `error`; exact error classes and retry/rate dimensions remain separate.
  - Discovery, authorization navigation, callback exchange, and revocation receive the route-owned deadline/cancellation context through the public application/provider request seam; disconnect cancels the in-flight API operation.
  - Navigation consumption watches the current marker, exact attempt payload, and active attempt together; only an exact-handle transaction may delete the navigation marker, with the memory backend using the same mutation lock.
