decisions:
  - "Scheduler is polling-only and delegates due claiming/admission to a public Briefings application port with a hard batch limit of 100."
  - "Worker consumes the existing generic identifier-only outbox envelope and acknowledges only after a terminal/durable settlement result."
  - "Briefing delivery invokes only CreateBriefingNotification with a deterministic occurrence/result idempotency key; it never reads notification persistence."
  - "Cancellation recovery accepts only the typed public RunCoordinator.cancel_briefing boundary and applies bounded retry delays and stale-claim limits; generic conversation Run cancellation is never used."
  - "Telemetry registers finite metadata-only briefing components, metric names, span operations, and trace-only briefing identifiers."
  - "Production worker now binds a concrete execution application through BriefingApplicationService.set_execution_application, with owner/source/policy revalidation, public state settlement, RunCoordinator provider/cancellation hooks, and notification handoff."
  - "The API state injects the public RunCoordinator cancellation port into BriefingApplicationService; worker composition also binds its cancellation port after constructing the shared coordinator."
  - "Briefing polling sleeps after failed claims and stages generic identifier-only wake commands in the same claim transaction; persistence failures cannot create a hot retry loop."
  - "Briefing execution composition is domain-owned; the worker binds a typed BriefingRunCancellationAdapter, while exhausted deliveries and stale claims durably settle UNKNOWN before acknowledgement."
  - "Lifecycle event publication remains on the event subject and identifier-only worker wakes use a distinct briefing wake subject; generic consumer telemetry is mapped only to finite registered briefing-scheduler dimensions and trace-only identifiers."
risks:
  - "The scheduler now calls the public claim_due_occurrences_and_stage seam and stages identifier-only commands through SqlOutboxRepository in the claim transaction; NATS publication remains the existing Core dispatcher concern."
  - "Runtime uses only briefing public state/application methods for occurrence lookup, admission, settlement, recovery, and cancellation; concrete source services remain public calendar/reminder/document application ports."
  - "Admission revalidates the active agent revision and exact pinned model, prompt-bundle, and tool-policy references through the public agent configuration service; the configured Core provider/model resolves the matching pinned model policy, while tool policy is read through the public owner-scoped port and must deny calls."
  - "Briefing wake transport counters are attributed to the registered briefing scheduler component and declared in its briefing manifest; no run-coordinator manifest change is required."
  - "Generic run-consumer metrics retain the established received/duplicate/acknowledged vocabulary; redelivery counters are emitted only by NatsBriefingConsumer and remain briefing-scheduler scoped."
  - "The production worker passes the shared Core run-evidence recorder into the briefing state and execution application; each run constructs one BriefingRunEvidenceAdapter and shares it across context, admission/execution, persistence, and delivery. Capture is bounded metadata-only and nonblocking on recorder rejection/outage."
  - "The RunCoordinator briefing callback now settles through the typed briefing state port; it never calls generic RunCoordinator.cancel because scheduled briefings do not create conversation Runs."
  - "Briefing wake validation requires the closed eventId to equal the command identity and the command identity to equal uuid5(BRIEFING_ID_NAMESPACE, wake:<occurrenceId>), preventing valid-UUID replay commands from reaching application/provider execution."
  - "Admission requires the canonical BRIEFING_EXECUTION_POLICY_ID and existing Core GENERAL_POLICY_ID; request construction pins the canonical execution policy and arbitrary execution/model UUIDs fail closed before source/provider use."
  - "Worker NATS readiness configures the exact BRIEFING_EVENT_SUBJECT lifecycle stream alongside the identifier-only BRIEFING_WAKE_SUBJECT; the stale BRIEFING_TOPIC is no longer composed."
  - "One run trace now uses shared briefing_phase_span_id identities: context is the root phase, admission parents context, persistence emits the deterministic persistence span, delivery parents that actual persistence span, and RunCoordinator receives the emitted context span as its parent."
