decisions:
  - >-
    Tests use a local recording metrics port so they verify Core's exact typed
    component and metric boundary independently of exporter implementation.
  - >-
    The privacy suite injects owner-private titles, content, SHA-256 values,
    object keys, and exception text, and rejects their appearance in emitted
    observations while allowing correlation identifiers only in trace-only
    fields.
  - >-
    Persistence covers successful create and immutable append plus storage
    failure; deletion covers truthful deletion_failed and cleanup_unknown
    outcomes; idempotent replay checks stable metadata-only lifecycle events.
  - >-
    Added independent collision, digest-tamper, timeout, retry, reconciliation,
    and delete-replay cases. The fake object port implements put_if_absent so
    the test detects accidental overwrites rather than masking them. The
    reconciliation assertion is deliberately read-only: a present object
    settles to deletion_failed and requires an explicit retry before deletion.
  - >-
    Raw object-port TimeoutError is exercised as a known failed cleanup at the
    Core boundary; the Garage adapter's provider ambiguity, immutable
    put-if-absent behavior, integrity collision, and generic failure mapping
    are covered independently. Admission-only deletion is executed through
    claim/lease/restart settlement rather than a synchronous delete shortcut.
  - >-
    Live SQL tests create and drop a unique schema in the isolated AURA-0143
    PostgreSQL database, so each run verifies the real SQL repository and
    transactional outbox without sharing or deleting another test's records.
    A failed publication is asserted to leave no artifact, lifecycle event, or
    outbox row before the same admission is replayed after the simulated crash.
  - >-
    Manifest boundary assertions use the approved exact
    ArtifactRevisionWriteInputV1/ArtifactRevisionWriteResultV1 and
    ArtifactDeleteInputV1/ArtifactDeleteResultV1 schema names, plus the
    approved transactional_outbox dependency declaration.
