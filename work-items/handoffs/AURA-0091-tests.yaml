decisions:
  - >-
    Removed the upfront allowed dispatch-request, cancellation, and runner-result
    publishes from the ACL matrix. Those operations now use the real validated
    request/cancellation/result envelopes below; only non-retained subscriptions
    and management acknowledgements remain in the preflight matrix, preventing
    synthetic bytes from occupying the durable result consumer.
  - >-
    Kept the active-cancellation duplicate publication assertion strict to
    protect the one-terminal-state and idempotent-publication requirement;
    the test does not normalize or ignore duplicate results.
  - >-
    Used deterministic in-memory providers for the unit slice and an opt-in
    isolated PostgreSQL test for persistence semantics; no provider network,
    owner data, protected baseline, or external system is used by default.
  - >-
    Extended only the assigned AURA-0091 deployment acceptance script and
    topology tests: disposable Compose project names are normalized to
    lowercase, required non-secret Core OIDC interpolation values are
    fixture-local, and network checks match Compose's project-prefixed
    names without broadening teardown scope.
  - >-
    Kept the new terminal-fetch diagnostics failure-only and metadata-only so
    normal acceptance output remains concise. The exact attempt identity is
    used only in the in-container SQL lookup and is never emitted; result
    diagnostics expose only bounded byte length and a finite JSON header class.
  - >-
    Made every valid evaluation-envelope publish pass through the public
    validate_message function in the harness, and derive request digests with
    canonical_digest instead of handwritten hashing. The malformed poison
    probe remains the sole intentionally invalid publish. Failure diagnostics
    now include a bounded comma-separated list of present finite metric names
    in addition to the present/total count.
  - >-
    Kept denied writes to retained evaluation subjects after the first valid
    terminal flows so an unexpectedly routed permission probe cannot pollute
    the initial durable consumer state or make its diagnostic counts
    ambiguous; the ACL assertions remain live and strict.
  - >-
    Reused one explicit content-capture authorization object for the module
    replay request and its input reference, preserving equal classification,
    purpose, context, retention, authorization record, and timestamp while
    keeping production validation unchanged.
  - >-
    Kept replay input limits at the strict declared-byte total, bounded by the
    harness fixture ceiling; metadata-only synthetic requests continue to
    declare zero input bytes. The harness asserts both cases before publish.
  - >-
    Scoped URL privacy policy by service to avoid treating static NATS
    documentation URLs as evaluation data while preserving strict endpoint and
    credential checks for the evaluation runner and all result/SQL scans.
  - >-
    Treat the restarted production runner as the only redelivery consumer.
    After the initial unacknowledged delivery and ack-wait interval, its
    terminal result, ledger/outbox settlement, and post-recovery ConsumerInfo
    counters jointly prove durable redelivery without a test-side pull.
  - >-
    Keep the output-write cancellation assertion strict: an adapter that has
    begun a write must receive a bounded cleanup call even if cancellation
    arrives before the write coroutine returns. The current failure is
    reported rather than normalized.
  - >-
    Keep harness resource budgets exact by execution kind: synthetic fixture
    model work is one bounded call, module replay model work is zero, and
    full-content module replay artifact operations include both input and
    output adapter calls.
  - >-
    Verify runner-owned output deletion through the already-authorized
    provider store and UUID-derived key rather than calling the adapter's
    input-only read method on an output reference; this preserves the
    production media-class contract and keeps locators out of acceptance
    output.
  - >-
    Validate every contract-bearing fixture at the final harness boundary
    immediately before publication, with a bounded field-level reason on
    drift. Keep intentionally malformed ACL and poison probes on their
    explicit unvalidated paths so the negative matrix remains meaningful.
  - >-
    Treat runner database reachability as a prerequisite for interpreting a
    terminal timeout, and distinguish a successful ledger query with no exact
    row from an unavailable query. Keep the timeout poison signal boolean-only
    and derived from bounded logs without emitting log text, payloads, or
    credentials.
  - >-
    Build the canonical cancellation-associated request before publishing its
    tombstone so the durable cancellation and later request cannot conflict
    on request digest or identity. Preserve cancellation-first ordering to
    exercise the queued-before-run path.
  - >-
    Keep direct SQL acceptance probes coupled to the public ledger cancellation
    signature through explicit keyword arguments and projection-derived
    deadline parsing; source assertions must fail if that identity contract
    drifts.
  - >-
    Keep runner observability typed and closed at the manifest boundary. The
    test-owned validator rejects missing or extra per-metric fields, unbounded
    labels or dependencies, wrong capture policy, incomplete privacy markers,
    and unbounded export or retention semantics; no Collector or OTLP runtime
    behavior was added in this correction slice.
  - >-
    Assert durable state after terminal settlement rather than relying on the
    returned pre-publication AttemptRecord snapshot. Fresh-process recovery
    is measured with a separate metrics sink so republishing cannot fabricate
    a second business outcome or execution duration.
  - >-
    Keep outage acceptance correlated to the exact published attempt rather
    than assuming the next durable result belongs to the probe. Drain only
    unrelated terminal messages, fail closed on malformed or non-terminal
    traffic, and preserve bounded failure diagnostics without exposing result
    payloads or credentials.
  - >-
    Keep shell success and failure branches expressed directly around the
    outage probe command. Avoid negation when the branch labels are success
    and failure so a healthy runner cannot be reported as an outage failure.
