decisions:
  - >-
    Provider implementation imports were kept behind the bootstrap/provider
    boundary; the coordinator uses provider-neutral request DTOs and accepts
    only the reviewed inward provider ports.
  - >-
    Provider admission and outbound research remain fail-closed and disabled
    by default; synthetic fixtures are used only in deterministic tests.
  - >-
    Extension admission can raise a lowered budget once, but only to the
    immutable operator envelope; settlement validates all consumption counters
    against the admitted envelope.
  - >-
    Evidence and citations are task-scoped and validated at every transition;
    terminal or deleted tasks reject checkpoint mutation. Provider operation
    identities are durably claimed and settled to fence replay after restart;
    settled operation responses carry bounded evidence for restart recovery.
  - >-
    Absolute deadlines are checked at each provider admission barrier, final
    provider URLs are revalidated, cancellation sends the exact deterministic
    operation request IDs, and cleanup substates are persisted with proof-gated
    retry/reconciliation.
  - >-
    Admission persists an initial checkpoint and shared platform identifier
    command atomically in SQL; the worker consumes the public command and
    acknowledges only after settlement.
  - >-
    Runtime observations use generated admitted trace lineage for spans while
    metrics remain correlation-free; terminal budget fields and settlement
    latency are emitted once after the authoritative save.
  - >-
    Owner settings are versioned and persisted through the research repository
    boundary, while generated reports use only the generated-artifact public
    application API and Task Center uses the source snapshot boundary.
  - >-
    Public failureClass serialization is restricted to the OpenAPI
    ResearchFailureClass enum. Internal coordinator failure details are mapped
    at settlement; wall-clock expiry uses public timeout with budget_exhausted
    outcome and telemetry status/error budget_exhausted.
  - >-
    API admission receives a non-network provider capability/settings snapshot
    through the bootstrap seam; worker execution intersects that immutable
    admission snapshot with current narrowing switches.
  - >-
    Terminal budget fields describe a durably successful settlement; exhausted
    runs retain status budget_exhausted and error class budget_exhausted rather
    than being reported as unknown metric outcomes.
  - >-
    Lexical/token and denylist synthesis was removed. Research now accepts only
    a trusted injected synthesis port result, and validates exact task-scoped
    source IDs and bounded spans before citations or report artifacts exist.
  - >-
    Settings, extend, cancel, task-command, and deletion finalization receipts
    are claimed and persisted in the same memory/SQL repository mutation as
    expected-version state changes and Task Center invalidation staging.
  - >-
    Provider operation rows are dispatch leases: cancellation, current
    capability narrowing, deadline, and operation identity are checked while
    the repository claim is serialized; late operation settlements are ignored.
  - >-
    Five-minute static/browser fallback cohorts are source-owned durable rows,
    not MetadataMetrics or coordinator process state; the ratio is derived from
    the shared numerator/denominator.
  - >-
    Research telemetry now applies component-specific dependency matrices and
    rejects coordinator model-gateway/conversation-store/scope dimensions while
    preserving admitted trace lineage only on spans.
  - >-
    Trusted synthesis preserves the adapter's sufficient flag; insufficient
    validated claims settle PARTIAL and never create a report artifact.
    Claim support uses a closed v1 question/relation parser with bounded terms,
    exact task/source/span checks, and instruction-bearing spans fail closed.
  - >-
    Provider dispatch receives a typed current-capability callback and evaluates
    it inside the serialized Memory/SQL dispatch gate; the coordinator never
    authorizes dispatch from a precomputed boolean.
  - >-
    Fallback cohort persistence is outcome-isolated from research settlement;
    SQL first-writer races retry after unique-key conflict and retain both
    numerator and denominator.
  - >-
    Research telemetry rejects error classes outside the closed manifest union;
    phase spans cover actual planner/validator/synthesis actions, with durable
    checkpoints persisted after the phase span.
  - >-
    Claim support is now a single closed declarative sentence relation: the
    supported question grammar extracts relation/object, the evidence sentence
    extracts subject/relation/object, and only an exact normalized relation is
    rendered into the report. Multi-sentence, mixed-clause, imperative, and
    unsupported forms fail closed without lexical denylist authority.
  - >-
    Coordinator telemetry owns only coordination, checkpoint/queue, budget, and
    fallback metrics; planner, cancellation, evidence, citation, synthesis, and
    deletion metrics remain owned by their child components. MetadataMetrics
    enforces metric ownership plus exact operation/dependency/outcome/error
    matrices.
  - >-
    Fallback ratio is emitted only when the durable cohort read/write succeeds;
    repository outage never fabricates a zero ratio while settled and fallback
    counters remain truthful.
  - >-
    Claim entities use a closed bounded v1 grammar: each subject and object is
    a normalized one-to-eight-token proper-noun or numeric phrase with safe
    punctuation. Pronoun, modal, imperative, lowercase, multi-clause, and
    mixed-instruction prefixes are rejected; report text is rendered only from
    parsed subject/relation/object fields, never from the original subject span.
  - >-
    Provider search/static/browser/extraction components advertise aligned
    partial, canceled, redirect_blocked, and resource_exhausted classifications
    while rejecting unrelated cleanup_unknown errors. Planner deleted status is
    rejected, evidence redirect_blocked is accepted, and MetadataMetrics keeps
    the closed component ownership matrix without child-metric leakage.
  - >-
    EntityPhrase is a typed closed DTO with one or two normalized proper-name
    or numeric tokens and bounded internal punctuation. The parser has no
    pronoun, imperative, or blocked-word denylist; hostile prefixes fail by
    complete-shape validation, while Paris and New Delhi normalize and render
    through the DTO only.
  - >-
    Research telemetry uses exact per-metric tuple guards: planner metrics only
    admit planning status, provider resource_exhausted requires a failed or
    rejected provider outcome, and linked-artifact deletion_pending admits only
    partial plus cleanup_unknown. Deletion manifests advertise the partial
    cleanup tuple; cleanup_unknown/deleted combinations outside their canonical
    states are rejected.
  - >-
    Structured claims now require a separate ResearchEntityResolutionPort
    result after synthesis. The typed result must exactly match the normalized
    candidate, establish a bounded entity type/provenance and non-empty bounded
    identity, and correlate to the task and applicable run. Missing, malformed,
    mismatched, or unavailable resolution settles PARTIAL without citations or
    report artifacts.
  - >-
    Research span recording applies the same exact tuple guard as metrics:
    static success/resource_exhausted spans reject, failed or rejected provider
    resource exhaustion is accepted, and deletion partial/cleanup_unknown spans
    remain accepted.
  - >-
    Deletion telemetry admits the manifest-declared statusless
    failed/storage_unavailable tuple for both metric and span recording; it does
    not broaden acceptance to unknown/storage_unavailable or undeclared
    statusful combinations.
