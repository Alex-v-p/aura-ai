decisions:
  - >-
    Added one standalone aura-daily-action feature library. It composes the public ReminderStore,
    NotificationStore, ApprovalStore, and ConversationStore APIs; it does not import Core internals,
    own API calls, or start duplicate notification/approval streams.
  - >-
    Today and Later use pure bounded aggregation that excludes terminal reminders and suppresses a
    standalone reminder when it is already represented by an active series next occurrence.
  - >-
    Needs attention renders only approval/notification metadata and routes every card to the
    canonical detail workspace. No inline approval, acknowledgement, completion, or cancellation is exposed.
  - >-
    Root and wildcard routes now resolve to Today, and both Aura wordmarks plus the first navigation
    destination resolve to /today while Conversations remains explicit.
  - >-
    Mobile navigation uses aria-hidden and inert semantics while closed, and makes the routed main
    content inert while the open navigation focus trap is active; desktop navigation remains available.
  - >-
    Daily Action Center styling now consumes Aura's shared text, surface, accent, focus, and dark-theme
    tokens. The outer container is a non-landmark wrapper so the named section regions remain unique.
  - >-
    Notification source errors are classified before the unloaded-view check, so a failed 503 response
    renders scoped recovery instead of remaining indefinitely in the loading state.
  - >-
    The expanded wide-layout template gives the destination stack a shrinkable flex basis and the
    conversation library a bounded flex basis, preserving a visible recent-conversation scroller at 1280px
    after adding the Today destination.
  - >-
    ConversationPanelComponent now keeps a local composer signal and dirty handoff. Input is written to
    the local signal and store synchronously; when a transient draft selection changes during bootstrap,
    the local value is handed to the captured origin conversation through the public ID-addressed store API
    before the component adopts the destination value. Confirmed acceptance clears the local mirror while
    rejected or uncertain outcomes retain the submitted text.
  - >-
    Today source classification checks authorization, explicit status, connection state, and public notice
    before loading; auth/permission guidance omits retry controls. Today reminder cards are bounded after
    aggregation, and Needs attention never presents a truncated projection length as an exact total.
  - >-
    NotificationStore now maintains a bounded unread projection independently of the selected notification
    workspace view, allowing Today to remain stable when the user visits notification history; Storybook
    fixtures provide the public notice, unread collection, and loaded signals consumed by the page. History
    refreshes and SSE-triggered refreshes reconcile that projection with one bounded delivered-list request;
    acknowledgements update it regardless of the active workspace view.
  - >-
    The expanded sidebar owns desktop rail scrolling so Preferences remains anchored at short heights;
    Today switches to one column by 1024px to account for the compact rail, and action-card borders use
    the semantic control-border token. Mobile open state hides and inerts header/main surfaces from AT,
    keeps the visual scrim pointer-operable, and restores trigger focus after the rendered close state.
  - >-
    Today exposes the established ConversationStore.login() action for unauthenticated owners and suppresses
    all source Retry controls after shared session loss, while preserving transient retries for authenticated
    owners.
  - >-
    Daily source classification preserves auth, explicit errors, and notices first, then treats an active or
    not-yet-loaded initial refresh as loading before interpreting offline or reconnecting connection states.
  - >-
    Today now distinguishes an unauthenticated session from a retained authenticated session with a
    permission failure: only unauthenticated state presents ConversationStore.login(), while authState
    error maps Continue to an error and presents access-unavailable guidance without sign-in or retry.
    The Storybook catalog includes deterministic loading, partial failure, permission, offline,
    reconnecting, and unauthenticated fixtures for state-specific accessibility coverage.
