decisions:
  - "Observatory uses a closed Pydantic runtime validator aligned to the versioned camelCase JSON Schema; schema-invalid snake_case aliases and hyphenated OTEL trace identifiers are rejected at the wire boundary."
  - "Production composition uses the configured PostgreSQL catalogue and ClickHouse observation adapters; memory adapters are available only through explicit test composition."
  - "Stable UUID observation IDs use a PostgreSQL pending/completed receipt state machine with deterministic lease recovery before ClickHouse insertion; completed receipts return DUPLICATE, active pending claims return RETRYABLE storage failure, stale claims retry with the same deduplication token, and only completed writes count as duplicates."
  - "Catalogue component and deployment writes occur before observation persistence, so a catalogue failure cannot leave a stored observation without its metadata; storage failures are classified without retaining payloads."
  - "Ingest duration is reported per batch while aggregate local totals remain diagnostic only; malformed JSON and size-limit failures increment bounded malformed counters after authentication."
  - "Metric observations may omit trace and correlation; span observations require trace and span identifiers. No automatic retention or TTL is configured."
  - "Private ingest accepts only a file-injected credential or bearer header, and rejected payloads are never logged or persisted."
  - "Observable component manifests live under the Observatory service; end-to-end batch duration belongs only to telemetry_ingestion, while telemetry_storage declares only storage-attributed outcomes and failures."
risks:
  - "Pending receipt recovery is lease-based and configurable; retries wait for stale recovery after crashes or ambiguous responses, and the stable ClickHouse deduplication token prevents a second visible row. Observation retention remains manual with no TTL."
  - "The worker now has a real configured adapter composition and process-local batch queue; Collector transport wiring remains a platform/export concern for the next work item."
