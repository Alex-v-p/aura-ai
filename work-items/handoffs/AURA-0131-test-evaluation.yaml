decisions:
  - >-
    Added independent generic fixtures for calendar lifecycle, explicit
    selection, merged agenda, server conflict projection, recovery states,
    private-content containment, route navigation, and request amplification;
    no provider or private owner data is persisted or logged.
  - >-
    Added Calendar and Today Storybook state coverage for loading, disconnected,
    reconnecting, reauthorization, revocation uncertainty, partial, stale,
    rate-limited, permission-denied, offline, empty, reduced-motion, light/dark,
    and axe/runtime-error checks.
  - >-
    No Axe rule, threshold, golden result, or existing assertion was weakened.
    The management conflict assertion was not added because that surface does
    not render conflicts; the Today projection path remains covered separately.
  - >-
    Storybook calendar fixtures implement the public projection start() hook as
    a no-op, and Today Storybook readiness allows a bounded 30-second cold-build
    window without changing state, Axe, or runtime-error assertions.
  - >-
    Navigation expectations preserve the visible Calendar label while asserting
    its approved accessible name/title (Calendar integrations) and the Connect
    group structure.
  - >-
    Permission-denied Today coverage asserts the calendar recovery message and
    absence of private event titles while retaining independent reminder and
    conversation cards across desktop, tablet, and mobile projects.
  - >-
    Added proportionate independent coverage for management loading/provider
    error/disabled/unavailable/last-error states, delayed OAuth success/failure
    focus, single-submit disconnect confirmation progress/cancel focus,
    keyboard selection, dark-theme touch targets and 200% reflow, and active
    Connect navigation on both integration routes.
  - >-
    Added Today fixture coverage for composite calendar/event identities,
    multiple server conflict relationships, multi-day display, and long titles
    at mobile width and 200% zoom. No browser-side conflict calculation was
    introduced.
