decisions:
  - >-
    SqlConversationRepository.append_message now passes a selectinload option
    with its row lock so _message can render normalized attachment links
    without implicit asynchronous relationship IO for any streamed chunk.
  - >-
    The regression exercises two sequential assistant chunks and makes the
    session boundary require relationship eager-loading options before it
    hydrates attachment_links, reproducing the async-safe contract without
    requiring a shared database.
  - >-
    OTLP trace serialization replaces only the exact all-zero internal
    no-trace sentinel with UUIDv5(namespace, observation ID). This is stable
    across retries, contains no content or identity, and uses the replacement
    for links while preserving supplied parent span IDs and all non-sentinel
    trace IDs.
