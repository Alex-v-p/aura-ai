decisions:
  - Calendar lifecycle completion consumes once the server-held sanitized callback result bound to the exact authenticated owner, initiating session, and non-expired connection attempt through a no-body command; provider authorization codes, state, tokens, and raw callback payloads never enter the public JSON contract.
  - Connect and reauthorize return a high-entropy single-use same-origin authorizationPath instead of a provider endpoint; it fails closed on mismatch, replay, prefetch, expiry, or supersession and is explicitly excluded from logging, telemetry, persistence, SSE, and caching.
  - CalendarConnection availableActions contains only connect, complete_connection, reauthorize, and disconnect because each maps to one public lifecycle operation; retry remains scoped recovery guidance rather than an ambiguous connection command.
  - Calendar operations use dedicated no-store problem responses whose closed category and fixed-template recovery fields cannot represent resource or field values, calendar content, owner identity, credential material, or provider diagnostics.
  - Calendar event and conflict reads use POST bodies as read-only queries so private selected-calendar and range values never enter URLs; they intentionally omit CSRF and idempotency headers because they do not mutate state.
  - Calendar identifiers are Aura-owned UUIDs and event identities are opaque owner-bound values; public schemas contain no provider account or credential identifier.
  - Explicit calendar selection replaces the complete selected set with optimistic versioning and accepts an empty set; discovery never mutates selection.
  - Conflict results contain canonical bounded event pairs and deterministic interval relationships; no business calculation was added to the generated client.
risks:
  - OpenAPI expresses individual timestamps and timezone syntax but cannot prove rangeStart precedes rangeEnd by at most 31 days or that a timezone exists in the deployed IANA database; future Core admission must enforce both rules.
  - The same-origin authorizationPath requires a later platform-owned ephemeral authorization navigation route with exact callback and expiry enforcement; this contract does not implement that behavior.
unresolved:
  - AURA-0129 must choose and validate the existing-runtime-compatible credential encryption and key-delivery mechanism before durable credentials are implemented.
  - Platform OAuth, Core persistence and provider behavior, deployment, and Aura Web product behavior remain sequential follow-up work items.
