decisions:
  - >-
    Added REST-authoritative feature stores with monotonically guarded version
    reconciliation. SSE subscriptions only trigger a fresh authorized GET and
    never become a source of content or state.
  - >-
    Kept all draft questions, filters, selected detail, and previews in Angular
    signals only. No localStorage, IndexedDB, URL state, service-worker cache,
    or analytics integration was added.
  - >-
    Implemented transport adapters over the reviewed generated Aura API
    operation descriptors, including same-origin credentials, no-store reads,
    CSRF/idempotency mutation headers, and HTTP-compatible relative URLs.
  - >-
    Artifact previews are bounded text rendered in a preformatted inert region;
    HTML is stripped before rendering and JSON is not evaluated.
  - >-
    Added separate lazy routes and public index boundaries for Research,
    Artifacts, and Tasks, with product-neutral application-shell navigation.
  - >-
    Conversation API mapping preserves researchActivity and the panel renders a
    task-linked activity card without moving fetched content into transcript state.
  - >-
    Session reset handlers are registered lazily by the application shell, so
    route bundles remain lazy while logout/principal changes abort and fence all
    research, artifact, and task requests.
  - >-
    Research advanced labels use a deterministic formatter with no regular
    expression replacement callback in the Angular template. Admission clears
    question, domains, seeds, mode, and lowered budget drafts only after a
    successful admission; explicit discard clears the same signals.
  - >-
    Artifact and research destructive confirmations trap focus, close on
    Escape, and restore the exact initiating button. Destructive controls use a
    locally high-contrast semantic color with forced-colors handling.
  - >-
    Task reconciliation retains generated task identifiers/status/outcome,
    progress, capabilities, route-key links, projected versus REST-reconciled
    versions, time filters, cursor pagination, and command state until the
    awaited authoritative version is reached.
  - >-
    Task Center uses one route-driven initial list admission; same-generation
    duplicate list calls no longer abort the first request, while detail and
    principal/session transitions still invalidate prior work.
  - >-
    Research settings are the sole budget authority: the composer is gated on
    the settings envelope, every budget and cumulative extension field is
    checked against admitted and maximum values, and explicit field errors are
    shown before mutation.
  - >-
    Task and research streams now parse CRLF/chunked frames, surface malformed
    and gap states, treat clean EOF as a failed connection, and use a bounded
    reconnect backoff. Research invalidation is keyed by task and authorization
    generation.
  - >-
    Conversation research activity performs a generated-client task snapshot
    reconciliation with a generation fence, lifecycle state, and report links;
    it never starts a second run or appends a duplicate message.
  - >-
    Stream gaps, including HTTP 410, are treated as resumable invalidations:
    the store performs an authoritative REST refresh and the transport resumes
    with bounded reconnect delay rather than permanently stopping.
  - >-
    Idempotency headers are opaque random values; logical request fingerprints
    remain only as in-memory map keys and keys retire after settlement or known
    rejection while reset clears every map. Artifact type and updated-time
    filters stay memory-only and use the generated media-type query authority.
  - >-
    Destructive research/task/artifact actions use consequence-labelled dialogs,
    safest-first controls, Escape/opener restoration, and stable status focus;
    signed-out notices contain no private content and loading states retain
    structural skeletons.
  - >-
    Session failures expose only content-free signed-out notices while preserving
    reset fences and clearing private lists, details, previews, loading, saving,
    and pending command state.
  - >-
    The successful research admission increments the store reset epoch before
    any follow-up list/detail reconciliation, allowing the bound composer to
    clear immediately while rejected or unknown admissions retain every draft
    field. ViewChild setters plus bounded post-render retries focus the live
    activity or deletion-status heading only after the corresponding DOM node
    exists.
  - >-
    Task Center and Artifact list/detail, filters, preview, and confirmation
    surfaces cap intrinsic children, wrap long evidence/status text, and use
      responsive single-column controls at narrow widths; no global horizontal
    overflow clipping was added.
  - >-
    Research admission handoff state contains only the admitted opaque research
    ID, has explicit consume/clear semantics and a bounded expiry, and is
    cleared by session reset. The composer clears its own signals before route
    navigation; the detail route owns the one-shot announcement and focus
    intent after its selected detail is rendered.
  - >-
    Stream authorization failures leave a content-free signed-out presentation;
    disconnected, malformed, and gap states remain visible and politely
    announce recovery while REST remains authoritative. Saved preset errors are
    keyed by mode and field with associated aria-invalid/describedby feedback;
    route-shaped skeletons and bounded post-render heading focus cover research,
    task, and artifact detail loading. Conversation activity uses human-readable
    detached copy and links to the durable task and report artifact.
  - >-
    The direct store/transport regressions use the production classes through
    Angular TestBed and a deterministic fetch harness. Stores and API adapters
    retain compile-time Injectable metadata for AOT; the existing Vitest
    decorator transform covers these owned files so direct suites can execute
    the same production classes without a test-only facade.
  - >-
    Artifact listing uses the generated mediaType and cursor query contract.
    Time filtering remains explicitly memory-only because the public contract
    has no time parameter; the UI exposes truthful loaded-page scope and a
    cursor-driven Load more action rather than claiming a complete server-side
    time search.
  - >-
    Store services and the three Aura API adapters retain compile-time Angular
    Injectable decorators for AOT and dev bootstrap. The existing Vitest
    legacy-decorator transform is extended only for these owned store/API files
    so direct TestBed tests do not require JIT.
risks:
  - >-
    Conversation activity hydration uses a bounded snapshot poll because the
    conversation contract carries only the opaque task reference; stream
    transport remains owned by Task Center.
  - >-
    Browser-level and full-stack acceptance depends on the separate test/evaluation
    fixture and provider capability gates; real research providers remain disabled.
  - >-
    The approved responsive navigation design includes a route-context drawer /
    overlay behavior shared with the application shell. This ownership zone
    supplies the feature routes and focus-safe dialogs; implementing a new shared
    drawer primitive would cross the shell/shared-UI boundary and requires an
    owner decision or follow-up work item.
