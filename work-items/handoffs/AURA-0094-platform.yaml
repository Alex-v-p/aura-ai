decisions:
  - Changed observatory-judge-egress to an internal network with no published port, so it cannot route arbitrary public egress. Docker Desktop evidence shows that this also blocks host.docker.internal; Compose has no host-gateway exception on an internal network.
  - Kept Ollama optional at runtime: the evaluation worker has bounded timeout/concurrency settings and no Ollama dependency in Compose readiness, so normal Core and Observatory readiness do not depend on the provider. The intended host/local Ollama boundary is therefore ADR_REQUIRED until Docker can express it without a proxy or additional capability.
  - Hard-coded the normal Compose judge origin to the deployment-owned host-gateway URL, allowed only the generated host-gateway relay origin in local-http mode, rejected public relay targets, and blanked all HTTP(S)/ALL proxy variables with NO_PROXY=*.
  - Added a separate file-backed judge Garage access/secret pair and one-shot idempotent bootstrap. The bootstrap is the necessary provisioning exception to the worker-only long-running credential boundary; the judge key is limited to the existing evaluation bucket and verified as compact read-only R permission with write and owner denied.
  - Reused the existing encrypted Garage state root and private object-storage network. The existing Observatory write identity and Core evaluation-runner identity remain unchanged and are not mounted into the evaluation worker.
  - Extended local-http secret generation/preservation without writing secrets to tracked files; reset continues to remove only project-scoped disposable volumes and preserve secret files, while down preserves all disposable state.
  - Added a relay override for local HTTP mode so the optional loopback Ollama relay is used consistently by Core and the worker while ambient provider URLs remain unset and authoritative generated overlay values win.
  - Recorded current pinned Docker Compose/Garage v2.1 deployment behavior through the existing digest-qualified image, file-injected secrets, no-host-port internal storage boundary, and fail-closed grant verification patterns; no dependency or image upgrade was introduced.
  - Applied the owner decision recorded in AURA-0094: the internal, fail-closed judge network may remain unable to reach host.docker.internal Ollama for this checkpoint. Provider-unavailable is an accepted availability limitation and is not a release blocker; any future reachable route requires a separately governed deployment decision.
