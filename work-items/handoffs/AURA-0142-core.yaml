decisions:
  - >-
    Content is canonicalized and bounded before publication; JSON is sorted and
    compact UTF-8, while Markdown/plain text require valid UTF-8. SHA-256 and
    byte count are verified on every read.
  - >-
    Artifact IDs are opaque and object keys contain no owner, title, digest, or
    lineage values. Public routes expose no create or append operation.
  - >-
    Deletion transitions immediately to an unavailable content-free state,
    preserves integrity truth, treats missing objects as absent, and separates
    known failure retry from unknown-outcome reconciliation.
  - >-
    The Garage adapter fixes the bucket to aura-artifacts and reads only the
    dedicated artifact identity settings; it never falls back to document-store
    credentials.
  - >-
    Artifact manifests prohibit exception_text and trace identifiers from
    metric capture, while keeping trace-only lineage fields. Deletion
    instrumentation separates approved outcome values from the bounded
    validation_failed, conflict, storage_unavailable, cleanup_unknown,
    delivery_failed, settlement_unknown, and timeout error classes.
  - >-
    Repository admission is durable before object publication; immutable object
    keys are digest-qualified, conditional/no-overwrite, and every publication
    is read back and verified. Provider timeout-after-write is reconciled by
    digest; conflicting writes cannot overwrite an existing revision. Append
    admission additionally reserves one source version and binds the winning
    digest, media type, object key, creator, predecessor, and receipt; losing
    concurrent appends are rejected rather than acknowledged. Create and
    append command fingerprints include owner, kind, title, media, creator,
    lineage, expected version, digest, and byte count; publication
    revalidates the winning reservation before acknowledging any existing row.
  - >-
    Cleanup admission records separate delete, retry_cleanup, and
    reconcile_cleanup receipts plus durable cleanup-work status. Owner,
    lifecycle, expected version, and command fingerprint are checked before
    cleanup; recorded outcomes replay without repeating provider operations.
    Reconciliation is read-only: it reads and verifies an existing object and
    settles deletion_failed without deleting it; a missing object proves
    absence and settles deleted. Cleanup work supports
    owner-scoped claim/resume after restart, and replay verifies both
    fingerprint and receipt artifact identity.
  - >-
    SQL listing hydrates current revisions before media filtering and paging;
    tombstone summaries include lineage, integrity, and deletion audit fields.
    Preview responses report the selected revision media type, while encoded
    and malformed markup is decoded, stripped, and escaped into inert text.
    Canonical JSON rejects duplicate keys and non-finite constants.
  - >-
    Artifact persistence and deletion are registered in the production
    MetadataMetrics vocabulary with approved metrics/spans, dependency and
    error dimensions, and no artifact identifiers in trace attributes.
  - >-
    Public Core mutation APIs expose only admission (admit_delete,
    admit_retry_cleanup, and admit_reconcile_cleanup). Provider deletion is
    reachable only from the claim-token-bearing resume worker; synchronous
    service delete/retry/reconcile methods were removed. GeneratedArtifact
    aggregates and transport revisions expose GeneratedArtifactRevision only;
    the storage-key-bearing StoredRevision remains internal to repository and
    provider execution paths.
  - >-
    Cleanup idempotency receipts distinguish the admitted phase from terminal
    settlement outcomes. Claimed retry/reconcile work therefore executes once,
    while terminal receipts replay and stale claim tokens are rejected.
  - >-
    Artifact operation telemetry carries caller-admitted trace context when
    present, fixed 32-hex trace IDs, 16-hex span IDs, parent and bounded link
    IDs, and no disconnected random trace roots. Persistence and deletion
    metrics use the closed operation/outcome/error/dependency dimensions; a
    lifecycle-delivery failure is classified as delivery_failed rather than a
    false success. Operation dimensions remain the exact component span names
    artifact.revision_write and artifact.delete.
  - >-
    Cleanup claims are atomically validated and renewed immediately before
    every provider read/delete. The 180-second lease exceeds the bounded
    provider operation window; settlement still requires the current matching
    token and may complete after that token's lease expires during I/O, while
    a replaced token cannot perform destructive I/O.
  - >-
    Four deterministic metadata-only evaluators are registered in the Core
    generated-artifact facade. Their typed results contain bounded scores,
    closed outcomes, fixture/replay identifiers, and allowlisted counts only;
    payload export never includes bytes, owner identity, object keys, or
    exception text.
