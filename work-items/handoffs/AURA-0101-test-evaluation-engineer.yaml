decisions:
  - >-
    Replaced stale account-info and legacy normal-client ACL assertions with
    identity-scoped checks for the exact current Core JetStream matrix: stream
    info/list/create/update plus five durable/filter consumer pairs. The
    tests reject API/consumer wildcards, deletion/purge access, and obsolete
    normal durable-create grants while preserving the three exact legacy
    durable-create subjects used by evaluation bootstrap.
  - >-
    Added static ACL topology coverage for dispatch and runner identities to
    ensure they receive no Core account, stream-list, or AURA_RUNS consumer
    grants. No broker-backed negative test was added because the bounded
    topology suite already validates the generated identity policy and live
    ACL behavior is owned by the platform/live integration checks.
  - >-
    Added provider doubles that record add, lookup, update, and delete calls
    so tests assert stream reconciliation preserves existing subjects and
    never deletes or reassigns the Core-owned stream.
  - >-
    Covered the bounded lost-create lookup race with an injectable sleep and
    asserted both recovery after delayed visibility and identity preservation
    of the original provider error when visibility never occurs.
  - >-
    Tested malformed subject metadata and differently named stream metadata
    as fail-closed cases with no update or delete mutation.
risks:
