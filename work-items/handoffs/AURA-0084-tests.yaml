  - >-
    Browser and full-stack limitations are recorded as environment/safety
    context, not product assertion failures; no credentials or stack lifecycle
    state were exposed or changed; root-run acceptance closed the latest
    browser assertions.
  - >-
    The e2e fixture deliberately triggers session expiry only after initial
    authentication, so hidden component prefetch cannot consume the failure
    before the intended user action; the root route is used for SPA recovery
    tests because deep links are not served by the disposable web host.
  - >-
    The latest full-stack run reached a terminal Core run with the bounded
    public diagnostic PROVIDER_ERROR, but retained output contained no
    underlying provider exception. Static Compose rendering confirmed both
    Core API and worker point at fixture-chat through the shared external
    aura-e2e-provider network; the runner now captures the provider project's
    bounded logs on failure so the next scoped run can identify any provider
    startup or protocol fault.
  - >-
    Core's worker Settings path does not substitute a test provider:
    run_forever constructs Settings(), whose AURA_OLLAMA_URL and
    AURA_DEFAULT_MODEL aliases resolve the same values used by the established
    external-provider runner; OllamaAdapter is constructed directly from
    config.ollama_url. The worker-side preflight makes this effective
    configuration and network path observable before browser execution.
  - >-
    The armed 401 now invalidates the fixture session itself, preventing a
    concurrent successful auth bootstrap from incorrectly restoring an expired
    browser state.
  - >-
    Chromium host resolution is opt-in and limited to the full-stack config;
    the mocked config receives no resolver arguments. The runner uses the
    internal Docker service alias only to compensate for Chromium's special
    handling of `.localhost`, while retaining the canonical browser origin.
