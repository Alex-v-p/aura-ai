decisions:
  - >-
    Added only test-owned mocked browser coverage: identity outage followed by
    successful retry without a redirect loop, in-session expiry during a
    component-health request with focus/live-region assertions, callback
    marker sanitization, same-origin return-path bounds, and empty browser
