decisions:
  - Added dedicated `evaluation-worker` and `evaluation-scheduler` Dockerfile targets that invoke the existing thin entrypoints without changing contracts or service code.
  - Removed the dispatch NATS credential and evaluation-bus attachment from the regular Observatory telemetry worker; only the dedicated evaluation worker receives that file-backed identity.
  - Kept the scheduler database-only on the private Observatory PostgreSQL network, with no broker, object-store, public port, or Core network access.
  - Added read-only, dropped-capability, no-new-privilege, bounded CPU/memory/PID/file-descriptor/tmpfs controls and import-based health checks to both new deployables.
  - Reused existing encrypted AURA_STATE_ROOT mounts, Compose secrets, NATS dispatch identity, and observatory profile; no persistent state or host ports were added.
  - Applied the disposable local HTTP overlay to both new services while preserving private network membership and existing named-volume behavior.
  - Enabled the evaluation worker and DB-only scheduler's bounded metadata-only component-span OTLP exporter in the production Observatory profile, injecting the existing file-backed ingest credential and adding only the private Collector ingest network. Stable deployment identity remains configuration-provided; the scheduler retains no NATS attachment or dispatch credential.
  - Started the Collector explicitly in the trace-only/full-stack acceptance startup set and waited for its running process; the ClickHouse verification probe receives a scoped read-only password file mount instead of broadening the scheduler's production secret set.
  - Docker Desktop trace-only acceptance confirmed persisted component spans after the Collector startup and probe-secret fixes: both Observatory components, both private dependencies, all required trace operations, and metadata-only privacy fields were observed.
  - Set the pinned Collector's supported service telemetry log level to warn and disabled caller/stacktrace fields through Compose command flags. This removes its info-level token filename and receiver/exporter endpoint diagnostics while retaining warnings/errors and leaving retry and sending-queue configuration unchanged.
  - Extended the project-scoped acceptance with a real Observatory API outage: scheduler telemetry is generated while the API is stopped, Collector output is scanned without endpoint/URL/secret-path allowlists, then API recovery and a second persisted trace verification prove the configured queue/retry path remains functional.
  - Added the pinned Collector 0.138.0 internal Prometheus pull reader on port 8888, bound to 0.0.0.0 only inside the private observatory-ingest network and without host publication. The outage probe asserts bounded trace retry-queue occupancy, queue capacity, and send-attempt count, then asserts queue drain after API recovery; no resource attributes or endpoint data are exported.
  - Routed the pinned Collector's provider diagnostics to `/dev/null` for both normal and error output paths. This is a narrow privacy correction for endpoint and credential-file context in provider messages; private self-telemetry remains enabled for bounded outage evidence, and exporter retry/buffering is unchanged.
  - Set the pinned Collector self-metrics level to `normal`, which retains the required queue size, queue capacity, and batch send-attempt counters while excluding endpoint resource dimensions such as `server_address` and `server_port`.
  - Copied the exact authoritative `contracts/evaluation/v1/` directory into `/app/contracts/evaluation/v1/`, the existing runtime lookup path, so the transport schema and its transitive `evaluation.schema.json` and `failure-codes.schema.json` references are available to every Observatory image target without a generated or duplicated schema.
risks:
  - Health checks validate the dedicated entrypoint import rather than an HTTP endpoint because these worker processes expose no public or internal health server; durable heartbeats remain the application-level liveness signal.
  - The complete matrix remains parent-integration-owned; an earlier full run reached a pre-existing Core evaluation-runner NATS stream-not-found restart after the trace phase. The isolated trace-only path is green and did not require any production network or secret broadening.
  - A later full-matrix attempt was intentionally stopped before the Collector outage phase when the disposable Docker project encountered the known fixed object-storage subnet-overlap startup condition; its scoped Compose cleanup completed with no project containers, networks, volumes, or fixture directory remaining.
  - Suppressed the automatically generated `service.instance.id` through the pinned Collector's supported `service.telemetry.resource.service.instance.id: null` setting. The normal pull reader still permits content-free target_info with only service name/version labels while excluding lifecycle and endpoint dimensions.
