contracts:
  changed: true
  authorship: >-
    Serialized by the assigned contract_steward after AURA-0136 explicitly
    authorized the Aura v1 OpenAPI, automation workflow and notification event
    schemas, run event schema, contract tests, generated client, and mechanical
    version assertions. No Core business behavior was added to schemas or the
    generated transport client.
  compatibility: backward_compatible
  definitions:
    - id: aura-v1
      version: 1.22.0
      source: contracts/openapi/aura-v1.yaml
      changes:
        - >-
          Added owner-scoped manual workflow definitions, editable drafts,
          immutable revisions, manual instance admission, inspection,
          cancellation, closed recovery commands, and seven explicit
          non-cascading deletion resources. Every mutation retains owner
          session, CSRF, UUID idempotency, and optimistic-version semantics.
          Every deletion body requires expectedVersion and every deletion
          operation requires the established UUID Idempotency-Key header.
        - >-
          Added the closed four-kind sequential step catalogue, exact typed
          selector and value/result algebra, one-to-eight-step and one-agent-run
          bounds, fixed tools-disabled and memory-disabled execution limits,
          immutable revision and checkpoint metadata, separated instance,
          terminal, step, effect, completed-effect, and recovery vocabularies.
        - >-
          Evolved Approval, ApprovalDetail, and ApprovalEvent into typed legacy
          reminder and manual-workflow unions. Workflow approvals use null
          legacy run, conversation, and tool-call lineage only with complete
          exact workflow origin and immutable system-derived proposal fields.
        - >-
          Added the workflow notification source and creation command with only
          opaque workflow, revision, instance, step execution, and result
          lineage while preserving reminder and briefing notification shapes.
        - >-
          Added a closed run-lineage union to Run and RunEventBase: ordinary
          records require existing conversation lineage (and Run user-message
          lineage) with workflowOrigin absent; workflow records require null
          conversation lineage (and null Run user-message lineage) with one
          complete exact workflow origin. Mixed origins are invalid.
    - id: automation-workflow-events
      version: 1
      source: contracts/events/automation/v1/workflow-events.schema.json
      changes:
        - >-
          Added closed metadata-only definition, instance, step, reconciliation,
          terminal, and retention lifecycle event variants with bounded ordinals,
          statuses, outcomes, recovery capabilities, versions, timestamps, and
          opaque lineage only.
    - id: automation-notification-events
      version: 1
      source: contracts/events/automation/v1/notification-events.schema.json
      changes:
        - >-
          Additively added delivered and acknowledged workflow-source variants;
          existing reminder and briefing payloads remain accepted unchanged.
    - id: run-events
      version: 1
      source: contracts/events/runs/v1/run-events.schema.json
      changes:
        - >-
          Additively added complete metadata-only workflowOrigin and a closed
          ordinary-or-workflow lineage union to run snapshots and lifecycle
          events; absent and mixed origins are rejected.
  compatibility_notes:
    - >-
      Aura v1 advances additively from 1.21.0 to 1.22.0. Existing reminder,
      briefing, calendar, conversation, ordinary run, approval, and notification
      paths and legacy source variants remain available.
    - >-
      Published workflow revisions are immutable; manual instance admission pins
      one revision. Schedules, triggers, provider selection, expressions,
      templates, loops, branches, parallel execution, recursion, tools, memory,
      dynamic grants, executor concepts, and arbitrary code are unrepresentable.
    - >-
      Workflow lifecycle and notification events contain no workflow values,
      names, instructions, mappings, approval presentation, notification
      content, owner identity, credentials, prompts, responses, or executor state.
    - >-
      The generated TypeScript client is transport-only and contains no
      authorization, transition, retry, persistence, or orchestration behavior.
  producers:
    - Aura Core workflow definition and deterministic state application
    - Aura Core approval application
    - Aura Core notification application
    - Aura Core Run Coordinator
  consumers:
    - Aura Web generated API transport
    - Aura Web approval inbox compatibility consumer
    - Aura Web notification centre compatibility consumer
    - Future AURA-0137 Core workflow execution through public application APIs
    - Future AURA-0138 Aura Web workflow management
    - Core contract, event, migration, and API drift tests
  rollout:
    - >-
      Apply the single forward-only Core 0027 migration, then deploy additive
      Core approval, notification, run-lineage, and workflow-state producers
      before enabling any future AURA-0137 execution producer.
    - >-
      Deploy the regenerated Aura client and typed approval/notification
      consumers with or after Core. Older clients remain compatible because
      legacy union members and operations are preserved.
    - >-
      AURA-0136 exposes contract and deterministic state only. Workflow HTTP
      route implementation, execution orchestration, scheduler, worker, and
      workflow management UI remain disabled and are owned by later work items.
    - >-
      Rollback disables future publication and admission while preserving
      truthful immutable revisions, instances, completed or unknown effects,
      metadata-only events, and manually retained lineage; no automatic rerun
      or reinterpretation is permitted.
  generated_outputs:
    - source: contracts/openapi/aura-v1.yaml
      generator: frontend/libs/platform/aura-api-client/tools/generate-client.mjs
      output: frontend/libs/platform/aura-api-client/src/lib/generated/aura-api.ts
