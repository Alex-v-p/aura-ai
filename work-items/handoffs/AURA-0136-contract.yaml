decisions:
  - >-
    Kept workflow routes contract-only and manual-start-only in this slice. No
    route implementation, schedule resource, trigger, executor, worker, or
    orchestration promise was introduced.
  - >-
    Used closed origin-specific unions instead of weakening legacy approval and
    notification fields globally. A workflow approval cannot omit legacy
    lineage unless its complete typed workflow origin is present.
  - >-
    Kept ordinary run-event envelopes compatible while closing lineage to two
    exact variants: UUID conversation lineage with no workflowOrigin, or null
    conversation lineage with one workflowOrigin containing exactly revision,
    instance, and step-execution identifiers. Run user-message lineage follows
    the same ordinary/non-conversation split.
  - >-
    Represented private values only in authenticated no-store detail resources;
    list summaries, lifecycle events, notification events, and run lineage stay
    content-free.
  - >-
    Encoded resource policy as closed constants and enums while leaving
    transition and authorization business behavior in Core rather than schemas
    or the generated client.
  - >-
    Kept deletion idempotency in the established required UUID
    Idempotency-Key header and optimistic concurrency in each closed deletion
    body as expectedVersion >= 1; no duplicate JSON idempotency field or
    deletion behavior was added.
