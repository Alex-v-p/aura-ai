decisions:
  - >-
    Added a provider-neutral public calendar boundary containing lifecycle projections, bounded
    query validation, event timezone normalization, and deterministic conflict evaluation. The
    boundary has no provider or SQL imports and excludes provider identifiers from public calendar
    metadata.
  - >-
    Added Core-owned SQL mappings and forward-only migration 0024 for owner-scoped connection,
    credential ciphertext metadata, discovered-calendar metadata, explicit selection/version,
    idempotency, revocation state, and content-free audit truth. No event-content table or field
    is created.
  - >-
    Selection replacement uses expected-version concurrency, validates readable discovered UUIDs,
    accepts an explicit empty set, and keeps newly discovered calendars unselected.
  - >-
    Added provider-neutral AttemptStore, CredentialCodec, CursorStore, lifecycle-provider,
    and audit ports. The application boundary now owns ten-minute attempt creation, single-use
    navigation/state/callback consumption, callback exchange handoff, atomic connected commit,
    immediate revocation read-disable, bounded uncertain-revocation retries, credential load with
    compare-and-swap lazy rewrite, opaque cursor wrapping, and content-free lifecycle audit.
  - >-
    Credential key_version is a bounded AURA-0129 string key identifier (VARCHAR(64)) rather than
    an integer generation. The durable envelope stores only ciphertext, nonce, key identifier, and
    associated-data digest; no plaintext or event content is persisted.
  - >-
    Discovery persistence upserts provider metadata behind owner-scoped Aura UUIDs and exposes
    provider-calendar-ID resolution only through the repository port. New rows are never selected
    implicitly; provider IDs remain absent from public DTOs.
  - >-
    Replaced duck-typed discovery results with internal CalendarDiscoveryRecord and
    CalendarDiscoveryPage values. CalendarApplicationService now unwraps a
    CalendarDiscoveryQuery-bound cursor through CalendarCursorStore, calls the provider with only
    server-side continuation state, atomically upserts the page, and wraps the next state before
    returning a public Aura-only projection. Event continuation handles now bind to the query
    without its cursor as well.
  - >-
    Lifecycle start and reauthorization now use owner/operation/key fingerprints and durable
    content-free claims whose transient OAuth attempt must still exist for replay; loss of the
    transient attempt fails closed. Completion checks the exact active callback attempt, passes
    the server-held nonce and PKCE verifier to exchange, and atomically commits credentials with
    its final receipt. Selection mutation and its UUID idempotency receipt are committed in the
    same owner-locked transaction.
  - >-
    Revocation establishes one fixed 24-hour deadline, honors the persisted due time and six
    attempt bound, disables reads before provider dispatch, and atomically records terminal
    status, credential deletion, and content-free audit truth. Each outbound attempt is reserved
    under the locked connection row with an exact attempt number and lease before provider
    dispatch; stale or superseded finalization cannot mutate state. Exhausted or deadline-expired
    uncertain revocation retains REVOCATION_UNCERTAIN as non-connectable recovery truth until a
    future explicit external-revocation acknowledgement exists.
  - >-
    CalendarAuditRow and migration audit storage contain only bounded action, outcome, category,
    and time metadata; raw principal issuer and subject are deliberately absent. Application
    audit calls retain owner only for authorization context and do not pass it to the SQL sink.
  - >-
    Conflict evaluation accepts an injected content-free observer. Its monotonic duration starts
    immediately around local evaluate_conflicts work and excludes provider retrieval, replay, and
    pagination; closed outcomes are emitted without changing domain results, and cancellation is
    propagated.
  - >-
    The disconnect application boundary re-evaluates the persisted attempt count and fixed
    deadline after any repository reservation and before provider dispatch. A legacy repository
    returning a lease for an already terminal state is finalized as failed without an outbound
    call; compatibility-only repositories also delete ciphertext and project terminal uncertainty
    without reopening the connection.
  - >-
    Content-free audit rows retain a chronological occurred_at index named ix_calendar_audit_time;
    no owner identity was restored to the mapping or migration.
  - >-
    Provider credential loading now treats a false compare-and-swap as a concurrent writer win:
    it reloads the owner-bound current envelope, requires the active key identifier, authenticates
    and decrypts only that current envelope, and fails closed when ownership, key freshness, or
    authentication cannot be established. Stale plaintext is never returned.
  - >-
    Authorization navigation now requires the inward attempt-store
    finalize_navigation_attempt(owner, session_id, attempt_id, handle) seam after asynchronous
    provider URL generation. This exact, atomic current-attempt check prevents an older consumed
    attempt from returning a redirect after a newer attempt supersedes it; absence of the seam
    fails closed rather than relying on process-local state.
  - >-
    CalendarRequestContext is now accepted and propagated through discovery, callback token
    exchange, and revocation provider calls. Context checks occur before dispatch and cancellation
    or deadline exceptions are preserved; revocation reservations are finalized as failed before
    re-raising cancellation/deadline failures.
  - >-
    CalendarRequestContext now lives on the public calendar application surface. Internal discovery
    records and cursor state remain private; Core ports, bootstrap composition, and provider adapter
    imports use the public context type without duplicating its definition.
  - >-
    Conflict queries page provider results without persisting event content. Server-only cursor
    state contains only provider continuation, page count, and emitted relationship keys; the
    public relationship cursor is bound to the normalized query and conflict limit. One monotonic
    request context carries deadline and cancellation through every provider page, and provider
    cancellation is never converted into a normal domain failure.
  - >-
    Timed events normalize to UTC while preserving event/display timezone provenance; all-day events
    use half-open local-date intervals. Conflict evaluation excludes free and zero-duration events,
    emits canonical positive-duration relationships once, and bounds output at 200.
  - >-
    Lifecycle attempt-store failures (missing, expired, superseded, replayed, owner, session, and
    dependency failures) fail closed as CalendarAuthorizationRejected. Provider authentication
    failures atomically mark the connection REAUTHORIZATION_REQUIRED with reads disabled before
    returning CalendarNotConnected. Selection idempotency receipts are looked up and replayed
    before expected-version mutation, with deterministic fingerprint conflicts.
  - >-
    Connection availableActions is a closed lifecycle command projection containing only connect,
    complete_connection, reauthorize, or disconnect. Uncertain revocation resumes through
    disconnect; retry and administrator guidance remain recovery metadata, while disabled and
    unavailable states expose no public lifecycle operation.
  - >-
    Registered calendar domain mappings through the existing database metadata composition. Module
    registry entries are shared with the parallel API/provider ownership slice and must be retained
    exactly once during integration.
risks:
  - >-
    The parallel provider/bootstrap/API workers must inject concrete AttemptStore, CursorStore,
    CredentialCodec, and lifecycle-provider implementations into CalendarApplicationService.
    The provider adapter must accept CalendarRequestContext on every retrieval and the bootstrap
    cursor store must fingerprint CalendarConflictQuery in addition to event/discovery queries.
    Bootstrap must also inject the conflict observer and align the revocation reservation/finalize
    port; stale fixtures returning SelectableCalendarPage or expired-less credentials are no
    longer supported.
unresolved:
