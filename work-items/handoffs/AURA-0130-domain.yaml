    stale fixtures before aggregate checks can pass. Bootstrap must implement the atomic
    finalize_navigation_attempt seam, and the provider/bootstrap owners must align request-context
    parameters for discovery, exchange_code, and revoke. The test owner should add CAS-false and
    interleaved-navigation probes. The API owner must change its CalendarRequestContext import from
    calendar.internal to calendar.public to satisfy the aggregate public-boundary validator.
    Bootstrap integration of the observer remains outside this worker's ownership zone.
