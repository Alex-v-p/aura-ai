decisions:
  - >-
    Added a direct cryptography dependency and AES-256-GCM credential envelope
    using fresh 96-bit nonces, opaque string key identifiers from the platform
    CredentialKeyRing, and canonical owner/connection associated data.
    Plaintext credential wrappers reject repr and pickle disclosure.
  - >-
    Credential opening accepts retained decrypt-only keys and exposes an
    owner/connection compare-and-swap seam for lazy re-encryption under the
    active key before provider use; the provider adapter accepts either a
    composed credential loader or an opaque material wrapper and fails closed
    when the inward loader or calendar-id resolver is absent.
  - >-
    Kept the Google adapter on fixed HTTPS OAuth and Calendar endpoints,
    exact read-only scope/callback validation, redirect-free HTTP, bounded
    payloads/pages, cancellation, request deadlines, and bounded retries for
    transient reads only.
  - >-
    Provider payloads are narrowed into neutral calendar/event records and
    closed provider errors; OAuth/token material and upstream diagnostics do
    not cross the adapter boundary.
  - >-
    Registered the provider package and domain public-port dependencies in the
    Core module registry while preserving the concurrently authored calendar
    domain entries.
  - >-
    Registered the calendar internal discovery module with exactly one source
    owner, added the calendar domain self-file relationships, and declared the
    bootstrap, provider, and API route dependencies required by their current
    imports. Existing registry entries were preserved.
  - >-
    Removed the process-local ProviderCursorPort and its encode/decode seam.
    The adapter now accepts and returns only bounded raw provider continuation
    state; application/bootstrap owns the short-lived owner/query-bound Valkey
    handle around that state.
  - >-
    Event continuation state is canonical bounded JSON containing the Aura
    calendar index and UUID plus the page token for that exact calendar.
    Pagination resumes the same calendar before advancing to the next selected
    calendar and never applies a token to another calendar. Discovery now
    returns the domain-internal CalendarDiscoveryPage and
    CalendarDiscoveryRecord values; provider identifiers and continuation state
    remain behind the application/repository projection and never enter public
    DTOs.
  - >-
    OAuth authorization uses the server-held attempt verifier for PKCE S256
    challenges while retaining independent callback nonce/state values. Token
    exchange accepts the domain verifier alias, sends only code_verifier,
    enforces the exact callback URI and read-only scope, and serializes an
    absolute UTC expires_at. Reads reject missing or expired credentials and
    never silently refresh them.
  - >-
    One monotonic request deadline and cancellation callback flow through
    retrieval, streamed response buffering, safe retries, and backoff. HTTP
    responses use httpx streaming contexts, declared and actual body sizes are
    bounded, contexts close on every outcome, and task CancelledError is
    re-raised after metadata-only telemetry.
  - >-
    Provider and event timezone fields are validated with ZoneInfo, missing
    event zones resolve deterministically to the provider/calendar or display
    zone, and the adapter delegates timed and all-day normalization to shared
    calendar domain normalizers.
  - >-
    In-flight connection, response-header, and streamed-body work is wrapped
    in one cancellable budget task. Cancel events and monotonic deadline expiry
    cancel the transport task and close the httpx stream immediately; external
    asyncio.CancelledError remains distinguishable and is re-raised.
  - >-
    JSON, timezone, datetime, and decrypted-credential parse failures leave
    only closed provider or credential errors with no raw payload-bearing
    cause/context chain. Terminal provider telemetry remains classified by
    provider category for the API telemetry adapter to map to approved
    outcome/error-class dimensions; rate-limit and unavailable must not be
    represented solely as retry_class.
  - >-
    Discovery credential loading, OAuth exchange/refresh, and revocation now
    accept the shared CalendarRequestContext, while retaining legacy deadline
    and cancellation keyword seams. All use the same active transport race as
    event retrieval; domain lifecycle/discovery ports must pass that context
    from their owner-scoped operations before integration.
  - >-
    CalendarRequestContext is consumed from the provider-neutral calendar.public
    contract. The provider's calendar.internal dependency remains limited to
    the server-side discovery page and record types; no registry dependency was
    added for the API route's stale internal import.
  - >-
    Successful allow_empty responses, including the provider's 204 revoke,
    now record the same single ok telemetry terminal outcome as JSON responses;
    the ordinary JSON path remains the sole other success emission path.
risks:
  - >-
    The owning bootstrap/domain boundary must supply the configured fixed
    callback URI, credential loader, Aura calendar-id resolver, and transient
    cursor store in the final composition; the adapter fails closed when these
    inward ports are not composed. The domain/API owner must finish the
    final Valkey cursor composition and remove the old bootstrap process-local
    cursor wrapper before integration. The callback application must retain
    the server-held verifier when invoking exchange_code. The API telemetry
    adapter must map provider_rate_limit/provider_unavailable terminal records
    to the approved terminal outcome set while retaining their distinct
    error class and retry_class. The concurrent API route must import
    CalendarRequestContext from calendar.public before module-registry
    validation.
