  definitions:
    - id: observatory-v1
      version: 1.0.0
      source: contracts/openapi/observatory-v1.yaml
      changes:
        - Added cursor and page-size inputs to the existing component catalogue while preserving the existing response fields and their required status.
        - Added optional definitionState and definitionVersions catalogue metadata so old producers remain valid during rolling rollout and observed-only components remain explicit.
        - Added an exact component-version definition resource with bounded owner, category, input/output schema, measurement, evaluator, and dependency metadata.
        - Added a bounded exact-version dependency-topology resource with deterministic ordering, component and provider node kinds, direct and reverse relationships, explicit missing definitions, unavailable versions, availability, and partial-health state.
        - Added optional component-version and point-limit filters to the existing component-health resource.
  compatibility_notes:
    - Existing operation identifiers, paths, request requirements, response properties, and required fields are unchanged.
    - Existing ComponentSummary.versions continues to mean observed deployed versions; definition versions are separate and optional.
    - ComponentSummary.definitionState, ComponentSummary.definitionVersions, and ComponentCollection.nextCursor are optional for compatibility with older observatory-v1 producers.
    - Exact-version definition and topology resources and all supporting schemas are additive; observatory-v1 remains at version 1.0.0.
    - The generated Angular output contains transport types and route descriptors only, with no health classification, topology traversal, pagination, retry, persistence, or presentation behavior.
  producers:
    - Aura Observatory owner-authorized component query API
    - Aura Observatory PostgreSQL component-definition catalogue
    - Aura Observatory ClickHouse observed-health and deployed-version query adapter
  consumers:
    - Observatory Web component catalogue and accessible dependency topology workspace
    - Observatory browser and full-stack acceptance suites
    - Observatory API contract and generated-client validation
  rollout:
    - Apply the service-owned PostgreSQL definition migration and run packaged Observatory manifest synchronization before relying on declared definitions.
    - Deploy the compatible Observatory API producer before or with the regenerated Observatory Web client; older clients ignore additive response fields and do not call new resources.
    - Keep Core and other external components as observed-only until a separately authorized public definition contract exists; do not load their private manifests or tables.
    - Continue deriving deployed versions and aggregate health from ClickHouse observations, while retention deletion preserves PostgreSQL definitions and edges.
    - Keep all catalogue, topology, and health responses owner-authorized, bounded, metadata-only, and excluded from browser persistence.
