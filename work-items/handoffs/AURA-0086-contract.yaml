decisions:
  - Kept contract id observatory-v1 and version 1.0.0 because all resources, parameters, response fields, schemas, and generated types are additive and remove no accepted input or output.
  - Used exact component versions in definition and topology paths so incompatible definitions cannot be collapsed into one unversioned resource.
  - Preserved the existing ComponentSummary.versions field as observed deployed versions and introduced a separate definitionVersions field to keep PostgreSQL definitions distinct from ClickHouse observations.
  - Represented dependencies as either component or provider identifiers because approved Observatory manifests declare both Aura components and infrastructure providers such as PostgreSQL and ClickHouse.
  - Made missing definitions, version mismatch, observed availability, unavailable dependencies, and partial health finite explicit states instead of inferring or inventing relationships.
  - Bounded definition arrays, catalogue pages, topology depth, topology nodes and edges, reverse relationships, health points, identifiers, and version values.
  - Kept generated output transport-only and placed no synchronization, graph traversal, health classification, authorization, or presentation logic in schemas or generated clients.
risks:
