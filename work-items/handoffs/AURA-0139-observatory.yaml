decisions:
  - Added the exact fifteen AURA-0137 workflow measurements to the closed Observatory analytics allowlist and classified all under automation; no scheduler metrics were added.
  - Added a public workflow monitoring query port and a parameterized ClickHouse adapter projection selecting only bounded workflow measurement metadata plus opaque agent-run run/trace correlation fields.
  - Kept aggregate computation in Observatory-owned query code with explicit UTC window and bucket bounds, count-vs-milliseconds unit separation, deterministic failure ordering, newest-first correlation ordering, and finite result caps.
  - Returned explicit freshness, unavailable-signal, partial-reason, scan, series, point, correlation, execution, and storage-limit metadata; storage or execution failures yield bounded partial snapshots and dependency failures remain isolated as service-unavailable responses.
  - Added the owner-authenticated no-store API route without exposing workflow definitions, revisions, instances, steps, lifecycle events, content, owner identity, arbitrary dimensions, or Core state.
  - Used existing query instrumentation and health freshness persistence; no new telemetry contract, migration, Core import, Core database access, manifest copy, command path, or per-instance projection was introduced.
  - Added defensive validation for raw adapter rows so malformed operation/component/error labels are omitted or normalized to unknown before any aggregate or correlation response, even though the ingest contract already rejects them.
  - Added count time-series for all three outcome measurements with deterministic priority under the established 12-series cap; latency and count summaries leave rate fields null because rate is not in the workflow catalogue. Empty telemetry returns empty summary/series arrays while freshness and unavailable signals remain explicit.
  - Added the query-api component span allowlist, manifest trace-only declaration, and parameterized ClickHouse-boundary spans for success/unavailable/validation outcomes without query text or payloads.
  - Aligned the monitoring projection with the AURA-0137 finite production vocabulary: failure operations are workflow.transition, workflow.command, workflow.repository, execute, validate, persist, cancel, settle, and resume; error classes are the bounded authorization/database/database_programming/idempotency/internal/not_found/persistence/serialization/execution/budget/capability/provider_protocol/provider/timeout/validation/conflict set plus unknown. Production-shaped failed wait-resume data is covered explicitly.
  - Added an exact fifteen-measurement binding registry for component and operation pairs. Invalid but schema-valid cross-pairs are discarded before aggregation, preventing lifecycle execute/resume poisoning, latency contamination, failure rows, or false correlations. Wait-command duration explicitly allows both execute and resume, while wait-lag remains resume-only.
  - Kept correlation dimensions separate from failure dimensions per the closed contract: only agent-run duration rows with component aura.automation.workflow_step.agent_run and operation execute can emit run/trace references; lifecycle and failure rows remain dotted operation values.
  - Marked workflow-monitoring query spans with closed operation metadata and excluded only that exact query-api projection from the Observatory adapter's persisted invalidation stream after advancing the cursor across every inspected row, with a query-service defense-in-depth filter. Self-only batches cannot hot-loop, and later Core observations remain deliverable; the public SSE event contract remains unchanged.
