decisions:
  - Run headers use run_started, run_status, and valid run_duration_ms lifecycle telemetry; terminal status is sticky against late non-lifecycle rows.
  - Core's producer spelling `canceled` is normalized to the public Observatory `cancelled` vocabulary in reference and ClickHouse projections and filters.
  - Model headers prefer provider evidence from the run trace or model-routing/model-inference components and do not fall back to provider-less or unrelated background rows after lifecycle evidence exists.
  - Running lifecycle projections leave finishedAt and durationMs unavailable until terminal evidence arrives; they never use later activity as a synthetic finish.
  - Detail headers use the full reference snapshot or ClickHouse inner-window aggregates; only observations and continuation cursors are page-scoped.
  - Production run cursors encode the private latest-observation ordering boundary used by ORDER BY/HAVING, while finishedAt remains the lifecycle field shown to clients.
  - Legacy runs without lifecycle telemetry retain the prior bounded min/max and newest-trace fallback for backward compatibility.
  - Primary lineage prefers the Core run UUID trace and otherwise chooses deterministic earliest lineage when lifecycle evidence exists.
  - Component, deployment, model, and observed-time filters qualify run IDs using countIf/HAVING (or a reference equivalent) while lifecycle headers aggregate every row in the same fenced snapshot; combined terminal status filtering is applied only after that full projection.
  - Production discovery predicates are combined into one countIf conjunction so component, deployment, model, and time filters must be satisfied by the same observation, matching reference `_matches` semantics; lifecycle status remains a separate run-level predicate.
  - All four production trace aggregates (lifecycle, primary, legacy, and compatibility `AS trace_id`) qualify source columns with the `observations` table name so ClickHouse cannot substitute the compatibility alias and raise Code 184; the legacy alias remains for compatibility with existing row fakes.
risks:
