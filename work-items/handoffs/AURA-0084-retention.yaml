decisions:
  - >-
    Encode all adapter-generated ClickHouse DateTime64 literals as UTC
    space-separated millisecond timestamps. This keeps the public RFC3339
    contract unchanged while avoiding parser-sensitive T/Z literals in
    retention cutoffs, bounded query filters, cursors, and component health.
  - >-
    Keep the conversion at the query adapter boundary; stored observations,
    API timestamps, and Core/Observatory contracts remain unchanged.
  - >-
    Compare PostgreSQL UUID receipt identities to VARCHAR retention target
    identities by casting the UUID to text. This preserves the existing
    schema and avoids an implicit operator-resolution failure on populated
    stacks.
  - >-
    Failed durable retention actions become eligible for retry only after a
    fixed five-second delay using the existing completed_at field, preventing
    a failed action from hot-looping while retaining restart recovery.
  - >-
    Receipt keyset and deletion predicates explicitly cast UUID parameters to
    uuid/uuid[] where needed, keeping all PostgreSQL receipt cleanup paths
    schema-consistent without a destructive migration.
