decisions:
  - Workflow state transitions are pure functions; persistence is only a transaction and optimistic-version boundary.
  - Workflow retention uses independent tables and explicit tombstones without database cascades.
  - >-
    Closed per-step result algebra is validated before persistence; agent_run
    failures are never replayable, and the aggregate canonical input/output
    budget is rechecked at the repository save boundary.
  - >-
    Repository owner context is compared under the lock, and all seven
    deletion scopes are distinct with terminal-only instance-scope retention;
    published-revision deletion requires RETIRED status, with a status/scope
    matrix protecting DRAFT and PUBLISHED parity.
  - >-
    Mutating workflow repository commands require an explicit issuer and
    subject, and instance construction/database persistence reject deadlines
    beyond the closed 30-day lifetime.
  - >-
    Retire and all terminal-only deletion paths emit accepted command and
    repository outcomes with bounded lineage metadata, including idempotent
    tombstone replays.
  - >-
    Every deletion scope carries the owner-scoped optimistic version through
    live rows and tombstones; same-key replay returns the original result,
    while payload conflicts and stale versions are rejected under the lock.
  - >-
    Test-only dynamic telemetry kwargs and intentional missing-owner calls use
    narrowly scoped Any casts; production method signatures remain mandatory
    and statically checked.
  - >-
    Migration 0027 now mirrors Core compatibility's closed ordinary-versus-
    workflow run and run-event lineage union, including user-message nullness,
    and adds closed approval status/execution enums alongside the exact legacy
    versus manual-workflow origin branches.
  - SQLAlchemy history and lifecycle metadata attributes are named event_metadata to avoid overriding DeclarativeBase.metadata while preserving the metadata column name.
  - >-
    Revision, instance, and definition tombstone persistence retains the
    optimistic version used by deletion commands, so SQL rows have parity
    with the memory repository's stale-command and replay semantics.
risks:
  - Migration 0027 owns the additive approval origin/proposal columns, workflow notification source union, and conditional run/run-event lineage columns, with legacy-preserving checks and owner-scoped indexes; aggregate PostgreSQL upgrade testing remains a delivery-lead responsibility.
  - The state module deliberately does not expose executor, scheduler, route, provider, or cross-domain calls; AURA-0137 must compose those through public APIs.
  - Tombstoned history, result, and checkpoint deletion now verifies the tombstone owner before returning an idempotent success; foreign owners receive a not-found result and cannot alter retained scopes.
  - The platform telemetry registry owns the finite workflow operation/error vocabularies; the current shared registry exposes workflow.transition, workflow.command, and workflow.repository operations.
  - >-
      Pure transition spans use application_validation as their truthful finite
      dependency; the shared platform registry now accepts it and production
      telemetry tests report zero rejection.
  - >-
    Trace IDs and parent span IDs are explicit WorkflowTraceContext inputs;
    repository instances retain no mutable trace state, so concurrent owners
    cannot cross-parent. Command spans retain the external parent and become
    the exact parent of repository children; transitions share that command
    context when explicitly composed.
