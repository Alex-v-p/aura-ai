decisions:
  - >-
    Added a dedicated memory-only WorkflowMonitoringStore under the Observatory
    feature boundary; it uses only the generated gateway operation, validates
    the closed response at runtime, bounds refreshes, and preserves a stale
    snapshot during reconnect or service failure.
  - >-
    Extended ObservatoryStore with a monotonic metadata-only workflow
    invalidation signal so the feature can coalesce authoritative REST refreshes
    without opening a second SSE connection or carrying analytical payloads.
  - >-
    Added explicit UTC controls, lifecycle and latency summaries, unit-labelled
    charts with adjacent tables, bounded failure breakdowns, and existing
    run/trace correlation inspection actions; workflow content and instances are
    not represented in the UI.
  - >-
    Added Monitor → Workflows navigation and isolated Storybook states for
    healthy, partial/stale, loading, empty, and unavailable monitoring.
  - >-
    Guarded the disconnected-state projection in WorkflowMonitoringStore so a
    closed mocked SSE connection cannot cause an effect self-update loop while
    the first aggregate snapshot is arriving.
  - >-
    Consumed each monotonic workflow invalidation revision once and coalesced
    queued refreshes, preventing repeated effect passes from turning a finite
    invalidation burst into an unbounded REST loop while preserving reconnect
    refresh and session reset behavior.
  - >-
    Added runtime shape guards at the selected-run detail, inspection, and
    trace boundary so malformed empty responses preserve usable metadata and
    never reach run/trace components as unsafe projections.
  - >-
    Added the complete closed recursive monitoring snapshot parser as a pure
    feature helper, including canonical UUID/32-hex trace validation and
    finite bounds, so malformed responses cannot create UI or navigation
    state.
  - >-
    Added all fifteen allowlisted workflow measurements to the existing
    Analytics catalogue, updated the automation focus description, and
      removed the client-side time heuristic for self-observation suppression;
      the stabilized backend source-filters only exact query_api workflow
      monitoring telemetry, so every genuine public observation invalidation
      remains refreshable even after delayed delivery.
  - >-
    Kept stale, partial, unavailable, and disconnected source states explicit
    in the UI; wait lag is labelled P95 (or explicitly average when P95 is
    unavailable), and UTC validation is connected to its accessible error.
  - >-
    Moved the workflow store provider to the application composition root so
    Storybook can inject deterministic fixtures, then added a dedicated
    runtime Storybook config/spec with all five states and accessibility/media
    checks.
  - >-
    Kept successful query state separate from source freshness: unavailable
    freshness with empty arrays renders an explicit empty window, while
    transport failures remain unavailable/stale. Source observed time, lag,
    unavailable signals, and missing aggregate values remain explicit.
  - >-
    Aligned frontend fixtures and closed parsing with the generated workflow
    vocabulary: exactly three lifecycle operations, all nine failure
    operations including wait resume, and all generated error classes including
    timeout, validation, and conflict. Added direct rejection coverage for
    arbitrary operations and error classes while retaining agent-run execute
    correlations.
risks:
