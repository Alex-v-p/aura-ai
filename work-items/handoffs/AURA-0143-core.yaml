  - Source invalidations contain only identifier and version metadata; live and rebuild use a private composition capability and the same public snapshot query.
  - Unknown source snapshots and unavailable research registration never fabricate terminal truth.
  - SQL projection has no cross-domain foreign keys or cascades and upserts only non-regressing source versions.
risks:
  - Integration maintainer must compose task_projection_service into AppState/worker app and register source adapters after AURA-0142 and research source implementations land.
  - Workflow, briefing, document, and memory adapters require global source-owned snapshot enumerators and exact lookup facades; no owner-bound compatibility path or source persistence is imported by Core.
  - Rebuild stale settlement retains authoritative source status/version and records local unknown absence without fabricating source_deleted.
  - Ambiguous command outcomes persist dedupe receipts, disable mutation capabilities, and enqueue bounded reconciliation.
  - Projection capability is an unexported identity minted in task_uow composition and rebound only into source adapters; no module-level singleton or factory remains.
  - Rebuild validates source kind, identity uniqueness, and owner continuity before upsert; invalid items become unknown/reconciliation work.
  - Task invalidation events are staged as full identifier-only envelopes by source transactions through the platform outbox; source versions remain authoritative. Execution does not author source events, and the worker consumes only dedicated durable transport deliveries.
  - Unknown recovery updates projection-local state at the same authoritative source version; source upsert remains strictly newer-only. Rebuild checkpoints persist baseline IDs, seen IDs, cursor, pass, and start fence.
  - Runtime telemetry maps source/repository failures to the approved snapshot_unavailable, storage_unavailable, validation_failed, version_gap, timeout, and unknown classes; only exact operation/outcome/error_class/dependency dimensions are emitted, with deterministic omitted trace lineage when no context is admitted.
  - Metadata SSE replays the durable event source across process boundaries with monotonic event sequences; route authorization and detail lookup remain application-owned.
