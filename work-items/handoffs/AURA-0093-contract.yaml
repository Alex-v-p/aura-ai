  compatibility: backward_compatible
  definitions:
    - id: evaluation-v1
      version: 1
      source: contracts/evaluation/v1/evaluation.schema.json
      changes:
        - >-
          Added one optional closed Case expectations object with independently
          optional exact, schema, retrieval, context, tool, policy,
          groundedness, response, and resource families, so existing Case
          resources remain valid while new deterministic cases can declare
          typed evidence.
        - >-
          Added digest-only exact-field and schema expectations with bounded
          field identities, canonical normalization modes, finite schema
          dialects, and explicit additional-field policy; schema or expected
          payload bytes are not embedded.
        - >-
          Added ranked evidence, cutoffs, relevance grades, citation
          requirements, freshness, irrelevant evidence, required and
          prohibited context, token ceilings, truncation, conflict, and
          injection-handling expectations using opaque fixture-scoped evidence
          identities.
        - >-
          Added declarative expected tool calls, argument schema and optional
          exact argument digests, finite outcomes, side-effect and idempotency
          evidence, prohibited tool identities, and redundant-call ceilings;
          the shape grants no tool or execution authority.
        - >-
          Added finite expected policy decisions, confirmation states,
          sensitive-data handling, consequential-action behavior, and optional
          policy revision evidence without carrying a policy or permission.
        - >-
          Added claim-to-evidence support and citation expectations plus
          deterministic response digest, instruction/style marker, refusal,
          structural property, byte, and token expectations without prompt,
          rubric, response, or judge content.
        - >-
          Added bounded resource expectations for latency, queueing, bytes,
          tokens, memory, provider-call count, concurrency,
          operation count, and throughput with explicit units in field names.
        - >-
          Added optional Suite manual thresholds bound to an exact evaluator
          reference, metric, aggregation, comparison operator, finite value,
          unit, minimum sample size, and missing-evidence policy; the threshold
          cannot promote a baseline or alter execution limits.
        - >-
          Kept every new object closed and every string, number, and collection
          bounded; arbitrary attributes, dynamic configuration, providers,
          endpoints, credentials, object locators, filenames, owner identity,
          executable values, and content-bearing evidence are absent.
        - >-
          Added an expectation-specific metadata identifier grammar and applied
          it to every new evidence, field, call, tool, policy revision, claim,
          instruction, style, and manual-threshold metric identifier. It
          rejects case-insensitive delimited owner, user, identity, credential,
          bearer, token, secret, password, private, content, hash, digest,
          endpoint, URL, URI, path, filename, authentication, session, cookie,
          and object-key segments without changing pre-existing identifiers.
  compatibility_notes:
    - >-
      Case.expectations and Suite.manualThresholds are additive optional
      properties on existing closed v1 resources. All AURA-0089 resources and
      producers that omit them remain valid without transformation.
    - >-
      No existing required field, enum member, bound, conditional branch, or
      resource union variant was removed or narrowed.
    - >-
      Reserved-segment rejection applies only to the optional AURA-0093
      expectation and manual-threshold identifier fields introduced in this
      unreleased work item. Pre-existing SafeIdentifier consumers, Evaluator
      metrics, Score metrics, baseline thresholds, and settled v1 resources
      retain their original grammar.
    - >-
      New AURA-0093 producers may populate the additions immediately, while
      older consumers continue to process existing resources; consumers that
      admit AURA-0093 definitions must reject unknown expectation families,
      unsupported evaluator versions, and malformed nested evidence.
    - >-
      Cross-record reference existence, duplicate semantic identities,
      artifact authorization compatibility, canonical digest calculation,
      evaluator support, and metric-unit compatibility remain consumer
      validation because portable JSON Schema cannot prove them.
    - >-
      evaluation-runner-transport-v1, evaluation-events-v1, production
      telemetry contracts, OpenAPI contracts, and protected repository
      baselines are unchanged.
  producers:
    - >-
      Aura Observatory evaluation-definition application authorized by
