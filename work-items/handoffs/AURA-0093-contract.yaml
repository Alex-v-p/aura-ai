decisions:
  - >-
    Preserved evaluation-v1 rather than introducing v2 because every resource
    change is an optional property and every supporting definition is new;
    no existing valid instance is invalidated.
  - >-
    Used reserved-segment-checked opaque evidence, instruction, style, field,
    call, tool, policy revision, and metric identities plus SHA-256 digests
    instead of embedding expected documents, arguments, responses, schemas,
    policies, prompts, rubrics, filenames, identity metadata, credentials, or
    storage locators in definition metadata.
  - >-
    Kept evaluator configuration out of Case expectations. The contract
    declares evidence and expected outcomes; the service-owned closed registry
    selects reviewed evaluator code by exact Evaluator identity and version.
  - >-
    Bound each manual threshold to an exact EvaluatorReference and explicit
    metric, aggregation, operator, unit, sample floor, and missing-evidence
    policy to avoid ambiguous suite-level numeric maps.
  - >-
    Kept baseline Threshold unchanged because Suite thresholds have stronger
    AURA-0093 provenance and missing-evidence needs, while baseline comparison
    and promotion remain assigned to AURA-0096.
  - >-
    Did not edit the runner transport or lifecycle event schemas: execution
    remains reference-only and content-free, and deterministic scoring consumes
    typed replay projections inside Observatory.
  - >-
    Omitted GPU-specific expectations because GPU monitoring is explicitly
    deferred by the roadmap; the generic bounded resource family does not
    authorize new host or accelerator telemetry.
  - >-
    Did not consult online documentation because dependency-version
    verification was not assigned; the repository already fixes JSON Schema
    2020-12 and the applicable architecture decisions.
risks:
  - >-
    JSON Schema cannot prove digest correctness, ensure semantic identity
    uniqueness across differently shaped objects, verify that evidence IDs
    resolve to the declared fixture version, or compare artifact authorization
    restrictiveness; service admission must enforce those invariants.
  - >-
    The expectation-specific grammar rejects delimited reserved sensitive
    segments but cannot prove that a syntactically safe opaque identifier was
    not derived from private content or owner identity; producers must generate
    and scan identifiers at the service boundary.
  - >-
    Semantic correctness, usefulness, clarity, and other model-judged response
    qualities are deliberately not encoded as deterministic v1 expectations;
    local judge rubrics and calibration remain assigned to AURA-0094.
