    - >-
      Apply the service-owned PostgreSQL definition migration, register the
      closed evaluator inventory, and verify referenced dataset, evaluator,
      component, fixture, and artifact versions before admitting a Suite.
    - >-
      Producers canonicalize digest inputs and persist only identifiers,
      digests, classifications, limits, expectations, and thresholds;
      authorized raw content remains solely behind existing opaque Garage
      artifact references and manual retention.
    - >-
      Enable deterministic scoring only after repeatability, negative,
      malformed, partial-evidence, privacy, migration, and Core-boundary tests
      pass; ordinary Core activity and metadata-only production telemetry
      remain independent.
