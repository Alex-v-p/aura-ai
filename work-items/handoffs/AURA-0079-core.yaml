decisions:
  - Structured container-log export remains the default and continues to work when OTLP is disabled or unavailable.
  - OTLP export uses standard OTLP/HTTP JSON signal envelopes: resourceMetrics to /v1/metrics and resourceSpans to /v1/traces. The default endpoint is a Collector base URL; a configured legacy /v1/observations suffix remains compatible because Core strips signal suffixes and derives the standard routes.
  - Stable observation IDs and metadata-only fields travel as allowlisted aura.* OTLP attributes (aura.observation_id, component/version, operation, metric name, bounded dimensions, and opaque run/conversation IDs) for the platform normalizer to reconstruct telemetry-v1.
  - OTLP export is an independent bounded queue with background transport, bounded retries, exact per-observation drop accounting, and no synchronous Collector dependency.
  - The telemetry manifest distinguishes measurement-ring drop-oldest behavior from full OTLP signal-queue drop-new-signal behavior; export attempts are configurable from 1 to 5 (default 3 total, 2 retries), with exhausted signals counted per observation.
  - Each Measurement receives a UUID observation ID at record time so retry batches remain idempotent at Observatory ingestion.
  - Core serializes only the closed metadata-observation v1 fields; arbitrary trace attributes, content, credentials, endpoints, and owner identity cannot cross the export boundary.
  - Deployment metadata is validated against telemetry-v1 bounds before either structured or OTLP exporter construction; unsupported roles fail closed except the internal migrate role, which maps to cli.
  - API, worker, and scheduler composition derive serviceRole and deployment metadata from Settings.
