decisions:
  - >-
    Admission gating is applied only to publish and start/admission; draft
    creation and read/recovery/retirement/deletion remain available while the
    feature flag is disabled.
  - >-
    Workflow routes translate through the application/repository public seams,
    require owner sessions and CSRF for mutations, and expose metadata-only
    persisted SSE replay with Last-Event-ID handling.
  - >-
    Worker wakeups use the generic identifier-only outbox envelope and a
    dedicated versioned wake topic; private workflow values never enter NATS.
    Admission and every queued continuation stage wake commands transactionally;
    the worker also performs a bounded authoritative restart/due-wait scan.
  - >-
    API and worker use one composition factory. All four handlers, current
    agent policy authority, evidence, metrics, and provider-bound run lineage
    are mandatory bindings; durable Run recovery is bound in both production
    compositions and missing bindings fail readiness.
  - >-
    Workflow creation routes exclusively through the public semantic
    create_draft_command/result port; no transport-generated workflow or
    revision identifier participates in idempotency fingerprints. Retained
    instance-scope deletion authorization uses the domain tombstone-aware
    public lineage port. All deletion scopes now call the parent-aware,
    replayable deletion-receipt seam directly, allowing retries to reach
    domain truth after the live target has been removed.
  - >-
    The module registry explicitly owns all newly composed workflow modules and
    the run-coordinator lineage dependency.
