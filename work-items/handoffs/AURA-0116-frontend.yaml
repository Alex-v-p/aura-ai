decisions:
  - >-
    Selected-run loads now own an in-flight sequence. Live invalidations during
    detail or trace acquisition set one pending bit instead of superseding the
    request, preserving the first visible projection.
  - >-
    The pending bit is consumed only after the active request settles, where a
    single bounded reconciliation timer schedules the trailing latest snapshot.
    Selection changes, sign-out, retention reset, and session invalidation clear
    the pending bit and retain the existing monotonic sequence guards.
  - >-
    A successful response clears reconciliation timers and attempt counts while
    preserving an in-flight invalidation through the finally boundary, so a
    converged first response cannot accidentally drop the trailing refresh.
  - >-
    The selected-run attempt cap is checked before in-flight coalescing. The
    final missing-trace attempt therefore transitions to the existing bounded
    error disclosure instead of leaving the inspector permanently loading.
  - >-
    Live invalidations and projection-gap self-reconciliation use separate
    pending provenance. A live invalidation may set
    selectedRunRefreshPending even during the final allowed attempt, while
    selectedRunRetryPending remains cap-bounded. A successful final attempt
    preserves the live pending bit through completion and schedules exactly
    one trailing refresh; a final missing-trace attempt remains an error.
  - >-
    Existing metadata-only state, transport contracts, Aura Web isolation, and
    browser persistence behavior remain unchanged.
  - >-
    The production ObservatoryStore keeps the standard Angular Injectable
    decorator; no runtime decorator substitution is used, preserving JIT and
    production bootstrap behavior.
