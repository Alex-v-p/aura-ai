decisions:
  - Static and browser retrieval are separate no-credential FastAPI services with independent switches, profile-gated overlay services, and no published ports.
  - Static retrieval uses manual redirect validation, public HTTPS/DNS policy, HTTPX streaming limits, closed MIME allowlist, bounded Trafilatura/plain-text extraction, five-hop and 20-second ceilings, and four-request concurrency.
  - Browser retrieval uses isolated Playwright contexts with disabled downloads, service workers, extensions, device permissions, persistence, media resources, 45-second/8 MiB/256 KiB ceilings, and two-page concurrency; readiness validates the Ed25519 public key, operator enforcement probe, usable Playwright browser directory or operator-provided Chromium executable, and available capacity.
  - Browser redirect and response-limit outcome flags are scoped to a per-fetch state object, preventing concurrent page routes from contaminating each other's bounded outcomes; the concurrent regression fixture covers one rejected and one fulfilled route.
  - Provider request/result models enforce method-to-payload/result discrimination, closed enums, signature shape, replay IDs, bounded limit payloads, and fetch-result evidence shapes from the shared research-provider.v1 schema.
  - Provider services expose signed POST fetch/cancel/limits/health routes and finite content-free error envelopes; public verification keys are mounted read-only and unsigned operation is not supported.
  - The signed versioned SearXNG adapter is folded into the single authorized SearXNG image/container; stock SearXNG binds loopback-only while Core reaches only the adapter listener.
  - Compose uses one distinct private Core-to-provider network per provider plus an operator-provisioned external public-egress network. Providers do not share a private network and no provider has a path to another provider. The signed search adapter is in-process with stock SearXNG, so no fourth deployable or direct stock endpoint is exposed.
  - Stock SearXNG is loopback-only on port 8081; only the signed adapter binds the provider network on port 8080. Browser resource retrieval streams raw bytes through the pinned transport and applies the signed request's wire/decompressed limits before route fulfilment; redirect limits are checked before each connection and permit exactly five hops.
  - Provider readiness no longer treats a policy-file string or the bundled diagnostic checker as enforcement: it requires an operator-supplied attestation executable that emits the exact `aura.research.egress.attested.v1` marker after machine-verifying the authorized dataplane, and fails closed when absent, bundled, or invalid. Core ASGI tests use an explicit temporary test-only stub.
  - Limits are exposed only through signed POST envelopes; request windows require exact `ttlMs` consistency and a maximum 60-second lifetime, and replay caches reject admission at a bounded capacity.
  - All signed fetch, cancel, limits, and health verification paths map replay-capacity/configuration exhaustion to the finite retryable `503 provider_unavailable` envelope; ordinary replay and signature failures remain non-retryable.
  - Runtime controls expose reachable in-process `begin_graceful_drain` and `immediate_stop_now` transitions. Verified `operator_stop` cancellation performs the immediate transition and actively cancels tracked static/browser work; the search adapter exposes the same authenticated transition seam while retaining the closed contract's no-search-cancel method set.
  - Signed request verification precedes disabled-state admission responses, and search-task bookkeeping is cleaned up on cancellation even while queued behind the concurrency semaphore.
  - SearXNG receives its secret only from a read-only operator-mounted file, the stock query is sent as a POST body, adapter access logs are disabled, and provider-only dependencies are installed from generated hash-locked requirements outside the shared project lock.
