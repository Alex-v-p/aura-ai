decisions:
  - >-
    Query observation.changed events now classify as a run invalidation only
    when runId is a canonical UUID accepted by the existing contract. Missing
    or malformed run correlations retain observation/observationId identity,
    and health.changed remains system/null.
  - >-
    The existing closed LiveEvent field set and metadata_only capture policy
    are preserved. No trace, content, or other observation attributes are
    copied into SSE payloads.
  - >-
    The production query projection now carries component_id only as internal
    classification context. Observations emitted by aura.observatory.* retain
    observation/observationId identity even when correlated to a run, which
    prevents run-inspection telemetry from refreshing the inspection again.
    The component context is omitted from the public SSE payload.
