contracts:
  changed: true
  authorship: >-
    Serialized by the assigned contract_steward after AURA-0146 explicitly
    authorized the exact Aura v1, notification-event, compatibility-test, and
    generated-client paths. No concurrent contract author was assigned and no
    business behavior was added to schemas or generated code.
  compatibility: backward_compatible
  definitions:
    - id: aura-v1
      version: 1.22.0
      source: contracts/openapi/aura-v1.yaml
      changes:
        - >-
          Additively added the closed ResearchNotification owner-authorized
          list and detail variant. It contains only notification lifecycle
          metadata and one opaque researchId; owner identity, research content,
          citations, evidence, URLs, artifacts, provider data, and recovery
          detail are unrepresentable.
        - >-
          Additively added the closed ResearchNotificationLifecycleEvent to
          persisted notification lifecycle and SSE unions with only opaque
          identifiers, bounded status, version, and timestamp.
    - id: automation-notification-events
      version: 1
      source: contracts/events/automation/v1/notification-events.schema.json
      changes:
        - >-
          Additively added delivered and acknowledged research-source variants
          with opaque researchId lineage. Existing reminder, briefing, and
          workflow event definitions and union ordering remain unchanged.
  compatibility_notes:
    - >-
      Existing reminder, briefing, and workflow notification REST and event
      variants remain accepted byte-for-byte. The only evolution is appending
      the research variants to the existing closed unions.
    - >-
      Aura v1 remains 1.22.0 and the notification event schema remains v1
      because this is an additive source variant authorized by ADR-0018 and
      AURA-0146; no path, field, or existing variant was removed or weakened.
    - >-
      Consumers performing exhaustive union handling should deploy the
      regenerated client and research variant handling before research
      notification production is enabled.
  producers:
    - Aura Core owner notification application and lifecycle-event publisher
    - Aura Core research completion delivery worker
  consumers:
    - Aura Web notification list and detail consumers
    - Aura Web persisted notification SSE consumer
    - generated Aura TypeScript transport client
    - Aura Core notification event replay and compatibility tests
  rollout:
    - >-
      Deploy the additive Aura API and versioned event contract plus updated
      notification consumers first, then deploy the synchronized Core producer.
      Keep research admission and external providers disabled until their
      separate rollout gates pass.
    - >-
      Enable research notification production only after consumers accept the
      new union member. Rollback stops new research notification publication;
      existing durable notification records and metadata-only lifecycle events
      remain readable and acknowledgeable.
  generated_outputs:
