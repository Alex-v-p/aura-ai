decisions:
  - >-
    Used researchId as the sole source-specific REST and event lineage field.
    It is an opaque UUID and requires an independently owner-authorized
    research API lookup for all private or actionable detail.
  - >-
    Reused the existing notification delivered and acknowledged statuses and
    event types. The contract describes transport shape only; delivery order,
    authorization, idempotency, acknowledgement, deletion fencing, and retry
    behavior remain in Core.
  - >-
    Preserved every existing notification variant and adjusted only legacy
    assertions that encoded the former union ceiling. The compatibility tests
    continue checking the exact reminder, briefing, and workflow shapes.
  - >-
    Kept generated output transport-only. It contains the new discriminable
    structural variants and operation response types without authorization,
    persistence, notification, retry, or feature-state logic.
