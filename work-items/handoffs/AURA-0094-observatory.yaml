decisions:
  - >-
    New local-judge definitions are strict and independently identify the
    evaluator and calibration; nullable database columns are retained only to
    read legacy rows without synthesizing missing execution authority.
  - >-
    Canonical budget equality is structural and exact across admitted
    definitions, durable qualifications, and referenced calibration results;
    incomplete or differently shaped budgets remain advisory.
  - PostgreSQL 0010 creates calibration definition/result base tables before
    any provenance ALTER and adds durable qualification calibration_id; the
    migration remains fresh/upgrade/exact-rerun idempotent by construction.
  - Production qualification never uses evaluation result_id as calibration
    provenance. It resolves full immutable scope, loads the referenced result,
    and compares all model, evaluator, artifact, seed, budget, calibration,
    and result fields before enabling calibrated output.
  - Ensemble admission requires strict complete durable qualification scope;
    partial or caller-asserted in-memory projections remain advisory.
  - controlled_replay is valid only for evaluation input artifacts; prompt,
    rubric, and human-review comment purpose matrices remain fail closed.
  - Local-work/calibration PostgreSQL failures, split metadata/Garage reads,
    local-judge ClickHouse writes, per-work trace context, and shutdown flush
    are explicitly instrumented with bounded labels.
  - Closed contract-shaped projections now exist for local judge definitions,
    labels, reviews, calibration results, qualifications, and scores without
    changing evaluation-v1; absent required provenance fails closed.
  - Every evaluation-v1 timestamp emitted by the AURA-0094 production
    projections is normalized from an aware UTC value to canonical `Z` form;
    naive and non-UTC timestamps are rejected before serialization.
  - Ruff and Pyright pass. The full Observatory suite is 999 passed, 12
    skipped, 2 legacy ensemble failures. Live PostgreSQL 17 was not run because
    the image is absent and pulling it would require unauthorized network use.
  - Local Ollama uses one fixed configured origin, no proxy or redirects, non-streaming JSON output, zero temperature, a contract-pinned integer seed in 0..2147483647, bounded context/output, and exact digest verification from GET /api/tags.
  - Artifact reads join existing Observatory PostgreSQL metadata with an internally derived Garage key and verify status, revocation, digest, media, and byte bounds before ephemeral use.
  - Judge outputs are advisory or inconclusive until a separate exact-version owner qualification exists; ensembles reject missing, inconclusive, or unqualified members.
  - PostgreSQL migration 0010 persists only opaque artifact identifiers, hashes, finite labels, budgets, versions, and audit state; no raw evaluation bytes or provider locations are stored.
  - ClickHouse migration 0007 adds the bounded local-judge provenance columns to the existing content-free score table; no content or provider location is stored.
  - No contract, Core, API, CLI, SSE, frontend, deploy, or test files were changed in this worker slice.
  - Ensembles now return inconclusive for missing, duplicate, zero/unobserved, advisory, inconclusive, unqualified, or version-incompatible members; only calibrated, finite members may produce an aggregate.
  - Qualification telemetry uses the bounded qualified/revoked outcomes; revoked qualifications are persisted as advisory-only and audited without persisting owner identity.
  - Local Ollama admission now requires exactly one inventory entry with a
    case-sensitive exact configured model name (including its tag/version) and
    exact SHA-256 digest. Missing names, aliases, case drift, duplicate names,
    malformed entries, and digest-only matches fail closed before artifact
    reads with bounded content-free codes.
  - Provider transport now uses GET /api/tags and POST /api/chat, exact
    bounded JSON projections, bounded chunked reads, suppressed provider
    exception causes, and a literal deployment-owned origin allowlist.
  - Local-judge definitions and evaluation scores preserve seed, budget,
    artifact, model, calibration, disposition, qualification, uncertainty,
    disagreement, and fingerprint provenance; calibration agreement uses the
    inclusive 0.10 score tolerance and ensemble weights are integer ppm.
  - PostgreSQL claims use INSERT RETURNING ownership, conflict-safe fingerprints,
    stale-claim recovery, and restart-safe completion; duplicate judge requests remain recoverable;
    calibration claims/results and qualification revocation are durable and
    content-free, with revocation audit records.
  - Authorized artifact reads enforce the configured byte ceiling again after
    the object-store port returns, so a misleading or missing Content-Length
    cannot cause oversized content to reach the provider.
  - Judge request and outcome metrics normalize provider timeout/unavailable
    outcomes to bounded metric labels while retaining provider_timeout as the
    finite component-span error code and provider failure label.
  - Artifact intended-use persistence now uses the authoritative evaluation-v1
    values prompt, rubric, input, and comment.
  - Definition and calibration result round trips preserve independent artifact
    bindings, prompt/rubric versions, model provenance, budget, seed, and
    content-free calibration scope.
  - The worker now has a bounded optional local-work claim/complete path that
    invokes the composed judge or calibration service without changing normal
    runner readiness when that repository capability is absent.  PostgreSQL
    leases are now concrete `claim_local_work`, `complete_local_work`, and
    `fail_local_work` operations; JSON judge projections are decoded only from
    bounded artifact-reference/definition metadata.
  - Label, review, qualification, and revocation authorization joins now bind
    the durable owner action to the exact resource and record fingerprint;
    qualification requires durable idempotency and owner authorization.
  - The qualification and calibration result repositories validate and retain
    all admitted model, artifact, seed, budget, threshold, disposition, and
    provenance fields; conflicting `ON CONFLICT` reuse is compared against
    persisted fingerprints/JSON before returning.
  - Qualification lookup is durable in production and local-judge score
    disposition is calibrated-enabled only for an active exact qualification;
    ensemble admission requires persisted Qualification objects, never boolean
    caller hints.
  - Durable calibration_result_id is distinct from the evaluated result_id;
    the latter is never used as qualification provenance.
  - Contract-shaped mappings are explicit closed projections and fail closed
    when required provenance is absent rather than synthesizing IDs or
    digests.
  - Local work now has a bounded LocalWorkAdmission projection.  Production
    PostgreSQL derives judge work from persisted admitted jobs, evaluator
    definitions, judge definitions, attempts, and artifact metadata; pending
    calibration definitions are materialized separately.  Work is inserted
    with immutable fingerprint comparison and idempotency keys, then the
    existing lease/claim/complete/fail worker path consumes it.
  - Judge enqueue now requires prompt and rubric references from the persisted
    definition, joins both against authoritative Observatory artifact and
    authorization metadata, compares version/digest/media/purpose/context/
    retention fields, and fails closed when any join is missing or mismatched.
  - PostgreSQL migration 0010 widens the qualification action-mode column
    before backfilling the contract value manual_owner_action. This preserves
    existing values without truncation and makes fresh, upgraded, and exact
    rerun paths safe on PostgreSQL 17.
