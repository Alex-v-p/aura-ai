decisions:
  - >-
    Kept the integration disabled by default and made Google client secrets and
    the versioned credential key ring API-only mounted files; plaintext secret
    settings are rejected even when disabled.
  - >-
    Fixed authorization, token, revocation, Calendar API, read-only scope, and
    callback path constants in the platform module. No runtime endpoint,
    discovery document, redirect, or scope override is accepted.
  - >-
    Enforced exact stable HTTPS production origins and the explicit
    http://aura.localhost:4200 development overlay only. Callback values are
    origin-derived and reject credentials, query, fragment, path, and
    alternate-port variants.
  - >-
    Added a bounded JSON key ring with one active 32-byte key, up to seven
    retained decrypt-only keys, safe unique identifiers, duplicate-member
    rejection, and repr-safe key material. The policy records AES-256-GCM,
    fresh 96-bit nonces, owner/connection associated data, and key versions;
    cryptographic use and persistence remain AURA-0130 scope.
  - >-
    Added the two calendar secret mounts only to aura-core-api through the
    explicit google-calendar.yaml opt-in overlay. Existing Core general
    egress remains unchanged; no worker, scheduler, migration, browser,
    evaluation, or Observatory receives calendar secret material.
  - >-
    Replaced secret-bearing dataclasses with immutable opaque wrappers that
    reject pickle and copy protocols; dataclasses.asdict cannot traverse or
    expose their secret fields. Key bytes remain available only through the
    narrow key_bytes adapter property.
  - >-
    Configured SettingsConfigDict with hide_input_in_errors=True while
    preserving the existing environment prefix, extra-field, and field-name
    behavior so rejected secret inputs, client identifiers, and secret paths
    remain absent from Pydantic validation error representations.
  - >-
    Changed file loading to descriptor-level O_RDONLY, O_NOFOLLOW and
    O_CLOEXEC (when available), fstat regular-file validation, bounded reads,
    and no lstat/open TOCTOU. Group/other write bits are rejected while
    Compose-mounted 0444/0644 files remain valid; local placeholder policy is
    independent and remains 0600.
  - >-
    Removed Calendar secret environment values, mounts, and secret definitions
    from the base Compose stack. deploy/compose/google-calendar.yaml is the
    explicit API-only enabled=true opt-in overlay; base and local-http remain
    disabled without Calendar secret files.
  - >-
    Callback origin validation rejects controls and all whitespace and requires
    the canonical origin string to equal the configured input exactly. Key-ring
    version validation requires an actual integer value of 1, not a boolean.
  - >-
    Baseline evidence at parent checkpoint 99e497b records two unrelated
    Pyright errors in test_aura0125_idle_memory_telemetry.py and one unrelated
    Garage topology substring assertion. The revised AURA-0129 checks target
    the assigned source/test files and focused topology nodes, so no baseline
    code or test was changed or waived here. The local HTTP Compose check uses
    the required compose.yaml, local-identity.yaml, local-http.yaml order.
