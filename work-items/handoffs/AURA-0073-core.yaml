decisions:
  - Document composition selects qwen3-embedding:4b by default and passes the only supported 768 dimension only to the document Ollama adapter; settings reject other dimensions because persistence is vector(768).
  - Memory composition continues constructing its Ollama embedding adapter without a dimension override.
  - Ollama artifact identity remains fail-closed on an exact inventory tag and verified digest; wrong-dimensional vectors are rejected before persistence.
  - Retrieval carries the query's verified model ID, optional revision, and digest into both repository adapters; incompatible vectors are excluded while lexical matches remain eligible.
  - Repository search returns an internal metadata-only result so the service can mark document.search degraded with bounded identity_mismatch classification when incompatible vectors are present; API search hits remain the unchanged public list shape.
  - Retrieval telemetry uses the production MetadataMetrics allowlist for identity_mismatch; regression coverage proves the correlated search span and duration metric are retained with zero rejects and no filenames, excerpts, document text, or model digests.
  - SQL identity-mismatch detection uses a LIMIT 1 existence probe scoped to the owner and ready documents; it never performs an unbounded count.
  - The deterministic Compose provider now requires qwen3-embedding:4b with dimensions=768, matching the production document request.
risks:
  - The live host must have the exact qwen3-embedding:4b tag installed in Ollama; qwen3-embedding:latest is intentionally not accepted as a substitute.
