decisions:
  - Used the existing generated observatory-v1 client operations through ObservatoryStore; no transport or generated-client code was duplicated or changed.
  - Kept catalogue definitions and dependency topology in an in-memory owning-domain selection signal. Authenticated API responses are not written to localStorage, sessionStorage, IndexedDB, URL parameters, or service-worker caches.
  - Requested bounded dependency depth 2 and max_nodes 100, and rendered the complete semantic table plus direct/reverse lists as the non-visual topology alternative.
  - Rendered unknown observed components as explicit observed-only entries and never synthesized owner, schema, evaluator, dependency, URL, or markup values.
  - Added explicit loading, empty, stale, partial, unavailable, malformed/absent-definition, retry, and observed-only copy with text and symbols in addition to status colour.
  - Preserved existing component trend and health behavior while adding version selection and detail retrieval only after an explicit keyboard-reachable action.
  - Applied responsive narrow-layout overflow containment, visible focus styling, and prefers-reduced-motion handling within the Observatory feature boundary.
  - Added a dedicated latest-request gate for component definitions/topology; close, logout, retention refresh, and superseding selections invalidate the gate before any late response can publish or trigger focus.
  - Partial retries preserve the last valid definition/topology half while re-requesting both bounded resources; a failed or malformed resource remains explicitly partial and exposes a keyboard-operable Retry details action.
  - Added closed-shape runtime parsers at the feature boundary. Required strings, finite health numbers, finite enums, nested arrays, and topology bounds are validated before template access; malformed fulfilled JSON becomes partial/error state and is never rendered as trusted metadata.
  - A partial retry re-requests both resources while retaining the previously valid half; the failed or malformed half remains explicit and the retry is a native button with a visible recovery path.
  - Component health summaries include an explicit error-rate text value so operational errors remain discoverable without relying on colour or status badges.
  - Trend visualizations keep accessible labels on the child img bars and remove prohibited aria-label usage from the generic wrapper, satisfying axe aria-prohibited-attr rules.
  - Catalogues preserve explicit declared metadata while absent definitionState remains observed-only; malformed fixtures are rejected at the intended detail parser boundary.
  - Disconnected live transport takes precedence over stale REST/catalogue data in the connection status, while stale resource copy remains visible in its owning panel.
  - Associated each definition opener with the detail panel through aria-controls/aria-expanded, focused the programmatically focusable detail heading only after successful or partial load, and restored focus to the exact opener on close.
  - Made the dependency table a named, focusable scroll region with ArrowLeft/ArrowRight/PageUp/PageDown keyboard scrolling and explicit focus styling.
  - Rendered dependency sample count, error rate, p95 latency, and a text outcome state; null outcome data uses an informational symbol and neutral styling.
  - Treated absent definitionState as observed-only and exposed detail actions only for explicit declared metadata. Replaced the broad detail live region with a concise status-only announcement and added structural loading cards.
  - Preserved the last successful component/deployment catalogue in the owning store when a later refresh fails; the resource is marked stale/disconnected while cached cards remain available for recovery. Cache is cleared on logout/reset and retention refresh.
  - Made health acceptance assert the semantic Samples definition (fixture value 4) rather than a page-wide ambiguous numeral, and scoped declared-definition assertions to the named component article.
  - Removed the unnecessary narrowed optional chain from declared-version rendering to keep Angular template diagnostics clean.
  - The stale/disconnected browser scenario now waits for a real initial declared catalogue response, enables the fixture failure transition, invokes Refresh catalogue, and verifies cached query_api data remains alongside stale and disconnected notices; it does not seed browser storage.
  - Stale catalogue notices are supplemental to cached cards. A pure componentCatalogueViewFor decision keeps data visible for stale resources with items and uses empty recovery copy only when no cached items exist; the store unit suite covers both branches.
  - Observed-only acceptance scopes status, missing-definition, and no-outcome assertions to the scheduler and long-identifier articles, avoiding ambiguous global text matches while retaining both observed-only representations.
  - Added a bounded availability presentation mapper so transport values observed, unobserved, and unavailable render as Observed, Unobserved, and Unavailable; unknown values fail closed to Unavailable. Unit coverage protects the mapping.
  - Topology edge presentation now resolves nodes by the pair (dependencyId, targetVersion), including strict null-to-null matching for provider/unconstrained targets; it no longer reuses the first same-id node across versions. Unit coverage and a multi-version mocked browser scenario cover distinct availability and health values.
  - The multi-version browser fixture now marks its catalogue entry as declared, matching the dependency response and ensuring the regression exercises the production detail table rather than an observed-only card.
