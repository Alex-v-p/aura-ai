decisions:
  - The JSON Schema is the transport source of truth; runtime validation models and migrations must follow its camelCase wire names without embedding business behavior in the contract.
  - observationId, runId, and conversationId are canonical UUIDs, while traceId and span IDs use W3C/OpenTelemetry lowercase hexadecimal widths.
  - Trace lineage is optional for metrics because the existing Core Measurement contract permits untraced measurements; span observations require both traceId and spanId.
  - Dimensions use a fixed eleven-key allowlist compatible with current Core metadata labels instead of arbitrary attribute maps.
  - The Collector is a routing boundary, not an originating serviceRole; the admitted roles are api, worker, scheduler, and cli.
risks:
