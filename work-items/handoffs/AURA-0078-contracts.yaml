      changes:
        - Added a closed JSON Schema 2020-12 envelope for content-free operational metrics and spans.
        - Added stable observation UUIDs, bounded timestamps, component identity, operation and numeric measurement metadata, a fixed dimension allowlist, OpenTelemetry trace topology, opaque run correlation, deployment metadata, originating service role, and a metadata_only capture constant.
        - Rejected undeclared and sensitive fields at every object boundary; bounded names, values, collections, identifiers, and numeric measurements prevent free-form or non-finite telemetry.
  compatibility_notes:
    - This is a new v1 contract and does not tighten or replace an existing telemetry payload contract.
    - Metric observations may omit trace lineage to preserve compatibility with Core measurements that are not attached to a trace.
    - Span observations require a 32-hex OpenTelemetry trace identifier and a 16-hex span identifier; correlation identifiers remain canonical UUIDs.
    - Additive optional properties may be introduced compatibly within v1 only when they remain metadata-only; new required fields, widened capture policy, or newly admitted sensitive data require a new contract version and authorization.
