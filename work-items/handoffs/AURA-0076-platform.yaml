decisions:
  - ChatMessage gained an additive image_parts tuple with a compatibility images property; existing text-only producers remain unchanged.
  - Provider-neutral image parts carry only an allowlisted media type and bounded normalized bytes; filenames, EXIF, object keys, and attachment identifiers do not cross the model port.
  - Ollama maps provider spellings such as multimodal, image, and visual to canonical vision, and serializes bytes only into native base64 images fields for plain, tool, and title/synthesis requests.
  - Vision verification force-refreshes provider inventory and requires both provider digest and revision before accepting an advertised vision capability; the cache key includes model identity, digest, revision, and capability.
  - PillowImageInspector is content-free at its error boundary and enforces the 25 MB, 40 megapixel, static PNG/JPEG/WebP, and 2048-pixel derivative limits.
  - PillowImageInspector now directly implements the attachment ImageInspector inward port; its richer provider result remains compatible with Core's bounded InspectedImage shape.
  - The module registry was extended for artifacts.attachments and all Core import dependencies introduced by the concurrent attachment implementation.
  - Pillow is an explicit locked runtime dependency so production attachment composition can inject the bounded decoder-backed inspector.
