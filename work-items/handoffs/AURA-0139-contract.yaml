decisions:
  - >-
    Preserved observatory-v1 at version 1.0.0 because the new GET operation,
    schemas, operation descriptor, and analytics enum values are additive and
    all existing paths and schemas remain unchanged.
  - >-
    Used the established 24-hour default, 31-day UTC maximum, 12-series,
    200-points-per-series, 50-breakdown, 1,000,000-row, and 5,000-millisecond
    limits, adding only the separately approved cap of 25 recent correlations.
  - >-
    Discriminated outcome series as count and latency series as milliseconds so
    generated consumers cannot combine incompatible units. The twelve latency
    summaries remain distinct by their closed metric name.
  - >-
    Restricted run/trace references to the workflow agent-run measurement and
    existing opaque run and trace identifier formats, with the exact
    aura.automation.workflow_step.agent_run component and execute operation.
    Other missing correlation is represented only by the closed
    run_trace_correlation unavailable signal.
  - >-
    Added workflow-specific component, failure-operation, correlation-operation,
    outcome, and production error-class types at the public contract boundary.
    Generic Observatory ComponentId, OperationName, Outcome, and DimensionValue
    schemas remain unchanged for backward compatibility and unrelated APIs.
    Lifecycle outcome counts accept only workflow.transition, workflow.command,
    and workflow.repository. Failure rows additionally admit the finite execute,
    validate, resume, persist, cancel, and settle operations, while correlations remain
    restricted to agent-run plus execute. Error classes include only the
    stabilized seventeen production buckets, including timeout, validation,
    and conflict.
  - >-
    Kept workflow business behavior out of schemas and generated code. The
    contract describes transport bounds, metadata vocabulary, and privacy
    exclusions; query aggregation and ordering remain service-owned behavior.
risks:
  - >-
    Adding values to AnalyticsMetricName is additive for the OpenAPI contract,
    but handwritten exhaustive consumers must accept unknown future catalogue
    values. The generated TypeScript union is synchronized in this change.
