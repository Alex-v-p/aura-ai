decisions:
  - >-
    Workflow approvals use complete opaque manual-workflow lineage and null
    legacy run/conversation/tool-call identifiers. Every memory decision,
    expiry, cancellation, status reconstruction, replay, and event preserves
    the typed origin; SQL workflow decisions and expiry emit identifier-only
    governance approval events and never resume a legacy conversation run.
  - >-
    CreateWorkflowApproval accepts only the five closed system-derived
    next-step/consequence/fixed-copy triples, NFC-normalizes bounded inert
    display labels, validates opaque owner/workspace scopes, requires an
    instance deadline, and rejects expiry beyond seven days or that deadline.
    Repository idempotency fingerprints include the complete immutable
    proposal and timing fields.
  - >-
    Workflow notifications use an owner-scoped opaque source and UUID result
    identity throughout public commands, source DTOs, repositories, and
    persistence. Source-neutral idempotency, owner/cursor authorization,
    acknowledgement, replay, and metadata-only payloads preserve legacy
    behavior without private workflow content.
  - >-
    Runs and run events enforce a closed ordinary-or-workflow lineage union:
    ordinary records require conversation and user-message lineage with no
    workflow origin; workflow records require null conversation lineage and
    all five exact workflow fields. Ordinary payloads omit workflowOrigin.
  - >-
    Deterministic approval and notification evaluators now exercise workflow
    creation, durable cursor replay, owner/foreign authorization, duplicate
    idempotent delivery, decisions/acknowledgement, expiry, and private
    content absence while retaining reminder and briefing fixtures.
risks:
