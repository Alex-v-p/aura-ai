decisions:
  - Kept the Core slice contract-only and changed no Core source, migrations, entrypoints, runtime provider, NATS configuration, deployment, or tests.
  - Required a separately authenticated versioned Request resource in addition to the content-free requested event. The event carries lifecycle correlation and provenance, but cannot by itself describe the execution references needed by Core; Core must not solve that gap by reading Observatory tables.
  - Made request/provenance/version agreement, exact component/model/reproducibility binding, bounded limits, deadlines, cancellation races, and service-generated UUID-only idempotency explicit consumer responsibilities while leaving transport and runtime selection to AURA-0091/AURA-0092.
  - Preserved the Core public execution boundary: a future runner invokes exact deployed components through public Core application ports and does not import Observatory or another domain's persistence/adapters.
  - Treated evaluation content as inert untrusted data and preserved metadata-only production telemetry; content-bearing evaluation data cannot enter durable lifecycle events or ordinary Core telemetry.
  - Required Core to preserve missing-evidence outcomes: when a score is not_observed or not_applicable, it must not synthesize or forward a value or outcome.
  - Required authorization-strength checks for every resolved content artifact: metadata_only and hashed cases/replays cannot carry artifact references, content-bearing references must be non-empty, and an artifact authorization must be at least as restrictive as its enclosing resource.
  - Used the finite failure-code taxonomy and opaque artifact/result identifiers so provider diagnostics, exception text, endpoints, credentials, object keys, and private content cannot leak through the result/event boundary.
  - Did not consult online documentation because this compatibility audit is governed by the repository's pinned contracts and accepted ADRs and introduces no dependency or protocol implementation.
risks:
  - AURA-0091 must define the authenticated request-delivery envelope and its Core inward port without placing raw content in lifecycle events or choosing an unapproved cross-service database dependency; an implementation that only consumes evaluation.requested cannot execute the referenced request.
  - JSON Schema cannot prove cross-resource equality, digest recomputation, identifier non-reuse, deadline ordering, or semantic scanning of untrusted content. The Core consumer and producer must enforce these invariants fail-closed.
  - JSON Schema cannot compare capture-policy restrictiveness across separately resolved artifact records; the Core runner must verify the artifact authorization before consuming a content reference and reject a weaker or missing authorization.
  - The contract permits full_content only for explicitly authorized controlled evaluation. A future runner must keep that data path separate from production run state and metadata-only telemetry, with bounded memory, deadlines, cancellation, and artifact references.
  - Core and Observatory may deliver lifecycle messages at least once and out of order. AURA-0091/AURA-0092 must persist or otherwise coordinate idempotency and terminal-state races without making NATS the source of business truth.
