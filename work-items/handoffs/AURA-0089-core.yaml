    - id: evaluation-v1
      version: 1
      source: contracts/evaluation/v1/evaluation.schema.json
      consumer_boundary:
        - A future Core runner accepts a separately authenticated Request resource and the correlated requested lifecycle event; it must not read Observatory storage or import Observatory modules.
        - Request references and execution provenance are treated as an exact immutable execution description. The consumer validates schema version, request/version and provenance agreement, UUID correlation, idempotency, UTC deadline, and all execution limits before dispatch.
        - ComponentBinding, ModelBinding, and Reproducibility are checked against the exact deployed Core public execution ports and configured runtime identity. A mismatch is rejected with a bounded failure classification; no provider endpoint, credential, path, or arbitrary request field is selected from the payload.
        - Any case content obtained through a later approved evaluation boundary remains inert untrusted data. It cannot grant instructions, permissions, policy changes, provider selection, endpoints, credentials, object keys, executable paths, or execution authority.
        - Results are emitted through the versioned result contract and contain only identifiers, bounded status/failure classifications, provenance, score identifiers, and opaque artifact references. Raw inputs, outputs, prompts, tool data, credentials, and diagnostics never enter lifecycle events, telemetry, logs, or ordinary Core run events.
    - id: evaluation-events-v1
      version: 1
      source: contracts/events/evaluation/v1/evaluation-events.schema.json
      consumer_boundary:
        - The Core consumer accepts only evaluation.requested as a dispatch signal and handles evaluation.completed, evaluation.cancelled, and evaluation.failed as content-free lifecycle evidence; it never treats an event as a command to mutate Core production state.
        - All event and provenance identifiers are validated as bounded UUID/version values, eventType is an exact closed value, schemaVersion is dispatched explicitly, and requestVersion/requestDigest/dataset/suite provenance is matched to the separately received Request resource.
        - Stable event, correlation, causation, request, job, attempt, and idempotency identifiers are used for idempotent processing and bounded retry/recovery. Duplicate delivery is acknowledged without re-executing a request.
        - Requested deadlines and maxAttempts are enforced by deterministic runner policy; cancellation and deadline races resolve through an atomic Core-owned state transition, with one bounded terminal result classification.
        - Lifecycle payloads are closed and content-free. The consumer rejects unknown fields, raw content, prompt/rubric/comment/exception text, credentials, endpoints, provider object keys, filenames, owner identity, arbitrary attributes, and hidden reasoning before dispatch or publication.
    - id: evaluation-failure-codes-v1
      version: 1
      source: contracts/evaluation/v1/failure-codes.schema.json
      consumer_boundary:
        - Core maps internal and provider failures to exactly one finite provider-neutral code before producing a failed result or evaluation.failed event; exception text, provider diagnostics, payload excerpts, credentials, endpoints, and content-derived codes are never published.
        - The consumer rejects unknown failure codes and requires failureCode only for failed results; completed and cancelled results must not carry one.
  rollout:
    - AURA-0091 may add the controlled Core runner and its transport adapter only after defining its own public inward ports and authenticated versioned request envelope; this handoff does not select NATS subjects, streams, storage, provider, or runtime implementation.
