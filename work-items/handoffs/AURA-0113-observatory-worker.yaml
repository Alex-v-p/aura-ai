decisions:
  - Kept settlement logic inside the production query adapter; no undeclared adapter-to-adapter dependency was added.
  - Encoded the exact captured ingest sequence in the existing retention-target phase column (`receipt:<sequence>`), avoiding a migration while distinguishing a late same-ID receipt.
  - Encoded captured legacy NULL-sequence membership as the closed `receipt:null` phase; deletion matches that marker only while the current receipt sequence remains NULL, while visibility settlement continues to exclude NULL sequences.
  - Called settlement before target receipt deletion in the existing projection-deleted phase, keeping target settlement, receipt deletion, watermark update, and the durable receipts_deleted phase transition in one transaction; rollback therefore leaves all four unchanged on failure.
  - Kept visibility ledger rows rather than deleting them so a crash after the transaction commit is restart-safe and idempotent.
  - Repeated bounded watermark advancement in the same transaction until the complete contiguous tail converges or the bounded pass budget is reached; an exceptional larger tail remains eligible for the next reconciliation pass, including tails larger than 1024 slots.
  - Replaced per-sequence advancement with bounded set-based PostgreSQL tail scans (65,536 generated slots per pass, at most 16 passes per retention transaction), preserving pending/absent-gap fences while bounding lock duration and clearing a 147k tail immediately; later reconciliation continues an exceptional larger tail.
  - Recovery checks persisted target_receipt_count against receipt:* marker coverage and fails closed for legacy targeted rows whose immutable membership cannot be proven.
  - Preserved ordinary AURA-0108 missing-receipt behavior: reconciliation remains pending/redeliverable and no timeout or outage-based gap skipping was introduced.
  - Added focused regressions for targeted-versus-pending fences, contiguous targeted/health-visible advancement, and idempotent retry behavior.
  - Added a content-free bounded settlement phase signal using stable component/version, operation, dependency, outcome, error code, duration, and action correlation outside metric labels; no metric or public API contract changed.
  - No public contract, migration, Core, Aura Web, frontend, deployment, dependency, metric, evaluator, baseline, or capture-policy change.
risks:
  - The shared checkout contains unrelated later migration and full-stack harness changes; full-suite failures remain outside this ownership slice and no forbidden paths were altered to mask them.
  - Legacy target rows using the pre-AURA-0113 `targeted` phase are handled conservatively: they are not treated as exact receipt snapshots, so recovery cannot delete a late same-ID receipt without the sequence marker.
  - Legacy in-flight actions with incomplete receipt marker coverage fail with a bounded retention-invariant error and remain in projection_deleted for operator recovery; no migration is introduced.
