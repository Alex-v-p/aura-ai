decisions:
  - >-
    Added an optional DAILY_CALENDAR_AGENDA projection token so Today can render
    server-projected events and conflicts without importing calendar transport,
    lifecycle, or store internals. The shell adapts the integrations-calendar
    public CalendarStore projection at composition time.
  - >-
    Added a bounded chronological agenda with timezone/date context, all-day
    before timed rows, text source labels, cross-timezone provenance, and
    server-returned conflict explanations. Existing reminder, notification,
    approval, and conversation sections remain independently rendered.
  - >-
    Added /integrations and /integrations/calendar routes and an accessible
    Connect navigation group while preserving existing route and mobile focus
    behavior.
  - >-
    Started the optional calendar projection from Today exactly once per
    CalendarStore reset epoch. This triggers connection, discovery, and
    connected agenda hydration without creating a refresh loop; a session reset
    permits the next authenticated Today mount to start a fresh epoch.
  - >-
    Calendar conflict presentation matches the server-returned relationship by
    compound calendarId/eventId identity and inverts only directional
    contains/contained_by relationships for the right endpoint; no overlap or
    conflict inference is performed in the browser.
  - >-
    Today tracks rows by compound calendar/event identity, renders every
    server-returned conflict, presents half-open multi-day ranges through the
    final included date, and uses wrapping warning tokens for narrow and 200%
    reflow.
  - >-
    The Connect navigation link targets /integrations with descendant-active
    semantics, while the collection card remains the explicit entry to
    /integrations/calendar.
  - >-
    Added intrinsic sizing guards, narrow-screen heading stacking, and
    anywhere-wrapping for agenda titles and timezone provenance so private
    event text remains readable without horizontal overflow at mobile width or
    200% zoom.
  - >-
    The rendered overflow source was the routed DailyActionPageComponent host:
    it is a flex item inside the shell main content and retained an automatic
    min-content width despite the inner agenda wrapping. The host and agenda
    root now explicitly use width: 100% and min-width: 0, while the existing
    Playwright scrollWidth/clientWidth assertion remains the end-to-end
    regression.
  - >-
    At the narrow effective viewport used by mobile and 200% zoom, every Today
    section heading now stacks its action link below the heading content. The
    link itself has min-width: 0, max-width: 100%, anywhere wrapping, and a
    2.75rem minimum height; at the narrow breakpoint it stretches to the
    section width, preserving the full label and 44px operability without
    allowing section controls to widen the document.
risks:
