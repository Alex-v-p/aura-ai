decisions:
  - >-
    Stable deployment names are subject aura.runs.evidence.v1, JetStream stream
    AURA_RUN_EVIDENCE, durable consumer aura-observatory-run-evidence, private
    network aura-run-evidence-bus, and Garage bucket aura-observatory-run-evidence.
  - >-
    Core and the Observatory worker share only the private broker segment; the
    API receives no NATS attachment and uses a distinct Garage identity.
  - >-
    The worker Garage identity is write-only and the API identity is read/write
    because Garage's write capability is required for durable object deletion;
    both identities are denied owner access and are fail-closed on unexpected
    grants or bucket reuse.
  - >-
    Runtime environment names follow the landed Observatory Settings fields:
    NATS_DURABLE, OBJECT_ACCESS_KEY_FILE, OBJECT_SECRET_KEY_FILE, and
    MAX_ENVELOPE_BYTES. Role-specific env names remain only as host secret-file
    configuration so worker and API credentials stay separate.
  - >-
    Core capture policy is forwarded only as an explicit owner-controlled
    Compose setting. The tracked example leaves it empty, while the capture
    revision defaults to full-content-v1; no deployment silently enables
    full-content capture.
  - >-
    JetStream bootstrap reconciles stream and consumer settings and exits on
    drift; transport retention and size limits are bounded and ACK permissions
    are limited to the dedicated durable consumer.
  - >-
    The aligned wire-envelope ceiling is 1,500,000 bytes, while producer
    evidence bytes remain bounded at 1,048,576 bytes. Compose, Observatory
    worker/API settings, and the NATS stream use the envelope ceiling so a
    valid maximum evidence item survives JSON envelope overhead.
  - >-
    A direct Core serializer fixture with exactly 1,048,576 decoded text
    attachment bytes and the maximum legal display name produced a 1,399,474
    byte envelope; 1,500,000 leaves bounded headroom without raising the
    decoded evidence limit.
  - >-
    Run-evidence stream provisioning uses the separate
    aura-run-evidence-bootstrap identity and secret; the evaluation bootstrap
    identity no longer receives run-evidence JetStream administration grants.
    The normal Core identity explicitly denies evidence-subject subscription.
