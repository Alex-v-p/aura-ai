decisions:
  - >-
    Used one transport schema and one fixture manifest so Core, search, static,
    and browser consumers cannot drift into independently authored wire types.
  - >-
    Signed only Core request envelopes. Provider responses are correlated on
    the isolated inbound network and never require a provider signing secret;
    providers receive only the public verification key.
  - >-
    Used Ed25519 with RFC 8785 canonical JSON and unpadded base64url signature
    representation to avoid algorithm and serialization ambiguity while
    leaving key rotation and cryptographic operations in Core/provider code.
  - >-
    Kept query, target, candidate labels, and extracted text only in the
    bounded operation payloads that require them. Errors, health, and limits
    contain no content-derived or target-derived diagnostic field.
  - >-
    Kept destination policy independent of URI syntax. A syntactically valid
    HTTPS URL is never proof of public routing, DNS safety, redirect safety,
    admission, or authorization.
  - >-
    Represented expiry, replay, and signature failures as schema-valid
    semantic fixture cases because JSON Schema cannot consult a clock, replay
    store, or public verification key.
  - >-
    Did not consult online documentation because dependency-version
    verification was not assigned; JSON Schema 2020-12 and provider bounds are
    fixed by the accepted repository ADR and design.
risks:
  - >-
    JSON Schema maxLength counts Unicode code points, not encoded UTF-8 bytes;
    every producer and consumer must separately enforce the declared
    extractedUtf8Bytes maximum over canonical UTF-8 bytes.
  - >-
    Schema patterns cannot establish public-address safety. Core and providers
    must independently reject encoded aliases, mixed answers, rebinding,
    prohibited IPv4/IPv6 ranges, metadata names, redirects, and connection
    drift after DNS validation.
  - >-
    Core and provider DTOs are separately owned generated-by-hand mappings and
    can drift from this schema in future changes. The shared positive and
    negative fixtures must remain mandatory in every consumer suite; the
    aggregate aligned consumer run currently passes all 33 cases.
