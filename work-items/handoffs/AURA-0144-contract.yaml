contracts:
  changed: true
  authorship: >-
    Serialized by the assigned contract_steward as the sole author of the new
    research-provider transport v1 root and shared conformance fixture set.
    Concurrent Core and Platform workers were consumers only; no OpenAPI,
    event, generated-client, runtime, deployment, dependency, or registry path
    was edited by this ownership slice.
  definitions:
    - id: research-provider-transport
      version: 1
      source: contracts/providers/research/v1/research-provider-transport.schema.json
      changes:
        - >-
          Added one closed JSON Schema 2020-12 union for request, result, and
          error envelopes across search, static fetch, browser fetch,
          cancellation, effective limits, and health operations.
        - >-
          Required short-lived request envelopes to carry exact
          research-provider.v1 identity, opaque request and replay UUIDs,
          finite audience and method, issued and expiry timestamps, a maximum
          sixty-second TTL, and a detached Ed25519 signature with a bounded
          key identifier.
        - >-
          Bound search to fifteen seconds and twenty candidates; static fetch
          to twenty seconds, five redirects, eight MiB transferred and
          decompressed bytes, and 256 KiB extracted UTF-8; and browser fetch
          to forty-five seconds, five redirects, eight MiB response bytes, and
          256 KiB extracted UTF-8.
        - >-
          Added closed reported limit profiles for SearXNG, static fetch, and
          browser fetch with the exact ADR-0018 CPU, memory, PID, temporary
          storage, and concurrency ceilings. Audience and reported limit
          profile are structurally bound.
        - >-
          Restricted targets to syntactically bounded HTTPS URLs without
          userinfo or non-443 ports while explicitly retaining independent
          DNS, address, redirect, and connection validation as a consumer
          obligation rather than destination authorization by schema.
        - >-
          Added bounded search candidates, successful and inadequate fetch
          results, sanitized extracted evidence, cancellation outcomes,
          truthful finite health states, and content-free finite errors.
        - >-
          Prohibited arbitrary properties, diagnostic messages, exception
          text, query or target echo in errors and health, browser state,
          credentials, owner identity, grants, policy, instructions, task/run
          authority, object locators, and arbitrary provider diagnostics.
    - id: research-provider-conformance
      version: 1
      source: contracts/providers/research/v1/conformance-fixtures.json
      changes:
        - >-
          Added consumer-neutral positive fixtures for search, static fetch,
          browser fetch, evidence result, health, limits, and bounded error
          payloads.
        - >-
          Added structural rejection fixtures for missing contract identity,
          wrong method/payload binding, limits above the authorized envelope,
          and content-derived error diagnostics.
        - >-
          Added schema-valid semantic rejection fixtures for expiry, replay,
          and failed signature verification so Core and every provider test
          the same transport and runtime validation boundary.
  compatibility: backward_compatible
  compatibility_notes:
    - >-
      Both identifiers are new v1 contract roots. No previously accepted
      OpenAPI, event, generated-client, or provider payload is modified.
    - >-
      All objects are closed and every method, audience, status, outcome,
      media type, extraction method, and error is finite; additions require an
      explicit compatible contract revision.
    - >-
      Portable JSON Schema cannot verify signature bytes, compare timestamps,
      establish clock freshness, remember replay identifiers, prove UTF-8 byte
      length from character length, revalidate DNS, or authorize a public
      destination. Producers and consumers must enforce those semantic
      invariants before use.
  producers:
    - >-
      Aura Core research provider clients produce signed request envelopes for
      SearXNG, static fetch, browser fetch, cancellation, limits, and health.
    - >-
      The isolated SearXNG, static HTTPX/Trafilatura, and browser Playwright
      providers produce correlated result or bounded error envelopes.
  consumers:
    - >-
      Aura Core research provider clients validate every correlated result and
      error before exposing untrusted evidence to later application use cases.
    - >-
      The isolated SearXNG, static-fetch, and browser-fetch provider listeners
      validate contract version, audience, method, bounds, signature, expiry,
      and replay semantics before dispatch.
    - >-
      AURA-0144 contract, Core client, provider, hostile-network, privacy, and
      resource-limit tests consume the shared conformance fixtures.
  rollout:
    - >-
      Ship the new v1 schema and fixture set before enabling any provider
      listener or Core dispatch. Reject unknown versions, fields, methods,
      audiences, signatures, expiry, replay, and limit profiles fail-closed.
    - >-
      Deploy providers with search, static fetch, browser fetch, and admission
      independently disabled; use only the public verification key at provider
      boundaries and retain the signing key in Core.
    - >-
      Enable static transport only after conformance, destination-policy,
      sandbox, privacy, health, and limit tests pass. Enable browser transport
      separately after its hostile-page and ephemeral-state acceptance passes.
    - >-
      Rollback rejects new dispatch while preserving the additive contract and
      allowing admitted calls to settle or return bounded interruption/error
      outcomes; providers own no research lifecycle truth.
  generated_outputs: []
  notes: >-
    The schema defines data shape, finite vocabularies, correlation, and hard
    upper bounds only. Signature verification, replay storage, destination
    policy, cancellation effects, readiness truth, extraction, provider
    dispatch, research lifecycle, persistence, and authorization remain in
    their owning runtime implementations. No business behavior or generated
    browser client was added.
