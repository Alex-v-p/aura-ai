decisions:
  - >-
    Housekeeping contexts mark successful internal memory.list and memory.model.get discovery
    reads as quiet while preserving the database calls and emitting all failures.
  - >-
    Empty maintenance sweeps do not emit a success summary; lifecycle transitions and changed-sweep
    telemetry remain observable, while discovery failures emit one bounded memory.error event.
  - >-
    A durable retryable processing settlement is marked transport-settled in the application
    result so JetStream acknowledges the identifier wakeup; PostgreSQL available_at remains the
    retry clock and a transient or non-durable result still NAKs.
  - >-
    Housekeeping receives the already-composed activity emitter only after the run-event publisher
    exists; a due processing claim emits one deterministic terminal activity after completion or
    failure, while the emitter remains non-blocking for Core execution.
  - >-
    Empty claim-next success is quiet only when no job is returned; real claims and all failures
    remain observable. Housekeeping owner and reindex discovery spans use fresh child spans under
    the per-pass trace rather than deterministic owner-derived roots.
  - >-
    Memory activity publication checks the authoritative durable run-event store by deterministic
    event id before recording success telemetry, retaining the optional publisher contains seam
    for compatible doubles; redelivery delivery counts suppress repeated queued admission without
    changing public ports or schema.
  - >-
    Housekeeping keeps suppress_idle_success bounded to discovery and claim calls. Claimed
    processing and embedding work use fresh linked non-suppressing child contexts so model/list
    successes remain visible, while terminal activity accepts the safe direct MemoryCandidate
    shape returned by reconciliation and reports authoritative created identifiers.
  - >-
    Durable event-lookup failures share the publication error boundary with publisher failures:
    each produces one bounded persistence error span and one error outcome, is re-raised, and
    cannot produce a success event or success telemetry.
risks:
  - >-
    Persistent event adapters without the public event lookup seam still rely on their durable
    event-id idempotency; the worker does not alter the RunEventPort contract.
