decisions:
  - PostgreSQL is authoritative for jobs, attempts, schedules, leases, receipts, audits, and outbox rows; NATS is transport only.
  - Scheduled occurrences require a persisted, schema-validated authorized request template. Materialization copies its target, provenance, capture authorization, and limits, changing only deterministic occurrence identifiers and deadline; no scheduler component/provenance is fabricated.
  - Requested retry outbox rows are publishable only when both their outbox due time and authoritative attempt next-attempt time have elapsed.
  - PostgreSQL outbox claims use an EXISTS attempt fence rather than an outer join, so FOR UPDATE SKIP LOCKED locks only authoritative outbox rows and remains valid when an attempt row is absent or nullable.
  - A result received at or after the stored deadline atomically settles queued/running state to deadline before inserting an out-of-order receipt; it cannot win a settlement race.
  - Admission uses a deterministic job and initial-attempt identity and inserts the initial outbox entry in the same database transaction.
  - Result acknowledgements are performed only after durable application or bounded rejection; duplicate and late terminal results cannot reopen state.
  - Runner request digests are computed from the exact canonical closed transport data projection consumed by Core, with producer/consumer regression coverage preventing wrapped-admission fingerprints.
  - The application scheduler atomically materializes deterministic schedule occurrences into a job, initial attempt, lifecycle audit, and transactional outbox row before advancing the schedule; the scheduler entrypoint remains DB-only and does not publish.
  - The protected Observatory manifest-surface test now explicitly describes the two authorized AURA-0092 orchestration and scheduler components and their declared metrics.
  - The dedicated worker supervises result consumption alongside dispatch/outbox polling and performs bounded result-consumer shutdown before closing NATS.
  - The dedicated worker and DB-only scheduler catch provider failures at loop boundaries, emit only finite failure codes and dependency outcomes, and recover on a bounded poll interval without logging exception/provider text.
  - PostgreSQL admission uses an idempotency-key conflict-safe insert followed by locked re-read, so concurrent identical requests converge while fingerprint conflicts remain closed; duplicate result receipts return `duplicate` without changing stored terminal state.
  - Result receipt insertion also uses message-id conflict-safe insertion, covering concurrent redelivery after the initial receipt lookup without introducing a second terminal transition.
  - Result consumption reuses the bootstrap-provisioned `AURA_EVALUATION_RUNNER` stream and `aura-evaluation-dispatch` durable explicitly, avoiding NATS stream-name discovery and unauthorized consumer creation.
  - Retry state is bounded and persisted with deterministic capped exponential backoff; only the contract-approved transient failure classes are eligible and each retry creates a durable attempt and outbox row transactionally.
  - Evaluation transport validation is an exact local equivalent of the versioned runner schema, including all nested required fields, types, enums, bounds, and capture conditionals; only case identifiers are unique and artifact reference arrays preserve contract semantics. Only the validated data projection is fingerprinted and persisted.
  - The transactional outbox is the sole publication path. Claims are exclusive leases with due times, capped retry/exhaustion state, and stale requested commands are made ineligible after cancellation/deadline.
  - Result binding verifies every stored common identifier, lineage field, request digest, capture authorization, provenance/component binding, effective limits, and deadline before receipt persistence; duplicate delivery returns an explicit duplicate disposition without reapplying terminal state.
  - Admission and schedule validation compare every duplicated request column (request version, dataset/suite/evaluator references, capture classification, deadline, and max attempts) against the validated envelope projection before fingerprinting or persistence. Effective result limits retain the exact contract shape and may only be deployment-clamped downward.
  - Durable worker leases persist backlog, unpublished-outbox count/age, and result-lag snapshots, while bounded metrics expose heartbeat, backlog, outbox age, result lag, and operation latency without lifecycle or content identifiers.
  - Corrected the PostgreSQL stale-request fencing update in `claim_outbox` to use a scoped `stale` CTE; the target-table alias is no longer referenced from a JOIN condition where PostgreSQL rejects it, while row locking and lease selection remain transactional.
  - Nullable outbox lease parameters are explicitly cast as `uuid` with `IS NOT DISTINCT FROM`, preserving exact-row fencing for both leased and unleased calls without PostgreSQL indeterminate-parameter errors.
  - Human-readable worker and scheduler identifiers remain bounded stable component identities; heartbeat lease tokens are deterministic UUID-shaped database identities, and settings validate both process IDs before composition.
  - Terminal result lineage follows the Core transport convention: correlationId remains the job workflow id while causationId references the concrete runner request/attempt message id; result binding requires that stored lineage exactly.
  - Bounded terminal-envelope or binding rejections remain content-free, acknowledge only after the rejection disposition is emitted through the allowlisted result-consumption metric and safe reason log, while repository/storage failures still propagate without acknowledgement.
  - The scheduler composition does not construct a broker transport or read NATS credentials.
  - Application orchestration publishes inward dispatch intents through a transport port; NATS subjects, stream names, and connection details remain provider-side. Worker and scheduler metric writes use the existing bounded PostgreSQL metric persistence path with replacement semantics for gauges and bounded shutdown flushing.
  - Provider-neutral runner codec, digest, and exact schema validation now live in the application boundary; the NATS adapter imports those symbols inward while retaining all subjects, stream, durable, and connection handling.
  - PostgreSQL metric persistence preserves the declared AURA-0092 names and types, including terminal/dependency counters and operation/result-lag histograms. Heartbeat age is derived from persisted lease timestamps during metric scrape rather than persisted as a constant zero.
  - Component spans are bounded metadata-only records with stable component/version/deployment, finite operation/dependency/outcome/error values, and no lifecycle, user, or content identifiers.
  - NATS connection, publish, pull-subscribe, fetch, and acknowledgement operations use bounded timeouts and finite reconnect attempts. Provider callbacks and worker boundaries emit sanitized codes only; pending outbox rows return to durable failure marking instead of waiting on client reconnect.
  - Result-consumer restart supervision is independent of the recovery/dispatch/outbox loop: a failed or normally-ended inbound task is classified and replaced, then the same bounded iteration still recovers state, marks failed publications, updates heartbeats, and waits for the next poll.
  - Metric-persistence diagnostics retain bounded finite failure codes and rate-limit repeated warning logs, preventing outage-driven recursive warning noise while preserving durable failure counters when PostgreSQL is available.
  - Admission, cancellation, and schedule materialization now write each initial outbox row's `next_publish_at` from the operation's explicit UTC timestamp instead of relying on PostgreSQL `CURRENT_TIMESTAMP`; this keeps claim eligibility deterministic when database and worker clocks differ and preserves the transactional outbox boundary.
  - Forward migration 0008 widens fixed metric label columns to bounded `VARCHAR(64)` values before installing the AURA-0092 allowlist, accommodating valid operation labels such as `schedule_materialize` without permitting arbitrary cardinality.
  - Provider `CancelledError` is treated as a transport failure for the leased outbox row: the failure transition runs in a shielded repository task, releases the lease and increments bounded attempts before cancellation is re-raised; metric failures are swallowed at the orchestration boundary so they cannot strand authoritative state.
  - PostgreSQL counter/histogram metric persistence now aligns nine data parameters with nine `VALUES` placeholders before `CURRENT_TIMESTAMP`; gauges retain their separate seven-parameter replacement path. Regression coverage checks exact cursor arity and both metric types.
  - PostgreSQL terminal result application now inserts exactly one content-free lifecycle audit for each directly applied completed, cancelled, or non-retryable failed terminal result in the same transaction as the receipt and state transition; retryable failures retain only the retry-scheduled audit.
  - Terminal metrics distinguish retry scheduling from terminal completion, and deadline/cancellation transitions increment the terminal counter exactly once. Publish spans report failed transport attempts, while database failures in dispatch, recovery, heartbeat, result application, and outbox state transitions are classified as PostgreSQL with finite diagnostics.
  - Persisted metric scraping bounds each allowlisted metric family independently (64 series per family) rather than hiding later AURA-0092 families behind a global limit, retaining bounded query work.
  - Result delivery is an explicit ports-owned typed abstraction containing the validated envelope and async acknowledgement capability; NATS owns acknowledgement implementation and application code acknowledges only after durable apply or bounded rejection, with no hidden envelope callback key.
  - The accepted Observatory trace boundary uses an inward metrics span/exporter port and an authorized Observatory adapter provider that talks to the Collector; the bounded OTLP export is the cross-process trace correlation path, with no Core import or new SDK dependency.
  - Added the repository-authorized OTLP trace export provider in `adapters.evaluation_orchestration`, following Core's pinned metadata-only JSON OTLP shape without importing Core or adding a dependency. The inward metrics module retains only domain-safe span data and the exporter port; composition explicitly wires the provider. Component spans are queued asynchronously with bounded capacity/retries/drops, stable configured resource identity, finite operation/dependency/outcome/error attributes, Collector bearer credentials from the injected ingest secret, and bounded shutdown draining.
  - Observatory OTLP trace export is opt-in through the existing settings/composition seam (`telemetry_otlp_enabled`, endpoint, queue, attempts, timeout); the platform deployment remains responsible for injecting the enabled flag and stable deployment metadata into each Observatory deployable. The module registry now records composition's dependency on the provider adapter.
  - Corrected the module registry to declare every direct application edge: composition depends on evaluation orchestration, metrics, ports, and the provider adapter; the evaluation worker depends on orchestration, transport, and settings; the DB-only scheduler depends on settings in addition to composition.
  - Corrected the OTLP trace provider to emit the existing Observatory adapter's closed observation projection: UUID-stable observation IDs, required component/operation/metric/capture attributes, `aura.dimension.*` outcome/dependency/status mapping, Core-compatible resource identity, v2 schema URL, and bounded span timestamps/status. Direct normalization through `traces_to_observations` and `MetadataObservation.from_payload` now verifies the exported payload is accepted before transport ingestion.
  - Completed the OTLP failure-span dimension mapping by emitting the finite `span.error_code` as `aura.dimension.error_class`, which normalizes to the contract's `errorClass` dimension and allows the NATS outage trace proof to distinguish `transport_unavailable` without arbitrary attributes.
  - Result application now returns an atomic `ResultApplication` record. A late result that settles queued/running work to deadline reports that authoritative transition exactly once; duplicate or already-terminal deliveries remain plain out-of-order/duplicate dispositions and cannot increment deadline or terminal counters again. Both in-memory and PostgreSQL paths fence succeeded, failed, cancelled, and deadline jobs before retry or terminal work.
  - PostgreSQL cancellation now inserts the accepted `evaluation.cancelled` lifecycle audit in the same transaction as the winning state transition. In a cancellation/result race, the winner owns exactly one terminal audit and the loser cannot add a second; adapter read models normalize database UUID values to bounded strings.
  - Validation failures are recorded at the contract boundary with no dependency attribution. Scheduler heartbeat dependency failures are emitted by the application service and suppressed at the entrypoint boundary to preserve exactly-once dependency outcome accounting.
  - The scheduler manifest declares the dependency-outcome counter and operation-duration histogram emitted by scheduler materialization/heartbeat spans, with bounded operation/outcome metric attributes; the protected manifest-surface expectation was updated accordingly.
  - No public API, CLI, SSE, browser, dataset, evaluator, judge, baseline, Core import, or contract change was introduced.
