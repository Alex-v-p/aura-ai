decisions:
  - >-
    ClickHouse 25.8 requests use HTTP Basic Auth and retain only the database
    query parameter. The CLI fails closed if the HTTP client cannot accept
    explicit Basic Auth; it never downgrades to a username query parameter.
  - >-
    Migration files are split and posted sequentially with quote/comment-aware
    parsing, preserving statement order and allowing failure-safe retries.
  - >-
    Migration ledger reads and FORMAT clauses are sent in SQL bodies rather
    than as removed ClickHouse HTTP pseudo-parameters.
  - >-
    Legacy ordering backfill uses a transient Join lookup and synchronous
    mutation, rebuilding and dropping the helper on each rerun for recovery
    from the pre-25.8 helper shape.
  - >-
    AURA-0082 ownership_zones now names the exact Observatory implementation,
    migration, and regression-test paths and their responsible roles while
    preserving the platform zones.
