decisions:
  - >-
    Added a standalone Observatory Analytics feature component and registered it
    in the existing application composition shell; no Aura product feature
    library or shared UI product code was imported.
  - >-
    Analytics state and request generations live in ObservatoryStore. REST
    snapshots and metric catalogues remain memory-only, are refreshed through
    the generated transport client, and are invalidated with bounded SSE
    refresh coordination.
  - >-
    The UI exposes all six declared focus areas, bounded UTC time controls,
    allowlisted metric/unit/aggregation/grouping/bucket controls, explicit
    freshness/partial/unavailable semantics, and no synthesized values for
    missing measurements.
  - >-
    Every visual series has a semantically equivalent scrollable table with
    units, sample counts, availability, exact point labels, non-colour status
    labels, visible keyboard focus, and reduced-motion-safe styles.
  - >-
    Retention invalidates in-flight analytics responses and clears the deleted
    snapshot before requesting a fresh bounded aggregate; logout/reset clears
    analytics state and filters.
  - >-
    Added mocked browser fixtures for the generated analytics resources and
    acceptance coverage for focused views, semantic chart tables, unavailable
    recovery, responsive layouts, dark theme, and browser-storage/URL privacy.
  - >-
    Strengthened the app dark-theme selector to avoid stale light tokens after
    an in-session prefers-color-scheme change exposed by the accessibility run.
  - >-
    Derived metric, aggregation, grouping, and focus options from the selected
    catalogue definition; deterministic validation now resets unsupported
    combinations before transport and leaves rejected responses recoverable.
  - >-
    Standardized analytics summary, table, and freshness times to explicit UTC
    rendering; chart previews are decorative and exact values remain in the
    adjacent keyboard-accessible semantic tables.
  - >-
    Added a disconnected analytics state that preserves cached snapshots,
    announces stream loss, and clears after bounded reconnect refresh; existing
    retention/session generations prevent stale responses from being restored.
  - >-
    Added defensive snapshot parsing and mocked coverage for malformed,
    rejected, sparse, partial, stale, disconnected, and unavailable responses,
    all six focused analytics views, catalogue option transitions, privacy,
    keyboard focus, and responsive state handling.
  - >-
    Replaced per-point chart buttons with a bounded decorative trend preview
    marked aria-hidden; exact values remain in adjacent semantic tables, so a
    200-point or multi-series response adds no point-level tab stops or shared
    live-region announcements.
  - >-
    Added mocked multi-series and 200-point fixtures plus assertions for table
    and series association, bounded focusability, long identifiers, dark and
    reduced-motion preferences, and 200%/400% zoom reflow.
  - >-
    Added strict closed-enum catalogue/snapshot parsing with field-specific
    OpenAPI patterns for facets, series keys, and breakdown dimensions;
    contract-invalid private-content rejection, bounded UTC range guidance,
    stale-bound clearing, and local overflow containment for zoomed analytics
    cards and tables.
  - >-
    Scoped browser assertions to the Metric explorer and Component catalogue
    feature roots so hidden composition-shell views cannot create ambiguous
    accessible-name matches.
  - >-
    The browser UTC acceptance uses November 2 for the over-limit rejection and
    November 1 for the exact 31-day inclusive boundary, matching the
    implementation's strictly-positive, maximum-31-day window semantics.
  - >-
    Aligned the runtime metric-catalogue item bound with OpenAPI's maxItems
    128 and added exact 128/129 boundary unit coverage.
