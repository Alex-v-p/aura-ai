decisions:
  - >-
    Approval summaries and details use generated reminder/workflow unions;
    workflow-origin records are identified by their typed manual-workflow
    origin and never fabricate conversation, run, or tool-call lineage.
  - >-
    Workflow approval detail renders only the generated immutable
    consequenceCopy, next step kind, workflow display name, and exact ordinal;
    legacy conversation links and reminder proposal rendering remain unchanged.
  - >-
    Workflow notification cards and detail remain content-free and expose no
    workflow deep link before AURA-0138; reminder and briefing behavior,
    acknowledgement, SSE reconciliation, and focus semantics remain intact.
  - >-
    Browser and Storybook fixtures use typed workflow lineage and explicitly
    assert absence of private result content and workflow navigation.
  - >-
    Conversation hydration, accepted-run/reconciliation paths, SSE event
    application, and historical tool replay now reject runs/events without a
    real conversation id; no id is fabricated for workflow-origin records.
  - >-
    Decision reconciliation updates only generated status fields and preserves
    the selected ApprovalDetail discriminant and proposal payload.
  - >-
    The conversation Storybook fixture uses an explicit assertion for required
    conversation and user-message lineage; invalid nullable workflow lineage
    fails closed rather than fabricating an id.
  - >-
    Notification lifecycle validation follows the generated workflow SSE union:
    complete workflow lineage is required and the transport event contains no
    invented `kind` field; the internal source projection may still expose its
    own closed-union discriminator.
  - >-
    Workflow notification detail remains content-free and exposes only
    Acknowledge, with capability-accurate copy: "This update is recorded
    privately. Workflow details aren’t available in this version." No step
    ordinal or unavailable workflow route is presented.
  - >-
    Workflow lifecycle events require UUID-form workflowId,
    workflowRevisionId, workflowInstanceId, workflowStepExecutionId, and
    workflowResultId values, a workflowStepOrdinal from 1 through 8, and the
    exact generated workflow key set; mixed reminder fields, transport kind,
    and extra fields are rejected at the notification boundary.
