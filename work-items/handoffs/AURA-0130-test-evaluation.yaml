decisions:
  - >-
    Added adversarial provider-neutral domain tests for owner-scoped read gating,
    selection allowlists, half-open range and timeout bounds, DST transitions,
    bounded deterministic conflict relationships, and Core/provider isolation.
  - >-
    Added cryptographic adapter tests for AES-GCM owner and connection binding,
    retained-key rotation, opaque non-serializable credential material, fixed
    endpoints, redirect-free requests, malformed and oversized upstream pages,
    safe retry limits, rate-limit exhaustion, cancellation, and encoded IDs.
  - >-
    Added migration assertions for the linear 0024 successor, forward-only
    behavior, owner-scoped metadata tables and indexes, revocation bounds, and
    the absence of event-content durable storage.
  - >-
    Added route composition and privacy checks for all nine v1.19.0 calendar
    operations, no-store middleware coverage, thin application composition, and
    exclusion of provider/persistence rules from the route module.
  - >-
    Added four versioned metadata-only component manifests with the required
    metrics, evaluators, low-cardinality dimensions, and prohibited private data
    fields. Manifest identifiers follow the repository's unversioned-ID and
    separate-version convention.
  - >-
    Added behavioral lifecycle and composition tests for same-session single-use
    authorization, supersession, prefetch/replay races, owner/session isolation,
    callback completion, confirmed and uncertain revocation, Valkey loss, provider
    auth expiry, AURA-0129 string-key lazy CAS rotation, discovery persistence,
    idempotent selection, opaque query-bound pagination, and enabled-provider
    composition. The settled production implementation passes this acceptance slice.
  - >-
    Added real-adapter evaluation for server-side discovery persistence and stable
    Aura UUID projection, owner/query-bound discovery cursor TTL and replay
    rejection, multi-calendar event continuation on the originating calendar,
    opaque cursor wrapping, and owner/query mismatch, replay, and Valkey-loss
    rejection.
  - >-
    Updated application and lifecycle fakes to use the explicit internal
    CalendarDiscoveryPage/CalendarDiscoveryRecord provider port and repository
    upsert_discovered seam, preserving owner-scope and non-selection assertions.
  - >-
    Added adversarial tests for stale/expired/duplicate/mismatched OAuth attempts,
    PKCE verifier enforcement, absolute credential expiry without refresh, retained
    key CAS conflict reload, concurrent selection idempotency fingerprint conflicts,
    fixed revocation deadline guards, cross-page/cross-calendar conflict cursor
    deduplication, invalid IANA/all-day boundaries, exact privacy headers, runtime
    span parentage, retained/rejected telemetry, complete calendar metric emission,
    and executable synthetic evaluator mappings.
  - >-
    Updated lifecycle expectations so terminal revocation uncertainty remains
    REVOCATION_UNCERTAIN and non-connectable after ciphertext deletion; updated
    migration safeguards to reject raw owner issuer/subject in audit rows and to
    require only the content-free occurred_at time index; explicitly rejected
    revocationTerminal from the public connection schema.
  - >-
    Added an interleaved OAuth navigation regression requiring an old in-flight
    navigation to fail after supersession while the newer attempt remains
    current and navigable. Added application-service CAS-loss regressions proving
    reload of the current active-key owner-bound envelope and fail-closed behavior
    for retained-key reloads.
  - >-
    Added fail-closed transient cursor tests for typed conflict-state JSON
    reconstruction, owner/query/conflict-limit binding, replay, malformed values,
    expiry, and non-testing composition without Valkey; added deterministic
    in-flight callback supersession and retained-key CAS reload assertions.
  - >-
    Added revocation reservation-concurrency bounds, terminal uncertainty guards,
    provider-stream cancellation closure, sanitized exception-graph checks, and
    a slow-provider conflict observer test proving local evaluation timing excludes
    network retrieval; synthetic evaluator mappings execute versioned positive and
    negative public-behavior fixtures.
  - >-
    Added discovery, OAuth exchange, and revocation disconnect/deadline preflight
    regressions plus malformed Valkey byte/JSON exception-graph redaction checks.
    Reconciled manifests to component ownership: connection health is connection
    scoped, rate-limit state is provider scoped, and conflict cardinality is finite.
  - >-
    Replaced shallow provider and lifecycle evaluator fixtures with deterministic
    Google adapter HTTP behavior, retry exhaustion, expiry/auth rejection, and
    owner-bound credential sealing/key rotation fixtures, including negatives;
    the lifecycle evaluator now invokes CalendarApplicationService for confirmed
    revocation and terminal retry/deadline exhaustion with ciphertext deletion.
  - >-
    Observability assertions consume the production terminal-outcome and
    error-class vocabularies and inspect actual emitted snapshots, including
    provider retry/rate-limit dimensions and component-specific metric ownership.
  - >-
    Updated request-context test seams to import CalendarRequestContext from
    the public calendar boundary; internal imports remain limited to
    provider-neutral discovery records and genuinely transient white-box state.
  - >-
    Added live API timeout and provider-deadline regressions, including exact
    timeout/deadline classification, complete emitted span and metric checks,
    zero telemetry rejections, and successful HTTP 204 revocation telemetry.
  - >-
    Added a controlled two-client Valkey pipeline interleaving regression that
    requires the newest OAuth attempt to be the sole current/active marker and
    rejects mixed supersession state; the production optimistic pipeline
    transaction now passes this controlled race.
  - >-
    Kept the interleaving attempt fixture expiry relative to the current clock,
    avoiding a historical fixed timestamp while preserving production expiry
    enforcement.
