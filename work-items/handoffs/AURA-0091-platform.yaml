decisions:
  - >-
    Kept normal Core NATS subjects on a separate ACL namespace and added an
    internal evaluation bus with distinct dispatch and runner file secrets;
    both evaluation identities have only their command/result subjects plus
    the bounded JetStream request API and inbox replies.
  - >-
    Provisioned one file-backed AURA_EVALUATION_RUNNER stream with bounded
    age, bytes, messages, payload size, explicit acknowledgements, max
    deliveries, and stable durable consumers for dispatch, requests, and
    cancellations.
  - >-
    Added a no-port runner image/service with only the Core database, evaluation
    NATS, evaluation-object, and Observatory-ingest networks. Deterministic
    AURA-0091 fixtures do not receive model egress or an Ollama URL. It is
    read-only with no-new-privileges, dropped capabilities, bounded CPU,
    memory, PIDs, file descriptors, queue, and execution limits.
  - >-
    Added a runner-specific Garage key and one-shot bootstrap that rejects
    Core-bucket grants, grants only evaluation-bucket read/write access, and
    denies owner permission. Observatory and Core credentials remain separate.
  - >-
    Added an opt-in project-scoped low-memory deployment acceptance script and
    topology tests; teardown removes only the named project and fixture root.
  - >-
    Registered every new Core runner source file in the module registry as
    required by the work item; repository-governance authorization is recorded
    by the active work item and the changed-path validator passes.
  - >-
    Added a dedicated file-backed runner PostgreSQL login. Bootstrap rotates
    its password, revokes inherited schema/table access, and grants only the
    runner ledger/outbox tables plus their sequences; the disposable probe
    verifies an owner table is denied.
  - >-
    Kept one-shot NATS administration separate from long-running identities;
    existing streams and durable consumers are reconciled fail-closed on
    configuration drift, while runtime identities receive only exact
    request/result, consumer, acknowledgement, and inbox subjects.
  - >-
    Changed the runner container command to invoke the image's frozen virtual
    environment directly, preventing runtime dependency resolution and
    avoiding unbounded package-cache use under the 64 MiB temporary filesystem.
  - >-
    Granted the dedicated runner role REFERENCES only on its ledger parent
    table because the terminal outbox has a service-owned foreign key; the
    owner-table denial and all other database boundaries remain enforced.
  - >-
    Removed publish permission for arbitrary NATS inbox subjects from normal,
    dispatch, and runner identities while retaining inbox subscription for
    request/reply. The acceptance matrix includes live denied inbox publishes
    and allowed bounded JetStream request/reply paths.
  - >-
    The runner database bootstrap reads its password through psql \getenv from
    a file-backed environment assignment, so the value is not present in the
    psql process argv or emitted in logs. Compose defaults now provide explicit
    fixture, prompt, and policy revisions rather than relying on an E2E-only
    environment override.
  - >-
    Hardened the acceptance harness to require production module-replay output
    artifact integrity and reachable deletion, exercise the runner-owned
    artifact adapter deletion path, and expose an opt-in bounded telemetry
    acceptance through the existing Collector and Observatory ingest graph.
    The same opt-in phase stops only the Collector and ingest API and proves
    runner execution remains independent; default runner telemetry remains
    disabled.
  - >-
    The opt-in telemetry probe starts only the existing Observatory API and
    Collector through Compose dependencies, queries bounded metadata-only
    counts in the private ClickHouse network, and uses the file-injected
    Observatory credential already mounted by the runner. It introduces no
    service, port, dependency, or external network.
  - >-
    The scheduled telemetry-enabled final run exposed an environment-level
    failure: Compose health waits remained blocked for more than eight minutes
    across PostgreSQL, ClickHouse, and Valkey, and the scoped Compose teardown
    also hung. The harness now validates configurable 30-1800 second startup,
    5-300 second cleanup, and 5-120 second diagnostic budgets; wraps startup,
    diagnostics, teardown, and fixture deletion with GNU timeout; and emits a
    bounded `compose ps --all` snapshot on startup failure without retrying or
    broadening cleanup.
  - >-
    Kept production encrypted state-root bindings unchanged. To avoid the
    observed Docker Desktop bind-mounted high-write stall, the E2E script
    writes an ephemeral Compose override with project-scoped named volumes
    for all disposable state/log targets, retains file-backed secret and
    configuration mounts, and removes those volumes with its existing scoped
    `down --volumes --remove-orphans` cleanup.
  - >-
    Corrected Observatory PostgreSQL's `tr -d` healthcheck to double-escape
    `\\000` in the Compose YAML scalar, matching Core. Compose rendering now
    proves the container receives shell escape characters rather than an
    embedded NUL; no other production healthcheck behavior changed.
  - >-
    Bound every E2E request's provenance deployment revision to the exact
    bounded `AURA_TELEMETRY_DEPLOYMENT_ID` inherited from the deployed runner,
    defaulting safely to `local` only when absent and rejecting empty,
    oversized, unsafe, or sensitive values. This keeps telemetry correlation
    and request reproducibility evidence identical without changing fixture,
    prompt, or policy revisions.
