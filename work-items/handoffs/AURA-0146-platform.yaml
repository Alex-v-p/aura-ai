  notes: >-
    Registered the completion-delivery component with closed operation,
    dependency, outcome, error, metric, and span telemetry vocabularies. The
    tool-execution manifest now uses its stable @1 identity, declares
    core_postgresql for web.research admission, and declares the additive
    terminal-outcome counter. Runtime descriptors and producers emit the
    versioned identity; terminal settlement marks the shared attempt before
    emitting exactly one outcomes total, while legacy unversioned lookups
    remain supported only through a lookup-only telemetry alias. Completion
    delivery now emits one accepted outcome, latency, and span tuple through
    real MetadataMetrics using server-derived trace/span IDs, omitted optional
    dimensions, finite error classes, and stage-specific dependencies. The
    active deliver operation owns a guarded finalizer, so missing boundaries,
    validation failures, claim/list failures, every repository-save phase, and
    settlement failures each produce exactly one terminal tuple while preserving
    the owning dependency/error classification. Repository-save phases now stay
    in an unknown/storage state until the save returns; the metadata sink also
    rejects success/skipped completion tuples carrying an error class.
