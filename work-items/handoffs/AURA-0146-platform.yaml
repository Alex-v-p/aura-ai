decisions:
  - >-
    Added separate registry owners for the interaction research-delivery
    package, public application boundary, SQL persistence mapping, and worker
    entrypoint. Existing import edges were declared explicitly; no product
    behavior or cross-domain table access was added.
  - >-
    Kept completion telemetry metadata-only and finite. Metrics accept only
    the declared delivery operation, bounded outcome/error/status dimensions,
    and the three declared public dependencies; trace identifiers remain
    trace-only.
  - >-
    Added the required research_tool_lifecycle evaluator to the completion
    manifest so AURA-0146's evaluator union is complete.
  - >-
    Kept the legacy component and metric registry entries available for
    existing lookup and historical telemetry tests, but removed legacy
    producer emission and rejected the legacy component for the new terminal
    outcomes total.
  - >-
    Replaced aggregate completion evaluator scoring with four typed
    evaluator-specific observation subsets and deterministic binary ScoreV1
    results. Observation parsing rejects unknown fields, nested/privacy-bearing
    values, open admission states, and non-server-derived replay keys.
  - >-
    Updated document citation evaluator attribution and its tool-evaluation
    fixtures to the canonical aura.runtime.tool_execution@1 identity.
  - >-
    Centralized completion-delivery terminal telemetry around the complete
    active operation with a duplicate-emission guard and explicit phase
    classification for conversation boundaries, repository saves, source
    claims, settlement, and pre-dispatch validation. Added real MetadataMetrics
    coverage for each failure phase and confirmed zero sink rejections.
  - >-
    Kept every repository-save attempt in unknown/storage_unavailable until
    commit completion, including conversation, dedicated, and deletion paths;
    added exact real-sink triplet assertions for all save phases and closed the
    success/skipped-with-error completion tuple loophole.
