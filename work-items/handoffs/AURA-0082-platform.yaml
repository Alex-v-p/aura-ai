decisions:
  - >-
    The disposable local HTTP overlay replaces Core PostgreSQL, NATS, Garage
    data/config, Authentik PostgreSQL/media, and Observatory PostgreSQL,
    ClickHouse data/logs, and session state binds with project-scoped named
    volumes. Normal Compose and stable HTTPS mounts were left unchanged.
  - >-
    The overlay keeps source/configuration binds read-only, including the
    Garage template and Authentik blueprints, and uses !override so production
    host paths cannot leak into the disposable profile.
  - >-
    The disposable overlay overrides Observatory PostgreSQL's healthcheck with
    the double-escaped cmdline NUL sequence used by the working Core and
    Authentik checks. The rendered command contains a literal backslash-zero
    sequence and no NUL byte.
  - >-
    The local Authentik owner bootstrap retries blueprint application for at
    most 30 attempts with a two-second delay, covering first-boot creation of
    managed flows and property mappings. It fails loudly after the bounded
    60-second window instead of sleeping indefinitely or masking a permanent
    blueprint error.
  - >-
    The Observatory migration image invokes the single-command Typer app
    without an extra `migrate` argument; the CLI help smoke test confirms the
    container command shape without opening database connections.
  - >-
    Observatory Collector uses the contrib bearertokenauth extension with
    filename=/run/secrets/observatory-ingest-credential (the pinned 0.138.0
    schema key) and the exporter
    authenticator hook. Compose restores the image's native collector
    entrypoint, so the raw credential remains file-injected and never enters
    an environment variable, URL, or log.
  - >-
    Observatory nginx writes all client, proxy, FastCGI, uWSGI, and SCGI
    temporary files under the writable /tmp tmpfs while preserving read-only,
    no-new-privileges, and capability-drop hardening.
  - >-
    local-http.sh selects the observatory profile and writes the owner subject
    returned by Authentik into both Core and Observatory environment keys.
  - >-
    Normal down preserves disposable volumes. An explicit reset subcommand
    removes only the current Compose project's named volumes and generated
    local environment while preserving the owner password file.
  - >-
    Documentation names the three loopback URLs, the canonical launcher, and
    the distinction between encrypted AURA_STATE_ROOT production storage and
    the disposable named-volume exception.
risks:
