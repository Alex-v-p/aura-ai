decisions:
  - Kept metadata-observation v1 immutable and introduced v2 as a standalone closed schema so mixed-version ingestion can be tested and rolled out without silently reinterpreting stored v1 payloads.
  - Used explicit nested deployment and execution marker properties instead of arbitrary attributes or dimensions, preventing high-cardinality revision values from becoming metric labels.
  - Limited revision identifiers to bounded trusted-configuration labels and documented that promptBundleRevision must be assigned before capture rather than derived from prompt or other content.
  - Defined matching RevisionIdentifier and lowercase ModelIdentifier grammars in metadata-observation v2 and observatory-v1 so repository-supported release and tagged local-model identifiers remain comparable without granting a general colon-bearing label.
  - Rejected owner, identity, credential, bearer, token, secret, password, private, content, hash, digest, and endpoint only as complete delimiter-separated segments; this blocks owner-secret, content-hash-abc, private-image, qwen3:content, and qwen3:hash while preserving unrelated labels such as ownerless, contention, privateer, digestive, and sha256_abc.
  - Used explicit per-letter character classes for case-insensitive RevisionIdentifier segment rejection because JSON Schema/OpenAPI patterns must remain valid ECMAScript without relying on non-portable inline regex flags.
  - Required a letter-bearing optional model tag to accept 8b and latest while rejecting a host-and-numeric-port shape; explicit scheme, path, email, whitespace, and sensitive metadata segments are rejected syntactically, with runtime private-shape validation still required for provenance and ambiguous labels.
  - Used a POST query with a closed body because the selected run identifiers are authenticated operational metadata that must not appear in browser history, access URLs, or query strings; the operation remains read-only and non-persistent.
  - Retained observatory-v1 version 1.0.0 because adding a new resource and new schemas is backward-compatible and requires no existing consumer to send or accept new fields.
  - Represented marker and evidence absence as missing or unavailable instead of null alone so clients never mistake absent historical data for equality.
  - Kept measurement pairs keyed by declared name and non-null unit, with absoluteDelta nullable, so incompatible units cannot be compared and a measured zero remains distinct from absent evidence.
  - Exposed fixed limits in the response contract so clients can explain partial results and never imply that bounded evidence is complete.
  - Kept TraceComparison.alignedSpans at 10,000 because independently retained 5,000-span sides can be entirely unmatched, and retained the 512-character structural alignment-key grammar emitted by the bounded canonical-path algorithm; no persisted comparison or row identity was introduced.
  - Kept the generated Angular output transport-only with no auth, querying, alignment, caching, retry, state, retention, or presentation behavior.
  - No online documentation was needed because the repository-pinned JSON Schema 2020-12, OpenAPI 3.1, Angular generator, and existing compatible contract patterns resolved this ownership slice.
risks:
  - JSON Schema constrains marker syntax and rejects the approved delimited sensitive shapes but cannot prove that an otherwise valid model or revision identifier was not derived from content or semantically represents private data; trusted Core configuration and Observatory runtime allowlists must enforce marker provenance and broader private-shape rejection.
  - The OpenAPI contract describes left/right inequality as a semantic 422 because portable JSON Schema cannot compare sibling property values.
  - Large but finite aligned-span responses remain dense; the query and frontend owners must preserve fixed limits, partial reasons, progressive rendering, and memory-only handling.
