      changes:
        - Added the owner-authorized POST /api/v1/run-comparisons/query resource with left and right run UUIDs in a closed JSON body and no URL identifiers.
        - Added a no-store metadata-only comparison snapshot with fixed two-run, per-run observation, per-run span, measurement, scan-row, and execution-time limits.
        - Added explicit available, missing, unavailable, equal, changed, matched, left-only, right-only, incompatible, retained-partial, truncated, missing-parent, cyclic, and duplicate evidence states.
        - Added bounded run-side timing, status, outcome, model, deployment, git, image, configuration, component-version, agent, prompt-bundle, and policy marker projections.
        - Applied ModelIdentifier only to modelId comparison values and the matching closed RevisionIdentifier to all other comparison markers without widening SafeLabel elsewhere in observatory-v1.
        - Added compatible-unit component measurement comparisons that distinguish zero from missing and expose a non-negative absolute delta only for two available finite values.
        - Added deterministic structural span-alignment transport shapes with a 512-character structural-key grammar and up to 10,000 aligned records for two independently bounded 5,000-span sides, without inferring absent lineage or collapsing incompatible component operations.
  compatibility_notes:
