decisions:
  - >-
    Reused the existing evaluator, suite, artifact, job, result, and score
    resource families instead of adding a bespoke local-judge work endpoint.
  - >-
    Added first-class multipart generation with a typed Blob body and
    declarative requestMode only; serialization, network behavior, retries,
    authentication, and domain behavior remain outside the generated client.
  - >-
    Kept evaluation-v1 unchanged because its existing concepts and bounds are
    sufficient. Focused mapping tests prevent transport definitions from
    drifting from its content authorization and local-judge budget.
  - >-
    Added a public capture-authorization command instead of relying on private
    SQL fixture setup. The response remains content-free and gives artifact
    admission the exact durable authorization identity and dataset binding it
    must verify.
  - >-
    Removed application/octet-stream from the new upload admission before
    integration because opaque bytes cannot satisfy the prohibited-credential
    inspection policy. Historical artifact metadata and runner reference
    schemas remain unchanged.
  - >-
    Kept ordinary analytics metadata-only and added only the exact existing
    Core recovery counter required by acceptance.
risks:
  - >-
    The downstream Observatory implementation must enforce streaming limits,
    actual byte-count and digest equality, recursive credential and
    prohibited-content rejection, exact multipart fields and media-type match,
    durable capture authorization, CSRF, idempotency, and no-store; OpenAPI can
    declare but cannot itself execute these invariants.
