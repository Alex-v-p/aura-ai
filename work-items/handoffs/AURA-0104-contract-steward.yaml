contracts:
  changed: true
  authorship: >-
    Serialized by the assigned contract_steward as the sole writer for the
    observatory-v1 source contract, its focused contract tests, and the
    reproducible transport-only generated client during this ownership slice.
    Service behavior, persistence, migrations, deployment, and product
    frontend logic were not changed.
  compatibility: backward_compatible
  definitions:
    - id: observatory-v1
      version: 1.0.0
      source: contracts/openapi/observatory-v1.yaml
      changes:
        - >-
          Added owner-only local-judge evaluator creation to the existing
          evaluation evaluator collection. The closed request combines the
          settled evaluation-v1 Evaluator and LocalJudgeDefinition concepts,
          carries immutable artifact bindings instead of prompt or rubric
          content, and requires the existing anti-CSRF and UUID idempotency
          headers.
        - >-
          Added owner-only multipart artifact creation to the existing
          evaluation artifact collection. The form contains exactly a closed
          JSON metadata part and one binary part, caps both the declared and
          represented payload at one MiB, admits only inspectable JSON, plain
          text, or Markdown, requires explicit content capture authorization
          and manual retention, and declares exact byte-count and digest
          verification, conflict, unsupported-media, oversized-payload, and
          no-store response boundaries without exposing bytes or storage
          locations in responses.
        - >-
          Added an owner-only, CSRF-protected, UUID-idempotent capture
          authorization command. It durably binds an opaque authorization and
          request identity to one exact dataset version, finite capture class
          and purpose, controlled-evaluation context, authorization time, and
          manual-only retention, returning closed content-free metadata with
          no-store.
        - >-
          Additively admitted local_judge references in evaluation suite
          creation so existing job, result, and score resources can provide the
          requested work admission and readback without a bespoke orchestration
          endpoint.
        - >-
          Added evaluation_runner_nats_recovery_count to the finite operational
          analytics metric allowlist without widening dimensions, grouping,
          pagination, scan limits, or metadata capture policy.
    - id: evaluation-v1
      version: 1
      source: contracts/evaluation/v1/evaluation.schema.json
      changes:
        - >-
          No source change. Existing Artifact, Evaluator,
          LocalJudgeDefinition, Request, Result, Score, authorization, budget,
          provenance, digest, and retention definitions remain authoritative
          for the additive Observatory transport projections.
  compatibility_notes:
    - >-
      observatory-v1 remains version 1.0.0. Existing paths, operations,
      request and response shapes, operation identifiers, authentication,
      evaluation readback, and SSE contracts remain present.
    - >-
      The evaluator and artifact mutations are additive methods on existing
      collections, and capture authorization is an additive collection path. Existing
      generated client operations remain unchanged; the generated descriptor
      union adds multipart as a request mode and emits Blob only for the new
      upload operation.
    - >-
      The capture-authorization path is additive. The not-yet-integrated
      artifact mutation was narrowed before release from generic binary plus
      text to approved inspectable JSON and text media only, so no released
      producer or consumer loses compatibility.
    - >-
      The evaluation suite evaluator kind accepts the previously supported
      deterministic value plus local_judge. Human review remains excluded from
      automated suite admission.
    - >-
      evaluation_runner_nats_recovery_count is one new member of the existing
      bounded analytics allowlist. No existing metric, unit, aggregation,
      dimension, or grouping value was removed or redefined.
  producers:
    - >-
      Aura Observatory evaluation API, producing immutable local-judge
      evaluator definitions, owner capture-authorization records, and
      byte-count/digest-verified artifact metadata after the downstream
      service implementation lands.
    - >-
      Existing Aura Core evaluation runner telemetry producer, which already
      emits evaluation_runner_nats_recovery_count asynchronously through OTLP.
  consumers:
    - Aura Observatory evaluation storage and local-judge orchestration.
    - Existing Observatory evaluation job, result, score, and analytics query resources.
    - AURA-0098 disposable full-stack acceptance and dependency-recovery harness.
    - Generated Observatory API client and its injected transport implementation.
  rollout:
    - >-
      Land this contract and generated output before the matching Observatory
      API, storage, orchestration, and analytics catalogue implementation.
    - >-
      Deploy the new mutations only with owner authorization, same-origin CSRF,
      UUID idempotency, exact multipart parsing, streaming byte enforcement,
      exact byte-count and SHA-256 verification, recursive JSON and bounded
      text prohibited-content rejection, approved-media enforcement, and
      no-store response handling implemented and tested.
    - >-
      Continue using existing job submission and job/result/score reads for
      local-judge execution. Enable the composed AURA-0098 acceptance paths
      only after those public resources and the analytics metric are live.
  generated_outputs:
    - frontend/libs/platform/observatory-api-client/src/lib/generated/observatory-api.ts
