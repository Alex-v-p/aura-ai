    Used /api/v1/briefing-capabilities and getBriefingCapabilities for the one
    non-mutating capability resource, consistent with Aura collection-style API
    naming while returning one fixed closed object rather than an extensible list.
  - >-
    Named the UUID executionPolicyRevisionId to match the existing
    BriefingExecutionPolicyReferences create field and prevent frontend mapping
    or hard-coded policy identity.
  - >-
    Embedded the canonical fixed values as OpenAPI const constraints so Core,
    generated consumers, and drift tests share one exact public contract.
  - >-
    Inherited root owner-session security and prohibited operation-level
    anonymous security; no CSRF or idempotency header is present because this is
    a read-only query.
  - >-
    Mechanically advanced existing Aura OpenAPI version-pin assertions and the
    calendar contract test docstring from 1.20.0 to 1.21.0 without changing any
    asserted resource behavior.
