decisions:
  - Added optional batch-only ports so existing single-observation test doubles and adapters remain source-compatible while production composition uses the bounded path.
  - TelemetryIngestService validates every record before catalogue, receipt, or provider writes and classifies repeated valid identifiers before admission.
  - PostgresObservationIdRegistry claims all unique valid observations under one existing advisory-lock transaction, allocates/reuses immutable sequences, commits the receipt fence, and retains the guard through batch settlement or cancellation cleanup.
  - ClickHouseObservationStore uses one AsyncClient per bounded batch, a validated semaphore, stable observation identifiers as deduplication tokens, and per-observation outcomes; only confirmed successes settle and advance visibility.
  - Failed, ambiguous, or cancelled writes leave pending receipts and immutable sequences for redelivery or AURA-0108 reconciliation; settlement and abort paths release provider and advisory-lock resources.
  - Health/catalogue updates are aggregated by finite batch outcome where the health port is durable; no new metrics, schema, migration, contract, Core dependency, or Aura Web change was introduced.
  - MemoryObservationIdRegistry.claim_batch now rejects repeated identifiers before mutating pending or sequence state, matching PostgreSQL batch semantics.
  - Added only observatory_ingest_bounded_concurrency to the two authorized telemetry component manifests; metric catalogues, capture policy, retention, dependencies, and all other evaluators are unchanged.
  - Added an optional batch catalogue port. Production PostgreSQL uses one connection and set-based UNNEST projections for deduplicated components, deployments, and role arrays; legacy test doubles retain the existing fallback.
  - Production receipt admission and settlement use bounded set-based receipt/sequence/visibility operations under the existing advisory lock. Legacy sequence allocation remains only as a compatibility fallback when the allocator row is absent.
  - ClickHouse batch writes execute fixed-size waves, retaining one client and stable per-observation dedupe tokens in log-safe ClickHouse settings headers rather than URL/query parameters.
  - Ingest opens one metadata-only trace context and records bounded catalogue, PostgreSQL claim/settlement, and ClickHouse storage phase spans using existing component span APIs and finite error classes.
  - Batched receipt admission, UUID joins, filtering, and settlement explicitly cast text-array observation identifiers to UUID so psycopg cannot infer an incompatible text[] value for UUID columns.
  - Failed or cancelled claim and settlement cleanup explicitly rolls back before advisory unlock; rollback or unlock failures never replace the primary statement exception or cancellation.
  - Set-based receipt updates consistently reference the `batch_values` UNNEST relation for both observed timestamps and immutable ingest sequences; the focused production-registry fake executes both updates and rejects the former invalid `values` alias.
  - Batch claim result mapping now preserves `ingest_sequence` for every existing receipt, including non-stale pending and completed rows; only stale/new rows enter the acquired set, so recovery exposes the immutable sequence without falsely accepting a pending receipt.
  - Catalogue deployment roles now use bounded JSONB recordset rows, preserving each deployment's independently sized role array without invalid multidimensional text-array UNNEST semantics.
  - ClickHouse dedupe settings are emitted in provider-supported INSERT SETTINGS SQL (`insert_deduplicate=1` and the validated opaque identifier token), keeping identifiers out of URL parameters and request headers/log metadata while preserving retry idempotency.
  - Catalogue, PostgreSQL claim, ClickHouse write, and PostgreSQL settlement each emit one correlated metadata-only phase span; provider partials and cancellation use existing finite transport error classes, and the catalogue adapter no longer duplicates the service-owned catalogue span.
