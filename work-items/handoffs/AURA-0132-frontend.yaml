decisions:
  - >-
    Notification consumers use a content-free source projection that accepts the
    generated briefing identifiers and the Core source envelope while retaining
    legacy reminderId responses during additive rollout. Reminder content is
    fetched only when the source discriminates as a reminder.
  - >-
    Briefing notifications render a generic ready message and a disabled
    dedicated-result action carrying only the opaque result reference in an
    accessible label and data-destination marker. No briefing route, result
    fetch, private content, query string, browser persistence, or conversation
    append was introduced.
  - >-
    Today labels briefing notifications as Briefing ready but keeps the same
    owner-authorized notification detail route and independent reminder,
    approval, conversation, and calendar projections.
  - >-
    Session reset and acknowledgement behavior remain in NotificationStore;
    this consumer slice only gates source-specific detail actions and content.
  - >-
    Acknowledging an unread list row schedules heading focus after the row is
    removed, and closing or escaping a detail dialog falls back to the
    Notifications heading when its original opener no longer exists.
  - >-
    Today uses dedicated unread-projection loading, error, notice, generation,
    and retry state while History retains its own list and SSE connection.
    Projection retry never reconnects the active History stream; a separately
    rendered live-update retry reconnects that stream when it degrades.
risks:
  - >-
    Record-source projection retains defensive compatibility for Core's
    additive response envelope, while lifecycle-event validation fails closed
    to the canonical generated top-level reminder-or-briefing union and rejects
    source envelopes, mixed identifiers, incomplete briefings, and extras.
  - >-
    Notification view changes no longer issue an eager unread projection request
    while History is active, preventing view-switch refreshes from consuming the
    next Unread request. Live events still refresh Today independently when
    History is active.
  - >-
    Today explicitly reconciles the stable unread projection when its route
    mounts after the notification workspace was left on History. This performs
    one authoritative delivered projection request without changing the active
    notification view or coupling Today to inbox rows.
  - >-
    Browser lifecycle validation now accepts only the canonical generated
    reminder-or-briefing event shapes: reminderId alone or the complete
    briefing schedule/occurrence/result tuple. Mixed, incomplete, extra-field,
    and source-envelope payloads are rejected before replay state advances.
  - >-
    AuraShellComponent now closes an open mobile drawer on NavigationEnd and
    restores focus through its existing closeMobileNavigation helper. The
    focused shell regression covers this route-completion contract.
  - >-
    Notification copy and empty states are source-neutral, and the deferred
    briefing-result control overrides the global busy disabled cursor because
    the destination is intentionally unavailable rather than loading.
  - >-
    Today surfaces History live-update degradation independently after a
    successful unread projection, with distinct projection and live retry
    actions. The Today Storybook fixture now supports a History view so the
    unavailable live-update state is reviewable without adding a product route;
    the rendered focus helper falls back to the heading after opener removal
    and preserves the opener when it remains connected.
unresolved:
  - >-
    The mobile reminder E2E still opens the drawer while already on
    /notifications and then clicks the intentionally inert content beneath the
    scrim; no NavigationEnd occurs, so the route-completion fix cannot close it.
    The E2E file is outside this worker's requested mutation scope.
