  - Strengthened the Garage bootstrap regression to require removal attempts for pre-existing read and owner grants, explicit write/read/owner postcondition checks, and fail-closed verification of the final write=true/read=false/owner=false state.
  - Replaced the metric persistence fake's SELECT/UPDATE sequence with an atomic ON CONFLICT upsert model and asserted concurrent first-write accumulation, API visibility after drain, no double-read/update SQL, bounded queue/drop accounting, typed persistence failure classification, and shutdown flush behavior.
  - Strengthened component-manifest assertions to require metadata_only capture and the complete prohibited-field set only for the two typed AURA-0090 manifests, while preserving legacy manifest expectations; added nested typed-validator regressions for contract fields.
