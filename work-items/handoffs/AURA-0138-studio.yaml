decisions:
  - >-
    Kept authoring definitions and mappings as signals in WorkflowStore until
    an explicit create or update command; no draft content is serialized into
    navigation, persistence, logs, or live events.
  - >-
    Wrapped every mutation in the generated AuraApiClient with a CSRF session
    token and stable Idempotency-Key retention. Unknown network or server
    outcomes preserve the key and mark the store stale until reconciliation.
  - >-
    Treated SSE as an invalidation hint only. The store records the opaque event
    identifier and reloads authoritative workflow or instance REST state.
  - >-
    Kept the UI inside one feature library with standalone component styling,
    semantic labels, keyboard buttons, responsive breakpoints, and reduced
    motion support. App routing/navigation remains outside this ownership zone.
  - >-
    Exposed explicit seven-scope deletion, approval/notification-safe opaque
    lineage, cancellation, and recovery methods through the feature API without
    importing those feature implementations.
  - >-
    Treats live events as validated metadata invalidations: cursor errors clear
    the cursor and reconcile through bounded REST, clean EOF reconnects, and
    bursts are coalesced to one in-flight plus one queued refresh while stale
    authoritative detail remains usable.
  - >-
    Reconcile recovery now requires an explicit owner choice between completed
    and failed; run detail renders each completed effect, checkpoint, and
    terminal result, and approval copy is truthful when no compatible handoff
    link is present.
  - >-
    Mobile authoring exposes the active step plus its immediate predecessor for
    safe clone/source context, with Previous/Next controls and no rendering of
    the full ordered list. Navigation focus waits for the rendered step, and a
    final-step Next action remains a bounded no-op with an announcement. The
    active card is marked aria-current="step" and visibly distinguished, while
    programmatically focused headings have a visible focus ring. Agent revision
    choices use the generated listAgents currentRevision seam; historical
    revision cataloging remains outside the generated contract.
  - >-
    Live invalidation coalescing accumulates list, selected-workflow, and
    selected-instance projections; the latest event cursor advances only after
    every required authoritative REST read succeeds. Cursor expiry performs a
    full visible refresh before reconnect, while SSE 401/403 clears private
    state without reconnecting.
  - >-
    Stream runtime validation follows the workflow OpenAPI envelope: UUID
    lineage, RFC3339 timestamps, positive bounded versions/ordinals, closed
    deletion scopes, unique recovery capabilities, exact variant keys, and the
    required heartbeat schema marker.
  - >-
    Workflow creation adopts the authoritative parent definition, route
    selection is canonical, reset clears owner-private agent and manual-input
    state, and terminal instance deletion retains a content-free target for
    remaining deletion scopes.
  - >-
    Contextual run, approval, and tombstone panels remain inside the workspace
    column; mobile add/clone/move/remove updates the active step before focus;
    authentication errors provide sign-in or permission guidance; manual input
    errors expose stable aria-invalid and aria-describedby relationships.
  - >-
    Authentication recovery uses the generated Aura startLogin operation and
    a bounded same-origin return_to path (/workflows); external or oversized
    return paths fall back to the workflow index.
  - >-
    Agent option loads carry both the session epoch and a monotonic load
    generation. Reset increments the generation, clears agent data, revokes
    the established-session gate, and prevents mounted-route reloads until a
    new authenticated session is explicitly established; delayed responses
    therefore cannot repopulate private agent choices.
  - >-
    Storybook now covers empty and authored drafts, waiting and recovery runs,
    authentication and permission failures, reconnecting live updates, and the
    mobile one-step editor state.
  - >-
    Publishing opens an accessible, focus-managed immutable review dialog that
    enumerates declared input types, ordered typed provenance, authorized agent
    revisions, confirmation points, and server budgets before the commit. The
    review captures its opener before asynchronous validation, traps forward and
    reverse Tab within the modal, inerts the background while open, and restores
    focus after Escape, cancellation, or completion. Confirmation restores the
    opener synchronously when the dialog closes, before awaiting a potentially
    slow or unknown publish response.
    Run evidence is ordered after the run heading and renders timestamps,
    completed effects, checkpoints, per-step results, and terminal result
    details; the empty authoring story explicitly opens the in-memory editor.
  - >-
    Reconciliation preserves mutation fingerprints and request keys, allowing
    only the explicitly safe unknown-create retry while keeping start retries
    gated. SSE pending event IDs are marked processed only after all required
    REST projections succeed, replayed processed events advance the cursor
    without another fetch, and the bounded set is cleared on session/cursor
    reset. This prevents replay bursts from launching excess reads.
  - >-
    If an EOF retry timer fires during an in-flight projection refresh, the
    refresh completion reopens the metadata stream only after authoritative
    reads succeed and the cursor remains committed; pending retry timers are
    otherwise left to perform the reconnect.
  - >-
    RFC3339 stream timestamps require a coloned offset or Z and calendar
    components are validated without Date.parse normalization. A parent route
    inspection clears same-workflow run selection, while deletion
    reconciliation preserves only the content-free terminal tombstone target
    needed for remaining scopes. Workflow-only live invalidations preserve the
    selected run when the instance route remains active; instance invalidations
    refresh it independently.
