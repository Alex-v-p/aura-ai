    available through the generated workflow-facing contract; exposing it would
    require an owning agent-library or contract decision.
  - >-
    The shared workflow-store.spec.ts contains concurrent TestBed edits owned
    by the parent/integration stream; this worker preserved that file and the
    focused workflow test target currently passes after the concurrent edits.
  - >-
    The browser stream fallback uses the standard metadata-only SSE endpoint
    because the generated transport facade is JSON-oriented; all mutation and
    authoritative reads remain through the generated Aura client operations.
  - >-
    The application shell must register the library alias and workflow routes;
    those changes are owned by the concurrent platform/application worker.
  - >-
    Vitest cannot instantiate the Angular-decorated WorkflowStore directly in
    this lightweight workspace transform; focused tests cover the pure
    coalescing/cursor projection and contract validator seams, while production
    build validates the store integration.
