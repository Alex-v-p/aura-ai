decisions:
  - Added a worker-only object-store port and Garage SigV4 adapter whose key is deterministically derived from a canonical artifact UUID; redirects, caller paths, provider locators, and provider response bodies do not cross the boundary.
  - Added explicit artifact authorization, bounded streaming SHA-256 verification, media allowlists, pending/available/failed lifecycle, and idempotency conflict handling. Failed or mismatched uploads are best-effort deleted and never published as available metadata.
  - Added PostgreSQL metadata and immutable deletion-target tables without raw bytes, object keys, credentials, endpoints, filenames, or owner identity.
  - Added ClickHouse finite score storage with nullable score values so zero is distinct from missing evidence; the table has no maps or automatic TTL.
  - Added asynchronous object-first deletion that consumes immutable PostgreSQL target snapshots, treats missing Garage objects as successful cleanup, deletes score mutations and metadata, and resumes queued/running commands through the worker loop.
  - Kept the API composition free of artifact credentials and object-store construction; only the worker composition reads the separate file-injected credentials.
  - Bound content-bearing authorization to the exact request and dataset UUIDs plus the closed evaluation-v1 purpose/context/retention values. The same predicates are rechecked in the idempotent retry path and atomically at publication, so revocation or scope changes cannot make an object visible.
  - Authenticated the Garage upload body with the caller-provided contract SHA-256 in the SigV4 `x-amz-content-sha256` payload hash while retaining the streaming verifier; a mismatching provider body is rejected as bounded storage integrity failure.
  - Kept Garage PUT/DELETE path-style signing standards-aligned: the signer uses the exact encoded raw path, signs only the bounded host/content-type/date/payload headers, and excludes transfer framing from the canonical header set.
  - Enforced evaluation-v1 `Version` and `ComponentId` syntax/length for score metadata and added a partial unique live-reference index to make deletion target ownership atomic across distinct overlapping commands.
risks:
  - Platform deployment must provision the separate Garage bucket/key, worker-only object network, file secrets, and encrypted state-root mapping before enabling this worker composition.
  - ClickHouse deletion mutations are asynchronous at the provider level; later query/API work must expose bounded deletion progress without treating mutation submission as content visibility.
  - End-to-end authorization-record creation and owner-authorized deletion commands remain intentionally outside this item and are assigned to later API/orchestration work.
