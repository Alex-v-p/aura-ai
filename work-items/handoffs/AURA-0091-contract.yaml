  authorship: >-
    Serialized by the assigned contract_steward as the sole writer for
    evaluation-runner-transport-v1; the settled AURA-0089 schemas were read
    but not edited.
  compatibility: backward_compatible
  definitions:
    - id: evaluation-runner-transport-v1
      version: 1
      source: contracts/evaluation/v1/evaluation-runner-transport.schema.json
      changes:
        - >-
          Added one closed JSON Schema 2020-12 union for requested,
          cancellation-requested, completed, cancelled, and failed Core
          evaluation-runner transport messages.
        - >-
          Required stable message, correlation, causation, request, job,
          attempt, idempotency, request-digest, and UTC occurrence fields on
          every envelope.
        - >-
          Bound requests to one finite execution kind, an exact target
          component, the settled AURA-0089 capture authorization and
          execution provenance, bounded runner and evaluation limits, a UTC
          deadline, bounded case UUIDs, and opaque artifact references.
        - >-
          Restricted artifact references to opaque UUIDs, finite media
          classifications and media types, byte counts, SHA-256 integrity,
          and settled content-capture authorization; locators and bytes are
          absent.
        - >-
          Prohibited input artifact references for metadata_only and hashed
          requests so only explicitly content-authorized evaluations can
          reference retrievable content.
        - >-
          Required completed, cancelled, and failed messages to repeat the
          declared capture, effective limits, deadline, and execution
          provenance and to report every reproducibility binding as verified,
          missing, or mismatched with a bounded observed value when present.
        - >-
          Limited cancellation reasons and terminal failure codes to finite
          enums, reusing evaluation-failure-codes-v1 for failed results.
        - >-
          Kept every object closed and omitted raw input, output, prompt,
          rubric, comment, artifact bytes, credentials, endpoints, bucket
          names, object keys, paths, filenames, owner identity, exception
          text, arbitrary attributes, dynamic imports, provider selection,
          and tool authority.
  compatibility_notes:
    - >-
      evaluation-runner-transport-v1 is a new contract identifier and v1
      root; it changes no payload accepted by an existing producer or
      consumer.
    - >-
      evaluation-v1, evaluation-events-v1, and
      evaluation-failure-codes-v1 remain byte-for-byte unchanged.
    - >-
      References reuse settled AURA-0089 authorization, component,
      provenance, limit, and failure-code meanings without widening
      production telemetry or portable owner authority.
    - >-
      All transport objects are closed; future fields or message kinds need
      an explicit compatible contract revision.
    - >-
      Cross-field identity inequality, timestamp ordering, canonical digest
      calculation, deterministic identifier derivation, authorization
      compatibility, and observed-versus-declared evidence comparison remain
      producer and consumer validation because portable JSON Schema cannot
      establish them.
  producers:
    - >-
      Aura Observatory evaluation orchestration authorized for AURA-0092,
