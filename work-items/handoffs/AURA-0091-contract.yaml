decisions:
  - >-
    Added a dedicated transport union instead of widening the AURA-0089
    resource or lifecycle-event schemas; those contracts describe persisted
    resources and public lifecycle facts rather than complete runner commands.
  - >-
    Reused AURA-0089 definitions by JSON reference for capture authorization,
    component bindings, execution limits, execution provenance, and failure
    codes so their meanings cannot drift between orchestration and execution.
  - >-
    Kept request and result payloads reference-only; authorized content moves
    through opaque artifact references with an integrity digest and never in
    NATS message bodies.
  - >-
    Required a complete fixed runtime-evidence object so missing and mismatched
    reproducibility data remains explicit instead of being inferred or hidden
    in an arbitrary attribute map.
  - >-
    Used finite cancellation and failure categories and omitted free-form
    reason or exception fields to keep terminal messages content-free.
  - >-
    Added runner-specific queue, model-call, and artifact-operation ceilings
    around the settled evaluation ExecutionLimits without encoding queueing,
    retry, or execution business behavior in the schema.
risks:
