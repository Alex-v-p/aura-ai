  rollout:
    - >-
      Register the new v1 root and enforce exact schema-version dispatch before
      enabling evaluation NATS subjects or durable consumers.
    - >-
      Producers must canonicalize and hash requests, generate deterministic
      service-owned identities, and publish reference-only messages.
    - >-
      Consumers must validate the closed schema before durable claim, verify
      authorization and artifact integrity at the owning service boundary,
      and map internal failures to the finite shared taxonomy.
    - >-
      Deploy the dedicated NATS identities and runner only after contract,
      ACL, idempotency, privacy, and outage acceptance passes; production
      Core remains independent and production telemetry remains metadata_only.
