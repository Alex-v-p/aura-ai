decisions:
  - >-
    Added a separate aura-artifacts Garage bootstrap identity for Core. The
    bucket name is fixed to aura-artifacts so composition cannot diverge from
    the generated-artifact adapter. It is idempotent across existing key and bucket state, creates the bucket only
    when absent, grants read/write for object lifecycle operations, denies
    owner access, and verifies exactly one RW grant after mutation.
  - >-
    The bootstrap fails closed when the artifact bucket is absent, aliases the
    documents, evaluation, or run-evidence bucket, or when the key has any
    pre-existing unrelated bucket grant. It reads credentials only from
    Docker secrets, suppresses Garage command output, and unsets secret
    variables before exit.
  - >-
    Core API and worker receive the artifact identity only through file-backed
    Docker secrets and explicit AURA_ARTIFACT_STORAGE_* settings. Browser,
    scheduler, parser, provider, and Observatory services receive no artifact
    credential or bucket configuration.
  - >-
    Deployment checks remain topology/static because no deployment secrets or
    Garage state are available in the worker environment; the focused test
    covers private networking, service wiring, grant separation, idempotency,
    and credential non-leakage.
risks:
  - >-
    The Core generated-artifact implementation must bind its storage adapter
    to AURA_ARTIFACT_STORAGE_* settings and retain the existing document-store
    identity separately; this handoff intentionally does not change Core code.
