    Added manifest synchronization tests for idempotent upserts, replacement of
    only the owning component's edges, unsupported fields, bounded measurements
    and dependencies, duplicate/cycle rejection, and content-free SQL inputs.
  - >-
    Added mocked browser coverage for declared versus observed-only entries,
    semantic topology tables, keyboard focus, partial/unavailable/empty states,
    responsive narrow layout, axe checks, and browser-storage/URL privacy.
  - >-
      Kept tests deterministic and bounded with in-memory seams and no network
      tools or credentials.
  - >-
      Added an opt-in PostgreSQL integration test that creates and drops
      generated isolated schemas, avoiding shared Observatory state while
      exercising fresh and legacy-upgrade migration paths.
  - >-
      Re-ran the correction assertions after the owning implementation fixes;
      topology edges, typed storage failures, and manifest provider
      dependencies now pass without weakening the tests.
  - >-
      Added subprocess-level no-argument/main versus explicit sync-manifests
      dispatch checks, raw multi-measurement one-execution trend checks, and
      concrete psycopg OperationalError/ClickHouse HTTPStatusError propagation
      through the adapter and owner API.
  - >-
      Strengthened the raw trend double so the point-query branch independently
      asserts the inner execution grouping, latest duration/outcome argMaxIf
      selection, and spanless execution grouping in the generated ClickHouse
      SQL; the summary query can no longer mask a trend SQL regression.
  - >-
      Added source-seam pagination regressions using 231 components: the
      PostgreSQL definition path and ClickHouse observed path each advance by
      a truthful component cursor, fetch only limit+1 source groups, preserve
      every declared/observed version, and avoid the former 2,000/1,000-row
      caps. Added deterministic max_nodes topology coverage requiring partial
      truncation and no edge target outside the bounded node set.
  - >-
      Added sparse filtered source-seam regressions for overlapping PostgreSQL
      and ClickHouse pages. Observed-only filtering now proves that an initial
      declared-only overlap advances to later observed-only matches with a
      deterministic replay cursor; declared filtering symmetrically returns all
      later declared components. Both assert provider batches stay at the
      limit-plus-one bound and never use the legacy ClickHouse cap.
  - >-
      Added security-bound regressions for 80-version component inputs, proving
      deterministic 64-version definition/observed response caps and the
      ClickHouse groupUniqArray(64) source contract. Added exact UTC default
      24-hour health-window coverage, inclusive 31-day acceptance, oversized,
      inverted, and naive timestamp rejection, plus direct, catalogue, and
      topology SQL assertions for lower/upper observed_at predicates. Multiple
      topology targets must reuse one identical bounded health window.
  - >-
      Added one-sample observability regressions for successful and failing
      component collection, definition, and dependency resources, including
      legacy compatibility execution. Added source-limit-plus-one topology
      coverage for PostgreSQL definitions (>2000), ClickHouse observed groups
      (>200), and reverse dependencies (>200), requiring partial propagation
      while preserving resolved root/target semantics.
  - >-
      Re-ran the focused metrics/topology regressions and full Observatory suite
      after the owning worker removed the nested legacy collection metrics call;
      the one-sample compatibility regression now passes and all implementation
      blockers are closed.
  - >-
      Added independent browser regressions for catalogue skeleton loading,
      stale/disconnected catalogue recovery, successful-definition preservation
      during partial dependency retry, malformed nested/scalar/enum/array/health
      topology values, neutral no-outcome semantics, numeric dependency health,
      exact detail focus return, and deterministic 200% long-identifier reflow.
      Added parser matrices covering malformed definition and topology shapes;
      no production behavior or contract was changed.
  - >-
      Corrected the full-stack outage acceptance test after the host run exposed
      a readiness race: the prior case waited only for a visible composer while
      the conversation remained unable to send until its model catalogue and
      default agent finished loading. The case now reuses createCoreRun and
      waitForCoreRun, which wait for Core conversation/model/agent readiness,
      verify the configured selectable model, submit through the established
      path, and prove a completed response after Observatory services stop.
      This is test-only; no Core or Observatory product code changed.
