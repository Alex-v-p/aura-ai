  - >-
    Added a typed in-process query-port/API fixture to verify owner authorization,
    page-size and topology bounds, deterministic declared and observed-only
    catalogue states, explicit missing dependency and partial health states,
    metadata-only responses, and retry-safe unauthenticated behavior.
