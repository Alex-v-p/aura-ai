decisions:
  - The public BriefingRepository and BriefingApplicationService expose owner-scoped schedule, occurrence, result and explicit deletion operations without persistence types.
  - Daily occurrence identities are UUID5 values derived from schedule identity and local calendar date; DST gaps advance to the first valid instant and overlaps choose the earlier instant.
  - Schedule deletion tombstones only schedule state; occurrence history and result content use separate manual deletion commands and do not cascade.
  - The API uses established session/CSRF/idempotency dependencies and sets no-store on every briefing response.
  - Initial source grants are closed to reminders, explicit calendars, and explicit documents; memory is not representable.
  - SQL mutations use owner-scoped durable command receipts and optimistic versions; history and result-content deletion replay deterministically.
  - SQL admission, terminal result settlement, lineage, stale-claim recovery, and daily occurrence advancement are transaction-bound; a public claim-plus-stage port lets composition stage the generic wake envelope before commit.
  - Concrete repositories are exported only from the authorized bootstrap adapter; the briefing package exports state abstractions, while execution types remain available through their public execution module without leaking persistence adapters.
  - Result-content deletion clears content while retaining the original terminal outcome, deletion timestamp, version and run lineage for owner-readable audit.
  - BriefingApplicationService exposes fail-closed identifier revalidation and a composition-bound process_command seam for durable worker execution.
  - Lifecycle facts are schema-exact metadata-only serializers and are staged transactionally through the public lifecycle port; SQL composition wires this to the public outbox adapter without adding correlation or content fields.
  - Result-content deletion stages both the terminal result-deleted lifecycle fact and the explicit deletion receipt event; no result text is present in either payload.
  - Persistence and cancellation spans use the run trace, deterministic phase span IDs, and the deterministic admission phase as parent while retaining result/occurrence identity in aggregate metadata.
  - Cancellation settles the admitted/running occurrence and a deterministic canceled result in the deletion transaction after the typed briefing cancellation callback succeeds; stale recovery similarly settles an unknown result.
  - History deletion tombstones only terminal historical occurrences and leaves scheduled/admitted/running future work intact; public result payloads do not expose the internal original-status audit field.
risks:
  - PostgreSQL migration/concurrency and claim-plus-outbox staging require the aggregate PostgreSQL gate and scheduler composition to call the new public staging seam.
  - The worker must bind its concrete execution application through BriefingApplicationService.set_execution_application at composition; the state service intentionally fails closed when that binding is absent.
  - The platform outbox parser/publisher must recognize the schema-exact briefing lifecycle event payload carried by the wired SQL stage (the worker wake command remains a separate generic command subject).
