decisions:
  - Kept the runner entrypoint and state modules as compatibility/lifecycle shims; application and ledger state now live under runtime/replay and production bootstrap composes SQL, JetStream, Garage, telemetry, synthetic, and document replay adapters.
  - Required the target component binding to appear exactly in the request provenance component set before Core accepts the attempt.
  - Added a forward-only Core-owned attempt ledger with leases, cancellation, terminal compare-and-set, and publication state; an in-memory implementation mirrors the production race semantics for tests.
  - Used deterministic UUIDv5 terminal/result message identities derived only from attempt and finite terminal status, allowing safe redelivery without duplicate terminal identities.
  - Enforced effective limits as the stricter of transport and deployment configuration, with a dedicated bounded queue, per-request concurrency gate, deadline, and cooperative cancellation checkpoints.
  - Settled queued and active cancellation through the same deterministic terminal path, including the race where cancellation arrives after lease claim but before a replay checkpoint.
  - Serialized terminal ledger settlement and publication in the runner so cancellation, completion, and failure races produce at most one publication in-process; already-published terminal records are treated as idempotent recovery observations.
  - Added a runner-specific opaque UUID-derived artifact adapter that verifies declared media, capture authorization, byte count, and SHA-256 digest before read/write.
  - Persisted the bounded request projection, exact terminal envelope, terminal outbox, lease generation, and cancellation tombstone so restart and broker-failure recovery do not depend on process-local maps.
  - Compared request reproducibility declarations against independently configured runtime evidence and emitted verified, missing, or mismatched statuses.
  - Declared the runner's metadata-only metrics and privacy prohibitions in its component manifest and Core telemetry registry.
  - Rooted evaluation traces in the transport correlation UUID, used the registered evaluation.execute operation, and emitted evaluation.fixture.load as a child span with bounded dependency, outcome, and error-class dimensions.
  - Kept terminal duration observations real for success, failure, cancellation, and deadline paths; NATS fetch, publish, drain, poison, and recovery health counters are bounded and exporter-failure-isolated.
  - Rejected observed runtime evidence mismatches before replay, retained missing evidence as an explicit terminal status, enforced artifact I/O against the request deadline and cancellation, and checked output capture authorization against the enclosing request.
  - Removed the runtime application's dependency on the concrete object-storage provider error type; provider failures remain translated at the inward artifact port boundary.
  - Compared durable request projections on duplicate delivery and cleaned process-local cancellation/request maps for unknown or already-published terminal messages.
  - Recomputed and verified requestDigest over canonical closed request data; envelope delivery metadata remains outside the digest while terminal/cancellation messages carry the original request digest.
  - Added bounded durable recovery scanning for queued and expired-leased request projections, periodic re-enqueue, lease renewal with generation fencing, and deterministic maxAttempts exhaustion.
  - Replaced owner-document-table replay and bootstrap-local synthetic sequencing with the public Core DocumentService and RunCoordinator use cases, composed over isolated repository, policy, tool, model, event, and outbox fixtures.
  - Removed the terminal outbox foreign-key runtime privilege dependency. Terminal settlement and outbox insertion remain one Core-owned transaction; the forward migration drops the constraint on upgraded schemas so the dedicated runner role needs only the explicitly granted ledger table DML privileges.
  - Added a PostgreSQL-gated terminal persistence regression that settles with the claimed lease generation and verifies the completed attempt, pending publication state, terminal payload, and pending outbox payload before publication recovery.
  - Added a bounded terminal-settlement failure metric with finite database/authorization/timeout/execution classes so SQL transaction failures are observable without leaking provider exception text.
  - Added a PostgreSQL regression assertion that the terminal outbox has no foreign-key runtime privilege dependency before exercising the claimed-lease transaction; this is gated by the isolated runner database and performs scoped cleanup.
  - Fixed the SQL terminal compare-and-set predicate's nullable lease-owner bind ambiguity by explicitly casting lease-owner to VARCHAR and lease-generation to UUID; added bounded classification for SQL programming and privilege failures.
  - Fixed the SQL claim predicate's nullable max_attempts bind ambiguity by explicitly casting it to INTEGER in both branches; finite max-attempt claims remain atomic and stale lease generations remain fenced.
  - Kept an exact in-flight output reference and provider-start marker around each artifact write; cancellation, deadline, or lease fencing cleans only writes that may have crossed the provider boundary, while pre-invocation cancellation does not delete an unrelated existing object.
  - Replay adapters report bounded token/model/artifact usage in ReplayResult; EvaluationRunner is the single accounting owner and consumes each result exactly once. The synthetic fixture no longer mutates ReplayContext before reporting its one model call.
  - Permanent NATS AttemptConflict deliveries are metered through the existing poison counter with only bounded dependency/outcome/error-class dimensions before acknowledgement; no exception text or identifiers are emitted.
  - Mixed-limit admission is represented by the active ceiling set: a new request may join only when the resulting active count is no greater than every active request's effective ceiling.
  - Shared artifact accounting is carried by ReplayContext into the runner-owned budget, so component-reported operations are charged before output providers are entered.
  - Adapter-owned fixture_revision is the source of runtime truth; a non-empty deployment pin that differs from the selected adapter raises a bounded admission failure, while unset Compose configuration always observes the selected adapter revision.
  - Runner-owned artifact writes are the sole output-operation accounting owner; replay adapters report no duplicate write charge.
  - Terminal resource-limit accounting is performed inside durable business settlement, so publication recovery cannot duplicate outcome duration or lose the bounded resource counter.
  - The runner ledger's business_accounted flag is a durable compare-and-set marker; execution_started_at remains Core state rather than widening the closed terminal transport contract.
  - Receipt/cancellation serialization uses PostgreSQL transaction advisory locks keyed by a namespaced attempt UUID and does not add a cross-service table or provider dependency.
