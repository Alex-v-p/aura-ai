contracts:
  changed: true
  authorship: >-
    Serialized by the assigned contract_steward as the sole writer for
    observatory-v1 and its generated Angular transport output during this
    ownership slice. The evaluation-v1, evaluation runner, lifecycle event,
    telemetry, and Core contracts remain unchanged.
  compatibility: backward_compatible
  definitions:
    - id: observatory-v1
      version: 1.0.0
      source: contracts/openapi/observatory-v1.yaml
      changes:
        - >-
          Added owner-session REST resources under /api/v1/evaluation for
          immutable datasets and cases, suites, evaluator catalogue entries,
          jobs, attempts, results, scores, opaque artifact metadata, human
          reviews, calibration summaries, judge qualifications, content-free
          history, cancellation, revocation, and asynchronous manual deletion.
        - >-
          Added deterministic cursor pagination with page sizes capped at 200,
          closed filters, exact immutable version paths, bounded time windows,
          explicit partial flags, finite score and calibration values, stable
          UUID identities, UTC timestamps, state enums, and bounded failure
          codes.
        - >-
          Added closed CSRF headers to every state-changing evaluation command.
          Durable commands use UUID idempotency keys; deletion uses the exact
          DELETE_EVALUATION_ARTIFACTS acknowledgement required by its service.
        - >-
          Added five disjoint manual-deletion variants matching DeletionCommand
          and DeletionSelector: command UUID, request time, and job, dataset,
          suite, UTC cutoff, or purge-all selector. The union cannot represent
          versions unsupported by that service, object locations, or credentials.
        - >-
          Corrected suite admission to require immutable component version,
          code revision, image digest, and configuration revision bindings plus
          exact bounded execution limits, provenance, and creation time.
        - >-
          Corrected job admission to carry the request, immutable definition
          bindings, capture authorization, deadline, attempts, runner limits,
          cases, execution provenance, and opaque artifact metadata needed for
          EvaluationAdmission. Artifact bytes and locations remain excluded.
        - >-
          Corrected review and qualification commands to carry authorization,
          calibration, local-model and opaque artifact bindings, manual-only
          retention, provenance, and UTC action times. Prompt, rubric, and review
          comment content is never portable through these bindings.
        - >-
          Added a dedicated /api/v1/evaluation/events SSE operation carrying a
          closed EvaluationLiveEvent with event ID, timestamp, resource type,
          opaque resource ID, change, bounded state, and metadata_only policy.
          Scores, digests, authorization records, content, model locations, and
          credentials are structurally absent. The original /api/v1/events
          response, SsePayload, LiveEvent schema, and enum remain unchanged.
        - >-
          Added explicit transport DTO mappings to evaluation-v1 resources via
          x-evaluation-v1-resource. UUID and version shapes, scopes, source
          kinds, evaluator kinds, evidence and review enums, component/model
          bindings, resource and execution provenance, reproducibility, and
          qualification dispositions preserve evaluation-v1 vocabulary while
          omitting content-bearing fields.
        - >-
          Declared the authenticated response cache policy no-store at the
          contract boundary. The API carries bounded metadata only and raw
          artifacts, case content, prompts, rubrics, responses, comments,
          rationale, hidden reasoning, storage locations, provider endpoints,
          credentials, tokens, owner identity, and arbitrary attributes remain
          outside the transport.
        - >-
          Corrected generated-client response resolution for reusable OpenAPI
          response components. listEvaluationDatasets now produces the contracted
          EvaluationDatasetPage and JSON response descriptor instead of void/none;
          all other evaluation page operations are protected by parity tests.
        - >-
          Corrected attempt transport semantics with a closed discriminated union:
          queued attempts may omit or null workerComponentId before claim, while
          every running or terminal attempt requires the persisted non-null
          worker component. Generated TypeScript preserves that distinction.
        - >-
          Aligned EvaluationJob provenance with the exact execution provenance
          already persisted in its admitted runner request envelope. The response
          no longer requires a separately fabricated ResourceProvenance digest.
  compatibility_notes:
    - >-
      Contract ID observatory-v1, semantic version 1.0.0, root security, every
      existing path and operationId, every existing request and response shape,
      and the original LiveEvent enum remain present. All AURA-0095 paths and
      schemas are additive.
    - >-
      Existing generated-client consumers retain their operation names and
      types. New operation descriptors and schema types are additive exports;
      no generated facade behavior, retry, authentication, persistence, SSE
      reconciliation, validation, confirmation, or feature state was added.
    - >-
      Corrected AURA-0095 command requirements were not part of a released
      producer. They replace transport shapes that the durable producer refused
      to admit; every pre-AURA-0095 path, schema, operation, and export is stable.
    - >-
      EvaluationJob and EvaluationAttempt are unreleased AURA-0095 response DTOs.
      Their corrected provenance and claim-state requirements align the producer
      with authoritative persisted facts without changing pre-AURA-0095 types.
    - >-
      EvaluationLiveEvent is delivered only by the additive dedicated evaluation
      stream. The operational SsePayload remains exactly Overview or LiveEvent,
      so existing stream producers, generated types, cursors, and consumers do
      not observe evaluation events or contract drift.
    - >-
      Transport DTOs are explicit privacy-preserving projections, not duplicate
      domain schemas. Producers must map admitted evaluation-v1 records to the
      closed DTO and must not serialize fields omitted by the OpenAPI boundary.
  producers:
    - >-
      Aura Observatory owner-authorized evaluation API and SSE application
      boundaries assigned to AURA-0095.
    - >-
      Aura Observatory evaluation definition, orchestration, artifact,
      calibration, qualification, and deletion services from AURA-0089 through
      AURA-0094, only through explicit DTO mapping.
  consumers:
    - >-
      Generated @aura/observatory-api-client transport types, descriptors, and
      the transport-only ObservatoryApiClient facade.
    - >-
      Aura Observatory Web evaluation feature libraries and same-origin SSE
      gateway assigned to AURA-0095.
    - >-
      Owner/operator CLI and browser acceptance tests, which must use the same
      application services and closed DTO validation.
  rollout:
    - >-
      Deploy the additive observatory-v1 producer before enabling evaluation
      Web routes. Keep REST snapshots authoritative and emit evaluation SSE
      notifications only after the corresponding persisted state is visible.
    - >-
      Regenerate the Angular client from the checked-in OpenAPI contract and
      reject generated drift in integration. Feature code consumes the public
      facade and owns reconciliation, confirmation, polling, recovery, and
      memory-only state.
    - >-
      Preserve owner BFF authorization, same-origin CSRF, idempotency, explicit
      destructive confirmation, no-store responses, bounded queries, and
      metadata-only SSE throughout producer rollout. Do not expose or transfer
      artifact bytes through these routes.
  generated_outputs:
    - frontend/libs/platform/observatory-api-client/src/lib/generated/observatory-api.ts
