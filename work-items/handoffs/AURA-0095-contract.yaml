decisions:
  - >-
    Preserved observatory-v1 1.0.0 because the surface is strictly additive;
    no existing operation, required property, enum, bound, or response variant
    was removed or narrowed.
  - >-
    Treated the corrected command requirements as pre-release AURA-0095
    alignment. Retaining the underspecified DTOs would preserve a producer
    boundary that intentionally rejected durable commands.
  - >-
    Used explicit transport projections instead of referencing JSON Schema from
    OpenAPI. This keeps generated clients transport-only while retaining exact
    evaluation-v1 identities, versions, finite enums, provenance, and
    reproducibility needed by owner workflows.
  - >-
    Kept artifact transfer outside the contract. Artifact resources expose only
    opaque identity, version, media classification and type, digest, byte count,
    capture classification, authorization-record reference, retention and
    deletion state, provenance, and timestamps.
  - >-
    Created a dedicated evaluation stream and descriptor rather than extending
    the operational SsePayload union. This preserves the existing operational
    stream and cursor boundary while keeping evaluation catch-up independently
    typed and additive.
  - >-
    Added a dedicated client test target because the AURA-0095 required check
    already names it and transport-only delegation and descriptor parity now
    have executable coverage.
  - >-
    Resolved reusable response components in the generator instead of inlining
    EvaluationDatasetPageResponse in OpenAPI. This preserves the valid reusable
    response and fixes generation for any future local response component while
    rejecting unsupported or missing response references explicitly.
  - >-
    Used separate queued and claimed attempt schemas rather than one nullable
    worker field. This makes absence state-dependent in both JSON Schema and the
    generated union and prevents non-queued attempts from silently losing their
    authoritative runner binding.
  - >-
    Reused EvaluationRunnerExecutionProvenance for jobs because it maps directly
    to requestData.provenance in EvaluationAdmission.envelope.data. A second
    digest-based summary would require unsupported derivation or new persistence.
  - >-
    Did not consult external documentation because dependency-version
    verification was not assigned and repository ADR-0016 plus the checked-in
    OpenAPI 3.1 generator define the applicable contract and client behavior.
risks:
  - >-
    OpenAPI cannot prove cross-record existence, authorization restrictiveness,
    immutable-version conflict semantics, cursor snapshot stability, deletion
    preservation, or exact evaluation-v1-to-DTO provenance. The producer must
    enforce those invariants before serialization.
  - >-
    The root no-store extension records the contract-wide policy, but each HTTP
    producer must still emit Cache-Control no-store and browser tests must prove
    that service workers and browser stores never persist authenticated data.
unresolved:
  - >-
    The Observatory worker must replace its durable-command unavailable branches
    with explicit adapters from these DTOs to SuiteDefinition,
    EvaluationAdmission, HumanReview, Qualification, and DeletionCommand, while
    preserving authoritative domain state.
  - >-
    The frontend and producer workers must agree on opaque resource history
    state values and partial-evidence presentation using these closed DTOs;
    free-form comments and artifact byte transfer remain intentionally absent.
  - >-
    Restart-safe evaluation SSE catch-up remains a producer migration blocker;
    no authorized append-only API event table exists. This contract correction
    does not authorize or simulate that persistence.
