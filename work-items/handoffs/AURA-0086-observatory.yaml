decisions:
  - Parsing, normalization, cycle detection, manifest hashing, and synchronization orchestration now live in the closed catalogue module behind ComponentCataloguePort; the CLI is a thin migration/sync entrypoint and persistence SQL is owned by the PostgreSQL adapter.
  - The no-argument migrate command retains its exact invocation and synchronizes packaged manifests after PostgreSQL migrations; the explicit sync-manifests command remains idempotent for operators.
  - Migration 0006 upgrades legacy dependency primary-key layouts to a generated edge identity, makes required_version nullable-safe, deduplicates legacy rows deterministically, and enforces identity with a unique expression index.
  - PostgreSQL contains only definitions and dependency edges. Production catalogue reads group complete components before pagination, while ClickHouse alone supplies observed versions, deployment presence, and observed time bounds.
  - Topology traversal uses visited/enqueued sets, exact depth, deterministic deduplication, unconstrained multi-version expansion, 1000-edge and max-node bounds, 64 direct IDs, and 200 reverse IDs.
  - Health trend points are ordered, time-bounded, version-filtered, and point-limited ClickHouse aggregates with contract-shaped start/end windows and summary values; retention does not touch definitions.
  - ClickHouse transport outages use a typed StorageUnavailableError and API 503 response; not-found and partial-health results remain distinct and broad exception swallowing was removed from catalogue resource reads.
  - Query resources retain successful duration/outcome instrumentation through the existing query decorator and component health path.
  - query-api manifest dependencies are explicitly declared as PostgreSQL and ClickHouse rather than inferred from browser code.
  - Topology edges are emitted for every bounded resolved, missing, or unavailable candidate, including unconstrained multi-version candidates; traversal stops at exact requested depth before expanding queued boundary nodes.
  - Component-definition and sibling topology/health routes preserve typed storage failures; query metric labels use only the predeclared bounded vocabulary so instrumentation cannot mask StorageUnavailableError and produce a false 400.
  - The query-api manifest declares PostgreSQL, ClickHouse, OIDC, login-state, and session-store dependencies at component level so synchronized topology reflects runtime providers.
  - The no-argument module entrypoint dispatches directly to the migration function, preserving the deployed Docker command while retaining explicit Typer subcommands for operator use.
  - Trend buckets use a canonical inner execution query with the same duration predicate and latest non-empty outcome selection as the summary, then aggregate one canonical execution per time bucket.
  - PostgreSQL read failures and ClickHouse HTTP status failures are translated at the query adapter boundary to StorageUnavailableError; the typed error retains HTTPStatusError compatibility for existing callers while API responses remain retryable 503s.
  - Component pagination applies the decoded component cursor and deterministic limit-plus-one bound independently in PostgreSQL and ClickHouse source queries. Complete component groups are merged without a hidden global source cap, and continuation remains source-backed when one source has duplicate component identifiers.
  - Filtered catalogue pages perform bounded, independently advancing source scans until the requested number of matching component groups is available or both sources are exhausted. Sparse observed-only and declared filters therefore continue through overlapping no-match batches; capped scans return a deterministic continuation fence without skipping either provider.
  - Dependency topology reserves each target node before emitting its edge; max_nodes truncation therefore marks partial without returning dangling edge targets, while exact-depth and deterministic visited/enqueued bounds remain intact.
  - PostgreSQL definition pages use a lateral per-component `LIMIT 64` ordered by version, so retained definition history is bounded before rows cross the adapter boundary while preserving complete selected component groups.
  - Component health uses a 24-hour default UTC window and rejects inverted or wider-than-31-day ranges. Direct, catalogue, and topology health paths carry explicit lower and upper ClickHouse predicates; topology shares one bounded window across its node lookups.
  - The query-resource decorator owns success and failure duration/outcome samples for every decorated use case; legacy method-level success instrumentation was removed to prevent duplicate metrics.
  - Decorated component collection reads the store directly on its legacy fallback path rather than calling the separately instrumented components() use case, so both public paths record exactly one metric sample per call.
  - Topology definition, observed-component, and reverse-dependency reads use limit-plus-one source caps (2001, 201, and 201 respectively). Any cap hit propagates `partial`, so omitted history or reverse relationships are never presented as complete.
  - Repository-pinned psycopg context-managed transactions and parameterized statements were used; no dependency or version changes were introduced and no network lookup was used because network access was not authorized.
