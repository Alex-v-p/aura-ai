decisions:
  - Retained the existing Aura Web Angular dev-server/build executors after a reversible Nx executor trial did not provide a verified rendered shell; the production build remains green and focused Playwright now verifies the shell and picker on fresh ports.
  - Added an owner-scoped attachment store with bounded client-side image validation, signature checks, pixel guard, upload progress, retry/removal, selected-set limits, and in-memory object URL cleanup.
  - Kept transport types in the generated client and used its finalized attachment operations; the conversation feature only owns presentation state and bounded selection view models.
  - Added accessible Upload, Documents, and Images picker views, ready-document selection, image reuse, chips, immutable transcript cards, authorized preview, unavailable tombstone presentation, responsive styling, and capability guidance.
  - Attachment selection remains in session memory until Core acceptance. The typed model_vision_required rejection keeps the draft and selected attachment set intact and presents safe recovery guidance without changing the selected model.
  - Edit-and-branch preloads and owns a separate editable attachment set, so removing a branch attachment cannot mutate the original transcript or the regular composer draft; regeneration continues through the server-owned immutable source set.
  - Direct PDF/DOCX uploads reuse DocumentsStore's 100 MB lifecycle and readiness state; Send remains gated while either image or document uploads/processes, and pre-send removal deletes accepted document/image objects before removing the chip.
  - The picker is a focus-trapped dialog with Escape and return-focus behavior, live limit errors, selected-state semantics, authorized thumbnail previews, governed image deletion, and controlled preview URL revocation.
  - Picker state hydrates per conversation and branch-edit state is independently preselected and editable; direct document and image uploads can be removed before send through their owning lifecycle APIs.
  - Vision guidance is derived from selectable models advertising the freshly returned vision capability; recommendation names are shown only when those verified model IDs are present.
  - Document gating reconciles selected attachment IDs against DocumentsStore readiness, while successful image uploads synchronize the active conversation draft immediately.
  - Reusable-image deletion requires confirmation, preserves rows for deleting/failed/storage responses, uses the server attachment version, and revokes its thumbnail only after terminal removal; preview focus returns to its actual opener and stale preview requests revoke late object URLs.
  - Model vision conflicts are keyed by conversation and selected model; changing model clears stale guidance, and the picker exposes native sibling controls with tablist/tabpanel semantics and filename-specific labels.
  - Model-vision guidance excludes the currently rejected model and only clears after switching to a different selectable model advertising freshly verified vision capability; the mocked 409 flow now retries through Qwen and Gemma.
  - Document readiness derives from the selected document's reconciled status, so stale queued upload rows do not permanently block a ready document while processing and failed/missing documents remain blocked; this has a focused readiness unit test.
  - Direct document upload rows reconcile against document polling, preserve document id/version and retryability, and offer safe processing retry or Remove after post-upload failures.
  - Attachment list, upload, preview, and thumbnail work is invalidated by reset epochs and abort controllers; principal changes close previews, revoke URLs, and prevent delayed responses from repopulating owner-private state.
  - Document upload status and retry/remove actions remain visible beneath the composer after the picker closes, and picker hydration no longer tears down a user-opened picker during the draft-to-conversation bootstrap transition.
  - Bootstrap migration carries text and selected attachments from the ephemeral draft id onto the first loaded conversation, preserving a user’s early composer input and allowing the Send gate to reconcile once documents become ready.
  - Successful direct image uploads explicitly publish their auto-selected set to the active conversation draft, including non-branch composer flows; this keeps the chip and admission payload synchronized after asynchronous upload completion.
  - A confirmed terminal image deletion also removes its completed upload-history row; failed, storage-unavailable, or deferred deletion rows remain visible with their retry controls.
  - Reusable-image deletion synchronizes the successful terminal result into both the picker selection and owning conversation draft, so no stale selected chip remains after the library row is removed.
  - Image deletion distinguishes `removed`, accepted asynchronous `deleting`, and `failed`; accepted deletion clears unsent selection immediately but retains an unavailable library status row, while failed deletion keeps the selection and retry controls.
  - Attachment acceptance publishes the accepted conversation identity alongside its revision; the panel clears its picker only when that identity is still selected, and store cleanup is addressed by conversation ID rather than the current selection.
  - Owner identity changes and logout clear conversations, drafts, attachment IDs, model-vision admission state, run state, subscriptions, and selection before the next owner hydrates; same-principal CSRF rotation does not discard drafts.
  - Bootstrap draft migration runs only when the draft is replacing the active selection; an independently retained draft cannot leak text or attachment IDs into the first persisted conversation.
  - An accepted deletion receipt is authoritative even when best-effort library refresh fails; epoch/abort guards still prevent a late refresh failure from repopulating reset state.
  - Attachment browser flows wait for the composer readiness marker before filling or opening controls, keeping bootstrap timing out of the feature assertions; the draft handoff remains covered by deterministic store/component tests.
  - Live composer text is handed off from the textarea before a bootstrap selected-conversation transition can apply a new `[value]` binding; configuration open/model selection and submit also synchronize the live control value into the owning draft map.
  - Selected direct-document readiness consults the reconciled upload row's terminal state, while nonterminal and failed rows remain blocking even if a stale library summary reports ready.
  - Initial conversation loading retains an actively edited draft (text or attachments) as the selected conversation instead of replacing it with the first persisted conversation; this makes bootstrap preservation deterministic rather than timing-dependent.
  - Storage deletion failures preserve image library rows and their delete/retry controls when owner-scoped items remain; global storage fallback is rendered only for an empty library. Vision guidance explicitly identifies failed verification and names verified alternatives.
  - Bootstrap owner reset is transition-only: initial auth loading does not reset attachment signals, while logout and issuer+subject changes still clear private state; selection hydration reads the attachment map untracked and compares opaque keys before publishing.
  - Deletion confirmation is a trapped alertdialog with filename-specific actions and focus restoration; failed/storage/deleting rows remain visible and retry with their current server version and fresh idempotency key.
  - Full-stack attachment acceptance asserts a non-empty image-grounded assistant response and non-empty citations, waits for branch completion, regenerates with the refreshed version, waits for regeneration completion, and only then deletes with a freshly read attachment version.
  - Direct document readiness and model_vision_required Playwright fixtures use DOMContentLoaded navigation to avoid the local dev server's unresolved load-event resources while still exercising the rendered shell when available.
  - Added a direct-document browser fixture that asserts the upload row reconciles to failed processing, exposes Retry processing, preserves the selected chip and Send gating, then returns to ready after retry.
  - Added Storybook attachment states for uploading, processing, failed, ready, unavailable tombstone, and model-vision guidance; the browser accessibility matrix runs each in light and dark themes and verifies preview focus restoration.
  - Updated Storybook attachment fixtures for the generated discriminated union: available summaries retain media, byte count, and image dimensions, while unavailable summaries are content-free with the literal unavailable display label, octet-stream media type, and zero byte count; the tombstone accessibility assertion covers that presentation.
  - Added responsive Playwright fixtures for picker keyboard/focus behavior, image auto-selection and deletion recovery, 409 draft preservation/model recovery, and full-stack PDF/DOCX/PNG/JPEG/WebP upload, grounding, vision admission, branching, regeneration, and tombstone deletion.
risks:
