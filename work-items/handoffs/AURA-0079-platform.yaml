decisions:
  - Core API, worker, and scheduler Compose services explicitly render AURA_ENVIRONMENT=production so deployment metadata is consistent across all telemetry-producing roles.
  - Observatory BFF origin, OIDC, cookie, and owner validation is API-role-only; worker and migration roles still load and validate storage credentials without requiring browser identity settings.
  - The pinned Collector's OTLP HTTP exporter is explicitly configured with JSON encoding to match Observatory's standard OTLP/HTTP JSON decoder.
  - Observatory composition explicitly declares its dependency on the service-owned authentication module in the architecture registry.
  - Observatory deployment is opt-in through the observatory Compose profile; the default Aura stack has no Observatory dependency.
  - Observatory uses a dedicated API, worker, migration job, PostgreSQL, ClickHouse, Valkey session store, Collector, and browser web service on private networks; only observatory-web publishes loopback port 4300.
  - Persistent Observatory data is mounted below AURA_STATE_ROOT and runtime credentials are injected through file-backed Compose secrets.
  - Observatory BFF sessions use a dedicated Valkey namespace, opaque rotated cookies, server-side provider tokens, exact issuer/audience/owner-subject checks, and origin-aware CSRF for logout/state changes.
  - Authentik receives a separate Observatory OAuth client/application and strict callback; owner authorization remains in the Observatory BFF.
  - Disposable local HTTP configuration is represented by a non-secure cookie only when explicitly selected; production settings require stable HTTPS, secure cookies, matching callback origin, and a configured owner.
risks:
  - The stock Collector wire is accepted on both its signal-specific OTLP paths and the deployed internal compatibility aliases; a container-level Collector acceptance run remains an integration-stage check.
  - The web container is an isolated deployment seam pending the separately owned Observatory frontend implementation; no Aura product UI was added in this slice.
