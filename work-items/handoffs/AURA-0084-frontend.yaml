decisions:
  - >-
    The browser receives only finite recovery states: initial, expired,
    explicit_logout, logout_unconfirmed, callback_failed, callback_denied, and
    identity_unavailable. Provider values and server error text are never used
    as browser copy.
  - >-
    Authentication retry runs the same session-load lifecycle as startup and
    reconnects SSE only after a successful session and REST snapshot. The
    identity-unavailable retry is the primary action; owner sign-in remains a
    secondary same-origin link.
  - >-
    Logout reports explicit_logout only after a 204 response or a 401 already-
    absent response. 403, 5xx, network, and missing-CSRF failures clear visible
    private state but preserve the opaque in-memory CSRF value for a
    logout_unconfirmed retry and never claim sign-out completed.
  - >-
    The auth_recovery query marker is consumed once with history.replaceState;
    unknown values are removed without being rendered. Native same-origin
    links preserve only a bounded local return path and never carry credentials.
  - >-
    Session loss continues to clear snapshots, filters, selected traces,
    retention state, component health, and deferred request generations through
    the existing store invalidation path. sessionRequired remains available for
    existing feature compatibility.
  - >-
    Recovery heading focus is deferred until auth status is known or changes;
    authenticated initial loading does not steal focus. Static polite live
    announcements, visible programmatic-heading focus styling, responsive
    actions, and reduced-motion rules cover the browser recovery surface.
  - >-
    Observatory-scoped dark-mode token overrides preserve semantic contrast for
    the canvas, surfaces, text, focus, status, and destructive actions. Mocked
    browser coverage asserts dark and reduced-motion preferences.
  - >-
    The browser return-path sanitizer mirrors the server's bounded relative-path
    policy: it normalizes key names before applying the exact denylist and
    credential suffix/prefix rules, strips every fragment, removes callback,
    identity, content, request, provider, endpoint, and credential variants,
    and preserves benign Observatory filters.
  - >-
    Authenticated API responses remain in memory only. No browser storage,
    service-worker cache, URL token, or bearer credential was introduced.
  - >-
    Parallel resource authentication failures are promoted through the
    lifecycle catch before partial snapshot assembly; ordinary resource
    failures retain the existing authenticated partial-data behavior, and the
    load sequence guard remains authoritative for late results.
  - >-
    Live SSE notifications update the latest event ID immediately and use a
    timer-free one-active-plus-one-trailing refresh coordinator. A burst cannot
    starve snapshot publication or create unbounded concurrent loads; session
    loss cancels pending trailing work.
  - >-
    Live refreshes query only overview and runs, preserving the last full
    components/deployments snapshot and resource states. Their session and
    auth-generation guards mirror full loads, while full manual loads retain
    the complete resource set.
  - >-
    Session bootstrap awaits only the observation surface before opening SSE;
    components and deployments use an independent bounded background
    coordinator with its own generation guard, so slow catalog work cannot
    block connection or create overlapping full loads.
  - >-
    Components navigation explicitly requests the existing catalog coordinator
    once on entry. Repeated live events remain overview/run-only, while an
    in-flight startup catalog request is coalesced with the entry request.
  - >-
    Auth focus transitions reset on checking: initial authenticated startup does
    not steal focus, repeated recovery failure focuses the recovery heading,
    and successful recovery focuses the stable authenticated main landmark.
