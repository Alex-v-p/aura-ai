decisions:
  - >-
      The default runner starts a disposable internal Compose topology with
      docker compose up --detach --wait, observes every dependency through its
      health and protocol boundary, and tears it down with volumes afterward.
      Providers remain disabled, evidence is metadata-only, and nothing is
      published.
  - >-
      --all-upstream-checks derives the mandatory AURA-0142 through AURA-0147
      inventory from the archived work items, reruns current-state-compatible
      commands byte-for-byte, and validates repository-state-sensitive commands
      from immutable integration reports and resolvable commit identities. It
      never rewrites active work-item paths.
  - >-
      The evaluation adapter consumes the worker-owned gate helper and emits the
      strict aura0148-gate-report-v1 contract; missing, duplicate, malformed, or
      failed decisions are release-gate failures.
  - >-
    Python and Playwright acceptance commands emit metadata-only JUnit-derived
    test IDs, counts, assertion counts, and outcomes; Playwright receives a
    dynamically reserved loopback port to avoid shared-worker server collisions.
    The versioned acceptance-inventory-v1 manifest is checked before fixture
    or evaluator execution and requires exactly 25 Python and 33 Playwright
    IDs; missing, duplicate, extra, and replacement IDs fail closed.
  - >-
    Research-route fixture assertions bind to the complete dedicated
    `/research` journey observation, matching the evaluation owner's canonical
    Playwright ID. Admission-only evidence cannot satisfy those 12 checks.
  - >-
    The synthetic frontend uses HTTP so the acceptance path does not depend on
    Cloudflare Tunnel, Nginx Proxy Manager, or TLS termination.
  - >-
    Every exact pytest command receives newly created databases. The runner
    provisions only the pgvector dependency required by the disposable image
    and injects missing advertised coordinates such as AURA-0055 and
    AURA-0149; it does not pre-run migrations, seed application rows, or alter
    recorded commands.
  - >-
    Broad full-Core commands scrub AURA_TEST_DATABASE_URL, AURA_TEST_NATS_URL,
    AURA_TEST_VALKEY_URL, and AURA_TEST_DEPENDENCIES_ISOLATED so conditional
    legacy semantics remain byte-for-byte compatible. A temporary JUnit option
    is injected through the subprocess environment solely to bind skip
    summaries to exact node IDs; the report is disposable. Dedicated live
    commands receive fresh isolated coordinates and reject every skip,
    including an entry present in the broad legacy allowlist.
  - >-
      legacy-conditional-skips-v1.json is an immutable allowlist of exact
      source-line/reason/node-ID tuples. Governed workflow recovery nodes are
      covered only by the immutable integrated AURA-0150 report; all other
      governed nodes are never accepted solely by allowlist and require mapped
      green dedicated coverage. No production content or provider output is
      retained.
