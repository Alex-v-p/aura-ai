    Added a canonical typed BriefingNotification browser fixture using only
    opaque schedule, occurrence, and result identifiers. The test asserts that
    the notification detail remains usable before the dedicated result route
    exists and that acknowledgement still works through the source-neutral API.
  - >-
    Added Today coverage proving briefing notifications remain navigation-only,
    point to the canonical notification detail route, do not place the result
    identifier in an href, and do not displace reminder or conversation cards.
  - >-
    Added the briefing Storybook state to the existing light/dark Axe matrix,
    asserting the dedicated-result control is disabled until its route exists.
    Existing legacy reminder tests remain unchanged and continue to cover
    reminder rendering and completion behavior.
  - >-
    No production code, transport contract, golden, threshold, or baseline was
    changed by this evaluation slice.
  - >-
    The remaining mobile failure was an invalid test interaction: the test
    opened the drawer while already on /notifications, only inspected the
    active same-route link, and then clicked content beneath the still-open
    inert drawer. No NavigationEnd could close it. The E2E now closes the
    drawer explicitly, then closes the detail dialog before reopening the
    drawer for the responsive navigation assertion; no product same-route
    behavior change is required.
  - >-
    The Today retry test now targets the scoped accessible action label rather
    than the generic visible text, preserving the exact retry request count
    and reminder/conversation request upper bounds.
