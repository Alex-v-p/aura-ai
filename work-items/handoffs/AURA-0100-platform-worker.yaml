decisions:
  - >
    Restored the base read-only NATS entrypoint bind in the local-http
    !override volume list next to the disposable project-scoped data volume.
    Removed only the redundant node-ID acquisition and cluster-layout mutation
    commands from the dependent Observatory Garage bootstrap because the
    successful aura-garage-bootstrap dependency already owns cluster layout.
    Distinct-bucket, secret-file, fail-closed key import, grant/deny, and
    permission verification behavior remains unchanged.
  - >
    Garage access IDs now use secrets.token_hex(12). Existing valid IDs are
    preserved byte-for-byte. Garage secrets now use secrets.token_hex(32) and
    require exactly 64 lowercase hexadecimal characters, with at most one
    final newline. Both credential kinds use bounded reads. Only an absent
    value or a normalized path equal to one of the three launcher-managed
    defaults may rotate a securely permissioned invalid regular file, using a
    same-directory 0600 O_EXCL/O_NOFOLLOW temporary file, file and parent
    directory fsync, and os.replace; a genuinely custom invalid path fails
    closed without rotation.
  - >
    Evaluation worker and scheduler healthchecks now invoke the packaged
    interpreter at /app/.venv/bin/python with stdlib-only /proc process
    identity probes for the exact service module argv prefix. Their own -c
    healthcheck processes cannot self-match; CMD form, timing, and all other
    service configuration remain unchanged.
  - >
    Core Garage key import and read/write grant output is suppressed on both
    stdout and stderr because Garage can echo the file-injected access-key ID.
    Nonzero results remain fail-closed with generic bounded errors. The
    Observatory and evaluation bootstrap commands already suppress output for
    key import and bucket grant/deny operations, and their verification output
    remains captured rather than logged.
