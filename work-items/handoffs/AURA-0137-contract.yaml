decisions:
  - >-
    Reused WorkflowVersionCommand for both retirement resources so optimistic
    concurrency stays consistent without adding command behavior to the schema.
  - >-
    Returned the full WorkflowDefinition and WorkflowRevision resources after
    retirement so consumers can reconcile authoritative lifecycle metadata in
    one no-store response; the Core producer must not return a partial object.
  - >-
    Mirrored the existing workflow-events v1 families in the SSE envelope and
    added only a content-free heartbeat. Persisted lifecycle rows, rather than
    ephemeral wakeups, remain replay truth.
  - >-
    Kept revision publication and retirement in one closed lifecycle family and
    constrained both to UUID revision lineage through an object-level schema
    union; definition retirement is the only variant that permits null lineage.
  - >-
    Represented pre-execution identity by omission rather than null. The closed
    WorkflowStepState union permits pending steps to omit stepExecutionId and
    requires a UUID for every other status; generated clients therefore expose
    an optional string without embedding status-transition behavior.
  - >-
    Kept Aura v1 at 1.22.0 because this is an additive completion of the
    workflow family introduced at that contract version, not a new API family
    or incompatible wire revision.
