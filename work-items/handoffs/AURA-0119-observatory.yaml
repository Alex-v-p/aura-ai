    - >-
      Second-review regressions pass for strict production envelope validation: no
      fixture/test bypasses, closed delivery/admission/category/classification/state
      bindings, scanner/policy revision allowlists, and the 1,500,000-byte wire
      ceiling with a 1,048,576-byte evidence ceiling.
    - >-
      Collision and rejection paths are content-free and durable: collision records
      commit before terminal failure, malformed rejections retain only server-derived
      IDs, bounded wire byte count, bounded reason, and timestamp, and Garage-before-
      manifest failures compensate or enter the restart-recoverable orphan queue.
    - >-
      Deletion intent/progress/failure/completion commits are restart-recoverable with
      distinct audit IDs; the worker resumes committed deletion intents and orphan
      compensation; zero-byte objects are persisted and verified; object streams are
      bounded and digest-verified before the HTTP response is constructed.
    - >-
      Inspection completeness aggregates the full run across pages, stable UUIDv5 step
      IDs and truncation reasons, while SSE uses an Observatory-owned mixed-source
      high-water cursor and polls later run-evidence changes without replaying unknown
      producer cursors.
    - >-
      ADR operation spans are emitted for serialization, queue offer, transport publish,
      validation, dedupe, manifest/object writes, object delete/stream, deletion
      finalize, metadata/manifest queries, and inspection merge with bounded latency,
      source trace/parent/run correlation, and finite error dimensions. Manifest and
      object latency histograms are recorded at their owning persistence boundaries.
    - >-
      Non-captured state/admission bindings are fail-closed: excluded, dropped, and
      deleted envelopes require exactly not_applicable admission, while credential,
      secret, and bearer rejection reasons require a complete rejected_prohibited_material
      attestation. Postgres deletion uses a run-scoped advisory fence across API and
      recovery work, and a completed tombstone permanently rejects later captured
      evidence for that run. Deleted manifests clear content-derived fingerprints,
      including existing deleted rows during migration upgrade.
    - >-
      Inspection page and run-wide summary are read through one repeatable-read
      PostgreSQL snapshot, with all summary bindings verified against the real
      PostgreSQL adapter on one connection; transaction setup uses SET TRANSACTION
      as the first psycopg statement and an opt-in live test verifies a concurrent
      insert is excluded from the page and aggregate. Failed deletion attempts
      finalize successfully removed objects as deleted while retaining the failed
      target's object key and captured state for recovery retry; resumed counts
      accumulate the durable prior progress. Each acknowledged Garage delete now
      atomically transitions its manifest and increments that durable count, with
      a crash-boundary regression proving restart recovery cannot expose a missing
      captured object or double-count. Producer IDs are scanned for bearer/AWS/
      GitHub credential material before persistence.
    - >-
      Required run-evidence evaluator names have executable bounded outputs through
      evaluate_run_evidence_projection, and ADR error classes plus manifest/object/
      deletion boundary histograms are emitted without content-derived labels. The
      inspection service invokes those evaluators at runtime and retains only their
      bounded results; stream failures emit content-free failure spans. Validation
      latency is recorded at the validation boundary before repository I/O, and
      deletion retry regressions preserve durable failed-target state. Successful
      deletion finalization retains target trace/parent correlation, emits the
      end-to-end deletion latency exactly once at the service boundary, and API
      missing-evidence spans are ordinary unavailable outcomes with no outage
      error class and run correlation. Progress count assignment occurs only after its transaction
      commits; a regression that fails count persistence after manifest transition
      proves recovery retains the DB-authoritative count without double counting.
      The Postgres adapter regression verifies that the run-level session fence
      is acquired exactly once and does not self-deadlock by reacquiring an
      xact-level lock on a second pooled connection.
