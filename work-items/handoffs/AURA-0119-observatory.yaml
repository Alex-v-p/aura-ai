decisions:
  - >-
    PostgreSQL stores only bounded manifests, delivery/collision/deletion
    state, content-free audits, and metadata-only SSE cursors; evidence bytes
    remain in the dedicated Garage bucket.
  - >-
    Inspection snapshots never include payloads, object keys, evidence bytes,
    or content-bearing SSE fields. Evidence is available only through the
    owner-authorized bounded REST stream.
  - >-
    Durable NATS storage failures are retryable and are not ACKed; malformed
    or prohibited envelopes are terminal and ACKed after bounded rejection.
