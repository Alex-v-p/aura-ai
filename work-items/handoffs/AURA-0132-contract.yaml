decisions:
  - The public notification source is a structural closed union so the pre-existing reminder JSON shape remains valid byte-for-byte and briefing notifications cannot invent reminder identifiers.
  - Briefing notification metadata contains only opaque schedule, occurrence, and result identifiers; clients derive the later dedicated result destination without receiving briefing content in the inbox or event stream.
  - Schedule source grants require reminder inclusion and explicit bounded Aura calendar and document identifiers; current ownership, readiness, connection, and authorization remain runtime admission responsibilities rather than ambient background authority.
  - A skipped occurrence creates no result, so skipped is an occurrence outcome while result outcomes remain completed, partial, failed, canceled, unknown, or deleted.
  - Schedule deletion tombstones the schedule and prevents future admission but cannot cascade into occurrence history or result deletion; each retained data class has a separately named explicit command.
  - Event contracts intentionally expose no local timezone value, source identifiers, source content, result content, prompt, owner identity, provider field, or executor-specific state.
risks:
  - OpenAPI can constrain timezone syntax but cannot prove that a timezone exists in the deployed IANA database; future Core create and admission paths must validate it authoritatively.
  - Cross-field lifecycle invariants such as which terminal occurrence states require a result are application rules for AURA-0133 and are intentionally absent from the transport-only generated client.
  - Existing handwritten notification consumers must narrow the generated Notification union before reading reminderId; the concurrent frontend ownership zone is responsible for that migration.
unresolved:
  - Briefing schedule, occurrence, and result persistence, admission, execution, notification production, and lifecycle enforcement remain explicitly deferred to AURA-0133.
  - Briefing routes and management UI remain unavailable until the later frontend slice; this contract alone does not expose product behavior.
