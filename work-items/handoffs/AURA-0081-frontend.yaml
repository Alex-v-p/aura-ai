decisions:
  - Observatory is a separate Angular application and feature library; the shell imports only the Observatory public API and generic shared UI.
  - All REST access is routed through the generated observatory-v1 transport client and a same-origin fetch adapter with no-store credentials; feature components do not call fetch directly.
  - The live EventSource URL is derived from the generated `streamEvents` operation path rather than duplicating an API route in feature code.
  - Session bootstrap and logout use the generated `getOwnerSession`/`logoutOwnerSession` observatory-v1 operations behind the narrow gateway auth adapter; the CSRF token is captured from `OwnerSession` in an in-memory gateway field, overrides the retention mutation header, and is cleared on logout/session expiry.
  - Owner sign-in links derive the anonymous `startOwnerLogin` path and bounded `return_to` query from the generated contract; no hard-coded auth endpoint is embedded in feature templates.
  - Live state is reconciled from the REST snapshot and same-origin EventSource notifications; no authenticated response, SSE payload, or session value is written to Workbox, localStorage, sessionStorage, or IndexedDB.
  - Manual reconnect uses the gateway reconnect port to close and clear the errored EventSource before opening a new one; the store preserves disconnected state until the replacement stream fires `open`.
  - The feature store depends on the injected Observatory gateway/live port; concrete fetch/EventSource wiring is provided by the observatory-web application composition root.
  - Named SSE events are registered explicitly, stale server timestamps are surfaced, partial resource failures preserve successful panels, and each runs/components/deployments panel exposes its own loading, empty, stale, or unavailable state.
  - Authenticated feature components are conditionally mounted only for an active owner session; logout/session expiry resets filters and invalidates load, trace, component-health, and retention continuations so private operational state cannot reappear after sign-out.
  - Retention completion invalidates selected traces and component-health caches; component-health reads are deduplicated while in flight and trend samples expose accessible names and values.
  - Component-health request tokens are invalidated on retention completion and only their owning token may clear an in-flight marker, preventing pre-retention completions from publishing or deleting a newer request guard.
  - Component trend requests are prefetched from an Angular lifecycle hook via a queued microtask; template evaluation is read-only, avoiding signal writes during change detection.
  - Retention requests require explicit browser confirmation and send CSRF, confirmation, and idempotency headers; completion polling refreshes the Observatory snapshot.
  - Trace rows are rendered as a keyboard-accessible tree with parent depth, duration waterfall, outcome, and partial/missing-parent indicators.
  - Trace topology uses semantic list markup with screen-reader depth text rather than a partially implemented ARIA tree widget; selected-run loading/error/retry, local panel retries, reconnect control, and trend-loading states are explicit.
  - Storybook includes deterministic loading, healthy, empty, stale, partial, disconnected, service-unavailable, owner-session-required, partial-trace, trace-error, retention-progress, and retention-failure fixtures without adding dependencies or importing Aura product feature libraries.
  - Retention failure codes are retained as secondary reference diagnostics while known storage, conflict, and cancellation outcomes receive calm recovery guidance; the MVP is intentionally light-theme only.
  - Observatory library declaration compilation sets rootDir to the frontend workspace because its public imports intentionally resolve shared UI and the generated observatory-v1 client source; this keeps standalone library type checking valid without changing ownership boundaries.
risks:
  - EventSource reconnection relies on the browser-managed Last-Event-ID header; the API remains responsible for persisted catch-up semantics.
  - The repository-wide Storybook build requires a 768 MiB Node heap cap in this environment even though focused Observatory checks pass at 512 MiB.
