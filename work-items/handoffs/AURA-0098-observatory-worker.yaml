decisions:
  - >-
    Exposed case_versions_for_selection on the existing typed
    EvaluationDefinitionRepository port and call it directly from result
    scoring; the previous dynamic adapter lookup was removed so exact
    membership resolution remains an explicit, service-owned boundary.
  - >-
    Resolved selected case versions through the existing Observatory-owned
    definition repository boundary and the exact dataset membership rows,
    including non-1.0.0 versions. Missing or inconsistent membership now
    raises permanent validation, while repository failures remain storage
    failures for retryable redelivery; completed results cannot be acknowledged
    with silently missing score coverage.
  - >-
    Added an optional result-scorer port to orchestration. Completed runner
    results settle first, then invoke deterministic scoring through the
    existing definition and ClickHouse score ports; projection failures are
    bounded and cannot reopen jobs or delay Core activity.
  - >-
    Used a deterministic UUID derived from result and case identity and the
    existing ReplacingMergeTree score store so retries and duplicate result
    deliveries remain idempotent.
  - >-
    Converted only the closed runner provenance projection into score
    provenance. The runner carries no typed replay content, so the initial
    projection records explicit not_observed coverage rather than fabricating
    evidence or persisting content.
  - >-
    Preserved local-judge admission and execution as an existing independent
    worker path; no endpoint, contract, migration, provider, or artifact
    boundary was added.
  - >-
    Replaced cross-test private helper imports with self-contained typed
    definition builders and completed the local repository and score-store
    protocol doubles, keeping aggregate Pyright strict without ignores.
  - >-
    Terminal-result acknowledgement is now deferred until the durable
    result projection and deterministic score projection succeed. Retryable
    PostgreSQL/ClickHouse failures propagate without acknowledgement so NATS
    redelivery repairs missing scores; permanent definition validation is
    acknowledged safely. Stable score IDs make redelivery, restart, and
    duplicate delivery converge without duplicate terminal state.
  - >-
    Declared ClickHouse as the evaluation-orchestration score-projection
    dependency and included it in the bounded dependency and result-consumption
    metric definitions. The deterministic evaluator manifest already owns its
    definition-state and ClickHouse score-store dependency; orchestration now
    reflects the existing injected projection port without adding a component,
    contract, or provider edge.
risks:
  - >-
    The v1 runner request carries case IDs without case versions; the
    Observatory definition repository therefore resolves the immutable case
    version from the admitted dataset membership rather than expanding the
    transport contract.
  - >-
    Full-stack score persistence still depends on the composed ClickHouse
    service and seeded definitions; Docker startup and browser acceptance are
    aggregate integration responsibilities.
  - >-
    ClickHouse score failures already emit their application-level storage
    metric/span; the orchestration retry wrapper preserves that single
    attribution and does not add a second dependency count.
