decisions:
  - >-
    The platform outbox remains generic: it owns stage_command, transactional
    persistence/replay, and a durable JSON JetStream consumer parameterized by
    subject and domain parser. It does not import or name execution.tasks.
  - >-
    The execution.tasks transport owns TaskSourceInvalidated v1 parsing,
    schema-exact command construction, source lifecycle staging, and the
    task-specific consumer adapter over the generic platform consumer.
  - >-
    Source lifecycle ports stage invalidations in the same transaction as
    workflow, briefing, document, and memory mutations; lifecycle and task
    outbox records use distinct deterministic IDs.
  - >-
    Generic outbox staging checks pending session.new rows before the
    no-autoflush database lookup, accepts an identical envelope exactly once,
    and raises a deterministic ValueError for staged or persisted same-ID
    envelope conflicts before commit.
  - >-
    Task invalidation delivery uses the execution-owned adapter over a dedicated
    durable JetStream pull consumer; valid deliveries are acknowledged only
    after callback reconciliation, while malformed poison messages are
    terminally acknowledged.
  - >-
    Migration 0030 remains execution-only. Memory's positive lifecycle version
    is added/backfilled by reversible knowledge.memory-owned migration 0031,
    with a positive database CHECK and matching ORM constraint.
  - >-
    Live platform acceptance uses the repository-standard
    AURA_TEST_DATABASE_URL plus AURA_TEST_DEPENDENCIES_ISOLATED=1 and the
    operator-provided AURA_TEST_NATS_URL; the prior private migration URL is no
    longer read by these tests.
