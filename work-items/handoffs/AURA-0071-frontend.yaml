decisions:
  - >-
    The frontend slice now preserves one idempotency key per edit/regenerate
    intent, reconciles ambiguous outcomes before retry, gates send and
    configuration while branch state loads, maps branch failures to safe copy,
    restores action focus, and removes root-only branch chrome after recovery.
    Reconciliation may advance the conversation version without changing the
    original retry key; a new edit draft starts a new intent.
  - >-
    Branch controls use generated API operations, owner-safe opaque URL query
    state, session-only branch data, and explicit focus restoration for edit,
    cancel, conflict retry, and branch navigation.
  - >-
    Definitive branch action failures (401/403/404) now clear pending intent,
    use operation-specific safe copy, and expose no retry; list/select
    permission and not-found failures likewise suppress impossible retries.
  - >-
    The aura-conversations Nx target uses a positional Vitest project path so
    Vitest 5 resolves the workspace include globs correctly; the exact required
    target now passes.
