decisions:
  - >-
    Kept aura-v1 at 1.22.0 because every new resource and field is additive;
    existing callers can omit or ignore the additions, while the generated
    TypeScript client is synchronized to the complete contract.
  - >-
    Made research questions, seed URLs, domains, source metadata, excerpts,
    titles, artifact digests, and source display values available only through
    owner-authorized no-store REST bodies. Events and Task Center SSE carry
    opaque identifiers, versions, bounded states, and timestamps only.
  - >-
    Defined task-source invalidation with exactly source kind, source ID, and
    source version beyond the standard versioned event envelope. Added closed
    TaskProjectionSnapshotQueryV1 and TaskProjectionSnapshotV1 live/rebuild
    boundary definitions exclusively to the internal execution contract so
    projection status, owner scope, progress, and capabilities are resolved
    through source-owned module APIs without direct table access or private
    display content. These nondelegable authority-bearing types are excluded
    from aura-v1 and the generated browser transport client.
  - >-
    Preserved Run.citations and Message.citations byte-for-byte as legacy
    DocumentCitation arrays. Added optional webCitations arrays for validated
    task-scoped ResearchCitation values, so existing citation consumers remain
    compatible and research citations cannot be confused with document
    evidence.
  - >-
    Separated positive admitted ResearchBudget values from zero-capable
    ResearchBudgetConsumption values. Active research details require
    validated citations, while every pending, failed, unknown, and completed
    deletion response is a closed content-free tombstone.
  - >-
    Kept business behavior out of schemas and generated code. The contracts
    close transport vocabularies, bounds, mutation guards, privacy, lineage,
    and truthful deletion states; runtime authorization, transitions,
    persistence, provider selection, sanitization, and reconciliation remain
    in their owning implementation work items.
  - >-
    Preserved explicit non-cascading research deletion through the required
    deleteLinkedArtifacts boolean defaulting false, and separated known cleanup
    retry from unknown-outcome reconciliation for both research and artifacts.
  - >-
    Registered the research, generated-artifact, and task event contracts as
    explicit dependency-free event-contract modules. This makes contract
    ownership visible to repository architecture validation without adding a
    runtime dependency edge.
risks:
  - >-
    The aggregate contract suite retains two pre-existing AURA-0132
    notification baseline failures. They are unrelated to AURA-0141 and were
    deliberately not changed.
  - >-
    Generated clients expose optional webCitations immediately, so exhaustive
    consumers should tolerate validated web and deleted-research citation
    variants before research producers are enabled. Legacy citations remain
    unchanged.
