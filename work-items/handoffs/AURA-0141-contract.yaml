contracts:
  changed: true
  id: aura-v1
  version: 1.22.0
  compatibility: backward_compatible
  producers:
    - Aura Core research application API and lifecycle-event publisher
    - Aura Core generated-artifacts application API and lifecycle-event publisher
    - Aura Core execution Task Center projection API and task-source invalidation publisher
    - Aura Core conversation and run snapshot/event publishers
  consumers:
    - generated Aura TypeScript transport client
    - AURA-0142 Core generated-artifacts implementation
    - AURA-0143 Core federated Task Center implementation
    - AURA-0145 durable governed-research coordinator
    - AURA-0146 conversational research admission and completion delivery
    - AURA-0147 Aura Web research, task, and artifact features
  rollout: >-
    Additive producer-first rollout. Deploy the new Core producers and
    metadata-only event publishers before enabling consumers; the regenerated
    client may ship earlier because all new paths and fields are optional to
    existing callers. Keep research admission and provider capabilities
    disabled until their later runtime and security work items pass. Existing
    clients continue using aura-v1 1.22.0 and may omit or ignore every added
    field. Rollback disables admission and new consumers while retaining the
    additive schemas and readable task, artifact, and deletion history.
  generated_outputs:
    - frontend/libs/platform/aura-api-client/src/lib/generated/aura-api.ts
  notes: >-
    Adds owner-authorized no-store research settings, admission, detail,
    evidence, cancellation, one-time extension, deletion, cleanup retry, and
    reconciliation resources; generated text-artifact list, detail, immutable
    revision, preview, download, deletion, retry, and reconciliation resources;
    and Task Center list, detail, metadata-only SSE, cancel, and retry
    resources. New research, artifact, task-source invalidation, source-owned
    internal task projection snapshot, and additive run-event schemas are
    closed and versioned. The internal projection boundary is defined only in
    the execution event contract and is absent from public OpenAPI and the
    generated browser client. Active and deleted resource representations are discriminated;
    deleted research immediately excludes private content and artifact
    tombstones retain only required integrity truth. web.research@1 is
    represented only by an opaque admission result. No public artifact
    upload/revision mutation, provider transport, storage reference, executor
    behavior, or Observatory dependency is present.
