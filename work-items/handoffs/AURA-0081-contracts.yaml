decisions:
  - Kept contract id observatory-v1 and version 1.0.0 because this is an additive documentation of existing endpoints, not a breaking protocol revision.
  - Used the shared X-Observatory-CSRF parameter so logout and retention retain one same-origin anti-CSRF header contract.
  - Modeled login initiation as an anonymous browser-navigation descriptor with a void/no-content transport type because its successful result is an HTTP 307 redirect, not a JSON response.
  - Kept the OIDC callback outside observatory-v1 because it is a provider-facing server endpoint rather than an application-owned browser client operation.
  - Represented logout as a bodyless command with a void response and responseMode none, preventing generated transports from attempting JSON parsing on HTTP 204.
  - Kept the OwnerSession shape independently closed and minimized to csrfToken; subject, display name, provider tokens, issuer, session identifiers, cookie values, expiry data, roles, and arbitrary claims remain excluded.
risks:
  - A consuming transport must explicitly honor responseMode none; treating every successful operation as JSON would fail on the logout 204 response.
  - The CSRF token is intentionally browser-readable for same-origin state changes, so consumers must retain it in memory only and clear it on logout or unauthorized responses.
unresolved:
  - Observatory Web has adopted generated session and logout operations; its frontend owner still needs to derive sign-in navigation from startOwnerLogin instead of hard-coding the login path.
