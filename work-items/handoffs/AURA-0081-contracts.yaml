  definitions:
    - id: observatory-v1
      version: 1.0.0
      source: contracts/openapi/observatory-v1.yaml
      changes:
        - Added the existing anonymous GET /api/v1/auth/login initiator as startOwnerLogin with a bounded same-origin return_to query, an explicit anonymous security override, and typed 307 Location metadata; the provider-facing callback remains excluded.
        - Added GET /api/v1/auth/me as getOwnerSession with a closed data-minimized OwnerSession response containing only the ephemeral anti-CSRF value.
        - Added the existing POST /api/v1/auth/logout command as logoutOwnerSession with the required X-Observatory-CSRF header, empty 204 success, and typed anti-CSRF denial.
        - Taught the deterministic transport generator to describe successful no-content responses as responseMode none and regenerate logoutOwnerSession with a void response.
        - Added contract invariants for anonymous login and local return paths, callback exclusion, redirect metadata, operation identity, a CSRF-only response shape, owner-identity exclusion, CSRF constraints, empty logout response, and logout request/header behavior.
  compatibility_notes:
    - The three operations document already-deployed Observatory BFF routes; existing observatory-v1 operations, fields, request requirements, and response types are unchanged.
    - The additions are new operations and one new response schema, so existing consumers remain source- and wire-compatible within observatory-v1 1.0.0.
    - Owner identity remains excluded from every contract response. The CSRF value is confined to the authentication control-plane response and remains excluded from observations, queries, SSE payloads, telemetry, URLs, generated behavior, and browser persistence.
    - The generated client remains transport-only: it adds types and operation descriptors but no login, logout, authorization, retry, persistence, or feature-state policy.
  producers:
    - Aura Observatory owner BFF GET /api/v1/auth/login endpoint
    - Aura Observatory owner BFF GET /api/v1/auth/me endpoint
    - Aura Observatory owner BFF POST /api/v1/auth/logout endpoint
  consumers:
    - Observatory Web session gateway and owner shell
    - Observatory Web unit, browser, and full-stack acceptance tests
    - Observatory OpenAPI compatibility and generated-client drift checks
  rollout:
    - Regenerate and deploy Observatory Web against the additive client after the existing Observatory API; no backend rollout or migration is required because both routes already exist.
    - Replace hand-authored frontend auth endpoint strings and response types with getOwnerSession, logoutOwnerSession, and OwnerSession from the generated client.
    - Derive the sign-in navigation href from OBSERVATORY_API_OPERATIONS.startOwnerLogin.pathTemplate and URLSearchParams for an optional local return_to; navigate the browser to that same-origin href rather than executing it as a fetch.
    - Keep OwnerSession and its CSRF value in memory only, clear them on logout or unauthorized responses, and return undefined for the generated no-content logout response rather than parsing JSON.
