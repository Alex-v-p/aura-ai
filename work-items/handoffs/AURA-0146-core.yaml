decisions:
  - Built-in Aura policy revision 4 remains document-only and immutable; revision 5 is an additive web.research policy and agent revision with the exact research:run permission.
  - Terminal delivery consumes a bounded source-authorized snapshot containing only persisted compact answer, validated citations, authorized artifact references, outcome/recovery, version, mode, and origin; deleted or stale versions fail closed.
  - Research admission persists typed origin metadata, and worker recovery can reconcile a missing conversation or dedicated delivery record before acknowledgement.
  - Conversational admission reloads the committed source-owned origin before registering delivery; destination identifiers are parsed only from that persisted origin and are checked against the owner/run lineage.
  - Dedicated research deliveries are notification-only; conversational deliveries append once before independently retryable notification settlement.
  - Worker delivery failures use bounded JetStream nack/redelivery and the loop remains supervised rather than terminating.
  - ScoreV1 evaluators are production-owned, closed, typed, replay-keyed, and reject content-bearing observations.
  - web.research@1 is admission-only, exact research:run scoped, idempotent per originating run/call, and bounded by the existing 30-second tool executor timeout.
  - Completion append and notification use distinct durable idempotency keys; unknown append/notification outcomes remain retryable without duplicating the other side.
  - Delivery accepts only the narrow terminal snapshot; dedicated origins bypass transcript append but settle one idempotent notification before acknowledgement.
  - Source-owned research delivery claims are durable, row-locked, lease-bounded, and shared with deletion serialization so an active append/notification settlement cannot race a deletion tombstone.
  - Deletion clears synthesized answers as well as evidence/citations, and detail/evidence reads remain content-free for tombstones.
  - Terminal artifact references are capped at eight and reauthorized through the artifact public service for exact owner, active lifecycle, and task lineage before delivery.
  - Successful web.research admission appends a deterministic bounded acknowledgement directly and completes the originating run without a second synthesis/provider call.
  - SQL conversation UoW persists research origin/activity while locking the originating run row; coordinator no longer treats this persistence as optional.
  - Workflow notification source replacement constraints retain ordinal bounds 1 through 8, and conversation Message validation caps artifact references at eight.
  - SQL completion delivery reauthorizes issuer/subject against the conversation owner and serializes duplicate appends with a transaction advisory lock.
  - Research completion delivery omits deleted research content and records skipped_deleted state rather than reintroducing evidence.
  - Delivery claim acquisition and deletion admission use the same source research-row lock and transaction; deletion reloads the locked row, rejects unexpired claims, advances the authoritative version, and never copies stale task claim fields.
  - ResearchCompletionDeliveryService.deliver is statically snapshot-only and retains a defensive TypeError for non-snapshot callers.
  - Conversation and run reads resolve research citation lifecycle through the public owner-scoped research query port; deleted sources project only DeletedResearchCitation with sourceId and the fixed deleted label, without URL, locator, timestamps, excerpts, or artifact relations.
  - SQL conversation reload invokes the research projection even when no attachment/document adapters are configured, preserving the content-free deletion fence after restart.
  - AppState binds its composed ResearchApplicationService to the conversation store after construction in both testing/memory and production/SQL composition, with an API regression covering message and run payloads.
  - Legacy conversation rows and SimpleNamespace fixtures hydrate absent additive research fields as empty metadata; migration revision remains bounded as 0033_research_delivery while retaining down_revision 0032_governed_research.
  - Provider execution remains outside this slice and is reached only through the AURA-0145 public research application boundary.
