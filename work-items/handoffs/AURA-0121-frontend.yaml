decisions:
  - >-
    The selected-run projection now loads the authoritative getRunInspection
    snapshot alongside existing metadata and trace projections. Inspection
    failure remains truthful and does not hide usable metadata.
  - >-
    Evidence bytes are fetched only when an owner opens a captured manifest,
    held in memory only, rendered as escaped text/JSON or an approved image
    preview, and cleared when closed or the selected run changes.
  - >-
    The existing CSRF/idempotent deletion route is used with its exact
    DELETE_RUN_EVIDENCE confirmation; deletion progress remains explicit while
    metadata stays visible.
  - >-
    Timeline, trace spans, phase records, measurements, and evidence manifests
    are bounded in the view so delayed/repeated delivery cannot create an
    unbounded document.
  - >-
    Observatory navigation and workspace status use a closed semantic SVG icon
    vocabulary. Overview distinguishes current health from lifetime counters and
    exposes an accessible bounded trend; Components, Analytics, Compare, Evaluation,
    Experiments, Operations, and Retention expose bounded, labelled, truthful states.
  - >-
    Mobile closed-drawer state is explicitly hidden and non-interactive at compact
    widths, preventing a transformed residual rail from clipping the 390px workspace.
  - >-
    Evidence disclosure uses request generations and selected-manifest identity checks;
    collapse, run changes, later selections, and component destruction revoke object URLs
    and clear in-memory text before any late response can be displayed.
  - >-
    Evidence transport is abortable and session-expiry aware. Responses fail closed
    unless the manifest byte count, media type, classification, and bounded 1 MiB
    allowlist all agree; no unapproved blob is decoded or previewed.
  - >-
    Destructive evidence deletion keeps one in-memory idempotency key per selected run,
    gates duplicate requests, and polls accepted/in-progress work within a bounded
    window until authoritative inspection reports deleted or a truthful non-converged
    state is shown.
  - >-
    Run invalidations refresh only matching metadata-only run events, while inspection
    freshness remains distinct from detail readiness. Authoritative manifests drive
    coverage labels, and repeatable events are aggregated before the timeline bound so
    terminal and failure outcomes remain visible.
  - >-
    A live inspection replacement must preserve an open disclosure only when the
    authoritative manifest remains captured with the same evidence ID, media
    classification/type, digest, and byte count. Any capture-state or immutable
    manifest change clears the store blob and component text/object URL immediately.
  - >-
    The selected-run inspector uses a bounded abortable load with a ten-second
    timeout and explicit retry state. Trace and inspection rows expose treeitem
    levels, parent step/span lineage, start offsets, and parallel-branch styling;
    status and branch decoration uses the Observatory SVG icon vocabulary.
  - >-
    Product shell copy now distinguishes private operational metadata monitoring
    from owner-disclosed governed evidence. Runs flag model/trace-limited
    historical projections without changing the authoritative stored duration.
  - >-
    Storybook now has isolated Runs, Components, and Analytics destination
    fixtures covering loading, empty, stale, disconnected, partial/error,
    limited/deleted, bounded large-run, and narrow-screen states; Trace adds
    deleted-evidence, bounded-large-inspection, and narrow-screen fixtures.
  - >-
    Selected-run refreshes inspect both settled projections before handling a
    metadata failure: inspection-only session expiry follows the global signed-
    out purge, while a fulfilled deleted inspection revokes disclosed evidence
    even when detail or trace timed out. Operations alert legends use the same
    semantic SVG vocabulary as the rest of Observatory.
  - >-
    Inspection and raw trace tree ARIA positions now use sibling-relative
    position and set size for root, nested, and parallel branches rather than
    flattened sequence indexes; focused tests cover both trees.
