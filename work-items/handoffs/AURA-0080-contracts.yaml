  compatibility: backward_compatible
  definitions:
    - id: observatory-v1
      version: 1.0.0
      source: contracts/openapi/observatory-v1.yaml
      changes:
        - Added the owner-cookie-protected Observatory REST contract for overview, paginated run search, run and trace detail, component health, deployment catalogue, and asynchronous retention commands.
        - Added authenticated same-origin SSE with Last-Event-ID catch-up and metadata-only change notification types.
        - Added strict closed metadata response schemas, opaque stable cursors, bounded identifiers, UTC instants, typed errors, and distinct delete-before and purge-all command bodies.
        - Added mandatory anti-CSRF, idempotency, and exact destructive-confirmation headers to retention action creation.
        - Replaced invalid extension of the closed RunSummary schema with an independently closed RunDetail schema, and added bounded cursor continuation to run observations and trace spans.
  compatibility_notes:
    - This is the first published observatory-v1 OpenAPI contract, so it does not remove or tighten an earlier public Observatory contract.
    - New optional metadata-only fields and new operations may be added compatibly in the 1.x line; removing operations or fields, adding required request fields, weakening owner controls, or widening capture beyond metadata_only requires explicit authorization and a versioned breaking change.
    - The generated client is transport-only and contains no retry, authorization, retention, reconciliation, or product-feature behavior.
  producers:
    - Aura Observatory owner-facing API and SSE entrypoint
    - Aura Observatory query and retention application services
  consumers:
    - The separate Observatory Angular application introduced by AURA-0081
    - Observatory full-stack acceptance and contract evaluators
  rollout:
    - Deploy the Observatory API, its PostgreSQL and ClickHouse migrations, and retention worker before serving the generated client from Observatory Web.
    - Regenerate and verify the client on every observatory-v1 contract change; do not hand-edit generated output.
    - Keep authenticated API responses and SSE data out of browser or Workbox persistence, and preserve same-origin cookie authentication throughout rollout.
