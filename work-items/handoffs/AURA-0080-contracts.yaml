decisions:
  - The JSON-form OpenAPI 3.1 document is the source of truth so the repository's required json.tool check and deterministic generator do not require a YAML parser.
  - Query types expose bounded operational metadata only; source prompts, responses, memories, document content, filenames, tool payloads, credentials, endpoints, bearer tokens, arbitrary attributes, and owner identity are excluded.
  - Run cursors are opaque and trace spans are contractually returned in deterministic parent-child order without exposing arbitrary OpenTelemetry attributes.
  - RunDetail is independently closed rather than extending closed RunSummary through allOf; the contract invariant check rejects a recurrence of that invalid JSON Schema composition.
  - Run and trace detail pages are bounded at 10000 items and expose partial plus an opaque nextCursor for continuation.
  - The owner browser authenticates only with the opaque HttpOnly Observatory session cookie; credentials are not query parameters, client state, or SSE URLs.
  - Delete-before and purge-all are separate discriminated request shapes so an omitted cutoff cannot be interpreted as purge-all.
  - Generated output contains readonly transport types and operation descriptors only; application behavior remains in Observatory-owned services and frontend feature libraries.
risks:
  - Future query dimensions require deliberate bounded schema additions; arbitrary attribute maps remain prohibited.
