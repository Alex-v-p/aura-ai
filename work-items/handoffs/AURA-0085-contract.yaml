decisions:
  - Kept contract id observatory-v1 and version 1.0.0 because the resource, optional overview field, schemas, and event value are additive and remove no accepted input or output.
  - Represented self-monitoring as one closed snapshot shared by the overview and history resource so current and historical semantics cannot drift.
  - Capped history pages at 200 and exposed only opaque cursors and UTC bounds; unbounded arrays, arbitrary groupings, arbitrary labels, and arbitrary attributes remain prohibited.
  - Capped durations at ten minutes and lags at seven days; intake lag is explicitly non-negative, derived only after validation, and clamps future-skewed input to zero.
  - Used finite health-state and rejection-reason enums aligned with the existing OTLP classifier, with aggregate counts only and no submitted values or exception text.
  - Kept health.changed as a metadata-only invalidation notification in the existing LiveEvent envelope rather than embedding diagnostic history in SSE.
  - Generated the TypeScript output with the repository generator and added no business behavior to the client.
risks:
