decisions:
  - ADR-0017 records owner-enabled production evidence as a separate one-way asynchronous channel; ordinary OTLP and SSE remain metadata-only.
  - Exact payloads use explicit serializers; prohibited credential material and provider-hidden reasoning have no captured payload representation.
  - Evidence retrieval uses an approved-media Blob response rather than a generic octet-stream or JSON buffer.
  - Application JSON evidence uses RFC 8785 canonical bytes; text uses exact UTF-8 content bytes; every attachment uses decoded base64 bytes, including JSON and text attachments.
  - Stable event and evidence identifiers collide independently if reused with changed immutable evidence; exact retries are idempotent and have distinct delivery identities.
  - Existing metadata-observation-v2 remains unchanged: telemetry uses only its trace/span/run correlation and supported finite dimensions; event/evidence identity and capture/media state remain in the separate run-evidence channel.
  - Existing observatory-v1 version remains 1.0.0 because all operations and schemas are additive and existing operation shapes are unchanged.
risks:
  - Runtime consumers must enforce evidenceKind/payload-kind agreement, digest and byte-count verification, duplicate collision rejection, and ordering semantics during the follow-up ingestion work.
  - Browser runtime must implement zero persistence, inert rendering, and screenshot exclusion; these are not transport-client behaviors.
unresolved:
  - Follow-up work items must implement Core serializers/export isolation, Observatory PostgreSQL and dedicated Garage storage, API behavior, UI, and full-stack failure tests in the approved sequence.
