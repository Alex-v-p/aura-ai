decisions:
  - >-
    Observatory Web now uses a service-owned Angular production build and an
    unprivileged Nginx runtime instead of a placeholder Nginx image.
  - >-
    Nginx listens on container port 8080, binds the published port only to
    loopback, proxies same-origin API and SSE traffic without buffering or
    caching, and serves only static shell assets from its read-only image.
  - >-
    The full-stack runner creates disposable fixture environment and override
    artifacts, uses project-scoped named volumes and environment-sourced
    secrets, bridges only test containers to the fixture provider, supplies both
    product origins with owner OIDC variables, runs the real browser acceptance,
    stops Observatory services, reruns only the existing spec outage test to
    submit a normal Core request, and probes Core liveness/readiness before
    cleanup.
  - >-
    The module registry retains the Observatory generated client and feature
    library registrations against generic shared UI; the deployable Angular
    application shell is intentionally not registered, matching the existing
    absence of Aura application-root entries, and no Aura product feature
    dependency was introduced.
  - >-
    The Observatory Web Dockerfile-specific ignore file mirrors the existing
    web-image safety exclusions, removes credentials, state, and test artifacts
    from the build context, excludes unrelated repository roots, and re-includes
    only the Dockerfile and Nginx configuration needed by the production image.
  - >-
    The full-stack runner allocates two non-overlapping /28 private subnets by
    inspecting existing Docker IPAM and selecting from bounded fallback pools,
    so it can coexist with the normal Aura private-network defaults. Cleanup
    selects only networks prefixed with the disposable Compose project and runs
    with all Observatory/check profiles enabled, covering partial startup.
  - >-
    The runner keeps only transient Compose environment and override artifacts
    beneath an external temporary directory; state is held in project-scoped
    named volumes and fixture secrets are environment-sourced, while the exit
    trap removes the temporary artifacts.
  - >-
    The disposable Compose override replaces every selected state-root bind with
    project-scoped named volumes and replaces production file-backed secrets
    with fixture-only environment-sourced secrets using !override. Cleanup uses
    --volumes and an idempotent signal-safe trap, so a partial startup cannot
    retain state volumes or re-enter after the fixture directory is removed.
  - >-
    The repository-wide Docker ignore protects every root-context image built by
    the runner from .git, .env*, .secrets, .aura-e2e.*, state, and generated
    test artifacts while retaining required source trees. Its deployment
    ownership is registered for platform validation; the existing Aura Web
    Dockerfile-specific ignore is extended with the same credential and state
    exclusions because Dockerfile-specific rules take precedence.
  - >-
    The disposable override resets host-published ports for both web services;
    browser traffic uses their isolated Compose networks, so an existing Aura
    stack cannot cause 4200/4300 host-port allocation conflicts.
