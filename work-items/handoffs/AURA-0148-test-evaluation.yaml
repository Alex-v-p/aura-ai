decisions:
  - Synthetic fixtures are versioned, bounded, task-scoped, and content-safe; no production research content or fetched pages are captured or replayed.
  - The release gate is fail-closed: missing, duplicate, malformed, mismatched, or below-threshold results produce a failed decision.
  - Destination scoring is derived from observed deterministic outcomes through Core, static-fetcher, and browser-fetcher policy functions; the corpus includes mixed DNS, encoded IPs, metadata aliases, and redirect rebinding without egress.
  - Every non-research evaluator is mapped to immutable, machine-readable Python or Playwright observation records with exact producer test IDs, pass outcomes, and assertion counts; missing, failed, duplicate, or extra observations fail closed. The adapter does not score fixture shape or hardcoded booleans.
  - Observation binding uses exact canonical test IDs and requires exactly one match per evaluator; multi-viewport records remain in the executed evidence envelope but cannot be silently concatenated into one evaluator observation.
  - All executable evaluation fixtures are loaded through immutable filename, schema, revision, and SHA-256 provenance checks; checked-in fixture mutation fails closed before an observation can pass. Test commands set PYTHONDONTWRITEBYTECODE=1 and the evaluation tree is bytecode-free.
  - The content-free report contract uses an exact closed metadata schema, finite enums and bounded counts, complete cross-field status/count consistency, and recursive rejection of identifiers, digests, URLs, queries, content, secrets, filenames, object keys, and canaries.
  - Accessibility checks scope axe to route-owned controls and semantics because the existing application shell owns a duplicate-main landmark baseline; keyboard/focus/dialog, live recovery, reduced-motion, light/dark/forced-colors, mobile, and 200% zoom checks remain active.
  - The gate emits a bounded metadata-only report contract and validates the checked-in report manifest using a closed recursive allowlist; no replay key or content-bearing value enters the report.
  - Release thresholds are fail-closed against a trusted immutable per-evaluator floor map and exact top-level policy (`failClosed`, fixture provenance, real-provider disablement, and non-public report policy); checked-in policy may only raise a floor.
  - Chat-origin mode journeys wait for the app's authoritative conversation-ready state and then assert Send is enabled before submitting; this isolates bootstrap timing without bypassing the real composer or lifecycle assertions.
