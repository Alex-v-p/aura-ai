decisions:
  - Used one atomic resource union and one atomic lifecycle-event union so each v1 contract has a single version, resolver boundary, and compatibility surface without duplicated common definitions.
  - Used only JSON Schema 2020-12 and repository-established closed-object conventions; no generated client or business behavior was added.
  - Centralized failure classification in evaluation-failure-codes-v1 so results and events cannot independently accept open, exception-derived, or provider-derived categories.
  - Reused the strict lowercase UUID definition for idempotency rather than introducing a user-controlled string namespace; generation and provenance remain service responsibilities.
  - Kept authorization as an opaque record identifier and purpose instead of owner identity, claims, credentials, or provider details.
  - Required authorizationContext controlled_evaluation for every capture classification and an authorization record for every non-metadata classification; ordinary production telemetry remains outside these contracts.
  - Kept evaluation content in a narrow UntrustedContent definition and all durable events content-free; storage and transport must preserve this separation.
  - Made content-bearing capture a distinct authorization branch, prohibited metadata_only and hashed content/artifact references, required non-empty content artifact arrays, and made downstream authorization-strength checks an explicit consumer obligation.
  - Made exact execution provenance self-contained on requests and result-bearing resources so reproducibility does not depend on private Core state or an implicit mutable deployment.
  - Represented unavailable score evidence explicitly and required uncertainty metadata rather than synthesizing a value from missing observations.
  - Kept local_judge as a bounded evaluator kind but deliberately omitted model inventory, prompt templates, rubric text, seeds, calibration datasets, and advisory thresholds reserved for AURA-0094.
  - Kept baselines immutable with explicit manual promotion metadata while leaving statistical comparison and promotion workflow to AURA-0096.
  - Did not consult online documentation because dependency-version verification was not assigned and the repository already fixes JSON Schema 2020-12 and applicable architecture decisions.
risks:
  - JSON Schema can close structures and bound strings but cannot prove that authorized free text is semantically free of credentials or instructions; later producers must scan and classify content, and every consumer must treat it as inert data.
  - JSON Schema cannot compare capture-policy restrictiveness across separately resolved artifact records; storage, API, and runner consumers must enforce that referenced artifacts are authorized at least as restrictively as their enclosing resource.
  - Portable JSON Schema cannot require event, correlation, and causation UUIDs to differ or prove digest correctness; later producers and consumers must enforce those semantic invariants.
  - Downstream work must map these contracts without adding raw content to durable events, telemetry, logs, metrics, SSE, URLs, or browser persistence.
