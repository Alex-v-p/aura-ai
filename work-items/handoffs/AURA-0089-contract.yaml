    - id: evaluation-v1
      version: 1
      source: contracts/evaluation/v1/evaluation.schema.json
      changes:
        - Added one atomic JSON Schema 2020-12 resource union with distinct closed dataset, case, suite, evaluator, score, request, result, artifact, experiment, baseline, and replay definitions.
        - Added stable UUID identities, bounded semantic versions, UTC timestamps, SHA-256 integrity, idempotency keys, explicit component and evaluator versions, deterministic limits, and reproducibility evidence.
        - Distinguished synthetic, owner_supplied, and captured cases and the public_project, private, sensitive, and environment scopes without portable owner identity.
        - Required explicit controlled-evaluation authorization purpose, capture classification, and manual-only retention; metadata_only cases reject content, digests, and artifact references, while content-bearing classifications require an opaque authorization record.
        - Split metadata_only, hashed, and content-bearing capture authorization into structurally distinct branches; metadata_only and hashed cases and replays cannot carry artifact references, while Artifact records accept only redacted, sampled_content, or full_content authorization.
        - Required every content-bearing artifact-reference array to contain at least one opaque UUID and documented the consumer invariant that each referenced artifact authorization must be at least as restrictive as its enclosing case or replay.
        - Restricted content to a closed inert input/expected/context shape and documented that it cannot grant instruction, permission, policy, path, provider, endpoint, credential, object-key, or execution authority.
        - Bound requests and result-bearing resources to exact dataset, suite, evaluator, component, code, image, configuration, model, deployment, prompt, policy, fixture, seed, clock, locale, budget, deadline, and concurrency evidence without embedding raw content.
        - Distinguished deterministic, local_judge, and human_review evaluators and required explicit evidence state, outcome, uncertainty, rubric, and calibration metadata where applicable so absent evidence is never inferred.
        - Prohibited both score value and outcome when evidence is not_observed or not_applicable; both remain mandatory only for observed evidence.
        - Defined artifact metadata using only opaque UUID references, integrity, media classification, capture authority, manual retention, and deletion-scope categories; filenames, endpoints, bucket names, paths, credentials, provider object keys, and bytes are absent.
        - Defined declarative experiments and replay evidence without selecting an executor, transport, storage provider, queue, or runtime behavior.
        - Required service-generated non-secret UUID idempotency keys and rejected exact duplicate experiment variants while preserving the existing two-to-sixteen bound.
        - Defined immutable candidate and manually owner-promoted baseline states with opaque promotion records, immutable result sets, and bounded thresholds; automatic promotion and protected repository baseline mutation are not authorized.
    - id: evaluation-events-v1
      version: 1
      source: contracts/events/evaluation/v1/evaluation-events.schema.json
      changes:
        - Added exactly evaluation.requested, evaluation.completed, evaluation.cancelled, and evaluation.failed durable lifecycle events.
        - Required stable event, correlation, causation, request, job, attempt, and idempotency identifiers plus bounded request, dataset, and suite provenance hashes and versions.
        - Kept event data content-free and closed; completion carries only a result identity/digest and opaque artifact-reference UUIDs, while cancellation and failure carry bounded codes rather than comments, exceptions, payload excerpts, or provider diagnostics.
        - Excluded raw input, output, prompts, rubrics, comments, artifact content, credentials, endpoints, filenames, provider object keys, owner identity, arbitrary attributes, and hidden reasoning.
        - Reused the finite evaluation-failure-codes-v1 taxonomy for failed lifecycle events instead of accepting arbitrary producer or provider-derived codes.
    - id: evaluation-failure-codes-v1
      version: 1
      source: contracts/evaluation/v1/failure-codes.schema.json
      changes:
        - Added one finite content-free provider-neutral taxonomy shared by evaluation results and failed durable events.
        - Limited failures to request-invalid, deadline, resource-limit, dependency-unavailable, execution, result-validation, storage, and internal categories.
        - Required producers to map internal failures before publication and prohibited exception text, provider diagnostics, payload excerpts, credentials, endpoints, and content-derived codes.
