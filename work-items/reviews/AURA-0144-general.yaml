checked:
  - >-
    Re-read the active work item, ADR-0018, current Contract, Core, Platform,
    Test/Evaluation, and integration handoffs, and traced every prior General
    finding through the integrated contract, clients, folded SearXNG adapter,
    static and browser providers, deployment overlay, module registry,
    dependency locks, and tests.
  - >-
    Verified all prior repository findings are closed: stock SearXNG is
