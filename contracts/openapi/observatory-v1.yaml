        }
      },
      "HealthPoint": { "type": "object", "additionalProperties": false, "required": ["startAt", "endAt", "summary"], "properties": { "startAt": { "$ref": "#/components/schemas/UtcInstant" }, "endAt": { "$ref": "#/components/schemas/UtcInstant" }, "summary": { "$ref": "#/components/schemas/HealthSummary" } } },
      "ComponentHealth": { "type": "object", "additionalProperties": false, "required": ["componentId", "summary", "points"], "properties": { "componentId": { "$ref": "#/components/schemas/ComponentId" }, "summary": { "$ref": "#/components/schemas/HealthSummary" }, "points": { "type": "array", "maxItems": 1000, "items": { "$ref": "#/components/schemas/HealthPoint" } } } },
      "Deployment": {
        "type": "object", "additionalProperties": false,
        "required": ["deploymentId", "gitCommit", "environment", "hostId", "serviceRoles", "firstSeenAt", "lastSeenAt"],
        "properties": { "deploymentId": { "$ref": "#/components/schemas/SafeLabel" }, "gitCommit": { "type": "string", "pattern": "^[0-9a-f]{7,64}$" }, "environment": { "type": "string", "minLength": 1, "maxLength": 32, "pattern": "^[a-z][a-z0-9_.-]{0,31}$" }, "hostId": { "$ref": "#/components/schemas/SafeLabel" }, "serviceRoles": { "type": "array", "maxItems": 4, "uniqueItems": true, "items": { "type": "string", "enum": ["api", "worker", "scheduler", "cli"] } }, "firstSeenAt": { "$ref": "#/components/schemas/UtcInstant" }, "lastSeenAt": { "$ref": "#/components/schemas/UtcInstant" } }
      },
      "DeploymentCollection": { "type": "object", "additionalProperties": false, "required": ["items", "snapshotAt"], "properties": { "items": { "type": "array", "maxItems": 1000, "items": { "$ref": "#/components/schemas/Deployment" } }, "snapshotAt": { "$ref": "#/components/schemas/UtcInstant" } } },
      "LiveEventType": { "type": "string", "enum": ["observation.changed", "retention.changed", "health.changed", "heartbeat"] },
      "LiveEvent": {
        "type": "object", "additionalProperties": false,
        "required": ["schemaVersion", "eventId", "eventType", "occurredAt", "resourceType", "resourceId", "capturePolicy"],
        "properties": { "schemaVersion": { "type": "integer", "const": 1 }, "eventId": { "$ref": "#/components/schemas/Uuid" }, "eventType": { "$ref": "#/components/schemas/LiveEventType" }, "occurredAt": { "$ref": "#/components/schemas/UtcInstant" }, "resourceType": { "type": "string", "enum": ["observation", "run", "trace", "component", "deployment", "retention", "system"] }, "resourceId": { "type": ["string", "null"], "maxLength": 128, "pattern": "^[A-Za-z0-9._:-]+$" }, "capturePolicy": { "type": "string", "const": "metadata_only" } }
      },
      "SsePayload": { "oneOf": [{ "$ref": "#/components/schemas/Overview" }, { "$ref": "#/components/schemas/LiveEvent" }] },
      "DeleteBeforeRequest": { "type": "object", "additionalProperties": false, "required": ["action", "cutoff"], "properties": { "action": { "type": "string", "const": "delete_before" }, "cutoff": { "$ref": "#/components/schemas/UtcInstant" } } },
      "PurgeAllRequest": { "type": "object", "additionalProperties": false, "required": ["action"], "properties": { "action": { "type": "string", "const": "purge_all" } } },
      "CreateRetentionActionRequest": { "oneOf": [{ "$ref": "#/components/schemas/DeleteBeforeRequest" }, { "$ref": "#/components/schemas/PurgeAllRequest" }], "discriminator": { "propertyName": "action", "mapping": { "delete_before": "#/components/schemas/DeleteBeforeRequest", "purge_all": "#/components/schemas/PurgeAllRequest" } } },
      "RetentionActionStatus": { "type": "string", "enum": ["queued", "running", "succeeded", "failed"] },
      "RetentionAction": {
        "type": "object", "additionalProperties": false,
        "required": ["actionId", "action", "cutoff", "status", "createdAt", "startedAt", "finishedAt", "deletedObservationCount", "deletedReceiptCount", "deletedRunCount", "failureCode"],
        "properties": { "actionId": { "$ref": "#/components/schemas/Uuid" }, "action": { "type": "string", "enum": ["delete_before", "purge_all"] }, "cutoff": { "oneOf": [{ "$ref": "#/components/schemas/UtcInstant" }, { "type": "null" }] }, "status": { "$ref": "#/components/schemas/RetentionActionStatus" }, "createdAt": { "$ref": "#/components/schemas/UtcInstant" }, "startedAt": { "oneOf": [{ "$ref": "#/components/schemas/UtcInstant" }, { "type": "null" }] }, "finishedAt": { "oneOf": [{ "$ref": "#/components/schemas/UtcInstant" }, { "type": "null" }] }, "deletedObservationCount": { "type": "integer", "minimum": 0 }, "deletedReceiptCount": { "type": "integer", "minimum": 0 }, "deletedRunCount": { "type": "integer", "minimum": 0 }, "failureCode": { "type": ["string", "null"], "maxLength": 64, "pattern": "^[a-z][a-z0-9_.-]*$" } }
      }
    }
  }
}
