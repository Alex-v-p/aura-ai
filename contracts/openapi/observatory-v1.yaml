{
  "openapi": "3.1.0",
  "info": {
    "title": "Observatory v1",
    "version": "1.0.0",
    "description": "Owner-only Observatory authentication, metadata-only query, live-notification, and manual-retention transport. Prompts, responses, memory or document content, filenames, tool arguments or results, credentials, endpoints, bearer tokens, arbitrary attributes, and owner identity are outside this contract; the authentication resource exposes only an in-memory anti-CSRF value.",
    "x-contract-id": "observatory-v1",
    "x-capture-policy": "metadata_only"
  },
  "servers": [{ "url": "/", "description": "Same-origin Observatory BFF" }],
  "security": [{ "observatorySession": [] }],
  "tags": [
    { "name": "Authentication" },
    { "name": "Overview" },
    { "name": "Health" },
    { "name": "Runs" },
    { "name": "Traces" },
    { "name": "Components" },
    { "name": "Analytics" },
    { "name": "Comparisons" },
    { "name": "Deployments" },
    { "name": "Live" },
    { "name": "Retention" }
  ],
  "paths": {
    "/api/v1/auth/login": {
      "get": {
        "operationId": "startOwnerLogin",
        "tags": ["Authentication"],
        "security": [],
        "description": "Start the owner OIDC flow from a browser navigation. The provider-facing callback is intentionally server-owned and excluded from this browser transport contract.",
        "parameters": [
          { "name": "return_to", "in": "query", "required": false, "description": "Bounded same-origin path used after authentication; absolute and protocol-relative URLs are not permitted.", "schema": { "type": "string", "pattern": "^/(?:$|[^/].*)$", "maxLength": 2048, "default": "/" } }
        ],
        "responses": {
          "307": { "description": "Temporary redirect to the configured OIDC provider", "headers": { "Location": { "required": true, "schema": { "type": "string", "format": "uri" } } } }
        }
      }
    },
    "/api/v1/auth/me": {
      "get": {
        "operationId": "getOwnerSession",
        "tags": ["Authentication"],
        "description": "Return the active owner BFF session anti-CSRF value without exposing owner identity. The value is held in memory and sent only in the header of state-changing same-origin requests.",
        "responses": {
          "200": { "description": "Active owner session anti-CSRF metadata", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OwnerSession" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/api/v1/auth/logout": {
      "post": {
        "operationId": "logoutOwnerSession",
        "tags": ["Authentication"],
        "description": "Revoke the active owner BFF session and clear its opaque cookie. An absent or expired session is also cleared idempotently.",
        "parameters": [{ "$ref": "#/components/parameters/CsrfToken" }],
        "responses": {
          "204": { "description": "Owner session revoked or already absent; the session cookie is cleared" },
          "403": { "$ref": "#/components/responses/Forbidden" }
        }
      }
    },
    "/api/v1/overview": {
      "get": {
        "operationId": "getOverview",
        "tags": ["Overview"],
        "responses": {
          "200": { "description": "Current system and ingest health snapshot", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Overview" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/health/history": {
      "get": {
        "operationId": "listHealthHistory",
        "tags": ["Health"],
        "description": "Return a bounded, newest-first history of content-free Observatory self-monitoring snapshots. Cursors are opaque and every page is capped independently of the requested time range.",
        "parameters": [
          { "$ref": "#/components/parameters/Cursor" },
          { "$ref": "#/components/parameters/PageSize" },
          { "name": "from", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/UtcInstant" } },
          { "name": "to", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/UtcInstant" } }
        ],
        "responses": {
          "200": { "description": "Bounded self-monitoring history ordered by descending observation time and snapshot identifier", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/HealthHistoryPage" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/runs": {
      "get": {
        "operationId": "listRuns",
        "tags": ["Runs"],
        "parameters": [
          { "$ref": "#/components/parameters/Cursor" },
          { "$ref": "#/components/parameters/PageSize" },
          { "name": "status", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/RunStatus" } },
          { "name": "component", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/ComponentId" } },
          { "name": "model", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/SafeLabel" } },
          { "name": "deployment", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/SafeLabel" } },
          { "name": "from", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/UtcInstant" } },
          { "name": "to", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/UtcInstant" } }
        ],
        "responses": {
          "200": { "description": "Runs ordered by descending observed time and opaque run identifier", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RunPage" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/runs/{run_id}": {
      "get": {
        "operationId": "getRun",
        "tags": ["Runs"],
        "parameters": [{ "$ref": "#/components/parameters/RunId" }, { "$ref": "#/components/parameters/Cursor" }, { "$ref": "#/components/parameters/DetailPageSize" }],
        "responses": {
          "200": { "description": "Metadata-only run detail", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RunDetail" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/traces/{trace_id}": {
      "get": {
        "operationId": "getTrace",
        "tags": ["Traces"],
        "parameters": [{ "$ref": "#/components/parameters/TraceId" }, { "$ref": "#/components/parameters/Cursor" }, { "$ref": "#/components/parameters/DetailPageSize" }],
        "responses": {
          "200": { "description": "Trace with deterministically ordered parent-child spans", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TraceDetail" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/components": {
      "get": {
        "operationId": "listComponents",
        "tags": ["Components"],
        "parameters": [
          { "$ref": "#/components/parameters/Cursor" },
          { "$ref": "#/components/parameters/PageSize" },
          { "name": "definition_state", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/ComponentDefinitionState" } }
        ],
        "responses": {
          "200": { "description": "Bounded component catalogue ordered by componentId. Existing versions are deployed versions derived from observations; declared definition versions are reported separately.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ComponentCollection" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/components/{component_id}/definitions/{component_version}": {
      "get": {
        "operationId": "getComponentDefinition",
        "tags": ["Components"],
        "parameters": [
          { "$ref": "#/components/parameters/ComponentId" },
          { "$ref": "#/components/parameters/ComponentVersion" }
        ],
        "responses": {
          "200": { "description": "Repository-approved metadata definition for one exact component version.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ComponentDefinition" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/components/{component_id}/definitions/{component_version}/dependencies": {
      "get": {
        "operationId": "getComponentDependencies",
        "tags": ["Components"],
        "description": "Return a deterministic, version-aware dependency topology. Nodes are ordered by kind, dependencyId, and version; edges are ordered by source then target. Missing definitions and partial observed health remain explicit.",
        "parameters": [
          { "$ref": "#/components/parameters/ComponentId" },
          { "$ref": "#/components/parameters/ComponentVersion" },
          { "name": "depth", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 4, "default": 1 } },
          { "name": "max_nodes", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 200, "default": 100 } }
        ],
        "responses": {
          "200": { "description": "Bounded direct, reverse, and transitive dependency topology for one exact component definition.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ComponentDependencyTopology" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/components/{component_id}/health": {
      "get": {
        "operationId": "getComponentHealth",
        "tags": ["Components"],
        "parameters": [
          { "$ref": "#/components/parameters/ComponentId" },
          { "name": "component_version", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/SafeLabel" } },
          { "name": "from", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/UtcInstant" } },
          { "name": "to", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/UtcInstant" } },
          { "name": "point_limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 1000, "default": 200 } }
        ],
        "responses": {
          "200": { "description": "Bounded component health trend", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ComponentHealth" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/analytics/metrics": {
      "get": {
        "operationId": "listAnalyticsMetrics",
        "tags": ["Analytics"],
        "description": "Return the finite metadata-only metric catalogue. Catalogue entries declare the only measurement and unit pairs accepted by the bounded analytics query resource; unavailable entries remain visible so clients never synthesize missing signals.",
        "parameters": [
          { "name": "focus", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/AnalyticsFocus" } }
        ],
        "responses": {
          "200": { "description": "Current allowlisted operational metric catalogue", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AnalyticsMetricCatalogue" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/analytics/query": {
      "get": {
        "operationId": "queryOperationalAnalytics",
        "tags": ["Analytics"],
        "description": "Return one bounded, owner-authorized analytical snapshot from ClickHouse. Omitted from/to select the 24 hours ending at snapshot time; an explicit window may not exceed 31 days. The service validates the metric/unit/aggregation combination against the metric catalogue, selects a deterministic bucket when bucket=auto, caps each series at 200 points and the response at 12 series, and rejects unsupported combinations rather than inferring a value from another signal.",
        "parameters": [
          { "name": "metric", "in": "query", "required": true, "schema": { "$ref": "#/components/schemas/AnalyticsMetricName" } },
          { "name": "unit", "in": "query", "required": true, "schema": { "$ref": "#/components/schemas/AnalyticsUnit" } },
          { "name": "aggregation", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/AnalyticsAggregation" } },
          { "name": "focus", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/AnalyticsFocus" } },
          { "name": "from", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/UtcInstant" } },
          { "name": "to", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/UtcInstant" } },
          { "name": "bucket", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/AnalyticsBucket" } },
          { "name": "group_by", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/AnalyticsGroupBy" } },
          { "name": "component", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/ComponentId" } },
          { "name": "component_version", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/SafeLabel" } },
          { "name": "operation", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/OperationName" } },
          { "name": "deployment", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/SafeLabel" } },
          { "name": "environment", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/EnvironmentName" } },
          { "name": "host", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/SafeLabel" } },
          { "name": "service_role", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/ServiceRole" } },
          { "name": "provider", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/DimensionValue" } },
          { "name": "outcome", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/Outcome" } },
          { "name": "error_class", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/DimensionValue" } },
          { "name": "status", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/DimensionValue" } },
          { "name": "retrieval_stage", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/DimensionValue" } },
          { "name": "series_limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 12, "default": 12 } },
          { "name": "point_limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 200, "default": 200 } }
        ],
        "responses": {
          "200": { "description": "Bounded operational analytics snapshot. Cache-Control is no-store because authenticated chart data is memory-only.", "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OperationalAnalyticsSnapshot" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/run-comparisons/query": {
      "post": {
        "operationId": "compareRuns",
        "tags": ["Comparisons"],
        "description": "Compare exactly two distinct owner-selected run identifiers using a fixed, parameterized ClickHouse query. Identifiers are carried in the request body rather than the URL. The result is metadata-only, bounded, non-persistent, and never published through SSE.",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RunComparisonRequest" } } } },
        "responses": {
          "200": { "description": "Bounded metadata-only comparison snapshot. Cache-Control is no-store because authenticated comparison data remains memory-only.", "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RunComparison" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/deployments": {
      "get": {
        "operationId": "listDeployments",
        "tags": ["Deployments"],
        "responses": {
          "200": { "description": "Deployment catalogue", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeploymentCollection" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/events": {
      "get": {
        "operationId": "streamEvents",
        "tags": ["Live"],
        "description": "Authenticated same-origin stream. Each connection begins with the current REST overview snapshot, then emits persisted metadata-only changes; reconnects use Last-Event-ID for catch-up. Credentials are accepted only through the HttpOnly session cookie.",
        "parameters": [{ "$ref": "#/components/parameters/LastEventId" }],
        "responses": {
          "200": { "description": "Initial overview snapshot followed by SSE metadata change notifications", "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } }, "content": { "text/event-stream": { "schema": { "$ref": "#/components/schemas/SsePayload" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/retention/actions": {
      "post": {
        "operationId": "createRetentionAction",
        "tags": ["Retention"],
        "parameters": [
          { "$ref": "#/components/parameters/CsrfToken" },
          { "$ref": "#/components/parameters/IdempotencyKey" },
          { "$ref": "#/components/parameters/RetentionConfirmation" }
        ],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateRetentionActionRequest" } } } },
        "responses": {
          "202": { "description": "Retention action queued, or the existing action returned for the same idempotency key", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RetentionAction" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/retention/actions/{action_id}": {
      "get": {
        "operationId": "getRetentionAction",
        "tags": ["Retention"],
        "parameters": [{ "$ref": "#/components/parameters/RetentionActionId" }],
        "responses": {
          "200": { "description": "Content-free retention action and audit status", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RetentionAction" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "observatorySession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-observatory_session",
        "description": "Opaque owner BFF session. Production cookies are HttpOnly, Secure, SameSite=Lax, Path=/, host-only, and rotated on authentication or privilege change."
      }
    },
    "parameters": {
      "Cursor": { "name": "cursor", "in": "query", "required": false, "description": "Opaque stable cursor; clients must not parse it.", "schema": { "$ref": "#/components/schemas/Cursor" } },
      "PageSize": { "name": "page_size", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 200, "default": 50 } },
      "DetailPageSize": { "name": "page_size", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 10000, "default": 10000 } },
      "RunId": { "name": "run_id", "in": "path", "required": true, "schema": { "$ref": "#/components/schemas/Uuid" } },
      "TraceId": { "name": "trace_id", "in": "path", "required": true, "schema": { "$ref": "#/components/schemas/TraceId" } },
      "ComponentId": { "name": "component_id", "in": "path", "required": true, "schema": { "$ref": "#/components/schemas/ComponentId" } },
      "ComponentVersion": { "name": "component_version", "in": "path", "required": true, "schema": { "$ref": "#/components/schemas/SafeLabel" } },
      "RetentionActionId": { "name": "action_id", "in": "path", "required": true, "schema": { "$ref": "#/components/schemas/Uuid" } },
      "LastEventId": { "name": "Last-Event-ID", "in": "header", "required": false, "description": "Last persisted observation identifier received by the browser.", "schema": { "$ref": "#/components/schemas/Uuid" } },
      "CsrfToken": { "name": "X-Observatory-CSRF", "in": "header", "required": true, "schema": { "type": "string", "minLength": 32, "maxLength": 256 } },
      "IdempotencyKey": { "name": "Idempotency-Key", "in": "header", "required": true, "schema": { "type": "string", "minLength": 16, "maxLength": 128, "pattern": "^[A-Za-z0-9._:-]+$" } },
      "RetentionConfirmation": { "name": "X-Observatory-Confirmation", "in": "header", "required": true, "description": "Exact acknowledgement selected for the requested action: delete-before or purge-all.", "schema": { "type": "string", "enum": ["delete-before", "purge-all"] } }
    },
    "responses": {
      "BadRequest": { "description": "Malformed request", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Problem" } } } },
      "Unauthorized": { "description": "Valid owner session required", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Problem" } } } },
      "Forbidden": { "description": "Owner authorization, same-origin request, or anti-CSRF validation failed", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Problem" } } } },
      "NotFound": { "description": "Resource not found", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Problem" } } } },
      "Conflict": { "description": "Idempotency key was reused with a different command", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Problem" } } } },
      "UnprocessableEntity": { "description": "Semantically invalid request", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Problem" } } } },
      "ServiceUnavailable": { "description": "A required Observatory-owned store is unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Problem" } } } }
    },
    "schemas": {
      "Uuid": { "type": "string", "format": "uuid", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" },
      "UtcInstant": { "type": "string", "format": "date-time", "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,9})?Z$" },
      "SafeLabel": { "type": "string", "minLength": 1, "maxLength": 128, "pattern": "^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$" },
      "RevisionIdentifier": { "type": "string", "minLength": 1, "maxLength": 128, "pattern": "^(?!(?:[Oo][Ww][Nn][Ee][Rr]|[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy]|[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll]|[Bb][Ee][Aa][Rr][Ee][Rr]|[Tt][Oo][Kk][Ee][Nn]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Pp][Rr][Ii][Vv][Aa][Tt][Ee]|[Cc][Oo][Nn][Tt][Ee][Nn][Tt]|[Hh][Aa][Ss][Hh]|[Dd][Ii][Gg][Ee][Ss][Tt]|[Ee][Nn][Dd][Pp][Oo][Ii][Nn][Tt])(?:$|[._:+-]))(?!.*[._:+-](?:[Oo][Ww][Nn][Ee][Rr]|[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy]|[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll]|[Bb][Ee][Aa][Rr][Ee][Rr]|[Tt][Oo][Kk][Ee][Nn]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Pp][Rr][Ii][Vv][Aa][Tt][Ee]|[Cc][Oo][Nn][Tt][Ee][Nn][Tt]|[Hh][Aa][Ss][Hh]|[Dd][Ii][Gg][Ee][Ss][Tt]|[Ee][Nn][Dd][Pp][Oo][Ii][Nn][Tt])(?:$|[._:+-]))[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$", "description": "An immutable identifier assigned by trusted configuration before telemetry capture. Case-insensitive owner, identity, credential, bearer, token, secret, password, private, content, hash, digest, and endpoint segments are prohibited when delimited by the identifier grammar. It must not be derived from prompt, response, owner, conversation, document, or other content." },
      "ModelIdentifier": { "type": "string", "minLength": 1, "maxLength": 193, "pattern": "^(?!(?:https?|ftp|file|mailto|ssh|ws|wss):)(?!(?:owner|identity|credential|bearer|token|secret|password|private|content|hash|digest|endpoint)(?:$|[._:+-]))(?!.*[._:+-](?:owner|identity|credential|bearer|token|secret|password|private|content|hash|digest|endpoint)(?:$|[._:+-]))[a-z0-9][a-z0-9._+-]{0,127}(?::(?=[a-z0-9._+-]{1,64}$)(?=[a-z0-9._+-]*[a-z])[a-z0-9._+-]+)?$", "description": "A bounded lowercase local model identifier with an optional letter-bearing provider tag, for example qwen3:8b or llama3.2:latest. URLs, paths, whitespace, email-like values, numeric-port impostors, and case-insensitive owner, identity, credential, bearer, token, secret, password, private, content, hash, digest, and endpoint segments are prohibited when delimited by the identifier grammar. Producers and consumers must also apply runtime private-shape validation because syntax alone cannot prove provenance." },
      "ComponentId": { "type": "string", "minLength": 6, "maxLength": 96, "pattern": "^aura\\.[a-z][a-z0-9_.-]{0,90}$" },
      "DefinitionIdentifier": { "type": "string", "minLength": 1, "maxLength": 128, "pattern": "^[a-z][a-z0-9_.-]{0,127}$" },
      "TraceId": { "type": "string", "pattern": "^[0-9a-f]{32}$" },
      "SpanId": { "type": "string", "pattern": "^[0-9a-f]{16}$" },
      "Cursor": { "type": "string", "minLength": 16, "maxLength": 1024, "pattern": "^[A-Za-z0-9_-]+$" },
      "RunStatus": { "type": "string", "enum": ["queued", "running", "succeeded", "failed", "cancelled", "unknown"] },
      "Outcome": { "type": "string", "enum": ["succeeded", "failed", "cancelled", "unknown"] },
      "ServiceState": { "type": "string", "enum": ["healthy", "degraded", "unavailable"] },
      "HealthState": { "type": "string", "enum": ["healthy", "delayed", "partial", "degraded", "unavailable"] },
      "RejectionReason": { "type": "string", "enum": ["encoding", "json", "unsupported_fields", "dropped_nonzero", "status_code", "status_message", "shape_object", "shape_array", "shape_trace_id", "shape_span_id", "shape_parent_span_id", "shape_link_trace_id", "shape_link_span_id", "shape_attribute_key", "shape_attribute_value", "scope", "link", "event", "attribute", "shape", "contract_value", "payload_too_large", "schema_validation", "malformed"] },
      "NonNegativeCount": { "type": "integer", "minimum": 0, "maximum": 9007199254740991 },
      "BoundedLatencyMs": { "type": "number", "minimum": 0, "maximum": 600000, "description": "Finite duration clamped to ten minutes." },
      "BoundedLagMs": { "type": "number", "minimum": 0, "maximum": 604800000, "description": "Finite non-negative lag clamped to seven days. Intake lag is derived only from successfully validated observation time, and future-skewed timestamps clamp to zero." },
      "OperationName": { "type": "string", "minLength": 1, "maxLength": 96, "pattern": "^[a-z][a-z0-9_.-]{0,95}$" },
      "EnvironmentName": { "type": "string", "minLength": 1, "maxLength": 32, "pattern": "^[a-z][a-z0-9_.-]{0,31}$" },
      "DimensionValue": { "type": "string", "minLength": 1, "maxLength": 128, "pattern": "^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$", "description": "Bounded metadata label from the closed metadata-observation v1 dimension allowlist; whitespace, URLs, paths, email-like values, and free-form text are prohibited." },
      "ServiceRole": { "type": "string", "enum": ["api", "worker", "scheduler", "cli"] },
      "AnalyticsFocus": { "type": "string", "enum": ["all", "model", "queue", "retrieval", "tool", "memory", "automation"], "default": "all" },
      "AnalyticsUnit": { "type": "string", "enum": ["count", "milliseconds", "bytes", "ratio", "score"] },
      "AnalyticsMetricName": {
        "type": "string",
        "enum": [
          "operation_duration_ms", "run_duration_ms", "queue_wait_ms", "errors", "retries", "backlog", "backlog_depth",
          "inference_duration_ms", "time_to_first_token_ms", "output_tokens", "provider_errors", "model_routing_duration_ms", "structured_inference_duration_ms",
          "tool_selection_duration_ms", "tool_selection_outcome", "tool_policy_evaluation_duration_ms", "tool_policy_decision", "tool_argument_validation_outcome", "tool_execution_duration_ms", "tool_execution_outcome", "tool_timeout_count",
          "memory_extraction_duration_ms", "memory_candidate_decision", "memory_reviewable_candidate_count", "memory_operation_duration_ms", "memory_operation_outcome", "memory_retrieval_duration_ms", "memory_lexical_search_duration_ms", "memory_vector_search_duration_ms", "memory_rerank_duration_ms", "memory_processing_errors", "memory_retry_count", "memory_reindex_backlog",
          "document_retrieval_duration_ms", "document_retrieval_outcome", "document_retrieval_candidate_count",
          "reminder_scheduler_scan_duration_ms", "reminder_due_lag_ms", "reminder_series_due_lag_ms", "reminder_fired_count", "reminder_failure_count", "notification_failure_count", "notification_acknowledgement_outcome"
        ],
        "description": "Finite operational analytics allowlist. It is intentionally narrower than the telemetry contract's syntactic measurement-name pattern."
      },
      "AnalyticsAggregation": { "type": "string", "enum": ["average", "sum", "minimum", "maximum", "p50", "p90", "p95", "p99", "rate", "count"], "default": "average" },
      "AnalyticsBucket": { "type": "string", "enum": ["auto", "one_minute", "five_minutes", "fifteen_minutes", "one_hour", "six_hours", "one_day"], "default": "auto", "description": "auto deterministically chooses the smallest bucket producing no more than 200 points for the effective UTC window." },
      "AnalyticsGroupBy": { "type": "string", "enum": ["none", "component", "component_version", "operation", "deployment", "environment", "host", "service_role", "provider", "outcome", "error_class", "status", "retrieval_stage"], "default": "none" },
      "AnalyticsAvailability": { "type": "string", "enum": ["available", "no_data", "unavailable"] },
      "AnalyticsPartialReason": { "type": "string", "enum": ["scan_limit", "execution_limit", "series_limit", "point_limit", "late_data", "retention_boundary"] },
      "AnalyticsUnavailableSignal": { "type": "string", "enum": ["model_identity", "retryability", "input_cohort", "gpu", "selected_evidence", "side_effect_detail", "quality", "saturation", "measurement", "unit", "dimension"] },
      "AnalyticsPercentileMethod": { "type": "string", "const": "clickhouse_quantile_exact", "description": "Stable ClickHouse quantileExact method applied only to samples sharing the declared measurement and unit." },
      "AnalyticsMetricDefinition": {
        "type": "object", "additionalProperties": false,
        "required": ["metric", "unit", "focusAreas", "supportedAggregations", "supportedGroupings", "availability", "unavailableSignals"],
        "properties": {
          "metric": { "$ref": "#/components/schemas/AnalyticsMetricName" },
          "unit": { "$ref": "#/components/schemas/AnalyticsUnit" },
          "focusAreas": { "type": "array", "minItems": 1, "maxItems": 7, "uniqueItems": true, "items": { "$ref": "#/components/schemas/AnalyticsFocus" } },
          "supportedAggregations": { "type": "array", "minItems": 1, "maxItems": 10, "uniqueItems": true, "items": { "$ref": "#/components/schemas/AnalyticsAggregation" } },
          "supportedGroupings": { "type": "array", "minItems": 1, "maxItems": 13, "uniqueItems": true, "items": { "$ref": "#/components/schemas/AnalyticsGroupBy" } },
          "availability": { "$ref": "#/components/schemas/AnalyticsAvailability" },
          "unavailableSignals": { "type": "array", "maxItems": 10, "uniqueItems": true, "items": { "$ref": "#/components/schemas/AnalyticsUnavailableSignal" } }
        }
      },
      "AnalyticsLimits": {
        "type": "object", "additionalProperties": false,
        "required": ["defaultWindowHours", "maximumWindowDays", "maximumPointsPerSeries", "maximumSeries", "maximumBreakdowns", "maximumScannedRows", "executionTimeoutMs"],
        "properties": {
          "defaultWindowHours": { "type": "integer", "const": 24 },
          "maximumWindowDays": { "type": "integer", "const": 31 },
          "maximumPointsPerSeries": { "type": "integer", "const": 200 },
          "maximumSeries": { "type": "integer", "const": 12 },
          "maximumBreakdowns": { "type": "integer", "const": 50 },
          "maximumScannedRows": { "type": "integer", "const": 1000000 },
          "executionTimeoutMs": { "type": "integer", "const": 5000 }
        }
      },
      "AnalyticsMetricCatalogue": {
        "type": "object", "additionalProperties": false,
        "required": ["snapshotAt", "items", "limits", "capturePolicy"],
        "properties": {
          "snapshotAt": { "$ref": "#/components/schemas/UtcInstant" },
          "items": { "type": "array", "maxItems": 128, "items": { "$ref": "#/components/schemas/AnalyticsMetricDefinition" } },
          "limits": { "$ref": "#/components/schemas/AnalyticsLimits" },
          "capturePolicy": { "type": "string", "const": "metadata_only" }
        }
      },
      "AnalyticsSeriesFacets": {
        "type": "object", "additionalProperties": false,
        "properties": {
          "component": { "$ref": "#/components/schemas/ComponentId" },
          "componentVersion": { "$ref": "#/components/schemas/SafeLabel" },
          "operation": { "$ref": "#/components/schemas/OperationName" },
          "deployment": { "$ref": "#/components/schemas/SafeLabel" },
          "environment": { "$ref": "#/components/schemas/EnvironmentName" },
          "host": { "$ref": "#/components/schemas/SafeLabel" },
          "serviceRole": { "$ref": "#/components/schemas/ServiceRole" },
          "provider": { "$ref": "#/components/schemas/DimensionValue" },
          "outcome": { "$ref": "#/components/schemas/Outcome" },
          "errorClass": { "$ref": "#/components/schemas/DimensionValue" },
          "status": { "$ref": "#/components/schemas/DimensionValue" },
          "retrievalStage": { "$ref": "#/components/schemas/DimensionValue" }
        }
      },
      "AnalyticsPoint": {
        "type": "object", "additionalProperties": false,
        "required": ["startAt", "endAt", "value", "sampleCount", "availability", "partial"],
        "properties": {
          "startAt": { "$ref": "#/components/schemas/UtcInstant" },
          "endAt": { "$ref": "#/components/schemas/UtcInstant" },
          "value": { "type": ["number", "null"], "minimum": -1000000000000000, "maximum": 1000000000000000 },
          "sampleCount": { "$ref": "#/components/schemas/NonNegativeCount" },
          "availability": { "$ref": "#/components/schemas/AnalyticsAvailability" },
          "partial": { "type": "boolean" }
        }
      },
      "AnalyticsSeriesSummary": {
        "type": "object", "additionalProperties": false,
        "description": "Null statistics are unavailable for this measurement; zero is a measured zero and remains distinct. Percentiles use the declared stable method and rates use rateIntervalSeconds.",
        "required": ["sampleCount", "minimum", "maximum", "average", "p50", "p90", "p95", "p99", "ratePerInterval", "rateIntervalSeconds"],
        "properties": {
          "sampleCount": { "$ref": "#/components/schemas/NonNegativeCount" },
          "minimum": { "type": ["number", "null"] },
          "maximum": { "type": ["number", "null"] },
          "average": { "type": ["number", "null"] },
          "p50": { "type": ["number", "null"] },
          "p90": { "type": ["number", "null"] },
          "p95": { "type": ["number", "null"] },
          "p99": { "type": ["number", "null"] },
          "ratePerInterval": { "type": ["number", "null"], "minimum": 0 },
          "rateIntervalSeconds": { "type": ["integer", "null"], "minimum": 60, "maximum": 86400 }
        }
      },
      "AnalyticsSeries": {
        "type": "object", "additionalProperties": false,
        "required": ["seriesKey", "facets", "summary", "points", "availability", "partial"],
        "properties": {
          "seriesKey": { "type": "string", "minLength": 1, "maxLength": 256, "pattern": "^[A-Za-z0-9._:+-]+$", "description": "Deterministic content-free key derived from the selected grouping, not an observation identifier." },
          "facets": { "$ref": "#/components/schemas/AnalyticsSeriesFacets" },
          "summary": { "$ref": "#/components/schemas/AnalyticsSeriesSummary" },
          "points": { "type": "array", "maxItems": 200, "items": { "$ref": "#/components/schemas/AnalyticsPoint" } },
          "availability": { "$ref": "#/components/schemas/AnalyticsAvailability" },
          "partial": { "type": "boolean" }
        }
      },
      "AnalyticsBreakdown": {
        "type": "object", "additionalProperties": false,
        "required": ["groupBy", "value", "count", "partial"],
        "properties": {
          "groupBy": { "$ref": "#/components/schemas/AnalyticsGroupBy" },
          "value": { "$ref": "#/components/schemas/DimensionValue" },
          "count": { "$ref": "#/components/schemas/NonNegativeCount" },
          "partial": { "type": "boolean" }
        }
      },
      "AnalyticsFreshness": {
        "type": "object", "additionalProperties": false,
        "required": ["latestObservedAt", "lagMs", "state"],
        "properties": {
          "latestObservedAt": { "oneOf": [{ "$ref": "#/components/schemas/UtcInstant" }, { "type": "null" }] },
          "lagMs": { "oneOf": [{ "$ref": "#/components/schemas/BoundedLagMs" }, { "type": "null" }] },
          "state": { "type": "string", "enum": ["fresh", "stale", "unavailable"] }
        }
      },
      "AnalyticsEffectiveQuery": {
        "type": "object", "additionalProperties": false,
        "required": ["metric", "unit", "aggregation", "focus", "from", "to", "bucket", "bucketSeconds", "groupBy", "filters", "seriesLimit", "pointLimit"],
        "properties": {
          "metric": { "$ref": "#/components/schemas/AnalyticsMetricName" },
          "unit": { "$ref": "#/components/schemas/AnalyticsUnit" },
          "aggregation": { "$ref": "#/components/schemas/AnalyticsAggregation" },
          "focus": { "$ref": "#/components/schemas/AnalyticsFocus" },
          "from": { "$ref": "#/components/schemas/UtcInstant" },
          "to": { "$ref": "#/components/schemas/UtcInstant" },
          "bucket": { "$ref": "#/components/schemas/AnalyticsBucket" },
          "bucketSeconds": { "type": "integer", "minimum": 60, "maximum": 86400 },
          "groupBy": { "$ref": "#/components/schemas/AnalyticsGroupBy" },
          "filters": { "$ref": "#/components/schemas/AnalyticsSeriesFacets", "description": "Normalized echo of only the applied metadata filters; absent facets were not filtered." },
          "seriesLimit": { "type": "integer", "minimum": 1, "maximum": 12 },
          "pointLimit": { "type": "integer", "minimum": 1, "maximum": 200 }
        }
      },
      "AnalyticsScan": {
        "type": "object", "additionalProperties": false,
        "required": ["scannedRows", "scanLimit", "executionMs", "executionLimitMs"],
        "properties": {
          "scannedRows": { "type": "integer", "minimum": 0, "maximum": 1000000 },
          "scanLimit": { "type": "integer", "const": 1000000 },
          "executionMs": { "type": "number", "minimum": 0, "maximum": 5000 },
          "executionLimitMs": { "type": "integer", "const": 5000 }
        }
      },
      "OperationalAnalyticsSnapshot": {
        "type": "object", "additionalProperties": false,
        "description": "Metadata-only aggregate snapshot. It never contains observation, run, trace, conversation, owner, prompt, response, memory, document, filename, tool argument/result, credential, endpoint, token, exception-message, stack-trace, payload, or arbitrary-attribute data.",
        "required": ["snapshotAt", "query", "percentileMethod", "series", "breakdowns", "freshness", "partial", "partialReasons", "unavailableSignals", "scan", "capturePolicy"],
        "properties": {
          "snapshotAt": { "$ref": "#/components/schemas/UtcInstant" },
          "query": { "$ref": "#/components/schemas/AnalyticsEffectiveQuery" },
          "percentileMethod": { "$ref": "#/components/schemas/AnalyticsPercentileMethod" },
          "series": { "type": "array", "maxItems": 12, "items": { "$ref": "#/components/schemas/AnalyticsSeries" } },
          "breakdowns": { "type": "array", "maxItems": 50, "items": { "$ref": "#/components/schemas/AnalyticsBreakdown" } },
          "freshness": { "$ref": "#/components/schemas/AnalyticsFreshness" },
          "partial": { "type": "boolean" },
          "partialReasons": { "type": "array", "maxItems": 6, "uniqueItems": true, "items": { "$ref": "#/components/schemas/AnalyticsPartialReason" } },
          "unavailableSignals": { "type": "array", "maxItems": 10, "uniqueItems": true, "items": { "$ref": "#/components/schemas/AnalyticsUnavailableSignal" } },
          "scan": { "$ref": "#/components/schemas/AnalyticsScan" },
          "capturePolicy": { "type": "string", "const": "metadata_only" }
        }
      },
      "RunComparisonRequest": {
        "type": "object", "additionalProperties": false,
        "required": ["leftRunId", "rightRunId"],
        "properties": {
          "leftRunId": { "$ref": "#/components/schemas/Uuid" },
          "rightRunId": { "$ref": "#/components/schemas/Uuid" }
        },
        "description": "Exactly two run identifiers with stable left and right roles. The service rejects equal identifiers with 422."
      },
      "ComparisonAvailability": { "type": "string", "enum": ["available", "missing", "unavailable"] },
      "ComparisonState": { "type": "string", "enum": ["equal", "changed", "missing", "unavailable"] },
      "ComparisonAlignment": { "type": "string", "enum": ["matched", "left_only", "right_only", "incompatible"] },
      "ComparisonMarkerName": { "type": "string", "enum": ["deployment_id", "git_commit", "image_version", "configuration_version", "model_id", "model_version", "agent_revision", "prompt_bundle_revision", "policy_revision"] },
      "ComparisonMarker": {
        "type": "object", "additionalProperties": false,
        "required": ["availability", "value"],
        "properties": {
          "availability": { "$ref": "#/components/schemas/ComparisonAvailability" },
          "value": { "oneOf": [{ "$ref": "#/components/schemas/RevisionIdentifier" }, { "type": "null" }], "description": "Present only when availability is available. Missing means this run lacks the marker; unavailable means its schema or retained evidence cannot provide it." }
        }
      },
      "ModelComparisonMarker": {
        "type": "object", "additionalProperties": false,
        "required": ["availability", "value"],
        "properties": {
          "availability": { "$ref": "#/components/schemas/ComparisonAvailability" },
          "value": { "oneOf": [{ "$ref": "#/components/schemas/ModelIdentifier" }, { "type": "null" }], "description": "Present only when availability is available. Runtime producers and consumers additionally reject private-shaped values." }
        }
      },
      "MetadataComparisonMarkerName": { "type": "string", "enum": ["deployment_id", "git_commit", "image_version", "configuration_version", "model_version", "agent_revision", "prompt_bundle_revision", "policy_revision"] },
      "MetadataMarkerComparison": {
        "type": "object", "additionalProperties": false,
        "required": ["marker", "state", "left", "right"],
        "properties": {
          "marker": { "$ref": "#/components/schemas/MetadataComparisonMarkerName" },
          "state": { "$ref": "#/components/schemas/ComparisonState" },
          "left": { "$ref": "#/components/schemas/ComparisonMarker" },
          "right": { "$ref": "#/components/schemas/ComparisonMarker" }
        }
      },
      "ModelMarkerComparison": {
        "type": "object", "additionalProperties": false,
        "required": ["marker", "state", "left", "right"],
        "properties": {
          "marker": { "type": "string", "const": "model_id" },
          "state": { "$ref": "#/components/schemas/ComparisonState" },
          "left": { "$ref": "#/components/schemas/ModelComparisonMarker" },
          "right": { "$ref": "#/components/schemas/ModelComparisonMarker" }
        }
      },
      "MarkerComparison": { "oneOf": [{ "$ref": "#/components/schemas/MetadataMarkerComparison" }, { "$ref": "#/components/schemas/ModelMarkerComparison" }] },
      "RunComparisonComponentVersion": {
        "type": "object", "additionalProperties": false,
        "required": ["componentId", "version"],
        "properties": {
          "componentId": { "$ref": "#/components/schemas/ComponentId" },
          "version": { "$ref": "#/components/schemas/ComparisonMarker" }
        }
      },
      "RunComparisonSide": {
        "type": "object", "additionalProperties": false,
        "required": ["role", "runId", "evidence", "status", "outcome", "startedAt", "finishedAt", "durationMs", "traceId", "modelId", "modelVersion", "deploymentId", "gitCommit", "imageVersion", "configurationVersion", "agentRevision", "promptBundleRevision", "policyRevision", "componentVersions", "partial"],
        "properties": {
          "role": { "type": "string", "enum": ["left", "right"] },
          "runId": { "$ref": "#/components/schemas/Uuid" },
          "evidence": { "$ref": "#/components/schemas/ComparisonAvailability" },
          "status": { "$ref": "#/components/schemas/RunStatus" },
          "outcome": { "$ref": "#/components/schemas/Outcome" },
          "startedAt": { "oneOf": [{ "$ref": "#/components/schemas/UtcInstant" }, { "type": "null" }] },
          "finishedAt": { "oneOf": [{ "$ref": "#/components/schemas/UtcInstant" }, { "type": "null" }] },
          "durationMs": { "type": ["number", "null"], "minimum": 0, "maximum": 604800000 },
          "traceId": { "oneOf": [{ "$ref": "#/components/schemas/TraceId" }, { "type": "null" }] },
          "modelId": { "$ref": "#/components/schemas/ModelComparisonMarker" },
          "modelVersion": { "$ref": "#/components/schemas/ComparisonMarker" },
          "deploymentId": { "$ref": "#/components/schemas/ComparisonMarker" },
          "gitCommit": { "$ref": "#/components/schemas/ComparisonMarker" },
          "imageVersion": { "$ref": "#/components/schemas/ComparisonMarker" },
          "configurationVersion": { "$ref": "#/components/schemas/ComparisonMarker" },
          "agentRevision": { "$ref": "#/components/schemas/ComparisonMarker" },
          "promptBundleRevision": { "$ref": "#/components/schemas/ComparisonMarker" },
          "policyRevision": { "$ref": "#/components/schemas/ComparisonMarker" },
          "componentVersions": { "type": "array", "maxItems": 256, "items": { "$ref": "#/components/schemas/RunComparisonComponentVersion" } },
          "partial": { "type": "boolean" }
        }
      },
      "ComparisonNumber": {
        "type": "object", "additionalProperties": false,
        "required": ["availability", "value"],
        "properties": {
          "availability": { "$ref": "#/components/schemas/ComparisonAvailability" },
          "value": { "type": ["number", "null"], "minimum": -1000000000000000, "maximum": 1000000000000000 }
        }
      },
      "ComponentMeasurementComparison": {
        "type": "object", "additionalProperties": false,
        "required": ["name", "unit", "state", "left", "right", "absoluteDelta"],
        "description": "One declared measurement and unit pair. Zero remains an available measured value. absoluteDelta is non-null only when both sides are finite and available.",
        "properties": {
          "name": { "$ref": "#/components/schemas/OperationName" },
          "unit": { "$ref": "#/components/schemas/AnalyticsUnit" },
          "state": { "$ref": "#/components/schemas/ComparisonState" },
          "left": { "$ref": "#/components/schemas/ComparisonNumber" },
          "right": { "$ref": "#/components/schemas/ComparisonNumber" },
          "absoluteDelta": { "type": ["number", "null"], "minimum": 0, "maximum": 2000000000000000 }
        }
      },
