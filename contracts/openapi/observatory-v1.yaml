          { "if": { "properties": { "captureState": { "const": "deleted" } }, "required": ["captureState"] }, "then": { "properties": { "reason": { "const": "manually_deleted" } } } },
          { "if": { "properties": { "captureState": { "const": "excluded" } }, "required": ["captureState"] }, "then": { "properties": { "reason": { "enum": ["capture_disabled", "provider_hidden_reasoning_excluded"] } } } },
          { "if": { "properties": { "captureState": { "const": "partial" } }, "required": ["captureState"] }, "then": { "properties": { "reason": { "enum": ["credential_material_rejected", "secret_bearing_field_rejected", "bearer_material_rejected", "unsupported_media_type", "payload_limit_exceeded", "ingest_rejected", "unknown_capture_gap", "missing_parent", "late_delivery", "page_truncated"] } } } },
          { "if": { "properties": { "captureState": { "const": "dropped" } }, "required": ["captureState"] }, "then": { "properties": { "reason": { "enum": ["queue_pressure", "export_unavailable", "transport_failure", "storage_failure"] } } } }
        ],
