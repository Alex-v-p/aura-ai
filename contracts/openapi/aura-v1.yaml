      "MemoryCollectionScopeType": { "name": "scopeType", "in": "query", "required": false, "schema": { "allOf": [{ "$ref": "#/components/schemas/MemoryCollectionScopeType" }], "default": "user" }, "description": "Collection scope selection. Omission selects user memory; agent selects every owner-authorized agent scope unless agentProfileId narrows it to one agent; all returns user and every owner-authorized agent scope and rejects agentProfileId." },
      "MemoryCollectionAgentProfileId": { "name": "agentProfileId", "in": "query", "required": false, "schema": { "type": "string", "format": "uuid" }, "description": "Optional narrowing filter when scopeType=agent. Omission selects all owner-authorized agent scopes. Rejected for user or all collection scope." },
      "MemoryReadScopeType": { "name": "scopeType", "in": "query", "required": false, "schema": { "allOf": [{ "$ref": "#/components/schemas/MemoryScopeType" }], "default": "user" }, "description": "Single-resource scope being inspected or mutated. Omission safely selects only owner-wide user memory; agent scope requires agentProfileId. All-scope resolution is not permitted for detail or mutations." },
      "MemoryReadAgentProfileId": { "name": "agentProfileId", "in": "query", "required": false, "schema": { "type": "string", "format": "uuid" }, "description": "Required with scopeType=agent for a single-resource detail or mutation. Rejected for user scope." },
      "CsrfToken": { "name": "X-CSRF-Token", "in": "header", "required": true, "schema": { "type": "string", "minLength": 32, "maxLength": 512 }, "description": "Session-bound anti-CSRF token returned by getSession." },
      "IdempotencyKey": { "name": "Idempotency-Key", "in": "header", "required": true, "schema": { "type": "string", "format": "uuid" }, "description": "Caller-generated UUID. Reuse only for an exact replay of the same command." },
      "ExpectedVersion": { "name": "X-Expected-Version", "in": "header", "required": true, "schema": { "type": "integer", "minimum": 1 }, "description": "Optimistic version of the upload session being completed." }
    },
    "responses": {
      "BadRequest": { "description": "Malformed request", "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
      "Unauthorized": { "description": "No valid Aura session", "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
      "Forbidden": { "description": "Authenticated subject is not the configured owner or command validation failed", "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
      "NotFound": { "description": "Resource not found for this principal", "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
      "Conflict": { "description": "Version conflict, active run conflict, or idempotency-key payload conflict", "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
      "RunAdmissionConflict": { "description": "Run admission conflict. model_vision_required is returned when the explicit attachment set contains an image and the selected model lacks a fresh digest-identified vision capability; Aura does not change the selected model or persist the message or run.", "content": { "application/problem+json": { "schema": { "oneOf": [{ "$ref": "#/components/schemas/ErrorEnvelope" }, { "$ref": "#/components/schemas/ModelVisionRequiredError" }] } } } },
      "UnprocessableEntity": { "description": "Semantically invalid command", "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
      "ServiceUnavailable": { "description": "Required dependency unavailable", "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
      "CalendarBadRequest": { "description": "Malformed calendar request with sanitized Aura-owned recovery metadata", "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } }, "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/CalendarErrorEnvelope" } } } },
      "CalendarUnauthorized": { "description": "No valid Aura owner session; no private or provider diagnostic value is returned", "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } }, "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/CalendarErrorEnvelope" } } } },
      "CalendarForbidden": { "description": "Owner authorization, origin-aware CSRF, or attempt binding rejected with sanitized Aura-owned recovery metadata", "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } }, "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/CalendarErrorEnvelope" } } } },
      "CalendarConflictResponse": { "description": "Lifecycle, optimistic-version, idempotency, or single-use attempt conflict with sanitized Aura-owned recovery metadata", "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } }, "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/CalendarErrorEnvelope" } } } },
      "CalendarUnprocessableEntity": { "description": "Semantically invalid calendar command or read query with sanitized Aura-owned recovery metadata", "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } }, "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/CalendarErrorEnvelope" } } } },
      "CalendarServiceUnavailable": { "description": "Calendar dependency unavailable with a closed Aura-owned category and no provider diagnostic value", "headers": { "Cache-Control": { "required": true, "schema": { "type": "string", "const": "no-store" } } }, "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/CalendarErrorEnvelope" } } } }
    },
    "schemas": {
      "Session": {
        "type": "object", "additionalProperties": false,
        "required": ["principal", "csrfToken", "idleExpiresAt", "absoluteExpiresAt"],
        "properties": {
          "principal": { "$ref": "#/components/schemas/Principal" },
          "csrfToken": { "type": "string", "minLength": 32 },
          "idleExpiresAt": { "type": "string", "format": "date-time" },
          "absoluteExpiresAt": { "type": "string", "format": "date-time" }
        }
      },
      "Principal": {
        "type": "object", "additionalProperties": false,
        "required": ["issuer", "subject"],
        "properties": {
          "issuer": { "type": "string", "format": "uri" },
          "subject": { "type": "string", "minLength": 1, "maxLength": 255 },
          "displayName": { "type": ["string", "null"], "maxLength": 255 }
        }
      },
      "ModelCatalog": {
        "type": "object", "additionalProperties": false,
        "required": ["models", "defaultModelId", "observedAt"],
        "properties": {
          "models": { "type": "array", "items": { "$ref": "#/components/schemas/Model" } },
          "defaultModelId": { "type": ["string", "null"] },
          "observedAt": { "type": "string", "format": "date-time" }
        }
      },
      "Model": {
        "type": "object", "additionalProperties": false,
        "required": ["id", "displayName", "provider", "capabilities", "availability", "selectable", "disabledReason"],
        "properties": {
          "id": { "type": "string", "minLength": 1, "maxLength": 255 },
          "displayName": { "type": "string", "minLength": 1, "maxLength": 255 },
          "provider": { "type": "string", "minLength": 1, "maxLength": 64 },
          "capabilities": { "type": "array", "uniqueItems": true, "items": { "type": "string", "enum": ["chat", "completion", "embedding", "vision", "tools", "structured_output"] } },
          "availability": { "type": "string", "enum": ["available", "unavailable", "unknown"] },
          "selectable": { "type": "boolean" },
          "disabledReason": { "type": ["string", "null"], "maxLength": 500 }
        }
      },
      "ToolCatalog": {
        "type": "object", "additionalProperties": false,
        "description": "Safe provider-neutral descriptors for exact-version policy configuration. The additive catalog includes the owner-bound read-only document.search@1 tool; its query and evidence result remain private runtime values and are never returned by this catalog.",
        "required": ["items"],
        "properties": { "items": { "type": "array", "items": { "$ref": "#/components/schemas/ToolDescriptorSummary" } } }
      },
      "ToolDescriptorSummary": {
        "type": "object", "additionalProperties": false,
        "description": "Safe provider-neutral metadata for policy configuration. Provider request shapes, handlers, arguments, results, and private content are not exposed.",
        "required": ["id", "version", "displayName", "description", "classification", "permissionScope", "confirmation", "timeoutMs", "retryLimit", "idempotency", "sensitivity", "observableComponent"],
        "properties": {
          "id": { "type": "string", "pattern": "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$", "maxLength": 128 },
          "version": { "type": "integer", "minimum": 1 },
          "displayName": { "type": "string", "minLength": 1, "maxLength": 120 },
          "description": { "type": "string", "minLength": 1, "maxLength": 500 },
          "classification": { "$ref": "#/components/schemas/ToolClassification" },
          "permissionScope": { "type": "string", "pattern": "^[a-z][a-z0-9_]*:[a-z][a-z0-9_]*$", "maxLength": 128 },
          "confirmation": { "$ref": "#/components/schemas/ToolConfirmation" },
          "timeoutMs": { "type": "integer", "minimum": 1, "maximum": 30000 },
          "retryLimit": { "type": "integer", "minimum": 0, "maximum": 3 },
          "idempotency": { "$ref": "#/components/schemas/ToolIdempotency" },
          "sensitivity": { "$ref": "#/components/schemas/ToolSensitivity" },
          "observableComponent": { "type": "string", "pattern": "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$", "maxLength": 128 }
        }
      },
      "ToolClassification": { "type": "string", "enum": ["read", "mutation"] },
      "ToolConfirmation": { "type": "string", "enum": ["never", "policy", "always"] },
      "ToolIdempotency": { "type": "string", "enum": ["read_only", "idempotent", "non_idempotent"] },
      "ToolSensitivity": { "type": "string", "enum": ["public", "internal", "private", "restricted"] },
      "MemoryKind": { "type": "string", "enum": ["episodic", "semantic", "procedural", "preference", "system"] },
      "MemoryScopeType": { "type": "string", "enum": ["user", "agent"], "description": "Persisted or single-resource memory scope. All is intentionally not a valid stored scope." },
      "MemoryCollectionScopeType": { "type": "string", "enum": ["user", "agent", "all"], "description": "Owner-authorized collection selector. Agent means every owned agent scope unless narrowed by agentProfileId; all combines user memory with every owned agent scope." },
      "MemoryLifecycleStatus": { "type": "string", "enum": ["active", "dormant", "archived", "disabled", "disputed", "superseded"] },
      "MemoryProvenanceType": { "type": "string", "enum": ["manual", "conversation_message", "run", "system", "import"] },
      "MemoryRelationType": { "type": "string", "enum": ["supersedes", "superseded_by", "disputes", "disputed_by"] },
      "MemoryEmbeddingGenerationStatus": { "type": "string", "enum": ["building", "active", "retired", "failed"] },
      "MemoryScope": {
        "oneOf": [
          { "$ref": "#/components/schemas/MemoryUserScope" },
          { "$ref": "#/components/schemas/MemoryAgentScope" }
        ],
        "discriminator": { "propertyName": "type" }
      },
      "MemoryUserScope": {
        "type": "object", "additionalProperties": false,
        "required": ["type"],
        "properties": { "type": { "const": "user" } }
      },
      "MemoryAgentScope": {
        "type": "object", "additionalProperties": false,
        "required": ["type", "agentProfileId"],
        "properties": {
          "type": { "const": "agent" },
          "agentProfileId": { "type": "string", "format": "uuid" }
        }
      },
      "MemoryPage": {
        "type": "object", "additionalProperties": false,
        "required": ["items", "nextCursor"],
        "properties": {
          "items": { "type": "array", "items": { "$ref": "#/components/schemas/MemorySummary" } },
          "nextCursor": { "type": ["string", "null"] }
        }
      },
      "SearchMemoriesRequest": {
        "type": "object", "additionalProperties": false,
        "required": ["query"],
        "properties": {
          "query": { "type": "string", "minLength": 1, "maxLength": 500, "description": "Owner-scoped literal content search text. This value is private and never appears in URLs, telemetry, logs, diagnostics, or caches." },
          "cursor": { "type": "string", "minLength": 1, "maxLength": 1024, "description": "Opaque owner-, query-, and filter-bound pagination cursor." },
          "limit": { "type": "integer", "minimum": 1, "maximum": 100, "default": 30 },
          "kind": { "$ref": "#/components/schemas/MemoryKind" },
          "scopeType": { "allOf": [{ "$ref": "#/components/schemas/MemoryCollectionScopeType" }], "default": "user", "description": "Omission selects user memory; agent selects every owner-authorized agent scope unless narrowed by agentProfileId; all combines user and every owner-authorized agent scope." },
          "agentProfileId": { "type": "string", "format": "uuid", "description": "Optional narrowing filter for agent scope. Omission selects all owner-authorized agent scopes. Rejected for user or all scope." },
          "status": { "$ref": "#/components/schemas/MemoryLifecycleStatus" },
          "provenanceType": { "$ref": "#/components/schemas/MemoryProvenanceType" },
          "confidenceMin": { "type": "number", "minimum": 0, "maximum": 1 },
          "confidenceMax": { "type": "number", "minimum": 0, "maximum": 1 },
          "createdFrom": { "type": "string", "format": "date-time" },
          "createdTo": { "type": "string", "format": "date-time" },
          "includeHistorical": { "type": "boolean", "default": false }
        }
      },
      "MemorySummary": {
        "type": "object", "additionalProperties": false,
        "required": ["id", "scope", "status", "pinned", "version", "currentRevision", "reinforcedAt", "dormantAt", "archivedAt", "createdAt", "updatedAt"],
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "scope": { "$ref": "#/components/schemas/MemoryScope" },
          "status": { "$ref": "#/components/schemas/MemoryLifecycleStatus" },
          "pinned": { "type": "boolean" },
          "version": { "type": "integer", "minimum": 1 },
          "currentRevision": { "$ref": "#/components/schemas/MemoryRevision" },
          "reinforcedAt": { "type": ["string", "null"], "format": "date-time" },
          "dormantAt": { "type": ["string", "null"], "format": "date-time" },
          "archivedAt": { "type": ["string", "null"], "format": "date-time" },
          "createdAt": { "type": "string", "format": "date-time" },
          "updatedAt": { "type": "string", "format": "date-time" },
          "currentRelevance": { "type": "number", "minimum": 0, "maximum": 1, "description": "Optional server-computed relevance using the revision half-life and latest reinforcement clock." }
        }
      },
      "MemoryDetail": {
        "type": "object", "additionalProperties": false,
        "required": ["id", "scope", "status", "pinned", "version", "currentRevision", "reinforcedAt", "dormantAt", "archivedAt", "createdAt", "updatedAt", "revisions", "provenance", "embeddingGenerations", "embeddings", "relations"],
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "scope": { "$ref": "#/components/schemas/MemoryScope" },
          "status": { "$ref": "#/components/schemas/MemoryLifecycleStatus" },
          "pinned": { "type": "boolean" },
          "version": { "type": "integer", "minimum": 1 },
          "currentRevision": { "$ref": "#/components/schemas/MemoryRevision" },
          "reinforcedAt": { "type": ["string", "null"], "format": "date-time" },
          "dormantAt": { "type": ["string", "null"], "format": "date-time" },
          "archivedAt": { "type": ["string", "null"], "format": "date-time" },
          "createdAt": { "type": "string", "format": "date-time" },
          "updatedAt": { "type": "string", "format": "date-time" },
          "currentRelevance": { "type": "number", "minimum": 0, "maximum": 1, "description": "Current server-computed relevance using the revision half-life and latest reinforcement clock." },
          "revisions": { "type": "array", "items": { "$ref": "#/components/schemas/MemoryRevision" } },
          "provenance": { "type": "array", "items": { "$ref": "#/components/schemas/MemoryProvenance" } },
          "embeddingGenerations": { "type": "array", "items": { "$ref": "#/components/schemas/MemoryEmbeddingGeneration" } },
          "embeddings": { "type": "array", "items": { "$ref": "#/components/schemas/MemoryEmbedding" } },
          "relations": { "type": "array", "items": { "$ref": "#/components/schemas/MemoryRelation" } }
        }
      },
      "MemoryRevision": {
        "type": "object", "additionalProperties": false,
        "required": ["id", "memoryId", "revision", "kind", "content", "correctionReason", "confidence", "importance", "halfLifeDays", "observedAt", "validFrom", "validTo", "createdAt"],
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "memoryId": { "type": "string", "format": "uuid" },
          "revision": { "type": "integer", "minimum": 1 },
          "kind": { "$ref": "#/components/schemas/MemoryKind" },
          "content": { "type": "string", "minLength": 1, "maxLength": 32768 },
          "correctionReason": { "type": ["string", "null"], "minLength": 1, "maxLength": 2000, "description": "Immutable owner-supplied correction reason. Null on the initial revision." },
          "confidence": { "type": "number", "minimum": 0, "maximum": 1 },
          "importance": { "type": "number", "minimum": 0, "maximum": 1 },
          "halfLifeDays": { "type": "number", "minimum": 0.25, "maximum": 3650 },
          "observedAt": { "type": ["string", "null"], "format": "date-time" },
          "validFrom": { "type": ["string", "null"], "format": "date-time" },
          "validTo": { "type": ["string", "null"], "format": "date-time" },
          "createdAt": { "type": "string", "format": "date-time" }
        }
      },
      "MemoryProvenance": {
        "type": "object", "additionalProperties": false,
        "required": ["id", "memoryRevisionId", "type", "sourceId", "sourceContentDigest", "evidence", "observedAt", "createdAt"],
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "memoryRevisionId": { "type": "string", "format": "uuid" },
          "type": { "$ref": "#/components/schemas/MemoryProvenanceType" },
          "sourceId": { "type": ["string", "null"], "maxLength": 255 },
          "sourceContentDigest": { "type": ["string", "null"], "minLength": 1, "maxLength": 128 },
          "evidence": { "type": ["string", "null"], "maxLength": 32768, "description": "Immutable owner-inspectable source evidence. Memory and provenance content are never emitted to telemetry." },
          "observedAt": { "type": ["string", "null"], "format": "date-time" },
          "createdAt": { "type": "string", "format": "date-time" }
        }
      },
      "MemoryEmbeddingGeneration": {
        "type": "object", "additionalProperties": false,
        "description": "Metadata for a Core-owned embedding generation. No vector values are exposed.",
        "required": ["id", "generation", "modelId", "modelRevision", "dimension", "status", "createdAt", "activatedAt"],
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "generation": { "type": "integer", "minimum": 1 },
          "modelId": { "type": "string", "minLength": 1, "maxLength": 255 },
          "modelRevision": { "type": ["string", "null"], "maxLength": 255 },
          "modelDigest": { "type": ["string", "null"], "pattern": "^[0-9a-f]{64}$" },
          "dimension": { "type": "integer", "minimum": 1 },
          "status": { "$ref": "#/components/schemas/MemoryEmbeddingGenerationStatus" },
          "createdAt": { "type": "string", "format": "date-time" },
          "activatedAt": { "type": ["string", "null"], "format": "date-time" }
        }
      },
      "MemoryEmbedding": {
        "type": "object", "additionalProperties": false,
        "description": "Embedding metadata only. Vector values are never returned by the public API.",
        "required": ["id", "memoryRevisionId", "generationId", "generation", "modelId", "modelRevision", "digest", "dimension", "createdAt"],
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "memoryRevisionId": { "type": "string", "format": "uuid" },
          "generationId": { "type": "string", "format": "uuid" },
          "generation": { "type": "integer", "minimum": 1 },
          "modelId": { "type": "string", "minLength": 1, "maxLength": 255 },
          "modelRevision": { "type": ["string", "null"], "maxLength": 255 },
          "modelDigest": { "type": ["string", "null"], "pattern": "^[0-9a-f]{64}$" },
          "digest": { "type": "string", "minLength": 1, "maxLength": 128 },
          "dimension": { "type": "integer", "minimum": 1 },
          "createdAt": { "type": "string", "format": "date-time" }
        }
      },
      "MemoryRelation": {
        "type": "object", "additionalProperties": false,
        "required": ["type", "memoryId", "createdAt"],
        "properties": {
          "type": { "$ref": "#/components/schemas/MemoryRelationType" },
          "memoryId": { "type": "string", "format": "uuid" },
          "createdAt": { "type": "string", "format": "date-time" }
        }
      },
      "CreateMemoryRequest": {
        "type": "object", "additionalProperties": false,
        "required": ["content", "kind", "scope", "confidence", "importance", "halfLifeDays"],
        "properties": {
          "content": { "type": "string", "minLength": 1, "maxLength": 32768 },
          "kind": { "$ref": "#/components/schemas/MemoryKind" },
          "scope": { "$ref": "#/components/schemas/MemoryScope" },
          "confidence": { "type": "number", "minimum": 0, "maximum": 1 },
          "importance": { "type": "number", "minimum": 0, "maximum": 1 },
          "halfLifeDays": { "type": "number", "minimum": 0.25, "maximum": 3650 },
          "observedAt": { "type": ["string", "null"], "format": "date-time" },
          "validFrom": { "type": ["string", "null"], "format": "date-time" },
          "validTo": { "type": ["string", "null"], "format": "date-time" }
        }
      },
      "CorrectMemoryRequest": {
        "type": "object", "additionalProperties": false,
        "required": ["content", "reason", "expectedVersion"],
        "properties": {
          "content": { "type": "string", "minLength": 1, "maxLength": 32768 },
          "reason": { "type": "string", "minLength": 1, "maxLength": 2000 },
          "kind": { "$ref": "#/components/schemas/MemoryKind" },
          "confidence": { "type": "number", "minimum": 0, "maximum": 1 },
          "importance": { "type": "number", "minimum": 0, "maximum": 1 },
          "halfLifeDays": { "type": "number", "minimum": 0.25, "maximum": 3650 },
          "observedAt": { "type": ["string", "null"], "format": "date-time" },
          "validFrom": { "type": ["string", "null"], "format": "date-time" },
          "validTo": { "type": ["string", "null"], "format": "date-time" },
          "expectedVersion": { "type": "integer", "minimum": 1 }
        }
      },
      "UpdateMemoryStatusRequest": {
        "type": "object", "additionalProperties": false,
        "required": ["status", "expectedVersion"],
        "properties": {
          "status": { "$ref": "#/components/schemas/MemoryLifecycleStatus" },
          "relatedMemoryId": { "type": ["string", "null"], "format": "uuid", "description": "Related memory for a dispute or supersession transition when applicable." },
          "expectedVersion": { "type": "integer", "minimum": 1 }
        }
      },
      "UpdateMemoryPinRequest": {
        "type": "object", "additionalProperties": false,
        "required": ["pinned", "expectedVersion"],
        "properties": {
          "pinned": { "type": "boolean" },
          "expectedVersion": { "type": "integer", "minimum": 1 }
        }
      },
      "PurgeMemoryRequest": {
        "type": "object", "additionalProperties": false,
        "required": ["confirmation", "expectedVersion"],
        "properties": {
          "confirmation": { "type": "string", "const": "PURGE MEMORY", "description": "Exact owner confirmation phrase required for irreversible content purge." },
          "expectedVersion": { "type": "integer", "minimum": 1 }
        }
      },
      "MemoryPurgeReceipt": {
        "type": "object", "additionalProperties": false,
        "required": ["memoryId", "auditId", "purgedAt"],
        "properties": {
          "memoryId": { "type": "string", "format": "uuid" },
          "auditId": { "type": "string", "format": "uuid" },
          "purgedAt": { "type": "string", "format": "date-time" }
        }
      },
      "MemoryCandidateAction": { "type": "string", "enum": ["ignore", "create", "reinforce", "supersede", "dispute", "review"] },
      "MemoryCandidateState": { "type": "string", "enum": ["proposed", "accepted", "rejected", "review", "retryable"] },
      "MemorySensitivity": { "type": "string", "enum": ["ordinary", "health", "finance", "identity", "intimate", "precise_location", "sensitive", "credential", "unknown_risk"] },
      "MemoryCandidatePage": {
        "type": "object", "additionalProperties": false,
        "required": ["items", "nextCursor"],
        "properties": {
          "items": { "type": "array", "items": { "$ref": "#/components/schemas/MemoryCandidateSummary" } },
          "nextCursor": { "type": ["string", "null"] }
        }
      },
      "MemoryCandidateSummary": {
        "type": "object", "additionalProperties": false,
        "required": ["id", "jobId", "runId", "version", "action", "state", "content", "kind", "scope", "confidence", "importance", "halfLifeDays", "validTo", "sensitivity", "relatedMemoryId", "memoryId", "decisionReason", "createdAt", "decidedAt"],
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "jobId": { "type": "string", "format": "uuid" },
          "runId": { "type": "string", "format": "uuid" },
          "version": { "type": "integer", "minimum": 1 },
          "action": { "$ref": "#/components/schemas/MemoryCandidateAction" },
          "state": { "$ref": "#/components/schemas/MemoryCandidateState" },
