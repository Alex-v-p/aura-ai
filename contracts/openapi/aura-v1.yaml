          "archived": { "type": "boolean", "description": "True archives an active conversation; false restores an archived conversation." },
          "version": { "type": "integer", "minimum": 1, "description": "Expected current conversation version." }
        }
      },
      "CreateRunRequest": {
        "type": "object", "additionalProperties": false,
