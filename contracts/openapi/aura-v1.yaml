          { "required": ["modelId"] },
          { "required": ["agentRevisionId"] },
          { "required": ["personaRevisionId"] },
          { "required": ["useAgentDefaultPersona"] }
        ],
        "not": { "required": ["personaRevisionId", "useAgentDefaultPersona"] },
        "properties": {
          "modelId": { "type": "string", "minLength": 1, "maxLength": 255 },
