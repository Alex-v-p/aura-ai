          "nextCursor": { "type": ["string", "null"], "maxLength": 1024 },
          "partial": { "type": "boolean" },
          "warnings": { "type": "array", "maxItems": 50, "items": { "$ref": "#/components/schemas/CalendarReadWarning" } },
          "evaluatedAt": { "type": "string", "format": "date-time" }
        }
      },
      "ModelVisionRequiredError": {
        "type": "object", "additionalProperties": false,
        "description": "Typed atomic run-admission failure returned only when the submitted or reused attachment set contains an image and the explicitly selected model has no fresh digest-identified verified vision capability. No message, links, or run are created and the client retains its draft and selection.",
        "required": ["type", "title", "status", "code", "detail", "retryable", "traceId", "resource"],
        "properties": {
          "type": { "type": "string", "format": "uri" },
          "title": { "type": "string", "minLength": 1, "maxLength": 200 },
          "status": { "type": "integer", "const": 409 },
          "code": { "type": "string", "const": "model_vision_required" },
          "detail": { "type": "string", "minLength": 1, "maxLength": 1000 },
          "retryable": { "type": "boolean", "const": false },
          "traceId": { "type": "string", "pattern": "^[0-9a-f]{32}$" },
          "resource": { "type": ["string", "null"], "maxLength": 255 }
        }
      },
      "ErrorEnvelope": {
        "type": "object", "additionalProperties": false,
        "required": ["type", "title", "status", "code", "detail", "retryable", "traceId", "resource"],
        "properties": {
          "type": { "type": "string", "format": "uri" },
          "title": { "type": "string", "minLength": 1, "maxLength": 200 },
          "status": { "type": "integer", "minimum": 400, "maximum": 599 },
          "code": { "type": "string", "pattern": "^[A-Z][A-Z0-9_]{2,63}$" },
          "detail": { "type": "string", "minLength": 1, "maxLength": 1000 },
          "retryable": { "type": "boolean" },
          "traceId": { "type": "string", "pattern": "^[0-9a-f]{32}$" },
          "resource": { "type": ["string", "null"], "maxLength": 255 },
          "fieldErrors": { "type": "array", "items": { "$ref": "#/components/schemas/FieldError" } }
        }
      },
      "FieldError": {
        "type": "object", "additionalProperties": false,
        "required": ["field", "code", "message"],
        "properties": { "field": { "type": "string", "minLength": 1, "maxLength": 255 }, "code": { "type": "string", "minLength": 1, "maxLength": 64 }, "message": { "type": "string", "minLength": 1, "maxLength": 500 } }
      },
      "Liveness": {
        "type": "object", "additionalProperties": false,
        "required": ["status"], "properties": { "status": { "type": "string", "const": "alive" } }
      },
      "Readiness": {
        "type": "object", "additionalProperties": false,
        "required": ["status", "checks", "checkedAt"],
        "properties": {
          "status": { "type": "string", "enum": ["ready", "degraded"] },
          "checks": { "type": "object", "additionalProperties": { "$ref": "#/components/schemas/DependencyReadiness" } },
          "checkedAt": { "type": "string", "format": "date-time" }
        }
      },
      "DependencyReadiness": {
        "type": "object", "additionalProperties": false,
        "required": ["status", "detail"],
        "properties": { "status": { "type": "string", "enum": ["ready", "degraded", "unavailable"] }, "detail": { "type": ["string", "null"], "maxLength": 500 } }
      }
    }
  }
}
