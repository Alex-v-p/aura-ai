          "branch": { "$ref": "#/components/schemas/ConversationBranchSummary", "description": "New or selected branch metadata. Optional for backward compatibility with pre-1.17 producers." }
        }
      },
      "RunEvent": {
        "oneOf": [
          { "$ref": "#/components/schemas/RunSnapshotEvent" },
          { "$ref": "#/components/schemas/RunStatusEvent" },
          { "$ref": "#/components/schemas/AssistantDeltaEvent" },
          { "$ref": "#/components/schemas/ModelThinkingDeltaEvent" },
          { "$ref": "#/components/schemas/AssistantSnapshotEvent" },
          { "$ref": "#/components/schemas/RunErrorEvent" },
          { "$ref": "#/components/schemas/MemoryActivityEvent" },
          { "$ref": "#/components/schemas/ToolStatusEvent" },
          { "$ref": "#/components/schemas/ApprovalStatusEvent" },
          { "$ref": "#/components/schemas/HeartbeatEvent" }
        ],
        "discriminator": { "propertyName": "eventType" }
      },
      "RunEventBase": {
        "type": "object",
        "required": ["schemaVersion", "eventId", "sequence", "eventType", "runId", "conversationId", "occurredAt"],
        "properties": {
          "schemaVersion": { "type": "integer", "const": 1 },
          "eventId": { "type": "string", "format": "uuid" },
          "sequence": { "type": "integer", "minimum": 0 },
          "eventType": { "type": "string" },
          "runId": { "type": "string", "format": "uuid" },
          "conversationId": { "type": "string", "format": "uuid" },
          "occurredAt": { "type": "string", "format": "date-time" }
        }
      },
      "RunSnapshotEvent": {
        "allOf": [{ "$ref": "#/components/schemas/RunEventBase" }, { "type": "object", "required": ["eventType", "data"], "properties": { "eventType": { "const": "run.snapshot" }, "data": { "$ref": "#/components/schemas/RunSnapshotData" } } }]
