          "attachments": { "type": "array", "maxItems": 8, "items": { "$ref": "#/components/schemas/MessageAttachmentSummary" }, "description": "Optional immutable attachment-link summaries for a user message. Historical messages and assistant messages may omit this property. Deleted sources remain as unavailable content-free summaries." },
          "createdAt": { "type": "string", "format": "date-time" },
          "updatedAt": { "type": "string", "format": "date-time" }
        }
      },
      "Run": {
        "type": "object", "additionalProperties": false,
        "required": ["id", "conversationId", "userMessageId", "assistantMessageId", "status", "agentRevisionId", "modelPolicyRevisionId", "provider", "modelId", "retryOfRunId", "createdAt", "startedAt", "finishedAt", "error"],
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "conversationId": { "type": "string", "format": "uuid" },
          "userMessageId": { "type": "string", "format": "uuid" },
          "assistantMessageId": { "type": ["string", "null"], "format": "uuid" },
          "status": { "$ref": "#/components/schemas/RunStatus" },
          "agentRevisionId": { "type": "string", "format": "uuid" },
          "modelPolicyRevisionId": { "type": "string", "format": "uuid" },
          "toolPolicyRevisionId": { "type": "string", "format": "uuid", "description": "Pinned immutable tool policy. Optional only for backward compatibility with pre-1.6 producers." },
          "toolCallLimit": { "type": "integer", "minimum": 0, "maximum": 1, "description": "Pinned Aura-enforced tool-call budget. Optional only for backward compatibility with pre-1.6 producers." },
          "toolCallsUsed": { "type": "integer", "minimum": 0, "maximum": 1, "description": "Calls admitted for execution. Optional only for backward compatibility with pre-1.6 producers." },
          "clientTimeZone": { "oneOf": [{ "$ref": "#/components/schemas/ClientTimeZone" }, { "type": "null" }], "description": "Validated IANA timezone immutably pinned at run admission. Optional for backward compatibility with pre-1.9 producers." },
          "approvalId": { "type": ["string", "null"], "format": "uuid", "description": "Identifier-only durable approval correlation for a confirmation-backed tool call." },
          "pendingToolCallId": { "type": ["string", "null"], "format": "uuid", "description": "Identifier-only tool call awaiting or resuming after owner confirmation." },
          "toolLifecycleStatus": { "oneOf": [{ "$ref": "#/components/schemas/RunToolLifecycleStatus" }, { "type": "null" }], "description": "Durable confirmation-backed tool lifecycle. Optional for runs without confirmation." },
          "citations": { "type": "array", "maxItems": 8, "uniqueItems": true, "items": { "$ref": "#/components/schemas/DocumentCitation" }, "description": "Optional validated document sources accepted from evidence returned during this exact run. Historical runs and runs without validated document evidence may omit this property." },
          "attachments": { "type": "array", "maxItems": 8, "items": { "$ref": "#/components/schemas/MessageAttachmentSummary" }, "description": "Optional snapshot of the admitted source user message's immutable attachment links. Historical runs may omit it." },
          "personaRevisionId": { "type": "string", "format": "uuid" },
          "promptBundleRevisionId": { "type": "string", "format": "uuid" },
          "promptHash": { "type": "string", "pattern": "^[0-9a-f]{64}$" },
          "provider": { "type": "string", "minLength": 1, "maxLength": 64 },
          "modelId": { "type": "string", "minLength": 1, "maxLength": 255 },
          "retryOfRunId": { "type": ["string", "null"], "format": "uuid" },
          "branchId": { "type": ["string", "null"], "format": "uuid", "description": "Opaque branch containing this run. Optional or null for backward compatibility with pre-1.17 producers." },
          "regeneratedFromRunId": { "type": ["string", "null"], "format": "uuid", "description": "Source run for a user-requested regeneration, or null for ordinary and failed-run retry executions. Optional for backward compatibility with pre-1.17 producers." },
          "createdAt": { "type": "string", "format": "date-time" },
          "startedAt": { "type": ["string", "null"], "format": "date-time" },
          "finishedAt": { "type": ["string", "null"], "format": "date-time" },
          "error": { "oneOf": [{ "$ref": "#/components/schemas/RunError" }, { "type": "null" }] }
        }
      },
      "RunStatus": { "type": "string", "enum": ["queued", "running", "waiting_for_confirmation", "cancel_requested", "canceled", "completed", "failed", "interrupted"] },
      "ClientTimeZone": { "type": "string", "minLength": 1, "maxLength": 128, "pattern": "^[A-Za-z0-9._+-]+(?:/[A-Za-z0-9._+-]+)*$", "description": "IANA timezone identifier. Producers validate membership in the deployed IANA timezone database." },
      "RunToolLifecycleStatus": { "type": "string", "enum": ["awaiting_confirmation", "approved", "denied", "executing", "completed", "failed"] },
      "ConversationArchiveState": { "type": "string", "enum": ["active", "archived", "all"] },
      "RunError": {
        "type": "object", "additionalProperties": false,
