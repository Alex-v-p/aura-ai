{
  "openapi": "3.1.0",
  "info": {
    "title": "Aura Core API",
    "version": "1.5.0",
    "description": "Owner-authenticated agent, persona, conversation, run, and memory transport contract. Provider endpoints, credentials, and embedding vectors are never exposed by this API."
  },
  "servers": [{ "url": "/", "description": "Same-origin Aura BFF" }],
  "security": [{ "sessionCookie": [] }],
  "tags": [
    { "name": "Authentication" },
    { "name": "Models" },
    { "name": "Agents" },
    { "name": "Personas" },
    { "name": "Conversations" },
    { "name": "Runs" },
    { "name": "Memories" },
    { "name": "Health" }
  ],
  "paths": {
    "/api/v1/auth/session": {
      "get": {
        "operationId": "getSession",
        "tags": ["Authentication"],
        "responses": {
          "200": { "description": "Authenticated owner session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Session" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" }
        }
      }
    },
    "/api/v1/auth/login": {
      "get": {
        "operationId": "startLogin",
        "tags": ["Authentication"],
        "security": [],
        "parameters": [{ "name": "return_to", "in": "query", "required": false, "schema": { "type": "string", "pattern": "^/[^/].*$", "maxLength": 2048 } }],
        "responses": {
          "302": { "description": "Redirect to the configured OIDC provider", "headers": { "Location": { "required": true, "schema": { "type": "string", "format": "uri" } } } },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/auth/callback": {
      "get": {
        "operationId": "completeLogin",
        "tags": ["Authentication"],
        "security": [],
        "parameters": [
          { "name": "code", "in": "query", "required": true, "schema": { "type": "string", "minLength": 1 } },
          { "name": "state", "in": "query", "required": true, "schema": { "type": "string", "minLength": 1 } }
        ],
        "responses": {
          "302": { "description": "Session established and redirected to the validated same-origin return path", "headers": { "Location": { "required": true, "schema": { "type": "string" } }, "Set-Cookie": { "schema": { "type": "string" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/auth/logout": {
      "post": {
        "operationId": "logout",
        "tags": ["Authentication"],
        "parameters": [{ "$ref": "#/components/parameters/CsrfToken" }],
        "responses": {
          "204": { "description": "Session revoked and browser cookie cleared" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" }
        }
      }
    },
    "/api/v1/models": {
      "get": {
        "operationId": "listModels",
        "tags": ["Models"],
        "responses": {
          "200": { "description": "Current provider-neutral model inventory", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ModelCatalog" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/agents": {
      "get": {
        "operationId": "listAgents",
        "tags": ["Agents"],
        "responses": {
          "200": { "description": "Owner-visible agent profiles and their current immutable revisions", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentCollection" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" }
        }
      },
      "post": {
        "operationId": "createAgent",
        "tags": ["Agents"],
        "parameters": [{ "$ref": "#/components/parameters/CsrfToken" }, { "$ref": "#/components/parameters/IdempotencyKey" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateAgentRequest" } } } },
        "responses": {
          "201": { "description": "Agent profile and first immutable revision created", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentDetail" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/api/v1/agents/{agent_profile_id}": {
      "parameters": [{ "$ref": "#/components/parameters/AgentProfileId" }],
      "get": {
        "operationId": "getAgent",
        "tags": ["Agents"],
        "responses": {
          "200": { "description": "Agent profile and immutable revision history", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentDetail" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      },
      "patch": {
        "operationId": "updateAgentStatus",
        "tags": ["Agents"],
        "parameters": [{ "$ref": "#/components/parameters/CsrfToken" }, { "$ref": "#/components/parameters/IdempotencyKey" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/UpdateAgentStatusRequest" } } } },
        "responses": {
          "200": { "description": "Agent lifecycle status updated", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentDetail" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/api/v1/agents/{agent_profile_id}/revisions": {
      "post": {
        "operationId": "createAgentRevision",
        "tags": ["Agents"],
        "parameters": [{ "$ref": "#/components/parameters/AgentProfileId" }, { "$ref": "#/components/parameters/CsrfToken" }, { "$ref": "#/components/parameters/IdempotencyKey" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateAgentRevisionRequest" } } } },
        "responses": {
          "201": { "description": "Immutable agent revision created and made current for the profile", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentDetail" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/api/v1/personas": {
      "get": {
        "operationId": "listPersonas",
        "tags": ["Personas"],
        "responses": {
          "200": { "description": "Owner-visible persona profiles and their current immutable revisions", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PersonaCollection" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" }
        }
      },
      "post": {
        "operationId": "createPersona",
        "tags": ["Personas"],
        "parameters": [{ "$ref": "#/components/parameters/CsrfToken" }, { "$ref": "#/components/parameters/IdempotencyKey" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreatePersonaRequest" } } } },
        "responses": {
          "201": { "description": "Persona profile and first immutable revision created", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PersonaDetail" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/api/v1/personas/{persona_profile_id}": {
      "parameters": [{ "$ref": "#/components/parameters/PersonaProfileId" }],
      "get": {
        "operationId": "getPersona",
        "tags": ["Personas"],
        "responses": {
          "200": { "description": "Persona profile and immutable revision history", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PersonaDetail" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      },
      "patch": {
        "operationId": "updatePersonaStatus",
        "tags": ["Personas"],
        "parameters": [{ "$ref": "#/components/parameters/CsrfToken" }, { "$ref": "#/components/parameters/IdempotencyKey" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/UpdatePersonaStatusRequest" } } } },
        "responses": {
          "200": { "description": "Persona lifecycle status updated", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PersonaDetail" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/api/v1/personas/{persona_profile_id}/revisions": {
      "post": {
        "operationId": "createPersonaRevision",
        "tags": ["Personas"],
        "parameters": [{ "$ref": "#/components/parameters/PersonaProfileId" }, { "$ref": "#/components/parameters/CsrfToken" }, { "$ref": "#/components/parameters/IdempotencyKey" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreatePersonaRevisionRequest" } } } },
        "responses": {
          "201": { "description": "Immutable persona revision created and made current for the profile", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PersonaDetail" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/api/v1/conversations": {
      "get": {
        "operationId": "listConversations",
        "tags": ["Conversations"],
        "parameters": [
          { "name": "cursor", "in": "query", "required": false, "schema": { "type": "string", "minLength": 1, "maxLength": 1024 }, "description": "Opaque pagination cursor. Versioned cursors are bound to the normalized filters used to create them; legacy cursors are accepted only with default filters." },
          { "name": "limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 30 } },
          { "name": "q", "in": "query", "required": false, "schema": { "type": "string", "maxLength": 200 }, "description": "Trimmed, case-insensitive literal title substring. Message content is never searched." },
          { "name": "agentProfileId", "in": "query", "required": false, "schema": { "type": "string", "format": "uuid" }, "description": "Matches conversations using any revision of the agent profile." },
          { "name": "modelId", "in": "query", "required": false, "schema": { "type": "string", "minLength": 1, "maxLength": 255 }, "description": "Exact conversation model identifier." },
          { "name": "runStatus", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/RunStatus" }, "description": "Matches the latest durable run status." },
          { "name": "archiveState", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/ConversationArchiveState", "default": "active" } },
          { "name": "activityFrom", "in": "query", "required": false, "schema": { "type": "string", "format": "date-time" }, "description": "Inclusive lower UTC bound for latest accepted user-message activity." },
          { "name": "activityTo", "in": "query", "required": false, "schema": { "type": "string", "format": "date-time" }, "description": "Exclusive upper UTC bound for latest accepted user-message activity." }
        ],
        "responses": {
          "200": { "description": "Conversations ordered by latest durably accepted user message, with conversation ID as a deterministic tie-breaker", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ConversationPage" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" }
        }
      },
      "post": {
        "operationId": "createConversation",
        "tags": ["Conversations"],
        "parameters": [{ "$ref": "#/components/parameters/CsrfToken" }, { "$ref": "#/components/parameters/IdempotencyKey" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateConversationRequest" } } } },
        "responses": {
          "202": { "description": "Conversation, first message, and queued run created atomically", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ConversationRunAccepted" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/conversations/{conversation_id}": {
      "parameters": [{ "$ref": "#/components/parameters/ConversationId" }],
      "get": {
        "operationId": "getConversation",
        "tags": ["Conversations"],
        "responses": {
          "200": { "description": "Conversation, ordered messages, and recent run snapshots", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ConversationDetail" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      },
      "patch": {
        "operationId": "updateConversation",
        "tags": ["Conversations"],
        "parameters": [{ "$ref": "#/components/parameters/CsrfToken" }, { "$ref": "#/components/parameters/IdempotencyKey" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/UpdateConversationRequest" } } } },
        "responses": {
          "200": { "description": "Conversation default updated for future runs", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ConversationSummary" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/api/v1/conversations/{conversation_id}/runs": {
      "post": {
        "operationId": "createRun",
        "tags": ["Runs"],
        "parameters": [{ "$ref": "#/components/parameters/ConversationId" }, { "$ref": "#/components/parameters/CsrfToken" }, { "$ref": "#/components/parameters/IdempotencyKey" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateRunRequest" } } } },
        "responses": {
          "202": { "description": "User message persisted and run queued atomically", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ConversationRunAccepted" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "503": { "$ref": "#/components/responses/ServiceUnavailable" }
        }
      }
    },
    "/api/v1/conversations/{conversation_id}/metadata": {
      "patch": {
        "operationId": "updateConversationMetadata",
        "tags": ["Conversations"],
        "parameters": [{ "$ref": "#/components/parameters/ConversationId" }, { "$ref": "#/components/parameters/CsrfToken" }, { "$ref": "#/components/parameters/IdempotencyKey" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/UpdateConversationMetadataRequest" } } } },
        "responses": {
          "200": { "description": "Conversation title or archive lifecycle metadata updated without changing activity ordering", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ConversationSummary" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/api/v1/runs/{run_id}/cancel": {
      "post": {
        "operationId": "cancelRun",
        "tags": ["Runs"],
        "parameters": [{ "$ref": "#/components/parameters/RunId" }, { "$ref": "#/components/parameters/CsrfToken" }, { "$ref": "#/components/parameters/IdempotencyKey" }],
        "responses": {
          "202": { "description": "Cancellation command accepted", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Run" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/v1/runs/{run_id}/retry": {
      "post": {
        "operationId": "retryRun",
        "tags": ["Runs"],
        "parameters": [{ "$ref": "#/components/parameters/RunId" }, { "$ref": "#/components/parameters/CsrfToken" }, { "$ref": "#/components/parameters/IdempotencyKey" }],
        "responses": {
          "202": { "description": "Linked retry queued without duplicating the user message", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ConversationRunAccepted" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/v1/runs/{run_id}/events": {
      "get": {
        "operationId": "streamRunEvents",
        "tags": ["Runs"],
        "parameters": [
          { "$ref": "#/components/parameters/RunId" },
          { "name": "Last-Event-ID", "in": "header", "required": false, "schema": { "type": "string", "format": "uuid" }, "description": "Last fully processed event identifier when reconnecting." }
        ],
        "responses": {
          "200": {
            "description": "A persisted snapshot followed by ordered live run events. SSE id fields equal eventId and event names equal eventType.",
            "headers": { "Cache-Control": { "schema": { "type": "string", "const": "no-store" } }, "X-Accel-Buffering": { "schema": { "type": "string", "const": "no" } } },
            "content": { "text/event-stream": { "schema": { "$ref": "#/components/schemas/RunEvent" } } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "410": { "description": "Requested event cursor is no longer available; reconnect without Last-Event-ID to receive a fresh snapshot", "content": { "application/problem+json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } }
        }
      }
    },
    "/api/v1/runs/{run_id}/memory-activity": {
      "get": {
        "operationId": "getRunMemoryActivity",
        "tags": ["Runs", "Memories"],
        "parameters": [{ "$ref": "#/components/parameters/RunId" }],
        "responses": {
          "200": { "description": "Authoritative owner-scoped memory activity snapshot used to reconcile missed, duplicate, or reordered realtime events", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RunMemoryActivitySnapshot" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/api/v1/memories": {
      "get": {
        "operationId": "listMemories",
        "tags": ["Memories"],
        "parameters": [
          { "name": "cursor", "in": "query", "required": false, "schema": { "type": "string", "minLength": 1, "maxLength": 1024 }, "description": "Opaque owner- and filter-bound pagination cursor." },
          { "name": "limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 30 } },
          { "name": "kind", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/MemoryKind" } },
          { "$ref": "#/components/parameters/MemoryCollectionScopeType" },
          { "$ref": "#/components/parameters/MemoryCollectionAgentProfileId" },
          { "name": "status", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/MemoryLifecycleStatus" } },
          { "name": "provenanceType", "in": "query", "required": false, "schema": { "$ref": "#/components/schemas/MemoryProvenanceType" } },
          { "name": "confidenceMin", "in": "query", "required": false, "schema": { "type": "number", "minimum": 0, "maximum": 1 } },
          { "name": "confidenceMax", "in": "query", "required": false, "schema": { "type": "number", "minimum": 0, "maximum": 1 } },
          { "name": "createdFrom", "in": "query", "required": false, "schema": { "type": "string", "format": "date-time" } },
          { "name": "createdTo", "in": "query", "required": false, "schema": { "type": "string", "format": "date-time" } },
          { "name": "includeHistorical", "in": "query", "required": false, "schema": { "type": "boolean", "default": false }, "description": "When true, explicitly includes non-active lifecycle states in owner inspection results." }
        ],
        "responses": {
          "200": { "description": "Owner-scoped memories ordered by most recent update with memory ID as a deterministic tie-breaker. Omitted scope returns user memory; explicit all returns user and all owner-authorized agent scopes.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/MemoryPage" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      },
      "post": {
        "operationId": "createMemory",
        "tags": ["Memories"],
        "parameters": [{ "$ref": "#/components/parameters/CsrfToken" }, { "$ref": "#/components/parameters/IdempotencyKey" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateMemoryRequest" } } } },
        "responses": {
          "201": { "description": "Manual memory and first immutable revision created", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/MemoryDetail" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
