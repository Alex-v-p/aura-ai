        }
      },
      "CalendarAuthorizationStart": {
        "type": "object", "additionalProperties": false,
        "description": "Short-lived navigation result for one owner-initiated connection attempt. authorizationPath is an authenticated same-origin navigation handle bound exactly to the owner, initiating session, and connection attempt. The high-entropy opaque handle is single-use, expires exactly at expiresAt, and MUST fail closed when missing, expired, superseded, replayed, prefetched, owner-mismatched, session-mismatched, or attempt-mismatched. Starting a newer connect or reauthorization attempt invalidates the prior handle and server-held callback result. The path is never persisted, logged, measured, prefetched, placed in SSE, or cached and contains no provider code, state, token, client secret, credential reference, calendar content, or owner identity.",
        "required": ["connection", "authorizationPath", "expiresAt"],
