      "CalendarEventQuery": {
        "type": "object", "additionalProperties": false,
        "description": "Private read-only query. rangeStart is inclusive, rangeEnd is exclusive, rangeStart must precede rangeEnd by no more than 31 days, every calendarId must be in the explicit selected set, and a cursor is bound to the owner and every normalized query field. Producers validate displayTimeZone against the deployed IANA database. The server applies a deadline no greater than timeoutMs and stops provider work when the request is cancelled.",
