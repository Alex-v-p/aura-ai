      },
      "AssistantSnapshotEvent": {
        "allOf": [{ "$ref": "#/components/schemas/RunEventBase" }, { "type": "object", "required": ["eventType", "data"], "properties": { "eventType": { "const": "assistant.snapshot" }, "data": { "$ref": "#/components/schemas/AssistantSnapshotData" } } }]
      },
      "RunErrorEvent": {
        "allOf": [{ "$ref": "#/components/schemas/RunEventBase" }, { "type": "object", "required": ["eventType", "data"], "properties": { "eventType": { "const": "run.error" }, "data": { "$ref": "#/components/schemas/RunError" } } }]
      },
      "MemoryActivityEvent": {
        "allOf": [{ "$ref": "#/components/schemas/RunEventBase" }, { "type": "object", "required": ["eventType", "data"], "properties": { "eventType": { "const": "memory.activity" }, "data": { "$ref": "#/components/schemas/MemoryActivity" } } }]
      },
      "HeartbeatEvent": {
        "allOf": [{ "$ref": "#/components/schemas/RunEventBase" }, { "type": "object", "required": ["eventType", "data"], "properties": { "eventType": { "const": "heartbeat" }, "data": { "type": "object", "additionalProperties": false, "required": ["serverTime"], "properties": { "serverTime": { "type": "string", "format": "date-time" } } } } }]
      },
      "RunSnapshotData": {
        "type": "object", "additionalProperties": false,
        "required": ["run", "assistantMessage"],
        "properties": { "run": { "$ref": "#/components/schemas/Run" }, "assistantMessage": { "oneOf": [{ "$ref": "#/components/schemas/Message" }, { "type": "null" }] } }
      },
      "RunStatusData": {
        "type": "object", "additionalProperties": false,
        "required": ["status", "startedAt", "finishedAt"],
        "properties": { "status": { "$ref": "#/components/schemas/RunStatus" }, "startedAt": { "type": ["string", "null"], "format": "date-time" }, "finishedAt": { "type": ["string", "null"], "format": "date-time" } }
      },
      "AssistantDeltaData": {
        "type": "object", "additionalProperties": false,
        "required": ["messageId", "offset", "text"],
        "properties": { "messageId": { "type": "string", "format": "uuid" }, "offset": { "type": "integer", "minimum": 0 }, "text": { "type": "string", "minLength": 1 } }
      },
      "AssistantSnapshotData": {
        "type": "object", "additionalProperties": false,
        "required": ["message"],
        "properties": { "message": { "$ref": "#/components/schemas/Message" } }
      },
      "ErrorEnvelope": {
        "type": "object", "additionalProperties": false,
        "required": ["type", "title", "status", "code", "detail", "retryable", "traceId", "resource"],
        "properties": {
          "type": { "type": "string", "format": "uri" },
          "title": { "type": "string", "minLength": 1, "maxLength": 200 },
          "status": { "type": "integer", "minimum": 400, "maximum": 599 },
          "code": { "type": "string", "pattern": "^[A-Z][A-Z0-9_]{2,63}$" },
          "detail": { "type": "string", "minLength": 1, "maxLength": 1000 },
          "retryable": { "type": "boolean" },
          "traceId": { "type": "string", "pattern": "^[0-9a-f]{32}$" },
          "resource": { "type": ["string", "null"], "maxLength": 255 },
          "fieldErrors": { "type": "array", "items": { "$ref": "#/components/schemas/FieldError" } }
        }
      },
      "FieldError": {
        "type": "object", "additionalProperties": false,
        "required": ["field", "code", "message"],
        "properties": { "field": { "type": "string", "minLength": 1, "maxLength": 255 }, "code": { "type": "string", "minLength": 1, "maxLength": 64 }, "message": { "type": "string", "minLength": 1, "maxLength": 500 } }
      },
      "Liveness": {
        "type": "object", "additionalProperties": false,
        "required": ["status"], "properties": { "status": { "type": "string", "const": "alive" } }
      },
      "Readiness": {
        "type": "object", "additionalProperties": false,
        "required": ["status", "checks", "checkedAt"],
        "properties": {
          "status": { "type": "string", "enum": ["ready", "degraded"] },
          "checks": { "type": "object", "additionalProperties": { "$ref": "#/components/schemas/DependencyReadiness" } },
          "checkedAt": { "type": "string", "format": "date-time" }
        }
      },
      "DependencyReadiness": {
        "type": "object", "additionalProperties": false,
        "required": ["status", "detail"],
        "properties": { "status": { "type": "string", "enum": ["ready", "degraded", "unavailable"] }, "detail": { "type": ["string", "null"], "maxLength": 500 } }
      }
    }
  }
}
