          "attachments": { "$ref": "#/components/schemas/MessageAttachmentInput", "description": "Optional explicit owner-private attachment set for the first immutable user message. Omission is equivalent to an empty set for backward compatibility." }
        }
      },
      "UpdateConversationRequest": {
        "type": "object", "additionalProperties": false,
        "required": ["version"],
