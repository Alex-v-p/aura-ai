          "branchId": { "type": "string", "format": "uuid", "description": "Opaque branch to extend. Omission preserves the pre-1.17 default linear conversation behavior." },
          "clientTimeZone": { "$ref": "#/components/schemas/ClientTimeZone", "description": "Optional browser IANA timezone pinned to the new run. Legacy clients may omit it." },
          "attachments": { "$ref": "#/components/schemas/MessageAttachmentInput", "description": "Optional explicit owner-private attachment set for this immutable user message. Omission is equivalent to an empty set for backward compatibility." }
        }
      },
      "CreateConversationBranchRequest": {
        "type": "object", "additionalProperties": false,
        "required": ["sourceUserMessageId", "message", "conversationVersion"],
        "properties": {
          "sourceUserMessageId": { "type": "string", "format": "uuid", "description": "Owner-authorized user message replaced only within the newly created immutable branch." },
