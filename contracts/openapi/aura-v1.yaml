          "conversationVersion": { "type": "integer", "minimum": 1, "description": "Expected current conversation version." },
          "branchId": { "type": "string", "format": "uuid", "description": "Opaque source branch containing the edited message. Omission selects the message's authoritative creation lineage for backward compatibility." },
          "clientTimeZone": { "$ref": "#/components/schemas/ClientTimeZone", "description": "Optional browser IANA timezone pinned to the newly admitted run." },
          "attachments": { "$ref": "#/components/schemas/MessageAttachmentInput", "description": "Optional new explicit set for the replacement user message. Omission is an empty set; clients preselecting source attachments must submit them explicitly." }
        }
      },
      "RegenerateRunRequest": {
