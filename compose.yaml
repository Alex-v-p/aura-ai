  # Evaluation orchestration is a separate process from telemetry ingestion.
  # It owns only Observatory PostgreSQL state and the private evaluation bus;
  # the dispatch identity is file-injected and never reaches the scheduler or
  # the regular Observatory worker.
  observatory-evaluation-worker:
    profiles: [observatory]
    build:
      context: .
      dockerfile: deploy/docker/aura-observatory.Dockerfile
      target: evaluation-worker
    init: true
    environment:
      AURA_OBSERVATORY_ENVIRONMENT: ${AURA_OBSERVATORY_ENVIRONMENT:-production}
      AURA_OBSERVATORY_ROLE: evaluation_worker
      AURA_OBSERVATORY_DATABASE_HOST: observatory-postgres
      AURA_OBSERVATORY_DATABASE_PORT: "5432"
      AURA_OBSERVATORY_DATABASE_NAME: ${AURA_OBSERVATORY_DATABASE_NAME:-aura_observatory}
      AURA_OBSERVATORY_DATABASE_USER: ${AURA_OBSERVATORY_DATABASE_USER:-observatory}
      AURA_OBSERVATORY_DATABASE_PASSWORD_FILE: /run/secrets/observatory-database-password
      AURA_OBSERVATORY_EVALUATION_NATS_URL: ${AURA_OBSERVATORY_EVALUATION_NATS_URL:-nats://aura-nats:4222}
      AURA_OBSERVATORY_EVALUATION_NATS_USER: ${AURA_OBSERVATORY_EVALUATION_NATS_USER:-aura-evaluation-dispatch}
      AURA_OBSERVATORY_EVALUATION_NATS_PASSWORD_FILE: /run/secrets/aura-nats-dispatch-password
      AURA_OBSERVATORY_EVALUATION_WORKER_ID: ${AURA_OBSERVATORY_EVALUATION_WORKER_ID:-observatory-evaluation-worker}
      # Evaluation process spans use the same bounded metadata-only OTLP
      # exporter as the other Observatory components.  This identity is
      # deployment configuration, never derived from evaluation content.
      AURA_OBSERVATORY_TELEMETRY_OTLP_ENABLED: ${AURA_OBSERVATORY_TELEMETRY_OTLP_ENABLED:-true}
      AURA_OBSERVATORY_TELEMETRY_OTLP_ENDPOINT: ${AURA_OBSERVATORY_TELEMETRY_OTLP_ENDPOINT:-http://observatory-collector:4318/v1/traces}
      AURA_OBSERVATORY_INGEST_CREDENTIAL_FILE: /run/secrets/observatory-ingest-credential
      AURA_OBSERVATORY_DEPLOYMENT_ID: ${AURA_OBSERVATORY_DEPLOYMENT_ID:-local}
      AURA_OBSERVATORY_DEPLOYMENT_COMMIT: ${AURA_OBSERVATORY_DEPLOYMENT_COMMIT:-0000000}
      AURA_OBSERVATORY_DEPLOYMENT_HOST: ${AURA_OBSERVATORY_DEPLOYMENT_HOST:-local}
      AURA_OBSERVATORY_EVALUATION_BATCH_SIZE: ${AURA_OBSERVATORY_EVALUATION_BATCH_SIZE:-32}
      AURA_OBSERVATORY_EVALUATION_POLL_SECONDS: ${AURA_OBSERVATORY_EVALUATION_POLL_SECONDS:-2}
      AURA_OBSERVATORY_EVALUATION_LEASE_SECONDS: ${AURA_OBSERVATORY_EVALUATION_LEASE_SECONDS:-120}
      AURA_OBSERVATORY_EVALUATION_MAX_ATTEMPTS: ${AURA_OBSERVATORY_EVALUATION_MAX_ATTEMPTS:-3}
      AURA_OBSERVATORY_EVALUATION_RETRY_BASE_SECONDS: ${AURA_OBSERVATORY_EVALUATION_RETRY_BASE_SECONDS:-10}
      AURA_OBSERVATORY_EVALUATION_RETRY_MAX_SECONDS: ${AURA_OBSERVATORY_EVALUATION_RETRY_MAX_SECONDS:-3600}
      AURA_OBSERVATORY_EVALUATION_MAX_ENVELOPE_BYTES: ${AURA_OBSERVATORY_EVALUATION_MAX_ENVELOPE_BYTES:-1000000}
      AURA_OBSERVATORY_EVALUATION_OBJECT_ENDPOINT: ${AURA_OBSERVATORY_EVALUATION_OBJECT_ENDPOINT:-http://aura-garage:3900}
      AURA_OBSERVATORY_EVALUATION_OBJECT_REGION: ${AURA_OBSERVATORY_EVALUATION_OBJECT_REGION:-garage}
      AURA_OBSERVATORY_EVALUATION_OBJECT_BUCKET: ${AURA_OBSERVATORY_EVALUATION_OBJECT_BUCKET:-aura-observatory-evaluation}
      AURA_OBSERVATORY_JUDGE_OBJECT_ACCESS_KEY_FILE: /run/secrets/observatory-judge-garage-access-key
      AURA_OBSERVATORY_JUDGE_OBJECT_SECRET_KEY_FILE: /run/secrets/observatory-judge-garage-secret-key
      # The normal profile has one deployment-owned host-gateway origin. The
      # disposable local-http overlay may replace this only with its generated
      # loopback relay origin.
      AURA_OBSERVATORY_LOCAL_JUDGE_ORIGIN: http://host.docker.internal:11434
      AURA_OBSERVATORY_LOCAL_JUDGE_TIMEOUT_SECONDS: ${AURA_OBSERVATORY_LOCAL_JUDGE_TIMEOUT_SECONDS:-120}
      AURA_OBSERVATORY_LOCAL_JUDGE_MAX_CONCURRENCY: ${AURA_OBSERVATORY_LOCAL_JUDGE_MAX_CONCURRENCY:-1}
      # Never allow host-provided proxy variables to redirect authorized
      # evaluation content away from the fixed local provider boundary.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    secrets: [observatory-database-password, aura-nats-dispatch-password, observatory-ingest-credential, observatory-judge-garage-access-key, observatory-judge-garage-secret-key]
    networks: [observatory-db, aura-evaluation-bus, observatory-ingest, observatory-object-storage, observatory-judge-egress]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      observatory-migrate: {condition: service_completed_successfully}
      observatory-postgres: {condition: service_healthy}
      aura-evaluation-nats-bootstrap: {condition: service_completed_successfully}
      observatory-judge-garage-bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - |
          import os
          target = [b"/app/.venv/bin/python", b"-m", b"aura_observatory.entrypoints.evaluation_worker"]
          for pid in os.listdir("/proc"):
              if not pid.isdigit():
                  continue
              try:
                  with open(f"/proc/{pid}/cmdline", "rb") as stream:
                      argv = stream.read().split(b"\0")
              except OSError:
                  continue
              if argv[:3] == target:
                  raise SystemExit(0)
          raise SystemExit(1)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "0.5"
    mem_limit: 384m
    pids_limit: 96
    ulimits:
      nofile:
        soft: 256
        hard: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    restart: unless-stopped

  # The scheduler is intentionally DB-only. It claims due work and recovery
  # leases through PostgreSQL and has no NATS, object-store, or public network
  # credentials or attachments.
  observatory-evaluation-scheduler:
    profiles: [observatory]
    build:
      context: .
      dockerfile: deploy/docker/aura-observatory.Dockerfile
      target: evaluation-scheduler
    init: true
    environment:
      AURA_OBSERVATORY_ENVIRONMENT: ${AURA_OBSERVATORY_ENVIRONMENT:-production}
      AURA_OBSERVATORY_ROLE: evaluation_scheduler
      AURA_OBSERVATORY_DATABASE_HOST: observatory-postgres
      AURA_OBSERVATORY_DATABASE_PORT: "5432"
      AURA_OBSERVATORY_DATABASE_NAME: ${AURA_OBSERVATORY_DATABASE_NAME:-aura_observatory}
      AURA_OBSERVATORY_DATABASE_USER: ${AURA_OBSERVATORY_DATABASE_USER:-observatory}
      AURA_OBSERVATORY_DATABASE_PASSWORD_FILE: /run/secrets/observatory-database-password
      AURA_OBSERVATORY_EVALUATION_SCHEDULER_ID: ${AURA_OBSERVATORY_EVALUATION_SCHEDULER_ID:-observatory-evaluation-scheduler}
      # The scheduler emits only bounded metadata spans.  It joins the
      # Collector network for this exporter but remains DB-only for
      # orchestration: it receives no evaluation NATS identity or network.
      AURA_OBSERVATORY_TELEMETRY_OTLP_ENABLED: ${AURA_OBSERVATORY_TELEMETRY_OTLP_ENABLED:-true}
      AURA_OBSERVATORY_TELEMETRY_OTLP_ENDPOINT: ${AURA_OBSERVATORY_TELEMETRY_OTLP_ENDPOINT:-http://observatory-collector:4318/v1/traces}
      AURA_OBSERVATORY_INGEST_CREDENTIAL_FILE: /run/secrets/observatory-ingest-credential
      AURA_OBSERVATORY_DEPLOYMENT_ID: ${AURA_OBSERVATORY_DEPLOYMENT_ID:-local}
      AURA_OBSERVATORY_DEPLOYMENT_COMMIT: ${AURA_OBSERVATORY_DEPLOYMENT_COMMIT:-0000000}
      AURA_OBSERVATORY_DEPLOYMENT_HOST: ${AURA_OBSERVATORY_DEPLOYMENT_HOST:-local}
      AURA_OBSERVATORY_EVALUATION_BATCH_SIZE: ${AURA_OBSERVATORY_EVALUATION_BATCH_SIZE:-32}
      AURA_OBSERVATORY_EVALUATION_POLL_SECONDS: ${AURA_OBSERVATORY_EVALUATION_POLL_SECONDS:-2}
      AURA_OBSERVATORY_EVALUATION_LEASE_SECONDS: ${AURA_OBSERVATORY_EVALUATION_LEASE_SECONDS:-120}
      AURA_OBSERVATORY_EVALUATION_MAX_ATTEMPTS: ${AURA_OBSERVATORY_EVALUATION_MAX_ATTEMPTS:-3}
      AURA_OBSERVATORY_EVALUATION_RETRY_BASE_SECONDS: ${AURA_OBSERVATORY_EVALUATION_RETRY_BASE_SECONDS:-10}
      AURA_OBSERVATORY_EVALUATION_RETRY_MAX_SECONDS: ${AURA_OBSERVATORY_EVALUATION_RETRY_MAX_SECONDS:-3600}
    secrets: [observatory-database-password, observatory-ingest-credential]
    networks: [observatory-db, observatory-ingest]
    depends_on:
      observatory-migrate: {condition: service_completed_successfully}
      observatory-postgres: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - |
          import os
          target = [b"/app/.venv/bin/python", b"-m", b"aura_observatory.entrypoints.evaluation_scheduler"]
          for pid in os.listdir("/proc"):
              if not pid.isdigit():
                  continue
              try:
                  with open(f"/proc/{pid}/cmdline", "rb") as stream:
                      argv = stream.read().split(b"\0")
              except OSError:
                  continue
              if argv[:3] == target:
                  raise SystemExit(0)
          raise SystemExit(1)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "0.25"
    mem_limit: 256m
    pids_limit: 64
    ulimits:
      nofile:
        soft: 128
        hard: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    restart: unless-stopped

  # Core evaluation is a separate process with no published port and no
  # access to Observatory persistence. Deterministic AURA-0091 fixtures share
  # only the Core database, evaluation NATS subjects, evaluation object
  # storage, and the metadata-only Observatory ingest network.
  aura-evaluation-runner:
    profiles: [observatory]
    build:
      context: .
      dockerfile: deploy/docker/aura-evaluation-runner.Dockerfile
      target: runtime
    init: true
    environment:
      AURA_ENVIRONMENT: ${AURA_ENVIRONMENT:-production}
      AURA_ROLE: evaluation-runner
      AURA_DATABASE_HOST: aura-core-postgres
      AURA_DATABASE_PORT: "5432"
      AURA_DATABASE_NAME: ${AURA_CORE_DATABASE_NAME:-aura}
      AURA_DATABASE_USER: ${AURA_EVALUATION_RUNNER_DATABASE_USER:-aura_evaluation_runner}
      AURA_DATABASE_PASSWORD_FILE: /run/secrets/aura-evaluation-runner-database-password
      AURA_NATS_URL: nats://aura-nats:4222
      AURA_NATS_USER: ${AURA_NATS_RUNNER_USER:-aura-evaluation-runner}
      AURA_NATS_PASSWORD_FILE: /run/secrets/aura-nats-runner-password
      AURA_EVALUATION_NATS_REQUEST_SUBJECT: aura.evaluation.runner.requested.v1
      AURA_EVALUATION_NATS_CANCELLATION_SUBJECT: aura.evaluation.runner.cancellation.v1
      AURA_EVALUATION_NATS_RESULT_SUBJECT: aura.evaluation.runner.results.v1
      AURA_EVALUATION_NATS_REQUEST_DURABLE: aura-core-evaluation-runner
      AURA_EVALUATION_NATS_CANCELLATION_DURABLE: aura-core-evaluation-cancellation
      AURA_EVALUATION_RUNNER_MAX_CONCURRENCY: ${AURA_EVALUATION_RUNNER_MAX_CONCURRENCY:-2}
      AURA_EVALUATION_RUNNER_MAX_QUEUE_DEPTH: ${AURA_EVALUATION_RUNNER_MAX_QUEUE_DEPTH:-32}
      AURA_EVALUATION_RUNNER_MAX_TIMEOUT_MS: ${AURA_EVALUATION_RUNNER_MAX_TIMEOUT_MS:-300000}
      AURA_EVALUATION_RUNNER_MAX_CASES: ${AURA_EVALUATION_RUNNER_MAX_CASES:-100}
      AURA_EVALUATION_RUNNER_MAX_INPUT_BYTES: ${AURA_EVALUATION_RUNNER_MAX_INPUT_BYTES:-16777216}
      AURA_EVALUATION_RUNNER_MAX_OUTPUT_BYTES: ${AURA_EVALUATION_RUNNER_MAX_OUTPUT_BYTES:-16777216}
      AURA_EVALUATION_RUNNER_MAX_TOKENS: ${AURA_EVALUATION_RUNNER_MAX_TOKENS:-1000000}
      AURA_EVALUATION_RUNNER_MAX_MODEL_CALLS: ${AURA_EVALUATION_RUNNER_MAX_MODEL_CALLS:-100}
      AURA_EVALUATION_RUNNER_MAX_ARTIFACT_OPERATIONS: ${AURA_EVALUATION_RUNNER_MAX_ARTIFACT_OPERATIONS:-100}
      AURA_EVALUATION_RUNTIME_FIXTURE_REVISION: ${AURA_EVALUATION_RUNTIME_FIXTURE_REVISION:-}
      AURA_EVALUATION_RUNTIME_PROMPT_REVISION: ${AURA_EVALUATION_RUNTIME_PROMPT_REVISION:-prompt-v1}
      AURA_EVALUATION_RUNTIME_POLICY_REVISION: ${AURA_EVALUATION_RUNTIME_POLICY_REVISION:-policy-v1}
      AURA_RUN_EVIDENCE_CAPTURE_POLICY: ${AURA_RUN_EVIDENCE_CAPTURE_POLICY:-}
      AURA_RUN_EVIDENCE_CAPTURE_REVISION: ${AURA_RUN_EVIDENCE_CAPTURE_REVISION:-full-content-v1}
      AURA_RUN_EVIDENCE_MAX_BYTES: ${AURA_RUN_EVIDENCE_MAX_BYTES:-1048576}
      AURA_OBJECT_STORAGE_ENDPOINT: http://aura-garage:3900
      AURA_OBJECT_STORAGE_REGION: ${AURA_GARAGE_REGION:-garage}
      AURA_OBJECT_STORAGE_BUCKET: ${AURA_OBSERVATORY_GARAGE_BUCKET:-aura-observatory-evaluation}
      AURA_OBJECT_STORAGE_ACCESS_KEY_FILE: /run/secrets/aura-evaluation-runner-garage-access-key
      AURA_OBJECT_STORAGE_SECRET_KEY_FILE: /run/secrets/aura-evaluation-runner-garage-secret-key
      AURA_EVALUATION_ARTIFACT_MAX_BYTES: ${AURA_EVALUATION_ARTIFACT_MAX_BYTES:-16777216}
      AURA_TELEMETRY_OTLP_ENABLED: ${AURA_TELEMETRY_OTLP_ENABLED:-false}
      AURA_TELEMETRY_OTLP_ENDPOINT: ${AURA_TELEMETRY_OTLP_ENDPOINT:-http://observatory-collector:4318/v1/observations}
      AURA_TELEMETRY_OTLP_CREDENTIAL_FILE: /run/secrets/observatory-ingest-credential
      AURA_TELEMETRY_OTLP_QUEUE_CAPACITY: ${AURA_TELEMETRY_OTLP_QUEUE_CAPACITY:-32}
      AURA_TELEMETRY_OTLP_MAX_ATTEMPTS: ${AURA_TELEMETRY_OTLP_MAX_ATTEMPTS:-3}
      AURA_TELEMETRY_OTLP_TIMEOUT_SECONDS: ${AURA_TELEMETRY_OTLP_TIMEOUT_SECONDS:-2}
      AURA_TELEMETRY_DEPLOYMENT_ID: ${AURA_TELEMETRY_DEPLOYMENT_ID:-local}
      AURA_TELEMETRY_GIT_COMMIT: ${AURA_TELEMETRY_GIT_COMMIT:-0000000}
      AURA_TELEMETRY_HOST_ID: ${AURA_TELEMETRY_HOST_ID:-local}
      AURA_TELEMETRY_IMAGE_VERSION: ${AURA_TELEMETRY_IMAGE_VERSION:-local}
      AURA_TELEMETRY_CONFIGURATION_VERSION: ${AURA_TELEMETRY_CONFIGURATION_VERSION:-local}
    secrets: [aura-evaluation-runner-database-password, aura-nats-runner-password, aura-evaluation-runner-garage-access-key, aura-evaluation-runner-garage-secret-key, observatory-ingest-credential]
    networks: [aura-core-db, aura-evaluation-bus, observatory-object-storage, observatory-ingest]
    depends_on:
      aura-core-migrate: {condition: service_completed_successfully}
      aura-core-postgres: {condition: service_healthy}
      aura-evaluation-runner-db-bootstrap: {condition: service_completed_successfully}
      aura-evaluation-nats-bootstrap: {condition: service_completed_successfully}
      aura-evaluation-runner-garage-bootstrap: {condition: service_completed_successfully}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "1.0"
    mem_limit: 768m
    pids_limit: 128
    ulimits:
      nofile:
        soft: 256
        hard: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    restart: unless-stopped

  observatory-migrate:
    profiles: [observatory]
    build:
      context: .
      dockerfile: deploy/docker/aura-observatory.Dockerfile
      target: migrate
    init: true
    environment:
      AURA_OBSERVATORY_ENVIRONMENT: ${AURA_OBSERVATORY_ENVIRONMENT:-production}
      AURA_OBSERVATORY_ROLE: migrate
      AURA_OBSERVATORY_DATABASE_HOST: observatory-postgres
      AURA_OBSERVATORY_DATABASE_PORT: "5432"
      AURA_OBSERVATORY_DATABASE_NAME: ${AURA_OBSERVATORY_DATABASE_NAME:-aura_observatory}
      AURA_OBSERVATORY_DATABASE_USER: ${AURA_OBSERVATORY_DATABASE_USER:-observatory}
      AURA_OBSERVATORY_DATABASE_PASSWORD_FILE: /run/secrets/observatory-database-password
      AURA_OBSERVATORY_CLICKHOUSE_URL: http://observatory-clickhouse:8123
      AURA_OBSERVATORY_CLICKHOUSE_DATABASE: ${AURA_OBSERVATORY_CLICKHOUSE_DATABASE:-aura_observatory}
      AURA_OBSERVATORY_CLICKHOUSE_USER: ${AURA_OBSERVATORY_CLICKHOUSE_USER:-observatory}
      AURA_OBSERVATORY_CLICKHOUSE_PASSWORD_FILE: /run/secrets/observatory-clickhouse-password
    secrets: [observatory-database-password, observatory-clickhouse-password]
    networks: [observatory-db]
    depends_on:
      observatory-postgres: {condition: service_healthy}
      observatory-clickhouse: {condition: service_healthy}
    restart: "no"

  observatory-postgres:
    profiles: [observatory]
    image: ${AURA_OBSERVATORY_POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${AURA_OBSERVATORY_DATABASE_NAME:-aura_observatory}
      POSTGRES_USER: ${AURA_OBSERVATORY_DATABASE_USER:-observatory}
      POSTGRES_PASSWORD_FILE: /run/secrets/observatory-database-password
    secrets: [observatory-database-password]
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-observatory-postgres:/var/lib/postgresql/data
    networks: [observatory-db]
    healthcheck:
      test: [CMD-SHELL, "test \"$$(tr -d '\\000' </proc/1/cmdline)\" = postgres && pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  observatory-clickhouse:
    profiles: [observatory]
    image: ${AURA_OBSERVATORY_CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        export CLICKHOUSE_PASSWORD="$$(cat /run/secrets/observatory-clickhouse-password)";
        exec /entrypoint.sh
    environment:
      CLICKHOUSE_DB: ${AURA_OBSERVATORY_CLICKHOUSE_DATABASE:-aura_observatory}
      CLICKHOUSE_USER: ${AURA_OBSERVATORY_CLICKHOUSE_USER:-observatory}
    secrets: [observatory-clickhouse-password]
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-observatory-clickhouse:/var/lib/clickhouse
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-observatory-clickhouse-logs:/var/log/clickhouse-server
    networks: [observatory-db]
    expose: ["8123"]
    healthcheck:
      test: [CMD, wget, --quiet, --output-document=-, http://127.0.0.1:8123/ping]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  observatory-session:
    profiles: [observatory]
    image: ${AURA_OBSERVATORY_SESSION_IMAGE:-valkey/valkey:8.1-alpine}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        export VALKEY_PASSWORD="$$(cat /run/secrets/observatory-session-password)";
        exec valkey-server --save 60 1 --appendonly yes --appendfsync everysec --requirepass "$${VALKEY_PASSWORD}"
    secrets: [observatory-session-password]
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-observatory-session:/data
    networks: [observatory-session]
    healthcheck:
      test: [CMD-SHELL, "valkey-cli -a \"$$(cat /run/secrets/observatory-session-password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  observatory-collector:
    profiles: [observatory]
    image: ${AURA_OBSERVATORY_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.138.0}
    # The pinned Collector emits its token filename and receiver/exporter
    # endpoints at info level. Keep operational warnings/errors available while
    # preventing those diagnostics from becoming a secret/path or URL sink;
    # queueing and retry behavior remain configured in the Collector file.
    command:
      - --config=/etc/otelcol-contrib/config.yaml
      - --set=service.telemetry.logs.level=warn
      - --set=service.telemetry.logs.disable_caller=true
      - --set=service.telemetry.logs.disable_stacktrace=true
    secrets: [observatory-ingest-credential]
    volumes:
      - ./deploy/compose/observatory-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [observatory-ingest]
    expose: ["4317", "4318", "8888"]
    depends_on:
      observatory-api: {condition: service_healthy}
    restart: unless-stopped

  observatory-web:
    profiles: [observatory]
    build:
      context: .
      dockerfile: deploy/docker/observatory-web.Dockerfile
      target: runtime
    init: true
    ports:
      - "127.0.0.1:${AURA_OBSERVATORY_PORT:-4300}:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /var/cache/nginx:rw,noexec,nosuid,nodev
      - /var/run:rw,noexec,nosuid,nodev
    networks: [observatory-edge, observatory-api]
    depends_on:
      observatory-api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget --quiet --output-document=- http://127.0.0.1:8080/healthz | grep -q '^ok$'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

secrets:
  aura-core-database-password:
    file: ${AURA_CORE_DATABASE_PASSWORD_FILE:-./.secrets/aura-core-database-password}
  aura-oidc-client-secret:
    file: ${AURA_OIDC_CLIENT_SECRET_FILE:-./.secrets/aura-oidc-client-secret}
  aura-nats-password:
    file: ${AURA_NATS_PASSWORD_FILE:-./.secrets/aura-nats-password}
  aura-nats-bootstrap-password:
    file: ${AURA_NATS_BOOTSTRAP_PASSWORD_FILE:-./.secrets/aura-nats-bootstrap-password}
  aura-nats-dispatch-password:
    file: ${AURA_NATS_DISPATCH_PASSWORD_FILE:-./.secrets/aura-nats-dispatch-password}
  aura-nats-runner-password:
    file: ${AURA_NATS_RUNNER_PASSWORD_FILE:-./.secrets/aura-nats-runner-password}
  aura-nats-run-evidence-password:
    file: ${AURA_NATS_RUN_EVIDENCE_PASSWORD_FILE:-./.secrets/aura-nats-run-evidence-password}
  aura-nats-run-evidence-bootstrap-password:
    file: ${AURA_NATS_RUN_EVIDENCE_BOOTSTRAP_PASSWORD_FILE:-./.secrets/aura-nats-run-evidence-bootstrap-password}
  aura-valkey-password:
    file: ${AURA_VALKEY_PASSWORD_FILE:-./.secrets/aura-valkey-password}
  aura-garage-rpc-secret:
    file: ${AURA_GARAGE_RPC_SECRET_FILE:-./.secrets/aura-garage-rpc-secret}
  aura-garage-access-key:
    file: ${AURA_GARAGE_ACCESS_KEY_FILE:-./.secrets/aura-garage-access-key}
  aura-garage-secret-key:
    file: ${AURA_GARAGE_SECRET_KEY_FILE:-./.secrets/aura-garage-secret-key}
  observatory-database-password:
    file: ${AURA_OBSERVATORY_DATABASE_PASSWORD_FILE:-./.secrets/observatory-database-password}
  observatory-oidc-client-secret:
    file: ${AURA_OBSERVATORY_OIDC_CLIENT_SECRET_FILE:-./.secrets/observatory-oidc-client-secret}
  observatory-session-password:
    file: ${AURA_OBSERVATORY_SESSION_PASSWORD_FILE:-./.secrets/observatory-session-password}
  observatory-ingest-credential:
    file: ${AURA_OBSERVATORY_INGEST_CREDENTIAL_FILE:-./.secrets/observatory-ingest-credential}
  observatory-clickhouse-password:
    file: ${AURA_OBSERVATORY_CLICKHOUSE_PASSWORD_FILE:-./.secrets/observatory-clickhouse-password}
  observatory-garage-access-key:
    file: ${AURA_OBSERVATORY_GARAGE_ACCESS_KEY_FILE:-./.secrets/observatory-garage-access-key}
  observatory-garage-secret-key:
    file: ${AURA_OBSERVATORY_GARAGE_SECRET_KEY_FILE:-./.secrets/observatory-garage-secret-key}
  observatory-api-garage-access-key:
    file: ${AURA_OBSERVATORY_API_GARAGE_ACCESS_KEY_FILE:-./.secrets/observatory-api-garage-access-key}
  observatory-api-garage-secret-key:
    file: ${AURA_OBSERVATORY_API_GARAGE_SECRET_KEY_FILE:-./.secrets/observatory-api-garage-secret-key}
  observatory-judge-garage-access-key:
    file: ${AURA_OBSERVATORY_JUDGE_OBJECT_ACCESS_KEY_FILE:-./.secrets/observatory-judge-garage-access-key}
  observatory-judge-garage-secret-key:
    file: ${AURA_OBSERVATORY_JUDGE_OBJECT_SECRET_KEY_FILE:-./.secrets/observatory-judge-garage-secret-key}
  aura-evaluation-runner-garage-access-key:
    file: ${AURA_EVALUATION_RUNNER_GARAGE_ACCESS_KEY_FILE:-./.secrets/aura-evaluation-runner-garage-access-key}
  aura-evaluation-runner-garage-secret-key:
    file: ${AURA_EVALUATION_RUNNER_GARAGE_SECRET_KEY_FILE:-./.secrets/aura-evaluation-runner-garage-secret-key}
  observatory-run-evidence-worker-access-key:
    file: ${AURA_OBSERVATORY_RUN_EVIDENCE_WORKER_ACCESS_KEY_FILE:-./.secrets/observatory-run-evidence-worker-access-key}
  observatory-run-evidence-worker-secret-key:
    file: ${AURA_OBSERVATORY_RUN_EVIDENCE_WORKER_SECRET_KEY_FILE:-./.secrets/observatory-run-evidence-worker-secret-key}
  observatory-run-evidence-api-access-key:
    file: ${AURA_OBSERVATORY_RUN_EVIDENCE_API_ACCESS_KEY_FILE:-./.secrets/observatory-run-evidence-api-access-key}
  observatory-run-evidence-api-secret-key:
    file: ${AURA_OBSERVATORY_RUN_EVIDENCE_API_SECRET_KEY_FILE:-./.secrets/observatory-run-evidence-api-secret-key}
  aura-evaluation-runner-database-password:
    file: ${AURA_EVALUATION_RUNNER_DATABASE_PASSWORD_FILE:-./.secrets/aura-evaluation-runner-database-password}

networks:
  # Docker Desktop does not publish host ports for containers attached only to
  # an internal network. Keep the browser-to-Core path on aura-frontend and
  # give the browser-facing web process its own loopback-bound edge network.
  # No other normal-stack service joins this network.
  aura-edge: {}
  aura-frontend:
    internal: true
    # Reserve a non-LAN browser network so Docker cannot capture the route to
    # an operator's Ollama host or VPN. Override on hosts with a conflicting
    # trusted range.
    ipam:
      config:
        - subnet: ${AURA_FRONTEND_SUBNET:-10.254.241.0/24}
  aura-core-db:
    internal: true
  aura-core-bus:
    internal: true
  # NATS is shared only by the Observatory dispatcher and Core evaluation
  # runner on this network; normal Core services remain on aura-core-bus.
  aura-evaluation-bus:
    internal: true
  # The run-evidence path is a dedicated private broker segment shared only
  # by Core publishers, the Observatory consumer, and its bootstrap job.
  aura-run-evidence-bus:
    internal: true
  aura-core-cache:
    internal: true
  # The parser has no route to any other service or the host. Core worker is
  # the only normal-stack client on this network.
  aura-document-parser:
    internal: true
    # Keep this private network outside the common 192.168.0.0/24 home LAN.
    # Operators can override the value for hosts with a conflicting VPN or
    # Docker route; the network remains internal and parser-only regardless.
    ipam:
      config:
        - subnet: ${AURA_DOCUMENT_PARSER_SUBNET:-10.254.240.16/28}
  # Garage has no host/browser attachment. Only Core API/worker and its
  # one-shot bootstrap job join this private object-storage network.
  aura-object-storage:
    internal: true
    # Four normal-stack members currently use this network (API, worker,
    # Garage, and bootstrap). A /28 leaves room for future private clients
    # while preventing Docker from choosing a LAN-overlapping subnet.
    ipam:
      config:
        - subnet: ${AURA_OBJECT_STORAGE_SUBNET:-10.254.240.0/28}
  # Intentionally non-internal: API reaches the configured OIDC discovery/JWKS
  # endpoint and API/worker reach their configured Ollama provider. No service
  # on this network publishes a host port.
  aura-core-egress: {}
  observatory-edge: {}
  observatory-api:
    internal: true
  observatory-db:
    internal: true
  observatory-session:
    internal: true
  observatory-ingest:
    internal: true
  # Only the Observatory API and configured OIDC provider join this narrowly
  # scoped identity egress network.
  observatory-identity-egress: {}
  # The judge network is intentionally internal: it cannot route arbitrary
  # public egress. Docker Desktop's internal-network semantics do not provide
  # a host-gateway exception, so the host/local Ollama boundary remains an
  # ADR_REQUIRED deployment concern until Docker can express that narrow route
  # without a proxy or additional capability.
  observatory-judge-egress:
    internal: true
  # Garage is the only shared endpoint; only the Observatory API, worker, and
  # narrowly scoped bootstrap jobs join this network for evaluation artifacts.
  observatory-object-storage:
    internal: true
    ipam:
      config:
        - subnet: ${AURA_OBSERVATORY_OBJECT_STORAGE_SUBNET:-10.254.242.0/28}
