            if (count >= 3 && fields[3] != "-" && fields[3] != "—") alias = fields[3];
            else if (count >= 4 && fields[4] != "-" && fields[4] != "—") alias = fields[4];
            if (alias == expected && expected != "") print expected;
            else if (alias != "") print alias;
            else print fields[2];
          }
          /^[[:space:]]*==== BUCKETS FOR THIS KEY ====[[:space:]]*$/ { table = 1; next }
          table && /^[[:space:]]*Permissions[[:space:]]+ID[[:space:]]+Global aliases[[:space:]]+Local aliases[[:space:]]*$/ { next }
          table && NF >= 2 { emit_row($$0); next }
          table { table = 0 }
        '; };
        extract_permission_flags() { printf '%s\n' "$${1}" | awk -v key="$${2}" 'index($$0, key) && NF > 0 { print $$1; found = 1; exit } END { if (!found) exit 1 }'; };
        key_info="$$(/garage --config /run/garage-config/garage.toml key info "$${access_key}" 2>/dev/null || true)";
        if [ -z "$${key_info}" ]; then if ! /garage --config /run/garage-config/garage.toml key import --yes "$${access_key}" "$${secret_key}" >/dev/null 2>&1; then echo 'Observatory judge Garage key import failed closed' >&2; exit 78; fi; fi;
        key_info="$$(/garage --config /run/garage-config/garage.toml key info "$${access_key}" 2>/dev/null || true)";
        if [ -z "$${key_info}" ]; then echo 'Observatory judge Garage key could not be inspected' >&2; exit 78; fi;
        existing_buckets="$$(extract_authorized_buckets "$${key_info}" "$${AURA_OBSERVATORY_GARAGE_BUCKET}")";
        unexpected_buckets="$$(printf '%s\n' "$${existing_buckets}" | grep -Fvx -- "$${AURA_OBSERVATORY_GARAGE_BUCKET}" || true)";
        if [ -n "$${unexpected_buckets}" ]; then echo 'Observatory judge Garage key has an unexpected preexisting bucket grant' >&2; exit 78; fi;
        if ! /garage --config /run/garage-config/garage.toml bucket info "$${AURA_OBSERVATORY_GARAGE_BUCKET}" >/dev/null 2>&1; then echo 'Observatory evaluation bucket is unavailable' >&2; exit 78; fi;
        if ! /garage --config /run/garage-config/garage.toml bucket allow --read --key "$${access_key}" "$${AURA_OBSERVATORY_GARAGE_BUCKET}" >/dev/null 2>&1; then echo 'Observatory judge Garage read grant failed closed' >&2; exit 78; fi;
        if ! /garage --config /run/garage-config/garage.toml bucket deny --write --key "$${access_key}" "$${AURA_OBSERVATORY_GARAGE_BUCKET}" >/dev/null 2>&1; then echo 'Observatory judge Garage write deny failed closed' >&2; exit 78; fi;
        if ! /garage --config /run/garage-config/garage.toml bucket deny --owner --key "$${access_key}" "$${AURA_OBSERVATORY_GARAGE_BUCKET}" >/dev/null 2>&1; then echo 'Observatory judge Garage owner deny failed closed' >&2; exit 78; fi;
        bucket_info="$$(/garage --config /run/garage-config/garage.toml bucket info "$${AURA_OBSERVATORY_GARAGE_BUCKET}" 2>/dev/null || true)";
        permission_flags="$$(extract_permission_flags "$${bucket_info}" "$${access_key}" || true)";
        if [ "$${permission_flags}" != "R" ]; then echo 'Observatory judge Garage permission verification failed closed (expected compact permission flag R)' >&2; exit 78; fi;
        key_info="$$(/garage --config /run/garage-config/garage.toml key info "$${access_key}" 2>/dev/null || true)";
        existing_buckets="$$(extract_authorized_buckets "$${key_info}" "$${AURA_OBSERVATORY_GARAGE_BUCKET}")";
        unexpected_buckets="$$(printf '%s\n' "$${existing_buckets}" | grep -Fvx -- "$${AURA_OBSERVATORY_GARAGE_BUCKET}" || true)";
        target_bucket_count="$$(printf '%s\n' "$${existing_buckets}" | grep -Fxc -- "$${AURA_OBSERVATORY_GARAGE_BUCKET}" || true)";
        if [ -n "$${unexpected_buckets}" ] || [ "$${target_bucket_count}" -ne 1 ]; then echo 'Observatory judge Garage key grant verification failed closed' >&2; exit 78; fi;
        unset access_key secret_key key_info bucket_info existing_buckets unexpected_buckets permission_flags target_bucket_count
    environment:
      AURA_GARAGE_IMAGE: ${AURA_GARAGE_IMAGE:-dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a}
      AURA_OBSERVATORY_GARAGE_BUCKET: ${AURA_OBSERVATORY_GARAGE_BUCKET:-aura-observatory-evaluation}
    secrets: [observatory-judge-garage-access-key, observatory-judge-garage-secret-key]
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-garage:/var/lib/garage:ro
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-garage-config:/run/garage-config:ro
    networks: [observatory-object-storage]
    depends_on:
      observatory-garage-bootstrap: {condition: service_completed_successfully}
    restart: "no"

