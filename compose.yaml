name: aura

services:
  aura-web:
    build:
      context: .
      dockerfile: deploy/docker/aura-web.Dockerfile
      target: runtime
    init: true
    ports:
      - "127.0.0.1:${AURA_WEB_PORT:-4200}:8080"
    depends_on:
      aura-core-api:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /var/cache/nginx:rw,noexec,nosuid,nodev
      - /var/run:rw,noexec,nosuid,nodev
    healthcheck:
      test: [CMD-SHELL, "wget --quiet --output-document=- http://127.0.0.1:8080/healthz | grep -q '^ok$'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks: [aura-frontend, aura-edge]

  aura-core-api:
    build:
      context: .
      dockerfile: deploy/docker/aura-api.Dockerfile
      target: runtime
    init: true
    environment:
      AURA_ENVIRONMENT: production
      AURA_ROLE: api
      AURA_DATABASE_HOST: aura-core-postgres
      AURA_DATABASE_PORT: "5432"
      AURA_DATABASE_NAME: ${AURA_CORE_DATABASE_NAME:-aura}
      AURA_DATABASE_USER: ${AURA_CORE_DATABASE_USER:-aura}
      AURA_DATABASE_PASSWORD_FILE: /run/secrets/aura-core-database-password
      AURA_NATS_URL: nats://aura-nats:4222
      AURA_NATS_USER: aura
      AURA_NATS_PASSWORD_FILE: /run/secrets/aura-nats-password
      AURA_VALKEY_URL: redis://aura-valkey:6379/0
      AURA_VALKEY_PASSWORD_FILE: /run/secrets/aura-valkey-password
      AURA_OBJECT_STORAGE_ENDPOINT: http://aura-garage:3900
      AURA_OBJECT_STORAGE_REGION: ${AURA_GARAGE_REGION:-garage}
      AURA_OBJECT_STORAGE_BUCKET: ${AURA_GARAGE_BUCKET:-aura-documents}
      AURA_OBJECT_STORAGE_ACCESS_KEY_FILE: /run/secrets/aura-garage-access-key
      AURA_OBJECT_STORAGE_SECRET_KEY_FILE: /run/secrets/aura-garage-secret-key
      AURA_OLLAMA_URL: ${AURA_OLLAMA_URL:-http://host.docker.internal:11434}
      AURA_DEFAULT_MODEL: ${AURA_DEFAULT_MODEL:-}
      AURA_DOCUMENT_EMBEDDING_MODEL: ${AURA_DOCUMENT_EMBEDDING_MODEL:-qwen3-embedding:4b}
      AURA_DOCUMENT_EMBEDDING_DIMENSION: ${AURA_DOCUMENT_EMBEDDING_DIMENSION:-768}
      AURA_CONTEXT_TOKEN_BUDGET: ${AURA_CONTEXT_TOKEN_BUDGET:-8192}
      AURA_OLLAMA_RUN_TIMEOUT_SECONDS: ${AURA_OLLAMA_RUN_TIMEOUT_SECONDS:-300}
      AURA_OLLAMA_INVENTORY_TIMEOUT_SECONDS: ${AURA_OLLAMA_INVENTORY_TIMEOUT_SECONDS:-5}
      AURA_OLLAMA_VERIFICATION_TIMEOUT_SECONDS: ${AURA_OLLAMA_VERIFICATION_TIMEOUT_SECONDS:-60}
      AURA_OLLAMA_INVENTORY_CACHE_TTL_SECONDS: ${AURA_OLLAMA_INVENTORY_CACHE_TTL_SECONDS:-15}
      AURA_TELEMETRY_OTLP_ENABLED: ${AURA_TELEMETRY_OTLP_ENABLED:-false}
      AURA_TELEMETRY_OTLP_ENDPOINT: ${AURA_TELEMETRY_OTLP_ENDPOINT:-http://observatory-collector:4318/v1/observations}
      AURA_TELEMETRY_OTLP_QUEUE_CAPACITY: ${AURA_TELEMETRY_OTLP_QUEUE_CAPACITY:-32}
      AURA_TELEMETRY_OTLP_MAX_ATTEMPTS: ${AURA_TELEMETRY_OTLP_MAX_ATTEMPTS:-3}
      AURA_TELEMETRY_OTLP_TIMEOUT_SECONDS: ${AURA_TELEMETRY_OTLP_TIMEOUT_SECONDS:-2}
      AURA_TELEMETRY_DEPLOYMENT_ID: ${AURA_TELEMETRY_DEPLOYMENT_ID:-local}
      AURA_TELEMETRY_GIT_COMMIT: ${AURA_TELEMETRY_GIT_COMMIT:-0000000}
      AURA_TELEMETRY_HOST_ID: ${AURA_TELEMETRY_HOST_ID:-local}
      AURA_TELEMETRY_IMAGE_VERSION: ${AURA_TELEMETRY_IMAGE_VERSION:-local}
      AURA_TELEMETRY_CONFIGURATION_VERSION: ${AURA_TELEMETRY_CONFIGURATION_VERSION:-local}
      # Full run-evidence capture is owner opt-in; the empty default keeps
      # Core execution metadata-only and independent of Observatory health.
      AURA_RUN_EVIDENCE_CAPTURE_POLICY: ${AURA_RUN_EVIDENCE_CAPTURE_POLICY:-}
      AURA_RUN_EVIDENCE_CAPTURE_REVISION: ${AURA_RUN_EVIDENCE_CAPTURE_REVISION:-full-content-v1}
      AURA_RUN_EVIDENCE_MAX_BYTES: ${AURA_RUN_EVIDENCE_MAX_BYTES:-1048576}
      AURA_OIDC_ISSUER: ${AURA_OIDC_ISSUER:?AURA_OIDC_ISSUER must be a stable non-localhost HTTPS issuer}
      AURA_OIDC_AUDIENCE: ${AURA_OIDC_AUDIENCE:-aura-web}
      AURA_OIDC_CLIENT_ID: ${AURA_OIDC_CLIENT_ID:-aura-web}
      AURA_OIDC_CLIENT_SECRET_FILE: /run/secrets/aura-oidc-client-secret
      AURA_OIDC_REDIRECT_URI: ${AURA_OIDC_REDIRECT_URI:?AURA_OIDC_REDIRECT_URI must match the configured Aura public origin}
      AURA_OWNER_SUBJECT: ${AURA_OWNER_SUBJECT:?AURA_OWNER_SUBJECT must be configured for owner authorization}
      AURA_PUBLIC_ORIGIN: ${AURA_PUBLIC_ORIGIN:?AURA_PUBLIC_ORIGIN must be a stable HTTPS origin}
      AURA_SECURE_COOKIES: "true"
    secrets: [aura-core-database-password, aura-oidc-client-secret, aura-nats-password, aura-valkey-password, aura-garage-access-key, aura-garage-secret-key]
    # Only Core entrypoints need to contact configured external providers.
    # Keep all browser-facing and stateful service paths on internal networks.
    # Established Core attachments remain unchanged; observatory-ingest is an
    # additional optional Collector path for metadata-only export.
    # networks: [aura-frontend, aura-core-db, aura-core-bus, aura-core-cache, aura-object-storage, aura-core-egress]
    networks: [aura-frontend, aura-core-db, aura-core-bus, aura-core-cache, aura-object-storage, aura-core-egress, observatory-ingest, aura-run-evidence-bus]
    # Docker Desktop provides this name automatically; Linux Engine needs the
    # explicit gateway mapping for the local Ollama development default.
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      aura-core-migrate: {condition: service_completed_successfully}
      aura-core-postgres: {condition: service_healthy}
      aura-nats: {condition: service_started}
      aura-valkey: {condition: service_healthy}
      aura-garage-bootstrap: {condition: service_completed_successfully}
    expose: ["8000"]
    healthcheck:
      # The Core runtime image is Python slim and intentionally does not
      # include a shell HTTP client. Keep this aligned with its Dockerfile
      # healthcheck rather than adding a package solely for probing.
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  aura-core-worker:
    build:
      context: .
      dockerfile: deploy/docker/aura-worker.Dockerfile
      target: runtime
    init: true
    environment:
      AURA_ENVIRONMENT: production
      AURA_ROLE: worker
      AURA_DATABASE_HOST: aura-core-postgres
      AURA_DATABASE_PORT: "5432"
      AURA_DATABASE_NAME: ${AURA_CORE_DATABASE_NAME:-aura}
      AURA_DATABASE_USER: ${AURA_CORE_DATABASE_USER:-aura}
      AURA_DATABASE_PASSWORD_FILE: /run/secrets/aura-core-database-password
      AURA_NATS_URL: nats://aura-nats:4222
      AURA_NATS_USER: aura
      AURA_NATS_PASSWORD_FILE: /run/secrets/aura-nats-password
      AURA_VALKEY_URL: redis://aura-valkey:6379/0
      AURA_VALKEY_PASSWORD_FILE: /run/secrets/aura-valkey-password
      AURA_OBJECT_STORAGE_ENDPOINT: http://aura-garage:3900
      AURA_OBJECT_STORAGE_REGION: ${AURA_GARAGE_REGION:-garage}
      AURA_OBJECT_STORAGE_BUCKET: ${AURA_GARAGE_BUCKET:-aura-documents}
      AURA_OBJECT_STORAGE_ACCESS_KEY_FILE: /run/secrets/aura-garage-access-key
      AURA_OBJECT_STORAGE_SECRET_KEY_FILE: /run/secrets/aura-garage-secret-key
      AURA_DOCUMENT_PARSER_URL: http://aura-document-parser:8080
      AURA_OLLAMA_URL: ${AURA_OLLAMA_URL:-http://host.docker.internal:11434}
      AURA_DEFAULT_MODEL: ${AURA_DEFAULT_MODEL:-}
      AURA_DOCUMENT_EMBEDDING_MODEL: ${AURA_DOCUMENT_EMBEDDING_MODEL:-qwen3-embedding:4b}
      AURA_DOCUMENT_EMBEDDING_DIMENSION: ${AURA_DOCUMENT_EMBEDDING_DIMENSION:-768}
      AURA_CONTEXT_TOKEN_BUDGET: ${AURA_CONTEXT_TOKEN_BUDGET:-8192}
      AURA_OLLAMA_RUN_TIMEOUT_SECONDS: ${AURA_OLLAMA_RUN_TIMEOUT_SECONDS:-300}
      AURA_OLLAMA_INVENTORY_TIMEOUT_SECONDS: ${AURA_OLLAMA_INVENTORY_TIMEOUT_SECONDS:-5}
      AURA_OLLAMA_VERIFICATION_TIMEOUT_SECONDS: ${AURA_OLLAMA_VERIFICATION_TIMEOUT_SECONDS:-60}
      AURA_OLLAMA_INVENTORY_CACHE_TTL_SECONDS: ${AURA_OLLAMA_INVENTORY_CACHE_TTL_SECONDS:-15}
      AURA_TELEMETRY_OTLP_ENABLED: ${AURA_TELEMETRY_OTLP_ENABLED:-false}
      AURA_TELEMETRY_OTLP_ENDPOINT: ${AURA_TELEMETRY_OTLP_ENDPOINT:-http://observatory-collector:4318/v1/observations}
      AURA_TELEMETRY_OTLP_QUEUE_CAPACITY: ${AURA_TELEMETRY_OTLP_QUEUE_CAPACITY:-32}
      AURA_TELEMETRY_OTLP_MAX_ATTEMPTS: ${AURA_TELEMETRY_OTLP_MAX_ATTEMPTS:-3}
      AURA_TELEMETRY_OTLP_TIMEOUT_SECONDS: ${AURA_TELEMETRY_OTLP_TIMEOUT_SECONDS:-2}
      AURA_TELEMETRY_DEPLOYMENT_ID: ${AURA_TELEMETRY_DEPLOYMENT_ID:-local}
      AURA_TELEMETRY_GIT_COMMIT: ${AURA_TELEMETRY_GIT_COMMIT:-0000000}
      AURA_TELEMETRY_HOST_ID: ${AURA_TELEMETRY_HOST_ID:-local}
      AURA_TELEMETRY_IMAGE_VERSION: ${AURA_TELEMETRY_IMAGE_VERSION:-local}
      AURA_TELEMETRY_CONFIGURATION_VERSION: ${AURA_TELEMETRY_CONFIGURATION_VERSION:-local}
      # Keep the worker's recorder policy identical to the API composition
      # root, while retaining an explicit disabled-by-default deployment.
      AURA_RUN_EVIDENCE_CAPTURE_POLICY: ${AURA_RUN_EVIDENCE_CAPTURE_POLICY:-}
      AURA_RUN_EVIDENCE_CAPTURE_REVISION: ${AURA_RUN_EVIDENCE_CAPTURE_REVISION:-full-content-v1}
      AURA_RUN_EVIDENCE_MAX_BYTES: ${AURA_RUN_EVIDENCE_MAX_BYTES:-1048576}
    secrets: [aura-core-database-password, aura-nats-password, aura-valkey-password, aura-garage-access-key, aura-garage-secret-key]
    # The worker invokes Ollama, but has no browser-facing network attachment.
    networks: [aura-core-db, aura-core-bus, aura-core-cache, aura-object-storage, aura-document-parser, aura-core-egress, observatory-ingest, aura-run-evidence-bus]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      aura-core-migrate: {condition: service_completed_successfully}
      aura-core-postgres: {condition: service_healthy}
      aura-nats: {condition: service_started}
      aura-valkey: {condition: service_healthy}
      aura-garage-bootstrap: {condition: service_completed_successfully}
      aura-document-parser: {condition: service_healthy}
    restart: unless-stopped

  aura-core-scheduler:
    build:
      context: .
      dockerfile: deploy/docker/aura-scheduler.Dockerfile
      target: runtime
    init: true
    environment:
      AURA_ENVIRONMENT: production
      AURA_ROLE: scheduler
      AURA_DATABASE_HOST: aura-core-postgres
      AURA_DATABASE_PORT: "5432"
      AURA_DATABASE_NAME: ${AURA_CORE_DATABASE_NAME:-aura}
      AURA_DATABASE_USER: ${AURA_CORE_DATABASE_USER:-aura}
      AURA_DATABASE_PASSWORD_FILE: /run/secrets/aura-core-database-password
      AURA_TELEMETRY_OTLP_ENABLED: ${AURA_TELEMETRY_OTLP_ENABLED:-false}
      AURA_TELEMETRY_OTLP_ENDPOINT: ${AURA_TELEMETRY_OTLP_ENDPOINT:-http://observatory-collector:4318/v1/observations}
      AURA_TELEMETRY_OTLP_QUEUE_CAPACITY: ${AURA_TELEMETRY_OTLP_QUEUE_CAPACITY:-32}
      AURA_TELEMETRY_OTLP_MAX_ATTEMPTS: ${AURA_TELEMETRY_OTLP_MAX_ATTEMPTS:-3}
      AURA_TELEMETRY_OTLP_TIMEOUT_SECONDS: ${AURA_TELEMETRY_OTLP_TIMEOUT_SECONDS:-2}
      AURA_TELEMETRY_DEPLOYMENT_ID: ${AURA_TELEMETRY_DEPLOYMENT_ID:-local}
      AURA_TELEMETRY_GIT_COMMIT: ${AURA_TELEMETRY_GIT_COMMIT:-0000000}
      AURA_TELEMETRY_HOST_ID: ${AURA_TELEMETRY_HOST_ID:-local}
      AURA_TELEMETRY_IMAGE_VERSION: ${AURA_TELEMETRY_IMAGE_VERSION:-local}
      AURA_TELEMETRY_CONFIGURATION_VERSION: ${AURA_TELEMETRY_CONFIGURATION_VERSION:-local}
    secrets: [aura-core-database-password]
    # The scheduler has no service dependency on Observatory, but may emit
    # bounded telemetry when the optional Collector is present.
    networks: [aura-core-db, observatory-ingest]
    depends_on:
      aura-core-migrate: {condition: service_completed_successfully}
      aura-core-postgres: {condition: service_healthy}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    restart: unless-stopped

  aura-core-migrate:
    build:
      context: .
      dockerfile: deploy/docker/aura-api.Dockerfile
      target: runtime
    init: true
    command: [/usr/local/bin/aura-core-migrate]
    environment:
      AURA_ROLE: migrate
      AURA_DATABASE_HOST: aura-core-postgres
      AURA_DATABASE_PORT: "5432"
      AURA_DATABASE_NAME: ${AURA_CORE_DATABASE_NAME:-aura}
      AURA_DATABASE_USER: ${AURA_CORE_DATABASE_USER:-aura}
      AURA_DATABASE_PASSWORD_FILE: /run/secrets/aura-core-database-password
      AURA_DEFAULT_MODEL: ${AURA_DEFAULT_MODEL:-}
    secrets: [aura-core-database-password]
    networks: [aura-core-db]
    # This is a short-lived CLI job, not the API process whose inherited image
    # healthcheck probes port 8000. Completion is its readiness signal.
    healthcheck:
      disable: true
    depends_on:
      aura-core-postgres: {condition: service_healthy}
    restart: "no"

  # Create the runner's least-privilege PostgreSQL role only after the
  # Core-owned migration has materialized its ledger tables. The Core
  # database password is mounted here for bootstrap only; the long-running
  # runner receives only its dedicated password below.
  aura-evaluation-runner-db-bootstrap:
    profiles: [observatory]
    image: ${AURA_CORE_POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        core_password="$$(cat /run/secrets/aura-core-database-password)";
        case "$${AURA_EVALUATION_RUNNER_DATABASE_USER}" in *[!A-Za-z0-9_]*|'') echo 'invalid runner database role' >&2; exit 78 ;; esac;
        export PGPASSWORD="$${core_password}";
        until pg_isready -h aura-core-postgres -p 5432 -U "$${AURA_CORE_DATABASE_USER}" -d "$${AURA_CORE_DATABASE_NAME}" >/dev/null 2>&1; do sleep 2; done;
        psql -v ON_ERROR_STOP=1 -h aura-core-postgres -p 5432 -U "$${AURA_CORE_DATABASE_USER}" -d "$${AURA_CORE_DATABASE_NAME}" -Atqc "SELECT 1 FROM pg_roles WHERE rolname = '$${AURA_EVALUATION_RUNNER_DATABASE_USER}'" | grep -qx 1 || psql -v ON_ERROR_STOP=1 -h aura-core-postgres -p 5432 -U "$${AURA_CORE_DATABASE_USER}" -d "$${AURA_CORE_DATABASE_NAME}" -c "CREATE ROLE \"$${AURA_EVALUATION_RUNNER_DATABASE_USER}\" LOGIN";
        AURA_EVALUATION_RUNNER_DATABASE_PASSWORD="$$(cat /run/secrets/aura-evaluation-runner-database-password)" psql -v ON_ERROR_STOP=1 -h aura-core-postgres -p 5432 -U "$${AURA_CORE_DATABASE_USER}" -d "$${AURA_CORE_DATABASE_NAME}" -v runner_role="$${AURA_EVALUATION_RUNNER_DATABASE_USER}" <<'SQL'
        \getenv runner_password AURA_EVALUATION_RUNNER_DATABASE_PASSWORD
        ALTER ROLE :"runner_role" PASSWORD :'runner_password';
        SQL
        psql -v ON_ERROR_STOP=1 -h aura-core-postgres -p 5432 -U "$${AURA_CORE_DATABASE_USER}" -d "$${AURA_CORE_DATABASE_NAME}" -c "REVOKE ALL ON SCHEMA public FROM \"$${AURA_EVALUATION_RUNNER_DATABASE_USER}\"; GRANT USAGE ON SCHEMA public TO \"$${AURA_EVALUATION_RUNNER_DATABASE_USER}\"; REVOKE ALL ON ALL TABLES IN SCHEMA public FROM \"$${AURA_EVALUATION_RUNNER_DATABASE_USER}\"; GRANT SELECT, INSERT, UPDATE ON TABLE evaluation_runner_attempts, evaluation_runner_terminal_outbox, evaluation_runner_cancellations TO \"$${AURA_EVALUATION_RUNNER_DATABASE_USER}\"; GRANT REFERENCES ON TABLE evaluation_runner_attempts TO \"$${AURA_EVALUATION_RUNNER_DATABASE_USER}\";";
        for sequence_name in $$(psql -v ON_ERROR_STOP=1 -h aura-core-postgres -p 5432 -U "$${AURA_CORE_DATABASE_USER}" -d "$${AURA_CORE_DATABASE_NAME}" -Atqc "SELECT quote_ident(sequence_name) FROM information_schema.sequences WHERE sequence_schema = 'public' AND sequence_name LIKE 'evaluation_runner_%'"); do psql -v ON_ERROR_STOP=1 -h aura-core-postgres -p 5432 -U "$${AURA_CORE_DATABASE_USER}" -d "$${AURA_CORE_DATABASE_NAME}" -c "GRANT USAGE, SELECT, UPDATE ON SEQUENCE public.$${sequence_name} TO \"$${AURA_EVALUATION_RUNNER_DATABASE_USER}\""; done;
        unset PGPASSWORD core_password AURA_EVALUATION_RUNNER_DATABASE_PASSWORD
    environment:
      AURA_CORE_DATABASE_NAME: ${AURA_CORE_DATABASE_NAME:-aura}
      AURA_CORE_DATABASE_USER: ${AURA_CORE_DATABASE_USER:-aura}
      AURA_EVALUATION_RUNNER_DATABASE_USER: ${AURA_EVALUATION_RUNNER_DATABASE_USER:-aura_evaluation_runner}
    secrets: [aura-core-database-password, aura-evaluation-runner-database-password]
    networks: [aura-core-db]
    depends_on:
      aura-core-migrate: {condition: service_completed_successfully}
      aura-core-postgres: {condition: service_healthy}
    restart: "no"

  aura-core-postgres:
    # Core needs PostgreSQL 17 with the pgvector extension available for its
    # service-owned memory embeddings. Keep the image overrideable so
    # operators can pin a locally mirrored digest without changing topology.
    image: ${AURA_CORE_POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    environment:
      POSTGRES_DB: ${AURA_CORE_DATABASE_NAME:-aura}
      POSTGRES_USER: ${AURA_CORE_DATABASE_USER:-aura}
      POSTGRES_PASSWORD_FILE: /run/secrets/aura-core-database-password
    secrets: [aura-core-database-password]
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-core-postgres:/var/lib/postgresql/data
    networks: [aura-core-db]
    healthcheck:
      # The official image briefly starts a temporary PostgreSQL server while
      # initializing a new data directory.  pg_isready alone reports that
      # server as ready and can race the migration job; PID 1 is `postgres`
      # only after the entrypoint has switched to the final server.
      test: [CMD-SHELL, "test \"$$(tr -d '\\000' </proc/1/cmdline)\" = postgres && pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  aura-nats:
    image: ${AURA_NATS_IMAGE:-nats:2.10.22-alpine}
    entrypoint: [/usr/local/bin/aura-nats-entrypoint]
    environment:
      AURA_NATS_USER: ${AURA_NATS_USER:-aura}
      AURA_NATS_BOOTSTRAP_USER: ${AURA_NATS_BOOTSTRAP_USER:-aura-evaluation-bootstrap}
      AURA_NATS_DISPATCH_USER: ${AURA_NATS_DISPATCH_USER:-aura-evaluation-dispatch}
      AURA_NATS_RUNNER_USER: ${AURA_NATS_RUNNER_USER:-aura-evaluation-runner}
      AURA_NATS_RUN_EVIDENCE_USER: ${AURA_NATS_RUN_EVIDENCE_USER:-aura-observatory-run-evidence}
      AURA_NATS_RUN_EVIDENCE_BOOTSTRAP_USER: ${AURA_NATS_RUN_EVIDENCE_BOOTSTRAP_USER:-aura-run-evidence-bootstrap}
    secrets: [aura-nats-password, aura-nats-bootstrap-password, aura-nats-run-evidence-bootstrap-password, aura-nats-dispatch-password, aura-nats-runner-password, aura-nats-run-evidence-password]
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-nats:/data
      - ./deploy/docker/nats-entrypoint.sh:/usr/local/bin/aura-nats-entrypoint:ro
    expose: ["4222", "8222"]
    networks: [aura-core-bus, aura-evaluation-bus, aura-run-evidence-bus]
    restart: unless-stopped

  aura-evaluation-nats-bootstrap:
    profiles: [observatory]
    build:
      context: .
      dockerfile: deploy/docker/aura-evaluation-runner.Dockerfile
      target: runtime
    init: true
    entrypoint: [/usr/local/bin/nats-evaluation-bootstrap]
    environment:
      AURA_NATS_BOOTSTRAP_USER: ${AURA_NATS_BOOTSTRAP_USER:-aura-evaluation-bootstrap}
    secrets: [aura-nats-bootstrap-password]
    networks: [aura-evaluation-bus]
    depends_on:
      aura-nats: {condition: service_started}
    restart: "no"

  aura-run-evidence-nats-bootstrap:
    profiles: [observatory]
    build:
      context: .
      dockerfile: deploy/docker/aura-evaluation-runner.Dockerfile
      target: runtime
    init: true
    entrypoint: [/usr/local/bin/nats-run-evidence-bootstrap]
    environment:
      AURA_NATS_RUN_EVIDENCE_BOOTSTRAP_USER: ${AURA_NATS_RUN_EVIDENCE_BOOTSTRAP_USER:-aura-run-evidence-bootstrap}
    secrets: [aura-nats-run-evidence-bootstrap-password]
    volumes:
      - ./deploy/docker/nats-run-evidence-bootstrap.sh:/usr/local/bin/nats-run-evidence-bootstrap:ro
    networks: [aura-run-evidence-bus]
    depends_on:
      aura-nats: {condition: service_started}
    restart: "no"

  aura-valkey:
    image: ${AURA_VALKEY_IMAGE:-valkey/valkey:8.1-alpine}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        export VALKEY_PASSWORD="$$(cat /run/secrets/aura-valkey-password)";
        exec valkey-server --save "" --appendonly no --requirepass "$$VALKEY_PASSWORD"
    secrets: [aura-valkey-password]
    healthcheck:
      test: [CMD-SHELL, "valkey-cli -a \"$$(cat /run/secrets/aura-valkey-password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [aura-core-cache]
    restart: unless-stopped

  frontend-checks:
    profiles: [checks]
    build:
      context: .
      dockerfile: deploy/docker/aura-web.Dockerfile
      target: frontend-checks
    command: [sh, -c, "pnpm --dir frontend run lint && pnpm --dir frontend run test && pnpm --dir frontend run build:production && pnpm --dir frontend run pwa:inject && pnpm --dir frontend run build-storybook"]

  frontend-e2e:
    profiles: [checks]
    build:
      context: .
      dockerfile: deploy/docker/aura-web.Dockerfile
      target: frontend-e2e
    depends_on:
      aura-web: {condition: service_healthy}
    environment:
      BASE_URL: http://aura-web:8080
    # Browser checks exercise the published web origin, not Core or provider
    # internals. Compose otherwise places a profile-only service on its
    # implicit default network, where aura-web is deliberately unreachable.
    networks: [aura-frontend]
    command: [sh, -c, "pnpm --dir frontend exec playwright test --config=/workspace/playwright.compose.config.ts"]

  aura-document-parser:
    build:
      context: .
      dockerfile: deploy/docker/aura-worker.Dockerfile
      target: document-parser
    init: true
    # The runtime dependencies are installed in the uv-managed virtualenv;
    # invoke the parser with that interpreter rather than the base image Python.
    entrypoint: [/app/.venv/bin/python, /usr/local/bin/document-parser-service.py]
    expose: ["8080"]
    # The parser receives hostile document bytes. Keep it on a private,
    # single-purpose network with no database, broker, cache, object-store,
    # identity, provider, host, or general-egress attachment.
    networks: [aura-document-parser]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 64
    ulimits:
      nofile:
        soft: 128
        hard: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=1); raise SystemExit(0 if response.read() == b'ok' else 1)"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  aura-garage:
    # Garage is intentionally required to be digest-qualified. The digest is
    # an operator-reviewed deployment input because this repository does not
    # perform registry lookups during configuration validation.
    image: ${AURA_GARAGE_IMAGE:-dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a}
    entrypoint: [/garage]
    command: [--config, /run/garage-config/garage.toml, server]
    environment:
      AURA_GARAGE_IMAGE: ${AURA_GARAGE_IMAGE:-dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a}
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-garage:/var/lib/garage
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-garage-config:/run/garage-config:ro
    networks: [aura-object-storage, observatory-object-storage]
    depends_on:
      aura-garage-config: {condition: service_completed_successfully}
    expose: ["3900"]
    healthcheck:
      test: [CMD, /garage, --config, /run/garage-config/garage.toml, status]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    restart: unless-stopped

  aura-garage-config:
    image: ${AURA_GARAGE_CONFIG_IMAGE:-busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        case "$${AURA_GARAGE_IMAGE}" in *@sha256:*) ;; *) echo 'AURA_GARAGE_IMAGE must use a sha256 digest' >&2; exit 64 ;; esac;
        rpc_secret="$$(cat /run/secrets/aura-garage-rpc-secret)";
        test -n "$${rpc_secret}";
        sed "s/__GARAGE_RPC_SECRET__/$${rpc_secret}/" /etc/garage/garage.toml.template > /run/garage-config/garage.toml;
        chmod 0600 /run/garage-config/garage.toml;
        unset rpc_secret
    environment:
      AURA_GARAGE_IMAGE: ${AURA_GARAGE_IMAGE:-dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a}
    secrets: [aura-garage-rpc-secret]
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-garage-config:/run/garage-config
      - ./deploy/docker/garage.toml:/etc/garage/garage.toml.template:ro
    network_mode: none
    restart: "no"

  aura-garage-bootstrap:
    build:
      context: .
      dockerfile: deploy/docker/garage-bootstrap.Dockerfile
      args:
        GARAGE_IMAGE: ${AURA_GARAGE_IMAGE:-dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a}
        BUSYBOX_IMAGE: ${AURA_GARAGE_CONFIG_IMAGE:-busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        case "$${AURA_GARAGE_IMAGE}" in *@sha256:*) ;; *) echo 'AURA_GARAGE_IMAGE must use a sha256 digest' >&2; exit 64 ;; esac;
        access_key="$$(cat /run/secrets/aura-garage-access-key)";
        secret_key="$$(cat /run/secrets/aura-garage-secret-key)";
        until /garage --config /run/garage-config/garage.toml status >/dev/null 2>&1; do sleep 2; done;
        node_id="$$(/garage --config /run/garage-config/garage.toml node id 2>/dev/null | cut -d@ -f1)";
        if [ -z "$${node_id}" ]; then echo 'Garage node identity unavailable' >&2; exit 1; fi;
        if ! /garage --config /run/garage-config/garage.toml layout show | grep -Fq "$${node_id}"; then /garage --config /run/garage-config/garage.toml layout assign "$${node_id}" -z dc1 -c 1GB; fi;
        if ! /garage --config /run/garage-config/garage.toml layout show | grep -Eq 'Current cluster layout version: [1-9][0-9]*'; then /garage --config /run/garage-config/garage.toml layout apply --version 1; fi;
        if ! /garage --config /run/garage-config/garage.toml key info "$${access_key}" >/dev/null 2>&1; then if ! /garage --config /run/garage-config/garage.toml key import --yes "$${access_key}" "$${secret_key}" >/dev/null 2>&1; then echo 'Core Garage key import failed closed' >&2; exit 78; fi; fi;
        if ! /garage --config /run/garage-config/garage.toml bucket info "$${AURA_GARAGE_BUCKET}" >/dev/null 2>&1; then /garage --config /run/garage-config/garage.toml bucket create "$${AURA_GARAGE_BUCKET}"; fi;
        if ! /garage --config /run/garage-config/garage.toml bucket allow --read --write --key "$${access_key}" "$${AURA_GARAGE_BUCKET}" >/dev/null 2>&1; then echo 'Core Garage grant failed closed' >&2; exit 78; fi;
        unset access_key secret_key
    environment:
      AURA_GARAGE_IMAGE: ${AURA_GARAGE_IMAGE:-dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a}
      AURA_GARAGE_BUCKET: ${AURA_GARAGE_BUCKET:-aura-documents}
    secrets: [aura-garage-access-key, aura-garage-secret-key]
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-garage:/var/lib/garage:ro
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-garage-config:/run/garage-config:ro
    networks: [aura-object-storage]
    depends_on:
      aura-garage: {condition: service_healthy}
      aura-garage-config: {condition: service_completed_successfully}
    restart: "no"

  # Observatory provisions its own Garage key and bucket through a separate
  # one-shot job. Core's bootstrap never receives these credentials, and the
  # worker is the only long-running Observatory service attached to this
  # private object-storage network.
  observatory-garage-bootstrap:
    profiles: [observatory]
    build:
      context: .
      dockerfile: deploy/docker/garage-bootstrap.Dockerfile
      args:
        GARAGE_IMAGE: ${AURA_GARAGE_IMAGE:-dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a}
        BUSYBOX_IMAGE: ${AURA_GARAGE_CONFIG_IMAGE:-busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        case "$${AURA_GARAGE_IMAGE}" in *@sha256:*) ;; *) echo 'AURA_GARAGE_IMAGE must use a sha256 digest' >&2; exit 64 ;; esac;
        access_key="$$(cat /run/secrets/observatory-garage-access-key)";
        secret_key="$$(cat /run/secrets/observatory-garage-secret-key)";
        if [ -z "$${AURA_GARAGE_BUCKET}" ] || [ -z "$${AURA_OBSERVATORY_GARAGE_BUCKET}" ] || [ "$${AURA_GARAGE_BUCKET}" = "$${AURA_OBSERVATORY_GARAGE_BUCKET}" ]; then echo 'Garage Core and Observatory buckets must be configured and differ' >&2; exit 78; fi;
        until /garage --config /run/garage-config/garage.toml status >/dev/null 2>&1; do sleep 2; done;
        extract_authorized_buckets() { printf '%s\n' "$${1}" | awk -v expected="$${2}" '
          function emit_row(line, count, fields, alias) {
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", line);
            count = split(line, fields, /[[:space:]]+/);
            if (count < 2 || fields[2] !~ /^[[:xdigit:]]+$/ || length(fields[2]) != 16) return;
            alias = "";
            if (count >= 3 && fields[3] != "-" && fields[3] != "—") alias = fields[3];
            else if (count >= 4 && fields[4] != "-" && fields[4] != "—") alias = fields[4];
            if (alias == expected && expected != "") print expected;
            else if (alias != "") print alias;
            else print fields[2];
          }
          /^[[:space:]]*==== BUCKETS FOR THIS KEY ====[[:space:]]*$/ { table = 1; next }
          table && /^[[:space:]]*Permissions[[:space:]]+ID[[:space:]]+Global aliases[[:space:]]+Local aliases[[:space:]]*$/ { next }
        table && NF >= 2 { emit_row($$0); next }
          table { table = 0 }
        '; };
        extract_permission_flags() { printf '%s\n' "$${1}" | awk -v key="$${2}" '
          index($$0, key) && NF > 0 { print $$1; found = 1; exit }
          END { if (!found) exit 1 }
        '; };
        key_info="$$(/garage --config /run/garage-config/garage.toml key info "$${access_key}" 2>/dev/null || true)";
        if [ -z "$${key_info}" ]; then if ! /garage --config /run/garage-config/garage.toml key import --yes "$${access_key}" "$${secret_key}" >/dev/null 2>&1; then echo 'Observatory Garage key import failed closed' >&2; exit 78; fi; key_info="$$(/garage --config /run/garage-config/garage.toml key info "$${access_key}" 2>/dev/null || true)"; fi;
        if [ -z "$${key_info}" ]; then echo 'Observatory Garage key could not be inspected' >&2; exit 78; fi;
        existing_buckets="$$(extract_authorized_buckets "$${key_info}" "$${AURA_OBSERVATORY_GARAGE_BUCKET}")";
        unexpected_buckets="$$(printf '%s\n' "$${existing_buckets}" | grep -Fvx -- "$${AURA_OBSERVATORY_GARAGE_BUCKET}" || true)";
        if [ -n "$${unexpected_buckets}" ] || { [ -n "$${AURA_GARAGE_BUCKET}" ] && printf '%s\n' "$${existing_buckets}" | grep -Fqx -- "$${AURA_GARAGE_BUCKET}"; }; then echo 'Observatory Garage key has an unexpected preexisting bucket grant' >&2; exit 78; fi;
        if ! /garage --config /run/garage-config/garage.toml bucket info "$${AURA_OBSERVATORY_GARAGE_BUCKET}" >/dev/null 2>&1; then /garage --config /run/garage-config/garage.toml bucket create "$${AURA_OBSERVATORY_GARAGE_BUCKET}"; fi;
        : 'Garage v2.1 requires the write grant to establish the key-to-bucket association before permission cleanup.';
        if ! /garage --config /run/garage-config/garage.toml bucket allow --write --key "$${access_key}" "$${AURA_OBSERVATORY_GARAGE_BUCKET}" >/dev/null 2>&1; then echo 'Observatory Garage write grant failed closed' >&2; exit 78; fi;
        : 'Remove a pre-existing read grant and owner grant after association; failures remain fail closed.';
        if ! /garage --config /run/garage-config/garage.toml bucket deny --read --key "$${access_key}" "$${AURA_OBSERVATORY_GARAGE_BUCKET}" >/dev/null 2>&1; then echo 'Observatory Garage read deny failed closed' >&2; exit 78; fi;
        if ! /garage --config /run/garage-config/garage.toml bucket deny --owner --key "$${access_key}" "$${AURA_OBSERVATORY_GARAGE_BUCKET}" >/dev/null 2>&1; then echo 'Observatory Garage owner deny failed closed' >&2; exit 78; fi;
        bucket_info="$$(/garage --config /run/garage-config/garage.toml bucket info "$${AURA_OBSERVATORY_GARAGE_BUCKET}" 2>/dev/null || true)";
        permission_flags="$$(extract_permission_flags "$${bucket_info}" "$${access_key}" || true)";
        : 'Compact Garage flags are authoritative; legacy has_read_disabled, has_owner_disabled, and has_write_grant word probes are intentionally not used.';
        if [ "$${permission_flags}" != "W" ]; then echo 'Observatory Garage read/write/owner permission verification failed closed (expected compact permission flag W)' >&2; exit 78; fi;
        key_info="$$(/garage --config /run/garage-config/garage.toml key info "$${access_key}" 2>/dev/null || true)";
        if [ -z "$${key_info}" ]; then echo 'Observatory Garage key could not be verified after grant' >&2; exit 78; fi;
        existing_buckets="$$(extract_authorized_buckets "$${key_info}" "$${AURA_OBSERVATORY_GARAGE_BUCKET}")";
        unexpected_buckets="$$(printf '%s\n' "$${existing_buckets}" | grep -Fvx -- "$${AURA_OBSERVATORY_GARAGE_BUCKET}" || true)";
        target_bucket_count="$$(printf '%s\n' "$${existing_buckets}" | grep -Fxc -- "$${AURA_OBSERVATORY_GARAGE_BUCKET}" || true)";
        if [ -n "$${unexpected_buckets}" ] || [ "$${target_bucket_count}" -ne 1 ]; then echo 'Observatory Garage key grant verification failed closed' >&2; exit 78; fi;
        unset access_key secret_key
    environment:
      AURA_GARAGE_IMAGE: ${AURA_GARAGE_IMAGE:-dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a}
      AURA_GARAGE_BUCKET: ${AURA_GARAGE_BUCKET:-aura-documents}
      AURA_OBSERVATORY_GARAGE_BUCKET: ${AURA_OBSERVATORY_GARAGE_BUCKET:-aura-observatory-evaluation}
    secrets: [observatory-garage-access-key, observatory-garage-secret-key]
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-garage:/var/lib/garage:ro
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-garage-config:/run/garage-config:ro
    networks: [observatory-object-storage]
    depends_on:
      aura-garage: {condition: service_healthy}
      aura-garage-config: {condition: service_completed_successfully}
      aura-garage-bootstrap: {condition: service_completed_successfully}
    restart: "no"

  # Run evidence has its own bucket and identities. The worker may write only;
  # the API receives a separate read/write identity because Garage's write
  # permission is also the delete capability used by durable deletion.
  observatory-run-evidence-garage-bootstrap:
    profiles: [observatory]
    build:
      context: .
      dockerfile: deploy/docker/garage-bootstrap.Dockerfile
      args:
        GARAGE_IMAGE: ${AURA_GARAGE_IMAGE:-dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a}
        BUSYBOX_IMAGE: ${AURA_GARAGE_CONFIG_IMAGE:-busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        case "$${AURA_GARAGE_IMAGE}" in *@sha256:*) ;; *) echo 'AURA_GARAGE_IMAGE must use a sha256 digest' >&2; exit 64 ;; esac;
        access_key="$$(cat /run/secrets/observatory-run-evidence-worker-access-key)";
        secret_key="$$(cat /run/secrets/observatory-run-evidence-worker-secret-key)";
        if [ -z "$${AURA_GARAGE_BUCKET}" ] || [ -z "$${AURA_OBSERVATORY_GARAGE_BUCKET}" ] || [ -z "$${AURA_OBSERVATORY_RUN_EVIDENCE_OBJECT_BUCKET}" ] || [ "$${AURA_OBSERVATORY_RUN_EVIDENCE_OBJECT_BUCKET}" = "$${AURA_GARAGE_BUCKET}" ] || [ "$${AURA_OBSERVATORY_RUN_EVIDENCE_OBJECT_BUCKET}" = "$${AURA_OBSERVATORY_GARAGE_BUCKET}" ]; then echo 'run-evidence Garage bucket must be configured and distinct' >&2; exit 78; fi;
        until /garage --config /run/garage-config/garage.toml status >/dev/null 2>&1; do sleep 2; done;
        extract_authorized_buckets() { printf '%s\n' "$${1}" | awk -v expected="$${2}" '
          function emit_row(line, count, fields, alias) {
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", line);
            count = split(line, fields, /[[:space:]]+/);
            if (count < 2 || fields[2] !~ /^[[:xdigit:]]+$/ || length(fields[2]) != 16) {
              print "__AURA_GRANT_PARSE_ERROR__";
              return;
            }
            alias = "";
            if (count >= 3 && fields[3] != "-" && fields[3] != "—") alias = fields[3];
            else if (count >= 4 && fields[4] != "-" && fields[4] != "—") alias = fields[4];
            if (alias == expected && expected != "") print expected;
            else if (alias != "") print alias;
            else print fields[2];
          }
          /^[[:space:]]*==== BUCKETS FOR THIS KEY ====[[:space:]]*$/ { table = 1; next }
          table && /^[[:space:]]*Permissions[[:space:]]+ID[[:space:]]+Global aliases[[:space:]]+Local aliases[[:space:]]*$/ { next }
          table && /^[[:space:]]*$/ { table = 0; next }
          table && NF { emit_row($$0); next }
        '; };
        key_info="$$(/garage --config /run/garage-config/garage.toml key info "$${access_key}" 2>/dev/null || true)";
        if [ -z "$${key_info}" ]; then /garage --config /run/garage-config/garage.toml key import --yes "$${access_key}" "$${secret_key}" >/dev/null 2>&1 || { echo 'run-evidence worker Garage key import failed closed' >&2; exit 78; }; fi;
        key_info="$$(/garage --config /run/garage-config/garage.toml key info "$${access_key}" 2>/dev/null || true)";
        if [ -z "$${key_info}" ]; then echo 'run-evidence worker Garage key could not be inspected' >&2; exit 78; fi;
        existing_buckets="$$(extract_authorized_buckets "$${key_info}" "$${AURA_OBSERVATORY_RUN_EVIDENCE_OBJECT_BUCKET}")";
        if printf '%s\n' "$${existing_buckets}" | grep -Fqx -- '__AURA_GRANT_PARSE_ERROR__'; then echo 'run-evidence worker Garage grant table could not be parsed safely' >&2; exit 78; fi;
        unexpected_buckets="$$(printf '%s\n' "$${existing_buckets}" | grep -Fvx -- "$${AURA_OBSERVATORY_RUN_EVIDENCE_OBJECT_BUCKET}" || true)";
        if [ -n "$${unexpected_buckets}" ] || { [ -n "$${AURA_GARAGE_BUCKET}" ] && printf '%s\n' "$${existing_buckets}" | grep -Fqx -- "$${AURA_GARAGE_BUCKET}"; } || { [ -n "$${AURA_OBSERVATORY_GARAGE_BUCKET}" ] && printf '%s\n' "$${existing_buckets}" | grep -Fqx -- "$${AURA_OBSERVATORY_GARAGE_BUCKET}"; }; then echo 'run-evidence worker Garage key has an unexpected preexisting bucket grant' >&2; exit 78; fi;
        /garage --config /run/garage-config/garage.toml bucket info "$${AURA_OBSERVATORY_RUN_EVIDENCE_OBJECT_BUCKET}" >/dev/null 2>&1 || /garage --config /run/garage-config/garage.toml bucket create "$${AURA_OBSERVATORY_RUN_EVIDENCE_OBJECT_BUCKET}";
        /garage --config /run/garage-config/garage.toml bucket allow --write --key "$${access_key}" "$${AURA_OBSERVATORY_RUN_EVIDENCE_OBJECT_BUCKET}" >/dev/null 2>&1 || { echo 'run-evidence worker Garage write grant failed closed' >&2; exit 78; };
        /garage --config /run/garage-config/garage.toml bucket deny --read --key "$${access_key}" "$${AURA_OBSERVATORY_RUN_EVIDENCE_OBJECT_BUCKET}" >/dev/null 2>&1 || { echo 'run-evidence worker Garage read deny failed closed' >&2; exit 78; };
        /garage --config /run/garage-config/garage.toml bucket deny --owner --key "$${access_key}" "$${AURA_OBSERVATORY_RUN_EVIDENCE_OBJECT_BUCKET}" >/dev/null 2>&1 || { echo 'run-evidence worker Garage owner deny failed closed' >&2; exit 78; };
        permissions="$$(/garage --config /run/garage-config/garage.toml bucket info "$${AURA_OBSERVATORY_RUN_EVIDENCE_OBJECT_BUCKET}" 2>/dev/null | awk -v key="$${access_key}" 'index($$0, key) && NF {print $$1; exit}')";
        if [ "$${permissions}" != "W" ]; then echo 'run-evidence worker Garage permission verification failed closed (expected W)' >&2; exit 78; fi;
        key_info="$$(/garage --config /run/garage-config/garage.toml key info "$${access_key}" 2>/dev/null || true)";
        if [ -z "$${key_info}" ]; then echo 'run-evidence worker Garage key could not be verified after grant' >&2; exit 78; fi;
        existing_buckets="$$(extract_authorized_buckets "$${key_info}" "$${AURA_OBSERVATORY_RUN_EVIDENCE_OBJECT_BUCKET}")";
        if printf '%s\n' "$${existing_buckets}" | grep -Fqx -- '__AURA_GRANT_PARSE_ERROR__'; then echo 'run-evidence worker Garage grant table could not be parsed safely' >&2; exit 78; fi;
        unexpected_buckets="$$(printf '%s\n' "$${existing_buckets}" | grep -Fvx -- "$${AURA_OBSERVATORY_RUN_EVIDENCE_OBJECT_BUCKET}" || true)";
        target_bucket_count="$$(printf '%s\n' "$${existing_buckets}" | grep -Fxc -- "$${AURA_OBSERVATORY_RUN_EVIDENCE_OBJECT_BUCKET}" || true)";
        if [ -n "$${unexpected_buckets}" ] || [ "$${target_bucket_count}" -ne 1 ]; then echo 'run-evidence worker Garage key grant verification failed closed' >&2; exit 78; fi;
        unset access_key secret_key key_info existing_buckets unexpected_buckets target_bucket_count permissions
    environment:
