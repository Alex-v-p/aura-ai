name: aura

services:
  aura-web:
    build:
      context: .
      dockerfile: deploy/docker/aura-web.Dockerfile
      target: runtime
    init: true
    ports:
      - "127.0.0.1:${AURA_WEB_PORT:-4200}:8080"
    depends_on:
      aura-core-api:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /var/cache/nginx:rw,noexec,nosuid,nodev
      - /var/run:rw,noexec,nosuid,nodev
    healthcheck:
      test: [CMD-SHELL, "wget --quiet --output-document=- http://127.0.0.1:8080/healthz | grep -q '^ok$'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks: [aura-frontend, aura-edge]

  aura-core-api:
    build:
      context: .
      dockerfile: deploy/docker/aura-api.Dockerfile
      target: runtime
    init: true
    environment:
      AURA_ENVIRONMENT: production
      AURA_ROLE: api
      AURA_DATABASE_HOST: aura-core-postgres
      AURA_DATABASE_PORT: "5432"
      AURA_DATABASE_NAME: ${AURA_CORE_DATABASE_NAME:-aura}
      AURA_DATABASE_USER: ${AURA_CORE_DATABASE_USER:-aura}
      AURA_DATABASE_PASSWORD_FILE: /run/secrets/aura-core-database-password
      AURA_NATS_URL: nats://aura-nats:4222
      AURA_NATS_USER: aura
      AURA_NATS_PASSWORD_FILE: /run/secrets/aura-nats-password
      AURA_VALKEY_URL: redis://aura-valkey:6379/0
      AURA_VALKEY_PASSWORD_FILE: /run/secrets/aura-valkey-password
      AURA_OBJECT_STORAGE_ENDPOINT: http://aura-garage:3900
      AURA_OBJECT_STORAGE_REGION: ${AURA_GARAGE_REGION:-garage}
      AURA_OBJECT_STORAGE_BUCKET: ${AURA_GARAGE_BUCKET:-aura-documents}
      AURA_OBJECT_STORAGE_ACCESS_KEY_FILE: /run/secrets/aura-garage-access-key
      AURA_OBJECT_STORAGE_SECRET_KEY_FILE: /run/secrets/aura-garage-secret-key
      AURA_OLLAMA_URL: ${AURA_OLLAMA_URL:-http://host.docker.internal:11434}
      AURA_DEFAULT_MODEL: ${AURA_DEFAULT_MODEL:-}
      AURA_DOCUMENT_EMBEDDING_MODEL: ${AURA_DOCUMENT_EMBEDDING_MODEL:-qwen3-embedding:4b}
      AURA_DOCUMENT_EMBEDDING_DIMENSION: ${AURA_DOCUMENT_EMBEDDING_DIMENSION:-768}
      AURA_CONTEXT_TOKEN_BUDGET: ${AURA_CONTEXT_TOKEN_BUDGET:-8192}
      AURA_OLLAMA_RUN_TIMEOUT_SECONDS: ${AURA_OLLAMA_RUN_TIMEOUT_SECONDS:-300}
      AURA_OLLAMA_INVENTORY_TIMEOUT_SECONDS: ${AURA_OLLAMA_INVENTORY_TIMEOUT_SECONDS:-5}
      AURA_OLLAMA_VERIFICATION_TIMEOUT_SECONDS: ${AURA_OLLAMA_VERIFICATION_TIMEOUT_SECONDS:-60}
      AURA_OLLAMA_INVENTORY_CACHE_TTL_SECONDS: ${AURA_OLLAMA_INVENTORY_CACHE_TTL_SECONDS:-15}
      AURA_TELEMETRY_OTLP_ENABLED: ${AURA_TELEMETRY_OTLP_ENABLED:-false}
      AURA_TELEMETRY_OTLP_ENDPOINT: ${AURA_TELEMETRY_OTLP_ENDPOINT:-http://observatory-collector:4318/v1/observations}
      AURA_TELEMETRY_OTLP_QUEUE_CAPACITY: ${AURA_TELEMETRY_OTLP_QUEUE_CAPACITY:-32}
      AURA_TELEMETRY_OTLP_MAX_ATTEMPTS: ${AURA_TELEMETRY_OTLP_MAX_ATTEMPTS:-3}
      AURA_TELEMETRY_OTLP_TIMEOUT_SECONDS: ${AURA_TELEMETRY_OTLP_TIMEOUT_SECONDS:-2}
      AURA_TELEMETRY_DEPLOYMENT_ID: ${AURA_TELEMETRY_DEPLOYMENT_ID:-local}
      AURA_TELEMETRY_GIT_COMMIT: ${AURA_TELEMETRY_GIT_COMMIT:-0000000}
      AURA_TELEMETRY_HOST_ID: ${AURA_TELEMETRY_HOST_ID:-local}
      AURA_OIDC_ISSUER: ${AURA_OIDC_ISSUER:?AURA_OIDC_ISSUER must be a stable non-localhost HTTPS issuer}
      AURA_OIDC_AUDIENCE: ${AURA_OIDC_AUDIENCE:-aura-web}
      AURA_OIDC_CLIENT_ID: ${AURA_OIDC_CLIENT_ID:-aura-web}
      AURA_OIDC_CLIENT_SECRET_FILE: /run/secrets/aura-oidc-client-secret
      AURA_OIDC_REDIRECT_URI: ${AURA_OIDC_REDIRECT_URI:?AURA_OIDC_REDIRECT_URI must match the configured Aura public origin}
      AURA_OWNER_SUBJECT: ${AURA_OWNER_SUBJECT:?AURA_OWNER_SUBJECT must be configured for owner authorization}
      AURA_PUBLIC_ORIGIN: ${AURA_PUBLIC_ORIGIN:?AURA_PUBLIC_ORIGIN must be a stable HTTPS origin}
      AURA_SECURE_COOKIES: "true"
    secrets: [aura-core-database-password, aura-oidc-client-secret, aura-nats-password, aura-valkey-password, aura-garage-access-key, aura-garage-secret-key]
    # Only Core entrypoints need to contact configured external providers.
    # Keep all browser-facing and stateful service paths on internal networks.
    # Established Core attachments remain unchanged; observatory-ingest is an
    # additional optional Collector path for metadata-only export.
    # networks: [aura-frontend, aura-core-db, aura-core-bus, aura-core-cache, aura-object-storage, aura-core-egress]
    networks: [aura-frontend, aura-core-db, aura-core-bus, aura-core-cache, aura-object-storage, aura-core-egress, observatory-ingest]
    # Docker Desktop provides this name automatically; Linux Engine needs the
    # explicit gateway mapping for the local Ollama development default.
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      aura-core-migrate: {condition: service_completed_successfully}
      aura-core-postgres: {condition: service_healthy}
      aura-nats: {condition: service_started}
      aura-valkey: {condition: service_healthy}
      aura-garage-bootstrap: {condition: service_completed_successfully}
    expose: ["8000"]
    healthcheck:
      # The Core runtime image is Python slim and intentionally does not
      # include a shell HTTP client. Keep this aligned with its Dockerfile
      # healthcheck rather than adding a package solely for probing.
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  aura-core-worker:
    build:
      context: .
      dockerfile: deploy/docker/aura-worker.Dockerfile
      target: runtime
    init: true
    environment:
      AURA_ENVIRONMENT: production
      AURA_ROLE: worker
      AURA_DATABASE_HOST: aura-core-postgres
      AURA_DATABASE_PORT: "5432"
      AURA_DATABASE_NAME: ${AURA_CORE_DATABASE_NAME:-aura}
      AURA_DATABASE_USER: ${AURA_CORE_DATABASE_USER:-aura}
      AURA_DATABASE_PASSWORD_FILE: /run/secrets/aura-core-database-password
      AURA_NATS_URL: nats://aura-nats:4222
      AURA_NATS_USER: aura
      AURA_NATS_PASSWORD_FILE: /run/secrets/aura-nats-password
      AURA_VALKEY_URL: redis://aura-valkey:6379/0
      AURA_VALKEY_PASSWORD_FILE: /run/secrets/aura-valkey-password
      AURA_OBJECT_STORAGE_ENDPOINT: http://aura-garage:3900
      AURA_OBJECT_STORAGE_REGION: ${AURA_GARAGE_REGION:-garage}
      AURA_OBJECT_STORAGE_BUCKET: ${AURA_GARAGE_BUCKET:-aura-documents}
      AURA_OBJECT_STORAGE_ACCESS_KEY_FILE: /run/secrets/aura-garage-access-key
      AURA_OBJECT_STORAGE_SECRET_KEY_FILE: /run/secrets/aura-garage-secret-key
      AURA_DOCUMENT_PARSER_URL: http://aura-document-parser:8080
      AURA_OLLAMA_URL: ${AURA_OLLAMA_URL:-http://host.docker.internal:11434}
      AURA_DEFAULT_MODEL: ${AURA_DEFAULT_MODEL:-}
      AURA_DOCUMENT_EMBEDDING_MODEL: ${AURA_DOCUMENT_EMBEDDING_MODEL:-qwen3-embedding:4b}
      AURA_DOCUMENT_EMBEDDING_DIMENSION: ${AURA_DOCUMENT_EMBEDDING_DIMENSION:-768}
      AURA_CONTEXT_TOKEN_BUDGET: ${AURA_CONTEXT_TOKEN_BUDGET:-8192}
      AURA_OLLAMA_RUN_TIMEOUT_SECONDS: ${AURA_OLLAMA_RUN_TIMEOUT_SECONDS:-300}
      AURA_OLLAMA_INVENTORY_TIMEOUT_SECONDS: ${AURA_OLLAMA_INVENTORY_TIMEOUT_SECONDS:-5}
      AURA_OLLAMA_VERIFICATION_TIMEOUT_SECONDS: ${AURA_OLLAMA_VERIFICATION_TIMEOUT_SECONDS:-60}
      AURA_OLLAMA_INVENTORY_CACHE_TTL_SECONDS: ${AURA_OLLAMA_INVENTORY_CACHE_TTL_SECONDS:-15}
      AURA_TELEMETRY_OTLP_ENABLED: ${AURA_TELEMETRY_OTLP_ENABLED:-false}
      AURA_TELEMETRY_OTLP_ENDPOINT: ${AURA_TELEMETRY_OTLP_ENDPOINT:-http://observatory-collector:4318/v1/observations}
      AURA_TELEMETRY_OTLP_QUEUE_CAPACITY: ${AURA_TELEMETRY_OTLP_QUEUE_CAPACITY:-32}
      AURA_TELEMETRY_OTLP_MAX_ATTEMPTS: ${AURA_TELEMETRY_OTLP_MAX_ATTEMPTS:-3}
      AURA_TELEMETRY_OTLP_TIMEOUT_SECONDS: ${AURA_TELEMETRY_OTLP_TIMEOUT_SECONDS:-2}
      AURA_TELEMETRY_DEPLOYMENT_ID: ${AURA_TELEMETRY_DEPLOYMENT_ID:-local}
      AURA_TELEMETRY_GIT_COMMIT: ${AURA_TELEMETRY_GIT_COMMIT:-0000000}
      AURA_TELEMETRY_HOST_ID: ${AURA_TELEMETRY_HOST_ID:-local}
    secrets: [aura-core-database-password, aura-nats-password, aura-valkey-password, aura-garage-access-key, aura-garage-secret-key]
    # The worker invokes Ollama, but has no browser-facing network attachment.
    networks: [aura-core-db, aura-core-bus, aura-core-cache, aura-object-storage, aura-document-parser, aura-core-egress, observatory-ingest]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      aura-core-migrate: {condition: service_completed_successfully}
      aura-core-postgres: {condition: service_healthy}
      aura-nats: {condition: service_started}
      aura-valkey: {condition: service_healthy}
      aura-garage-bootstrap: {condition: service_completed_successfully}
      aura-document-parser: {condition: service_healthy}
    restart: unless-stopped

  aura-core-scheduler:
    build:
      context: .
      dockerfile: deploy/docker/aura-scheduler.Dockerfile
      target: runtime
    init: true
    environment:
      AURA_ENVIRONMENT: production
      AURA_ROLE: scheduler
      AURA_DATABASE_HOST: aura-core-postgres
      AURA_DATABASE_PORT: "5432"
      AURA_DATABASE_NAME: ${AURA_CORE_DATABASE_NAME:-aura}
      AURA_DATABASE_USER: ${AURA_CORE_DATABASE_USER:-aura}
      AURA_DATABASE_PASSWORD_FILE: /run/secrets/aura-core-database-password
      AURA_TELEMETRY_OTLP_ENABLED: ${AURA_TELEMETRY_OTLP_ENABLED:-false}
      AURA_TELEMETRY_OTLP_ENDPOINT: ${AURA_TELEMETRY_OTLP_ENDPOINT:-http://observatory-collector:4318/v1/observations}
      AURA_TELEMETRY_OTLP_QUEUE_CAPACITY: ${AURA_TELEMETRY_OTLP_QUEUE_CAPACITY:-32}
      AURA_TELEMETRY_OTLP_MAX_ATTEMPTS: ${AURA_TELEMETRY_OTLP_MAX_ATTEMPTS:-3}
      AURA_TELEMETRY_OTLP_TIMEOUT_SECONDS: ${AURA_TELEMETRY_OTLP_TIMEOUT_SECONDS:-2}
      AURA_TELEMETRY_DEPLOYMENT_ID: ${AURA_TELEMETRY_DEPLOYMENT_ID:-local}
      AURA_TELEMETRY_GIT_COMMIT: ${AURA_TELEMETRY_GIT_COMMIT:-0000000}
      AURA_TELEMETRY_HOST_ID: ${AURA_TELEMETRY_HOST_ID:-local}
    secrets: [aura-core-database-password]
    # The scheduler has no service dependency on Observatory, but may emit
    # bounded telemetry when the optional Collector is present.
    networks: [aura-core-db, observatory-ingest]
    depends_on:
      aura-core-migrate: {condition: service_completed_successfully}
      aura-core-postgres: {condition: service_healthy}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    restart: unless-stopped

  aura-core-migrate:
    build:
      context: .
      dockerfile: deploy/docker/aura-api.Dockerfile
      target: runtime
    init: true
    command: [/usr/local/bin/aura-core-migrate]
    environment:
      AURA_ROLE: migrate
      AURA_DATABASE_HOST: aura-core-postgres
      AURA_DATABASE_PORT: "5432"
      AURA_DATABASE_NAME: ${AURA_CORE_DATABASE_NAME:-aura}
      AURA_DATABASE_USER: ${AURA_CORE_DATABASE_USER:-aura}
      AURA_DATABASE_PASSWORD_FILE: /run/secrets/aura-core-database-password
      AURA_DEFAULT_MODEL: ${AURA_DEFAULT_MODEL:-}
    secrets: [aura-core-database-password]
    networks: [aura-core-db]
    # This is a short-lived CLI job, not the API process whose inherited image
    # healthcheck probes port 8000. Completion is its readiness signal.
    healthcheck:
      disable: true
    depends_on:
      aura-core-postgres: {condition: service_healthy}
    restart: "no"

  aura-core-postgres:
    # Core needs PostgreSQL 17 with the pgvector extension available for its
    # service-owned memory embeddings. Keep the image overrideable so
    # operators can pin a locally mirrored digest without changing topology.
    image: ${AURA_CORE_POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    environment:
      POSTGRES_DB: ${AURA_CORE_DATABASE_NAME:-aura}
      POSTGRES_USER: ${AURA_CORE_DATABASE_USER:-aura}
      POSTGRES_PASSWORD_FILE: /run/secrets/aura-core-database-password
    secrets: [aura-core-database-password]
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-core-postgres:/var/lib/postgresql/data
    networks: [aura-core-db]
    healthcheck:
      # The official image briefly starts a temporary PostgreSQL server while
      # initializing a new data directory.  pg_isready alone reports that
      # server as ready and can race the migration job; PID 1 is `postgres`
      # only after the entrypoint has switched to the final server.
      test: [CMD-SHELL, "test \"$$(tr -d '\\000' </proc/1/cmdline)\" = postgres && pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  aura-nats:
    image: ${AURA_NATS_IMAGE:-nats:2.10.22-alpine}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        export NATS_PASSWORD="$$(cat /run/secrets/aura-nats-password)";
        exec nats-server --jetstream --store_dir=/data --user "$${AURA_NATS_USER:-aura}" --pass "$$NATS_PASSWORD"
    secrets: [aura-nats-password]
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-nats:/data
    expose: ["4222", "8222"]
    networks: [aura-core-bus]
    restart: unless-stopped

  aura-valkey:
    image: ${AURA_VALKEY_IMAGE:-valkey/valkey:8.1-alpine}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        export VALKEY_PASSWORD="$$(cat /run/secrets/aura-valkey-password)";
        exec valkey-server --save "" --appendonly no --requirepass "$$VALKEY_PASSWORD"
    secrets: [aura-valkey-password]
    healthcheck:
      test: [CMD-SHELL, "valkey-cli -a \"$$(cat /run/secrets/aura-valkey-password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [aura-core-cache]
    restart: unless-stopped

  frontend-checks:
    profiles: [checks]
    build:
      context: .
      dockerfile: deploy/docker/aura-web.Dockerfile
      target: frontend-checks
    command: [sh, -c, "pnpm --dir frontend run lint && pnpm --dir frontend run test && pnpm --dir frontend run build:production && pnpm --dir frontend run pwa:inject && pnpm --dir frontend run build-storybook"]

  frontend-e2e:
    profiles: [checks]
    build:
      context: .
      dockerfile: deploy/docker/aura-web.Dockerfile
      target: frontend-e2e
    depends_on:
      aura-web: {condition: service_healthy}
    environment:
      BASE_URL: http://aura-web:8080
    # Browser checks exercise the published web origin, not Core or provider
    # internals. Compose otherwise places a profile-only service on its
    # implicit default network, where aura-web is deliberately unreachable.
    networks: [aura-frontend]
    command: [sh, -c, "pnpm --dir frontend exec playwright test --config=/workspace/playwright.compose.config.ts"]

  aura-document-parser:
    build:
      context: .
      dockerfile: deploy/docker/aura-worker.Dockerfile
      target: document-parser
    init: true
    # The runtime dependencies are installed in the uv-managed virtualenv;
    # invoke the parser with that interpreter rather than the base image Python.
    entrypoint: [/app/.venv/bin/python, /usr/local/bin/document-parser-service.py]
    expose: ["8080"]
    # The parser receives hostile document bytes. Keep it on a private,
    # single-purpose network with no database, broker, cache, object-store,
    # identity, provider, host, or general-egress attachment.
    networks: [aura-document-parser]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 64
    ulimits:
      nofile:
        soft: 128
        hard: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=1); raise SystemExit(0 if response.read() == b'ok' else 1)"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  aura-garage:
    # Garage is intentionally required to be digest-qualified. The digest is
    # an operator-reviewed deployment input because this repository does not
    # perform registry lookups during configuration validation.
    image: ${AURA_GARAGE_IMAGE:-dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a}
    entrypoint: [/garage]
    command: [--config, /run/garage-config/garage.toml, server]
    environment:
      AURA_GARAGE_IMAGE: ${AURA_GARAGE_IMAGE:-dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a}
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-garage:/var/lib/garage
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-garage-config:/run/garage-config:ro
    networks: [aura-object-storage]
    depends_on:
      aura-garage-config: {condition: service_completed_successfully}
    expose: ["3900"]
    healthcheck:
      test: [CMD, /garage, --config, /run/garage-config/garage.toml, status]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    restart: unless-stopped

  aura-garage-config:
    image: ${AURA_GARAGE_CONFIG_IMAGE:-busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        case "$${AURA_GARAGE_IMAGE}" in *@sha256:*) ;; *) echo 'AURA_GARAGE_IMAGE must use a sha256 digest' >&2; exit 64 ;; esac;
        rpc_secret="$$(cat /run/secrets/aura-garage-rpc-secret)";
        test -n "$${rpc_secret}";
        sed "s/__GARAGE_RPC_SECRET__/$${rpc_secret}/" /etc/garage/garage.toml.template > /run/garage-config/garage.toml;
        chmod 0600 /run/garage-config/garage.toml;
        unset rpc_secret
    environment:
      AURA_GARAGE_IMAGE: ${AURA_GARAGE_IMAGE:-dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a}
    secrets: [aura-garage-rpc-secret]
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-garage-config:/run/garage-config
      - ./deploy/docker/garage.toml:/etc/garage/garage.toml.template:ro
    network_mode: none
    restart: "no"

  aura-garage-bootstrap:
    build:
      context: .
      dockerfile: deploy/docker/garage-bootstrap.Dockerfile
      args:
        GARAGE_IMAGE: ${AURA_GARAGE_IMAGE:-dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a}
        BUSYBOX_IMAGE: ${AURA_GARAGE_CONFIG_IMAGE:-busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        case "$${AURA_GARAGE_IMAGE}" in *@sha256:*) ;; *) echo 'AURA_GARAGE_IMAGE must use a sha256 digest' >&2; exit 64 ;; esac;
        access_key="$$(cat /run/secrets/aura-garage-access-key)";
        secret_key="$$(cat /run/secrets/aura-garage-secret-key)";
        until /garage --config /run/garage-config/garage.toml status >/dev/null 2>&1; do sleep 2; done;
        node_id="$$(/garage --config /run/garage-config/garage.toml node id 2>/dev/null | cut -d@ -f1)";
        if [ -z "$${node_id}" ]; then echo 'Garage node identity unavailable' >&2; exit 1; fi;
        if ! /garage --config /run/garage-config/garage.toml layout show | grep -Fq "$${node_id}"; then /garage --config /run/garage-config/garage.toml layout assign "$${node_id}" -z dc1 -c 1GB; fi;
        if ! /garage --config /run/garage-config/garage.toml layout show | grep -Eq 'Current cluster layout version: [1-9][0-9]*'; then /garage --config /run/garage-config/garage.toml layout apply --version 1; fi;
        if ! /garage --config /run/garage-config/garage.toml key info "$${access_key}" >/dev/null 2>&1; then /garage --config /run/garage-config/garage.toml key import --yes "$${access_key}" "$${secret_key}"; fi;
        if ! /garage --config /run/garage-config/garage.toml bucket info "$${AURA_GARAGE_BUCKET}" >/dev/null 2>&1; then /garage --config /run/garage-config/garage.toml bucket create "$${AURA_GARAGE_BUCKET}"; fi;
        /garage --config /run/garage-config/garage.toml bucket allow --read --write --key "$${access_key}" "$${AURA_GARAGE_BUCKET}";
        unset access_key secret_key
    environment:
      AURA_GARAGE_IMAGE: ${AURA_GARAGE_IMAGE:-dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a}
      AURA_GARAGE_BUCKET: ${AURA_GARAGE_BUCKET:-aura-documents}
    secrets: [aura-garage-access-key, aura-garage-secret-key]
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-garage:/var/lib/garage:ro
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-garage-config:/run/garage-config:ro
    networks: [aura-object-storage]
    depends_on:
      aura-garage: {condition: service_healthy}
      aura-garage-config: {condition: service_completed_successfully}
    restart: "no"

  # Observatory is deliberately opt-in.  None of these services is present
  # in the normal Aura startup graph unless --profile observatory is selected.
  observatory-api:
    profiles: [observatory]
    build:
      context: .
      dockerfile: deploy/docker/aura-observatory.Dockerfile
      target: api
    init: true
    environment:
      AURA_OBSERVATORY_ENVIRONMENT: ${AURA_OBSERVATORY_ENVIRONMENT:-production}
      AURA_OBSERVATORY_ROLE: api
      AURA_OBSERVATORY_PUBLIC_ORIGIN: ${AURA_OBSERVATORY_PUBLIC_ORIGIN:-https://observatory.example.invalid}
      AURA_OBSERVATORY_OIDC_ISSUER: ${AURA_OBSERVATORY_OIDC_ISSUER:-https://identity.example.invalid/application/o/aura-observatory/}
      AURA_OBSERVATORY_OIDC_AUDIENCE: ${AURA_OBSERVATORY_OIDC_AUDIENCE:-aura-observatory}
      AURA_OBSERVATORY_OIDC_CLIENT_ID: ${AURA_OBSERVATORY_OIDC_CLIENT_ID:-aura-observatory}
      AURA_OBSERVATORY_OIDC_CLIENT_SECRET_FILE: /run/secrets/observatory-oidc-client-secret
      AURA_OBSERVATORY_OIDC_REDIRECT_URI: ${AURA_OBSERVATORY_OIDC_REDIRECT_URI:-https://observatory.example.invalid/api/v1/auth/callback}
      AURA_OBSERVATORY_OWNER_SUBJECT: ${AURA_OBSERVATORY_OWNER_SUBJECT:-}
      AURA_OBSERVATORY_SECURE_COOKIES: "${AURA_OBSERVATORY_SECURE_COOKIES:-true}"
      AURA_OBSERVATORY_DATABASE_HOST: observatory-postgres
      AURA_OBSERVATORY_DATABASE_PORT: "5432"
      AURA_OBSERVATORY_DATABASE_NAME: ${AURA_OBSERVATORY_DATABASE_NAME:-aura_observatory}
      AURA_OBSERVATORY_DATABASE_USER: ${AURA_OBSERVATORY_DATABASE_USER:-observatory}
      AURA_OBSERVATORY_DATABASE_PASSWORD_FILE: /run/secrets/observatory-database-password
      AURA_OBSERVATORY_CLICKHOUSE_URL: http://observatory-clickhouse:8123
      AURA_OBSERVATORY_CLICKHOUSE_DATABASE: ${AURA_OBSERVATORY_CLICKHOUSE_DATABASE:-aura_observatory}
      AURA_OBSERVATORY_CLICKHOUSE_USER: ${AURA_OBSERVATORY_CLICKHOUSE_USER:-observatory}
      AURA_OBSERVATORY_CLICKHOUSE_PASSWORD_FILE: /run/secrets/observatory-clickhouse-password
      AURA_OBSERVATORY_SESSION_STORE_URL: redis://observatory-session:6379/0
      AURA_OBSERVATORY_SESSION_STORE_PASSWORD_FILE: /run/secrets/observatory-session-password
      AURA_OBSERVATORY_INGEST_CREDENTIAL_FILE: /run/secrets/observatory-ingest-credential
    secrets: [observatory-database-password, observatory-oidc-client-secret, observatory-session-password, observatory-ingest-credential, observatory-clickhouse-password]
    networks: [observatory-api, observatory-db, observatory-session, observatory-ingest, observatory-identity-egress]
    depends_on:
      observatory-migrate: {condition: service_completed_successfully}
      observatory-postgres: {condition: service_healthy}
      observatory-clickhouse: {condition: service_healthy}
      observatory-session: {condition: service_healthy}
    expose: ["8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  observatory-worker:
    profiles: [observatory]
    build:
      context: .
      dockerfile: deploy/docker/aura-observatory.Dockerfile
      target: worker
    init: true
    environment:
      AURA_OBSERVATORY_ENVIRONMENT: ${AURA_OBSERVATORY_ENVIRONMENT:-production}
      AURA_OBSERVATORY_ROLE: worker
      AURA_OBSERVATORY_DATABASE_HOST: observatory-postgres
      AURA_OBSERVATORY_DATABASE_PORT: "5432"
      AURA_OBSERVATORY_DATABASE_NAME: ${AURA_OBSERVATORY_DATABASE_NAME:-aura_observatory}
      AURA_OBSERVATORY_DATABASE_USER: ${AURA_OBSERVATORY_DATABASE_USER:-observatory}
      AURA_OBSERVATORY_DATABASE_PASSWORD_FILE: /run/secrets/observatory-database-password
      AURA_OBSERVATORY_CLICKHOUSE_URL: http://observatory-clickhouse:8123
      AURA_OBSERVATORY_CLICKHOUSE_DATABASE: ${AURA_OBSERVATORY_CLICKHOUSE_DATABASE:-aura_observatory}
      AURA_OBSERVATORY_CLICKHOUSE_USER: ${AURA_OBSERVATORY_CLICKHOUSE_USER:-observatory}
      AURA_OBSERVATORY_CLICKHOUSE_PASSWORD_FILE: /run/secrets/observatory-clickhouse-password
      AURA_OBSERVATORY_INGEST_CREDENTIAL_FILE: /run/secrets/observatory-ingest-credential
    secrets: [observatory-database-password, observatory-ingest-credential, observatory-clickhouse-password]
    networks: [observatory-db, observatory-ingest]
    depends_on:
      observatory-migrate: {condition: service_completed_successfully}
      observatory-postgres: {condition: service_healthy}
      observatory-clickhouse: {condition: service_healthy}
    restart: unless-stopped

  observatory-migrate:
    profiles: [observatory]
    build:
      context: .
      dockerfile: deploy/docker/aura-observatory.Dockerfile
      target: migrate
    init: true
    environment:
      AURA_OBSERVATORY_ENVIRONMENT: ${AURA_OBSERVATORY_ENVIRONMENT:-production}
      AURA_OBSERVATORY_ROLE: migrate
      AURA_OBSERVATORY_DATABASE_HOST: observatory-postgres
      AURA_OBSERVATORY_DATABASE_PORT: "5432"
      AURA_OBSERVATORY_DATABASE_NAME: ${AURA_OBSERVATORY_DATABASE_NAME:-aura_observatory}
      AURA_OBSERVATORY_DATABASE_USER: ${AURA_OBSERVATORY_DATABASE_USER:-observatory}
      AURA_OBSERVATORY_DATABASE_PASSWORD_FILE: /run/secrets/observatory-database-password
      AURA_OBSERVATORY_CLICKHOUSE_URL: http://observatory-clickhouse:8123
      AURA_OBSERVATORY_CLICKHOUSE_DATABASE: ${AURA_OBSERVATORY_CLICKHOUSE_DATABASE:-aura_observatory}
      AURA_OBSERVATORY_CLICKHOUSE_USER: ${AURA_OBSERVATORY_CLICKHOUSE_USER:-observatory}
      AURA_OBSERVATORY_CLICKHOUSE_PASSWORD_FILE: /run/secrets/observatory-clickhouse-password
    secrets: [observatory-database-password, observatory-clickhouse-password]
    networks: [observatory-db]
    depends_on:
      observatory-postgres: {condition: service_healthy}
      observatory-clickhouse: {condition: service_healthy}
    restart: "no"

  observatory-postgres:
    profiles: [observatory]
    image: ${AURA_OBSERVATORY_POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${AURA_OBSERVATORY_DATABASE_NAME:-aura_observatory}
      POSTGRES_USER: ${AURA_OBSERVATORY_DATABASE_USER:-observatory}
      POSTGRES_PASSWORD_FILE: /run/secrets/observatory-database-password
    secrets: [observatory-database-password]
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-observatory-postgres:/var/lib/postgresql/data
    networks: [observatory-db]
    healthcheck:
      test: [CMD-SHELL, "test \"$$(tr -d '\000' </proc/1/cmdline)\" = postgres && pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  observatory-clickhouse:
    profiles: [observatory]
    image: ${AURA_OBSERVATORY_CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        export CLICKHOUSE_PASSWORD="$$(cat /run/secrets/observatory-clickhouse-password)";
        exec /entrypoint.sh
    environment:
      CLICKHOUSE_DB: ${AURA_OBSERVATORY_CLICKHOUSE_DATABASE:-aura_observatory}
      CLICKHOUSE_USER: ${AURA_OBSERVATORY_CLICKHOUSE_USER:-observatory}
    secrets: [observatory-clickhouse-password]
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-observatory-clickhouse:/var/lib/clickhouse
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-observatory-clickhouse-logs:/var/log/clickhouse-server
    networks: [observatory-db]
    expose: ["8123"]
    healthcheck:
      test: [CMD, wget, --quiet, --output-document=-, http://127.0.0.1:8123/ping]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  observatory-session:
    profiles: [observatory]
    image: ${AURA_OBSERVATORY_SESSION_IMAGE:-valkey/valkey:8.1-alpine}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        export VALKEY_PASSWORD="$$(cat /run/secrets/observatory-session-password)";
        exec valkey-server --save "" --appendonly no --requirepass "$${VALKEY_PASSWORD}"
    secrets: [observatory-session-password]
    volumes:
      - ${AURA_STATE_ROOT:?encrypted state root is required}/aura-observatory-session:/data
    networks: [observatory-session]
    healthcheck:
      test: [CMD-SHELL, "valkey-cli -a \"$$(cat /run/secrets/observatory-session-password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  observatory-collector:
    profiles: [observatory]
    image: ${AURA_OBSERVATORY_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.138.0}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        export OBSERVATORY_INGEST_CREDENTIAL="$$(cat /run/secrets/observatory-ingest-credential)";
        exec /otelcol-contrib --config=/etc/otelcol-contrib/config.yaml
    secrets: [observatory-ingest-credential]
    volumes:
      - ./deploy/compose/observatory-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [observatory-ingest]
    expose: ["4317", "4318"]
    depends_on:
      observatory-api: {condition: service_healthy}
    restart: unless-stopped

  observatory-web:
    profiles: [observatory]
    image: ${AURA_OBSERVATORY_WEB_IMAGE:-nginx:1.29-alpine}
    volumes:
      - ./deploy/docker/observatory-web.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${AURA_OBSERVATORY_PORT:-4300}:80"
    networks: [observatory-edge, observatory-api]
    depends_on:
      observatory-api: {condition: service_healthy}
    restart: unless-stopped

secrets:
  aura-core-database-password:
    file: ${AURA_CORE_DATABASE_PASSWORD_FILE:-./.secrets/aura-core-database-password}
  aura-oidc-client-secret:
    file: ${AURA_OIDC_CLIENT_SECRET_FILE:-./.secrets/aura-oidc-client-secret}
  aura-nats-password:
    file: ${AURA_NATS_PASSWORD_FILE:-./.secrets/aura-nats-password}
  aura-valkey-password:
    file: ${AURA_VALKEY_PASSWORD_FILE:-./.secrets/aura-valkey-password}
  aura-garage-rpc-secret:
    file: ${AURA_GARAGE_RPC_SECRET_FILE:-./.secrets/aura-garage-rpc-secret}
  aura-garage-access-key:
    file: ${AURA_GARAGE_ACCESS_KEY_FILE:-./.secrets/aura-garage-access-key}
  aura-garage-secret-key:
    file: ${AURA_GARAGE_SECRET_KEY_FILE:-./.secrets/aura-garage-secret-key}
  observatory-database-password:
    file: ${AURA_OBSERVATORY_DATABASE_PASSWORD_FILE:-./.secrets/observatory-database-password}
  observatory-oidc-client-secret:
    file: ${AURA_OBSERVATORY_OIDC_CLIENT_SECRET_FILE:-./.secrets/observatory-oidc-client-secret}
  observatory-session-password:
    file: ${AURA_OBSERVATORY_SESSION_PASSWORD_FILE:-./.secrets/observatory-session-password}
  observatory-ingest-credential:
    file: ${AURA_OBSERVATORY_INGEST_CREDENTIAL_FILE:-./.secrets/observatory-ingest-credential}
  observatory-clickhouse-password:
    file: ${AURA_OBSERVATORY_CLICKHOUSE_PASSWORD_FILE:-./.secrets/observatory-clickhouse-password}

networks:
  # Docker Desktop does not publish host ports for containers attached only to
  # an internal network. Keep the browser-to-Core path on aura-frontend and
  # give the browser-facing web process its own loopback-bound edge network.
  # No other normal-stack service joins this network.
  aura-edge: {}
  aura-frontend:
    internal: true
  aura-core-db:
    internal: true
  aura-core-bus:
    internal: true
  aura-core-cache:
    internal: true
  # The parser has no route to any other service or the host. Core worker is
  # the only normal-stack client on this network.
  aura-document-parser:
    internal: true
    # Keep this private network outside the common 192.168.0.0/24 home LAN.
    # Operators can override the value for hosts with a conflicting VPN or
    # Docker route; the network remains internal and parser-only regardless.
    ipam:
      config:
        - subnet: ${AURA_DOCUMENT_PARSER_SUBNET:-10.254.240.16/28}
  # Garage has no host/browser attachment. Only Core API/worker and its
  # one-shot bootstrap job join this private object-storage network.
  aura-object-storage:
    internal: true
    # Four normal-stack members currently use this network (API, worker,
    # Garage, and bootstrap). A /28 leaves room for future private clients
    # while preventing Docker from choosing a LAN-overlapping subnet.
    ipam:
      config:
        - subnet: ${AURA_OBJECT_STORAGE_SUBNET:-10.254.240.0/28}
  # Intentionally non-internal: API reaches the configured OIDC discovery/JWKS
  # endpoint and API/worker reach their configured Ollama provider. No service
  # on this network publishes a host port.
  aura-core-egress: {}
  observatory-edge: {}
  observatory-api:
    internal: true
  observatory-db:
    internal: true
  observatory-session:
    internal: true
  observatory-ingest:
    internal: true
  # Only the Observatory API and configured OIDC provider join this narrowly
  # scoped identity egress network.
  observatory-identity-egress: {}
