        if ! /garage --config /run/garage-config/garage.toml bucket deny --read --key "$${access_key}" "$${AURA_OBSERVATORY_GARAGE_BUCKET}" >/dev/null 2>&1; then echo 'Observatory API Garage read deny failed closed' >&2; exit 78; fi;
        if ! /garage --config /run/garage-config/garage.toml bucket deny --owner --key "$${access_key}" "$${AURA_OBSERVATORY_GARAGE_BUCKET}" >/dev/null 2>&1; then echo 'Observatory API Garage owner deny failed closed' >&2; exit 78; fi;
